<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Renk Seli · KSB Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#12141c;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const ID='renk-seli',FONT='Fredoka';
const C=document.getElementById('c'),X=C.getContext('2d');
let W=1,H=1,DPR=1,now=0,last=0;
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let AC=null,muted=!!store.get('ksb-'+ID+'-mute',false);
function audio(){try{if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(A)AC=new A()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
function snd(f,d,type,v,f2,dl){if(!AC||muted)return;try{const t=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
function toggleMute(){muted=!muted;store.set('ksb-'+ID+'-mute',muted);audio();snd(660,.08,'sine',.1)}
const F=(sz,w)=>(w||700)+' '+Math.max(1,Math.round(sz))+'px '+FONT+',"Segoe UI",system-ui,sans-serif';
function T(s,x,y,sz,col,w,al){X.font=F(sz,w);X.fillStyle=col;X.textAlign=al||'center';X.textBaseline='middle';X.fillText(s,x,y)}
function fitT(s,x,y,sz,maxW,col,w,al){X.font=F(sz,w);const m=X.measureText(s).width;if(m>maxW)sz*=maxW/m;T(s,x,y,sz,col,w,al);return sz}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}
const cl=(v,a,b)=>v<a?a:v>b?b:v,ease=t=>1-Math.pow(1-t,3),rnd=(a,b)=>a+Math.random()*(b-a);
let hits=[];
function hit(x,y,w,h,id){hits.push({x,y,w,h,id})}
function findHit(px,py){for(let i=hits.length-1;i>=0;i--){const b=hits[i];if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h)return b.id}return null}
function btn(x,y,w,h,label,id,bg,fg,sel){X.save();X.shadowColor='rgba(0,0,0,.35)';X.shadowBlur=12;X.shadowOffsetY=4;rr(x,y,w,h,h/2.4);X.fillStyle=bg;X.fill();X.restore();if(sel){rr(x,y,w,h,h/2.4);X.strokeStyle='#fff';X.lineWidth=2.5;X.stroke()}fitT(label,x+w/2,y+h/2+1,Math.min(h*.4,21),w-14,fg,600);hit(x,y,w,h,id)}
function speaker(col){const s=30,x=W-s-12,y=12;X.save();rr(x-5,y-5,s+10,s+10,12);X.fillStyle='rgba(0,0,0,.28)';X.fill();X.fillStyle=col;X.beginPath();X.moveTo(x+4,y+11);X.lineTo(x+10,y+11);X.lineTo(x+17,y+4);X.lineTo(x+17,y+26);X.lineTo(x+10,y+19);X.lineTo(x+4,y+19);X.closePath();X.fill();X.strokeStyle=col;X.lineWidth=2.4;X.lineCap='round';if(muted){X.beginPath();X.moveTo(x+21,y+10);X.lineTo(x+28,y+20);X.moveTo(x+28,y+10);X.lineTo(x+21,y+20);X.stroke()}else{X.beginPath();X.arc(x+18,y+15,5,-.9,.9);X.stroke();X.beginPath();X.arc(x+18,y+15,10,-.9,.9);X.stroke()}X.restore();hit(x-8,y-8,s+16,s+16,'mute')}
const parts=[];
function burst(x,y,n,cols,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=rnd(.3,1)*(sp||220);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,l:rnd(.4,1),s:rnd(2.5,5.5),c:cols[i%cols.length],r:0,vr:0,g:500})}}
function confetti(cols){for(let i=0;i<170;i++)parts.push({x:rnd(0,W),y:rnd(-H*.6,-10),vx:rnd(-60,60),vy:rnd(80,260),l:rnd(2.5,4.5),s:rnd(6,10),c:cols[i%cols.length],r:rnd(0,6),vr:rnd(-8,8),g:110,cf:1})}
function stepParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0||p.y>H+40){parts.splice(i,1);continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;if(!p.cf)p.vx*=.98}}
function drawParts(){for(const p of parts){X.save();X.globalAlpha=Math.min(1,p.l*2);X.translate(p.x,p.y);X.fillStyle=p.c;if(p.cf){X.rotate(p.r);X.scale(1,Math.cos(p.r*1.7));X.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}else{X.beginPath();X.arc(0,0,p.s,0,6.283);X.fill()}X.restore()}}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);C.width=Math.round(W*DPR);C.height=Math.round(H*DPR);X.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
try{document.fonts.load(F(40)).catch(()=>{})}catch(e){}

/* ---------- Renk Seli ---------- */
const PAL=['#ff5964','#ffd23f','#3bb3ff','#5ee27a','#b36bff','#ff9f43'];
const RGB=PAL.map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
const NAMES=['Kırmızı','Sarı','Mavi','Yeşil','Mor','Turuncu'];
const SIZES=[{n:10,lim:20,name:'Küçük'},{n:14,lim:27,name:'Orta'},{n:18,lim:35,name:'Büyük'}];
let state='title',sel=cl(+store.get('ksb-'+ID+'-size',1)||0,0,2),n=14,lim=25,b=null,prev=null,t0=null,moves=0,endAt=0,owned=1,lastPick=-1;
let best=store.get('ksb-'+ID+'-best',{});if(!best||typeof best!=='object')best={};
function newGame(si){sel=si;store.set('ksb-'+ID+'-size',si);n=SIZES[si].n;lim=SIZES[si].lim;
  b=new Uint8Array(n*n);prev=new Uint8Array(n*n);t0=new Float64Array(n*n);
  for(let i=0;i<n*n;i++){b[i]=Math.random()*6|0;prev[i]=b[i];t0[i]=now+.15+((i%n)+Math.floor(i/n))*.02}
  for(let i=0;i<n*n;i++)prev[i]=(b[i]+3)%6;
  moves=0;state='play';owned=region().length;lastPick=-1;snd(392,.1,'triangle',.08);snd(523,.12,'triangle',.08,0,.08)}
function region(){const c=b[0],seen=new Uint8Array(n*n),out=[0],q=[0];seen[0]=1;
  while(q.length){const i=q.pop(),r=Math.floor(i/n),x=i%n,nb=[];if(r>0)nb.push(i-n);if(r<n-1)nb.push(i+n);if(x>0)nb.push(i-1);if(x<n-1)nb.push(i+1);
    for(const j of nb)if(!seen[j]&&b[j]===c){seen[j]=1;out.push(j);q.push(j)}}return out}
function distMap(){const c=b[0],d=new Int32Array(n*n).fill(-1),q=[0];d[0]=0;let h=0;
  while(h<q.length){const i=q[h++],r=Math.floor(i/n),x=i%n,nb=[];if(r>0)nb.push(i-n);if(r<n-1)nb.push(i+n);if(x>0)nb.push(i-1);if(x<n-1)nb.push(i+1);
    for(const j of nb)if(d[j]<0&&b[j]===c){d[j]=d[i]+1;q.push(j)}}return d}
function pick(c){if(state!=='play'||c===b[0])return;
  const reg=region(),old=b[0];for(const i of reg)b[i]=c;moves++;lastPick=c;
  const d=distMap(),nr=region(),gained=nr.length-reg.length;owned=nr.length;
  for(const i of reg){prev[i]=old;t0[i]=now+d[i]*.018}
  for(const i of nr)if(b[i]===c&&reg.indexOf(i)<0){prev[i]=c;t0[i]=now+d[i]*.018}
  snd(300+c*55,.12,'triangle',.09,(300+c*55)*1.4);if(gained>0)snd(500+Math.min(gained,30)*20,.1,'sine',.06,0,.08);
  if(owned===n*n)win();else if(moves>=lim){state='lost';endAt=now;[330,262,196].forEach((f,i)=>snd(f,.3,'sine',.1,0,.2+i*.14))}}
function win(){state='won';endAt=now;const k=String(n);if(!best[k]||moves<best[k]){best[k]=moves;store.set('ksb-'+ID+'-best',best)}
  setTimeout(()=>{confetti(PAL.concat(['#fff']));[523,659,784,1047,1319].forEach((f,i)=>snd(f,.22,'triangle',.11,0,i*.09))},500)}
/* layout */
let L={};
function layout(){const hh=104,fh=160,bs=Math.max(140,Math.min(W-24,H-hh-fh-12,600));L={bs,bx:(W-bs)/2,by:hh+(H-hh-fh-bs)/2,hh,fh}}
/* input */
function pos(e){const b0=C.getBoundingClientRect();return[e.clientX-b0.left,e.clientY-b0.top]}
function act(id){if(id==='mute')toggleMute();else if(id==='menu')state='title';else if(id==='new')newGame(sel);
  else if(id[0]==='S')newGame(parseInt(id.slice(1),10)||0);else if(id[0]==='P')pick(parseInt(id.slice(1),10)||0)}
function proceed(){if(state==='title')newGame(sel);else if((state==='won'||state==='lost')&&now-endAt>.9)newGame(sel)}
C.addEventListener('pointerdown',e=>{e.preventDefault();audio();const[x,y]=pos(e);const h=findHit(x,y);if(h){act(h);return}
  if(state!=='play'){proceed();return}
  const cs=L.bs/n,c=Math.floor((x-L.bx)/cs),r=Math.floor((y-L.by)/cs);if(c>=0&&c<n&&r>=0&&r<n)pick(b[r*n+c])});
C.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{const k=e.key,l=k.toLowerCase();if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();audio();
  if(l==='m'){toggleMute();return}if(k==='Escape'){state='title';return}
  if(state==='play'){if(k>='1'&&k<='6')pick(+k-1);else if(l==='r'||l==='n')newGame(sel);return}
  if(state==='title'){if(k==='ArrowLeft')sel=(sel+2)%3;else if(k==='ArrowRight')sel=(sel+1)%3;else if(k>='1'&&k<='3'){newGame(+k-1);return}}
  if(k==='Enter'||k===' ')proceed();else if(l==='r'||l==='n')newGame(sel)});
function update(dt){stepParts(dt)}
/* draw */
function bg(){const g=X.createLinearGradient(0,0,W*.3,H);g.addColorStop(0,'#1c2030');g.addColorStop(1,'#0b0c12');X.fillStyle=g;X.fillRect(0,0,W,H)}
function mix(a,c,k){const A=RGB[a],B=RGB[c];return'rgb('+Math.round(A[0]+(B[0]-A[0])*k)+','+Math.round(A[1]+(B[1]-A[1])*k)+','+Math.round(A[2]+(B[2]-A[2])*k)+')'}
function drawBoard(){const{bs,bx,by}=L,cs=bs/n,g=Math.max(.5,cs*.06);
  X.save();X.shadowColor='rgba(0,0,0,.55)';X.shadowBlur=30;X.shadowOffsetY=10;rr(bx-8,by-8,bs+16,bs+16,18);X.fillStyle='#232838';X.fill();X.restore();
  const reg=new Uint8Array(n*n);for(const i of region())reg[i]=1;
  for(let i=0;i<n*n;i++){const k=cl((now-t0[i])/.22,0,1),x=bx+(i%n)*cs,y=by+Math.floor(i/n)*cs,pop=k>0&&k<1?1-.25*Math.sin(k*Math.PI):1,s=cs-2*g;
    rr(x+cs/2-s*pop/2,y+cs/2-s*pop/2,s*pop,s*pop,cs*.22);X.fillStyle=k>=1?PAL[b[i]]:mix(prev[i],b[i],ease(k));X.fill();
    if(!reg[i]){rr(x+g+s*.12,y+g+s*.1,s*.76,s*.24,cs*.12);X.fillStyle='rgba(255,255,255,.18)';X.fill()}}
  // glow around start corner
  const p=(Math.sin(now*4)+1)/2;X.save();X.strokeStyle='rgba(255,255,255,'+(.35+.4*p)+')';X.lineWidth=2.5;rr(bx-3,by-3,cs+6,cs+6,cs*.3);X.stroke();X.restore()}
function drawGame(){layout();const{bs,bx,by}=L,u=Math.min(W/22,22);
  fitT('Renk Seli',W/2,32,u*1.25,W-120,'#ffffff',700);
  const pct=Math.round(owned/(n*n)*100),bb=best[String(n)],items=[['Hamle',moves+' / '+lim],['Dolu','%'+pct],['En iyi',bb?String(bb):'-']],pw=Math.min(124,(W-40)/3);
  items.forEach((it,i)=>{const x=W/2+(i-1)*(pw+8)-pw/2,y=54;rr(x,y,pw,40,14);X.fillStyle='rgba(255,255,255,.07)';X.fill();T(it[0],x+12,y+20,12,'rgba(255,255,255,.6)',600,'left');fitT(it[1],x+pw-12,y+21,18,pw-60,(i===0&&lim-moves<=3)?'#ff5964':'#fff',700,'right')});
  // moves bar
  rr(bx,by-14,bs,5,3);X.fillStyle='rgba(255,255,255,.08)';X.fill();rr(bx,by-14,bs*Math.min(1,moves/lim),5,3);X.fillStyle=lim-moves<=3?'#ff5964':'#3bb3ff';X.fill();
  drawBoard();
  // palette buttons
  const py=by+bs+22,pr=Math.min(30,(Math.min(W,bs+40)-24)/12-4),gap=(Math.min(W-24,bs+20)-12*pr)/5;
  const x0=W/2-(6*2*pr+5*gap)/2+pr;
  for(let c=0;c<6;c++){const x=x0+c*(2*pr+gap),y=py+pr,cur=c===b[0],hov=c===lastPick&&now-t0[0]<.3;
    X.save();X.globalAlpha=cur?.35:1;X.shadowColor=PAL[c];X.shadowBlur=cur?0:16;X.beginPath();X.arc(x,y,pr*(hov?1.08:1),0,6.283);X.fillStyle=PAL[c];X.fill();X.shadowColor='transparent';
    X.beginPath();X.arc(x-pr*.3,y-pr*.3,pr*.28,0,6.283);X.fillStyle='rgba(255,255,255,.35)';X.fill();X.restore();
    if(!cur)T(String(c+1),x,y+1,pr*.62,'rgba(0,0,0,.35)',700);if(!cur)hit(x-pr-gap/2,y-pr-6,2*pr+gap,2*pr+24,'P'+c)}
  const fw=Math.min(W-24,bs),fx=(W-fw)/2,fy=H-58,b2=(fw-10)/2;
  btn(fx,fy,b2,46,'Menü','menu','rgba(255,255,255,.12)','#fff');btn(fx+b2+10,fy,b2,46,'Yeni Oyun','new','#3bb3ff','#0b1a2a');
  if((state==='won'||state==='lost')&&now-endAt>.4){const k=ease(cl((now-endAt-.4)/.45,0,1));X.save();X.globalAlpha=k;X.fillStyle='rgba(8,9,14,.72)';X.fillRect(0,0,W,H);
    const pw2=Math.min(W-32,420),ph=280,px=(W-pw2)/2,pyy=H/2-ph/2+(1-k)*30;
    X.shadowColor='rgba(0,0,0,.5)';X.shadowBlur=30;rr(px,pyy,pw2,ph,26);X.fillStyle='#232838';X.fill();X.shadowColor='transparent';
    const wn=state==='won';
    fitT(wn?'Tebrikler!':'Hamleler bitti!',W/2,pyy+52,44,pw2-30,wn?PAL[b[0]]:'#ff5964',700);
    T(wn?moves+' hamlede doldurdun':'Tahtanın %'+pct+' kadarı doldu',W/2,pyy+106,20,'#fff',600);
    T('En iyi: '+(best[String(n)]?best[String(n)]+' hamle':'-')+' · '+SIZES[sel].name,W/2,pyy+136,15,'rgba(255,255,255,.6)',500);
    X.globalAlpha=k*(.55+.45*Math.sin(now*3.5));fitT('Tekrar oynamak için dokun / tıkla',W/2,pyy+174,17,pw2-30,'#fff',700);X.restore();
    if(k>.9){const bw=(pw2-56)/2;btn(px+20,pyy+ph-70,bw,50,'Yeni Oyun','new','#3bb3ff','#0b1a2a');btn(px+36+bw,pyy+ph-70,bw,50,'Menü','menu','rgba(255,255,255,.14)','#fff')}}
}
function drawTitle(){
  const s=Math.max(W,H)/16,cols=Math.ceil(W/s)+1,rows=Math.ceil(H/s)+1,t=now*.6;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const v=Math.sin(c*.35+t)+Math.cos(r*.3-t*.8)+Math.sin((c+r)*.18+t*.5),ci=((Math.floor((v+3)*1.1)%6)+6)%6;
    rr(c*s+2,r*s+2,s-4,s-4,s*.22);X.fillStyle=PAL[ci];X.globalAlpha=.55;X.fill()}
  X.globalAlpha=1;
  const vg=X.createRadialGradient(W/2,H*.42,0,W/2,H*.42,Math.max(W,H)*.65);vg.addColorStop(0,'rgba(11,12,18,.55)');vg.addColorStop(1,'rgba(11,12,18,.9)');X.fillStyle=vg;X.fillRect(0,0,W,H);
  const u=Math.min(W/16,H/30,38),ty=H*.3,word='Renk Seli';
  X.font=F(u*2.6,700);let tw=X.measureText(word).width,sz=u*2.6;if(tw>W-32){sz*=(W-32)/tw;X.font=F(sz,700);tw=X.measureText(word).width}
  let x=W/2-tw/2;X.save();X.shadowColor='rgba(0,0,0,.6)';X.shadowBlur=20;
  for(let i=0;i<word.length;i++){const ch=word[i],w=X.measureText(ch).width;T(ch,x+w/2,ty+Math.sin(now*3-i*.5)*u*.15,sz,PAL[i%6],700);X.font=F(sz,700);x+=w}X.restore();
  fitT('Sol üst köşeden başla, tüm tahtayı tek renge boya!',W/2,ty+u*1.6,u*.72,W-40,'rgba(255,255,255,.85)',500);
  const bw=Math.min(150,(W-48)/3),bh=Math.min(64,u*2),x0=W/2-(3*bw+16)/2,by=H*.48;
  SIZES.forEach((z,i)=>{btn(x0+i*(bw+8),by,bw,bh,z.name,'S'+i,i===sel?'#3bb3ff':'rgba(255,255,255,.12)',i===sel?'#0b1a2a':'#fff',i===sel);
    fitT(z.n+'×'+z.n+' · '+z.lim+' hamle',x0+i*(bw+8)+bw/2,by+bh+15,12,bw,'rgba(255,255,255,.65)',500);
    const bb=best[String(z.n)];if(bb)fitT('En iyi: '+bb,x0+i*(bw+8)+bw/2,by+bh+32,12,bw,'#ffd23f',700)});
  X.save();X.globalAlpha=.55+.45*Math.sin(now*3.5);fitT('Başlamak için dokun / tıkla',W/2,H*.78,u*1.0,W-40,'#fff',700);X.restore();
  fitT('Renge dokun ya da 1–6 tuşlarını kullan',W/2,H*.78+u*1.5,u*.58,W-40,'rgba(255,255,255,.55)',500);
  T('KSB Games',W/2,H-22,13,'rgba(255,255,255,.35)',600);
}
function draw(){bg();if(state==='title')drawTitle();else drawGame();drawParts();speaker('#ffffff')}
function frame(t){t/=1000;const dt=Math.min(.05,Math.max(0,t-last));last=t;now=t;if(!document.hidden)update(dt);hits=[];draw();requestAnimationFrame(frame)}
requestAnimationFrame(t=>{last=now=t/1000;frame(t)});
</script>
</body>
</html>
