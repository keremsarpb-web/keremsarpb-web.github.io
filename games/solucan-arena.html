<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Trafik Yarışı – KSB Games</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100vw;height:100vh;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
'use strict';
const cv=document.getElementById('c'),g=cv.getContext('2d');let W=0,H=0,DPR=1,u=1;
function rs(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;u=Math.max(.6,Math.min(W/520,H/760));cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
addEventListener('resize',rs);rs();
const ID='solucan-arena',R=Math.random,TAU=Math.PI*2;let best=0,muted=false,AC=null,score=0,st='title',T=0,paused=false,overAt=0,last=0,shake=0,EX=[];const P={x:0,y:0,down:false},K={},PT=[];
try{best=+localStorage.getItem('ksb-'+ID+'-best')||0}catch(e){}
function initA(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function snd(f,d,ty,v,f2){if(muted||!AC)return;try{const o=AC.createOscillator(),a=AC.createGain(),t=AC.currentTime;o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);a.gain.setValueAtTime(v||.06,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a);a.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function tx(s,x,y,sz,c,a,w){g.font=(w||'bold')+' '+sz+'px "Trebuchet MS",Arial,sans-serif';g.fillStyle=c;g.textAlign=a||'center';g.textBaseline='middle';g.fillText(s,x,y)}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function shk(){if(shake>0)g.translate((R()-.5)*shake*28,(R()-.5)*shake*28)}
function burst(x,y,n,c,sp,life,sz){for(let i=0;i<n;i++){const a=R()*TAU,s=sp*(.3+R()*.7);PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life,m:life,c,s:sz||3})}}
function updPT(dt){for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.l-=dt;if(p.l<=0){PT.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-1.5*dt;p.vy*=1-1.5*dt}}
function drawPT(){for(const p of PT){g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;g.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}g.globalAlpha=1}
function hudScore(){tx(Math.floor(score),16,28,Math.round(28*Math.max(.85,Math.min(1.1,u))),'#fff','left');tx('En iyi '+best,16,54,13,'rgba(255,255,255,.65)','left')}
function drawIcon(){g.save();g.globalAlpha=.85;g.fillStyle='#fff';g.strokeStyle='#fff';g.lineWidth=2;const x=W-30,y=24;g.beginPath();g.moveTo(x-8,y-4);g.lineTo(x-3,y-4);g.lineTo(x+2,y-9);g.lineTo(x+2,y+9);g.lineTo(x-3,y+4);g.lineTo(x-8,y+4);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(x+6,y-5);g.lineTo(x+14,y+5);g.moveTo(x+14,y-5);g.lineTo(x+6,y+5)}else g.arc(x+3,y,6,-1,1);g.stroke();g.restore()}
function start(){reset();st='play';snd(440,.15,'square',.06,880)}
function gameOver(){if(st!=='play')return;st='over';overAt=T;score=Math.floor(score);if(score>best){best=score;try{localStorage.setItem('ksb-'+ID+'-best',best)}catch(e){}}shake=.5;snd(220,.5,'sawtooth',.1,40)}
function overlay(){g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,0,W,H);const pu=.65+.35*Math.sin(T*4);
if(st==='title'){const sz=Math.min(W*.92/(TITLE.length*.62),H*.13,110);g.save();g.shadowColor=COL;g.shadowBlur=30;tx(TITLE,W/2,H*.3,sz,'#fff');g.restore();tx(SUB,W/2,H*.3+sz*.85,Math.min(W*.05,H*.04,26),COL);g.globalAlpha=pu;tx('Başlamak için dokun / tıkla',W/2,H*.68,Math.min(W*.058,H*.05,30),'#fff');g.globalAlpha=1;tx(HINT,W/2,H*.68+Math.min(W*.1,H*.06,46),Math.min(W*.04,H*.03,18),'#d5dcec');if(best)tx('En iyi: '+best,W/2,H*.9,Math.min(W*.05,H*.04,22),COL)}
else{const s1=Math.min(W*.13,H*.09,64);g.save();g.shadowColor=COL;g.shadowBlur=24;tx(OVER||'Oyun Bitti',W/2,H*.28,s1,'#fff');g.restore();const s2=Math.min(W*.07,H*.05,34);tx('Skor: '+score,W/2,H*.4,s2,COL);tx('En iyi: '+best,W/2,H*.4+s2*1.3,s2*.75,'#fff');EX.forEach((l,i)=>tx(l,W/2,H*.4+s2*2.6+i*s2*.9,s2*.6,'#d5dcec'));g.globalAlpha=pu;tx('Tekrar için dokun / tıkla',W/2,H*.75,Math.min(W*.058,H*.05,30),'#fff');g.globalAlpha=1}}
function ptr(e){const r=cv.getBoundingClientRect();P.x=e.clientX-r.left;P.y=e.clientY-r.top}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ptr(e);initA();if(P.x>W-50&&P.y<50){muted=!muted;return}P.down=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}if(st==='title')start();else if(st==='over'){if(T-overAt>.6)start()}else gDown()});
cv.addEventListener('pointermove',e=>{ptr(e);if(st==='play')gMove()});
const pu_=e=>{ptr(e);P.down=false;if(st==='play')gUp()};addEventListener('pointerup',pu_);addEventListener('pointercancel',pu_);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k.startsWith('arrow')||k===' ')e.preventDefault();if(k==='m'){muted=!muted;return}initA();K[k]=1;if(e.repeat)return;if(st==='title'){if(k===' '||k==='enter')start()}else if(st==='over'){if((k===' '||k==='enter')&&T-overAt>.6)start()}else gKey(k)});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=0});
document.addEventListener('visibilitychange',()=>{paused=document.hidden;last=0});
function loop(t){requestAnimationFrame(loop);if(!last)last=t;const dt=Math.min(.05,(t-last)/1000);last=t;if(paused)return;T+=dt;g.setTransform(DPR,0,0,DPR,0,0);upd(dt);shake=Math.max(0,shake-dt);draw();if(st!=='play')overlay();drawIcon()}
/* ---- oyun ---- */
const TITLE='Solucan Arena',SUB='8 yapay zekâya karşı büyü',COL='#7dff5a',HINT='Parmak / fare: yönlendir  ·  Basılı tut / HIZ düğmesi: hızlan';let OVER='';
const AR=1500,NAMES=['Pamuk','Karabaş','Zeytin','Bulut','Çilek','Tarçın','Fıstık','Kiraz'],NP=260;
let wm,pel,me,aim,bId,mDown,kills,cam,rankN,bxy;
function mk(i,x,y,len,h,name){const a=R()*TAU,w={x,y,a,len,h,name,seg:[],boost:0,dead:0,rt:0,tm:0,ta:a,fd:0,ai:i>=0};const r=rad(w),sp=r*.65;for(let k=0;k<Math.round(len);k++)w.seg.push({x:x-Math.cos(a)*k*sp,y:y-Math.sin(a)*k*sp});return w}
const rad=w=>Math.min(17,7+w.len*.05);
function rpos(){const a=R()*TAU,d=Math.sqrt(R())*(AR-150);return[Math.cos(a)*d,Math.sin(a)*d]}
function reset(){wm=[];pel=[];kills=0;score=0;PT.length=0;EX=[];me=mk(-1,0,0,14,110,'Sen');wm.push(me);for(let i=0;i<8;i++){const p=rpos();wm.push(mk(i,p[0],p[1],12+R()*30,(i*45+20)%360,NAMES[i]))}
for(let i=0;i<NP;i++){const p=rpos();pel.push({x:p[0],y:p[1],v:1,h:R()*360})}
aim=P.down?{x:P.x-W/2,y:P.y-H/2}:{x:0,y:0};bId=null;mDown=false;cam={x:0,y:0};rankN=1;bxy=null}
function gDown(){}function gMove(){}function gUp(){}function gKey(){}
function bpos(){const r=44*u+8;return{x:W-r-16,y:H-r-16,r}}
cv.addEventListener('pointerdown',e=>{const b=bpos(),x=e.clientX,y=e.clientY;if(Math.hypot(x-b.x,y-b.y)<b.r+8){bId=e.pointerId;return}if(e.pointerType==='mouse')mDown=true;aim={x:x-W/2,y:y-H/2}});
cv.addEventListener('pointermove',e=>{if(e.pointerId===bId)return;if(e.pointerType==='mouse'||e.buttons||P.down)aim={x:e.clientX-W/2,y:e.clientY-H/2}});
const rel=e=>{if(e.pointerId===bId)bId=null;if(e.pointerType==='mouse')mDown=false};addEventListener('pointerup',rel);addEventListener('pointercancel',rel);
function drop(w){const sp=rad(w)*.65*2;for(let i=0;i<w.seg.length;i+=2)if(pel.length<700)pel.push({x:w.seg[i].x+(R()-.5)*8,y:w.seg[i].y+(R()-.5)*8,v:2+(w.len>40?1:0),h:w.h})}
function kill(w,by){w.dead=1;w.rt=3;drop(w);burst(w.x,w.y,30,'hsl('+w.h+',90%,60%)',260,.8,5);snd(w.ai?220:120,.3,'sawtooth',.07,50);if(by===me&&w.ai){kills++;score+=50}}
function steer(w,dt){const r=rad(w);
 if(w.ai){w.tm-=dt;if(w.tm<=0){w.tm=.25+R()*.3;let best=1e9,t=null;for(const p of pel){const d=(p.x-w.x)**2+(p.y-w.y)**2;if(d<best&&d<260*260){best=d;t=p}}w.ta=t?Math.atan2(t.y-w.y,t.x-w.x):w.ta+(R()-.5)*1.6;
  for(const o of wm){if(o===w||o.dead)continue;for(let k=0;k<o.seg.length;k+=2){const s=o.seg[k],d=Math.hypot(s.x-w.x-Math.cos(w.a)*70,s.y-w.y-Math.sin(w.a)*70);if(d<rad(o)+r+30){w.ta=w.a+(Math.sin(w.a-Math.atan2(s.y-w.y,s.x-w.x))>0?-1.4:1.4);w.tm=.15;k=1e9;break}}}
  if(Math.hypot(w.x,w.y)>AR-220)w.ta=Math.atan2(-w.y,-w.x)}
  w.boost=0;let df=((w.ta-w.a+Math.PI*3)%TAU)-Math.PI;w.a+=Math.max(-3.4*dt,Math.min(3.4*dt,df))}
 else if(st==='play'){let tgt=null;const kx=((K.arrowright||K.d)?1:0)-((K.arrowleft||K.a)?1:0),ky=((K.arrowdown||K.s)?1:0)-((K.arrowup||K.w)?1:0);
  if(kx||ky)tgt=Math.atan2(ky,kx);else if(Math.hypot(aim.x,aim.y)>14)tgt=Math.atan2(aim.y,aim.x);
  if(tgt!==null){const df=((tgt-w.a+Math.PI*3)%TAU)-Math.PI;w.a+=Math.max(-3.8*dt,Math.min(3.8*dt,df))}
  w.boost=(bId!==null||mDown||K[' ']||K.shift)&&w.len>10.5?1:0}
 else{w.a+=.7*dt;w.boost=0}
 const sp=(w.boost?250:140);w.x+=Math.cos(w.a)*sp*dt;w.y+=Math.sin(w.a)*sp*dt;
 if(w.boost){w.fd+=dt;if(w.fd>.22){w.fd=0;w.len=Math.max(10,w.len-.5);if(pel.length<700)pel.push({x:w.seg[w.seg.length-1].x,y:w.seg[w.seg.length-1].y,v:1,h:w.h})}}
 const n=Math.round(w.len),spc=r*.65;while(w.seg.length<n)w.seg.push({x:w.seg[w.seg.length-1].x,y:w.seg[w.seg.length-1].y});if(w.seg.length>n)w.seg.length=n;
 let px=w.x,py=w.y;for(const s of w.seg){const dx=px-s.x,dy=py-s.y,d=Math.hypot(dx,dy);if(d>spc){s.x+=dx/d*(d-spc);s.y+=dy/d*(d-spc)}px=s.x;py=s.y}}
function upd(dt){updPT(dt);const play=st==='play';
for(const w of wm){if(w.dead){if(w.ai){w.rt-=dt;if(w.rt<=0){const p=rpos();Object.assign(w,mk(1,p[0],p[1],12,w.h,w.name))}}continue}steer(w,dt);
 const r=rad(w);for(let i=pel.length-1;i>=0;i--){const p=pel[i],d2=(p.x-w.x)**2+(p.y-w.y)**2;if(d2<(r+22)**2){if(d2<(r+8)**2){w.len+=p.v*.25;if(w===me&&play){score+=p.v*2;if(R()<.3)snd(700+R()*300,.04,'sine',.03)}pel.splice(i,1)}else{p.x+=(w.x-p.x)*.2;p.y+=(w.y-p.y)*.2}}}
 if(Math.hypot(w.x,w.y)>AR&&(w.ai||play)){kill(w,null);if(w===me){OVER='Duvara çarptın!';fin()}continue}
 if(w.ai||play)for(const o of wm){if(o===w||o.dead)continue;const ro=rad(o);for(let k=2;k<o.seg.length;k++){const s=o.seg[k];if((s.x-w.x)**2+(s.y-w.y)**2<(ro+r*.8)**2){kill(w,o);if(w===me){OVER=o.name+' seni yakaladı!';fin()}k=1e9}}if(w.dead)break}}
while(pel.length<NP){const p=rpos();pel.push({x:p[0],y:p[1],v:1,h:R()*360})}
if(me.dead&&!me.shown){me.shown=1}
cam.x+=(me.x-cam.x)*Math.min(1,dt*8);cam.y+=(me.y-cam.y)*Math.min(1,dt*8);
rankN=1+wm.filter(w=>!w.dead&&w!==me&&w.len>me.len).length}
function fin(){EX=['Uzunluk: '+Math.floor(me.len),'Öldürülen: '+kills];shake=.5;gameOver()}
function drawW(w){const r=rad(w),n=w.seg.length;for(let i=n-1;i>=0;i--){const s=w.seg[i],rr_=r*(.55+.45*(1-i/n)),l=48+(i%6<3?8:0);g.fillStyle='hsl('+w.h+',75%,'+l+'%)';g.beginPath();g.arc(s.x,s.y,rr_,0,TAU);g.fill()}
g.fillStyle='hsl('+w.h+',85%,60%)';g.beginPath();g.arc(w.x,w.y,r*1.05,0,TAU);g.fill();for(const sd of[-1,1]){const ex=w.x+Math.cos(w.a)*r*.45-Math.sin(w.a)*sd*r*.5,ey=w.y+Math.sin(w.a)*r*.45+Math.cos(w.a)*sd*r*.5;g.fillStyle='#fff';g.beginPath();g.arc(ex,ey,r*.32,0,TAU);g.fill();g.fillStyle='#111';g.beginPath();g.arc(ex+Math.cos(w.a)*r*.1,ey+Math.sin(w.a)*r*.1,r*.15,0,TAU);g.fill()}
if(w.boost){g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=2;g.beginPath();g.arc(w.x,w.y,r*1.3,0,TAU);g.stroke()}}
function draw(){g.fillStyle='#0b1022';g.fillRect(0,0,W,H);const z=(Math.min(W,H)/520)*Math.max(.62,1-(me.len-14)*.0015);
g.save();shk();g.translate(W/2,H/2);g.scale(z,z);g.translate(-cam.x,-cam.y);const vw=W/2/z,vh=H/2/z;
g.fillStyle='rgba(120,140,255,.18)';for(let x=Math.floor((cam.x-vw)/60)*60;x<cam.x+vw;x+=60)for(let y=Math.floor((cam.y-vh)/60)*60;y<cam.y+vh;y+=60){g.fillRect(x-1,y-1,3,3)}
g.fillStyle='#161d3a';g.beginPath();g.rect(cam.x-vw-100,cam.y-vh-100,vw*2+200,vh*2+200);g.arc(0,0,AR,0,TAU,true);g.fill();g.lineWidth=10;g.strokeStyle='#ff4a6a';g.shadowColor='#ff4a6a';g.shadowBlur=24;g.beginPath();g.arc(0,0,AR,0,TAU);g.stroke();g.shadowBlur=0;
for(const p of pel){if(Math.abs(p.x-cam.x)>vw+10||Math.abs(p.y-cam.y)>vh+10)continue;g.fillStyle='hsl('+p.h+',90%,62%)';g.beginPath();g.arc(p.x,p.y,(p.v>1?6:4)+Math.sin(T*4+p.x)*.8,0,TAU);g.fill()}
for(const w of wm){if(!w.dead)drawW(w)}drawPT();g.restore();
if(st==='play'){hudScore();tx('Uzunluk: '+Math.floor(me.len),16,78,17,'#fff','left');tx('Sıra: '+rankN+'/'+wm.filter(w=>!w.dead).length,16,100,15,'rgba(255,255,255,.8)','left');
const b=bpos();g.globalAlpha=bId!==null?.9:.5;g.fillStyle=COL;g.beginPath();g.arc(b.x,b.y,b.r,0,TAU);g.fill();g.globalAlpha=1;tx('HIZ',b.x,b.y,Math.round(22*Math.max(.8,u)),'#0b1022')}}
reset();requestAnimationFrame(loop);
</script></body></html>
