<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kum Havuzu</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#12162a;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head>
<body><canvas id="c"></canvas><script>
const cv=document.getElementById('c'),g=cv.getContext('2d');let W=0,H=0,DPR=1;
function rs(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);g.setTransform(DPR,0,0,DPR,0,0);if(typeof onResize=='function')onResize()}
addEventListener('resize',rs);
function ld(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const FF='"Trebuchet MS","Segoe UI",system-ui,sans-serif';
let AC=null,muted=ld('ksb-muted',false),started=false,hid=false,mx=0,my=0;
function au(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
function tone(f,d=.12,t='sine',v=.12,sl=0){if(!AC||muted)return;try{const n=AC.currentTime,o=AC.createOscillator(),q=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);q.gain.setValueAtTime(v,n);q.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(q);q.connect(AC.destination);o.start(n);o.stop(n+d+.02)}catch(e){}}
function noise(d=.1,v=.1,fq=1800){if(!AC||muted)return;try{const n=AC.currentTime,len=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,len,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource(),q=AC.createGain(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fq;s.buffer=b;q.gain.value=v;s.connect(f);f.connect(q);q.connect(AC.destination);s.start(n)}catch(e){}}
function txt(s,x,y,sz,col,al,w){g.font=(w||'bold')+' '+sz+'px '+FF;g.textAlign=al||'center';g.textBaseline='middle';g.fillStyle=col||'#fff';g.fillText(s,x,y)}
function rr(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function drawMute(){const x=W-26,y=26;g.save();g.globalAlpha=.85;g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.arc(x,y,17,0,7);g.fill();g.fillStyle='#fff';g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(x-7,y-3);g.lineTo(x-3,y-3);g.lineTo(x+2,y-8);g.lineTo(x+2,y+8);g.lineTo(x-3,y+3);g.lineTo(x-7,y+3);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(x+5,y-4);g.lineTo(x+11,y+4);g.moveTo(x+11,y-4);g.lineTo(x+5,y+4)}else g.arc(x+2,y,6,-1,1);g.stroke();g.restore()}
function drawTitle(a,b,c){const t=performance.now()/1000,ls=a.split(' ');g.fillStyle='rgba(0,0,0,.38)';g.fillRect(0,0,W,H);g.save();let sz=Math.min(W*.2,H*.14,130);const L=(ls.length>1&&W<H)?ls:[a];const fit=s=>{g.font='bold '+s+'px '+FF;return Math.max(...L.map(l=>g.measureText(l).width))};while(fit(sz)>W*.88&&sz>12)sz-=2;const y0=H*.38-(L.length-1)*sz*.52+Math.sin(t*2)*6;g.shadowColor=c;g.shadowBlur=30;L.forEach((l,i)=>txt(l,W/2,y0+i*sz*1.05,sz,'#fff'));g.shadowBlur=0;txt(b,W/2,y0+(L.length-1)*sz*1.05+sz*.85,Math.max(14,Math.min(W*.045,26)),c,'center','600');g.globalAlpha=.6+.4*Math.sin(t*4);txt('Başlamak için dokun / tıkla',W/2,H*.72,Math.max(16,Math.min(W*.05,28)),'#fff');g.restore()}
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();au();const[x,y]=pos(e);mx=x;my=y;if(Math.hypot(x-W+26,y-26)<22){muted=!muted;sv('ksb-muted',muted);return}if(!started){started=true;if(typeof onStart=='function')onStart();return}try{cv.setPointerCapture(e.pointerId)}catch(_){}if(typeof down=='function')down(x,y,e)});
cv.addEventListener('pointermove',e=>{const[x,y]=pos(e);mx=x;my=y;if(started&&typeof move=='function')move(x,y,e)});
addEventListener('pointerup',e=>{if(typeof up=='function')up(e)});
addEventListener('pointercancel',e=>{if(typeof up=='function')up(e)});
addEventListener('keydown',e=>{if(e.key=='m'||e.key=='M'){muted=!muted;sv('ksb-muted',muted);return}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();au();if(!started){if(e.key==' '||e.key=='Enter'){started=true;if(typeof onStart=='function')onStart()}return}if(typeof key=='function')key(e.key,e)});
document.addEventListener('visibilitychange',()=>{hid=document.hidden;try{if(AC){hid?AC.suspend():AC.resume()}}catch(e){}});
let _l=0;function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,Math.max(0,(t-_l)/1000)||0);_l=t;if(hid)return;upd(dt);draw();if(!started)drawTitle(TITLE[0],TITLE[1],TITLE[2]);drawMute()}
/* ---- game ---- */
const TITLE=['Kum Havuzu','Kum, su, ateş ve bitkiyle oyna','#ffcf5a'],BK='ksb-kum-havuzu-best';
const BT=[['Kum',1,'#e2be6e'],['Su',2,'#3a86f0'],['Taş',3,'#8a8f9c'],['Ateş',4,'#ff7a1f'],['Bitki',5,'#46b94f'],['Sil',0,'#e9e9f2'],['Fırça',-1,'#b79cff'],['Temizle',-2,'#ff6b8a']];
const PR=[.55,.6,1,.5,1];
let cs=5,cols=0,rows=0,bar=64,a,lf,vr,mk,tick=1,fp=0,mat=1,rad=3,held=false,best=ld(BK,0),off=document.createElement('canvas'),og=off.getContext('2d'),img,u32,cnt=0,fr=0,lx=-1,ly=-1;
function onResize(){cs=Math.max(3,Math.round(Math.max(W,H)/200));bar=W<500?62:66;cols=Math.ceil(W/cs);rows=Math.max(10,Math.ceil((H-bar)/cs));const n=cols*rows;a=new Uint8Array(n);lf=new Uint8Array(n);vr=new Uint8Array(n);mk=new Uint8Array(n);off.width=cols;off.height=rows;img=og.createImageData(cols,rows);u32=new Uint32Array(img.data.buffer);demo()}
function demo(){for(let x=Math.floor(cols*.18);x<cols*.5;x++){const y=Math.floor(rows*.42+(x-cols*.18)*.22);for(let k=0;k<2;k++)set(x,y+k,3)}for(let x=Math.floor(cols*.5);x<cols*.85;x++){const y=Math.floor(rows*.55-(x-cols*.5)*.18+cols*.06);for(let k=0;k<2;k++)set(x,y+k,3)}for(let x=Math.floor(cols*.6);x<cols*.9;x+=3){for(let h=0;h<5+(x*7%6);h++)set(x,rows-1-h,5)}}
function set(x,y,m){if(x<0||y<0||x>=cols||y>=rows)return;const i=y*cols+x;a[i]=m;lf[i]=m==4?30+Math.random()*25:m==6?40:0;vr[i]=Math.random()*30}
function put(cx,cy,r,m,p){for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(dx*dx+dy*dy>r*r+r)continue;const x=cx+dx,y=cy+dy;if(x<0||y<0||x>=cols||y>=rows)continue;const i=y*cols+x;if(m==0){a[i]=0}else if(a[i]==0&&Math.random()<p)set(x,y,m)}}
function sw(i,j){let t=a[i];a[i]=a[j];a[j]=t;t=lf[i];lf[i]=lf[j];lf[j]=t;t=vr[i];vr[i]=vr[j];vr[j]=t;mk[i]=mk[j]=tick}
const DX=[1,-1,0,0],DY=[0,0,1,-1];
function step(){tick=tick==1?2:1;fp^=1;
for(let y=rows-1;y>=0;y--)for(let k=0;k<cols;k++){const x=fp?k:cols-1-k,i=y*cols+x,t=a[i];if(!t||mk[i]==tick)continue;
 const dn=y<rows-1,l=x>0,r=x<cols-1,d=i+cols,rd=Math.random()<.5,s=rd?d-1:d+1,ok=rd?l:r;
 if(t==1){if(dn){if(a[d]==0||a[d]==2)sw(i,d);else if(ok&&(a[s]==0||a[s]==2))sw(i,s)}}
 else if(t==2){if(dn&&a[d]==0)sw(i,d);else if(dn&&ok&&a[s]==0)sw(i,s);else{const h=rd?i-1:i+1;if(ok&&a[h]==0)sw(i,h)}}
 else if(t==4){if(--lf[i]<=0){a[i]=Math.random()<.4?6:0;lf[i]=40;continue}
  const q=Math.random()*4|0,nx=x+DX[q],ny=y+DY[q];if(nx>=0&&ny>=0&&nx<cols&&ny<rows){const n=ny*cols+nx;if(a[n]==5&&Math.random()<.3){a[n]=4;lf[n]=30+Math.random()*30;mk[n]=tick}else if(a[n]==2){a[n]=0;a[i]=6;lf[i]=50;continue}}
  if(y>0&&Math.random()<.6){if(a[i-cols]==0)sw(i,i-cols);else{const h=rd?i-1:i+1;if(ok&&a[h]==0)sw(i,h)}}}
 else if(t==6){if(--lf[i]<=0){a[i]=0;continue}if(y>0&&Math.random()<.7){if(a[i-cols]==0)sw(i,i-cols);else{const h=rd?i-1:i+1;if(ok&&a[h]==0)sw(i,h)}}else{const h=rd?i-1:i+1;if(ok&&a[h]==0)sw(i,h)}}
 else if(t==5){if(Math.random()<.012){const q=Math.random()*4|0,nx=x+DX[q],ny=y+DY[q];if(nx>=0&&ny>=0&&nx<cols&&ny<rows){const n=ny*cols+nx;if(a[n]==2){a[n]=5;mk[n]=tick}}}}}}
function stroke(x0,y0,x1,y1){const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)/(cs*1.5)));const m=BT[BT.findIndex(b=>b[1]==mat)]||BT[0];for(let k=0;k<=n;k++){const x=x0+(x1-x0)*k/n,y=y0+(y1-y0)*k/n;put(Math.floor(x/cs),Math.floor(y/cs),rad,mat,mat>=0?PR[mat-1]||1:1)}}
function btn(x,y){if(y<H-bar)return false;const i=Math.floor(x/(W/BT.length)),b=BT[i];if(!b)return true;if(b[1]>=0){mat=b[1];tone(500+i*60,.06,'triangle',.08)}else if(b[1]==-1){rad=rad>=7?2:rad+2;tone(300,.06)}else{a.fill(0);tone(200,.25,'sawtooth',.06,-100)}return true}
function down(x,y){if(btn(x,y))return;held=true;lx=x;ly=y;stroke(x,y,x,y)}
function move(x,y){}
function up(){held=false}
function key(k){const n='123456'.indexOf(k);if(n>=0){mat=BT[n][1];return}if(k=='c'||k=='C')a.fill(0);if(k==']')rad=Math.min(9,rad+1);if(k=='[')rad=Math.max(1,rad-1)}
function onStart(){a.fill(0)}
function upd(dt){if(!started){if(Math.random()<.9)put(Math.floor(cols*.3),1,2,1,.5);if(Math.random()<.7)put(Math.floor(cols*.72),1,2,2,.6);if(fr%260==0)put(Math.floor(cols*.4),Math.floor(rows*.35),2,4,1)}
 if(held&&my<H-bar){stroke(lx,ly,mx,my);lx=mx;ly=my}
 step();fr++;if(fr%15==0){let n=0;for(let i=0;i<a.length;i++)if(a[i])n++;cnt=n;if(n>best){best=n;if(fr%60==0)sv(BK,best)}}}
function draw(){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#1c2447');gr.addColorStop(1,'#0e1226');g.fillStyle=gr;g.fillRect(0,0,W,H);
 const n=cols*rows;for(let i=0;i<n;i++){const t=a[i];if(!t){u32[i]=0;continue}const v=vr[i];let r,q,b,al=255;
  if(t==1){r=226-v;q=190-v;b=110-(v>>1)}else if(t==2){r=40+(v>>1);q=120+v;b=225}else if(t==3){r=110+v;q=115+v;b=125+v}else if(t==4){r=255;q=Math.min(255,70+lf[i]*3+v);b=20}else if(t==5){r=50+v;q=165+v;b=60}else{r=q=b=120+v;al=Math.min(255,lf[i]*5)}
  u32[i]=(al<<24)|(b<<16)|(q<<8)|r}
 og.putImageData(img,0,0);g.imageSmoothingEnabled=false;g.drawImage(off,0,0,cols*cs,rows*cs);
 const bw=W/BT.length;g.fillStyle='rgba(10,12,28,.92)';g.fillRect(0,H-bar,W,bar);
 BT.forEach((b,i)=>{const x=i*bw+bw/2,y=H-bar/2-6,sel=b[1]==mat;g.beginPath();g.arc(x,y,Math.min(18,bw*.32),0,7);g.fillStyle=b[2];g.fill();if(sel){g.lineWidth=3;g.strokeStyle='#fff';g.stroke()}
  if(b[1]==-1){g.fillStyle='#2a1f55';g.beginPath();g.arc(x,y,rad*1.6+1,0,7);g.fill()}
  txt(b[0],x,H-10,Math.min(12,bw*.22),sel?'#fff':'#9aa0c8')});
 if(started){txt('Parçacık: '+cnt,12,22,14,'#cfd6ff','left');txt('Rekor: '+best,12,42,12,'#8f98d0','left')}}
rs();requestAnimationFrame(loop);
</script></body></html>
