<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Spirograf</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0a1a;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head>
<body><canvas id="c"></canvas><script>
const cv=document.getElementById('c'),g=cv.getContext('2d');let W=0,H=0,DPR=1;
function rs(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);g.setTransform(DPR,0,0,DPR,0,0);if(typeof onResize=='function')onResize()}
addEventListener('resize',rs);
function ld(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const FF='"Trebuchet MS","Segoe UI",system-ui,sans-serif';
let AC=null,muted=ld('ksb-muted',false),started=false,hid=false,mx=0,my=0;
function au(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
function tone(f,d=.12,t='sine',v=.12,sl=0){if(!AC||muted)return;try{const n=AC.currentTime,o=AC.createOscillator(),q=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);q.gain.setValueAtTime(v,n);q.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(q);q.connect(AC.destination);o.start(n);o.stop(n+d+.02)}catch(e){}}
function txt(s,x,y,sz,col,al,w){g.font=(w||'bold')+' '+sz+'px '+FF;g.textAlign=al||'center';g.textBaseline='middle';g.fillStyle=col||'#fff';g.fillText(s,x,y)}
function rr(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function drawMute(){const x=W-26,y=26;g.save();g.globalAlpha=.85;g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.arc(x,y,17,0,7);g.fill();g.fillStyle='#fff';g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(x-7,y-3);g.lineTo(x-3,y-3);g.lineTo(x+2,y-8);g.lineTo(x+2,y+8);g.lineTo(x-3,y+3);g.lineTo(x-7,y+3);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(x+5,y-4);g.lineTo(x+11,y+4);g.moveTo(x+11,y-4);g.lineTo(x+5,y+4)}else g.arc(x+2,y,6,-1,1);g.stroke();g.restore()}
function drawTitle(a,b,c){const t=performance.now()/1000,ls=a.split(' ');g.fillStyle='rgba(0,0,0,.38)';g.fillRect(0,0,W,H);g.save();let sz=Math.min(W*.2,H*.14,130);const L=(ls.length>1&&W<H)?ls:[a];const fit=s=>{g.font='bold '+s+'px '+FF;return Math.max(...L.map(l=>g.measureText(l).width))};while(fit(sz)>W*.88&&sz>12)sz-=2;const y0=H*.38-(L.length-1)*sz*.52+Math.sin(t*2)*6;g.shadowColor=c;g.shadowBlur=30;L.forEach((l,i)=>txt(l,W/2,y0+i*sz*1.05,sz,'#fff'));g.shadowBlur=0;txt(b,W/2,y0+(L.length-1)*sz*1.05+sz*.85,Math.max(14,Math.min(W*.045,26)),c,'center','600');g.globalAlpha=.6+.4*Math.sin(t*4);txt('Başlamak için dokun / tıkla',W/2,H*.72,Math.max(16,Math.min(W*.05,28)),'#fff');g.restore()}
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();au();const[x,y]=pos(e);mx=x;my=y;if(Math.hypot(x-W+26,y-26)<22){muted=!muted;sv('ksb-muted',muted);return}if(!started){started=true;if(typeof onStart=='function')onStart();return}try{cv.setPointerCapture(e.pointerId)}catch(_){}if(typeof down=='function')down(x,y,e)});
cv.addEventListener('pointermove',e=>{const[x,y]=pos(e);mx=x;my=y;if(started&&typeof move=='function')move(x,y,e)});
addEventListener('pointerup',e=>{if(typeof up=='function')up(e)});
addEventListener('pointercancel',e=>{if(typeof up=='function')up(e)});
addEventListener('keydown',e=>{if(e.key=='m'||e.key=='M'){muted=!muted;sv('ksb-muted',muted);return}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();au();if(!started){if(e.key==' '||e.key=='Enter'){started=true;if(typeof onStart=='function')onStart()}return}if(typeof key=='function')key(e.key,e)});
document.addEventListener('visibilitychange',()=>{hid=document.hidden;try{if(AC){hid?AC.suspend():AC.resume()}}catch(e){}});
let _l=0;function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,Math.max(0,(t-_l)/1000)||0);_l=t;if(hid)return;upd(dt);draw();if(!started)drawTitle(TITLE[0],TITLE[1],TITLE[2]);drawMute()}
/* ---- game ---- */
const TITLE=['Spirograf','Dönen çarklarla büyüleyici desenler','#7ee0ff'],BK='ksb-spirograf-best';
const SL=[{l:'Büyük çark',k:'R',mn:40,mx:140,iv:1},{l:'Küçük çark',k:'r',mn:5,mx:100,iv:1},{l:'Kalem',k:'d',mn:5,mx:150,iv:1},{l:'Hız',k:'spd',mn:.05,mx:1,iv:0}];
const CN=['Gökkuşağı','Ateş','Okyanus','Gün batımı','Gümüş'];
const V={R:96,r:35,d:60,spd:.5};
let auto=true,cm=0,t=0,T=1,pc=document.createElement('canvas'),pg=pc.getContext('2d'),cnt=ld(BK,0),wait=0,drag=-1,boost=0,px=0,py=0,cx=0,cy=0,ext=100,sc=1,pan={x:0,y:0,w:0,h:0},done=false,base=Math.random()*360;
function gcd(a,b){return b?gcd(b,a%b):a}
function period(){return 6.2832*V.r/gcd(V.R,V.r)}
function curve(a){const k=(V.R-V.r)/V.r;return[(V.R-V.r)*Math.cos(a)+V.d*Math.cos(k*a),(V.R-V.r)*Math.sin(a)-V.d*Math.sin(k*a)]}
function reset(){V.r=Math.min(V.r,V.R-1);T=period();t=0;done=false;wait=0;base=Math.random()*360;pg.setTransform(DPR,0,0,DPR,0,0);pg.globalCompositeOperation='source-over';pg.clearRect(0,0,W,H);fit();const p=curve(0);px=cx+p[0]*sc;py=cy+p[1]*sc}
function fit(){ext=Math.min(pan.aw,pan.ah)/2*.93;sc=ext/(Math.abs(V.R-V.r)+V.d);cx=pan.ax+pan.aw/2;cy=pan.ay+pan.ah/2}
function onResize(){const land=W>=H*1.1;if(land){const pw=Math.min(320,W*.34);pan={x:W-pw,y:0,w:pw,h:H,ax:0,ay:0,aw:W-pw,ah:H}}else{const ph=Math.min(300,H*.4);pan={x:0,y:H-ph,w:W,h:ph,ax:0,ay:0,aw:W,ah:H-ph}}pc.width=Math.round(W*DPR);pc.height=Math.round(H*DPR);reset()}
function nxt(){for(let k=0;k<40;k++){V.R=60+Math.floor(Math.random()*80);V.r=8+Math.floor(Math.random()*(V.R-12));if(V.r/gcd(V.R,V.r)<=36)break}V.d=Math.floor(V.r*(.4+Math.random()*1.2))+10;V.d=Math.min(150,V.d);reset()}
function col(a){const k=a/T;let h,s=90,l=60;if(cm==0)h=(k*540+base)%360;else if(cm==1)h=25+25*Math.sin(k*20);else if(cm==2)h=210+45*Math.sin(k*14);else if(cm==3)h=(320+90*(.5+.5*Math.sin(k*16)))%360;else{h=250;s=18;l=75+15*Math.sin(k*30)}return'hsla('+h+','+s+'%,'+l+'%,.55)'}
function sliderRect(i){const pad=18,top=pan.y+(W>=H*1.1?70:16),rh=46;return{x:pan.x+pad,y:top+i*rh,w:pan.w-pad*2,h:rh}}
function btnRect(i){const pad=14,top=sliderRect(3).y+58,n=3,w=(pan.w-pad*2-(n-1)*8)/n;return{x:pan.x+pad+i*(w+8),y:top,w,h:42}}
function setV(i,x){const s=sliderRect(i),k=Math.max(0,Math.min(1,(x-s.x-8)/(s.w-16))),d=SL[i];let v=d.mn+(d.mx-d.mn)*k;if(d.iv)v=Math.round(v);V[d.k]=v;if(d.k=='R'&&V.r>=V.R)V.r=V.R-1;if(d.k=='r'&&V.r>=V.R)V.r=V.R-1;if(d.k!='spd'){auto=false;boost=.7;reset()}}
function down(x,y){for(let i=0;i<4;i++){const s=sliderRect(i);if(x>=s.x-10&&x<=s.x+s.w+10&&y>=s.y&&y<=s.y+s.h){drag=i;setV(i,x);return}}
 for(let i=0;i<3;i++){const b=btnRect(i);if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){act(i);return}}}
function act(i){tone(500+i*100,.08,'triangle',.08);if(i==0){auto=!auto;if(auto)wait=1}else if(i==1){cm=(cm+1)%CN.length;reset()}else{nxt();auto=false}}
function move(x){if(drag>=0)setV(drag,x)}
function up(){drag=-1}
function key(k){if(k==' ')act(0);else if(k=='c'||k=='C')act(1);else if(k=='n'||k=='N')act(2)}
function onStart(){V.spd=.5}
function upd(dt){if(!started){V.spd=.9}if(t>=T){if(!done){done=true;cnt++;sv(BK,cnt);tone(660,.3,'sine',.06);tone(990,.4,'sine',.04)}wait+=dt;if((auto||!started)&&wait>(started?2:1.2))nxt();return}
 boost=Math.max(0,boost-dt);const n=Math.min(Math.ceil(V.spd*4500*dt*(boost>0?8:1)*(started?1:2)),900),da=.02;pg.globalCompositeOperation='lighter';pg.lineWidth=1.3;pg.lineCap='round';let lx=px,ly=py;
 for(let i=0;i<n&&t<T;i++){t=Math.min(T,t+da);const p=curve(t),x=cx+p[0]*sc,y=cy+p[1]*sc;pg.strokeStyle=col(t);pg.beginPath();pg.moveTo(lx,ly);pg.lineTo(x,y);pg.stroke();lx=x;ly=y}px=lx;py=ly}
function draw(){const gr=g.createRadialGradient(cx,cy,10,cx,cy,Math.max(W,H));gr.addColorStop(0,'#1b1740');gr.addColorStop(1,'#07060f');g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.drawImage(pc,0,0,W,H);
 if(t<T){const a=t,k=(V.R-V.r)*sc;g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=1;g.beginPath();g.arc(cx,cy,V.R*sc,0,7);g.stroke();g.beginPath();g.arc(cx+Math.cos(a)*k,cy+Math.sin(a)*k,V.r*sc,0,7);g.stroke();g.fillStyle='#fff';g.shadowColor='#7ee0ff';g.shadowBlur=14;g.beginPath();g.arc(px,py,3.2,0,7);g.fill();g.shadowBlur=0}
 if(started){rr(pan.x+6,pan.y+6,pan.w-12,pan.h-12,18);g.fillStyle='rgba(20,16,50,.72)';g.fill();
  SL.forEach((d,i)=>{const s=sliderRect(i),k=(V[d.k]-d.mn)/(d.mx-d.mn),y=s.y+s.h*.64;txt(d.l,s.x,s.y+s.h*.25,13,'#cfd6ff','left','600');txt(d.iv?Math.round(V[d.k])+'':Math.round(V[d.k]*100)+'%',s.x+s.w,s.y+s.h*.25,13,'#7ee0ff','right');rr(s.x,y-3,s.w,6,3);g.fillStyle='rgba(255,255,255,.15)';g.fill();rr(s.x,y-3,8+(s.w-16)*k,6,3);g.fillStyle='#7ee0ff';g.fill();g.beginPath();g.arc(s.x+8+(s.w-16)*k,y,9,0,7);g.fillStyle='#fff';g.fill()});
  ['Otomatik: '+(auto?'Açık':'Kapalı'),'Renk: '+CN[cm],'Rastgele'].forEach((s,i)=>{const b=btnRect(i);rr(b.x,b.y,b.w,b.h,12);g.fillStyle=i==0&&auto?'#7ee0ff':'rgba(255,255,255,.12)';g.fill();txt(s,b.x+b.w/2,b.y+b.h/2,Math.min(13,b.w*.12),i==0&&auto?'#0b0a2a':'#e6ecff')});
  txt('Desen: '+cnt,14,24,15,'#9fb0ff','left')}}
rs();requestAnimationFrame(loop);
</script></body></html>
