<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Matematik Yarışı · KSB Games</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0e1a2b;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100vw;height:100vh;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const KEY='ksb-matematik-yarisi-best';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,S,best=0,muted=false,AC,last=0,shake=0,parts=[],T=0;
try{best=+localStorage.getItem(KEY)||0}catch(e){}
const sv=()=>{try{localStorage.setItem(KEY,best)}catch(e){}};
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b));
function rs(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);S=Math.min(W,H);if(window.lay)lay()}
addEventListener('resize',rs);
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function tx(s,x,y,z,col,al,wt){ctx.font=(wt||800)+' '+z+'px system-ui,"Segoe UI",sans-serif';ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y)}
function snd(f,d,ty,v,f2){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function burst(x,y,c,n,sp){for(let i=0;i<(n||12);i++){const a=R(0,6.28),s=R(.3,1)*(sp||220);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:R(.4,.8),m:.8,c})}}
function dparts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,6.3);ctx.fill()}ctx.globalAlpha=1}
function spk(){const x=W-22,y=22;ctx.save();ctx.globalAlpha=.8;ctx.fillStyle='#fff';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-9,y-3);ctx.lineTo(x-4,y-3);ctx.lineTo(x+1,y-8);ctx.lineTo(x+1,y+8);ctx.lineTo(x-4,y+3);ctx.lineTo(x-9,y+3);ctx.fill();ctx.beginPath();if(muted){ctx.moveTo(x+5,y-5);ctx.lineTo(x+13,y+5);ctx.moveTo(x+13,y-5);ctx.lineTo(x+5,y+5)}else{ctx.arc(x+2,y,6,-1,1);ctx.moveTo(x+2+Math.cos(-1)*11,y+Math.sin(-1)*11);ctx.arc(x+2,y,11,-1,1)}ctx.stroke();ctx.restore()}
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;if(document.hidden)return;T+=dt;ctx.save();if(shake>0){ctx.translate(R(-shake,shake),R(-shake,shake));shake=Math.max(0,shake-dt*40)}frame(dt);dparts(dt);ctx.restore();spk()}
function pt(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}const[x,y]=pt(e);if(x>W-44&&y<44){muted=!muted;return}onDown(x,y)});
cv.addEventListener('pointermove',e=>{const[x,y]=pt(e);if(window.onMove)onMove(x,y)});
cv.addEventListener('pointerup',e=>{const[x,y]=pt(e);if(window.onUp)onUp(x,y)});
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.key==' ')e.preventDefault();if(e.key=='m'||e.key=='M'){muted=!muted;return}if(window.onKey)onKey(e)});
addEventListener('contextmenu',e=>e.preventDefault());
function big(name,cx,cy,col,glow){const ws=W<H?name.split(' '):[name],ml=Math.max(...ws.map(w=>w.length)),z=Math.min(W*.9/(ml*.76),H*.13,140);ctx.save();ctx.shadowColor=glow||col;ctx.shadowBlur=z*.5;ws.forEach((w,i)=>tx(w,cx,cy+(i-(ws.length-1)/2)*z*1.12,z,col));ctx.restore();return z}
function tap(y,t,col){ctx.globalAlpha=.65+.35*Math.sin(T*4);tx(t||'Başlamak için dokun / tıkla',W/2,y,Math.max(16,Math.min(S*.05,30)),col);ctx.globalAlpha=1}
function over(t,l1,l2,col,rt){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);const z=Math.min(W*.11,70);tx(t,W/2,H*.34,z,col);tx(l1,W/2,H*.34+z*1.2,z*.5);if(l2)tx(l2,W/2,H*.34+z*1.9,z*.42,'#cbd');tap(H*.34+z*3.1,rt||'Tekrar için dokun / tıkla')}
const hit=(b,x,y)=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;
/* ---- oyun ---- */
let st='title',q='',opts=[],score=0,streak=0,maxS=0,lives=3,tl=0,tmax=8,fb=0,pick=-1,corr=0,btns=[],ans=0;
const SYM=Array.from({length:22},()=>({x:Math.random(),y:Math.random(),v:R(.02,.06),c:'+-×÷=?'[RI(0,6)],z:R(.5,1.2)}));
const BC=['#ff6b6b','#4dabf7','#ffd43b','#69db7c'];
function heart(x,y,s,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x,y+s*.8);ctx.bezierCurveTo(x-s*1.3,y-s*.1,x-s*.7,y-s,x,y-s*.35);ctx.bezierCurveTo(x+s*.7,y-s,x+s*1.3,y-s*.1,x,y+s*.8);ctx.fill()}
function lay(){const gw=Math.min(W-32,640),bh=Math.min(H*.14,120),gap=14,top=H*.42;btns=[];for(let i=0;i<4;i++)btns.push({x:(W-gw)/2+(i%2)*(gw/2+gap/2),y:top+(i>>1)*(bh+gap),w:gw/2-gap/2,h:bh})}
function start(){score=0;streak=0;maxS=0;lives=3;corr=0;st='play';nq()}
function nq(){const L=Math.min(12,corr/4|0),ops=['+','-'];if(L>=1)ops.push('×');if(L>=4)ops.push('÷');const o=ops[RI(0,ops.length)];let a,b,r;
 if(o=='+'){a=RI(2,12+L*9);b=RI(2,12+L*9);r=a+b}else if(o=='-'){a=RI(5,20+L*9);b=RI(1,a);r=a-b}else if(o=='×'){a=RI(2,6+L);b=RI(2,8+L);r=a*b}else{b=RI(2,8);r=RI(2,8+L);a=b*r}
 q=a+' '+o+' '+b+' = ?';ans=r;const set=[r];let n=0;while(set.length<4&&n++<60){const v=r+RI(1,r>20?12:6)*(Math.random()<.5?-1:1);if(v>=0&&!set.includes(v))set.push(v)}while(set.length<4)set.push(r+set.length+9);
 opts=set.map(v=>({v,k:v==r})).sort(()=>Math.random()-.5);tmax=Math.max(3.5,9-corr*.15);tl=tmax;pick=-1;fb=0}
function choose(i){if(st!='play'||fb>0)return;pick=i;fb=.5;const b=btns[i];if(opts[i].k){corr++;streak++;maxS=Math.max(maxS,streak);const p=10+Math.ceil(tl/tmax*10)+Math.min(streak,10)*3;score+=p;if(score>best){best=score;sv()}burst(b.x+b.w/2,b.y+b.h/2,'#69db7c',16,260);snd(520+Math.min(streak,10)*40,.14,'triangle')}else{lives--;streak=0;shake=8;snd(200,.3,'sawtooth',.1,90)}}
function onDown(x,y){if(st!='play'){start();return}btns.forEach((b,i)=>{if(hit(b,x,y))choose(i)})}
function onKey(e){if(st!='play'){if(e.key=='Enter'||e.key==' ')start();return}const i='1234'.indexOf(e.key);if(i>=0)choose(i)}
function frame(dt){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0e1a2b');g.addColorStop(1,'#2b1a4a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.globalAlpha=.1;SYM.forEach(s=>tx(s.c,s.x*W,((s.y+T*s.v)%1.2-.1)*H,60*s.z+30,'#fff'));ctx.globalAlpha=1;
 if(st=='title'){big('MATEMATİK YARIŞI',W/2,H*.34,'#69db7c','#2fbf71');tx('7 × 8 = ?',W/2,H*.56,Math.min(S*.1,70),'#ffd43b');tap(H*.74);tx('En iyi puan: '+best,W/2,H*.82,Math.min(S*.04,22),'#9fb3d1');return}
 if(st!='play'){}else if(fb>0){fb-=dt;if(fb<=0){if(lives<=0){st='over';snd(160,.6,'sawtooth',.12,60)}else nq()}}else{tl-=dt;if(tl<=0){tl=0;pick=-2;fb=.7;lives--;streak=0;shake=8;snd(200,.3,'sawtooth',.1,90)}}
 tx('Puan '+score,16,24,Math.min(22,W*.055),'#fff','left');tx('En iyi '+best,16,48,13,'#9fb3d1','left');
 for(let i=0;i<3;i++)heart(W/2-30+i*30,26,11,i<lives?'#ff5d73':'#3a3350');
 if(streak>1)tx('Seri x'+streak,W/2,58,Math.min(18,S*.045),'#ffd43b');
 const bw=Math.min(W-40,640),f=Math.max(0,tl/tmax);rr((W-bw)/2,H*.13,bw,12,6);ctx.fillStyle='rgba(255,255,255,.12)';ctx.fill();rr((W-bw)/2,H*.13,bw*f,12,6);ctx.fillStyle=f>.35?'#69db7c':'#ff6b6b';ctx.fill();
 tx(q,W/2,H*.27,Math.min(W*.13,S*.12,110),'#fff');
 btns.forEach((b,i)=>{const o=opts[i];let c=BC[i];if(fb>0){if(o.k)c='#2fbf71';else if(pick==i)c='#c92a2a';else c='#2a3350'}rr(b.x,b.y,b.w,b.h,16);ctx.fillStyle=c;ctx.fill();tx(o.v,b.x+b.w/2,b.y+b.h/2+2,Math.min(b.h*.5,56),'#10182a');tx(i+1,b.x+14,b.y+16,12,'rgba(0,0,0,.4)','left')});
 if(st=='over')over('Oyun bitti!','Puan: '+score,'En iyi: '+best+'  ·  En uzun seri: '+maxS,'#ffd43b')}
rs();requestAnimationFrame(loop);
</script></body></html>
