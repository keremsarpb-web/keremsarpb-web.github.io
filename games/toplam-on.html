<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Toplam On · KSB Games</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b2a3a;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100vw;height:100vh;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const KEY='ksb-toplam-on-best';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,S,best=0,muted=false,AC,last=0,shake=0,parts=[],T=0;
try{best=+localStorage.getItem(KEY)||0}catch(e){}
const sv=()=>{try{localStorage.setItem(KEY,best)}catch(e){}};
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b));
function rs(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);S=Math.min(W,H);if(window.lay)lay()}
addEventListener('resize',rs);
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function tx(s,x,y,z,col,al,wt){ctx.font=(wt||800)+' '+z+'px system-ui,"Segoe UI",sans-serif';ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y)}
function snd(f,d,ty,v,f2){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function burst(x,y,c,n,sp){for(let i=0;i<(n||12);i++){const a=R(0,6.28),s=R(.3,1)*(sp||220);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:R(.4,.8),m:.8,c})}}
function dparts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,6.3);ctx.fill()}ctx.globalAlpha=1}
function spk(){const x=W-22,y=22;ctx.save();ctx.globalAlpha=.8;ctx.fillStyle='#fff';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-9,y-3);ctx.lineTo(x-4,y-3);ctx.lineTo(x+1,y-8);ctx.lineTo(x+1,y+8);ctx.lineTo(x-4,y+3);ctx.lineTo(x-9,y+3);ctx.fill();ctx.beginPath();if(muted){ctx.moveTo(x+5,y-5);ctx.lineTo(x+13,y+5);ctx.moveTo(x+13,y-5);ctx.lineTo(x+5,y+5)}else{ctx.arc(x+2,y,6,-1,1);ctx.moveTo(x+2+Math.cos(-1)*11,y+Math.sin(-1)*11);ctx.arc(x+2,y,11,-1,1)}ctx.stroke();ctx.restore()}
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;if(document.hidden)return;T+=dt;ctx.save();if(shake>0){ctx.translate(R(-shake,shake),R(-shake,shake));shake=Math.max(0,shake-dt*40)}frame(dt);dparts(dt);ctx.restore();spk()}
function pt(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}const[x,y]=pt(e);if(x>W-44&&y<44){muted=!muted;return}onDown(x,y)});
cv.addEventListener('pointermove',e=>{const[x,y]=pt(e);if(window.onMove)onMove(x,y)});
cv.addEventListener('pointerup',e=>{const[x,y]=pt(e);if(window.onUp)onUp(x,y)});
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.key==' ')e.preventDefault();if(e.key=='m'||e.key=='M'){muted=!muted;return}if(window.onKey)onKey(e)});
addEventListener('contextmenu',e=>e.preventDefault());
function big(name,cx,cy,col,glow){const ws=W<H?name.split(' '):[name],ml=Math.max(...ws.map(w=>w.length)),z=Math.min(W*.9/(ml*.76),H*.13,140);ctx.save();ctx.shadowColor=glow||col;ctx.shadowBlur=z*.5;ws.forEach((w,i)=>tx(w,cx,cy+(i-(ws.length-1)/2)*z*1.12,z,col));ctx.restore();return z}
function tap(y,t,col){ctx.globalAlpha=.65+.35*Math.sin(T*4);tx(t||'Başlamak için dokun / tıkla',W/2,y,Math.max(16,Math.min(S*.05,30)),col);ctx.globalAlpha=1}
function over(t,l1,l2,col,rt){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);const z=Math.min(W*.11,70);tx(t,W/2,H*.34,z,col);tx(l1,W/2,H*.34+z*1.2,z*.5);if(l2)tx(l2,W/2,H*.34+z*1.9,z*.42,'#cbd');tap(H*.34+z*3.1,rt||'Tekrar için dokun / tıkla')}
/* ---- oyun ---- */
const C=8,RW=10,TM=90;
let st='title',g=[],cs=40,bx=0,by=0,ta=null,tb=null,tl=TM,sc=0,lv=1,msg='',msgT=0,bad=0;
const hc=v=>'hsl('+(v*38+5)+',75%,58%)';
const ft=Array.from({length:30},()=>({x:Math.random(),y:Math.random(),v:R(.03,.08),n:RI(1,10),z:R(.5,1.1)}));
function lay(){cs=Math.min((W-16)/C,(H-130)/RW,90);bx=(W-C*cs)/2;by=(H-RW*cs)/2+34}
function fill(){g=[];for(let r=0;r<RW;r++){g.push([]);for(let c=0;c<C;c++)g[r].push(RI(1,10))}}
function start(){fill();tl=TM;sc=0;lv=1;st='play';ta=tb=null;msgT=0}
function cellAt(x,y){return{r:Math.max(0,Math.min(RW-1,Math.floor((y-by)/cs))),c:Math.max(0,Math.min(C-1,Math.floor((x-bx)/cs)))}}
function rect(){return ta&&tb?{r1:Math.min(ta.r,tb.r),r2:Math.max(ta.r,tb.r),c1:Math.min(ta.c,tb.c),c2:Math.max(ta.c,tb.c)}:null}
function sum(q){let s=0,n=0;for(let r=q.r1;r<=q.r2;r++)for(let c=q.c1;c<=q.c2;c++)if(g[r][c]){s+=g[r][c];n++}return[s,n]}
function has(){for(let r1=0;r1<RW;r1++)for(let c1=0;c1<C;c1++)for(let r2=r1;r2<RW;r2++)for(let c2=c1;c2<C;c2++){const[s,n]=sum({r1,r2,c1,c2});if(s==10&&n>=2)return true;if(s>10)break}return false}
function toast(m){msg=m;msgT=1.5}
function onDown(x,y){if(st!='play'){start();return}ta=tb=cellAt(x,y)}
function onMove(x,y){if(ta)tb=cellAt(x,y)}
function onUp(x,y){if(!ta||st!='play')return;tb=cellAt(x,y);const q=rect(),[s,n]=sum(q);ta=tb=null;
 if(s==10&&n>=2){for(let r=q.r1;r<=q.r2;r++)for(let c=q.c1;c<=q.c2;c++)if(g[r][c]){burst(bx+(c+.5)*cs,by+(r+.5)*cs,hc(g[r][c]),6,200);g[r][c]=0}
  sc+=n*10+Math.max(0,n-2)*10;if(sc>best){best=sc;sv()}tl=Math.min(TM,tl+Math.max(.5,2-lv*.2));snd(500+n*60,.15,'triangle');
  if(g.every(r=>r.every(v=>!v))){sc+=200;lv++;fill();tl=Math.min(TM,tl+10);toast('Tahta temizlendi! +200');snd(880,.3,'triangle')}
  else if(!has()){let n2=0;const vs=g.flat().filter(v=>v);do{vs.sort(()=>Math.random()-.5);let k=0;g=g.map(r=>r.map(v=>v?vs[k++]:0))}while(!has()&&n2++<30);if(!has())fill();toast('Karıştırıldı')}}
 else if(n>=2){bad=.3;shake=4;snd(160,.15,'square')}}
function onKey(e){if(st!='play'&&(e.key=='Enter'||e.key==' '))start()}
function frame(dt){const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0b2a3a');gr.addColorStop(1,'#1b1040');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
 ctx.globalAlpha=.12;ft.forEach(f=>tx(f.n,f.x*W,((f.y+T*f.v)%1.2-.1)*H,50*f.z+20,'#fff'));ctx.globalAlpha=1;
 if(st=='title'){big('TOPLAM ON',W/2,H*.3,'#ffd43b','#ff922b');const s=Math.min(W*.17,80),a=[[3,7],[4,6],[2,8]];for(let i=0;i<3;i++){const x=W/2+(i-1)*(s*2.4)-s*.55,y=H*.53+Math.sin(T*2+i)*6;for(let k=0;k<2;k++){rr(x+k*(s*.62)-s*.3,y-s*.3,s*.58,s*.6,s*.12);ctx.fillStyle=hc(a[i][k]);ctx.fill();tx(a[i][k],x+k*(s*.62)-s*.01,y+2,s*.42,'#10182a')}}tx('Yan yana sayıları sürükle: toplam 10!',W/2,H*.66,Math.min(S*.04,22),'#cfe3f5');tap(H*.78);tx('En iyi puan: '+best,W/2,H*.85,Math.min(S*.04,22),'#9fb3d1');return}
 if(st=='play'){tl-=dt;if(tl<=0){tl=0;st='over';snd(160,.6,'sawtooth',.12,60)}if(msgT>0)msgT-=dt;if(bad>0)bad-=dt}
 const bw=Math.min(W-32,C*cs),f=tl/TM;rr((W-bw)/2,50,bw,10,5);ctx.fillStyle='rgba(255,255,255,.14)';ctx.fill();rr((W-bw)/2,50,Math.max(1,bw*f),10,5);ctx.fillStyle=tl>15?'#69db7c':'#ff6b6b';ctx.fill();
 tx('Puan '+sc,16,24,Math.min(22,W*.055),'#fff','left');tx('Seviye '+lv+'  ·  En iyi '+best,W/2+10,76,13,'#9fb3d1');tx(Math.ceil(tl)+' sn',W-56,24,Math.min(20,W*.05),tl>15?'#ffd43b':'#ff6b6b','right');
 const q=rect();
 for(let r=0;r<RW;r++)for(let c=0;c<C;c++){const v=g[r][c];if(!v)continue;const x=bx+c*cs+2,y=by+r*cs+2,s=cs-4,inn=q&&r>=q.r1&&r<=q.r2&&c>=q.c1&&c<=q.c2;ctx.save();if(inn){ctx.shadowColor='#fff';ctx.shadowBlur=12}rr(x,y,s,s,s*.2);ctx.fillStyle=hc(v);ctx.fill();ctx.restore();tx(v,x+s/2,y+s/2+1,s*.55,'#10182a')}
 if(q){const[s,n]=sum(q),ok=s==10&&n>=2,x=bx+q.c1*cs,y=by+q.r1*cs,w=(q.c2-q.c1+1)*cs,h=(q.r2-q.r1+1)*cs;rr(x,y,w,h,10);ctx.lineWidth=3;ctx.strokeStyle=ok?'#69db7c':s>10?'#ff6b6b':'#fff';ctx.stroke();const py=Math.max(by-14,y-18);rr(x+w/2-26,py-14,52,28,14);ctx.fillStyle=ok?'#2fbf71':s>10?'#c92a2a':'#334';ctx.fill();tx(s,x+w/2,py+1,18,'#fff')}
 if(bad>0){ctx.fillStyle='rgba(255,60,60,'+bad*.3+')';ctx.fillRect(0,0,W,H)}
 if(msgT>0){ctx.globalAlpha=Math.min(1,msgT*2);tx(msg,W/2,by-12,Math.min(S*.05,24),'#ffd43b');ctx.globalAlpha=1}
 if(st=='over')over('Süre doldu!','Puan: '+sc,'En iyi: '+best,'#ffd43b')}
rs();requestAnimationFrame(loop);
</script></body></html>
