<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kelebek Topla – KSB Games</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head>
<body><canvas id="c"></canvas><script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),ID='kelebek';let W=1,H=1,S=1,best=0,AC,muted=false,state='title',score=0,shake=0,tm=0,parts=[],ot=0;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);S=Math.min(W,H)}
addEventListener('resize',rs);rs();
try{best=+localStorage.getItem('ksb-'+ID+'-best')||0}catch(e){}
function sv(){if(score>best){best=score;try{localStorage.setItem('ksb-'+ID+'-best',best)}catch(e){}}}
function snd(f,d,t,v,sl){if(muted||!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);a.gain.setValueAtTime(v||.06,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function T(s,x,y,z,c,a,w){g.font=(w||700)+' '+z+'px Fredoka,Nunito,system-ui,sans-serif';g.textAlign=a||'center';g.textBaseline='middle';g.fillStyle=c||'#fff';g.fillText(s,x,y)}
function RR(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function P(x,y,n,c,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(sp||150)*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.7,c})}}
function upP(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt}parts=parts.filter(p=>p.l>0)}
function drP(){for(const p of parts){g.globalAlpha=Math.max(0,p.l/.7);g.fillStyle=p.c;g.fillRect(p.x-2,p.y-2,4,4)}g.globalAlpha=1}
function titleScr(name,sub,y0){const z=Math.min(S*.15,W*.92/(name.length*.62));y0=y0||H*.3;g.save();g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=z*.2;g.shadowOffsetY=z*.06;T(name,W/2,y0+Math.sin(tm*2)*z*.05,z,'#fff',0,800);g.restore();if(sub)T(sub,W/2,y0+z*.85,Math.max(13,z*.3),'rgba(255,255,255,.9)',0,500);g.globalAlpha=.65+.35*Math.sin(tm*4);T('Başlamak için dokun / tıkla',W/2,H*.78,Math.max(15,Math.min(S*.05,30)),'#fff',0,700);g.globalAlpha=1;if(best)T('En iyi: '+best,W/2,H*.78+Math.max(28,S*.08),Math.max(13,S*.035),'#ffe',0,500)}
function overScr(t,l2){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,H);const z=Math.min(S*.11,W*.9/(t.length*.62));T(t,W/2,H*.32,z,'#fff',0,800);T('Skor: '+score,W/2,H*.32+z*1.1,z*.55,'#ffd54a');T('En iyi: '+best,W/2,H*.32+z*1.8,z*.4,'#fff',0,500);if(l2)T(l2,W/2,H*.32+z*2.4,z*.35,'#cde',0,500);if(ot>.5){g.globalAlpha=.6+.4*Math.sin(tm*4);T('Tekrar için dokun / tıkla',W/2,H*.75,Math.max(15,Math.min(S*.05,30)));g.globalAlpha=1}}
const IN={down(){},up(){},mv(){},kd(){},ku(){}};
function initA(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
cv.addEventListener('pointerdown',e=>{e.preventDefault();initA();if(e.clientX>W-50&&e.clientY<50){muted=!muted;return}IN.down(e.clientX,e.clientY,e.pointerId)});
addEventListener('pointerup',e=>IN.up(e.clientX,e.clientY,e.pointerId));
addEventListener('pointercancel',e=>IN.up(e.clientX,e.clientY,e.pointerId));
addEventListener('pointermove',e=>IN.mv(e.clientX,e.clientY,e.pointerId));
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();initA();if(e.repeat)return;if(e.key==='m'||e.key==='M'){muted=!muted;return}IN.kd(e.key)});
addEventListener('keyup',e=>IN.ku(e.key));
function spk(){const x=W-26,y=26;g.save();g.globalAlpha=.8;g.fillStyle='#fff';g.fillRect(x-9,y-4,5,8);g.beginPath();g.moveTo(x-4,y-4);g.lineTo(x+2,y-9);g.lineTo(x+2,y+9);g.lineTo(x-4,y+4);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();if(muted){g.moveTo(x+5,y-5);g.lineTo(x+13,y+5);g.moveTo(x+13,y-5);g.lineTo(x+5,y+5)}else g.arc(x+2,y,7,-1,1);g.stroke();g.restore()}
let last=performance.now();
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;if(document.hidden)dt=0;tm+=dt;if(state==='over')ot+=dt;shake=Math.max(0,shake-dt*40);if(dt>0)step(dt);g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);render();g.restore();spk();requestAnimationFrame(loop)}
/* ---- game ---- */
const DAY=60,KD={n:{v:10,sp:.1,fl:.25,t:'Kelebek'},b:{v:30,sp:.17,fl:.45,t:'Mavi kelebek'},g:{v:100,sp:.24,fl:.6,t:'Altın kelebek!'}};
let bf=[],net={x:0,y:0,sw:0,cd:0},el=0,caught=0,ft=[],keys={},flowers=[];
const NC=['#ff8fab','#ffb347','#fff3a0','#c3a6ff','#ffffff','#ff6b6b'];
function prog(){return Math.min(1,el/DAY)}
function mk(){const r=Math.random(),p=prog(),k=r<.05+p*.05?'g':r<.2+p*.08?'b':'n',s=Math.random()<.5;bf.push({k,x:s?-20:W+20,y:H*(.15+Math.random()*.6),ang:s?0:Math.PI,ph:Math.random()*6,life:9+Math.random()*6,c:NC[Math.floor(Math.random()*NC.length)],s:S*(k==='n'?.035:.04)})}
function go(){if(state==='title'||(state==='over'&&ot>.6)){el=0;score=0;caught=0;bf=[];ft=[];net.x=W/2;net.y=H*.5;state='play'}}
function swing(){if(state!=='play'){go();return}if(net.cd>0)return;net.cd=.3;net.sw=.25;snd(250,.12,'sine',.04,300);const R=Math.max(S*.09,36);let hit=false;
 for(const b of bf){if(b.gone||b.dead)continue;if(Math.hypot(b.x-net.x,b.y-net.y)<R){b.dead=1;hit=true;const d=KD[b.k];score+=d.v;caught++;sv();ft.push({x:b.x,y:b.y,s:'+'+d.v,l:1,c:b.k==='g'?'#ffd23f':'#fff'});P(b.x,b.y,b.k==='g'?24:12,b.k==='g'?'#ffd23f':b.k==='b'?'#6ee7ff':b.c,170);snd(b.k==='n'?700:b.k==='b'?900:1200,.25,'triangle',.08,500);if(b.k!=='n')shake=4}}
 if(!hit)snd(150,.1,'sine',.03,-50)}
IN.down=(x,y)=>{if(state==='play'){net.x=x;net.y=y}swing()};IN.mv=(x,y)=>{if(state==='play'){net.x=x;net.y=y}};
IN.kd=k=>{keys[k]=1;if(k===' '||k==='Enter')swing()};IN.ku=k=>{delete keys[k]};
function step(dt){upP(dt);for(const f of ft){f.y-=40*dt;f.l-=dt}ft=ft.filter(f=>f.l>0);net.sw=Math.max(0,net.sw-dt);net.cd=Math.max(0,net.cd-dt);
 if(state==='play'){el+=dt;const sp=S*.7*dt;if(keys.ArrowLeft||keys.a)net.x-=sp;if(keys.ArrowRight||keys.d)net.x+=sp;if(keys.ArrowUp||keys.w)net.y-=sp;if(keys.ArrowDown||keys.s)net.y+=sp;net.x=Math.max(0,Math.min(W,net.x));net.y=Math.max(0,Math.min(H,net.y));if(el>=DAY){sv();state='over';ot=0}}
 const p=prog(),N=state==='title'?7:6+Math.floor(p*4);while(bf.filter(b=>!b.dead&&!b.gone).length<N)mk();
 for(const b of bf){if(b.dead||b.gone)continue;const d=KD[b.k];b.ph+=dt*(10+d.sp*30);b.life-=dt;b.ang+=(Math.random()-.5)*dt*9;const sp=S*d.sp*(1+p*.4)*dt;
  b.x+=Math.cos(b.ang)*sp;b.y+=Math.sin(b.ang)*sp+Math.sin(b.ph*.5)*22*dt;
  if(state==='play'){const dx=b.x-net.x,dy=b.y-net.y,dn=Math.hypot(dx,dy)||1;if(dn<S*.22){b.x+=dx/dn*S*d.fl*dt;b.y+=dy/dn*S*d.fl*dt}}
  if(b.life<0){b.y-=S*.3*dt;b.x+=Math.cos(b.ang)*sp;if(b.y<-30)b.gone=1}
  else{if(b.x<S*.03){b.x=S*.03;b.ang=Math.PI-b.ang}if(b.x>W-S*.03){b.x=W-S*.03;b.ang=Math.PI-b.ang}if(b.y<H*.1){b.y=H*.1;b.ang=-b.ang}if(b.y>H*.82){b.y=H*.82;b.ang=-b.ang}}}
 bf=bf.filter(b=>!b.dead&&!b.gone)}
function mix(a,b,t){return a.map((v,i)=>Math.round(v+(b[i]-v)*t))}
function sky(){const p=prog(),A=[[110,200,255],[255,140,80],[40,25,80]],B=[[205,238,255],[255,205,120],[110,60,140]],q=p<.6?p/.6:(p-.6)/.4,i=p<.6?0:1,t=mix(A[i],A[i+1],q),b=mix(B[i],B[i+1],q);const gr=g.createLinearGradient(0,0,0,H*.75);gr.addColorStop(0,'rgb('+t+')');gr.addColorStop(1,'rgb('+b+')');g.fillStyle=gr;g.fillRect(0,0,W,H);
 const sx=W*(.25+p*.5),sy=H*(.2+Math.pow(p,1.6)*.5),sr=S*.09;g.fillStyle='rgba(255,240,170,.35)';g.beginPath();g.arc(sx,sy,sr*1.6,0,7);g.fill();g.fillStyle=p<.5?'#fff3a0':'#ffb347';g.beginPath();g.arc(sx,sy,sr,0,7);g.fill();
 const cols=[[58,150,78],[40,125,62],[30,100,52]],dk=1-p*.55;for(let j=0;j<3;j++){g.fillStyle='rgb('+cols[j].map(v=>Math.round(v*dk))+')';g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=16)g.lineTo(x,H*(.62+j*.1)-Math.sin(x/(S*.25)+j*2)*S*.03*(3-j)*.6);g.lineTo(W,H);g.fill()}}
function bfly(b,ex){const d=KD[b.k],s=b.s,w=Math.abs(Math.cos(b.ph));g.save();g.translate(b.x,b.y);g.rotate(Math.cos(b.ang)>=0?.2:-.2);if(b.k!=='n'){g.shadowColor=b.k==='g'?'#ffd23f':'#6ee7ff';g.shadowBlur=s*.8}
 const c=b.k==='g'?'#ffcc1a':b.k==='b'?'#35c4ff':b.c,c2=b.k==='g'?'#fff2a0':b.k==='b'?'#c8f3ff':'#fff';for(const q of[-1,1]){g.fillStyle=c;g.beginPath();g.ellipse(q*s*.55*w,-s*.2,s*.6*w+1,s*.55,q*.3,0,7);g.fill();g.fillStyle=c2;g.beginPath();g.ellipse(q*s*.45*w,s*.35,s*.38*w+1,s*.34,-q*.3,0,7);g.fill();g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.arc(q*s*.6*w,-s*.25,s*.12,0,7);g.fill()}
 g.shadowBlur=0;g.fillStyle='#3a2a20';g.fillRect(-s*.07,-s*.5,s*.14,s*1.0);g.restore()}
function render(){sky();const p=prog();
 g.fillStyle='rgba(0,0,0,.0)';
 for(let i=0;i<60;i++){const x=(i*127.3)%W,y=H*.72+((i*53.1)%1)*0+((i*37)%100)/100*H*.28,sw=Math.sin(tm*1.5+i)*3,s=S*.012+((i*7)%5)*S*.002;g.strokeStyle='rgb(40,'+Math.round(110-p*50)+',50)';g.lineWidth=2;g.beginPath();g.moveTo(x,y+s*3);g.lineTo(x+sw,y);g.stroke();g.fillStyle=NC[i%6];g.beginPath();g.arc(x+sw,y,s,0,7);g.fill();g.fillStyle='#ffe066';g.beginPath();g.arc(x+sw,y,s*.35,0,7);g.fill()}
 for(const b of bf)bfly(b);
 g.fillStyle='rgba(20,10,60,'+(p*.4).toFixed(2)+')';g.fillRect(0,0,W,H);drP();
 for(const f of ft){g.globalAlpha=Math.min(1,f.l);T(f.s,f.x,f.y,S*.06,f.c);g.globalAlpha=1}
 if(state==='title'){g.fillStyle='rgba(0,0,0,.25)';g.fillRect(0,0,W,H);titleScr('Kelebek Topla','Güneş batmadan kelebekleri yakala!',H*.25);return}
 const R=Math.max(S*.09,36),sw=net.sw/.25,rr=R*(1+sw*.35);g.save();g.translate(net.x,net.y);g.rotate(-.35*sw);g.strokeStyle='#8a5a2b';g.lineWidth=Math.max(4,S*.01);g.lineCap='round';g.beginPath();g.moveTo(rr*.6,rr*.8);g.lineTo(rr*2.2,rr*3);g.stroke();
 g.fillStyle='rgba(255,255,255,'+(.18+sw*.25)+')';g.beginPath();g.arc(0,0,rr,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=Math.max(3,S*.008);g.stroke();g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1;for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(-rr,i*rr/3);g.lineTo(rr,i*rr/3);g.moveTo(i*rr/3,-rr);g.lineTo(i*rr/3,rr);g.stroke()}g.restore();
 const z=Math.max(15,Math.min(S*.05,26));T('Skor '+score,12,z+2,z*1.2,'#fff','left');T('Yakalanan: '+caught,12,z*2.5,z*.8,'#fff','left',500);
 const bw=Math.min(W*.5,S*.6),bx=(W-bw)/2-20;g.fillStyle='rgba(0,0,0,.3)';RR(bx,10,bw,10,5);g.fill();g.fillStyle='#ffb347';RR(bx,10,bw*(1-p),10,5);g.fill();T('Güneş batıyor',bx+bw/2,34,Math.max(11,z*.6),'#fff',0,500);
 if(state==='over')overScr('Güneş Battı!','Yakaladığın kelebek: '+caught)}
requestAnimationFrame(loop);
</script></body></html>
