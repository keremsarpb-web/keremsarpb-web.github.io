<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gökyüzü Zıplayışı — KSB Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#ff9a6b;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;left:0;top:0;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const ID='gokyuzu-ziplayisi',FONT='"Baloo 2","Trebuchet MS",system-ui,sans-serif',CW=400;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
var ready=false;
let W=0,H=0,DPR=1,U=1,colW=0,offX=0,VH=800;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){}return null;}
let best=+ls('ksb-'+ID+'-best')||0,muted=ls('ksb-'+ID+'-mute')==='1';
const rnd=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,k)=>a+(b-a)*k,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// ---------- audio ----------
let AC=null,NB=null;
function initAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,d,type,vol,f2,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05);}
function noise(d,vol,f,type){if(!AC||muted)return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}const t=AC.currentTime,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;fl.type=type||'lowpass';fl.frequency.value=f||1000;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d+.05);}
const sfx={
  bounce(){tone(330,.14,'sine',.12,700);},
  spring(){tone(200,.45,'triangle',.12,1400);tone(400,.3,'sine',.05,2000,.05);},
  crack(){noise(.25,.3,900);tone(160,.2,'square',.04,80);},
  fall(){tone(700,1,'triangle',.1,60);}
};
function toggleMute(){muted=!muted;ls('ksb-'+ID+'-mute',muted?'1':'0');}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  colW=Math.min(W,H*.62,560);offX=(W-colW)/2;U=colW/CW;VH=H/U;if(ready&&state==='title')reset();
}
addEventListener('resize',resize);resize();
// ---------- state ----------
const GR=1700,JV=880,SV=1450;
let state='title',paused=false,t=0,camY=0,topY=0,score=0,shake=0,overT=0,newBest=false,fallT=0;
let plats=[],parts=[],lastY=0;
const P={x:200,y:0,vx:0,vy:0,sq:0,face:1};
const keys={l:false,r:false},touches=new Map();
function addPlat(y,type,x,w){const p={x:x==null?rnd(0,CW-w):x,y,w,type,vx:type==='m'?rnd(60,120)*(Math.random()<.5?-1:1):0,broken:false,fy:0,spring:null};plats.push(p);return p;}
function gen(){
  while(lastY>camY-250){
    const d=clamp(-lastY/14000,0,1),gap=rnd(45+d*65,95+d*105),y=lastY-gap,w=78-d*20;
    const p=addPlat(y,Math.random()<.12+d*.3?'m':'n',null,w);
    if(p.type==='n'&&Math.random()<.07+d*.03&&y<-300)p.spring={o:rnd(8,w-30),c:0};
    if(Math.random()<.12+d*.2&&gap>70){const bw=72;let bx=rnd(0,CW-bw);if(Math.abs(bx-p.x)<bw)bx=(p.x+CW/2)%(CW-bw);addPlat(y+gap/2,'b',bx,bw);}
    lastY=y;
  }
}
function reset(){
  plats=[];parts=[];camY=-VH+90;lastY=0;addPlat(0,'n',CW/2-60,120);
  Object.assign(P,{x:CW/2,y:0,vx:0,vy:-JV,sq:0,face:1});topY=0;score=0;newBest=false;fallT=0;gen();
}
reset();ready=true;
function burst(x,y,n,col,sp,life,g){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=rnd(.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life*rnd(.5,1),m:life,c:col,s:rnd(2,5),g:g||0});}}
function start(){reset();state='play';}
function dirInput(){let d=(keys.r?1:0)-(keys.l?1:0);for(const v of touches.values())d+=v;return clamp(d,-1,1);}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();const x=e.clientX,y=e.clientY;
  if(x>W-56&&y<56){toggleMute();return;}
  if(state==='title'){start();}
  else if(state==='over'){if(overT>.8)start();return;}
  else if(paused){paused=false;return;}
  touches.set(e.pointerId,x<W/2?-1:1);try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{if(touches.has(e.pointerId))touches.set(e.pointerId,e.clientX<W/2?-1:1);});
function pup(e){touches.delete(e.pointerId);}
addEventListener('pointerup',pup);addEventListener('pointercancel',pup);
addEventListener('keydown',e=>{
  const k=e.code;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))e.preventDefault();
  if(k==='KeyM'){initAudio();toggleMute();return;}
  if(k==='ArrowLeft'||k==='KeyA')keys.l=true;if(k==='ArrowRight'||k==='KeyD')keys.r=true;
  if(e.repeat)return;
  if(k==='Space'||k==='Enter'||((k==='ArrowLeft'||k==='ArrowRight'||k==='KeyA'||k==='KeyD')&&state==='title')){initAudio();if(state==='title'||(state==='over'&&overT>.8))start();else if(paused)paused=false;}
});
addEventListener('keyup',e=>{const k=e.code;if(k==='ArrowLeft'||k==='KeyA')keys.l=false;if(k==='ArrowRight'||k==='KeyD')keys.r=false;});
addEventListener('blur',()=>{keys.l=keys.r=false;touches.clear();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='play')paused=true;keys.l=keys.r=false;touches.clear();if(AC)AC.suspend();}else if(AC&&AC.state==='suspended')AC.resume();});
// ---------- update ----------
function update(dt){
  t+=dt;shake=Math.max(0,shake-dt*30);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.l-=dt;}parts=parts.filter(p=>p.l>0);
  if(paused)return;
  if(state==='over'){overT+=dt;}
  for(const p of plats){
    if(p.type==='m'){p.x+=p.vx*dt;if(p.x<0){p.x=0;p.vx*=-1;}if(p.x>CW-p.w){p.x=CW-p.w;p.vx*=-1;}}
    if(p.broken){p.fy+=dt;p.y+=(300+p.fy*900)*dt;}
    if(p.spring&&p.spring.c>0)p.spring.c=Math.max(0,p.spring.c-dt*4);
  }
  if(state==='over'&&fallT>1.5)return;
  // player
  const dir=state==='play'?dirInput():0;
  P.vx+=(dir*390-P.vx)*Math.min(1,dt*9);if(dir)P.face=dir;
  P.x+=P.vx*dt;if(P.x<-22)P.x+=CW+44;if(P.x>CW+22)P.x-=CW+44;
  const prevY=P.y;P.vy+=GR*dt;P.y+=P.vy*dt;P.sq=Math.max(0,P.sq-dt*4);
  if(P.vy>0&&state!=='over'){
    for(const p of plats){
      if(p.broken)continue;
      if(prevY<=p.y+2&&P.y>=p.y&&P.x+16>p.x&&P.x-16<p.x+p.w){
        if(p.type==='b'){p.broken=true;sfx.crack();burst((p.x+p.w/2),p.y,14,'#a8743f',160,.6,600);continue;}
        P.y=p.y;
        if(p.spring&&P.x+14>p.x+p.spring.o&&P.x-14<p.x+p.spring.o+22){P.vy=-SV;p.spring.c=1;sfx.spring();shake=6;burst(P.x,P.y,22,'#ffe14d',320,.7,300);}
        else{P.vy=-JV;sfx.bounce();burst(P.x,P.y,8,'#ffffff',140,.4,200);}
        P.sq=1;break;
      }
    }
  }
  if(state==='title'){if(P.y>0){P.y=0;P.vy=-JV;P.sq=1;}return;}
  // camera
  const tgt=P.y-VH*.42;if(tgt<camY)camY=lerp(camY,tgt,Math.min(1,dt*10));
  if(state==='play'){
    topY=Math.min(topY,P.y);score=Math.max(0,Math.floor(-topY/10));gen();
    plats=plats.filter(p=>p.y<camY+VH+120);
    if(P.y>camY+VH+40){state='over';overT=0;fallT=0;sfx.fall();shake=10;if(score>best){best=score;newBest=true;ls('ksb-'+ID+'-best',best);}}
  }else{fallT+=dt;}
}
// ---------- draw ----------
const SKY=[[0,'#ff8a6b','#ffd59a'],[2500,'#c25cff','#ff8fb8'],[7000,'#3b2a8f','#a04fc4'],[14000,'#0b0a2a','#2c1a66'],[25000,'#020210','#0f0b33']];
function mix(a,b,k){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);const c=s=>Math.round(lerp((A>>s)&255,(B>>s)&255,k));return`rgb(${c(16)},${c(8)},${c(0)})`;}
function skyCols(alt){for(let i=0;i<SKY.length-1;i++){const a=SKY[i],b=SKY[i+1];if(alt<b[0]){const k=clamp((alt-a[0])/(b[0]-a[0]),0,1);return[mix(a[1],b[1],k),mix(a[2],b[2],k)];}}const l=SKY[SKY.length-1];return[l[1],l[2]];}
function hash(i){const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function bg(){
  const alt=Math.max(0,-(camY+VH-90)),c=skyCols(alt),g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,c[0]);g.addColorStop(1,c[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const sa=clamp((alt-4000)/8000,0,1);
  if(sa>0){ctx.fillStyle='#fff';for(let i=0;i<90;i++){const sx=hash(i)*W,sy=((hash(i+99)*H*1.5+(-camY*U*.1))%(H*1.5))-H*.25;ctx.globalAlpha=sa*(.4+.6*Math.abs(Math.sin(t*2+i)));ctx.fillRect(sx,sy,1.8,1.8);}ctx.globalAlpha=1;}
  if(alt<3000){const sy=H*.75+alt*U*.08;ctx.fillStyle='rgba(255,240,180,.8)';ctx.beginPath();ctx.arc(W*.5,sy,70*U,0,7);ctx.fill();}
  const cA=1-sa*.7,step=230,par=.45,base=camY*par;
  for(let i=Math.floor(base/step)-1;i<Math.floor((base+VH)/step)+2;i++){
    const wy=i*step,sy=(wy-base)*U,sx=offX+(hash(i)*1.4-.2)*colW,s=(.6+hash(i+7)*.8)*U;
    ctx.fillStyle=`rgba(255,255,255,${.35*cA})`;ctx.beginPath();ctx.arc(sx,sy,30*s,0,7);ctx.arc(sx+34*s,sy-14*s,38*s,0,7);ctx.arc(sx+72*s,sy,28*s,0,7);ctx.rect(sx,sy,72*s,28*s);ctx.fill();
  }
}
function drawPlat(p){
  const x=offX+p.x*U,y=(p.y-camY)*U,w=p.w*U,h=16*U;if(y<-40||y>H+40)return;
  ctx.save();
  if(p.type==='b'){ctx.globalAlpha=p.broken?Math.max(0,1-p.fy*1.5):1;ctx.fillStyle='#8a5a2b';
    if(p.broken){rr(x-4*U*p.fy*10,y,w/2-2,h,6*U);ctx.fill();rr(x+w/2+4*U*p.fy*10,y,w/2-2,h,6*U);ctx.fill();}
    else{rr(x,y,w,h,6*U);ctx.fill();ctx.strokeStyle='#4a2c10';ctx.lineWidth=2*U;ctx.beginPath();ctx.moveTo(x+w*.45,y);ctx.lineTo(x+w*.52,y+h*.5);ctx.lineTo(x+w*.46,y+h);ctx.moveTo(x+w*.2,y+3*U);ctx.lineTo(x+w*.28,y+h*.6);ctx.stroke();}
    ctx.restore();return;}
  const m=p.type==='m',c1=m?'#4cc9f0':'#5bd16a',c2=m?'#2475b8':'#2f8f42';
  ctx.fillStyle='rgba(0,0,0,.15)';rr(x+3*U,y+5*U,w,h,8*U);ctx.fill();
  ctx.fillStyle=c2;rr(x,y,w,h,8*U);ctx.fill();ctx.fillStyle=c1;rr(x,y,w,h*.6,8*U);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.45)';rr(x+6*U,y+2.5*U,w*.4,3*U,2*U);ctx.fill();
  if(p.spring){const sx=x+p.spring.o*U,c=p.spring.c,sh=(14-c*6)*U;ctx.strokeStyle='#d0d6e0';ctx.lineWidth=3*U;ctx.beginPath();
    for(let i=0;i<=4;i++){ctx.lineTo(sx+(i%2?18:4)*U,y-i*sh/4);}ctx.stroke();ctx.fillStyle='#ff4d6d';rr(sx,y-sh-5*U,22*U,6*U,3*U);ctx.fill();}
  ctx.restore();
}
function drawPlayer(){
  const x=offX+P.x*U,y=(P.y-camY)*U,s=U,sq=P.sq,st=P.vy<0?clamp(-P.vy/JV,0,1)*.15:0,sx=1+sq*.3-st,sy=1-sq*.3+st;
  ctx.save();ctx.translate(x,y);ctx.scale(sx,sy);
  ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(0,0,18*s,4*s,0,0,7);ctx.fill();
  const g=ctx.createRadialGradient(-7*s,-30*s,3*s,0,-20*s,24*s);g.addColorStop(0,'#c8fff0');g.addColorStop(1,'#1fc7a0');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-20*s,0);ctx.quadraticCurveTo(-22*s,-40*s,0,-42*s);ctx.quadraticCurveTo(22*s,-40*s,20*s,0);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#0f8a6e';ctx.lineWidth=2*s;ctx.stroke();
  const ex=P.face*4*s,ey=P.vy>0?-22*s:-26*s;
  for(const o of [-7,7]){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(o*s+ex*.5,ey,5.5*s,7*s,0,0,7);ctx.fill();ctx.fillStyle='#1a1a2e';ctx.beginPath();ctx.arc(o*s+ex,ey+(P.vy>0?2*s:-1*s),2.8*s,0,7);ctx.fill();}
  ctx.fillStyle='#ff8fb8';ctx.globalAlpha=.6;ctx.beginPath();ctx.arc(-12*s,-14*s,3.5*s,0,7);ctx.arc(12*s,-14*s,3.5*s,0,7);ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle='#0b5c49';ctx.lineWidth=2*s;ctx.beginPath();if(state==='over')ctx.arc(ex*.4,-10*s,4*s,Math.PI*1.1,Math.PI*1.9);else ctx.arc(ex*.4,-14*s,4*s,.2,Math.PI-.2);ctx.stroke();
  ctx.restore();
}
function text(s,x,y,size,col,align,stroke,wt){ctx.font=`${wt||800} ${size}px ${FONT}`;ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.lineJoin='round';
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=size*.18;ctx.strokeText(s,x,y);}ctx.fillStyle=col;ctx.fillText(s,x,y);}
function fit(s,size,maxW,wt){ctx.font=`${wt||800} ${size}px ${FONT}`;const w=ctx.measureText(s).width;return w>maxW?size*maxW/w:size;}
function drawMute(){const s=34,x=W-s-10,y=10;ctx.save();ctx.fillStyle='rgba(0,0,0,.3)';rr(x,y,s,s,9);ctx.fill();ctx.fillStyle='#fff';ctx.strokeStyle='#fff';ctx.lineWidth=2.2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x+8,y+13);ctx.lineTo(x+13,y+13);ctx.lineTo(x+19,y+8);ctx.lineTo(x+19,y+26);ctx.lineTo(x+13,y+21);ctx.lineTo(x+8,y+21);ctx.closePath();ctx.fill();
  ctx.beginPath();if(muted){ctx.moveTo(x+22,y+13);ctx.lineTo(x+29,y+21);ctx.moveTo(x+29,y+13);ctx.lineTo(x+22,y+21);}else{ctx.arc(x+20,y+17,5,-.9,.9);ctx.moveTo(x+25.5,y+10);ctx.arc(x+20,y+17,9,-.9,.9);}ctx.stroke();ctx.restore();}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.save();
  if(shake>0)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  bg();
  ctx.save();ctx.beginPath();ctx.rect(offX,0,colW,H);ctx.clip();
  for(const p of plats)drawPlat(p);
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(offX+p.x*U,(p.y-camY)*U,p.s*U,0,7);ctx.fill();}ctx.globalAlpha=1;
  drawPlayer();
  if(P.x<22||P.x>CW-22){const o=P.x;P.x=o<22?o+CW+44:o-CW-44;drawPlayer();P.x=o;}
  ctx.restore();
  if(offX>1){ctx.fillStyle='rgba(10,5,30,.45)';ctx.fillRect(0,0,offX,H);ctx.fillRect(offX+colW,0,W-offX-colW,H);ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(offX-2,0,2,H);ctx.fillRect(offX+colW,0,2,H);}
  ctx.restore();
  const m=Math.min(colW,H),cx=W/2,pulse=.55+.45*Math.sin(t*4);
  if(state==='title'){
    const s1=fit('GÖKYÜZÜ',Math.min(colW*.2,H*.12),colW*.88),ty=H*.24;
    text('GÖKYÜZÜ',cx,ty-s1*.5+Math.sin(t*2)*4,s1,'#ffffff','center','#7a2fb8');
    text('ZIPLAYIŞI',cx,ty+s1*.5-Math.sin(t*2)*4,fit('ZIPLAYIŞI',s1,colW*.88),'#ffe14d','center','#7a2fb8');
    ctx.globalAlpha=pulse;text('Başlamak için dokun / tıkla',cx,ty+s1*1.5,Math.max(16,m*.05),'#ffffff','center','#7a2fb8');ctx.globalAlpha=1;
    const h='← → / A D  ya da ekranın sol / sağ yarısına dokun';text(h,cx,ty+s1*1.5+Math.max(30,m*.08),fit(h,Math.max(12,m*.034),colW*.92,600),'#ffffff','center','rgba(90,30,120,.8)',600);
    if(best>0)text('En iyi: '+best,cx,H*.94,Math.max(16,m*.045),'#ffffff','center','#7a2fb8');
  }else{
    text(String(score),offX+16,34,Math.max(28,m*.08),'#ffffff','left','#5a1f8a');
    if(best>0)text('En iyi: '+best,offX+16,34+Math.max(32,m*.075),Math.max(13,m*.034),'#ffffff','left','#5a1f8a',600);
    if(state==='play'&&paused){ctx.fillStyle='rgba(30,10,60,.55)';ctx.fillRect(0,0,W,H);text('Duraklatıldı',cx,H*.42,Math.max(30,m*.1),'#fff','center','#7a2fb8');ctx.globalAlpha=pulse;text('Devam etmek için dokun',cx,H*.52,Math.max(16,m*.05),'#ffe14d','center','#7a2fb8');ctx.globalAlpha=1;}
    if(state==='over'){
      ctx.fillStyle=`rgba(30,10,60,${Math.min(.6,overT*1.2)})`;ctx.fillRect(0,0,W,H);
      text('DÜŞTÜN!',cx,H*.28,fit('DÜŞTÜN!',Math.min(colW*.18,H*.1),colW*.86),'#ffe14d','center','#7a2fb8');
      text(String(score),cx,H*.41,Math.max(48,m*.17),'#ffffff','center','#7a2fb8');
      text(newBest?'Yeni rekor!':'En iyi: '+best,cx,H*.51,Math.max(18,m*.055),newBest?'#ffe14d':'#ffffff','center','#7a2fb8');
      if(overT>.8){ctx.globalAlpha=pulse;text('Tekrar için dokun / tıkla',cx,H*.63,Math.max(16,m*.05),'#ffffff','center','#7a2fb8');ctx.globalAlpha=1;}
    }
  }
  drawMute();
}
let last=performance.now();
function frame(now){let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;if(dt>.05)dt=.05;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body>
</html>
