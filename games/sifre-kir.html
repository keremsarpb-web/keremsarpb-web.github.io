<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Åifre KÄ±r – KSB Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1a1030;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const ID='sifre-kir',FF='Fredoka,"Trebuchet MS",Arial,sans-serif',cv=document.getElementById('c'),g=cv.getContext('2d');
let W=0,H=0,DPR=1,state='title',T=0,shake=0,P=[],muted=false,best=0,AC=null,BL='En iyi';
try{best=+localStorage.getItem('ksb-'+ID+'-best')||0;muted=localStorage.getItem('ksb-muted')==='1'}catch(e){}
function setBest(v){best=v;try{localStorage.setItem('ksb-'+ID+'-best',v)}catch(e){}}
function rs(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
addEventListener('resize',rs);rs();
function snd(f,d,t,v,f2){d=d||.12;if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);a.gain.setValueAtTime(v||.07,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,.22,'triangle'),i*110))}
function lose(){snd(300,.4,'sawtooth',.06,90)}
function txt(s,x,y,sz,col,al,w){g.font=(w||700)+' '+sz+'px '+FF;g.textAlign=al||'center';g.textBaseline='middle';g.fillStyle=col||'#fff';g.fillText(s,x,y)}
function fit(s,sz,mw){g.font='700 '+sz+'px '+FF;const w=g.measureText(s).width;return w>mw?sz*mw/w:sz}
function rr(x,y,w,h,r,f,s,lw){g.beginPath();g.roundRect(x,y,w,h,r);if(f){g.fillStyle=f;g.fill()}if(s){g.lineWidth=lw||2;g.strokeStyle=s;g.stroke()}}
function btn(b,s,col){rr(b[0],b[1],b[2],b[3],b[3]*.3,col);txt(s,b[0]+b[2]/2,b[1]+b[3]/2+1,fit(s,b[3]*.45,b[2]*.9),'#fff')}
function inb(x,y,b){return !!b&&x>=b[0]&&x<=b[0]+b[2]&&y>=b[1]&&y<=b[1]+b[3]}
function grad(a,b){const q=g.createLinearGradient(0,0,0,H);q.addColorStop(0,a);q.addColorStop(1,b);g.fillStyle=q;g.fillRect(0,0,W,H)}
function spark(x,y,c,n,sp){n=n||12;sp=sp||160;for(let i=0;i<n;i++){const a=Math.random()*6.283,s=30+Math.random()*sp;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.5,c})}}
function drawP(dt){for(const p of P){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=240*dt;p.l-=dt;g.globalAlpha=Math.max(0,Math.min(1,p.l*2));g.fillStyle=p.c;g.fillRect(p.x-2,p.y-2,4,4)}g.globalAlpha=1;P=P.filter(p=>p.l>0)}
function drawTitle(name,sub,c1,c2,deco,acc){grad(c1,c2);deco(T);const m=Math.min(W,H),s=fit(name,Math.min(W*.2,H*.14),W*.88);g.save();g.shadowColor=acc;g.shadowBlur=30;txt(name,W/2,H*.36,s,'#fff');g.restore();txt(sub,W/2,H*.36+s*.85,fit(sub,m*.055,W*.9),acc);const t='Başlamak için dokun / tıkla';g.globalAlpha=.65+.35*Math.sin(T*4);txt(t,W/2,H*.72,fit(t,m*.06,W*.9));g.globalAlpha=1;if(best)txt(BL+': '+best,W/2,H*.72+m*.09,m*.04,'#ffffffbb')}
function drawMute(){const x=W-24,y=24;g.globalAlpha=.85;g.fillStyle='#fff';g.beginPath();g.moveTo(x-9,y-4);g.lineTo(x-4,y-4);g.lineTo(x+1,y-9);g.lineTo(x+1,y+9);g.lineTo(x-4,y+4);g.lineTo(x-9,y+4);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();if(muted){g.moveTo(x+5,y-5);g.lineTo(x+12,y+5);g.moveTo(x+12,y-5);g.lineTo(x+5,y+5)}else{g.arc(x+1,y,6,-.9,.9);g.moveTo(x+1+10*Math.cos(-.9),y+10*Math.sin(-.9));g.arc(x+1,y,10,-.9,.9)}g.stroke();g.globalAlpha=1}
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
function togM(){muted=!muted;try{localStorage.setItem('ksb-muted',muted?'1':'0')}catch(e){}}
function move(){}function up(){}function key(){}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const[x,y]=pos(e);if(x>W-48&&y<48){togM();return}try{cv.setPointerCapture(e.pointerId)}catch(_){}snd(1,.01,'sine',.001);if(state==='title'){state='play';start();snd(600,.15,'triangle');return}down(x,y)});
cv.addEventListener('pointermove',e=>{const[x,y]=pos(e);if(state!=='title')move(x,y)});
cv.addEventListener('pointerup',e=>{const[x,y]=pos(e);if(state!=='title')up(x,y)});
cv.addEventListener('pointercancel',()=>{if(state!=='title')up(-1,-1)});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault();if(e.key==='m'||e.key==='M'){togM();return}if(state==='title'){if(e.key===' '||e.key==='Enter'){state='play';start()}return}key(e.key,e)});
let last=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min((ts-last)/1000||0,.05);last=ts;if(document.hidden)return;T+=dt;g.setTransform(DPR,0,0,DPR,0,0);g.save();if(shake>0){shake=Math.max(0,shake-dt*40);g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake)}frame(dt);g.restore();g.setTransform(DPR,0,0,DPR,0,0);drawP(dt);drawMute()}
requestAnimationFrame(loop);
BL='Kırılan şifre';
const COL=['#ff4d5e','#ffb627','#44d96b','#32b5ff','#b266ff','#ff7ac8'],NM=['Kırmızı','Sarı','Yeşil','Mavi','Mor','Pembe'];
let secret=[],guesses=[],cur=[null,null,null,null],bt=[],pal=[],geo={},endT=0;
function start(){secret=[0,0,0,0].map(()=>Math.random()*6|0);guesses=[];cur=[null,null,null,null];state='play'}
function hints(s,gs){let b=0,w=0;const sc=Array(6).fill(0),gc=Array(6).fill(0);for(let i=0;i<4;i++){if(s[i]===gs[i])b++;else{sc[s[i]]++;gc[gs[i]]++}}for(let c=0;c<6;c++)w+=Math.min(sc[c],gc[c]);return[b,w]}
function addPeg(c){if(state!=='play')return;const i=cur.indexOf(null);if(i<0)return;cur[i]=c;snd(400+c*70,.07,'triangle')}
function delPeg(){if(state!=='play')return;for(let i=3;i>=0;i--)if(cur[i]!==null){cur[i]=null;snd(250,.05);return}}
function submit(){if(state!=='play'||cur.includes(null)){if(state==='play')snd(170,.1,'square',.05);return}
 const h=hints(secret,cur);guesses.push({g:cur.slice(),h});cur=[null,null,null,null];snd(520,.1);
 if(h[0]===4){state='win';endT=T;setBest(best+1);win();for(let k=0;k<10;k++)spark(W*Math.random(),H*.4*Math.random()+80,COL[k%6],16,260)}
 else if(guesses.length>=10){state='lose';endT=T;lose();shake=14}}
function down(x,y){
 if(state!=='play'){if(T-endT>.5)start();return}
 if(inb(x,y,bt[0])){delPeg();return}if(inb(x,y,bt[1])){submit();return}if(inb(x,y,bt[2])){start();return}
 pal.forEach((p,i)=>{if(Math.hypot(x-p.x,y-p.y)<p.r*1.25)addPeg(i)});
 const r=guesses.length;if(geo.ry&&Math.abs(y-geo.ry(r+1))<geo.rh/2)for(let k=0;k<4;k++)if(Math.abs(x-geo.px(k))<geo.pr*1.2&&cur[k]!==null){cur[k]=null;snd(250,.05)}}
function key(k){if(state!=='play'){if((k==='Enter'||k===' ')&&T-endT>.5)start();return}if(k>='1'&&k<='6')addPeg(+k-1);else if(k==='Backspace')delPeg();else if(k==='Enter')submit();else if(k==='r'||k==='R')start()}
function peg(x,y,r,c){g.save();if(c===null){g.fillStyle='rgba(255,255,255,.08)';g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=2;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.stroke()}else{g.shadowColor=COL[c];g.shadowBlur=10;const q=g.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);q.addColorStop(0,'#fff');q.addColorStop(.25,COL[c]);q.addColorStop(1,COL[c]);g.fillStyle=q;g.beginPath();g.arc(x,y,r,0,7);g.fill()}g.restore()}
function deco(t){for(let i=0;i<4;i++)peg(W/2+(i-1.5)*Math.min(W*.18,80),H*.86+Math.sin(t*2+i)*8,Math.min(W*.07,32),(i*5+Math.floor(t*.7))%6);
 for(let i=0;i<20;i++){g.fillStyle=COL[i%6];g.globalAlpha=.25;g.beginPath();g.arc((i*149)%W,((i*101+t*18)%(H+40))-20,5+i%4*4,0,7);g.fill()}g.globalAlpha=1}
function frame(dt){
 if(state==='title'){drawTitle('ŞİFRE KIR','Renk şifresini 10 denemede çöz','#1a1030','#35206a',deco,'#ffb627');return}
 grad('#1a1030','#2a1a52');
 const bw=Math.min(W-16,400),bx=(W-bw)/2,pr0=Math.min(28,bw/12-4),palY=H-52-pr0-18,top=56,rh=Math.min(56,(palY-pr0-10-top)/11);
 geo={rh,pr:rh*.36,ry:i=>top+i*rh+rh/2,px:k=>bx+34+k*((bw-34-76)/3.4)+rh*.4};
 pal=COL.map((_,i)=>({x:bx+(i+.5)*bw/6,y:palY,r:pr0}));
 const bh=44,b3=(bw-16)/3,by=H-bh-10;bt=[[bx,by,b3,bh],[bx+b3+8,by,b3,bh],[bx+2*(b3+8),by,b3,bh]];
 txt('Deneme '+Math.min(guesses.length+(state==='play'?1:0),10)+'/10',12,30,Math.min(22,W*.05),'#e6d9ff','left');
 rr(bx-4,top-2,bw+8,rh*11+4,12,'rgba(0,0,0,.28)');
 for(let r=0;r<11;r++){const y=geo.ry(r);
  if(r===0){for(let k=0;k<4;k++)state==='play'?(peg(geo.px(k),y,geo.pr,null),txt('?',geo.px(k),y+1,geo.pr,'#ffffff77')):peg(geo.px(k),y,geo.pr,secret[k]);txt('Şifre',bx+4,y,Math.min(13,rh*.28),'#ffffff99','left');continue}
  const gi=r-1,isCur=gi===guesses.length&&state==='play';
  if(isCur)rr(bx,y-rh/2+2,bw,rh-4,10,'rgba(255,255,255,.1)','#ffb62799',2);
  txt(r,bx+14,y,Math.min(14,rh*.3),isCur?'#ffb627':'#ffffff66');
  for(let k=0;k<4;k++)peg(geo.px(k),y,geo.pr,gi<guesses.length?guesses[gi].g[k]:isCur?cur[k]:null);
  if(gi<guesses.length){const[b,w]=guesses[gi].h,hx=bx+bw-34,hr=rh*.13;for(let k=0;k<4;k++){const c=k<b?'#fff':k<b+w?'#ffb627':null,hx2=hx+(k%2?1:-1)*hr*1.7,hy=y+(k>1?1:-1)*hr*1.7;g.fillStyle=c||'rgba(255,255,255,.12)';g.beginPath();g.arc(hx2,hy,hr,0,7);g.fill();if(c==='#fff'){g.strokeStyle='#000';g.lineWidth=1;g.stroke()}}}}
 pal.forEach((p,i)=>{peg(p.x,p.y,p.r,i);txt(i+1,p.x,p.y+1,p.r*.7,'#0008')});
 btn(bt[0],'Sil','#4a3a85');btn(bt[1],'Tamam',cur.includes(null)?'#3a3a55':'#2e9b5e');btn(bt[2],'Yeni oyun','#8a4a9a');
 txt('Beyaz: doğru yer · Sarı: yanlış yer',W/2,H-bh-10-pr0*2-34,Math.min(13,W*.032),'#ffffff88');
 if(state!=='play'){g.fillStyle='rgba(10,5,25,.7)';g.fillRect(0,top+rh,W,H-top-rh);const ok=state==='win';txt(ok?'Şifreyi kırdın!':'Şifre kırılamadı',W/2,H*.5,fit('Şifre kırılamadı',Math.min(W*.12,80),W*.88),ok?'#ffd75e':'#ff8a8a');txt(ok?guesses.length+' denemede çözdün':'Şifre yukarıda',W/2,H*.5+54,22);txt(BL+': '+best,W/2,H*.5+88,18,'#e6d9ffcc');g.globalAlpha=.7+.3*Math.sin(T*4);txt('Yeni oyun için dokun',W/2,H*.5+130,20);g.globalAlpha=1}}

</script></body></html>
