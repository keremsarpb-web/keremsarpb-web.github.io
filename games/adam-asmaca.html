<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Adam Asmaca · KSB Games</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1b1426;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100vw;height:100vh;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const KEY='ksb-adam-asmaca-best';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,S,best=0,muted=false,AC,last=0,shake=0,parts=[],T=0;
try{best=+localStorage.getItem(KEY)||0}catch(e){}
const sv=()=>{try{localStorage.setItem(KEY,best)}catch(e){}};
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b));
function rs(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);S=Math.min(W,H);if(window.lay)lay()}
addEventListener('resize',rs);
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function tx(s,x,y,z,col,al,wt){ctx.font=(wt||800)+' '+z+'px system-ui,"Segoe UI",sans-serif';ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y)}
function snd(f,d,ty,v,f2){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function burst(x,y,c,n,sp){for(let i=0;i<(n||12);i++){const a=R(0,6.28),s=R(.3,1)*(sp||220);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:R(.4,.8),m:.8,c})}}
function dparts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,6.3);ctx.fill()}ctx.globalAlpha=1}
function spk(){const x=W-22,y=22;ctx.save();ctx.globalAlpha=.8;ctx.fillStyle='#fff';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-9,y-3);ctx.lineTo(x-4,y-3);ctx.lineTo(x+1,y-8);ctx.lineTo(x+1,y+8);ctx.lineTo(x-4,y+3);ctx.lineTo(x-9,y+3);ctx.fill();ctx.beginPath();if(muted){ctx.moveTo(x+5,y-5);ctx.lineTo(x+13,y+5);ctx.moveTo(x+13,y-5);ctx.lineTo(x+5,y+5)}else{ctx.arc(x+2,y,6,-1,1);ctx.moveTo(x+2+Math.cos(-1)*11,y+Math.sin(-1)*11);ctx.arc(x+2,y,11,-1,1)}ctx.stroke();ctx.restore()}
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;if(document.hidden)return;T+=dt;ctx.save();if(shake>0){ctx.translate(R(-shake,shake),R(-shake,shake));shake=Math.max(0,shake-dt*40)}frame(dt);dparts(dt);ctx.restore();spk()}
function pt(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}const[x,y]=pt(e);if(x>W-44&&y<44){muted=!muted;return}onDown(x,y)});
cv.addEventListener('pointermove',e=>{const[x,y]=pt(e);if(window.onMove)onMove(x,y)});
cv.addEventListener('pointerup',e=>{const[x,y]=pt(e);if(window.onUp)onUp(x,y)});
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.key==' ')e.preventDefault();if(e.key=='m'||e.key=='M'){muted=!muted;return}if(window.onKey)onKey(e)});
addEventListener('contextmenu',e=>e.preventDefault());
function big(name,cx,cy,col,glow){const ws=W<H?name.split(' '):[name],ml=Math.max(...ws.map(w=>w.length)),z=Math.min(W*.9/(ml*.76),H*.13,140);ctx.save();ctx.shadowColor=glow||col;ctx.shadowBlur=z*.5;ws.forEach((w,i)=>tx(w,cx,cy+(i-(ws.length-1)/2)*z*1.12,z,col));ctx.restore();return z}
function tap(y,t,col){ctx.globalAlpha=.65+.35*Math.sin(T*4);tx(t||'Başlamak için dokun / tıkla',W/2,y,Math.max(16,Math.min(S*.05,30)),col);ctx.globalAlpha=1}
function over(t,l1,l2,col,rt){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);const z=Math.min(W*.11,70);tx(t,W/2,H*.34,z,col);tx(l1,W/2,H*.34+z*1.2,z*.5);if(l2)tx(l2,W/2,H*.34+z*1.9,z*.42,'#cbd');tap(H*.34+z*3.1,rt||'Tekrar için dokun / tıkla')}
function btn(b,label,col){rr(b.x,b.y,b.w,b.h,10);ctx.fillStyle=col||'#334';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;ctx.stroke();tx(label,b.x+b.w/2,b.y+b.h/2+1,Math.min(b.h*.45,18))}
const hit=(b,x,y)=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;
/* ---- oyun ---- */
const CATS={'Hayvanlar':'KEDİ KÖPEK ASLAN TAVŞAN KAPLAN ZÜRAFA PENGUEN KARTAL DELFİN KAPLUMBAĞA SİNCAP KURBAĞA',
'Meyveler':'ELMA ARMUT KİRAZ ÇİLEK KARPUZ ŞEFTALİ MANDALİNA ERİK İNCİR ÜZÜM VİŞNE NAR',
'Şehirler':'ANKARA İZMİR BURSA ADANA KONYA TRABZON ANTALYA ERZURUM SAMSUN MARDİN EDİRNE ESKİŞEHİR',
'Eşyalar':'MASA SANDALYE BARDAK TELEFON ŞEMSİYE ANAHTAR MAKAS DEFTER KALEM TELEVİZYON BİLGİSAYAR SAAT',
'Meslekler':'DOKTOR ÖĞRETMEN PİLOT AŞÇI MARANGOZ ŞOFÖR AVUKAT MÜHENDİS ÇİFTÇİ GAZETECİ POLİS BERBER'};
const NAMES=Object.keys(CATS).concat('Karışık');
const ROWS=['ERTYUIOPĞÜ','ASDFGHJKLŞİ','ZCVBNMÖÇ'];
let st='title',cat='',word='',gs=new Set(),wrong=0,score=0,lost=false,keys=[],cb=[],man={x:0,y:0,s:200},wy=0,lastW='';
const NB={x:8,y:10,w:92,h:34};
const fl=Array.from({length:18},()=>({x:Math.random(),v:R(.03,.07),ph:R(0,6),z:R(.5,1)}));
function lay(){const kw=Math.min((W-8)/12.1,58),kh=Math.min(56,H*.07),gap=kw*.1,y0=H-3*(kh+gap)-10;keys=[];ROWS.forEach((r,ri)=>{const ch=[...r],tot=ch.length*(kw+gap)-gap;ch.forEach((c,i)=>keys.push({c,x:(W-tot)/2+i*(kw+gap),y:y0+ri*(kh+gap),w:kw,h:kh}))});
 const av=y0-64,hh=Math.min(av*.62,300,W*.8);man={x:W/2-hh/2,y:64,s:hh};wy=64+hh+(av-hh)/2;
 const bw=Math.min(W-40,360),bh=Math.min(58,H*.085);cb=NAMES.map((n,i)=>({n,x:(W-bw)/2,y:H*.2+i*(bh+12),w:bw,h:bh}))}
function pick(){const pool=cat=='Karışık'?Object.values(CATS).join(' ').split(' '):CATS[cat].split(' ');let w;do w=pool[RI(0,pool.length)];while(w==lastW&&pool.length>1);word=lastW=w;gs=new Set();wrong=0;lost=false;st='play'}
function guess(c){if(st!='play'||gs.has(c))return;gs.add(c);if(word.includes(c)){snd(520+RI(0,4)*60,.12,'triangle');if([...word].every(l=>gs.has(l))){score+=10+(7-wrong)*5;if(score>best){best=score;sv()}st='over';lost=false;burst(W/2,wy,'#ffd166',40,320);[523,659,784].forEach((f,i)=>setTimeout(()=>snd(f,.2,'triangle'),i*110))}}
 else{wrong++;shake=8;snd(180,.25,'sawtooth',.1,90);if(wrong>=7){st='over';lost=true;snd(120,.6,'sawtooth',.12,50)}}}
function onDown(x,y){if(st=='title'){st='cat';return}if(st=='cat'){for(const b of cb)if(hit(b,x,y)){cat=b.n;score=0;pick();return}return}
 if(hit(NB,x,y)){st='cat';return}if(st=='over'){if(lost){score=0;st='cat'}else pick();return}for(const k of keys)if(hit(k,x,y)){guess(k.c);return}}
function onKey(e){if(st=='title'){if(e.key=='Enter'||e.key==' ')st='cat';return}if(st=='cat'){const n=+e.key;if(n>=1&&n<=6){cat=NAMES[n-1];score=0;pick()}return}if(st=='over'){if(e.key=='Enter'||e.key==' '){if(lost){score=0;st='cat'}else pick()}return}const c=e.key.toLocaleUpperCase('tr');if(c.length==1&&ROWS.join('').includes(c))guess(c)}
function ln(a,b,c,d){ctx.moveTo(a,b);ctx.lineTo(c,d)}
function drawMan(x,y,s,n){ctx.save();ctx.translate(x,y);ctx.lineCap='round';ctx.lineWidth=s*.03;ctx.strokeStyle='#c98f55';ctx.beginPath();ln(.1*s,.95*s,.7*s,.95*s);ln(.25*s,.95*s,.25*s,.05*s);ln(.25*s,.05*s,.62*s,.05*s);ln(.25*s,.25*s,.4*s,.05*s);ctx.stroke();
 ctx.strokeStyle='#f4e9d8';ctx.beginPath();ln(.62*s,.05*s,.62*s,.2*s);ctx.stroke();ctx.beginPath();
 if(n>=1){ctx.moveTo(.62*s+.08*s,.28*s);ctx.arc(.62*s,.28*s,.08*s,0,6.3)}if(n>=2)ln(.62*s,.36*s,.62*s,.62*s);if(n>=3)ln(.62*s,.43*s,.5*s,.55*s);if(n>=4)ln(.62*s,.43*s,.74*s,.55*s);if(n>=5)ln(.62*s,.62*s,.52*s,.8*s);if(n>=6)ln(.62*s,.62*s,.72*s,.8*s);ctx.stroke();
 if(n>=7){ctx.strokeStyle='#ff6b6b';ctx.lineWidth=s*.015;ctx.beginPath();for(const dx of[-1,1]){const ex=.62*s+dx*.03*s,ey=.265*s,q=.014*s;ln(ex-q,ey-q,ex+q,ey+q);ln(ex+q,ey-q,ex-q,ey+q)}ctx.stroke()}ctx.restore()}
function frame(dt){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1b1426');g.addColorStop(1,'#3a1f3d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba(255,220,150,.08)';fl.forEach(f=>{ctx.beginPath();ctx.arc(f.x*W+Math.sin(T+f.ph)*30,H-((T*f.v+f.ph)%1)*H,20+f.z*40,0,6.3);ctx.fill()});
 if(st=='title'){big('ADAM ASMACA',W/2,H*.3,'#ffcf7a','#ff8a3d');const s=Math.min(W*.6,H*.32,300);drawMan(W/2-s/2,H*.43,s,Math.floor(T*1.3)%8);tap(H*.86);tx('En iyi puan: '+best,W/2,H*.92,Math.min(S*.04,22),'#b9a6c9');return}
 if(st=='cat'){tx('Kategori seç',W/2,H*.11,Math.min(S*.08,50),'#ffcf7a');cb.forEach((b,i)=>btn(b,(i+1)+'  '+b.n,['#5b3a8c','#8c3a5b','#2f6f8c','#3a8c5b','#8c6f2f','#444b8c'][i]));return}
 tx('Kategori: '+cat,W/2,24,Math.min(20,W*.045),'#ffcf7a');tx('Puan '+score+'  ·  En iyi '+best+'  ·  Hak '+(7-wrong),W/2,50,14,'#b9a6c9');btn(NB,'Yeni oyun','#4a2f66');
 drawMan(man.x,man.y,man.s,wrong);
 const L=[...word],cw=Math.min(W*.92/L.length,58),x0=W/2-L.length*cw/2;
 L.forEach((c,i)=>{const x=x0+i*cw+cw/2,sh=gs.has(c);ctx.strokeStyle=sh?'#6ee7a0':'#8b7aa5';ctx.lineWidth=3;ctx.beginPath();ln(x-cw*.4,wy+cw*.5,x+cw*.4,wy+cw*.5);ctx.stroke();if(sh||(st=='over'&&lost))tx(c,x,wy,cw*.8,sh?'#fff':'#ff8a8a')});
 for(const k of keys){const u=gs.has(k.c),ok=u&&word.includes(k.c);rr(k.x,k.y,k.w,k.h,6);ctx.fillStyle=ok?'#2fbf71':u?'#3a2233':'#4a3a6a';ctx.fill();tx(k.c,k.x+k.w/2,k.y+k.h/2+1,k.h*.42,u&&!ok?'#7a6677':'#fff')}
 if(st=='over')over(lost?'Asıldın!':'Bildin!',lost?'Kelime: '+word:'+'+(10+(7-wrong)*5)+' puan','Puan: '+score+'  ·  En iyi: '+best,lost?'#ff6b6b':'#6ee7a0',lost?'Kategori seçmek için dokun':'Sıradaki kelime için dokun')}
rs();requestAnimationFrame(loop);
</script></body></html>
