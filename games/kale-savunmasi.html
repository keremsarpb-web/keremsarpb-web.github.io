<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kale Savunması – KSB Games</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const ID='kale-savunmasi',NAME='Kale Savunması',SUB='Sur üstünden ok yağdır',COL='#ffd54a';
const cv=document.getElementById('c'),g=cv.getContext('2d');let W=0,H=0;
function rs(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
let best=0,muted=false,AC=null,state='title',score=0,shake=0,T=0,st=0,parts=[],omsg='',ohead='Oyun Bitti',fmt=v=>Math.floor(v);
try{best=+localStorage.getItem('ksb-'+ID+'-best')||0}catch(e){}
function end(m,h){saveBest();state='over';st=0;omsg=m||'';ohead=h||'Oyun Bitti'}
function saveBest(){score=Math.floor(score);if(score>best){best=score;try{localStorage.setItem('ksb-'+ID+'-best',String(best))}catch(e){}}}
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
function snd(f,d=.1,ty='square',v=.05,s=0){if(muted||!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),n+d);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function burst(x,y,c,n=10,sp=150){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.4+Math.random()*.4,c,r:2+Math.random()*3})}}
function updParts(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.l-=dt}parts=parts.filter(p=>p.l>0)}
function drawParts(){for(const p of parts){g.globalAlpha=Math.min(1,p.l*2);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.fill()}g.globalAlpha=1}
function txt(s,x,y,sz,c='#fff',al='center'){g.font='900 '+sz+'px "Trebuchet MS",Arial,sans-serif';g.textAlign=al;g.textBaseline='middle';g.fillStyle=c;g.fillText(s,x,y)}
function icon(){g.save();g.translate(W-28,28);g.globalAlpha=.85;g.fillStyle=g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(-9,-4);g.lineTo(-4,-4);g.lineTo(2,-9);g.lineTo(2,9);g.lineTo(-4,4);g.lineTo(-9,4);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(6,-5);g.lineTo(14,5);g.moveTo(14,-5);g.lineTo(6,5)}else{g.arc(3,0,6,-1,1);g.moveTo(3+11*Math.cos(-1),11*Math.sin(-1));g.arc(3,0,11,-1,1)}g.stroke();g.restore()}
function title(){g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,0,W,H);const ws=NAME.split(' '),port=W<H*.85,ls=port?ws:[NAME];let sz=Math.min(port?W*.2:W*.08,H*.13);const fit=()=>g.font='900 '+sz+'px "Trebuchet MS",Arial';fit();while(Math.max(...ls.map(l=>g.measureText(l).width))>W*.9){sz*=.92;fit()}const y0=H*.32-(ls.length-1)*sz*.55;g.shadowColor=COL;g.shadowBlur=30;ls.forEach((l,i)=>txt(l,W/2,y0+i*sz*1.1,sz));g.shadowBlur=0;const ss=Math.min(W*.05,26);txt(SUB,W/2,y0+ls.length*sz*1.1+ss*.4,ss,COL);g.globalAlpha=.65+.35*Math.sin(T*4);txt('Başlamak için dokun / tıkla',W/2,H*.7,Math.min(W*.065,30));g.globalAlpha=1;if(best)txt('En iyi: '+fmt(best),W/2,H*.78,Math.min(W*.05,22),COL);icon()}
function over(){g.fillStyle='rgba(0,0,0,.62)';g.fillRect(0,0,W,H);const u=Math.min(W,H*.8);txt(ohead,W/2,H*.28,Math.min(u*.14,70));if(omsg)txt(omsg,W/2,H*.37,Math.min(u*.055,26),'#ccc');txt(fmt(score),W/2,H*.47,Math.min(u*.18,90),COL);txt(score>=best&&score>0?'Yeni rekor!':'En iyi: '+fmt(best),W/2,H*.57,Math.min(u*.06,28),'#ffd54a');if(st>.7){g.globalAlpha=.65+.35*Math.sin(T*4);txt('Tekrar için dokun / tıkla',W/2,H*.7,Math.min(u*.06,28));g.globalAlpha=1}icon()}
const P={x:0,y:0,down:false},keys={};
function pos(e){const r=cv.getBoundingClientRect();P.x=e.clientX-r.left;P.y=e.clientY-r.top}
function gate(){if(state=='title'&&st>.15){start();return true}if(state=='over'&&st>.7){start();return true}return state!='play'}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();pos(e);if(P.x>W-56&&P.y<56){muted=!muted;return}if(gate())return;P.down=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}typeof onDown=='function'&&onDown()});
cv.addEventListener('pointermove',e=>{pos(e);typeof onMove=='function'&&onMove()});
const pu=()=>{if(P.down){P.down=false;typeof onUp=='function'&&onUp()}};
addEventListener('pointerup',pu);addEventListener('pointercancel',pu);
addEventListener('keydown',e=>{ac();const k=e.key;if(k.startsWith('Arrow')||k==' ')e.preventDefault();if(k=='m'||k=='M'){muted=!muted;return}if(state!='play'){if(k==' '||k=='Enter')gate();return}if(!keys[k])typeof onKey=='function'&&onKey(k);keys[k]=1});
addEventListener('keyup',e=>keys[e.key]=0);cv.addEventListener('contextmenu',e=>e.preventDefault());
let last=performance.now();
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.033,(t-last)/1000||0);last=t;if(document.hidden)return;T+=dt;st+=dt;if(state=='play')upd(dt);updParts(dt);g.save();if(shake>.1){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=Math.pow(.02,dt)}else shake=0;draw();g.restore();if(state=='title')title();else if(state=='over')over()}
requestAnimationFrame(loop);
/* ---- oyun ---- */
let en=[],ar=[],wall,kills,spT,pt,sx,sy,aim=null,cdA;
const K=()=>Math.max(.7,Math.min(1.3,H/700)),GY=()=>H*.84,WX=()=>W*(W<H?.2:.14),WT=()=>H*.62,GR=()=>900*K();
const AX=()=>WX()*.55,AY=()=>WT()-34*K(),MAXP=()=>Math.min(150,Math.min(W,H)*.35);
function vel(){const p=MAXP(),d=Math.min(Math.hypot(sx-P.x,sy-P.y),p),a=Math.atan2(sy-P.y,sx-P.x),v=Math.sqrt(1.25*W*GR())*(.25+.75*d/p);return{a,d,vx:Math.cos(a)*v,vy:Math.sin(a)*v}}
function start(){en=[];ar=[];wall=100;kills=0;spT=1;pt=0;score=0;parts=[];aim=null;cdA=0;state='play';st=0}
function onDown(){sx=P.x;sy=P.y;aim=true}
function onUp(){if(!aim)return;aim=null;const v=vel();if(v.d<18||cdA>0||v.vx<=0&&false)return;cdA=.4;ar.push({x:AX(),y:AY(),vx:v.vx,vy:v.vy,l:0});snd(260,.15,'triangle',.07,500)}
function wave(){return 1+Math.floor(kills/8)}
function upd(dt){
 const k=K(),gy=GY(),w=WX();pt+=dt;cdA-=dt;spT-=dt;
 if(spT<=0){const wv=wave(),r=Math.random(),ty=wv>=3&&r<.15?2:wv>=2&&r<.4?1:0,hp=ty==2?10+wv*2:ty==1?4+Math.floor(wv/3):2+Math.floor(wv/4);en.push({x:W+30,ty,hp,mh:hp,sp:(ty==2?22:ty==1?60:34)*k+wv*2.5*k,ph:Math.random()*6});spT=Math.max(.7,2.2-wv*.12)*(.7+Math.random()*.6)}
 for(const e of en){const hw=(e.ty==2?22:14)*k;if(e.x-hw>w+4){e.x-=e.sp*dt}else{wall-=(e.ty==2?12:5)*dt;if(Math.random()<dt*6)burst(w,gy-20*k,'#aaa',2,60);shake=Math.max(shake,2)}}
 for(const a of ar){for(let s=0;s<3;s++){if(a.stuck)break;const d=dt/3;a.vy+=GR()*d;a.x+=a.vx*d;a.y+=a.vy*d;
   if(!a.stuck){for(const e of en){const hh=(e.ty==2?58:40)*k,hw=(e.ty==2?22:14)*k;if(e.hp>0&&a.x>e.x-hw&&a.x<e.x+hw&&a.y>gy-hh&&a.y<gy){const hs=a.y<gy-hh*.7,dm=hs?2:1;e.hp-=dm;a.dead=1;burst(a.x,a.y,hs?'#ffd54a':'#ff6a6a',hs?12:7,160);if(hs){parts.push({x:a.x,y:a.y-10,vx:0,vy:-60,l:.6,c:'#ffd54a',r:0});snd(900,.1,'square',.05,300)}else snd(300,.1,'square',.05);if(e.hp<=0){e.dead=1;kills++;score+=e.ty==2?50:e.ty==1?20:10;burst(e.x,gy-hh/2,'#fff',10,200)}break}}
   if(a.dead)break;if(a.y>=gy){a.stuck=1;a.l=1.2}}}}
 for(const a of ar)if(a.stuck){a.l-=dt;if(a.l<=0)a.dead=1}
 ar=ar.filter(a=>!a.dead&&a.x<W+200&&a.x>-100);en=en.filter(e=>!e.dead);
 if(wall<=0){snd(100,.8,'sawtooth',.1,-50);shake=26;end('Kale düştü — '+kills+' düşman')}
}
function soldier(x,gy,k,e,ph){const big=e&&e.ty==2,r=(big?22:14)*k,w=Math.sin(T*8+ph)*4*k,c=e?['#c0392b','#2e86c1','#6c3483'][e.ty]:'#c0392b';g.fillStyle='#222';g.fillRect(x-r*.6+w,gy-r*.9,r*.5,r*.9);g.fillRect(x+r*.1-w,gy-r*.9,r*.5,r*.9);g.fillStyle=c;g.fillRect(x-r*.7,gy-r*2.1,r*1.4,r*1.3);g.fillStyle='#f0c8a0';g.beginPath();g.arc(x,gy-r*2.5,r*.5,0,6.283);g.fill();g.fillStyle='#555';g.beginPath();g.arc(x,gy-r*2.6,r*.55,3.14,6.283);g.fill();if(e&&e.ty==1){g.fillStyle='#bbb';g.beginPath();g.ellipse(x-r*.8,gy-r*1.5,r*.4,r*.8,0,0,6.283);g.fill()}g.fillStyle='#ccc';g.fillRect(x+r*.7,gy-r*2.6,3,r*1.6);if(e&&e.hp<e.mh){g.fillStyle='#000';g.fillRect(x-r,gy-r*3.4,r*2,4);g.fillStyle='#6bd96b';g.fillRect(x-r,gy-r*3.4,r*2*e.hp/e.mh,4)}}
function draw(){
 const k=K(),gy=GY(),w=WX(),wt=WT(),live=state!='title';
 const gr=g.createLinearGradient(0,0,0,gy);gr.addColorStop(0,'#2d1b5e');gr.addColorStop(.6,'#e0607e');gr.addColorStop(1,'#ffc371');g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.fillStyle='#fff3c4';g.beginPath();g.arc(W*.7,gy-110*k,34*k,0,6.283);g.fill();
 g.fillStyle='#4a2a63';g.beginPath();g.moveTo(0,gy);for(let x=0;x<=W+10;x+=10)g.lineTo(x,gy-50*k-(26*Math.sin(x*.011+1)+16*Math.sin(x*.027))*k);g.lineTo(W,gy);g.fill();
 g.fillStyle='#3d6b3a';g.fillRect(0,gy,W,H-gy);g.fillStyle='#52884a';g.fillRect(0,gy,W,5*k);
 if(live)for(const e of en)soldier(e.x,gy,k,e,e.ph);else for(let i=0;i<6;i++)soldier(((W+60)-((T*38*k+i*(W/5))%(W+120))),gy,k,null,i);
 const dmg=live?1-wall/100:0;g.fillStyle='#8d8d99';g.fillRect(0,wt,w,H-wt);g.fillStyle='#a5a5b3';g.fillRect(0,wt,w,10*k);const nc=Math.max(2,Math.round(w/(26*k)));for(let i=0;i<nc;i++)g.fillRect(i*w/nc+2,wt-14*k,w/nc*.55,14*k);
 g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=1.5;for(let y=wt+24*k;y<H;y+=24*k){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}
 if(dmg>.3){g.strokeStyle='#333';g.beginPath();g.moveTo(w*.3,wt+20*k);g.lineTo(w*.5,wt+70*k);g.lineTo(w*.35,wt+110*k);g.stroke()}
 const ax=AX(),ay=AY();let ang=-.6;if(live&&aim){const v=vel();ang=v.a}else if(!live)ang=-.7+Math.sin(T*1.5)*.15;
 g.fillStyle='#2e4a8a';g.fillRect(ax-8*k,ay-8*k,16*k,26*k);g.fillStyle='#f0c8a0';g.beginPath();g.arc(ax,ay-16*k,8*k,0,6.283);g.fill();g.fillStyle='#c0392b';g.fillRect(ax-9*k,ay-26*k,18*k,6*k);
 g.save();g.translate(ax,ay-2*k);g.rotate(ang);g.strokeStyle='#7a4a1b';g.lineWidth=3.5*k;g.beginPath();g.arc(0,0,20*k,-1.2,1.2);g.stroke();g.strokeStyle='#eee';g.lineWidth=1.2;g.beginPath();g.moveTo(20*k*Math.cos(-1.2),20*k*Math.sin(-1.2));g.lineTo(aim?-10*k:2*k,0);g.lineTo(20*k*Math.cos(1.2),20*k*Math.sin(1.2));g.stroke();if(!live||!aim){g.fillStyle='#ddd';g.fillRect(2*k,-1,26*k,2)}g.restore();
 if(live&&aim){const v=vel();if(v.d>=18){let x=ax,y=ay,vx=v.vx,vy=v.vy;g.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<26;i++){for(let s=0;s<3;s++){vy+=GR()*.012;x+=vx*.012;y+=vy*.012}if(y>gy)break;g.beginPath();g.arc(x,y,2.5,0,6.283);g.fill()}}
  g.strokeStyle='rgba(255,213,74,.7)';g.lineWidth=3;g.beginPath();g.moveTo(sx,sy);g.lineTo(P.x,P.y);g.stroke();g.beginPath();g.arc(sx,sy,8,0,6.283);g.stroke()}
 if(live)for(const a of ar){const an=Math.atan2(a.vy,a.vx);g.save();g.translate(a.x,a.y);g.rotate(a.stuck?Math.atan2(a.vy,a.vx):an);g.globalAlpha=a.stuck?Math.max(0,a.l):1;g.fillStyle='#e8e0c8';g.fillRect(-14*k,-1,20*k,2.4);g.fillStyle='#bbb';g.beginPath();g.moveTo(10*k,0);g.lineTo(4*k,-3*k);g.lineTo(4*k,3*k);g.fill();g.restore()}
 drawParts();
 if(live){const bw=Math.min(180,W*.4);g.fillStyle='rgba(0,0,0,.5)';g.fillRect(14,14,bw,12);g.fillStyle=wall>35?'#6bd96b':'#ff5a5a';g.fillRect(14,14,bw*Math.max(0,wall/100),12);g.strokeStyle='#fff';g.lineWidth=1.5;g.strokeRect(14,14,bw,12);
  txt('Sur',16+bw+8,20,14,'#fff','left');txt('Skor: '+score,14,44,20,COL,'left');txt('Dalga '+wave(),14,68,15,'#fff','left');icon();
  if(pt<6&&!aim){g.globalAlpha=Math.min(1,6-pt);txt('Çek ve bırak: ok at (nişan yayı gösterir)',W/2,H*.94,Math.min(W*.04,17),'#fff');g.globalAlpha=1}}
}
</script></body></html>
