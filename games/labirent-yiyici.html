<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Labirent Yiyici - KSB Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100vw;height:100vh;touch-action:none}</style></head><body><canvas id="c"></canvas>
<script>
const ID='labirent-yiyici',cv=document.getElementById('c'),g=cv.getContext('2d'),keys={},ptrs=new Set(),rnd=Math.random,rr=(a,b)=>a+rnd()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let W=1,H=1,DPR=1,best=0,state='title',last=0,T=0,overT=0,shk=0,parts=[],muted=false,AC,score=0,touchMode=false;
try{best=+localStorage.getItem('ksb-'+ID+'-best')||0}catch(e){}
try{touchMode=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window}catch(e){}
function rs(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);if(window.onRs)onRs()}
addEventListener('resize',rs);
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
function snd(f,d,t,v,f2){if(muted||!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),k=AC.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);k.gain.setValueAtTime(v||.06,n);k.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(k);k.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function tx(s,x,y,z,c,a,w){g.font=(w||700)+' '+z+'px Fredoka,system-ui,sans-serif';g.textAlign=a||'center';g.textBaseline='middle';g.fillStyle=c||'#fff';g.fillText(s,x,y,W*.94)}
function rrect(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function burst(x,y,c,n,sp){n=n||12;sp=sp||200;for(let i=0;i<n;i++){const a=rnd()*6.283,s=rnd()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.4+rnd()*.5,m:.9,c})}}
function setBest(){if(score>best){best=score;try{localStorage.setItem('ksb-'+ID+'-best',best)}catch(e){}}}
function die(){if(state=='over')return;state='over';overT=T;setBest()}
function zs(){return Math.max(14,Math.min(W*.05,H*.034,26))}
function ttl(name,acc,l1,l2){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,W,H);const w=name.split(' '),z=Math.min(W*(w.length>1?.19:.15),H*.11,120),y0=H*.3-(w.length>1?z*.55:0),q=zs();
g.save();g.shadowColor=acc;g.shadowBlur=24;w.forEach((s,i)=>tx(s,W/2,y0+i*z*1.08,z,i?acc:'#fff'));g.restore();
tx(l1,W/2,H*.5,q,'#fff',0,500);if(l2)tx(l2,W/2,H*.5+q*1.5,q,'#fff',0,500);
g.globalAlpha=.65+.35*Math.sin(T*4);tx('Başlamak için dokun / tıkla',W/2,H*.72,q*1.25,acc);g.globalAlpha=1;if(best)tx('En yüksek: '+best,W/2,H*.72+q*2.3,q,'#fff',0,500)}
function ovr(acc,l){g.fillStyle='rgba(0,0,0,.62)';g.fillRect(0,0,W,H);const z=Math.min(W*.14,H*.1,84),q=zs();g.save();g.shadowColor=acc;g.shadowBlur=22;tx('OYUN BİTTİ',W/2,H*.3,z,acc);g.restore();
tx(l||('Skor: '+score),W/2,H*.43,q*1.6);tx('En yüksek: '+best,W/2,H*.43+q*2,q,'#fff',0,500);g.globalAlpha=.65+.35*Math.sin(T*4);tx('Tekrar için dokun / tıkla',W/2,H*.64,q*1.25,acc);g.globalAlpha=1}
function spk(){g.save();g.globalAlpha=.8;g.fillStyle=g.strokeStyle='#fff';g.lineWidth=2;const x=W-30,y=24;g.beginPath();g.moveTo(x-8,y-4);g.lineTo(x-3,y-4);g.lineTo(x+3,y-9);g.lineTo(x+3,y+9);g.lineTo(x-3,y+4);g.lineTo(x-8,y+4);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(x+7,y-5);g.lineTo(x+15,y+5);g.moveTo(x+15,y-5);g.lineTo(x+7,y+5)}else g.arc(x+3,y,8,-1,1);g.stroke();g.restore()}
function begin(){ptrs.clear();reset();state='play'}
function pxy(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/(r.width||W),(e.clientY-r.top)*H/(r.height||H)]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();if(e.pointerType=='touch')touchMode=true;const[x,y]=pxy(e);if(x>W-46&&y<46){muted=!muted;return}
if(state!='play'){if(state=='title'||T-overT>.5)begin();return}
ptrs.add(e.pointerId);try{cv.setPointerCapture(e.pointerId)}catch(_){}if(window.gDown)gDown(x,y,e)});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;e.preventDefault();const[x,y]=pxy(e);if(window.gMove)gMove(x,y,e)});
const pu=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);const[x,y]=pxy(e);if(window.gUp)gUp(x,y,e)};
cv.addEventListener('pointerup',pu);cv.addEventListener('pointercancel',pu);cv.addEventListener('contextmenu',e=>e.preventDefault());
const NAV=['Space','Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
addEventListener('keydown',e=>{ac();if(e.code=='KeyM'){if(!e.repeat)muted=!muted;return}if(NAV.includes(e.code))e.preventDefault();
if(state!='play'){if(!e.repeat&&NAV.includes(e.code)&&(state=='title'||T-overT>.5))begin();return}
keys[e.code]=1;if(!e.repeat&&window.gKey)gKey(e.code)});
addEventListener('keyup',e=>{keys[e.code]=0});
document.addEventListener('visibilitychange',()=>{try{if(AC)document.hidden?AC.suspend():AC.resume()}catch(e){}});
function loop(t){requestAnimationFrame(loop);if(document.hidden){last=t;return}const dt=Math.min((t-last)/1000||0,.05);last=t;T+=dt;g.setTransform(DPR,0,0,DPR,0,0);g.save();
if(shk>.3){shk*=Math.pow(.01,dt);g.translate((rnd()-.5)*shk,(rnd()-.5)*shk)}else shk=0;
frame(dt);for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);for(const p of parts){g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;g.fillRect(p.x-2,p.y-2,4,4)}g.globalAlpha=1;g.restore();spk()}
function boot(){rs();requestAnimationFrame(t=>{last=t;loop(t)})}

const C=15,RW=17,DR=[[1,0],[-1,0],[0,1],[0,-1]],GC=['#ff4d6d','#4dd2ff','#ffb347'];
let M,dots,left,pl,gh,lives,lvl,pwr,combo,want,frz,msg,msgT,s,ox,oy,qx,qy,qT=0;
function onRs(){s=Math.max(8,Math.floor(Math.min(W/C,(H-70)/RW)));ox=(W-C*s)/2;oy=64+(H-64-RW*s)/2}
const SX=v=>ox+(v+.5)*s,SY=v=>oy+(v+.5)*s,EX=e=>e.x+e.dx*e.p,EY=e=>e.y+e.dy*e.p;
function free(x,y){return x>=0&&x<C&&y>=0&&y<RW&&!M[y][x]}
function gen(){M=[];for(let y=0;y<RW;y++)M.push(Array(C).fill(1));const st=[[1,1]];M[1][1]=0;
while(st.length){const[x,y]=st[st.length-1],n=[[2,0],[-2,0],[0,2],[0,-2]].filter(([a,b])=>{const X=x+a,Y=y+b;return X>0&&Y>0&&X<C-1&&Y<RW-1&&M[Y][X]}).sort(()=>rnd()-.5);
if(!n.length){st.pop();continue}const[a,b]=n[0];M[y+b/2][x+a/2]=0;M[y+b][x+a]=0;st.push([x+a,y+b])}
for(let y=1;y<RW-1;y++)for(let x=1;x<C-1;x++)if(M[y][x]&&(x%2)!=(y%2)&&rnd()<.3)M[y][x]=0;
dots=M.map(r=>r.map(v=>v?0:1));dots[9][7]=0;dots[15][7]=0;[[1,1],[13,1],[1,15],[13,15]].forEach(([x,y])=>dots[y][x]=2);left=0;dots.forEach(r=>r.forEach(v=>{if(v)left++}))}
function mkE(x,y,c){return{x,y,dx:0,dy:0,p:0,c,t:0,k:.5,imm:false}}
function resetPos(){pl=mkE(7,15);want=null;gh=[0,1,2].map(i=>{const e=mkE(7,9,GC[i]);e.t=i*2.2+1;e.k=[.85,.6,.4][i]+Math.min(lvl,10)*.015;return e});pwr=0;combo=0}
function reset(){score=0;lives=3;lvl=1;gen();resetPos();frz=0;msg='';msgT=0}
function mv(e,v,dt,arr){if(!e.dx&&!e.dy){arr(e);if(!e.dx&&!e.dy)return}e.p+=v*dt;while(e.p>=1){e.x+=e.dx;e.y+=e.dy;e.p-=1;arr(e);if(!e.dx&&!e.dy){e.p=0;break}}}
function parr(e){const d=dots[e.y][e.x];if(d){dots[e.y][e.x]=0;left--;if(d==2){score+=50;pwr=7;combo=0;gh.forEach(q=>q.imm=false);snd(300,.3,'sine',.08,900)}else{score+=10;snd(e.x%2?520:620,.05,'square',.025)}}
if(want&&free(e.x+want[0],e.y+want[1])){e.dx=want[0];e.dy=want[1]}else if(!free(e.x+e.dx,e.y+e.dy))e.dx=e.dy=0}
function garr(e){const o=DR.filter(d=>free(e.x+d[0],e.y+d[1]));let f=o.filter(d=>!(d[0]==-e.dx&&d[1]==-e.dy));if(!f.length)f=o;if(!f.length){e.dx=e.dy=0;return}
let d;if((pwr>0&&!e.imm)||rnd()>e.k)d=f[rnd()*f.length|0];else{f.sort((a,b)=>Math.hypot(e.x+a[0]-pl.x,e.y+a[1]-pl.y)-Math.hypot(e.x+b[0]-pl.x,e.y+b[1]-pl.y));d=f[0]}e.dx=d[0];e.dy=d[1]}
function setW(d){want=d;if(pl.p>0&&(pl.dx||pl.dy)&&d[0]==-pl.dx&&d[1]==-pl.dy){pl.x+=pl.dx;pl.y+=pl.dy;pl.dx=d[0];pl.dy=d[1];pl.p=1-pl.p}}
function loseLife(){lives--;shk=14;burst(SX(EX(pl)),SY(EY(pl)),'#ffd23f',30,260);snd(400,.6,'sawtooth',.09,60);if(lives<=0){die();return}resetPos();frz=1.2}
function upd(dt){if(msgT>0)msgT-=dt;if(frz>0){frz-=dt;return}
if(pwr>0){pwr-=dt;if(pwr<=0)gh.forEach(q=>q.imm=false)}mv(pl,4.6,dt,parr);const gv=3+Math.min(lvl,8)*.2;
for(const e of gh){if(e.t>0){e.t-=dt;continue}mv(e,pwr>0&&!e.imm?2.2:gv,dt,garr);
if(Math.hypot(EX(e)-EX(pl),EY(e)-EY(pl))<.6){if(pwr>0&&!e.imm){e.imm=true;e.x=7;e.y=9;e.dx=e.dy=0;e.p=0;e.t=2.5;combo++;score+=200*combo;burst(SX(EX(pl)),SY(EY(pl)),e.c,20,220);snd(200,.25,'square',.07,900)}else{loseLife();return}}}
if(left<=0){lvl++;score+=100;gen();resetPos();frz=1;msg='Seviye '+lvl;msgT=1.6;snd(500,.4,'triangle',.08,1000)}}
function demo(dt){pwr=99;if((qT-=dt)<0){qT=.7;setW(DR[rnd()*4|0])}mv(pl,4,dt,parr);for(const e of gh){e.t=0;mv(e,2.4,dt,garr)}if(left<40)reset()}
function drawG(x,y,r,c,eyes,dx,dy){if(!eyes){g.fillStyle=c;g.beginPath();g.arc(x,y-r*.1,r,Math.PI,0);g.lineTo(x+r,y+r*.9);for(let i=0;i<4;i++){g.lineTo(x+r-(i*2+1)*r/4,y+r*.55);g.lineTo(x+r-(i*2+2)*r/4,y+r*.9)}g.closePath();g.fill()}
g.fillStyle='#fff';for(const k of[-1,1]){g.beginPath();g.arc(x+k*r*.36,y-r*.2,r*.26,0,6.3);g.fill()}g.fillStyle='#123';for(const k of[-1,1]){g.beginPath();g.arc(x+k*r*.36+dx*r*.12,y-r*.2+dy*r*.12,r*.12,0,6.3);g.fill()}}
function draw(){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0a0a24');gr.addColorStop(1,'#1a0634');g.fillStyle=gr;g.fillRect(0,0,W,H);
for(let y=0;y<RW;y++)for(let x=0;x<C;x++){const X=ox+x*s,Y=oy+y*s;if(M[y][x]){g.fillStyle='#1b2896';rrect(X+1,Y+1,s-2,s-2,s*.3);g.fill();g.strokeStyle='#5b7bff';g.lineWidth=1.5;g.stroke()}
else{const d=dots[y][x];if(d==1){g.fillStyle='#ffe9a8';g.beginPath();g.arc(X+s/2,Y+s/2,s*.1,0,6.3);g.fill()}else if(d==2){g.save();g.shadowColor='#fff';g.shadowBlur=12;g.fillStyle='#fff';g.beginPath();g.arc(X+s/2,Y+s/2,s*(.24+.06*Math.sin(T*8)),0,6.3);g.fill();g.restore()}}}
const px=SX(EX(pl)),py=SY(EY(pl)),r=s*.42,a=Math.atan2(pl.dy,pl.dx||(pl.dy?0:1)),mo=(pl.dx||pl.dy)?.12+.5*Math.abs(Math.sin(T*14)):.3;
if(!(frz>0&&state=='play'&&Math.floor(T*10)%2)){g.save();g.shadowColor='#ffd23f';g.shadowBlur=14;g.fillStyle='#ffd23f';g.beginPath();g.moveTo(px,py);g.arc(px,py,r,a+mo,a+6.283-mo);g.closePath();g.fill();g.restore();g.fillStyle='#222';g.beginPath();g.arc(px+Math.cos(a-1.1)*r*.55,py+Math.sin(a-1.1)*r*.55,r*.12,0,6.3);g.fill()}
for(const e of gh){const sc=pwr>0&&!e.imm,gx=SX(EX(e)),gy=SY(EY(e));g.globalAlpha=e.t>0&&!e.imm?.55:1;
if(e.t>0&&e.imm)drawG(gx,gy,s*.42,'',true,0,0);else drawG(gx,gy,s*.42,sc?(pwr<2&&Math.floor(T*6)%2?'#fff':'#2b4cff'):e.c,false,e.dx,e.dy);g.globalAlpha=1}
if(state!='title'){tx('Skor '+score,14,28,22,'#fff','left');tx('Seviye '+lvl,W/2,28,18,'#9fb0ff');tx('♥'.repeat(Math.max(0,lives)),W-56,28,22,'#ff4d6d','right');
if(msgT>0)tx(msg,W/2,oy+RW*s/2,Math.min(48,W*.12),'#fff')}}
function gDown(x,y){qx=x;qy=y}
function gMove(x,y){const dx=x-qx,dy=y-qy;if(Math.hypot(dx,dy)>18){setW(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]);qx=x;qy=y}}
function gKey(c){const m={ArrowRight:0,KeyD:0,ArrowLeft:1,KeyA:1,ArrowDown:2,KeyS:2,ArrowUp:3,KeyW:3}[c];if(m!==undefined)setW(DR[m])}
function frame(dt){if(state=='title')demo(dt);else if(state=='play')upd(dt);draw();
if(state=='title')ttl('Labirent Yiyici','#ffd23f','Noktaları ye, hayaletlerden kaç','Güç topuyla hayaletleri yakala');else if(state=='over')ovr('#ffd23f')}
rs();reset();boot();
</script></body></html>
