</head><body><canvas id="c"></canvas><script>
const BK='ksb-kafa-topu-best';

let AC=null,muted=false;

function spk(){g.save();g.globalAlpha=.85;g.fillStyle='#fff';const x=W-30,y=22;g.beginPath();g.moveTo(x-8,y-3);g.lineTo(x-4,y-3);g.lineTo(x+1,y-8);g.lineTo(x+1,y+8);g.lineTo(x-4,y+3);g.lineTo(x-8,y+3);g.fill();g.lineWidth=2;if(muted){g.strokeStyle='#f66';g.beginPath();g.moveTo(x+4,y-5);g.lineTo(x+12,y+5);g.moveTo(x+12,y-5);g.lineTo(x+4,y+5);g.stroke()}else{g.strokeStyle='#fff';g.beginPath();g.arc(x+1,y,6,-1,1);g.stroke()}g.restore()}
let S=1,OX=0,OY=0;function fit(a,b){S=Math.min(W/a,H/b);OX=(W-a*S)/2;OY=(H-b*S)/2}

const PT=[];function burst(x,y,n,c,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=(.3+Math.random())*(sp||200);PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.5,c,r:2+Math.random()*3})}}

function ttl(n,sub){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,W,H);g.save();g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=24;const fs=Math.min(W*.13,H*.11,110);tx(n,W/2,H*.3,fs,'#fff','center','800');g.shadowBlur=0;tx(sub,W/2,H*.3+fs*.8,Math.min(W*.05,H*.035,28),'#ffe08a','center','600');g.globalAlpha=.6+.4*Math.sin(T*4);tx('Başlamak için dokun / tıkla',W/2,H*.8,Math.min(W*.055,H*.04,30),'#fff');g.globalAlpha=1;if(best)tx('En iyi: '+best,W/2,H*.87,Math.min(W*.045,H*.03,22),'#ccc','center','600');g.restore()}

function body(p,dt,l,r,j,k,spd){let mv=(r?1:0)-(l?1:0);p.vx=mv*spd;p.x=cl(p.x+p.vx*dt,HR+22,WW-HR-22);const g0=p.y>=HG-.5;if(j&&g0){p.vy=-800;snd(400,.12,'sine',.08,700)}p.vy+=2100*dt;p.y+=p.vy*dt;if(p.y>=HG){p.y=HG;p.vy=0}
 p.cd-=dt;if(k&&p.cd<=0){p.kick=.22;p.cd=.4;p.hit=false}if(p.kick>0)p.kick-=dt}
function foot(p){return{x:p.x+p.face*(HR+16),y:p.y+HR+24}}
function head(p){const b=ball,dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy),m=HR+BRr;if(d>=m||d==0)return;const nx=dx/d,ny=dy/d;b.x=p.x+nx*m;b.y=p.y+ny*m;const rv=(b.vx-p.vx)*nx+(b.vy-p.vy)*ny;if(rv<0){b.vx-=1.85*rv*nx;b.vy-=1.85*rv*ny;snd(220,.08,'triangle',.12,120);burst(b.x,b.y,5,'#fff',100)}}
function kickChk(p){if(p.kick>0&&!p.hit){const f=foot(p),d=Math.hypot(ball.x-f.x,ball.y-f.y);if(d<BRr+28){p.hit=true;ball.vx=p.face*(640+rnd(0,80))+p.vx*.3;ball.vy=-460-rnd(0,80);shk=4;snd(140,.15,'square',.18,60);burst(ball.x,ball.y,12,'#ffd23f',200)}}}
function goal(w){if(w)ps++;else as++;msg=w?'GOL!':'Gol yedin';ph='goal';mt=1.5;shk=12;snd(w?660:200,.5,'sawtooth',.15,w?1000:80);burst(ball.x,ball.y,40,w?'#4f8':'#f64',300);if(ot){fin()}}
function fin(){st='over';overT=0;if(ps>as)saveBest(ps-as);snd(ps>as?700:200,.6,'triangle',.2)}
UP=dt=>{pstep(dt);shk=Math.max(0,shk-dt*30);overT+=dt;
 if(st=='title'){P.x=110+Math.sin(T)*30;A.x=390+Math.cos(T*1.2)*30;P.y=HG-Math.abs(Math.sin(T*2))*60;A.y=HG-Math.abs(Math.cos(T*2.3))*60;ball.x=250+Math.sin(T*1.5)*60;ball.y=250-Math.abs(Math.sin(T*2.4))*110;ball.rot+=dt*3;return}
 if(st!='play')return;

 if(ph=='play'){if(!ot){tm-=dt;if(tm<=0){tm=0;if(ps!=as){fin();return}ot=true;msg='ALTIN GOL!';mt=1;shk=6}}}
 const i=inp();body(P,dt,i.l,i.r,i.j,i.k,330);
 const lead=ps-as,asp=cl(240+lead*25+(60-tm)*1.2,220,330);let tgx;const b=ball;
 if(b.x>230||(b.vx>150&&b.x>120))tgx=b.x+36;else tgx=395;tgx=cl(tgx,100,440);if(b.x<A.x-10&&b.x>A.x-120&&b.y>A.y-60)tgx=cl(b.x+40,100,440);
 const dx=tgx-A.x;let al=dx<-10,ar=dx>10;aiJ-=dt;let aj=false;if(Math.abs(b.x-A.x)<95&&b.y<A.y-40&&b.y>A.y-230&&b.vy>-100&&Math.random()<.1&&aiJ<=0){aj=true;aiJ=.6}
 let ak=false;const f=foot(A);if(Math.hypot(b.x-f.x,b.y-f.y)<BRr+40&&Math.random()<.4)ak=true;
 body(A,dt,al,ar,aj,ak,asp);
 b.vy+=1300*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=b.vx*dt*.02;
 if(b.y>GRD-BRr){b.y=GRD-BRr;b.vy=-Math.abs(b.vy)*.72;if(Math.abs(b.vy)<60)b.vy=0;b.vx*=.97;if(Math.abs(b.vy)>150)snd(100,.06,'sine',.1)}if(b.y==GRD-BRr)b.vx*=Math.exp(-.7*dt);
 if(b.y<BRr){b.y=BRr;b.vy=Math.abs(b.vy)*.8}

 for(const s of[0,1]){const bx=s?WW-62:0;const cx=cl(b.x,bx,bx+62),cy=cl(b.y,GT-10,GT),dx2=b.x-cx,dy2=b.y-cy,d=Math.hypot(dx2,dy2);if(d<BRr&&d>0){b.x=cx+dx2/d*BRr;b.y=cy+dy2/d*BRr;const vn=b.vx*dx2/d+b.vy*dy2/d;if(vn<0){b.vx-=1.7*vn*dx2/d;b.vy-=1.7*vn*dy2/d}}}
 if(b.y>=GT&&(b.x<BRr||b.x>WW-BRr)){if(b.x<30)goal(false);else if(b.x>WW-30)goal(true);else{}}
 if(b.y>=GT&&b.x<30&&ph=='play')goal(false);else if(b.y>=GT&&b.x>WW-30&&ph=='play')goal(true);
 if(ph!='play')return;head(P);head(A);kickChk(P);kickChk(A);
 const sp=Math.hypot(b.vx,b.vy);if(sp>1000){b.vx*=1000/sp;b.vy*=1000/sp}};
onDown=()=>{if(st=='title')start();else if(st=='over'&&overT>.5)start()};

function person(p,eyeT){g.save();g.translate(p.x,p.y);
 g.fillStyle='#0003';g.beginPath();g.ellipse(0,GRD-p.y+4,36,8,0,0,6.3);g.fill();
 g.fillStyle=p.col;g.fillRect(-18,HR-6,36,26);g.fillStyle='#fff';g.fillRect(-18,HR+20,36,10);g.fillStyle='#f2c9a0';g.fillRect(-14,HR+30,10,12);g.fillRect(4,HR+30,10,12);
 const k=p.kick>0?(1-p.kick/.22):0,fa=-p.face*Math.sin(k*3.14)*1.3;g.save();g.translate(p.face*6,HR+42);g.rotate(fa);g.fillStyle='#222';g.beginPath();g.ellipse(p.face*10,2,16,7,0,0,6.3);g.fill();g.restore();
 g.fillStyle='#f2c9a0';g.beginPath();g.arc(0,0,HR,0,6.3);g.fill();g.fillStyle=p.col==='#2a7df4'?'#3a2a1a':'#c33';g.beginPath();g.arc(0,0,HR,3.3,6.1);g.fill();
 const ex=cl((ball.x-p.x)/60,-1,1)*3,ey=cl((ball.y-p.y)/60,-1,1)*3;for(const o of[-12,12]){g.fillStyle='#fff';g.beginPath();g.arc(p.face*6+o,2,8,0,6.3);g.fill();g.fillStyle='#111';g.beginPath();g.arc(p.face*6+o+ex,2+ey,4,0,6.3);g.fill()}
 g.strokeStyle='#a33';g.lineWidth=3;g.beginPath();g.arc(p.face*6,16,8,.2,2.9);g.stroke();g.restore()}
function ballD(){const b=ball;g.save();g.translate(b.x,b.y);g.rotate(b.rot);g.fillStyle='#fff';g.beginPath();g.arc(0,0,BRr,0,6.3);g.fill();g.fillStyle='#222';g.beginPath();for(let i=0;i<5;i++){const a=i*1.2566;g.lineTo(Math.cos(a)*6,Math.sin(a)*6)}g.fill();for(let i=0;i<5;i++){const a=i*1.2566+.6;g.beginPath();g.arc(Math.cos(a)*BRr*.85,Math.sin(a)*BRr*.85,4,0,6.3);g.fill()}g.strokeStyle='#0003';g.lineWidth=2;g.beginPath();g.arc(0,0,BRr,0,6.3);g.stroke();g.restore()}
function goalD(s){const x=s?WW-62:0,dx=s?1:-1;g.fillStyle='#fff2';g.fillRect(x,GT,62,GRD-GT);g.strokeStyle='#fff5';g.lineWidth=1;for(let i=0;i<=62;i+=10){g.beginPath();g.moveTo(x+i,GT);g.lineTo(x+i,GRD);g.stroke()}for(let j=GT;j<=GRD;j+=10){g.beginPath();g.moveTo(x,j);g.lineTo(x+62,j);g.stroke()}g.fillStyle='#fff';g.fillRect(s?WW-62:0,GT-8,62,8);g.fillRect(s?WW-62:55,GT-8,7,GRD-GT+8)}
DR=()=>{const bh=W<H*.9?100:0,SS=Math.min(W/WW,(H-bh)/WH);S=SS;OX=(W-WW*SS)/2;OY=(H-bh-WH*SS)/2;
