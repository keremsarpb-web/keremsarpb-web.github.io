<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Şerit Koşusu – KSB Games</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head>
<body><canvas id="c"></canvas><script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),ID='serit-kosusu';let W=1,H=1,S=1,best=0,AC,muted=false,state='title',score=0,shake=0,tm=0,parts=[],ot=0;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);S=Math.min(W,H)}
addEventListener('resize',rs);rs();
try{best=+localStorage.getItem('ksb-'+ID+'-best')||0}catch(e){}
function sv(){if(score>best){best=score;try{localStorage.setItem('ksb-'+ID+'-best',best)}catch(e){}}}
function snd(f,d,t,v,sl){if(muted||!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);a.gain.setValueAtTime(v||.06,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function T(s,x,y,z,c,a,w){g.font=(w||700)+' '+z+'px Fredoka,Nunito,system-ui,sans-serif';g.textAlign=a||'center';g.textBaseline='middle';g.fillStyle=c||'#fff';g.fillText(s,x,y)}
function RR(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function P(x,y,n,c,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(sp||150)*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.7,c})}}
function upP(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt}parts=parts.filter(p=>p.l>0)}
function drP(){for(const p of parts){g.globalAlpha=Math.max(0,p.l/.7);g.fillStyle=p.c;g.fillRect(p.x-2,p.y-2,4,4)}g.globalAlpha=1}
function titleScr(name,sub,y0){const z=Math.min(S*.15,W*.92/(name.length*.62));y0=y0||H*.3;g.save();g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=z*.2;g.shadowOffsetY=z*.06;T(name,W/2,y0+Math.sin(tm*2)*z*.05,z,'#fff',0,800);g.restore();if(sub)T(sub,W/2,y0+z*.85,Math.max(13,z*.3),'rgba(255,255,255,.9)',0,500);g.globalAlpha=.65+.35*Math.sin(tm*4);T('Başlamak için dokun / tıkla',W/2,H*.78,Math.max(15,Math.min(S*.05,30)),'#fff',0,700);g.globalAlpha=1;if(best)T('En iyi: '+best,W/2,H*.78+Math.max(28,S*.08),Math.max(13,S*.035),'#ffe',0,500)}
function overScr(t,l2){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,H);const z=Math.min(S*.11,W*.9/(t.length*.62));T(t,W/2,H*.32,z,'#fff',0,800);T('Skor: '+score,W/2,H*.32+z*1.1,z*.55,'#ffd54a');T('En iyi: '+best,W/2,H*.32+z*1.8,z*.4,'#fff',0,500);if(l2)T(l2,W/2,H*.32+z*2.4,z*.35,'#cde',0,500);if(ot>.5){g.globalAlpha=.6+.4*Math.sin(tm*4);T('Tekrar için dokun / tıkla',W/2,H*.75,Math.max(15,Math.min(S*.05,30)));g.globalAlpha=1}}
const IN={down(){},up(){},mv(){},kd(){},ku(){}};
function initA(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
cv.addEventListener('pointerdown',e=>{e.preventDefault();initA();if(e.clientX>W-50&&e.clientY<50){muted=!muted;return}IN.down(e.clientX,e.clientY,e.pointerId)});
addEventListener('pointerup',e=>IN.up(e.clientX,e.clientY,e.pointerId));
addEventListener('pointercancel',e=>IN.up(e.clientX,e.clientY,e.pointerId));
addEventListener('pointermove',e=>IN.mv(e.clientX,e.clientY,e.pointerId));
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();initA();if(e.repeat)return;if(e.key==='m'||e.key==='M'){muted=!muted;return}IN.kd(e.key)});
addEventListener('keyup',e=>IN.ku(e.key));
function spk(){const x=W-26,y=26;g.save();g.globalAlpha=.8;g.fillStyle='#fff';g.fillRect(x-9,y-4,5,8);g.beginPath();g.moveTo(x-4,y-4);g.lineTo(x+2,y-9);g.lineTo(x+2,y+9);g.lineTo(x-4,y+4);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();if(muted){g.moveTo(x+5,y-5);g.lineTo(x+13,y+5);g.moveTo(x+13,y-5);g.lineTo(x+5,y+5)}else g.arc(x+2,y,7,-1,1);g.stroke();g.restore()}
let last=performance.now();
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;if(document.hidden)dt=0;tm+=dt;if(state==='over')ot+=dt;shake=Math.max(0,shake-dt*40);if(dt>0)step(dt);g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);render();g.restore();spk();requestAnimationFrame(loop)}
/* ---- game ---- */
const ZN=8,ZMAX=85;let zp=0,v=18,obs=[],zg=30,lane=0,px_=0,py_=0,vy_=0,slide=0,coins=0,sw=null,hy=0,pyS=0,LW=100,U=100,crash=0,rn=0;
function geo(){hy=H*.36;pyS=H*.84;LW=Math.min(W*.3,S*.3);U=LW*.9}
const kk=z=>ZN/(ZN+z),sy=z=>hy+(pyS-hy)*kk(z),sx=(l,z)=>W/2+l*LW*kk(z);
function reset(){zp=0;v=18;obs=[];zg=30;lane=0;px_=0;py_=0;vy_=0;slide=0;coins=0;crash=0;score=0}
function go(){if(state==='title'||(state==='over'&&ot>.6)){reset();state='play'}}
function jump(){if(py_<=0.01&&slide<=0){vy_=9;snd(400,.2,'square',.05,400)}else if(py_>.01){}}
function dsl(){if(py_>.01)vy_=-14;slide=.7;snd(200,.2,'sawtooth',.04,-100)}
function mvL(d){lane=Math.max(-1,Math.min(1,lane+d));snd(500,.07,'triangle',.05,d*100)}
IN.down=(x,y)=>{if(state!=='play'){go();sw=null;return}sw={x,y,done:false}};
IN.mv=(x,y)=>{if(!sw||sw.done)return;const dx=x-sw.x,dy=y-sw.y;if(Math.hypot(dx,dy)>28){sw.done=true;if(Math.abs(dx)>Math.abs(dy))mvL(dx>0?1:-1);else if(dy<0)jump();else dsl()}};
IN.up=(x,y)=>{if(sw&&!sw.done&&state==='play')jump();sw=null};
IN.kd=k=>{if(state!=='play'){go();return}if(k==='ArrowLeft'||k==='a'||k==='A')mvL(-1);else if(k==='ArrowRight'||k==='d'||k==='D')mvL(1);else if(k==='ArrowUp'||k==='w'||k==='W'||k===' ')jump();else if(k==='ArrowDown'||k==='s'||k==='S')dsl()};
function gen(){const r=Math.random(),l=Math.floor(Math.random()*3)-1;
 if(r<.3){for(let i=0;i<6;i++)obs.push({t:'c',l,z:zg+i*2.2})}
 else if(r<.55){const ls=[-1,0,1].filter(()=>Math.random()<.6);if(!ls.length)ls.push(l);for(const q of ls)obs.push({t:'l',l:q,z:zg});for(let i=0;i<3;i++)obs.push({t:'c',l:ls[0],z:zg-4+i*0});}
 else if(r<.72){for(const q of[-1,0,1])obs.push({t:'h',l:q,z:zg})}
 else{const ls=[-1,0,1].filter(q=>q!==l&&Math.random()<.7);for(const q of ls)obs.push({t:'b',l:q,z:zg});for(let i=0;i<4;i++)obs.push({t:'c',l,z:zg+i*2.2-3})}
 zg+=Math.max(15,v*.85)+Math.random()*6}
function step(dt){upP(dt);rn+=dt*v*.5;geo();
 if(state==='over'){crash+=dt;return}
 v=18+Math.min(26,zp/70);zp+=v*dt;while(zg<zp+ZMAX)gen();obs=obs.filter(o=>o.z>zp-3);
 if(state==='title'){return}
 px_+=(lane-px_)*Math.min(1,dt*14);if(py_>0||vy_>0){vy_-=26*dt;py_+=vy_*dt;if(py_<=0){py_=0;vy_=0}}slide=Math.max(0,slide-dt);
 for(const o of obs){const rz=o.z-zp;if(o.dead||rz>1||rz<-1)continue;if(Math.abs(o.l-px_)>.6)continue;
  if(o.t==='c'){o.dead=1;coins++;snd(900+coins%8*60,.08,'sine',.06);P(sx(o.l,0),pyS-U*.8,6,'#ffd23f',120)}
  else if((o.t==='l'&&py_<.6)||(o.t==='h'&&slide<=0)||o.t==='b'){state='over';ot=0;crash=0;shake=14;snd(100,.5,'sawtooth',.1,-70);P(sx(px_,0),pyS-U*.7,24,'#ff6a3d',260);sv();return}}
 obs=obs.filter(o=>!o.dead);score=Math.floor(zp/2)+coins*10;sv()}
function quad(l0,z0,l1,z1,c){g.fillStyle=c;g.beginPath();g.moveTo(sx(l0,z0),sy(z0));g.lineTo(sx(l1,z0),sy(z0));g.lineTo(sx(l1,z1),sy(z1));g.lineTo(sx(l0,z1),sy(z1));g.fill()}
function box(l,z,w,h,c,top){const k=kk(z),x=sx(l,z),y=sy(z),bw=w*LW*k,bh=h*U*k;g.fillStyle=c;g.fillRect(x-bw/2,y-bh,bw,bh);if(top){g.fillStyle=top;g.fillRect(x-bw/2,y-bh,bw,bh*.12)}}
function drObs(o){const z=o.z-zp;if(z<-1.5||z>ZMAX)return;const k=kk(z),x=sx(o.l,z),y=sy(z);
 if(o.t==='c'){const w=Math.abs(Math.cos(tm*5+o.z))*U*.22*k+2;g.fillStyle='#ffd23f';g.beginPath();g.ellipse(x,y-U*.6*k,w,U*.22*k,0,0,7);g.fill();g.strokeStyle='#c98f00';g.lineWidth=2*k+1;g.stroke()}
 else if(o.t==='l'){const bw=LW*.8*k,bh=U*.55*k;g.fillStyle='#fff';g.fillRect(x-bw/2,y-bh,bw,bh);g.fillStyle='#e53935';for(let i=0;i<4;i++)g.fillRect(x-bw/2+bw*i/4+bw*.06,y-bh,bw/8,bh);g.fillStyle='#555';g.fillRect(x-bw/2,y-bh*1.05,bw,bh*.12)}
 else if(o.t==='h'){const bw=LW*.9*k;g.fillStyle='#555';g.fillRect(x-bw/2,y-U*1.9*k,bw*.07,U*1.9*k);g.fillRect(x+bw/2-bw*.07,y-U*1.9*k,bw*.07,U*1.9*k);g.fillStyle='#ff9800';g.fillRect(x-bw/2,y-U*1.9*k,bw,U*.7*k);g.fillStyle='#222';for(let i=0;i<4;i++)g.fillRect(x-bw/2+bw*(i*.25+.05),y-U*1.9*k,bw*.1,U*.7*k)}
 else{const bw=LW*.85*k,bh=U*2*k;g.fillStyle='#3949ab';g.fillRect(x-bw/2,y-bh,bw,bh);g.fillStyle='#5c6bc0';g.fillRect(x-bw/2,y-bh,bw,bh*.1);g.fillStyle='#ffee58';g.fillRect(x-bw*.4,y-bh*.85,bw*.25,bh*.15);g.fillRect(x+bw*.15,y-bh*.85,bw*.25,bh*.15);g.fillStyle='#1a237e';g.fillRect(x-bw/2,y-bh*.3,bw,bh*.08)}}
function runner(x,y,sl,jy,t){g.save();g.translate(x,y-jy*U);g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(0,jy*U,U*.35,U*.1,0,0,7);g.fill();const s=U*.5,ph=Math.sin(t*14)*(jy>0?.2:1);
 if(sl>0){g.fillStyle='#ff4081';RR(-s*.8,-s*.6,s*1.6,s*.6,s*.3);g.fill();g.fillStyle='#ffd9b0';g.beginPath();g.arc(s*.7,-s*.35,s*.28,0,7);g.fill()}
 else{g.strokeStyle='#263238';g.lineWidth=s*.22;g.lineCap='round';g.beginPath();g.moveTo(-s*.15,-s*.9);g.lineTo(-s*.15+ph*s*.4,0);g.moveTo(s*.15,-s*.9);g.lineTo(s*.15-ph*s*.4,0);g.stroke();g.fillStyle='#ff4081';RR(-s*.4,-s*1.9,s*.8,s*1.1,s*.25);g.fill();g.fillStyle='#ffd9b0';g.beginPath();g.arc(0,-s*2.2,s*.3,0,7);g.fill();g.fillStyle='#00e5ff';g.fillRect(-s*.32,-s*2.5,s*.64,s*.16)}g.restore()}
function render(){
 const gr=g.createLinearGradient(0,0,0,hy+2);gr.addColorStop(0,'#1a0b3d');gr.addColorStop(.7,'#c2185b');gr.addColorStop(1,'#ff8f3d');g.fillStyle=gr;g.fillRect(0,0,W,hy+2);
 g.fillStyle='#ffd166';g.beginPath();g.arc(W/2,hy-S*.02,S*.14,Math.PI,0);g.fill();g.fillStyle='#1d1040';for(let i=0;i<14;i++){const bx=i*W/12-20,bh=S*(.05+((i*37)%9)*.012);g.fillRect(bx-(zp*.2%1)*0,hy-bh,W/12-6,bh)}
 g.fillStyle='#0f0a24';g.fillRect(0,hy,W,H-hy);
 const off=((zp%6)+6)%6,b0=Math.floor(zp/6);for(let i=0;i<20;i++){const z0=-off+i*6,z1=z0+6;if(z0<-ZN+1.5)continue;quad(-1.5,z0,1.5,z1,(b0+i)%2?'#3a3a4d':'#30303f');quad(-1.8,z0,-1.5,z1,(b0+i)%2?'#00e5ff':'#7c4dff');quad(1.5,z0,1.8,z1,(b0+i)%2?'#00e5ff':'#7c4dff')}
 const o2=((zp%4)+4)%4;g.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<22;i++){const z0=-o2+i*4,z1=z0+2;if(z0<-ZN+1.5)continue;for(const l of[-.5,.5]){const w=.03;g.beginPath();g.moveTo(sx(l-w,z0),sy(z0));g.lineTo(sx(l+w,z0),sy(z0));g.lineTo(sx(l+w,z1),sy(z1));g.lineTo(sx(l-w,z1),sy(z1));g.fill()}}
 const lo=((zp%12)+12)%12;for(let i=0;i<8;i++){const z=-lo+i*12+12;if(z<0||z>ZMAX)continue;const k=kk(z);for(const s of[-2.1,2.1]){const x=sx(s,z),y=sy(z);g.fillStyle='#444';g.fillRect(x-2*k,y-U*2.2*k,4*k+1,U*2.2*k);g.fillStyle='#ffee99';g.shadowColor='#ffd166';g.shadowBlur=12*k;g.beginPath();g.arc(x,y-U*2.2*k,6*k+1,0,7);g.fill();g.shadowBlur=0}}
 const list=obs.slice().sort((a,b)=>b.z-a.z),pz=0;let drawn=false;
 for(const o of list){if(!drawn&&o.z-zp<pz){runner(sx(px_,0),pyS,slide,py_,rn);drawn=true}drObs(o)}if(!drawn)runner(sx(px_,0),pyS,slide,py_,rn);
 drP();
 const z=Math.max(15,Math.min(S*.05,26));
 if(state==='title'){g.fillStyle='rgba(10,0,30,.35)';g.fillRect(0,0,W,H);titleScr('Şerit Koşusu','Kaydır: şerit değiştir, zıpla, kay!',H*.2);return}
 T('Skor '+score,12,z+2,z*1.2,'#fff','left');T('Altın '+coins,12,z*2.5,z*.85,'#ffd23f','left',600);
 if(state==='over')overScr('Çarptın!','Altın: '+coins)}
geo();requestAnimationFrame(loop);
</script></body></html>
