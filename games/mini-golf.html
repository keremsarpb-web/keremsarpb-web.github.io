<style>html,body{margin:0;height:100%;overflow:hidden;background:#14532d;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
const BK='ksb-mini-golf-best';
'use strict';
const cv=document.getElementById('c'),g=cv.getContext('2d');let W=1,H=1,T=0;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth||1;H=innerHeight||1;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
let best=0;try{best=+localStorage.getItem(BK)||0}catch(e){}
function saveBest(s){if(s>best){best=s;try{localStorage.setItem(BK,String(s))}catch(e){}return true}return false}
let AC=null,muted=false;
function snd(f,d,t,v,sl){if(muted||!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(sl,n+d);a.gain.setValueAtTime(v||.12,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume()}
const keys={};let onDown=()=>{},onMove=()=>{},onUp=()=>{},onKey=()=>{};
const pp=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{initAudio();const[x,y]=pp(e);if(x>W-46&&y<46){muted=!muted;return}try{cv.setPointerCapture(e.pointerId)}catch(_){}onDown(x,y)});
cv.addEventListener('pointermove',e=>{const[x,y]=pp(e);onMove(x,y)});
cv.addEventListener('pointerup',e=>{const[x,y]=pp(e);onUp(x,y)});
cv.addEventListener('pointercancel',e=>{const[x,y]=pp(e);onUp(x,y)});
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.key==' ')e.preventDefault();initAudio();if(e.key=='m'||e.key=='M'){muted=!muted;return}if(!keys[e.key])onKey(e.key);keys[e.key]=1});
addEventListener('keyup',e=>{keys[e.key]=0});
const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function tx(s,x,y,sz,c,al,w){g.font=(w||'700')+' '+Math.max(6,sz|0)+'px Fredoka,Nunito,system-ui,sans-serif';g.textAlign=al||'center';g.textBaseline='middle';g.fillStyle=c||'#fff';g.fillText(s,x,y)}
function spk(){g.save();g.globalAlpha=.85;g.fillStyle='#fff';const x=W-30,y=22;g.beginPath();g.moveTo(x-8,y-3);g.lineTo(x-4,y-3);g.lineTo(x+1,y-8);g.lineTo(x+1,y+8);g.lineTo(x-4,y+3);g.lineTo(x-8,y+3);g.fill();g.lineWidth=2;if(muted){g.strokeStyle='#f66';g.beginPath();g.moveTo(x+4,y-5);g.lineTo(x+12,y+5);g.moveTo(x+12,y-5);g.lineTo(x+4,y+5);g.stroke()}else{g.strokeStyle='#fff';g.beginPath();g.arc(x+1,y,6,-1,1);g.stroke()}g.restore()}
let S=1,OX=0,OY=0;function fit(a,b){S=Math.min(W/a,H/b);OX=(W-a*S)/2;OY=(H-b*S)/2}
const P2=(x,y)=>[(x-OX)/S,(y-OY)/S];
const PT=[];function burst(x,y,n,c,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=(.3+Math.random())*(sp||200);PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.5,c,r:2+Math.random()*3})}}
function pstep(dt){for(const p of PT){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt}for(let i=PT.length-1;i>=0;i--)if(PT[i].l<=0)PT.splice(i,1)}
function pdraw(){for(const p of PT){g.globalAlpha=cl(p.l*2,0,1);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,6.3);g.fill()}g.globalAlpha=1}
function ttl(n,sub){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,W,H);g.save();g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=24;const fs=Math.min(W*.13,H*.11,110);tx(n,W/2,H*.3,fs,'#fff','center','800');g.shadowBlur=0;tx(sub,W/2,H*.3+fs*.8,Math.min(W*.05,H*.035,28),'#ffe08a','center','600');g.globalAlpha=.6+.4*Math.sin(T*4);tx('Başlamak için dokun / tıkla',W/2,H*.8,Math.min(W*.055,H*.04,30),'#fff');g.globalAlpha=1;if(best)tx('En iyi: '+best,W/2,H*.87,Math.min(W*.045,H*.03,22),'#ccc','center','600');g.restore()}
function ovr(a,b,c){g.fillStyle='rgba(0,0,0,.62)';g.fillRect(0,0,W,H);tx(a,W/2,H*.3,Math.min(W*.12,H*.09,90),'#fff','center','800');tx(b,W/2,H*.42,Math.min(W*.06,H*.04,34),'#ffe08a');if(c)tx(c,W/2,H*.5,Math.min(W*.05,H*.035,28),'#ccc','center','600');g.globalAlpha=.6+.4*Math.sin(T*4);tx('Tekrar için dokun / tıkla',W/2,H*.72,Math.min(W*.055,H*.04,30),'#fff');g.globalAlpha=1}
let last=performance.now(),UP=()=>{},DR=()=>{};
function loop(t){requestAnimationFrame(loop);const dt=cl((t-last)/1000,0,.033);last=t;if(document.hidden)return;T+=dt;UP(dt);DR();spk()}
document.addEventListener('visibilitychange',()=>{last=performance.now()});
requestAnimationFrame(loop);
const HL=[[2,[200,620],[200,160],[],[],[]],
[3,[200,620],[200,160],[[30,380,210,24]],[],[]],
[3,[90,620],[310,160],[[30,300,200,22],[170,470,200,22]],[],[]],
[3,[200,620],[200,160],[],[],[[30,350,140,100],[230,350,140,100]]],
[3,[70,620],[320,160],[],[[30,300,340,150,300,0]],[]],
[4,[80,620],[80,150],[[30,420,260,22],[110,250,260,22]],[],[]],
[3,[310,620],[100,170],[],[[30,420,340,120,-260,0]],[[30,300,110,70]]],
[4,[300,630],[320,150],[[30,540,230,22],[140,400,230,22],[30,260,230,22]],[],[]],
[4,[200,630],[80,150],[[30,450,150,22],[220,450,150,22]],[[30,150,340,100,220,0]],[[130,290,170,60]]]];
const R=7;let st='title',hi=0,b={x:200,y:620,vx:0,vy:0},mv=false,sunk=false,strokes=0,sc=[],msg='',mt=0,lp={x:200,y:620},anc=null,cur=[0,0],ka=-1.57,ch=0,wm='',wt=0;
const hole=()=>HL[hi],cup=()=>hole()[2];
const BW=[[10,70,20,620],[370,70,20,620],[10,70,380,20],[10,670,380,20]];
function load(){const h=hole();b={x:h[1][0],y:h[1][1],vx:0,vy:0};lp={x:b.x,y:b.y};mv=false;sunk=false;strokes=0;msg='';ka=Math.atan2(h[2][1]-b.y,h[2][0]-b.x)}
function start(){hi=0;sc=[];st='play';load()}
function shoot(vx,vy){lp={x:b.x,y:b.y};b.vx=vx;b.vy=vy;strokes++;mv=true;snd(300+Math.hypot(vx,vy)*.3,.12,'triangle',.2,120)}
function sink(lim){sunk=true;mv=false;b.vx=b.vy=0;sc[hi]=strokes;const d=strokes-hole()[0];msg=lim?'Çok vuruş!':strokes==1?'TEK ATIŞTA!':d<=-2?'Eagle!':d==-1?'Birdie!':d==0?'Par':d==1?'Bogey':'+'+d;mt=1.6;burst(cup()[0],cup()[1],30,'#ffd23f',220);[520,660,780].forEach((f,i)=>setTimeout(()=>snd(f,.2,'square',.08),i*90))}
function next(){hi++;if(hi>=9){hi=8;st='over';const t=sc.reduce((a,c)=>a+c,0);if(!best||t<best){best=t;try{localStorage.setItem(BK,String(t))}catch(e){}}}else load()}
function col(r){const cx=cl(b.x,r[0],r[0]+r[2]),cy=cl(b.y,r[1],r[1]+r[3]);let dx=b.x-cx,dy=b.y-cy,d2=dx*dx+dy*dy,nx,ny;
 if(d2>=R*R)return;if(d2>1e-4){const d=Math.sqrt(d2);nx=dx/d;ny=dy/d;b.x=cx+nx*R;b.y=cy+ny*R}
 else{const l=b.x-r[0],rr=r[0]+r[2]-b.x,t=b.y-r[1],bb=r[1]+r[3]-b.y,m=Math.min(l,rr,t,bb);nx=m==l?-1:m==rr?1:0;ny=m==t?-1:m==bb?1:0;if(nx==0&&ny==0)ny=1;b.x+=nx*(m+R);b.y+=ny*(m+R)*(nx?0:1)}
 const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.8*vn*nx;b.vy-=1.8*vn*ny;if(vn<-60){snd(180,.06,'square',.08);burst(b.x,b.y,3,'#d9a05b',80)}}}
function step(h){const H0=hole();let onS=false;for(const s of H0[4])if(b.x>s[0]&&b.x<s[0]+s[2]&&b.y>s[1]&&b.y<s[1]+s[3]){b.vx+=s[4]*h;b.vy+=s[5]*h;onS=true}
 const sp=Math.hypot(b.vx,b.vy),dec=(onS?60:170)*h;if((sp<=dec&&!onS)||(onS&&sp<14)){b.vx=b.vy=0;mv=false;return}if(sp>0){const f=Math.max(0,sp-dec)/sp;b.vx*=f;b.vy*=f}
 b.x+=b.vx*h;b.y+=b.vy*h;for(const r of H0[3])col(r);for(const r of BW)col(r);
 for(const w of H0[5])if(b.x>w[0]&&b.x<w[0]+w[2]&&b.y>w[1]&&b.y<w[1]+w[3]){burst(b.x,b.y,24,'#7cc4ff',180);snd(400,.3,'sine',.12,90);strokes++;b.x=lp.x;b.y=lp.y;b.vx=b.vy=0;mv=false;wm='Suya düştü +1';wt=1.2;return}
 const c=cup(),dx=c[0]-b.x,dy=c[1]-b.y,d=Math.hypot(dx,dy),s2=Math.hypot(b.vx,b.vy);
 if(d<16&&s2<420){b.x=c[0];b.y=c[1];sink(false)}else if(d<24){b.vx+=dx/d*300*h;b.vy+=dy/d*300*h}}
UP=dt=>{pstep(dt);wt-=dt;if(st!='play')return;
 if(sunk){mt-=dt;if(mt<0)next();return}
 if(!mv){if(keys.ArrowLeft)ka-=1.8*dt;if(keys.ArrowRight)ka+=1.8*dt;if(keys[' ']){ch=Math.min(1,ch+dt*.9)}else if(ch>.05){shoot(Math.cos(ka)*ch*640,Math.sin(ka)*ch*640);ch=0}else ch=0}
 else{const n=Math.ceil(Math.hypot(b.vx,b.vy)*dt/3)||1;for(let i=0;i<n&&mv&&!sunk;i++)step(dt/n);if(!mv&&!sunk&&strokes>=9)sink(true)}};
onDown=(x,y)=>{if(st!='play'){if(st=='title'||T>0){start()}return}if(mv||sunk)return;const[a,c]=P2(x,y);anc=[a,c];cur=[a,c]};
onMove=(x,y)=>{cur=P2(x,y)};
onUp=()=>{if(anc){const dx=anc[0]-cur[0],dy=anc[1]-cur[1],l=Math.hypot(dx,dy);if(l>10&&!mv&&!sunk){const k=Math.min(640,l*5)/l;shoot(dx*k,dy*k)}anc=null}};
onKey=k=>{if(st!='play')start()};
function aimV(){if(anc){const dx=anc[0]-cur[0],dy=anc[1]-cur[1],l=Math.hypot(dx,dy);if(l<10)return null;const k=Math.min(640,l*5)/l;return[dx*k,dy*k]}if(ch>0)return[Math.cos(ka)*ch*640,Math.sin(ka)*ch*640];return null}
DR=()=>{const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0d3b23');gr.addColorStop(1,'#1e6b3a');g.fillStyle=gr;g.fillRect(0,0,W,H);fit(400,700);g.save();g.translate(OX,OY);g.scale(S,S);
 const h=hole(),c=h[2];g.fillStyle='#3fb765';g.fillRect(30,90,340,580);g.fillStyle='#0001';for(let y=90,i=0;y<670;y+=40,i++)if(i%2)g.fillRect(30,y,340,40);
 for(const s of h[4]){g.fillStyle='#6fe08a';g.fillRect(s[0],s[1],s[2],s[3]);g.strokeStyle='#2c8a4a';g.lineWidth=3;const dx=Math.sign(s[4]),dy=Math.sign(s[5]),o=(T*40)%40;for(let x=s[0]+20;x<s[0]+s[2];x+=40)for(let y=s[1]+20;y<s[1]+s[3];y+=40){const px=x+dx*(o-20),py=y+dy*(o-20);g.beginPath();g.moveTo(px-dx*8-dy*6,py-dy*8+dx*6);g.lineTo(px+dx*8,py+dy*8);g.lineTo(px-dx*8+dy*6,py-dy*8-dx*6);g.stroke()}}
 for(const w of h[5]){g.fillStyle='#2a7fd4';g.fillRect(w[0],w[1],w[2],w[3]);g.strokeStyle='#8fd0ff';g.lineWidth=2;for(let y=w[1]+12;y<w[1]+w[3];y+=18){g.beginPath();for(let x=w[0];x<=w[0]+w[2];x+=8)g.lineTo(x,y+Math.sin(T*3+x*.1+y)*3);g.stroke()}}
 g.fillStyle='#000';g.beginPath();g.arc(c[0],c[1],11,0,6.3);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(c[0],c[1]);g.lineTo(c[0],c[1]-46);g.stroke();g.fillStyle='#ff4d4d';g.beginPath();g.moveTo(c[0],c[1]-46);g.lineTo(c[0]+22,c[1]-39);g.lineTo(c[0],c[1]-32);g.fill();
 for(const r of h[3].concat(BW)){g.fillStyle='#7a4a1e';g.fillRect(r[0],r[1],r[2],r[3]);g.fillStyle='#c68a4a';g.fillRect(r[0],r[1],r[2],4)}
 g.fillStyle='#0004';g.beginPath();g.ellipse(b.x+2,b.y+4,R,R*.7,0,0,6.3);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(b.x,b.y,R,0,6.3);g.fill();g.fillStyle='#ddd';g.beginPath();g.arc(b.x-2,b.y-2,2.5,0,6.3);g.fill();
 const v=aimV();if(v&&st=='play'){const l=Math.hypot(v[0],v[1]),ux=v[0]/l,uy=v[1]/l;g.fillStyle='#fff';for(let i=1;i<=8;i++){g.globalAlpha=1-i/10;g.beginPath();g.arc(b.x+ux*(14+i*l/640*30),b.y+uy*(14+i*l/640*30),3,0,6.3);g.fill()}g.globalAlpha=1;g.fillStyle='#0006';g.fillRect(120,682,160,10);g.fillStyle='hsl('+(120-l/640*120)+',90%,55%)';g.fillRect(120,682,160*l/640,10)}
 pdraw();
 if(st=='play'){const tot=sc.reduce((a,c)=>a+c,0),pt=HL.slice(0,sc.length).reduce((a,c)=>a+c[0],0);
  tx('Delik '+(hi+1)+'/9',20,28,22,'#fff','left');tx('Par '+h[0],200,28,22,'#ffe08a');tx('Vuruş '+strokes,380,28,22,'#fff','right');
  tx('Toplam '+tot+(sc.length?' ('+(tot-pt>0?'+':'')+(tot-pt)+')':''),200,58,16,'#cfe','center','600');
  if(wt>0)tx(wm,200,400,30,'#9df');if(sunk)tx(msg,200,360,56,'#fff','center','800');
  else if(!mv&&!anc&&strokes==0&&hi<2)tx('Geri sürükle ve bırak (ok tuşları + boşluk)',200,640,15,'#fff','center','600')}
 g.restore();
 if(st=='title')ttl('Mini Golf','9 delik · en az vuruş kazanır');
 if(st=='over'){const t=sc.reduce((a,c)=>a+c,0),p=HL.reduce((a,c)=>a+c[0],0);ovr('BİTTİ!',t+' vuruş (par '+p+')',(t-p>0?'+':'')+(t-p)+' · En iyi: '+best)}};

</script></body></html>
