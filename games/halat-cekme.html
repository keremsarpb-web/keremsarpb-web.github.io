<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Halat Çekme – KSB Games</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head>
<body><canvas id="c"></canvas><script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),ID='halat-cekme';let W=1,H=1,S=1,best=0,AC,muted=false,state='title',score=0,shake=0,tm=0,parts=[],ot=0;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);S=Math.min(W,H)}
addEventListener('resize',rs);rs();
try{best=+localStorage.getItem('ksb-'+ID+'-best')||0}catch(e){}
function sv(){if(score>best){best=score;try{localStorage.setItem('ksb-'+ID+'-best',best)}catch(e){}}}
function snd(f,d,t,v,sl){if(muted||!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);a.gain.setValueAtTime(v||.06,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function T(s,x,y,z,c,a,w){g.font=(w||700)+' '+z+'px Fredoka,Nunito,system-ui,sans-serif';g.textAlign=a||'center';g.textBaseline='middle';g.fillStyle=c||'#fff';g.fillText(s,x,y)}
function RR(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function P(x,y,n,c,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(sp||150)*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.7,c})}}
function upP(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt}parts=parts.filter(p=>p.l>0)}
function drP(){for(const p of parts){g.globalAlpha=Math.max(0,p.l/.7);g.fillStyle=p.c;g.fillRect(p.x-2,p.y-2,4,4)}g.globalAlpha=1}
function titleScr(name,sub,y0){const z=Math.min(S*.15,W*.92/(name.length*.62));y0=y0||H*.3;g.save();g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=z*.2;g.shadowOffsetY=z*.06;T(name,W/2,y0+Math.sin(tm*2)*z*.05,z,'#fff',0,800);g.restore();if(sub)T(sub,W/2,y0+z*.85,Math.max(13,z*.3),'rgba(255,255,255,.9)',0,500);g.globalAlpha=.65+.35*Math.sin(tm*4);T('Başlamak için dokun / tıkla',W/2,H*.78,Math.max(15,Math.min(S*.05,30)),'#fff',0,700);g.globalAlpha=1;if(best)T('En iyi: '+best,W/2,H*.78+Math.max(28,S*.08),Math.max(13,S*.035),'#ffe',0,500)}
function overScr(t,l2){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,H);const z=Math.min(S*.11,W*.9/(t.length*.62));T(t,W/2,H*.32,z,'#fff',0,800);T('Skor: '+score,W/2,H*.32+z*1.1,z*.55,'#ffd54a');T('En iyi: '+best,W/2,H*.32+z*1.8,z*.4,'#fff',0,500);if(l2)T(l2,W/2,H*.32+z*2.4,z*.35,'#cde',0,500);if(ot>.5){g.globalAlpha=.6+.4*Math.sin(tm*4);T('Tekrar için dokun / tıkla',W/2,H*.75,Math.max(15,Math.min(S*.05,30)));g.globalAlpha=1}}
const IN={down(){},up(){},mv(){},kd(){},ku(){}};
function initA(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
cv.addEventListener('pointerdown',e=>{e.preventDefault();initA();if(e.clientX>W-50&&e.clientY<50){muted=!muted;return}IN.down(e.clientX,e.clientY,e.pointerId)});
addEventListener('pointerup',e=>IN.up(e.clientX,e.clientY,e.pointerId));
addEventListener('pointercancel',e=>IN.up(e.clientX,e.clientY,e.pointerId));
addEventListener('pointermove',e=>IN.mv(e.clientX,e.clientY,e.pointerId));
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();initA();if(e.repeat)return;if(e.key==='m'||e.key==='M'){muted=!muted;return}IN.kd(e.key)});
addEventListener('keyup',e=>IN.ku(e.key));
function spk(){const x=W-26,y=26;g.save();g.globalAlpha=.8;g.fillStyle='#fff';g.fillRect(x-9,y-4,5,8);g.beginPath();g.moveTo(x-4,y-4);g.lineTo(x+2,y-9);g.lineTo(x+2,y+9);g.lineTo(x-4,y+4);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();if(muted){g.moveTo(x+5,y-5);g.lineTo(x+13,y+5);g.moveTo(x+13,y-5);g.lineTo(x+5,y+5)}else g.arc(x+2,y,7,-1,1);g.stroke();g.restore()}
let last=performance.now();
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;if(document.hidden)dt=0;tm+=dt;if(state==='over')ot+=dt;shake=Math.max(0,shake-dt*40);if(dt>0)step(dt);g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);render();g.restore();spk();requestAnimationFrame(loop)}
/* ---- game ---- */
const C1='#2f80ed',C2='#eb4d4b';let pos=0,mode=1,cd=0,streak=0,w1=0,w2=0,aiT=0,aiPh=0,res=0,resT=0,pul=[0,0],taps=[0,0],msg='',winner=0,rnd=0;
const port=()=>W<=H*1.1,L=()=>(port()?H:W)/2/1.3;
function P2(s,b){return port()?[W/2+b,H/2-s*L()]:[W/2+s*L(),H/2+b]}
function btnR(i){const w=Math.min(W*.8,S*(port()?.7:.5)),h=Math.max(48,S*(port()?.11:.09));return[W/2-w/2,H*(port()?.6:.5)+i*(h+14),w,h]}
function start(m){mode=m;streak=0;w1=w2=0;score=0;state='play';newRound()}
function newRound(){pos=0;cd=2.4;res=0;resT=0;aiT=0;aiPh=Math.random()*6;taps=[0,0];msg=''}
function tap(p){if(state!=='play'||cd>0||res)return;pos+=p===0?-.034:.034;pul[p]=1;taps[p]++;snd(p?330:260,.05,'square',.04);
 if(pos<=-1)fin(0);else if(pos>=1)fin(1)}
function fin(p){res=1;resT=0;winner=p;pos=p?1:-1;shake=10;P(...P2(p?.9:-.9,0),24,p?C2:C1,260);snd(p?400:600,.5,'triangle',.09,300);
 if(mode===1){if(p===0){streak++;score=streak;sv();msg='Tur senin!'}else msg='Yenildin!'}else{if(p)w2++;else w1++;msg=p?'Kırmızı turu aldı!':'Mavi turu aldı!'}}
IN.down=(x,y)=>{if(state==='title'){for(let i=0;i<2;i++){const[bx,by,bw,bh]=btnR(i);if(x>=bx&&x<=bx+bw&&y>=by&&y<=by+bh){start(i+1);return}}start(mode);return}
 if(state==='over'){if(ot>.6)start(mode);return}
 if(mode===1)tap(0);else{const top=port()?y<H/2:x>W/2;tap(top?1:0)}};
IN.kd=k=>{if(state==='title'){if(k==='2')start(2);else start(1);return}if(state==='over'){if(ot>.6)start(mode);return}
 if(k==='a'||k==='A'||k===' '||k==='Enter'||k==='z'||k==='Z')tap(0);else if(mode===2&&(k==='l'||k==='L'||k==='ArrowRight'||k==='ArrowUp'))tap(1);else if(mode===1&&k.length===1)tap(0)};
function step(dt){upP(dt);pul[0]=Math.max(0,pul[0]-dt*6);pul[1]=Math.max(0,pul[1]-dt*6);if(state!=='play')return;
 if(cd>0){const o=Math.ceil(cd);cd-=dt;if(Math.ceil(cd)!==o&&cd>0)snd(500,.1,'sine',.06);if(cd<=0)snd(900,.25,'square',.08);return}
 if(res){resT+=dt;if(resT>1.6){if(mode===1){if(winner===0){rnd++;newRound()}else{sv();state='over';ot=0}}else{if(w1>=3||w2>=3){state='over';ot=0}else newRound()}}return}
 if(mode===1){aiT+=dt;const base=5+Math.min(4,streak*.5),rate=base*(.6+.7*Math.abs(Math.sin(tm*.9+aiPh)));if(aiT>1/rate){aiT=0;tap(1)}}}
function chr(s,col,dirS,p){const[x,y]=P2(s,0),r=Math.min(S*.075,L()*.18)*(1+pul[p]*.15),[ex,ey]=port()?[0,dirS]:[-dirS,0],lx=port()?1:0,ly=port()?0:1;
 g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.ellipse(x+3,y+r*.9,r,r*.5,0,0,7);g.fill();
 g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.fillStyle='#ffd9b0';g.beginPath();g.arc(x+ex*r*.25,y+ey*r*.25,r*.62,0,7);g.fill();
 g.fillStyle='#222';for(const q of[-1,1]){g.beginPath();g.arc(x+ex*r*.5+lx*q*r*.25,y+ey*r*.5+ly*q*r*.25,r*.08,0,7);g.fill()}
 g.fillStyle=col;g.fillRect(x-r*.5*(lx?1:.15),y-r*.5*(ly?1:.15),r*(lx?1:.3),r*(ly?1:.3));
 g.fillStyle='#ffd9b0';g.beginPath();g.arc(x+ex*r*1.1,y+ey*r*1.1,r*.28,0,7);g.fill()}
function render(){
 const pt=port();g.fillStyle='#4caf50';g.fillRect(0,0,W,H);const span=pt?H:W,band=span/10;for(let i=0;i<10;i++){if(i%2){g.fillStyle='rgba(0,0,0,.07)';if(pt)g.fillRect(0,i*band,W,band);else g.fillRect(i*band,0,band,H)}}
 g.fillStyle='rgba(47,128,237,.18)';if(pt)g.fillRect(0,H/2,W,H/2);else g.fillRect(0,0,W/2,H);g.fillStyle='rgba(235,77,75,.18)';if(pt)g.fillRect(0,0,W,H/2);else g.fillRect(W/2,0,W/2,H);
 const[mx,my]=P2(0,0);g.fillStyle='#6d4c2a';g.beginPath();g.ellipse(mx,my,pt?S*.35:L()*.18,pt?L()*.18:S*.3,0,0,7);g.fill();g.fillStyle='rgba(255,255,255,.7)';
 for(const s of[-.9,.9]){const[a,b]=P2(s,-S*.6),[c,d]=P2(s,S*.6);g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=4;g.setLineDash([12,10]);g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke();g.setLineDash([])}
 const fs=pos*.9,[f1x,f1y]=P2(fs-.3,0),[f2x,f2y]=P2(fs+.3,0),[fx,fy]=P2(fs,0);
 if(state==='title'){const t=Math.sin(tm*3)*.1;g.strokeStyle='#d9b26a';g.lineWidth=Math.max(5,S*.012);g.beginPath();const[a,b]=P2(-.4+t,0),[c,d]=P2(.4+t,0);g.moveTo(a,b);g.lineTo(c,d);g.stroke();pul[0]=pul[1]=.5+Math.sin(tm*8)*.5;pos=t;
  g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,W,H);chr(-.5+t,C1,-1,0);chr(.5+t,C2,1,1);titleScr('Halat Çekme','Hızlı dokun, halatı kendi tarafına çek!',H*.18);
  for(let i=0;i<2;i++){const[bx,by,bw,bh]=btnR(i);g.fillStyle=i?C2:C1;RR(bx,by,bw,bh,bh*.3);g.fill();T(i?'2 Oyuncu':'Yapay Zekâya Karşı',bx+bw/2,by+bh/2,bh*.42,'#fff')}return}
 g.strokeStyle='#d9b26a';g.lineWidth=Math.max(5,S*.012);g.beginPath();g.moveTo(f1x,f1y);g.lineTo(f2x,f2y);g.stroke();
 g.fillStyle='#ffeb3b';g.beginPath();g.arc(fx,fy,Math.max(7,S*.02),0,7);g.fill();g.strokeStyle='#333';g.lineWidth=2;g.stroke();
 chr(fs-.3,C1,-1,0);chr(fs+.3,C2,1,1);drP();
 const z=Math.max(14,Math.min(S*.045,24));
 const[ax,ay]=P2(-1.08,0),[bx,by]=P2(1.08,0);
 if(cd<=0&&!res){g.globalAlpha=.5+.3*Math.sin(tm*8);T('DOKUN!',pt?W/2:W*.25,pt?H*.9:H*.9,S*.08,'#fff');if(mode===2){g.save();if(pt){g.translate(W/2,H*.1);g.rotate(Math.PI)}else g.translate(W*.75,H*.9);T('DOKUN!',0,0,S*.08,'#fff');g.restore()}g.globalAlpha=1}
 const lab1=mode===1?'Sen':'Mavi',lab2=mode===1?'Yapay Zekâ':'Kırmızı';
 T(lab1,pt?W/2:W*.25,pt?H-z*1.6:z+2,z,C1==='x'?'#fff':'#cfe3ff');
 if(pt&&mode===2){g.save();g.translate(W/2,z*1.6);g.rotate(Math.PI);T(lab2,0,0,z,'#ffd0d0');g.restore()}else T(lab2,pt?W/2:W*.75,pt?z*1.6:z+2,z,'#ffd0d0');
 if(mode===1)T('Seri: '+streak,pt?12:W/2,pt?H/2-z*1.5:z*2.6,z*.9,'#fff',pt?'left':'center',700);else T(w1+' - '+w2,W/2,pt?H/2:z*2.6,z*1.3,'#fff');
 if(cd>0)T(cd>.6?String(Math.ceil(cd-.6)):'ÇEK!',W/2,H/2,S*.2,'#fff',0,800);
 if(res)T(msg,W/2,H*.4,S*.09,'#fff',0,800);
 if(state==='over'){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,H);const t=mode===1?'Yenildin':(w1>w2?'Mavi Kazandı!':'Kırmızı Kazandı!');T(t,W/2,H*.32,Math.min(S*.11,W*.9/(t.length*.62)),'#fff',0,800);if(mode===1){T('Seri: '+streak,W/2,H*.43,S*.06,'#ffd54a');T('En iyi: '+best,W/2,H*.5,S*.045,'#fff',0,500)}else T(w1+' - '+w2,W/2,H*.43,S*.07,'#ffd54a');if(ot>.5){g.globalAlpha=.6+.4*Math.sin(tm*4);T('Tekrar için dokun / tıkla',W/2,H*.75,Math.max(15,Math.min(S*.05,30)));g.globalAlpha=1}}}
requestAnimationFrame(loop);
</script></body></html>
