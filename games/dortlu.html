<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dörtlü</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#2a1046;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
'use strict';
const ID='dortlu',FF='"Lilita One",system-ui,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=1,H=1,DPR=1,hidden=false,last=performance.now(),t=0;
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}};
let best=+store.get('ksb-'+ID+'-best',0)||0,muted=store.get('ksb-'+ID+'-mute','0')==='1';
let AC=null,master=null;
function audio(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination)}catch(e){AC=null}}
function tone(f,d,type,v,f2,dl){if(!AC||muted)return;const s=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v||.2,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(master);o.start(s);o.stop(s+d+.05)}
function toggleMute(){muted=!muted;store.set('ksb-'+ID+'-mute',muted?'1':'0');if(master)master.gain.value=muted?0:.5}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(s,x,y,sz,col,al,wt,glow){ctx.font=(wt||400)+' '+Math.max(6,sz|0)+'px '+FF;ctx.textAlign=al||'center';ctx.textBaseline='middle';if(glow){ctx.shadowColor=glow;ctx.shadowBlur=sz*.4}ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.shadowBlur=0}
const btns=[];
function button(label,x,y,w,h,fn,col,on){ctx.fillStyle='rgba(0,0,0,.25)';rr(x,y+4,w,h,h*.35);ctx.fill();rr(x,y,w,h,h*.35);ctx.fillStyle=on?col:'rgba(255,255,255,.1)';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=col;ctx.stroke();txt(label,x+w/2,y+h/2+1,Math.min(h*.46,w/(label.length*.58)),on?'#2a1046':'#fff');btns.push({x,y,w,h,fn})}
function hitBtn(x,y){for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();return true}}return false}
function drawMute(){const x=W-44,y=10;ctx.save();ctx.fillStyle='rgba(255,255,255,.14)';rr(x,y,34,34,10);ctx.fill();ctx.fillStyle=ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+7,y+13);ctx.lineTo(x+12,y+13);ctx.lineTo(x+18,y+8);ctx.lineTo(x+18,y+26);ctx.lineTo(x+12,y+21);ctx.lineTo(x+7,y+21);ctx.closePath();ctx.fill();ctx.beginPath();if(muted){ctx.moveTo(x+21,y+13);ctx.lineTo(x+28,y+21);ctx.moveTo(x+28,y+13);ctx.lineTo(x+21,y+21)}else{ctx.arc(x+19,y+17,5,-.9,.9);ctx.moveTo(x+24.5,y+10);ctx.arc(x+19,y+17,9,-.9,.9)}ctx.stroke();ctx.restore()}
function drawHome(){const x=10,y=10;ctx.fillStyle='rgba(255,255,255,.14)';rr(x,y,34,34,10);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(x+17,y+8);ctx.lineTo(x+27,y+17);ctx.lineTo(x+24,y+17);ctx.lineTo(x+24,y+26);ctx.lineTo(x+10,y+26);ctx.lineTo(x+10,y+17);ctx.lineTo(x+7,y+17);ctx.closePath();ctx.fill()}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);layout()}
// ---------- Mantık / Yapay zekâ ----------
const ROWS=6,COLS=7,ORD=[3,2,4,1,5,0,6];
let g=[];
const WINS=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){const er=r+3*dr,ec=c+3*dc;if(er>=0&&er<ROWS&&ec>=0&&ec<COLS)WINS.push([0,1,2,3].map(k=>[r+k*dr,c+k*dc]))}
function emptyGrid(){return Array.from({length:ROWS},()=>Array(COLS).fill(0))}
function colTop(c){for(let r=ROWS-1;r>=0;r--)if(!g[r][c])return r;return -1}
function line(r,c,p,dr,dc){const cells=[[r,c]];for(const s of [1,-1]){let rr2=r+dr*s,cc=c+dc*s;while(rr2>=0&&rr2<ROWS&&cc>=0&&cc<COLS&&g[rr2][cc]===p){cells.push([rr2,cc]);rr2+=dr*s;cc+=dc*s}}return cells}
function winAt(r,c,p){for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]])if(line(r,c,p,dr,dc).length>=4)return true;return false}
function winCells(r,c,p){let out=[];for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){const l=line(r,c,p,dr,dc);if(l.length>=4)out=out.concat(l)}return out}
function full(){for(let c=0;c<COLS;c++)if(!g[0][c])return false;return true}
// Hızlı arama: düz dizi (r*7+c) + sütun yükseklikleri, alfa-beta negamax
const WF=new Int8Array(WINS.length*4);WINS.forEach((w,i)=>w.forEach(([r,c],k)=>{WF[i*4+k]=r*7+c}));
const F=new Int8Array(42),HT=new Int8Array(7),DIRS=[[0,1],[1,0],[1,1],[1,-1]];
function fWin(r,c,p){for(const [dr,dc] of DIRS){let n=1;for(const s of [1,-1]){let y=r+dr*s,x=c+dc*s;while(y>=0&&y<ROWS&&x>=0&&x<COLS&&F[y*7+x]===p){n++;y+=dr*s;x+=dc*s}}if(n>=4)return true}return false}
function evalB(p){const o=3-p;let s=0;for(let r=0;r<ROWS;r++){const v=F[r*7+3];if(v===p)s+=3;else if(v===o)s-=3}
 for(let i=0;i<WF.length;i+=4){let a=0,b=0;for(let k=0;k<4;k++){const v=F[WF[i+k]];if(v===p)a++;else if(v===o)b++}if(b===0){if(a===3)s+=6;else if(a===2)s+=2}else if(a===0){if(b===3)s-=8;else if(b===2)s-=2}}return s}
function negamax(d,al,be,p){let bestS=-1e9,any=false;for(let k=0;k<7;k++){const c=ORD[k];if(HT[c]>=ROWS)continue;const r=ROWS-1-HT[c];if(F[r*7+c]===0){F[r*7+c]=p;const w=fWin(r,c,p);F[r*7+c]=0;if(w)return 1e6+d}}
 for(let k=0;k<7;k++){const c=ORD[k];if(HT[c]>=ROWS)continue;any=true;const r=ROWS-1-HT[c];F[r*7+c]=p;HT[c]++;const s=d<=1?evalB(p):-negamax(d-1,-be,-al,3-p);F[r*7+c]=0;HT[c]--;if(s>bestS)bestS=s;if(bestS>al)al=bestS;if(al>=be)break}return any?bestS:0}
function aiMove(p,depth,rand){const legal=ORD.filter(c=>colTop(c)>=0);if(!legal.length)return -1;
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)F[r*7+c]=g[r][c];for(let c=0;c<COLS;c++){let n=0;for(let r=0;r<ROWS;r++)if(g[r][c])n++;HT[c]=n}
 for(const c of legal){const r=ROWS-1-HT[c];F[r*7+c]=p;const w=fWin(r,c,p);F[r*7+c]=0;if(w)return c}
 if(rand&&Math.random()<rand)return legal[Math.random()*legal.length|0];
 let bestS=-Infinity,bestC=legal[0],ties=[];for(const c of legal){const r=ROWS-1-HT[c];F[r*7+c]=p;HT[c]++;const s=depth<=1?evalB(p):-negamax(depth-1,-1e9,bestS===-Infinity?1e9:-(bestS-1),3-p);F[r*7+c]=0;HT[c]--;if(s>bestS){bestS=s;bestC=c;ties=[c]}else if(s===bestS)ties.push(c)}
 return ties.length>1&&Math.random()<.5?ties[Math.random()*ties.length|0]:bestC}
// ---------- Oyun ----------
const P=[null,{c:'#ff4d6d',d:'#b8213f',n:'KIRMIZI'},{c:'#ffc93c',d:'#c98a0b',n:'SARI'}],MODES=['KOLAY','ORTA','ZOR','2 KİŞİLİK'],DEPTH=[2,4,8],RAND=[.35,.05,0];
let state='title',sel=1,mode=1,turn=1,starter=2,fall=null,result=null,resT=0,tally=[0,0,0],streak=0,thinkT=0,hover=3,kbOn=false,parts=[],decor=[],lastMove=null;
let cell=60,bx=0,by=0,bw=0,bh=0,hudY=60;
function layout(){cell=Math.min(W*.94/COLS,(H-150)/7.3,96);bw=cell*COLS;bh=cell*ROWS;bx=(W-bw)/2;by=H*.56-bh/2;hudY=Math.max(58,by-cell*1.2-40)}
function newMatch(m){mode=m;tally=[0,0,0];starter=2;state='play';nextRound();tone(392,.12,'triangle',.12);tone(587,.16,'triangle',.12,0,.1)}
function nextRound(){g=emptyGrid();fall=null;result=null;lastMove=null;starter=3-starter;turn=starter;thinkT=.6}
const cpuTurn=()=>mode<3&&turn===2;
function drop(c){if(state!=='play'||result||fall||c<0||c>=COLS)return;const r=colTop(c);if(r<0){tone(120,.1,'square',.06);return}fall={c,r,p:turn,y:by-cell*.6,vy:0,b:0};tone(500,.06,'triangle',.08,350)}
function land(){const {c,r,p}=fall;g[r][c]=p;lastMove=[r,c];fall=null;tone(180+r*25,.1,'sine',.2);tone(90,.08,'triangle',.15);
 if(winAt(r,c,p)){const cells=winCells(r,c,p);result={w:p,cells,t:t};resT=0;tally[p===1?0:2]++;if(mode<3){if(p===1){streak++;if(streak>best){best=streak;store.set('ksb-'+ID+'-best',best)}}else streak=0}
  for(const [rr2,cc] of cells)for(let k=0;k<14;k++){const a=Math.random()*6.28,v=cell*(2+Math.random()*6);parts.push({x:bx+(cc+.5)*cell,y:by+(rr2+.5)*cell,vx:Math.cos(a)*v,vy:Math.sin(a)*v-cell*4,l:0,m:.8+Math.random()*.7,c:k%3?P[p].c:'#fff'})}
  const good=mode===3||p===1;(good?[523,659,784,1047,1319]:[440,370,311,262]).forEach((f,i)=>tone(f,.25,good?'triangle':'sawtooth',good?.13:.07,0,.15+i*.11))}
 else if(full()){result={w:0,cells:[],t:t};resT=0;tally[1]++;[392,349].forEach((f,i)=>tone(f,.25,'triangle',.12,0,i*.15))}
 else{turn=3-turn;thinkT=.35}}
function update(dt){for(const q of parts){q.l+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=cell*14*dt}parts=parts.filter(q=>q.l<q.m);for(const d of decor){d.y+=d.v*dt;if(d.y>H+60){d.y=-60;d.x=Math.random()*W}}
 if(state!=='play')return;if(result){resT+=dt;return}
 if(fall){const ty=by+(fall.r+.5)*cell;fall.vy+=cell*40*dt;fall.y+=fall.vy*dt;if(fall.y>=ty){fall.y=ty;if(fall.vy>cell*6&&fall.b<2){fall.vy=-fall.vy*.28;fall.b++;if(fall.b===1)tone(260,.05,'sine',.08)}else land()}return}
 if(cpuTurn()){thinkT-=dt;if(thinkT<=0){thinkT=99;drop(aiMove(2,DEPTH[mode],RAND[mode]))}}}
// ---------- Çizim ----------
function disc(x,y,rad,p,a){ctx.globalAlpha=a==null?1:a;const q=P[p],gr=ctx.createRadialGradient(x-rad*.3,y-rad*.35,rad*.1,x,y,rad);gr.addColorStop(0,'#fff');gr.addColorStop(.18,q.c);gr.addColorStop(1,q.d);ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,rad,0,6.2832);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=rad*.1;ctx.beginPath();ctx.arc(x,y,rad*.68,0,6.2832);ctx.stroke();ctx.globalAlpha=1}
function bg(){const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#2a1046');gr.addColorStop(.6,'#6a1f6b');gr.addColorStop(1,'#ff7a59');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
 const sr=Math.min(W,H)*.35,sg=ctx.createRadialGradient(W/2,H*.98,0,W/2,H*.98,sr*2);sg.addColorStop(0,'rgba(255,214,120,.55)');sg.addColorStop(1,'rgba(255,214,120,0)');ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);
 for(const d of decor)disc(d.x,d.y,d.s,d.p,.18)}
function drawBoard(){const R=cell*.38,hv=(!result&&!fall&&!cpuTurn())?hover:-1;
 if(hv>=0){ctx.fillStyle='rgba(255,255,255,.08)';rr(bx+hv*cell+4,by-cell*1.1,cell-8,bh+cell*1.1,cell*.4);ctx.fill();const bob=Math.sin(t*5)*cell*.05;disc(bx+(hv+.5)*cell,by-cell*.6+bob,R,turn,.95)}
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(g[r][c])disc(bx+(c+.5)*cell,by+(r+.5)*cell,R,g[r][c]);
 if(fall)disc(bx+(fall.c+.5)*cell,fall.y,R,fall.p);
 ctx.save();ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=30;ctx.shadowOffsetY=10;const pad=cell*.18,gr=ctx.createLinearGradient(0,by,0,by+bh);gr.addColorStop(0,'#3d6bff');gr.addColorStop(1,'#1d3bb8');ctx.fillStyle=gr;rr(bx-pad,by-pad,bw+pad*2,bh+pad*2,cell*.3);
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const x=bx+(c+.5)*cell,y=by+(r+.5)*cell;ctx.moveTo(x+R*1.06,y);ctx.arc(x,y,R*1.06,0,6.2832,true)}ctx.fill('evenodd');ctx.restore();
 ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;rr(bx-pad,by-pad,bw+pad*2,bh+pad*2,cell*.3);ctx.stroke();
 ctx.fillStyle='#1a2f8f';ctx.fillRect(bx-pad-cell*.15,by+bh+pad-2,cell*.35,cell*.5);ctx.fillRect(bx+bw+pad-cell*.2,by+bh+pad-2,cell*.35,cell*.5);
 if(lastMove&&!result){ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(bx+(lastMove[1]+.5)*cell,by+(lastMove[0]+.5)*cell,R*.15,0,6.2832);ctx.fill()}
 if(result&&result.cells.length){const k=Math.min(1,(t-result.t)/.3);ctx.strokeStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=20;ctx.lineWidth=cell*.07*(1+Math.sin(t*8)*.3);for(const [r,c] of result.cells){ctx.globalAlpha=k;ctx.beginPath();ctx.arc(bx+(c+.5)*cell,by+(r+.5)*cell,R*(1.05+.08*Math.sin(t*8)),0,6.2832);ctx.stroke()}ctx.globalAlpha=1;ctx.shadowBlur=0}}
function drawHud(){const lx=mode<3?['SEN','BERABERE','CPU']:['KIRMIZI','BERABERE','SARI'],cols=[P[1].c,'#e9d8ff',P[2].c],w=Math.min(W*.29,150),h=Math.min(60,W*.15);
 for(let i=0;i<3;i++){const x=W/2+(i-1)*(w+8)-w/2,act=!result&&((i===0&&turn===1)||(i===2&&turn===2));ctx.fillStyle=act?'rgba(255,255,255,.2)':'rgba(255,255,255,.08)';rr(x,hudY-h/2,w,h,14);ctx.fill();if(act){ctx.strokeStyle=cols[i];ctx.lineWidth=2.5;ctx.stroke()}txt(lx[i],x+w/2,hudY-h*.2,h*.25,cols[i]);txt(String(tally[i]),x+w/2,hudY+h*.2,h*.4,'#fff')}
 txt('DÖRTLÜ · '+MODES[mode],W/2,27,16,'rgba(255,255,255,.65)');
 if(!result){const s=cpuTurn()?'Bilgisayar düşünüyor…':mode<3?'Sıra sende!':'Sıra: '+P[turn].n;txt(s,W/2,by+bh+Math.min(cell*.9,(H-by-bh)*.5),Math.min(W*.055,26),P[turn].c,'center',400,'rgba(0,0,0,.5)')}}
function drawResult(){if(resT<.9)return;const a=Math.min(1,(resT-.9)*4);ctx.globalAlpha=a;ctx.fillStyle='rgba(30,10,50,.72)';ctx.fillRect(0,0,W,H);const w=result.w;let msg;if(mode<3)msg=w===1?'KAZANDIN!':w===2?'BİLGİSAYAR KAZANDI':'BERABERE';else msg=w?P[w].n+' KAZANDI!':'BERABERE';
 const s=Math.min(W*.13,84);txt(msg,W/2,H*.32,Math.min(s,W*.9/(msg.length*.55)),w?P[w].c:'#fff','center',400,'rgba(0,0,0,.6)');
 txt(tally[0]+'  ·  '+tally[1]+'  ·  '+tally[2],W/2,H*.43,s*.55,'#fff');if(mode<3)txt('Seri: '+streak+' · En iyi seri: '+best,W/2,H*.51,s*.3,'#ffc93c');
 ctx.globalAlpha=a*(.6+.4*Math.sin(t*4));txt('Devam etmek için dokun / tıkla',W/2,H*.6,Math.min(W*.05,26),'#fff');ctx.globalAlpha=a;
 const bw2=Math.min(W*.6,260),bh2=Math.min(54,H*.07);button('ANA MENÜ',(W-bw2)/2,H*.68,bw2,bh2,()=>{state='title'},'#ffc93c');ctx.globalAlpha=1}
function drawTitle(){const s=Math.min(W*.19,H*.12,150),y=H*.25;ctx.save();ctx.translate(W/2,y);ctx.rotate(Math.sin(t*1.3)*.02);txt('DÖRTLÜ',0,6,s,'rgba(0,0,0,.35)');txt('DÖRTLÜ',0,0,s,'#fff','center',400,'#ff4d6d');ctx.restore();
 const dr=Math.min(W*.06,32);for(let i=0;i<4;i++){const x=W/2+(i-1.5)*dr*2.3,yy=y+s*.85+Math.abs(Math.sin(t*3+i*.6))*-dr*.6;disc(x,yy,dr,i%2?2:1)}
 txt('Dört taşı yan yana getir!',W/2,y+s*.85+dr*2.1,Math.min(W*.05,26),'#ffe7d1');
 const bw2=Math.min(W*.28,180),gap=Math.min(W*.03,14),bh2=Math.min(56,H*.068),x0=W/2-(bw2*3+gap*2)/2,y0=H*.52;
 for(let i=0;i<3;i++)button(MODES[i],x0+i*(bw2+gap),y0,bw2,bh2,()=>{sel=i;newMatch(i)},['#7cf29c','#ffc93c','#ff4d6d'][i],sel===i);
 button('2 KİŞİLİK',x0,y0+bh2*1.3,bw2*3+gap*2,bh2,()=>newMatch(3),'#9fb6ff',false);
 ctx.globalAlpha=.6+.4*Math.sin(t*4);txt('Başlamak için dokun / tıkla',W/2,y0+bh2*3.1,Math.min(W*.055,28),'#fff');ctx.globalAlpha=1;
 txt('EN İYİ SERİ: '+best,W/2,y0+bh2*3.9,Math.min(W*.045,22),'#ffc93c');
 txt('Sütuna dokun / tıkla · ← → seç, Boşluk bırak',W/2,H-34,Math.min(W*.035,16),'rgba(255,255,255,.7)')}
function draw(){btns.length=0;bg();if(state==='title')drawTitle();else{drawHud();drawBoard();for(const q of parts){ctx.globalAlpha=1-q.l/q.m;ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,cell*.06,0,6.2832);ctx.fill()}ctx.globalAlpha=1;if(result)drawResult();drawHome()}drawMute()}
function frame(now){requestAnimationFrame(frame);let dt=(now-last)/1000;last=now;if(hidden)return;dt=Math.min(Math.max(dt,0),.05);t+=dt;update(dt);draw()}
// ---------- Girdi ----------
const colAt=x=>Math.floor((x-bx)/cell);
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();const x=e.clientX,y=e.clientY;if(x>W-54&&y<54){toggleMute();return}if(hitBtn(x,y))return;
 if(state==='title'){newMatch(sel);return}if(x<54&&y<54){state='title';return}if(result){if(resT>1.1)nextRound();return}
 kbOn=false;const c=colAt(x);if(c>=0&&c<COLS&&y>hudY+30&&!cpuTurn()){hover=c;drop(c)}});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){const c=colAt(e.clientX);if(c>=0&&c<COLS)hover=c}});
addEventListener('keydown',e=>{const k=e.key;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Spacebar'].includes(k))e.preventDefault();audio();
