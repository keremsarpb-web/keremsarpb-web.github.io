<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kelime Tahmini · KSB Games</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#141a33;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100vw;height:100vh;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const KEY='ksb-kelime-tahmin-best';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,S,best=0,muted=false,AC,last=0,shake=0,parts=[],T=0;
try{best=+localStorage.getItem(KEY)||0}catch(e){}
const sv=()=>{try{localStorage.setItem(KEY,best)}catch(e){}};
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b));
function rs(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);S=Math.min(W,H);if(window.lay)lay()}
addEventListener('resize',rs);
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function tx(s,x,y,z,col,al,wt){ctx.font=(wt||800)+' '+z+'px system-ui,"Segoe UI",sans-serif';ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y)}
function snd(f,d,ty,v,f2){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function burst(x,y,c,n,sp){for(let i=0;i<(n||12);i++){const a=R(0,6.28),s=R(.3,1)*(sp||220);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:R(.4,.8),m:.8,c})}}
function dparts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,6.3);ctx.fill()}ctx.globalAlpha=1}
function spk(){const x=W-22,y=22;ctx.save();ctx.globalAlpha=.8;ctx.fillStyle='#fff';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-9,y-3);ctx.lineTo(x-4,y-3);ctx.lineTo(x+1,y-8);ctx.lineTo(x+1,y+8);ctx.lineTo(x-4,y+3);ctx.lineTo(x-9,y+3);ctx.fill();ctx.beginPath();if(muted){ctx.moveTo(x+5,y-5);ctx.lineTo(x+13,y+5);ctx.moveTo(x+13,y-5);ctx.lineTo(x+5,y+5)}else{ctx.arc(x+2,y,6,-1,1);ctx.moveTo(x+2+Math.cos(-1)*11,y+Math.sin(-1)*11);ctx.arc(x+2,y,11,-1,1)}ctx.stroke();ctx.restore()}
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;if(document.hidden)return;T+=dt;ctx.save();if(shake>0){ctx.translate(R(-shake,shake),R(-shake,shake));shake=Math.max(0,shake-dt*40)}frame(dt);dparts(dt);ctx.restore();spk()}
function pt(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}const[x,y]=pt(e);if(x>W-44&&y<44){muted=!muted;return}onDown(x,y)});
cv.addEventListener('pointermove',e=>{const[x,y]=pt(e);if(window.onMove)onMove(x,y)});
cv.addEventListener('pointerup',e=>{const[x,y]=pt(e);if(window.onUp)onUp(x,y)});
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.key==' ')e.preventDefault();if(e.key=='m'||e.key=='M'){muted=!muted;return}if(window.onKey)onKey(e)});
addEventListener('contextmenu',e=>e.preventDefault());
function big(name,cx,cy,col,glow){const ws=W<H?name.split(' '):[name],ml=Math.max(...ws.map(w=>w.length)),z=Math.min(W*.9/(ml*.76),H*.13,140);ctx.save();ctx.shadowColor=glow||col;ctx.shadowBlur=z*.5;ws.forEach((w,i)=>tx(w,cx,cy+(i-(ws.length-1)/2)*z*1.12,z,col));ctx.restore();return z}
function tap(y,t,col){ctx.globalAlpha=.65+.35*Math.sin(T*4);tx(t||'Başlamak için dokun / tıkla',W/2,y,Math.max(16,Math.min(S*.05,30)),col);ctx.globalAlpha=1}
function over(t,l1,l2,col,rt){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);const z=Math.min(W*.11,70);tx(t,W/2,H*.34,z,col);tx(l1,W/2,H*.34+z*1.2,z*.5);if(l2)tx(l2,W/2,H*.34+z*1.9,z*.42,'#cbd');tap(H*.34+z*3.1,rt||'Tekrar için dokun / tıkla')}
function btn(b,label,col){rr(b.x,b.y,b.w,b.h,10);ctx.fillStyle=col||'#334';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;ctx.stroke();tx(label,b.x+b.w/2,b.y+b.h/2+1,Math.min(b.h*.45,18))}
const hit=(b,x,y)=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;
/* ---- oyun ---- */
const LIST=`araba armut bahçe balık basın belge beyaz bilgi bulut çanta çatal çelik çiçek çizgi çocuk çorba deniz dolap dünya ekmek engel erkek fidan fırın genel gönül gurur hafta hasta hayat havuz hedef hızlı insan kalem kalın kapak kasap keman kitap komşu köprü kumaş kurak kutup lamba limon makas masal melek meyve mutlu nehir nokta orman ördek örnek paket panel peşin pilot radyo resim roman sabah salon sanat savaş sebze sepet sevgi simit sokak sonuç soğan sütun şehir şeker şarkı şeref taksi tarak tarih tavuk tablo temiz tepsi tuğla turşu uzman vapur vatan yarın yatak yazar yemek yılan yolcu yüzük zaman zemin zihin zorba ahşap akşam alçak anlam aslan atlas ayran bakır balta banka bebek bölge bozuk cadde cümle cevap çamur çekiç çınar dalga damla dişçi diken duvar düğün elmas emlak fener filiz gölge güneş gümüş halat hamur huzur ibrik irmik kağıt kahve kazak koyun liste maden mısır nişan pamuk pazar tahta tatil tilki tozlu yeşil zarif`.split(/\s+/).filter(w=>[...w].length==5).map(w=>w.toLocaleUpperCase('tr'));
const ROWS=['QWERTYUIOPĞÜ','ASDFGHJKLŞİ','#ZXCVBNMÖÇ<'],AL='ABCÇDEFGĞHIİJKLMNOÖPQRSŞTUÜVWXYZ';
let st='title',ans='',rows=[],res=[],cur='',ks={},score=0,rev=0,pend=false,lost=false,msg='',msgT=0,keys=[],gx=0,gy=0,cs=40;
const NB={x:8,y:10,w:92,h:34};
const fl=Array.from({length:30},()=>({x:Math.random(),y:Math.random(),v:R(.02,.06),ch:'ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ'[RI(0,29)],z:R(.5,1)}));
const TC=['#4a5163','#e0a21b','#2fbf71'];
function toast(m){msg=m;msgT=1.6}
function newGame(){if(!(st=='over'&&!lost))score=0;ans=LIST[RI(0,LIST.length)];rows=[];res=[];cur='';ks={};st='play';rev=0;pend=false;lost=false;msgT=0}
function lay(){const kw=Math.min((W-8)/13.2,58),kh=Math.min(56,H*.07),gap=kw*.1,y0=H-3*(kh+gap)-10;keys=[];ROWS.forEach((r,ri)=>{const ch=[...r],ws=ch.map(c=>c=='#'||c=='<'?1.5:1),tot=ws.reduce((a,b)=>a+b)*(kw+gap)-gap;let x=(W-tot)/2;ch.forEach((c,i)=>{const w=ws[i]*kw+(ws[i]-1)*gap;keys.push({c,x,y:y0+ri*(kh+gap),w,h:kh});x+=w+gap})});const av=y0-70-14;cs=Math.min((W-30)/5-6,av/6-6,74);gx=(W-(5*(cs+6)-6))/2;gy=70+(av-(6*(cs+6)-6))/2}
function press(c){if(st!='play'||pend)return;if(c=='<'){cur=cur.slice(0,-1);return}if(c=='#'){if(cur.length<5){toast('5 harf gerekli');snd(150,.15,'square');shake=4;return}submit();return}if(cur.length<5){cur+=c;snd(480+cur.length*40,.06,'triangle')}}
function submit(){const a=[...ans],r=[0,0,0,0,0],n={};for(let i=0;i<5;i++)if(cur[i]==a[i])r[i]=2;else n[a[i]]=(n[a[i]]||0)+1;for(let i=0;i<5;i++)if(r[i]!=2&&n[cur[i]]>0){r[i]=1;n[cur[i]]--}rows.push(cur);res.push(r);cur='';pend=true;rev=.001;snd(300,.1,'sine')}
function fin(){pend=false;rev=0;const r=res[res.length-1],g=rows[rows.length-1];[...g].forEach((c,i)=>{if((ks[c]||0)<r[i]+1)ks[c]=r[i]+1});
 if(r.every(v=>v==2)){score+=(7-rows.length)*10;if(score>best){best=score;sv()}st='over';lost=false;[523,659,784].forEach((f,i)=>setTimeout(()=>snd(f,.2,'triangle'),i*120));burst(W/2,gy+cs*2,'#2fbf71',40,320)}
 else if(rows.length>=6){st='over';lost=true;shake=8;snd(220,.5,'sawtooth',.1,70)}}
function onDown(x,y){if(st=='title'||st=='over'){newGame();return}if(hit(NB,x,y)){newGame();return}for(const k of keys)if(hit(k,x,y)){press(k.c);return}}
function onKey(e){if(st=='title'||st=='over'){if(e.key=='Enter'||e.key==' ')newGame();return}if(e.key=='Enter')press('#');else if(e.key=='Backspace')press('<');else{const c=e.key.toLocaleUpperCase('tr');if(c.length==1&&AL.includes(c))press(c)}}
function bg(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#141a33');g.addColorStop(1,'#2a1340');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.1;fl.forEach(f=>tx(f.ch,f.x*W,((f.y+T*f.v)%1.2-.1)*H,30+60*f.z,'#fff'));ctx.globalAlpha=1}
function tile(x,y,s,ch,col,sy,bd){ctx.save();ctx.translate(x+s/2,y+s/2);ctx.scale(1,sy);rr(-s/2,-s/2,s,s,s*.12);ctx.fillStyle=col;ctx.fill();if(bd){ctx.lineWidth=2.5;ctx.strokeStyle=bd;ctx.stroke()}if(ch)tx(ch,0,s*.03,s*.58,'#fff');ctx.restore()}
function frame(dt){bg();
 if(st=='title'){const z=big('KELİME TAHMİNİ',W/2,H*.34,'#ffd166','#ff9f1c'),s=Math.min(W*.14,70,H*.1),w=[...'BULUT'],cc=[2,1,0,0,1];for(let i=0;i<5;i++){const p=Math.sin(T*2.2-i*.5);tile(W/2-(5*(s+8)-8)/2+i*(s+8),H*.6-s/2,s,w[i],TC[cc[i]],Math.max(.15,Math.abs(Math.cos(T*1.5-i*.4))),'rgba(255,255,255,.2)')}tap(H*.76);tx('En iyi puan: '+best,W/2,H*.83,Math.min(S*.04,22),'#9aa6c6');return}
 if(rev>0){rev+=dt;if(rev>1.5&&pend)fin()}if(msgT>0)msgT-=dt;
 tx('KELİME TAHMİNİ',W/2,24,Math.min(20,W*.045),'#ffd166');tx('Puan '+score+'  ·  En iyi '+best,W/2,52,14,'#9aa6c6');btn(NB,'Yeni oyun','#2a3350');
 for(let r=0;r<6;r++)for(let c=0;c<5;c++){const x=gx+c*(cs+6),y=gy+r*(cs+6);let ch='',col='#232a45',bd='#3a4468',sy=1;
  if(r<rows.length){ch=rows[r][c];const p=(r==rows.length-1&&pend)?Math.max(0,Math.min(1,(rev-c*.2)/.3)):1;sy=p>0&&p<1?Math.abs(Math.cos(p*Math.PI)):1;if(p>=.5){col=TC[res[r][c]];bd=null}}
  else if(r==rows.length&&cur[c]){ch=cur[c];bd='#8b97bd'}
  tile(x,y,cs,ch,col,sy,bd)}
 if(msgT>0){ctx.globalAlpha=Math.min(1,msgT*2);rr(W/2-90,gy-34,180,28,14);ctx.fillStyle='#fff';ctx.fill();tx(msg,W/2,gy-20,15,'#222');ctx.globalAlpha=1}
 for(const k of keys){const v=ks[k.c]||0;rr(k.x,k.y,k.w,k.h,6);ctx.fillStyle=['#3b4259','#1d2133','#c9921a','#2fbf71'][v];ctx.fill();tx(k.c=='#'?'ENTER':k.c=='<'?'SİL':k.c,k.x+k.w/2,k.y+k.h/2+1,k.c.length==1&&k.c!='#'&&k.c!='<'?k.h*.42:k.h*.26,v==1?'#6a7390':'#fff')}
 if(st=='over')over(lost?'Olmadı!':'Tebrikler!',lost?'Kelime: '+ans:rows.length+' denemede buldun','Puan: '+score+'  ·  En iyi: '+best,lost?'#ff6b6b':'#6ee7a0','Yeni oyun için dokun / tıkla')}
rs();requestAnimationFrame(loop);
</script></body></html>
