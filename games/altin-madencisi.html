<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Altın Madencisi – KSB Games</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head>
<body><canvas id="c"></canvas><script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),ID='altin-madencisi';let W=1,H=1,S=1,best=0,AC,muted=false,state='title',score=0,shake=0,tm=0,parts=[],ot=0;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);S=Math.min(W,H)}
addEventListener('resize',rs);rs();
try{best=+localStorage.getItem('ksb-'+ID+'-best')||0}catch(e){}
function sv(){if(score>best){best=score;try{localStorage.setItem('ksb-'+ID+'-best',best)}catch(e){}}}
function snd(f,d,t,v,sl){if(muted||!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);a.gain.setValueAtTime(v||.06,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function T(s,x,y,z,c,a,w){g.font=(w||700)+' '+z+'px Fredoka,Nunito,system-ui,sans-serif';g.textAlign=a||'center';g.textBaseline='middle';g.fillStyle=c||'#fff';g.fillText(s,x,y)}
function RR(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function P(x,y,n,c,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(sp||150)*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.7,c})}}
function upP(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt}parts=parts.filter(p=>p.l>0)}
function drP(){for(const p of parts){g.globalAlpha=Math.max(0,p.l/.7);g.fillStyle=p.c;g.fillRect(p.x-2,p.y-2,4,4)}g.globalAlpha=1}
function titleScr(name,sub,y0){const z=Math.min(S*.15,W*.92/(name.length*.62));y0=y0||H*.3;g.save();g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=z*.2;g.shadowOffsetY=z*.06;T(name,W/2,y0+Math.sin(tm*2)*z*.05,z,'#fff',0,800);g.restore();if(sub)T(sub,W/2,y0+z*.85,Math.max(13,z*.3),'rgba(255,255,255,.9)',0,500);g.globalAlpha=.65+.35*Math.sin(tm*4);T('Başlamak için dokun / tıkla',W/2,H*.78,Math.max(15,Math.min(S*.05,30)),'#fff',0,700);g.globalAlpha=1;if(best)T('En iyi: '+best,W/2,H*.78+Math.max(28,S*.08),Math.max(13,S*.035),'#ffe',0,500)}
function overScr(t,l2){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,H);const z=Math.min(S*.11,W*.9/(t.length*.62));T(t,W/2,H*.32,z,'#fff',0,800);T('Skor: '+score,W/2,H*.32+z*1.1,z*.55,'#ffd54a');T('En iyi: '+best,W/2,H*.32+z*1.8,z*.4,'#fff',0,500);if(l2)T(l2,W/2,H*.32+z*2.4,z*.35,'#cde',0,500);if(ot>.5){g.globalAlpha=.6+.4*Math.sin(tm*4);T('Tekrar için dokun / tıkla',W/2,H*.75,Math.max(15,Math.min(S*.05,30)));g.globalAlpha=1}}
const IN={down(){},up(){},mv(){},kd(){},ku(){}};
function initA(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
cv.addEventListener('pointerdown',e=>{e.preventDefault();initA();if(e.clientX>W-50&&e.clientY<50){muted=!muted;return}IN.down(e.clientX,e.clientY,e.pointerId)});
addEventListener('pointerup',e=>IN.up(e.clientX,e.clientY,e.pointerId));
addEventListener('pointercancel',e=>IN.up(e.clientX,e.clientY,e.pointerId));
addEventListener('pointermove',e=>IN.mv(e.clientX,e.clientY,e.pointerId));
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();initA();if(e.repeat)return;if(e.key==='m'||e.key==='M'){muted=!muted;return}IN.kd(e.key)});
addEventListener('keyup',e=>IN.ku(e.key));
function spk(){const x=W-26,y=26;g.save();g.globalAlpha=.8;g.fillStyle='#fff';g.fillRect(x-9,y-4,5,8);g.beginPath();g.moveTo(x-4,y-4);g.lineTo(x+2,y-9);g.lineTo(x+2,y+9);g.lineTo(x-4,y+4);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();if(muted){g.moveTo(x+5,y-5);g.lineTo(x+13,y+5);g.moveTo(x+13,y-5);g.lineTo(x+5,y+5)}else g.arc(x+2,y,7,-1,1);g.stroke();g.restore()}
let last=performance.now();
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;if(document.hidden)dt=0;tm+=dt;if(state==='over')ot+=dt;shake=Math.max(0,shake-dt*40);if(dt>0)step(dt);g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);render();g.restore();spk();requestAnimationFrame(loop)}
/* ---- game ---- */
const TY={g1:{r:.026,v:50,w:.9,c:'#ffd23f'},g2:{r:.04,v:120,w:1.6,c:'#ffc400'},g3:{r:.062,v:300,w:2.8,c:'#ffb300'},st:{r:.045,v:15,w:3.4,c:'#8a8f98'},dm:{r:.02,v:400,w:.6,c:'#6ee7ff'}};
let lv=0,items=[],tl=60,lm=0,tgt=0,ph=0,ang=0,len=0,mode='swing',held=null,ft=[],inter=0,gy=80,px=0,hx=0,hy=0,uh=1;
function geo(){gy=Math.max(70,H*.13);px=W/2;uh=H-gy}
function newLevel(){geo();items=[];lm=0;tgt=Math.min(1500,400+lv*300);tl=Math.max(35,60-lv*3);mode='swing';len=0;held=null;
 const mix=['g3','g3','g3','g2','g2','g2','g2','g1','g1','g1','g1','dm','dm','st','st','st','st'];for(let i=0;i<Math.min(lv,4);i++)mix.push('st');
 for(const k of mix){const d=TY[k];for(let t=0;t<60;t++){const x=.08+Math.random()*.84,y=.1+Math.random()*.85;let ok=true;for(const o of items){const e=TY[o.k];if(Math.hypot((x-o.x)*W,(y-o.y)*uh)<(d.r+e.r)*S*1.15+6){ok=false;break}}if(ok){items.push({k,x,y,rot:Math.random()*6});break}}}}
function go(){if(state==='title'||(state==='over'&&ot>.5)){lv=0;score=0;newLevel();state='play'}}
function launch(){if(state!=='play'){go();return}if(mode==='swing'){mode='out';snd(300,.2,'sawtooth',.04,200)}}
IN.down=launch;IN.kd=k=>{if(k===' '||k==='ArrowDown'||k==='Enter')launch()};
function finish(){if(lm>=tgt){state='inter';inter=0;snd(600,.5,'triangle',.08,600)}else{sv();state='over';ot=0}}
function step(dt){geo();upP(dt);for(const f of ft){f.y-=40*dt;f.l-=dt}ft=ft.filter(f=>f.l>0);
 if(state==='inter'){inter+=dt;if(inter>2){lv++;newLevel();state='play'}return}
 if(state==='over')return;
 if(state==='play'){tl=Math.max(0,tl-dt)}
 if(mode==='swing'){ph+=dt*(1.5+lv*.08);ang=Math.sin(ph)*1.15;if(state==='play'&&(tl<=0||items.length==0))finish()}
 hx=px+Math.sin(ang)*len;hy=gy+Math.cos(ang)*len;
 if(mode==='out'){len+=S*.7*dt;hx=px+Math.sin(ang)*len;hy=gy+Math.cos(ang)*len;
  for(const it of items){const d=TY[it.k];if(Math.hypot(it.x*W-hx,gy+it.y*uh-hy)<d.r*S+6){held=it;mode='in';snd(200,.12,'square',.08,-100);shake=3;break}}
  if(mode==='out'&&(hx<5||hx>W-5||hy>H-5))mode='in'}
 else if(mode==='in'){const sp=S*(held?.75/TY[held.k].w:1);len-=sp*dt;if(len<=0){len=0;mode='swing';if(held){const d=TY[held.k];score+=d.v;lm+=d.v;sv();ft.push({x:px,y:gy+30,s:'+'+d.v,l:1.2});P(px,gy+10,12,d.c,160);snd(d.v>100?900:500,.2,'sine',.08,d.v>100?700:200);items=items.filter(i=>i!==held);held=null}}}}
function drItem(it,x,y){const d=TY[it.k],r=d.r*S;g.save();g.translate(x,y);g.rotate(it.rot);
 if(it.k=='dm'){g.fillStyle=d.c;g.beginPath();g.moveTo(0,-r*1.4);g.lineTo(r*1.2,0);g.lineTo(0,r*1.4);g.lineTo(-r*1.2,0);g.fill();g.fillStyle='rgba(255,255,255,.7)';g.beginPath();g.moveTo(0,-r*1.4);g.lineTo(r*.5,-r*.2);g.lineTo(-r*.6,-r*.1);g.fill()}
 else{g.fillStyle=d.c;g.beginPath();for(let i=0;i<9;i++){const a=i/9*6.283,k=1+.12*Math.sin(i*2.7+it.rot*5);g.lineTo(Math.cos(a)*r*k,Math.sin(a)*r*k)}g.fill();g.strokeStyle='rgba(0,0,0,.3)';g.lineWidth=2;g.stroke();g.fillStyle=it.k=='st'?'rgba(255,255,255,.25)':'rgba(255,255,255,.55)';g.beginPath();g.arc(-r*.3,-r*.3,r*.28,0,7);g.fill()}g.restore()}
function render(){geo();const sc=S/500;
 let gr=g.createLinearGradient(0,0,0,gy);gr.addColorStop(0,'#2c1e5c');gr.addColorStop(1,'#ff9d5c');g.fillStyle=gr;g.fillRect(0,0,W,gy);
 gr=g.createLinearGradient(0,gy,0,H);gr.addColorStop(0,'#7a4a24');gr.addColorStop(1,'#3a210e');g.fillStyle=gr;g.fillRect(0,gy,W,uh);
 g.fillStyle='rgba(0,0,0,.18)';for(let i=0;i<70;i++){const x=(Math.sin(i*12.9)*43758.5%1+1)%1*W,y=gy+(Math.sin(i*78.2)*12345.6%1+1)%1*uh;g.beginPath();g.arc(x,y,2+i%4*1.5,0,7);g.fill()}
 g.fillStyle='#2d9b4f';g.fillRect(0,gy-4,W,8);
 g.fillStyle='#8b5a2b';g.fillRect(px-26*sc-14,gy-28*sc,28*sc+28,28*sc);g.fillStyle='#4a90d9';RR(px-70*sc-14,gy-40*sc,24*sc+10,30*sc,4);g.fill();g.fillStyle='#ffd9b0';g.beginPath();g.arc(px-58*sc-2,gy-50*sc,9*sc+3,0,7);g.fill();g.fillStyle='#f4c430';g.fillRect(px-70*sc-8,gy-64*sc,22*sc+6,8*sc+2);
 for(const it of items)if(it!==held)drItem(it,it.x*W,gy+it.y*uh);
 const sx=px,sy=gy-2;g.strokeStyle='#ddd';g.lineWidth=3;g.beginPath();g.moveTo(sx,sy);g.lineTo(hx,hy);g.stroke();
 g.save();g.translate(hx,hy);g.rotate(-ang);g.strokeStyle='#bbb';g.lineWidth=4;g.lineCap='round';const o=mode==='out'?10:6;g.beginPath();g.moveTo(-3,0);g.quadraticCurveTo(-o-8,4,-o-2,16);g.moveTo(3,0);g.quadraticCurveTo(o+8,4,o+2,16);g.stroke();g.fillStyle='#888';g.beginPath();g.arc(0,0,5,0,7);g.fill();g.restore();
 if(held)drItem(held,hx+Math.sin(ang)*TY[held.k].r*S*.9,hy+Math.cos(ang)*TY[held.k].r*S*.9);
 drP();for(const f of ft){g.globalAlpha=Math.min(1,f.l);T(f.s,f.x,f.y,S*.07,'#ffe066');g.globalAlpha=1}
 const z=Math.max(14,Math.min(S*.045,24));
 if(state!=='title'){T('Para: ₺'+lm,10,z,z,'#fff','left');T('Hedef: ₺'+tgt,10,z*2.3,z*.85,lm>=tgt?'#7dff9b':'#ffd54a','left',500);T('Seviye '+(lv+1),10,z*3.4,z*.7,'#ddd','left',500);T(Math.ceil(tl)+' sn',W-62,z,z*1.2,tl<10?'#ff6b6b':'#fff','right')}
 if(state==='title'){g.fillStyle='rgba(0,0,0,.4)';g.fillRect(0,H*.16,W,H*.3);titleScr('Altın Madencisi','Kancayı doğru anda fırlat!',H*.27)}
 if(state==='inter'){g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,0,W,H);T('Hedef tamam!',W/2,H*.4,S*.1,'#7dff9b',0,800);T('Sıradaki: Seviye '+(lv+2),W/2,H*.5,S*.05,'#fff')}
 if(state==='over')overScr('Süre Doldu','Hedefe ulaşamadın: ₺'+lm+' / ₺'+tgt)}
newLevel();requestAnimationFrame(loop);
</script></body></html>
