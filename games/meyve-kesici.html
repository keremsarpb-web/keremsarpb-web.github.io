<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Meyve Kesici — KSB Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2a160c;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;left:0;top:0;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const ID='meyve-kesici',FONT='"Lilita One","Arial Black",system-ui,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,U=1,G=1000,wood=null;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){}return null;}
let best=+ls('ksb-'+ID+'-best')||0,muted=ls('ksb-'+ID+'-mute')==='1';
const rnd=(a,b)=>a+Math.random()*(b-a);
// ---------- audio ----------
let AC=null,NB=null;
function initAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,d,type,vol,f2,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05);}
function noise(d,vol,f,type,f2){if(!AC||muted)return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}const t=AC.currentTime,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;fl.type=type||'lowpass';fl.frequency.setValueAtTime(f||1000,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d+.05);}
let lastSwish=0;
const sfx={
  swish(){const n=performance.now();if(n-lastSwish<180)return;lastSwish=n;noise(.16,.18,2500,'bandpass',6000);},
  slice(){noise(.12,.35,3000,'highpass');noise(.2,.4,700,'lowpass',200);tone(330,.1,'triangle',.06,160);},
  throw(){noise(.25,.08,300,'bandpass',900);},
  bomb(){noise(.9,.9,600,'lowpass',80);tone(110,.7,'sawtooth',.2,30);},
  miss(){tone(220,.25,'square',.06,110);},
  combo(n){for(let i=0;i<Math.min(n,6);i++)tone(523*Math.pow(1.26,i),.15,'triangle',.08,null,i*.05);}
};
function toggleMute(){muted=!muted;ls('ksb-'+ID+'-mute',muted?'1':'0');}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  U=Math.min(W/420,H/700);G=H*1.15;
  wood=document.createElement('canvas');wood.width=Math.round(W*DPR);wood.height=Math.round(H*DPR);const o=wood.getContext('2d');o.scale(DPR,DPR);
  const pw=Math.max(70,110*U),cols=['#5a3219','#62381d','#552f17','#6a3e20'];
  for(let x=0,i=0;x<W;x+=pw,i++){o.fillStyle=cols[i%4];o.fillRect(x,0,pw,H);o.strokeStyle='rgba(0,0,0,.18)';o.lineWidth=1.2;
    for(let k=0;k<9;k++){o.beginPath();const gx=x+rnd(6,pw-6);o.moveTo(gx,0);for(let y=0;y<=H;y+=40)o.lineTo(gx+Math.sin(y*.01+k)*5,y);o.stroke();}
    o.fillStyle='rgba(0,0,0,.45)';o.fillRect(x,0,3,H);o.fillStyle='rgba(255,220,170,.06)';o.fillRect(x+3,0,2,H);
    if(Math.random()<.6){o.fillStyle='rgba(30,12,4,.4)';o.beginPath();o.ellipse(x+pw/2,rnd(0,H),8,14,0,0,7);o.fill();}}
  const v=o.createRadialGradient(W/2,H*.45,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(10,3,0,.75)');o.fillStyle=v;o.fillRect(0,0,W,H);
}
addEventListener('resize',resize);resize();
// ---------- data ----------
const FR=[
  {n:'karpuz',o:'#2f9a3f',d:'#1b5e25',i:'#ff3b55',j:'#ff2d4a',r:48,seeds:'#2a1a12'},
  {n:'portakal',o:'#ff9a1f',d:'#e06a00',i:'#ffc35a',j:'#ffa31a',r:36},
  {n:'elma',o:'#e8283c',d:'#9c0e1e',i:'#fff0c4',j:'#fff3d0',r:37,stem:1},
  {n:'limon',o:'#ffe23d',d:'#d6b400',i:'#fff7a8',j:'#fff36b',r:33},
  {n:'kivi',o:'#8a5a2b',d:'#5c3a18',i:'#7bc043',j:'#9be35a',r:33,seeds:'#1a1a10'},
  {n:'erik',o:'#8a3fb5',d:'#4e1d6e',i:'#f2c66b',j:'#c25cff',r:30}
];
let state='title',paused=false,t=0,el=0,score=0,lives=3,shake=0,flash=0,overT=0,newBest=false,waveT=0;
let fr=[],halves=[],parts=[],splats=[],floats=[],trail=[],down=false,lastP=null,swipeHits=[],swipeT=0,xs=[];
function reset(){el=0;score=0;lives=3;fr=[];halves=[];parts=[];splats=[];floats=[];xs=[];waveT=.8;newBest=false;swipeHits=[];}
function throwOne(bomb){
  const f=bomb?null:FR[(Math.random()*FR.length)|0],r=(bomb?34:f.r)*U,x=rnd(.12,.88)*W,h=rnd(.45,.8)*H,vy=-Math.sqrt(2*G*h),T=2*h/(-vy)*2;
  fr.push({f,bomb,r,x,y:H+r,vx:(rnd(.25,.75)*W-x)/T,vy,rot:Math.random()*6,vr:rnd(-3,3),cut:false});
}
function wave(){
  const lvl=Math.min(1,el/70),n=1+((Math.random()*(1.5+lvl*3.5))|0);let bombs=0;
  for(let i=0;i<n;i++){const b=state==='play'&&Math.random()<.08+lvl*.17&&bombs<1+lvl*2&&(n>1||el>5);if(b)bombs++;setTimeout(()=>{if(state!=='over'||!b)throwOne(b);},i*rnd(60,260));}
  if(state==='play'&&n===1&&lvl>.3&&Math.random()<.3)setTimeout(()=>throwOne(true),300);
  sfx.throw();waveT=Math.max(.9,2.4-lvl*1.3)*(state==='play'?1:1.3);
}
function burst(x,y,n,col,sp,life,g,sz){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=rnd(.2,1)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-sp*.2,l:life*rnd(.5,1),m:life,c:col,s:rnd(2,sz||6)*U,g});}}
function slice(o,ang){
  o.cut=true;
  if(o.bomb){sfx.bomb();shake=28;flash=1;burst(o.x,o.y,60,'#ffb000',700*U,1,300*U,8);burst(o.x,o.y,30,'#ffffff',500*U,.7,0,5);loseLife(o.x,o.y);return;}
  sfx.slice();shake=Math.max(shake,5);score++;swipeHits.push(o);
  const nx=Math.cos(ang+Math.PI/2),ny=Math.sin(ang+Math.PI/2),push=90*U;
  for(const s of [1,-1])halves.push({f:o.f,r:o.r,x:o.x+nx*s*3,y:o.y+ny*s*3,vx:o.vx+nx*s*push,vy:o.vy*.4+ny*s*push-60*U,a:ang+(s>0?0:Math.PI),va:s*rnd(1.5,4),l:3});
  burst(o.x,o.y,22,o.f.j,380*U,.8,900*U,7);
  splats.push({x:o.x,y:o.y,r:o.r*rnd(1.3,1.9),c:o.f.j,l:4,a:Math.random()*6,dots:Array.from({length:7},()=>[rnd(-1.6,1.6),rnd(-1.6,1.6),rnd(.15,.4)])});
  if(splats.length>25)splats.shift();
  floats.push({x:o.x,y:o.y,s:'+1',c:'#fff',l:.8,z:1});
}
function loseLife(x,y){
  if(state!=='play')return;
  lives--;xs.push({x:Math.min(Math.max(x,30),W-30),y:Math.min(y,H-30*U),l:1.2});
  if(lives<=0){state='over';overT=0;down=false;if(score>best){best=score;newBest=true;ls('ksb-'+ID+'-best',best);}}
}
function segHit(ax,ay,bx,by,cx,cy,r){const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;let k=L?((cx-ax)*dx+(cy-ay)*dy)/L:0;k=Math.max(0,Math.min(1,k));const px=ax+dx*k-cx,py=ay+dy*k-cy;return px*px+py*py<r*r;}
function start(){reset();state='play';}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();const x=e.clientX,y=e.clientY;
  if(x>W-56&&y<56){toggleMute();return;}
  if(state==='title'){start();}
  else if(state==='over'){if(overT>.9)start();return;}
  else if(paused){paused=false;return;}
  down=true;lastP={x,y};trail=[{x,y,t}];swipeHits=[];swipeT=0;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(!down||state!=='play'||paused)return;const x=e.clientX,y=e.clientY,dx=x-lastP.x,dy=y-lastP.y;
  if(dx*dx+dy*dy<9)return;
  trail.push({x,y,t});if(trail.length>40)trail.shift();
  if(dx*dx+dy*dy>400)sfx.swish();
  const ang=Math.atan2(dy,dx);
  for(const o of fr)if(!o.cut&&segHit(lastP.x,lastP.y,x,y,o.x,o.y,o.r))slice(o,ang);
  lastP={x,y};
});
function up(){down=false;endSwipe();}
addEventListener('pointerup',up);addEventListener('pointercancel',up);
function endSwipe(){const n=swipeHits.length;if(n>=3&&state==='play'){score+=n;sfx.combo(n);const o=swipeHits[n-1];floats.push({x:Math.min(Math.max(o.x,90*U),W-90*U),y:o.y-40*U,s:n+' Meyve Kombo! +'+n,c:'#ffd23d',l:1.4,z:1.3});}swipeHits=[];}
addEventListener('keydown',e=>{
  const k=e.code;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))e.preventDefault();
  if(k==='KeyM'){initAudio();toggleMute();return;}
  if(e.repeat)return;
  if(k==='Space'||k==='Enter'){initAudio();if(state==='title'||(state==='over'&&overT>.9))start();else if(paused)paused=false;}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='play')paused=true;down=false;if(AC)AC.suspend();}else if(AC&&AC.state==='suspended')AC.resume();});
// ---------- update ----------
function update(dt){
  t+=dt;shake=Math.max(0,shake-dt*45);flash=Math.max(0,flash-dt*2);
  trail=trail.filter(p=>t-p.t<.13);
  if(paused)return;
  if(state==='play'){el+=dt;if(down){swipeT+=dt;if(swipeT>.35){endSwipe();swipeT=0;}}}
  if(state==='over')overT+=dt;
  waveT-=dt;if(waveT<=0&&state!=='over')wave();
  for(const o of fr){o.x+=o.vx*dt;o.y+=o.vy*dt;o.vy+=G*dt;o.rot+=o.vr*dt;
    if(o.bomb&&!o.cut&&Math.random()<.6)parts.push({x:o.x+Math.cos(o.rot-1.2)*o.r*1.1,y:o.y+Math.sin(o.rot-1.2)*o.r*1.1,vx:rnd(-60,60)*U,vy:rnd(-90,0)*U,l:.3,m:.3,c:Math.random()<.5?'#ffd000':'#ff5a00',s:3*U,g:0});}
  for(let i=fr.length-1;i>=0;i--){const o=fr[i];if(o.cut){fr.splice(i,1);continue;}
    if(o.vy>0&&o.y>H+o.r+10){fr.splice(i,1);if(!o.bomb&&state==='play'){sfx.miss();loseLife(o.x,H);}}}
  for(const h of halves){h.x+=h.vx*dt;h.y+=h.vy*dt;h.vy+=G*dt;h.a+=h.va*dt;h.l-=dt;}
  halves=halves.filter(h=>h.y<H+h.r*2&&h.l>0);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.l-=dt;}parts=parts.filter(p=>p.l>0);
  for(const s of splats)s.l-=dt*.5;splats=splats.filter(s=>s.l>0);
  for(const f of floats){f.y-=45*U*dt;f.l-=dt;}floats=floats.filter(f=>f.l>0);
  for(const x of xs)x.l-=dt;xs=xs.filter(x=>x.l>0);
}
// ---------- draw ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawFruit(o){
  const r=o.r;ctx.save();ctx.translate(o.x,o.y);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(r*.15,r*.2,r,r,0,0,7);ctx.fill();
  ctx.rotate(o.rot);
  if(o.bomb){
    const g=ctx.createRadialGradient(-r*.35,-r*.35,r*.1,0,0,r);g.addColorStop(0,'#5a5a66');g.addColorStop(1,'#0c0c12');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
    ctx.strokeStyle='#ff3030';ctx.lineWidth=3*U;ctx.beginPath();ctx.arc(0,0,r*.72,0,7);ctx.stroke();
    ctx.fillStyle='#ff3030';ctx.font=`${r*.9}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✖',0,r*.04);
    ctx.fillStyle='#333';ctx.save();ctx.rotate(-1.2);ctx.fillRect(r*.85,-r*.15,r*.3,r*.3);ctx.restore();
    ctx.restore();return;
  }
  const f=o.f,g=ctx.createRadialGradient(-r*.35,-r*.4,r*.1,0,0,r*1.05);g.addColorStop(0,lighten(f.o));g.addColorStop(.6,f.o);g.addColorStop(1,f.d);
  ctx.fillStyle=g;ctx.beginPath();if(f.n==='limon')ctx.ellipse(0,0,r*1.15,r*.9,0,0,7);else ctx.arc(0,0,r,0,7);ctx.fill();
  if(f.n==='karpuz'){ctx.save();ctx.clip();ctx.strokeStyle=f.d;ctx.lineWidth=r*.16;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*r*.42,-r);ctx.quadraticCurveTo(i*r*.55,0,i*r*.42,r);ctx.stroke();}ctx.restore();}
  if(f.n==='kivi'){ctx.fillStyle='rgba(60,35,10,.35)';for(let i=0;i<14;i++){ctx.fillRect(Math.cos(i*2.3)*r*.7,Math.sin(i*1.7)*r*.7,2*U,2*U);}}
  if(f.stem){ctx.strokeStyle='#5a3a12';ctx.lineWidth=3*U;ctx.beginPath();ctx.moveTo(0,-r*.85);ctx.lineTo(r*.1,-r*1.2);ctx.stroke();ctx.fillStyle='#4caf50';ctx.beginPath();ctx.ellipse(r*.3,-r*1.08,r*.24,r*.11,-.4,0,7);ctx.fill();}
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.ellipse(-r*.4,-r*.42,r*.2,r*.12,-.7,0,7);ctx.fill();
  ctx.restore();
}
function lighten(hex){const n=parseInt(hex.slice(1),16),f=v=>Math.round(v+(255-v)*.45);return`rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`;}
function drawHalf(h){
  const r=h.r,f=h.f;ctx.save();ctx.translate(h.x,h.y);ctx.rotate(h.a);ctx.globalAlpha=Math.min(1,h.l);
  ctx.fillStyle=f.d;ctx.beginPath();ctx.arc(0,0,r,Math.PI,0);ctx.closePath();ctx.fill();
  ctx.fillStyle=f.o;ctx.beginPath();ctx.arc(0,0,r*.92,Math.PI,0);ctx.closePath();ctx.fill();
  ctx.fillStyle=f.i;ctx.beginPath();ctx.arc(0,0,r*.8,Math.PI,0);ctx.closePath();ctx.fill();
  if(f.seeds){ctx.fillStyle=f.seeds;for(let i=0;i<7;i++){const a=Math.PI+(.5+i)*Math.PI/7;ctx.beginPath();ctx.ellipse(Math.cos(a)*r*.5,Math.sin(a)*r*.5,2.4*U,1.4*U,a,0,7);ctx.fill();}}
  else{ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5*U;ctx.beginPath();for(let i=1;i<6;i++){const a=Math.PI+i*Math.PI/6;ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*r*.75,Math.sin(a)*r*.75);}ctx.stroke();}
  ctx.restore();
}
function drawBlade(){
  if(trail.length<2)return;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  for(let pass=0;pass<2;pass++){for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i],k=i/trail.length;
    ctx.strokeStyle=pass?`rgba(255,255,255,${k})`:`rgba(120,220,255,${k*.5})`;ctx.lineWidth=(pass?7:18)*U*k+1;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}}
  ctx.restore();
}
function text(s,x,y,size,col,align,stroke){ctx.font=`${size}px ${FONT}`;ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.lineJoin='round';
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=size*.2;ctx.strokeText(s,x,y);}ctx.fillStyle=col;ctx.fillText(s,x,y);}
function fit(s,size,maxW){ctx.font=`${size}px ${FONT}`;const w=ctx.measureText(s).width;return w>maxW?size*maxW/w:size;}
function drawX(x,y,s,col){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=s*.28;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-s/2,y-s/2);ctx.lineTo(x+s/2,y+s/2);ctx.moveTo(x+s/2,y-s/2);ctx.lineTo(x-s/2,y+s/2);ctx.stroke();ctx.restore();}
function drawMute(){const s=34,x=W-s-10,y=10;ctx.save();ctx.fillStyle='rgba(0,0,0,.35)';rr(x,y,s,s,9);ctx.fill();ctx.fillStyle='#fff';ctx.strokeStyle='#fff';ctx.lineWidth=2.2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x+8,y+13);ctx.lineTo(x+13,y+13);ctx.lineTo(x+19,y+8);ctx.lineTo(x+19,y+26);ctx.lineTo(x+13,y+21);ctx.lineTo(x+8,y+21);ctx.closePath();ctx.fill();
  ctx.beginPath();if(muted){ctx.moveTo(x+22,y+13);ctx.lineTo(x+29,y+21);ctx.moveTo(x+29,y+13);ctx.lineTo(x+22,y+21);}else{ctx.arc(x+20,y+17,5,-.9,.9);ctx.moveTo(x+25.5,y+10);ctx.arc(x+20,y+17,9,-.9,.9);}ctx.stroke();ctx.restore();}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.save();
  if(shake>0)ctx.translate(rnd(-shake,shake)*.6,rnd(-shake,shake)*.6);
  ctx.drawImage(wood,-20,-20,W+40,H+40);
  for(const s of splats){ctx.globalAlpha=Math.min(.55,s.l*.3);ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.x,s.y,s.r*.7,0,7);ctx.fill();for(const d of s.dots){ctx.beginPath();ctx.arc(s.x+d[0]*s.r,s.y+d[1]*s.r,s.r*d[2],0,7);ctx.fill();}}
  ctx.globalAlpha=1;
  for(const h of halves)drawHalf(h);
  for(const o of fr)drawFruit(o);
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s*(.5+.5*p.l/p.m),0,7);ctx.fill();}
  ctx.globalAlpha=1;
  for(const x of xs){ctx.globalAlpha=Math.min(1,x.l*2);drawX(x.x,x.y-(1.2-x.l)*30*U,34*U,'#ff3030');}ctx.globalAlpha=1;
  drawBlade();
  for(const f of floats){ctx.globalAlpha=Math.min(1,f.l*2);text(f.s,f.x,f.y,24*U*f.z,f.c,'center','#3a1405');}ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle=`rgba(255,250,235,${Math.min(1,flash)*.85})`;ctx.fillRect(0,0,W,H);}
  const m=Math.min(W,H),cx=W/2,pulse=.55+.45*Math.sin(t*4);
  if(state==='title'){
    ctx.fillStyle='rgba(20,6,0,.35)';ctx.fillRect(0,0,W,H);
    const s=fit('KESİCİ',Math.min(W*.24,H*.15),W*.84),ty=H*.32;
    ctx.save();ctx.translate(cx,ty);ctx.rotate(-.05);
    text('MEYVE',0,-s*.55,s,'#ffd23d','center','#4a1a05');text('KESİCİ',0,s*.55,s,'#ff4a3d','center','#4a1a05');
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=4;ctx.lineCap='round';const sw=((t*.8)%2);if(sw<1){ctx.beginPath();ctx.moveTo(-s*2.2+sw*s*3,-s*1.2);ctx.lineTo(-s*1.6+sw*s*3.6,s*1.2);ctx.stroke();}
    ctx.restore();
    ctx.globalAlpha=pulse;text('Başlamak için dokun / tıkla',cx,ty+s*1.6,Math.max(16,m*.045),'#ffffff','center','#3a1405');ctx.globalAlpha=1;
    const h='Parmağını / fareyi sürükleyerek kes · Bombalara dokunma!';text(h,cx,ty+s*1.6+Math.max(30,m*.075),fit(h,Math.max(12,m*.032),W*.92),'#ffe2b8','center','#3a1405');
    if(best>0)text('En iyi: '+best,cx,H*.92,Math.max(16,m*.045),'#ffd23d','center','#3a1405');
  }else{
    text(String(score),18,34,Math.max(30,m*.08),'#ffd23d','left','#3a1405');
    for(let i=0;i<3;i++){const x=W-60-i*34,y=72;drawX(x,y,22,i<3-lives?'#ff3030':'rgba(255,255,255,.25)');}
    if(best>0)text('En iyi: '+best,18,34+Math.max(34,m*.07),Math.max(13,m*.032),'#ffe2b8','left','#3a1405');
    if(state==='play'&&paused){ctx.fillStyle='rgba(20,6,0,.6)';ctx.fillRect(0,0,W,H);text('Duraklatıldı',cx,H*.42,Math.max(30,m*.09),'#fff','center','#3a1405');ctx.globalAlpha=pulse;text('Devam etmek için dokun',cx,H*.52,Math.max(16,m*.045),'#ffd23d','center','#3a1405');ctx.globalAlpha=1;}
    if(state==='over'){
      ctx.fillStyle=`rgba(20,6,0,${Math.min(.65,overT*1.5)})`;ctx.fillRect(0,0,W,H);
      text('OYUN BİTTİ',cx,H*.29,fit('OYUN BİTTİ',Math.min(W*.15,H*.1),W*.86),'#ff4a3d','center','#3a1405');
      text(String(score),cx,H*.42,Math.max(48,m*.16),'#ffd23d','center','#3a1405');
      text(newBest?'Yeni rekor!':'En iyi: '+best,cx,H*.52,Math.max(18,m*.05),newBest?'#ffd23d':'#ffe2b8','center','#3a1405');
      if(overT>.9){ctx.globalAlpha=pulse;text('Tekrar için dokun / tıkla',cx,H*.64,Math.max(16,m*.045),'#ffffff','center','#3a1405');ctx.globalAlpha=1;}
    }
  }
  drawMute();
}
let last=performance.now();
function frame(now){let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;if(dt>.05)dt=.05;update(dt);render();requestAnimationFrame(frame);}
for(let i=0;i<3;i++){throwOne(false);const o=fr[fr.length-1];o.y=H*rnd(.35,.7);o.vy*=rnd(.1,.4);}
requestAnimationFrame(frame);
</script>
