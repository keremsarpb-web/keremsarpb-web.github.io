<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Havai Fişek</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#060816;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head>
<body><canvas id="c"></canvas><script>
const cv=document.getElementById('c'),g=cv.getContext('2d');let W=0,H=0,DPR=1;
function rs(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);g.setTransform(DPR,0,0,DPR,0,0);if(typeof onResize=='function')onResize()}
addEventListener('resize',rs);
function ld(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const FF='"Trebuchet MS","Segoe UI",system-ui,sans-serif';
let AC=null,muted=ld('ksb-muted',false),started=false,hid=false,mx=0,my=0;
function au(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
function tone(f,d=.12,t='sine',v=.12,sl=0){if(!AC||muted)return;try{const n=AC.currentTime,o=AC.createOscillator(),q=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);q.gain.setValueAtTime(v,n);q.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(q);q.connect(AC.destination);o.start(n);o.stop(n+d+.02)}catch(e){}}
function noise(d=.1,v=.1,fq=1800){if(!AC||muted)return;try{const n=AC.currentTime,len=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,len,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource(),q=AC.createGain(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fq;s.buffer=b;q.gain.value=v;s.connect(f);f.connect(q);q.connect(AC.destination);s.start(n)}catch(e){}}
function txt(s,x,y,sz,col,al,w){g.font=(w||'bold')+' '+sz+'px '+FF;g.textAlign=al||'center';g.textBaseline='middle';g.fillStyle=col||'#fff';g.fillText(s,x,y)}
function rr(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function drawMute(){const x=W-26,y=26;g.save();g.globalAlpha=.85;g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.arc(x,y,17,0,7);g.fill();g.fillStyle='#fff';g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(x-7,y-3);g.lineTo(x-3,y-3);g.lineTo(x+2,y-8);g.lineTo(x+2,y+8);g.lineTo(x-3,y+3);g.lineTo(x-7,y+3);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(x+5,y-4);g.lineTo(x+11,y+4);g.moveTo(x+11,y-4);g.lineTo(x+5,y+4)}else g.arc(x+2,y,6,-1,1);g.stroke();g.restore()}
function drawTitle(a,b,c){const t=performance.now()/1000,ls=a.split(' ');g.fillStyle='rgba(0,0,0,.38)';g.fillRect(0,0,W,H);g.save();let sz=Math.min(W*.2,H*.14,130);const L=(ls.length>1&&W<H)?ls:[a];const fit=s=>{g.font='bold '+s+'px '+FF;return Math.max(...L.map(l=>g.measureText(l).width))};while(fit(sz)>W*.88&&sz>12)sz-=2;const y0=H*.38-(L.length-1)*sz*.52+Math.sin(t*2)*6;g.shadowColor=c;g.shadowBlur=30;L.forEach((l,i)=>txt(l,W/2,y0+i*sz*1.05,sz,'#fff'));g.shadowBlur=0;txt(b,W/2,y0+(L.length-1)*sz*1.05+sz*.85,Math.max(14,Math.min(W*.045,26)),c,'center','600');g.globalAlpha=.6+.4*Math.sin(t*4);txt('Başlamak için dokun / tıkla',W/2,H*.72,Math.max(16,Math.min(W*.05,28)),'#fff');g.restore()}
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();au();const[x,y]=pos(e);mx=x;my=y;if(Math.hypot(x-W+26,y-26)<22){muted=!muted;sv('ksb-muted',muted);return}if(!started){started=true;if(typeof onStart=='function')onStart();return}try{cv.setPointerCapture(e.pointerId)}catch(_){}if(typeof down=='function')down(x,y,e)});
cv.addEventListener('pointermove',e=>{const[x,y]=pos(e);mx=x;my=y;if(started&&typeof move=='function')move(x,y,e)});
addEventListener('pointerup',e=>{if(typeof up=='function')up(e)});
addEventListener('pointercancel',e=>{if(typeof up=='function')up(e)});
addEventListener('keydown',e=>{if(e.key=='m'||e.key=='M'){muted=!muted;sv('ksb-muted',muted);return}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();au();if(!started){if(e.key==' '||e.key=='Enter'){started=true;if(typeof onStart=='function')onStart()}return}if(typeof key=='function')key(e.key,e)});
document.addEventListener('visibilitychange',()=>{hid=document.hidden;try{if(AC){hid?AC.suspend():AC.resume()}}catch(e){}});
let _l=0;function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,Math.max(0,(t-_l)/1000)||0);_l=t;if(hid)return;upd(dt);draw();if(!started)drawTitle(TITLE[0],TITLE[1],TITLE[2]);drawMute()}
/* ---- game ---- */
const TITLE=['Havai Fişek','Gökyüzünü renklendir','#ffd35c'],BK='ksb-havai-fisek-best';
const SH=['Rastgele','Daire','Kalp','Yıldız','Halka','Söğüt','Spiral'];
let P=[],RK=[],shape=0,auto=true,total=ld(BK,0),aT=.3,stars=[],bld=[],flashA=0,sc=document.createElement('canvas'),sg=sc.getContext('2d'),sk=1;
function onResize(){sc.width=W;sc.height=H;sg.fillStyle='#060816';sg.fillRect(0,0,W,H);sk=Math.max(.6,Math.min(1.4,Math.min(W,H)/650));stars=[];for(let i=0;i<70;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.7,p:Math.random()*6});bld=[];let x=-10;while(x<W){const w=24+Math.random()*50,h=H*(.06+Math.random()*.12);bld.push({x,w,h,w2:Math.random()});x+=w}}
function launch(x,ty,type,hue){RK.push({x,y:H,ty,t:type,h:hue==null?Math.random()*360:hue,vy:-Math.max(480,H*.95)});noise(.4,.05,900);tone(220,.5,'sine',.04,500)}
function boom(x,y,type,hue){let ty=type;if(!ty||ty<0)ty=1+Math.floor(Math.random()*6);const h=hue,col=(o)=>(h+o+360)%360,n=[];
 const add=(vx,vy,o,l,gr,dr)=>P.push({x,y,vx:vx*sk,vy:vy*sk,l,m:l,h:col(o),gr,dr,s:2.6});
 if(ty==1){for(let i=0;i<90;i++){const a=Math.random()*6.283,s=40+Math.random()*190;add(Math.cos(a)*s,Math.sin(a)*s,Math.random()*40-20,1.3+Math.random()*.6,70,1.6)}}
 else if(ty==2){for(let i=0;i<80;i++){const t=i/80*6.283,hx=16*Math.pow(Math.sin(t),3),hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));add(hx*10.5,hy*10.5,0,1.6,40,1.4)}}
 else if(ty==3){for(let i=0;i<100;i++){const t=i/100*10,k=Math.floor(t)%5,f=t%1;const a0=k*1.2566-1.5708,a1=(k+1)*1.2566-1.5708;const px=Math.cos(a0)*1+(Math.cos(a1)-Math.cos(a0))*f,py=Math.sin(a0)+(Math.sin(a1)-Math.sin(a0))*f;add(px*185,py*185,i%2*30,1.5,40,1.5)}}
 else if(ty==4){for(let i=0;i<60;i++){const a=i/60*6.283;add(Math.cos(a)*180,Math.sin(a)*180,0,1.5,50,1.5)}for(let i=0;i<30;i++){const a=i/30*6.283;add(Math.cos(a)*90,Math.sin(a)*90,150,1.2,40,1.5)}}
 else if(ty==5){for(let i=0;i<110;i++){const a=Math.random()*6.283,s=30+Math.random()*130;P.push({x,y,vx:Math.cos(a)*s*sk,vy:Math.sin(a)*s*sk,l:2.6,m:2.6,h:42,gr:75,dr:1.1,s:2.4})}}
 else{for(let i=0;i<110;i++){const a=i*.34,s=i/110*200;add(Math.cos(a)*s,Math.sin(a)*s,i*1.5,1.7,30,1.5)}}
 flashA=.18;total++;if(total%5==0)sv(BK,total);noise(.6,.22,2200);tone(90,.35,'sine',.18,-50);if(Math.random()<.6)setTimeout(()=>{noise(.25,.06,6000)},150)}
function down(x,y){if(y>H-56){if(x<170){auto=!auto;tone(600,.06)}else if(x>W-190){shape=(shape+1)%SH.length;tone(700,.06)}else launch(x,Math.max(70,y-80),shape?shape:-1)}else launch(x+(Math.random()-.5)*20,Math.max(60,y),shape?shape:-1)}
function key(k){if(k==' ')launch(W*(.15+Math.random()*.7),H*(.15+Math.random()*.35),shape||-1);else if(k=='a'||k=='A')auto=!auto;else if(k=='ArrowRight'||k=='s'||k=='S')shape=(shape+1)%SH.length;else if(k=='ArrowLeft')shape=(shape+SH.length-1)%SH.length}
function upd(dt){aT-=dt;if((auto||!started)&&aT<=0){launch(W*(.12+Math.random()*.76),H*(.12+Math.random()*.38),Math.random()<.5?-1:(1+Math.floor(Math.random()*6)));aT=.55+Math.random()*1.1;if(Math.random()<.25)setTimeout(()=>launch(W*(.12+Math.random()*.76),H*(.12+Math.random()*.38),-1),200)}
 for(const r of RK){r.y+=r.vy*dt;r.vy*=1-.4*dt;if(r.y<=r.ty||r.vy>-60){r.dead=1;boom(r.x,r.y,r.t,r.h)}else if(Math.random()<.7)P.push({x:r.x+(Math.random()-.5)*3,y:r.y,vx:(Math.random()-.5)*20,vy:30,l:.35,m:.35,h:40,gr:0,dr:1,s:1.8})}
 RK=RK.filter(r=>!r.dead);for(const p of P){p.vx*=1-p.dr*dt;p.vy=p.vy*(1-p.dr*dt)+p.gr*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}P=P.filter(p=>p.l>0);if(P.length>2500)P.splice(0,500);flashA=Math.max(0,flashA-dt*.5)}
function draw(){const t=performance.now()/1000;sg.globalCompositeOperation='source-over';sg.fillStyle='rgba(6,8,22,.24)';sg.fillRect(0,0,W,H);sg.globalCompositeOperation='lighter';
 for(const p of P){const k=p.l/p.m;sg.fillStyle='hsla('+p.h+',100%,'+(55+k*30)+'%,'+Math.min(1,k*1.6)+')';const s=p.s*(.5+k*.7);sg.fillRect(p.x-s/2,p.y-s/2,s,s)}
 sg.fillStyle='#fff';for(const r of RK)sg.fillRect(r.x-1.5,r.y-3,3,6);
 g.drawImage(sc,0,0,W,H);
 for(const s of stars){g.globalAlpha=.25+.25*Math.sin(t*2+s.p);g.fillStyle='#fff';g.fillRect(s.x,s.y,1.6,1.6)}g.globalAlpha=1;
 if(flashA>0){g.fillStyle='rgba(255,240,220,'+flashA+')';g.fillRect(0,0,W,H)}
 g.fillStyle='#070a18';for(const b of bld){g.fillRect(b.x,H-b.h,b.w+1,b.h)}g.fillStyle='rgba(255,210,120,.5)';for(const b of bld)for(let y=H-b.h+8;y<H-8;y+=14)for(let x=b.x+5;x<b.x+b.w-6;x+=10)if(((x*7+y*13+b.w2*99)|0)%5==0)g.fillRect(x,y,3,5);
 if(started){rr(12,H-48,150,36,18);g.fillStyle='rgba(255,255,255,.12)';g.fill();txt('Otomatik: '+(auto?'Açık':'Kapalı'),87,H-30,15,auto?'#ffe9a0':'#cfd3ff');
  rr(W-182,H-48,170,36,18);g.fill();txt('Şekil: '+SH[shape],W-97,H-30,15,'#cfd3ff');txt('Gösterilen: '+total,14,24,14,'#9aa3d8','left')}}
rs();requestAnimationFrame(loop);
</script></body></html>
