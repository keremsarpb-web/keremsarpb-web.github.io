<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Okçuluk</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1d3b2a;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
const BK='ksb-okculuk-best';
'use strict';
const cv=document.getElementById('c'),g=cv.getContext('2d');let W=1,H=1,T=0;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth||1;H=innerHeight||1;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
let best=0;try{best=+localStorage.getItem(BK)||0}catch(e){}
function saveBest(s){if(s>best){best=s;try{localStorage.setItem(BK,String(s))}catch(e){}return true}return false}
let AC=null,muted=false;
function snd(f,d,t,v,sl){if(muted||!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(sl,n+d);a.gain.setValueAtTime(v||.12,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume()}
const keys={};let onDown=()=>{},onMove=()=>{},onUp=()=>{},onKey=()=>{};
const pp=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{initAudio();const[x,y]=pp(e);if(x>W-46&&y<46){muted=!muted;return}try{cv.setPointerCapture(e.pointerId)}catch(_){}onDown(x,y)});
cv.addEventListener('pointermove',e=>{const[x,y]=pp(e);onMove(x,y)});
cv.addEventListener('pointerup',e=>{const[x,y]=pp(e);onUp(x,y)});
cv.addEventListener('pointercancel',e=>{const[x,y]=pp(e);onUp(x,y)});
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.key==' ')e.preventDefault();initAudio();if(e.key=='m'||e.key=='M'){muted=!muted;return}if(!keys[e.key])onKey(e.key);keys[e.key]=1});
addEventListener('keyup',e=>{keys[e.key]=0});
const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function tx(s,x,y,sz,c,al,w){g.font=(w||'700')+' '+Math.max(6,sz|0)+'px Fredoka,Nunito,system-ui,sans-serif';g.textAlign=al||'center';g.textBaseline='middle';g.fillStyle=c||'#fff';g.fillText(s,x,y)}
function spk(){g.save();g.globalAlpha=.85;g.fillStyle='#fff';const x=W-30,y=22;g.beginPath();g.moveTo(x-8,y-3);g.lineTo(x-4,y-3);g.lineTo(x+1,y-8);g.lineTo(x+1,y+8);g.lineTo(x-4,y+3);g.lineTo(x-8,y+3);g.fill();g.lineWidth=2;if(muted){g.strokeStyle='#f66';g.beginPath();g.moveTo(x+4,y-5);g.lineTo(x+12,y+5);g.moveTo(x+12,y-5);g.lineTo(x+4,y+5);g.stroke()}else{g.strokeStyle='#fff';g.beginPath();g.arc(x+1,y,6,-1,1);g.stroke()}g.restore()}
let S=1,OX=0,OY=0;function fit(a,b){S=Math.min(W/a,H/b);OX=(W-a*S)/2;OY=(H-b*S)/2}
const P2=(x,y)=>[(x-OX)/S,(y-OY)/S];
const PT=[];function burst(x,y,n,c,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=(.3+Math.random())*(sp||200);PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.5,c,r:2+Math.random()*3})}}
function pstep(dt){for(const p of PT){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt}for(let i=PT.length-1;i>=0;i--)if(PT[i].l<=0)PT.splice(i,1)}
function pdraw(){for(const p of PT){g.globalAlpha=cl(p.l*2,0,1);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,6.3);g.fill()}g.globalAlpha=1}
function ttl(n,sub){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,W,H);g.save();g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=24;const fs=Math.min(W*.13,H*.11,110);tx(n,W/2,H*.3,fs,'#fff','center','800');g.shadowBlur=0;tx(sub,W/2,H*.3+fs*.8,Math.min(W*.05,H*.035,28),'#ffe08a','center','600');g.globalAlpha=.6+.4*Math.sin(T*4);tx('Başlamak için dokun / tıkla',W/2,H*.8,Math.min(W*.055,H*.04,30),'#fff');g.globalAlpha=1;if(best)tx('En iyi: '+best,W/2,H*.87,Math.min(W*.045,H*.03,22),'#ccc','center','600');g.restore()}
function ovr(a,b,c){g.fillStyle='rgba(0,0,0,.62)';g.fillRect(0,0,W,H);tx(a,W/2,H*.3,Math.min(W*.12,H*.09,90),'#fff','center','800');tx(b,W/2,H*.42,Math.min(W*.06,H*.04,34),'#ffe08a');if(c)tx(c,W/2,H*.5,Math.min(W*.05,H*.035,28),'#ccc','center','600');g.globalAlpha=.6+.4*Math.sin(T*4);tx('Tekrar için dokun / tıkla',W/2,H*.72,Math.min(W*.055,H*.04,30),'#fff');g.globalAlpha=1}
let last=performance.now(),UP=()=>{},DR=()=>{};
function loop(t){requestAnimationFrame(loop);const dt=cl((t-last)/1000,0,.033);last=t;if(document.hidden)return;T+=dt;UP(dt);DR();spk()}
document.addEventListener('visibilitychange',()=>{last=performance.now()});
requestAnimationFrame(loop);
let st='title',n=0,score=0,ph='ready',aimOff=0,pw=0,anc=null,aimB=0,hold=0,wind=0,arrow=null,stuck=[],pop=null,mt=0,shk=0,kd=false,sc=[];
function tpos(){const i=Math.min(n,9),amp=i<2?0:Math.min(110,40+i*9),sp=.8+i*.12;return{x:200+amp*Math.sin(T*sp),y:290+(i>4?20*Math.sin(T*1.7):0),r:Math.max(40,70-i*3.2)}}
function start(){n=0;score=0;sc=[];stuck=[];st='play';ready()}
function ready(){ph='ready';pw=0;hold=0;anc=null;stuck=stuck.slice(-4);wind=rnd(-1,1)*(.8+n*.22);arrow=null;pop=null}
const sway=()=>{const a=3+Math.min(hold*5,20);return[Math.sin(T*1.7)*a+Math.sin(T*2.9)*a*.5,Math.cos(T*1.3)*a+Math.sin(T*3.3)*a*.4]};
const ret=()=>{const s=sway();return{x:200+aimOff+s[0],y:300+s[1]}};
function release(){if(pw<.2){pw=0;hold=0;anc=null;ph='ready';return}const r=ret();arrow={t:0,dur:.45,lx:r.x+wind*18,ly:r.y+(1-pw)*180,pw};ph='fly';pw=0;hold=0;anc=null;snd(500,.25,'sawtooth',.08,120)}
function hit(){const tp=tpos(),a=arrow,d=Math.hypot(a.lx-tp.x,a.ly-tp.y);let p=d<tp.r?10-Math.floor(d/(tp.r/10)):0;sc.push(p);score+=p;n++;
 stuck.push({dx:a.lx-tp.x,dy:a.ly-tp.y,m:p==0});pop={s:p?'+'+p:'Iska!',x:a.lx,y:a.ly-20,t:0};ph='res';mt=1;
 if(p){burst(a.lx,a.ly,p>=9?30:12,p>=9?'#ffd23f':'#fff',180);snd(150,.15,'square',.15,60);if(p>=9){snd(880,.25,'triangle',.12);shk=6}}else{burst(a.lx,a.ly,10,'#7a5',100);snd(90,.2,'sine',.12)}}
UP=dt=>{pstep(dt);shk=Math.max(0,shk-dt*30);if(pop)pop.t+=dt;if(st!='play')return;
 if(ph=='ready'||ph=='draw'){if(keys.ArrowLeft)aimOff=cl(aimOff-90*dt,-150,150);if(keys.ArrowRight)aimOff=cl(aimOff+90*dt,-150,150);
  if(keys[' ']){kd=true;ph='draw';pw=Math.min(1,pw+dt/1.1)}else if(kd){kd=false;release()}
  if(ph=='draw')hold+=dt}
 else if(ph=='fly'){arrow.t+=dt/arrow.dur;if(arrow.t>=1)hit()}
 else if(ph=='res'){mt-=dt;if(mt<=0){if(n>=10){st='over';saveBest(score);snd(score>=70?700:300,.5,'triangle',.2)}else ready()}}};
onDown=(x,y)=>{if(st!='play'){if(st=='title'||pop===null||T>0)start();return}if(ph!='ready')return;const[a,b]=P2(x,y);anc=[a,b];aimB=aimOff;ph='draw'};
onMove=(x,y)=>{if(!anc||kd)return;const[a,b]=P2(x,y);aimOff=cl(aimB+(a-anc[0]),-150,150);pw=cl((b-anc[1])/150,0,1)};
onUp=()=>{if(anc&&!kd)release()};
onKey=k=>{if(st!='play')start()};
function arrowD(x,y,s,ang){g.save();g.translate(x,y);g.rotate(ang);g.scale(s,s);g.strokeStyle='#e8d9b0';g.lineWidth=3;g.beginPath();g.moveTo(0,0);g.lineTo(0,-60);g.stroke();g.fillStyle='#ccc';g.beginPath();g.moveTo(0,-70);g.lineTo(-4,-58);g.lineTo(4,-58);g.fill();g.fillStyle='#e44';g.beginPath();g.moveTo(0,-4);g.lineTo(-7,6);g.lineTo(0,2);g.lineTo(7,6);g.fill();g.restore()}
DR=()=>{const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#5db7f0');gr.addColorStop(.5,'#cdeeff');gr.addColorStop(.52,'#5cb85c');gr.addColorStop(1,'#2e7d32');g.fillStyle=gr;g.fillRect(0,0,W,H);fit(400,700);g.save();g.translate(OX+(shk?rnd(-shk,shk):0),OY);g.scale(S,S);
 g.fillStyle='#fff';g.globalAlpha=.8;for(let i=0;i<4;i++){const x=((T*6*(1+i*.3)+i*150)%560)-80,y=60+i*50;g.beginPath();g.arc(x,y,22,0,6.3);g.arc(x+22,y+4,18,0,6.3);g.arc(x-20,y+5,16,0,6.3);g.fill()}g.globalAlpha=1;
 g.fillStyle='#3f9a49';g.beginPath();g.moveTo(-600,420);g.quadraticCurveTo(80,300,300,400);g.quadraticCurveTo(450,330,1000,420);g.lineTo(1000,700);g.lineTo(-600,700);g.fill();g.fillStyle='#4caf50';g.fillRect(-600,400,1600,300);
 const tp=tpos(),ps=st=='title'?{x:200,y:290,r:70}:tp;
 g.fillStyle='#6b4a2a';g.fillRect(ps.x-4,ps.y,8,150);g.fillRect(ps.x-30,ps.y+140,60,6);
 [['#fff',1],['#222',.8],['#2a7fd4',.6],['#e33',.4],['#ffd23f',.2]].forEach(c=>{g.fillStyle=c[0];g.beginPath();g.arc(ps.x,ps.y,ps.r*c[1],0,6.3);g.fill()});g.strokeStyle='#0005';g.lineWidth=1;for(let i=1;i<=10;i++){g.beginPath();g.arc(ps.x,ps.y,ps.r*i/10,0,6.3);g.stroke()}
 for(const s of stuck){const x=tp.x+s.dx,y=tp.y+s.dy;arrowD(x,y+(s.m?30:0),.5,0)}
 if(arrow){const t=arrow.t,e=t,x=200+(arrow.lx-200)*e,y=660+(arrow.ly-660)*e-Math.sin(Math.PI*t)*60*arrow.pw,s=1-.5*t;arrowD(x,y,s,Math.atan2(arrow.lx-200,300)*(.3))}
 pdraw();
 if(st=='play'){const r=ret();if(ph=='ready'||ph=='draw'){g.strokeStyle='#fff';g.lineWidth=2;g.shadowColor='#000';g.shadowBlur=4;g.beginPath();g.arc(r.x,r.y,16,0,6.3);g.moveTo(r.x-24,r.y);g.lineTo(r.x-8,r.y);g.moveTo(r.x+8,r.y);g.lineTo(r.x+24,r.y);g.moveTo(r.x,r.y-24);g.lineTo(r.x,r.y-8);g.moveTo(r.x,r.y+8);g.lineTo(r.x,r.y+24);g.stroke();g.shadowBlur=0}
  const nk=ph=='fly'||ph=='res'?0:pw*70;g.strokeStyle='#6b3d12';g.lineWidth=12;g.lineCap='round';g.beginPath();g.arc(200,780,190,-2.4,-.74);g.stroke();g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(75,665);g.lineTo(200,665+nk);g.lineTo(325,665);g.stroke();if(ph!='fly'&&ph!='res')arrowD(200,665+nk+10,1.3,0);
  g.fillStyle='#0008';g.fillRect(150,688,100,8);g.fillStyle=pw>.9?'#4f4':'#fc4';g.fillRect(150,688,100*pw,8);
  tx('Puan '+score,20,30,26,'#fff','left','800');tx('Ok '+Math.max(0,10-n)+' / 10',380,30,22,'#fff','right');
  const wx=200;tx('Rüzgâr',wx,24,14,'#234','center','600');g.strokeStyle=wind>0?'#d33':'#13c';g.lineWidth=6;g.beginPath();g.moveTo(wx,46);g.lineTo(wx+wind*22,46);g.stroke();g.fillStyle=g.strokeStyle;const dd=Math.sign(wind)||1;g.beginPath();g.moveTo(wx+wind*22+dd*10,46);g.lineTo(wx+wind*22,38);g.lineTo(wx+wind*22,54);g.fill();
  if(pop){g.globalAlpha=Math.max(0,1-pop.t);tx(pop.s,pop.x,pop.y-pop.t*40,40,'#fff','center','800');g.globalAlpha=1}
  if(n==0&&ph=='ready')tx('Aşağı çek, sağa-sola kaydır, bırak',200,560,16,'#fff','center','600')}
 g.restore();if(st=='title')ttl('Okçuluk','10 ok · rüzgâra dikkat');
 if(st=='over')ovr('BİTTİ!',score+' puan','En iyi: '+best)};

</script></body></html>
