<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Çarpan Avı – KSB Games</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; height:100%; background:#10203a; overflow:hidden; touch-action:none; overscroll-behavior:none; user-select:none; -webkit-user-select:none; }
  canvas { display:block; width:100vw; height:100vh; height:100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
// Çarpan Avı: hedef sayının çarpanlarını (ya da katlarını, asal sayıları) süre bitmeden bul
const c = document.getElementById('c'), x = c.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; c.width = W * DPR; c.height = H * DPR; x.setTransform(DPR, 0, 0, DPR, 0, 0); layout(); }
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const F = (s, w = 700) => `${w} ${s}px Fredoka, system-ui, sans-serif`;
const rnd = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rnd(a, b + 1));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// --- ses
let ac = null, muted = ls.get('ksb-carpan-avi-mute', false);
function snd(f, d = .12, type = 'sine', v = .15, slide = 0) {
  if (muted || !ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d);
}
function wake() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); }

// --- modlar
const MODES = [
  { k: 'carpan', name: 'Çarpanlar', hint: 'sayısının çarpanlarını bul', col: '#ffb340' },
  { k: 'kat', name: 'Katlar', hint: 'sayısının katlarını bul', col: '#4fd6c3' },
  { k: 'asal', name: 'Asal sayılar', hint: 'Asal sayıları bul', col: '#ff6fa8' },
];
const isPrime = n => { if (n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
const divisors = n => { const d = []; for (let i = 1; i <= n; i++) if (n % i === 0) d.push(i); return d; };
const POOL = [[12, 18, 20, 24, 30, 16, 28], [36, 40, 42, 45, 48, 54, 60], [64, 72, 80, 84, 90, 96, 100], [108, 120, 126, 144, 150, 180]];

let state = 'title', mode = ls.get('ksb-carpan-avi-mode', 0), best = ls.get('ksb-carpan-avi-best', 0);
let score = 0, combo = 1, time = 60, round = 0, target = 0, cells = [], left = 0, cur = 0, T = 0, shake = 0, flash = 0, msg = '', msgT = 0, newBest = false;
const parts = [], floats = Array.from({ length: 26 }, () => ({ x: Math.random(), y: Math.random(), v: rnd(.02, .06), n: ri(2, 99), s: rnd(18, 46), a: rnd(.05, .16) }));

function makeRound() {
  round++;
  const lvl = Math.min(3, Math.floor((round - 1) / 3)), m = MODES[mode].k, set = new Set();
  let good = [], bad = [];
  if (m === 'carpan') {
    target = POOL[lvl][ri(0, POOL[lvl].length - 1)];
    good = shuffle(divisors(target)).slice(0, 7);
    const pool = []; for (let i = 2; i <= Math.max(30, target + 10); i++) if (target % i) pool.push(i);
    bad = shuffle(pool);
  } else if (m === 'kat') {
    target = ri(3 + lvl, 6 + lvl * 2);
    const top = target * 12, mult = [], non = [];
    for (let i = 2; i <= top; i++) (i % target ? non : mult).push(i);
    good = shuffle(mult).slice(0, ri(4, 6)); bad = shuffle(non);
  } else {
    target = 0;
    const top = 30 + lvl * 25, pr = [], co = [];
    for (let i = 2; i <= top; i++) (isPrime(i) ? pr : co).push(i);
    good = shuffle(pr).slice(0, ri(4, 6)); bad = shuffle(co);
  }
  good.forEach(n => set.add(n));
  for (const n of bad) { if (set.size >= 16) break; set.add(n); }
  cells = shuffle([...set]).map(n => ({ n, ok: good.includes(n), hit: 0, wrong: 0, pop: 0 }));
  left = good.length; cur = 0; layout();
}
function correct(n) { const m = MODES[mode].k; return m === 'carpan' ? target % n === 0 : m === 'kat' ? n % target === 0 : isPrime(n); }

// --- yerleşim
let G = { x: 0, y: 0, s: 0, gap: 0 }, btns = [], mute = { x: 0, y: 0, r: 20 };
function layout() {
  const top = Math.max(150, H * .2), bottom = 80;
  const s = Math.min((W - 32) / 4, (H - top - bottom) / 4, 120), gap = s * .1;
  G = { s, gap, x: (W - 4 * s) / 2, y: top + Math.max(0, (H - top - bottom - 4 * s) / 2) };
  mute = { x: W - 30, y: 30, r: 18 };
  const bw = Math.min(300, W - 60), bh = 52, by = H * .52;
  btns = MODES.map((m, i) => ({ x: (W - bw) / 2, y: by + i * (bh + 12), w: bw, h: bh, i }));
}
function cellRect(i) { const cx = i % 4, cy = Math.floor(i / 4), g = G.gap / 2; return { x: G.x + cx * G.s + g, y: G.y + cy * G.s + g, w: G.s - G.gap, h: G.s - G.gap }; }

function start() {
  state = 'play'; score = 0; combo = 1; time = 60; round = 0; newBest = false; msg = ''; ls.set('ksb-carpan-avi-mode', mode);
  makeRound(); snd(520, .1, 'triangle'); snd(780, .14, 'triangle', .12);
}
function burst(px, py, col, n = 16) { for (let i = 0; i < n; i++) { const a = rnd(0, 6.28), v = rnd(60, 260); parts.push({ x: px, y: py, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: rnd(.4, .8), col }); } }
function pick(i) {
  const k = cells[i]; if (!k || k.hit) return;
  const r = cellRect(i), px = r.x + r.w / 2, py = r.y + r.h / 2;
  if (correct(k.n)) {
    k.hit = 1; k.pop = 1; left--; score += 10 * combo; combo = Math.min(5, combo + 1);
    burst(px, py, MODES[mode].col); snd(440 + combo * 90, .12, 'triangle', .14);
    if (left <= 0) { const bonus = 4; time = Math.min(99, time + bonus); score += 25; msg = `Tamam! +${bonus} sn`; msgT = 1.3; flash = .5; snd(660, .1, 'triangle'); setTimeout(() => snd(990, .18, 'triangle'), 90); setTimeout(makeRound, 450); }
  } else {
    k.wrong = .5; combo = 1; time = Math.max(0, time - 3); shake = 10; msg = why(k.n); msgT = 1.6; snd(160, .25, 'sawtooth', .12, .5);
  }
}
function why(n) {
  const m = MODES[mode].k;
  if (m === 'carpan') return `${target} ÷ ${n} tam bölünmüyor  −3 sn`;
  if (m === 'kat') return `${n}, ${target} sayısının katı değil  −3 sn`;
  const d = divisors(n).find(v => v > 1 && v < n); return `${n} = ${d} × ${n / d}, asal değil  −3 sn`;
}
function end() {
  state = 'over'; if (score > best) { best = score; newBest = true; ls.set('ksb-carpan-avi-best', best); }
  snd(300, .3, 'triangle', .14, .5);
}

// --- girdi
function at(e) { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
const inR = (px, py, b) => px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
c.addEventListener('pointerdown', e => {
  e.preventDefault(); wake();
  const [px, py] = at(e);
  if (Math.hypot(px - mute.x, py - mute.y) < mute.r + 8) { muted = !muted; ls.set('ksb-carpan-avi-mute', muted); return; }
  if (state === 'title') { const b = btns.find(b => inR(px, py, b)); if (b) mode = b.i; start(); return; }
  if (state === 'over') { if (T - overAt > .6) { if (py > H * .78) state = 'title'; else start(); } return; }
  for (let i = 0; i < cells.length; i++) if (inR(px, py, cellRect(i))) { cur = i; pick(i); return; }
});
addEventListener('keydown', e => {
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
  wake();
  if (e.key === 'm' || e.key === 'M') { muted = !muted; ls.set('ksb-carpan-avi-mute', muted); return; }
  if (state === 'title') { if ('123'.includes(e.key)) mode = +e.key - 1; else if (e.key === 'ArrowUp') mode = (mode + 2) % 3; else if (e.key === 'ArrowDown') mode = (mode + 1) % 3; if (e.key === ' ' || e.key === 'Enter' || '123'.includes(e.key)) start(); return; }
  if (state === 'over') { if ((e.key === ' ' || e.key === 'Enter') && T - overAt > .6) start(); if (e.key === 'Escape') state = 'title'; return; }
  const mv = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -4, ArrowDown: 4 }[e.key];
  if (mv) cur = (cur + mv + 16) % 16;
  if (e.key === ' ' || e.key === 'Enter') pick(cur);
});
let paused = false;
document.addEventListener('visibilitychange', () => { paused = document.hidden; last = performance.now(); });

// --- çizim
function rr(px, py, w, h, r) { x.beginPath(); x.roundRect ? x.roundRect(px, py, w, h, r) : x.rect(px, py, w, h); }
function bg(dt) {
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#16284a'); g.addColorStop(1, '#0b1428');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  for (const f of floats) { f.y -= f.v * dt; if (f.y < -.1) { f.y = 1.1; f.x = Math.random(); f.n = ri(2, 99); } x.fillStyle = `rgba(160,200,255,${f.a})`; x.font = F(f.s, 600); x.fillText(f.n, f.x * W, f.y * H); }
}
function muteIcon() {
  x.save(); x.translate(mute.x, mute.y); x.fillStyle = 'rgba(255,255,255,.12)'; x.beginPath(); x.arc(0, 0, mute.r, 0, 7); x.fill();
  x.fillStyle = '#e8f0ff'; x.beginPath(); x.moveTo(-8, -4); x.lineTo(-3, -4); x.lineTo(3, -9); x.lineTo(3, 9); x.lineTo(-3, 4); x.lineTo(-8, 4); x.fill();
  x.strokeStyle = '#e8f0ff'; x.lineWidth = 2; x.beginPath();
  if (muted) { x.moveTo(6, -5); x.lineTo(13, 5); x.moveTo(13, -5); x.lineTo(6, 5); } else { x.arc(4, 0, 6, -.9, .9); x.moveTo(8, -9); x.arc(4, 0, 10, -.9, .9); }
  x.stroke(); x.restore();
}
function title() {
  const s = Math.min(W / 7.2, 96), bob = Math.sin(T * 2) * 4;
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.shadowColor = '#ffb340'; x.shadowBlur = 24; x.fillStyle = '#ffd27a'; x.font = F(s); x.fillText('ÇARPAN', W / 2, H * .22 + bob);
  x.shadowColor = '#4fd6c3'; x.fillStyle = '#9ff2e6'; x.fillText('AVI', W / 2, H * .22 + s * 1.02 + bob); x.shadowBlur = 0;
  x.fillStyle = '#c9d6f2'; x.font = F(Math.min(20, W / 22), 500); x.fillText('Doğru sayılara dokun, süre bitmeden avla!', W / 2, H * .22 + s * 1.75);
  for (const b of btns) {
    const m = MODES[b.i], on = b.i === mode;
    rr(b.x, b.y, b.w, b.h, 14); x.fillStyle = on ? m.col : 'rgba(255,255,255,.08)'; x.fill();
    x.strokeStyle = m.col; x.lineWidth = 2; x.stroke();
    x.fillStyle = on ? '#10203a' : '#fff'; x.font = F(22, 700); x.fillText(`${b.i + 1}. ${m.name}`, W / 2, b.y + b.h / 2 + 1);
  }
  const ly = btns[2].y + btns[2].h + 40;
  x.globalAlpha = .6 + Math.sin(T * 4) * .4; x.fillStyle = '#fff'; x.font = F(20, 600); x.fillText('Başlamak için dokun / tıkla', W / 2, ly); x.globalAlpha = 1;
  if (best) { x.fillStyle = '#9fb3d9'; x.font = F(16, 500); x.fillText(`En iyi: ${best}`, W / 2, ly + 30); }
}
function hud() {
  const m = MODES[mode];
  x.textAlign = 'left'; x.textBaseline = 'middle'; x.fillStyle = '#fff'; x.font = F(24); x.fillText(score, 18, 30);
  x.fillStyle = '#9fb3d9'; x.font = F(13, 500); x.fillText(combo > 1 ? `seri ×${combo}` : 'puan', 18, 52);
  const bw = Math.min(260, W - 170), bx = (W - bw) / 2;
  rr(bx, 22, bw, 14, 7); x.fillStyle = 'rgba(255,255,255,.1)'; x.fill();
  rr(bx, 22, bw * Math.min(1, time / 60), 14, 7); x.fillStyle = time < 10 ? '#ff5a6a' : m.col; x.fill();
  x.textAlign = 'center'; x.fillStyle = '#fff'; x.font = F(13, 600); x.fillText(`${Math.ceil(time)} sn`, W / 2, 50);
  const ty = G.y - Math.min(70, G.y - 80) / 2 - 18;
  x.font = F(Math.min(34, W / 12)); x.fillStyle = m.col;
  x.fillText(m.k === 'asal' ? m.hint : `${target} ${m.hint}`, W / 2, ty);
  x.fillStyle = '#c9d6f2'; x.font = F(16, 500); x.fillText(`Kalan: ${left}`, W / 2, ty + 32);
}
function grid(dt) {
  const m = MODES[mode];
  cells.forEach((k, i) => {
    const r = cellRect(i); k.pop = Math.max(0, k.pop - dt * 3); k.wrong = Math.max(0, k.wrong - dt);
    const sc = 1 + k.pop * .15, wx = k.wrong ? Math.sin(T * 60) * 5 * k.wrong : 0;
    x.save(); x.translate(r.x + r.w / 2 + wx, r.y + r.h / 2); x.scale(sc, sc);
    rr(-r.w / 2, -r.h / 2, r.w, r.h, r.w * .18);
    x.fillStyle = k.hit ? m.col : k.wrong ? '#ff5a6a' : 'rgba(255,255,255,.09)'; x.fill();
    x.strokeStyle = i === cur && kbd ? '#fff' : 'rgba(255,255,255,.18)'; x.lineWidth = i === cur && kbd ? 3 : 1.5; x.stroke();
    x.fillStyle = k.hit ? '#10203a' : '#fff'; x.font = F(r.w * (k.n > 99 ? .32 : .4)); x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(k.n, 0, 2); x.restore();
  });
  if (msgT > 0) { x.globalAlpha = Math.min(1, msgT * 2); x.fillStyle = msg.startsWith('Tamam') ? '#9ff2e6' : '#ffb3bb'; x.font = F(Math.min(20, W / 20), 600); x.textAlign = 'center'; x.fillText(msg, W / 2, G.y + 4 * G.s + 28); x.globalAlpha = 1; }
}
let overAt = 0;
function over() {
  x.fillStyle = 'rgba(8,14,30,.72)'; x.fillRect(0, 0, W, H);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = '#ffd27a'; x.font = F(Math.min(56, W / 8)); x.fillText('Süre bitti!', W / 2, H * .3);
  x.fillStyle = '#fff'; x.font = F(Math.min(80, W / 5)); x.fillText(score, W / 2, H * .45);
  x.fillStyle = newBest ? '#9ff2e6' : '#9fb3d9'; x.font = F(20, 600); x.fillText(newBest ? 'Yeni rekor!' : `En iyi: ${best}`, W / 2, H * .45 + 62);
  x.fillStyle = '#c9d6f2'; x.font = F(17, 500); x.fillText(`${round - 1} tur tamamlandı · ${MODES[mode].name}`, W / 2, H * .45 + 94);
  x.globalAlpha = .6 + Math.sin(T * 4) * .4; x.fillStyle = '#fff'; x.font = F(20, 600); x.fillText('Tekrar oynamak için dokun', W / 2, H * .68); x.globalAlpha = 1;
  rr(W / 2 - 100, H * .82, 200, 46, 12); x.fillStyle = 'rgba(255,255,255,.1)'; x.fill();
  x.fillStyle = '#fff'; x.font = F(18, 600); x.fillText('Mod değiştir', W / 2, H * .82 + 24);
}
let kbd = false; addEventListener('keydown', () => kbd = true); c.addEventListener('pointerdown', () => kbd = false);

let last = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
  if (paused) return;
  T += dt;
  if (state === 'play') { time -= dt; if (time <= 0) { time = 0; end(); overAt = T; } }
  msgT = Math.max(0, msgT - dt); flash = Math.max(0, flash - dt);
  x.save();
  if (shake > .2) { x.translate(rnd(-shake, shake), rnd(-shake, shake)); shake *= .85; } else shake = 0;
  bg(dt);
  if (state === 'title') title(); else { hud(); grid(dt); }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.l -= dt; if (p.l <= 0) { parts.splice(i, 1); continue; } p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; x.globalAlpha = Math.min(1, p.l * 2); x.fillStyle = p.col; x.beginPath(); x.arc(p.x, p.y, 4, 0, 7); x.fill(); }
  x.globalAlpha = 1;
  if (flash) { x.fillStyle = `rgba(159,242,230,${flash * .25})`; x.fillRect(0, 0, W, H); }
  if (state === 'over') over();
  x.restore();
  muteIcon();
}
addEventListener('resize', resize); resize(); requestAnimationFrame(loop);
</script>
</body>
</html>
