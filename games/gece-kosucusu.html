<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gece Koşucusu — KSB Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#070615;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;left:0;top:0;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const ID='gece-kosucusu',FONT='"Russo One",system-ui,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,U=1,GY=0,PX=0,layers=[],stars=[];
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){}return null;}
let best=+ls('ksb-'+ID+'-best')||0,muted=ls('ksb-'+ID+'-mute')==='1';
const rnd=(a,b)=>a+Math.random()*(b-a);
// ---------- audio ----------
let AC=null,NB=null;
function initAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,d,type,vol,f2,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05);}
function noise(d,vol,f,type){if(!AC||muted)return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}const t=AC.currentTime,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;fl.type=type||'lowpass';fl.frequency.value=f||1000;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+d+.05);}
const sfx={
  jump(){tone(380,.16,'square',.06,760);},
  dbl(){tone(620,.2,'square',.05,1240);tone(930,.15,'sine',.05,1600,.04);},
  coin(){tone(988,.08,'square',.05);tone(1319,.18,'square',.05,null,.07);},
  crash(){noise(.5,.5,900);tone(180,.5,'sawtooth',.18,35);},
  land(){noise(.07,.12,500);}
};
function toggleMute(){muted=!muted;ls('ksb-'+ID+'-mute',muted?'1':'0');}
// ---------- layout ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function buildLayer(col,hMin,hMax,winP,winCols,fac,seedAnt){
  const TW=Math.ceil(Math.max(W,700)*1.3),c=document.createElement('canvas');
  c.width=Math.ceil(TW*DPR);c.height=Math.ceil(GY*DPR);const o=c.getContext('2d');o.scale(DPR,DPR);
  let x=0;
  while(x<TW){
    const w=rnd(50,120)*U;if(x+w>TW)break;const h=rnd(hMin,hMax)*GY,y=GY-h;
    o.fillStyle=col;o.fillRect(x,y,w,h);
    if(Math.random()<.4){o.fillRect(x+w*.3,y-12*U,w*.4,12*U);}
    if(seedAnt&&Math.random()<.35){o.fillRect(x+w/2-1.5*U,y-40*U,3*U,40*U);o.fillStyle='#ff3b6b';o.beginPath();o.arc(x+w/2,y-40*U,3*U,0,7);o.fill();}
    const ws=9*U,wh=6*U;
    for(let wy=y+10*U;wy<GY-12*U;wy+=wh*2.2)for(let wx=x+7*U;wx<x+w-10*U;wx+=ws*1.6){
      if(Math.random()<winP){o.fillStyle=winCols[(Math.random()*winCols.length)|0];o.globalAlpha=rnd(.35,.95);o.fillRect(wx,wy,ws*.8,wh);o.globalAlpha=1;}
    }
    x+=w+rnd(4,30)*U;
  }
  return {c,TW,fac};
}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  U=Math.min(H/700,W/480);GY=Math.round(H*0.8);PX=Math.min(W*0.2,220*U);
  layers=[buildLayer('#1d1848',.3,.62,.12,['#6b5cff','#ff5fa8'],.12,false),
          buildLayer('#141036',.2,.48,.18,['#ffd36b','#7af6ff'],.3,true),
          buildLayer('#0b0922',.12,.34,.25,['#ffe08a','#ff7ac8','#7af6ff'],.6,true)];
  stars=[];for(let i=0;i<140;i++)stars.push({x:Math.random(),y:Math.random()*.7,r:Math.random()*1.4+.3,p:Math.random()*6});
}
addEventListener('resize',resize);resize();
// ---------- state ----------
let state='title',paused=false,t=0,dist=0,spd=0,el=0,coins=0,score=0,shake=0,overT=0,newBest=false;
let obs=[],cns=[],parts=[],trail=[],floats=[],nextX=0;
const P={py:0,vy:0,gr:true,jumps:0,hold:false,holdT:0,spin:0};
const G=2600,JV=820;
function reset(){dist=0;spd=330;el=0;coins=0;score=0;obs=[];cns=[];parts=[];floats=[];trail=[];nextX=700;Object.assign(P,{py:0,vy:0,gr:true,jumps:0,hold:false,holdT:0,spin:0});newBest=false;}
reset();
function burst(x,y,n,col,sp,life,g){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life*rnd(.5,1),m:life,c:col,s:rnd(1.5,4)*U,g:g||0});}}
function jump(){
  if(P.gr){P.vy=JV;P.gr=false;P.jumps=1;P.holdT=0;sfx.jump();burst(PX,GY,10,'#7af6ff',160*U,.4,300*U);}
  else if(P.jumps<2){P.vy=JV*.88;P.jumps=2;P.holdT=0;P.spin=1;sfx.dbl();burst(PX,GY-P.py*U-20*U,16,'#ff5fa8',220*U,.5,0);}
}
function spawn(){
  const x=nextX,lvl=Math.min(1,el/90),r=Math.random();let o,w;
  if(r<.38){w=rnd(38,64);o={t:'box',x,w,y:0,h:rnd(36,60+lvl*25)};}
  else if(r<.66){const n=1+((Math.random()*(2+lvl*2))|0);w=n*26;o={t:'spike',x,w,y:0,h:30};}
  else if(r<.84&&el>8){w=48;o={t:'drone',x,w,y:rnd(84,120),h:26,ph:Math.random()*6};}
  else if(el>20){w=30;o={t:'wall',x,w,y:0,h:rnd(110,140)};}
  else{w=50;o={t:'box',x,w,y:0,h:44};}
  obs.push(o);
  if(Math.random()<.55){const n=5,top=o.y+o.h+40;for(let i=0;i<n;i++){const k=i/(n-1);cns.push({x:x+o.w/2+(k-.5)*150,y:o.t==='drone'?18:top+Math.sin(k*Math.PI)*55,got:false});}}
  else if(Math.random()<.5){for(let i=0;i<4;i++)cns.push({x:x+o.w+120+i*34,y:18,got:false});}
  const gap=rnd(280,520)*Math.pow(spd/330,.65)*(1-lvl*.15);nextX=x+w+gap;
}
function die(){
  state='over';overT=0;shake=18;sfx.crash();
  const sy=GY-P.py*U-25*U;burst(PX,sy,40,'#7af6ff',420*U,.9,600*U);burst(PX,sy,30,'#ff5fa8',320*U,.9,600*U);
  if(score>best){best=score;newBest=true;ls('ksb-'+ID+'-best',best);}
}
function start(){reset();state='play';}
function press(){
  initAudio();
  if(state==='title'){start();P.hold=true;jump();return;}
  if(state==='over'){if(overT>.6)start();return;}
  if(paused){paused=false;return;}
  P.hold=true;jump();
}
function release(){P.hold=false;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(e.clientX>W-56&&e.clientY<56){initAudio();toggleMute();return;}press();});
addEventListener('pointerup',release);addEventListener('pointercancel',release);
addEventListener('keydown',e=>{
  const k=e.code;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))e.preventDefault();
  if(k==='KeyM'){initAudio();toggleMute();return;}
  if(e.repeat)return;
  if(k==='Space'||k==='ArrowUp'||k==='KeyW'||k==='Enter')press();
});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Enter')release();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='play')paused=true;P.hold=false;if(AC)AC.suspend();}else if(AC&&AC.state==='suspended')AC.resume();});
// ---------- update ----------
function update(dt){
  t+=dt;shake=Math.max(0,shake-dt*40);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=.98;p.l-=dt;}
  parts=parts.filter(p=>p.l>0);
  for(const f of floats){f.y-=40*U*dt;f.l-=dt;}floats=floats.filter(f=>f.l>0);
  if(state==='title'){dist+=150*dt;return;}
  if(state==='over'){overT+=dt;return;}
  if(paused)return;
  el+=dt;spd=Math.min(720,330+el*7);dist+=spd*dt;
  // player
  const low=P.hold&&P.vy>0&&P.holdT<.28;P.holdT+=dt;
  P.vy-=G*(low?.42:1)*dt;P.py+=P.vy*dt;
  if(P.py<=0){if(!P.gr){sfx.land();burst(PX,GY,8,'#b9a8ff',120*U,.35,200*U);}P.py=0;P.vy=0;P.gr=true;P.jumps=0;}
  else P.gr=false;
  if(P.spin>0)P.spin=Math.max(0,P.spin-dt*2.6);
  trail.push({x:dist,y:P.py+42});if(trail.length>14)trail.shift();
  if(Math.random()<.5&&P.gr)parts.push({x:PX-12*U,y:GY-2,vx:-rnd(40,120)*U,vy:-rnd(10,60)*U,l:.3,m:.3,c:'#5b4dd6',s:2*U,g:0});
  // spawn
  const view=(W-PX)/U+120;while(nextX<dist+view)spawn();
  obs=obs.filter(o=>o.x+o.w>dist-PX/U-50);cns=cns.filter(c=>c.x>dist-PX/U-50&&!c.got);
  // collisions
  const pl=dist-11,pr=dist+11,pb=P.py,pt=P.py+46;
  for(const o of obs){
    let oy=o.y;if(o.t==='drone')oy+=Math.sin(t*4+o.ph)*8;
    const top=o.t==='spike'?oy+o.h-8:oy+o.h,l=o.t==='spike'?o.x+6:o.x,r=o.t==='spike'?o.x+o.w-6:o.x+o.w;
    if(pr>l&&pl<r&&pt>oy&&pb<top){die();return;}
  }
  for(const c of cns){if(Math.abs(c.x-dist)<24&&Math.abs(c.y-(P.py+25))<36){c.got=true;coins++;sfx.coin();const sx=PX+(c.x-dist)*U,sy=GY-c.y*U;burst(sx,sy,10,'#ffd84d',180*U,.45,0);floats.push({x:sx,y:sy,s:'+25',l:.7});}}
  score=Math.floor(dist/10)+coins*25;
}
// ---------- draw ----------
function sky(){
  const g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,'#070418');g.addColorStop(.6,'#1b0f45');g.addColorStop(1,'#43205e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const s of stars){ctx.globalAlpha=.4+.6*Math.abs(Math.sin(t*1.3+s.p));ctx.fillStyle='#fff';ctx.fillRect(s.x*W,s.y*GY,s.r,s.r);}
  ctx.globalAlpha=1;
  const mx=W*.78,my=Math.min(H*.17,GY*.25),mr=38*U;
  const mg=ctx.createRadialGradient(mx,my,mr*.5,mx,my,mr*4);mg.addColorStop(0,'rgba(255,220,250,.35)');mg.addColorStop(1,'rgba(255,220,250,0)');
  ctx.fillStyle=mg;ctx.fillRect(mx-mr*4,my-mr*4,mr*8,mr*8);
  ctx.fillStyle='#fff3fb';ctx.beginPath();ctx.arc(mx,my,mr,0,7);ctx.fill();
  ctx.fillStyle='rgba(200,170,220,.35)';ctx.beginPath();ctx.arc(mx-mr*.3,my-mr*.2,mr*.22,0,7);ctx.arc(mx+mr*.35,my+mr*.3,mr*.14,0,7);ctx.fill();
  for(const L of layers){const off=((dist*U*L.fac)%L.TW+L.TW)%L.TW;for(let x=-off;x<W;x+=L.TW)ctx.drawImage(L.c,x,0,L.TW,GY);}
  const hg=ctx.createLinearGradient(0,GY-80*U,0,GY);hg.addColorStop(0,'rgba(255,60,160,0)');hg.addColorStop(1,'rgba(255,60,160,.18)');ctx.fillStyle=hg;ctx.fillRect(0,GY-80*U,W,80*U);
  const gg=ctx.createLinearGradient(0,GY,0,H);gg.addColorStop(0,'#1a0f33');gg.addColorStop(1,'#04030b');ctx.fillStyle=gg;ctx.fillRect(0,GY,W,H-GY);
  ctx.strokeStyle='rgba(122,246,255,.18)';ctx.lineWidth=1;const step=60*U,o=(dist*U)%step;
  ctx.beginPath();for(let x=-o;x<W+step;x+=step){ctx.moveTo(x,GY);ctx.lineTo(x-(W/2-x)*.6,H);}ctx.stroke();
  ctx.shadowColor='#ff3fa4';ctx.shadowBlur=14;ctx.fillStyle='#ff5fb5';ctx.fillRect(0,GY-1,W,3);ctx.shadowBlur=0;
}
function drawObs(){
  for(const o of obs){
    const x=PX+(o.x-dist)*U;let oy=o.y;if(o.t==='drone')oy+=Math.sin(t*4+o.ph)*8;
    const y=GY-(oy+o.h)*U,w=o.w*U,h=o.h*U;if(x>W+20||x+w<-20)continue;
    ctx.save();
    if(o.t==='box'||o.t==='wall'){
      const c=o.t==='wall'?'#ffb340':'#ff4fb0';ctx.fillStyle=o.t==='wall'?'#2b1606':'#2a0a26';rr(x,y,w,h,4*U);ctx.fill();
      ctx.shadowColor=c;ctx.shadowBlur=12;ctx.strokeStyle=c;ctx.lineWidth=2.5*U;ctx.stroke();ctx.shadowBlur=0;
      ctx.globalAlpha=.5;ctx.beginPath();ctx.moveTo(x+5*U,y+5*U);ctx.lineTo(x+w-5*U,y+h-5*U);ctx.moveTo(x+w-5*U,y+5*U);ctx.lineTo(x+5*U,y+h-5*U);ctx.stroke();
    }else if(o.t==='spike'){
      ctx.fillStyle='#062a33';ctx.strokeStyle='#5ff4ff';ctx.lineWidth=2*U;ctx.shadowColor='#5ff4ff';ctx.shadowBlur=12;
      ctx.beginPath();const n=Math.round(o.w/26);for(let i=0;i<n;i++){const sx=x+i*26*U;ctx.moveTo(sx,GY);ctx.lineTo(sx+13*U,y);ctx.lineTo(sx+26*U,GY);}ctx.fill();ctx.stroke();
    }else{
      ctx.fillStyle='#1a1030';ctx.strokeStyle='#c6ff4f';ctx.shadowColor='#c6ff4f';ctx.shadowBlur=14;ctx.lineWidth=2.5*U;
      rr(x,y+6*U,w,h-6*U,8*U);ctx.fill();ctx.stroke();
      ctx.fillStyle='#ff3b6b';ctx.beginPath();ctx.arc(x+w/2,y+h*.6,4*U,0,7);ctx.fill();
      const pr=(t*30)%2<1;ctx.beginPath();ctx.moveTo(x-6*U,y+(pr?2:5)*U);ctx.lineTo(x+w*.4,y+3*U);ctx.moveTo(x+w*.6,y+3*U);ctx.lineTo(x+w+6*U,y+(pr?5:2)*U);ctx.stroke();
    }
    ctx.restore();
  }
  for(const c of cns){
    const x=PX+(c.x-dist)*U,y=GY-c.y*U;if(x<-20||x>W+20)continue;const sq=Math.abs(Math.cos(t*5+c.x*.05));
    ctx.fillStyle='rgba(255,210,60,.18)';ctx.beginPath();ctx.arc(x,y,16*U,0,7);ctx.fill();
    ctx.fillStyle='#ffd84d';ctx.beginPath();ctx.ellipse(x,y,9*U*Math.max(.2,sq),9*U,0,0,7);ctx.fill();
    ctx.fillStyle='#fff6c2';ctx.beginPath();ctx.ellipse(x,y,4*U*Math.max(.2,sq),5*U,0,0,7);ctx.fill();
  }
}
function drawPlayer(){
  if(state==='over')return;
  if(trail.length>1){ctx.save();ctx.lineCap='round';for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i];ctx.strokeStyle=`rgba(255,79,176,${i/trail.length*.6})`;ctx.lineWidth=i/trail.length*7*U;ctx.beginPath();ctx.moveTo(PX+(a.x-dist)*U-8*U,GY-a.y*U);ctx.lineTo(PX+(b.x-dist)*U-8*U,GY-b.y*U);ctx.stroke();}ctx.restore();}
  const sy=GY-P.py*U,ph=dist*.05;
  ctx.save();ctx.translate(PX,sy);ctx.scale(U,U);
  if(P.spin>0){ctx.translate(0,-25);ctx.rotate((1-P.spin)*Math.PI*2);ctx.translate(0,25);}
  ctx.strokeStyle='#7af6ff';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor='#3fe9ff';ctx.shadowBlur=14;
  const air=!P.gr,sw=air?.0:Math.sin(ph),sw2=air?0:Math.cos(ph);
  ctx.beginPath();
  // legs
  if(air){ctx.moveTo(0,-18);ctx.lineTo(9,-10);ctx.lineTo(2,-2);ctx.moveTo(0,-18);ctx.lineTo(-6,-8);ctx.lineTo(-13,-12);}
  else{ctx.moveTo(0,-18);ctx.lineTo(sw*9,-9);ctx.lineTo(sw*14+(sw2>0?4:0),0);ctx.moveTo(0,-18);ctx.lineTo(-sw*9,-9);ctx.lineTo(-sw*14+(sw2<0?4:0),0);}
  // body + arms
  ctx.moveTo(0,-18);ctx.lineTo(3,-36);
  ctx.moveTo(2,-32);ctx.lineTo(2-sw*10,-24);ctx.lineTo(6-sw*12,-18);
  ctx.moveTo(2,-32);ctx.lineTo(2+sw*10,-25);ctx.lineTo(8+sw*8,-22);
  ctx.stroke();
  ctx.fillStyle='#e8fdff';ctx.beginPath();ctx.arc(5,-44,7,0,7);ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle='#ff4fb0';ctx.fillRect(4,-47,8,3);
  ctx.restore();
}
function drawParts(){ctx.save();ctx.globalCompositeOperation='lighter';for(const p of parts){ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.c;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s);}ctx.restore();
  for(const f of floats){ctx.globalAlpha=Math.max(0,f.l/.7);text(f.s,f.x,f.y,16*U,'#ffe27a');}ctx.globalAlpha=1;}
function text(s,x,y,size,col,align,glow){ctx.font=`${size}px ${FONT}`;ctx.textAlign=align||'center';ctx.textBaseline='middle';if(glow){ctx.shadowColor=glow;ctx.shadowBlur=size*.5;}ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.shadowBlur=0;}
function fit(s,size,maxW){ctx.font=`${size}px ${FONT}`;const w=ctx.measureText(s).width;return w>maxW?size*maxW/w:size;}
function drawMute(){const s=34,x=W-s-10,y=10;ctx.save();ctx.fillStyle='rgba(0,0,0,.35)';rr(x,y,s,s,9);ctx.fill();ctx.fillStyle='#fff';ctx.strokeStyle='#fff';ctx.lineWidth=2.2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x+8,y+13);ctx.lineTo(x+13,y+13);ctx.lineTo(x+19,y+8);ctx.lineTo(x+19,y+26);ctx.lineTo(x+13,y+21);ctx.lineTo(x+8,y+21);ctx.closePath();ctx.fill();
  ctx.beginPath();if(muted){ctx.moveTo(x+22,y+13);ctx.lineTo(x+29,y+21);ctx.moveTo(x+29,y+13);ctx.lineTo(x+22,y+21);}else{ctx.arc(x+20,y+17,5,-.9,.9);ctx.moveTo(x+25.5,y+10);ctx.arc(x+20,y+17,9,-.9,.9);}ctx.stroke();ctx.restore();}
function overlay(a){ctx.fillStyle=`rgba(5,3,18,${a})`;ctx.fillRect(0,0,W,H);}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.save();
  if(shake>0)ctx.translate(rnd(-shake,shake)*U*.5,rnd(-shake,shake)*U*.5);
  sky();drawObs();drawPlayer();drawParts();ctx.restore();
  const m=Math.min(W,H),cx=W/2,pulse=.55+.45*Math.sin(t*4);
  if(state==='title'){
    overlay(.25);
    const ty=H*(W<H?.3:.3),s1=fit('GECE',Math.min(W*.2,H*.13),W*.85),s2=fit('KOŞUCUSU',s1,W*.88);
    text('GECE',cx,ty-s1*.55,s1,'#ffffff','center','#ff4fb0');
    text('KOŞUCUSU',cx,ty+s2*.55,s2,'#7af6ff','center','#3fe9ff');
    ctx.globalAlpha=pulse;text('Başlamak için dokun / tıkla',cx,ty+s2*1.6,Math.max(15,m*.042),'#ffe27a','center','#ff9f2a');ctx.globalAlpha=1;
    text('Zıpla: Dokun / Boşluk · Basılı tut: Yüksek · Havada: Çift zıplama',cx,ty+s2*1.6+Math.max(26,m*.07),fit('Zıpla: Dokun / Boşluk · Basılı tut: Yüksek · Havada: Çift zıplama',Math.max(11,m*.026),W*.92),'#c9b8ff');
    if(best>0)text('En iyi: '+best,cx,H*.93,Math.max(14,m*.035),'#ffffff');
  }else{
    text(String(score),18,30,Math.max(24,m*.06),'#ffffff','left','#ff4fb0');
    ctx.fillStyle='#ffd84d';ctx.beginPath();ctx.arc(26,30+Math.max(30,m*.065),7,0,7);ctx.fill();
    text('× '+coins,40,30+Math.max(30,m*.065),Math.max(15,m*.035),'#ffe27a','left');
    if(state==='play'&&paused){overlay(.55);text('Duraklatıldı',cx,H*.42,Math.max(26,m*.08),'#fff','center','#ff4fb0');ctx.globalAlpha=pulse;text('Devam etmek için dokun',cx,H*.52,Math.max(15,m*.04),'#ffe27a');ctx.globalAlpha=1;}
    if(state==='over'){
      overlay(Math.min(.6,overT*1.5));
      const s=fit('OYUN BİTTİ',Math.min(W*.14,H*.1),W*.86);
      text('OYUN BİTTİ',cx,H*.3,s,'#ff5fb5','center','#ff2a8a');
      text(String(score),cx,H*.43,Math.max(40,m*.13),'#ffffff','center','#7af6ff');
      text(newBest?'Yeni rekor!':'En iyi: '+best,cx,H*.53,Math.max(16,m*.045),newBest?'#ffe27a':'#c9b8ff');
      if(overT>.6){ctx.globalAlpha=pulse;text('Tekrar için dokun / tıkla',cx,H*.65,Math.max(15,m*.042),'#7af6ff');ctx.globalAlpha=1;}
    }
  }
  drawMute();
}
let last=performance.now();
function frame(now){let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;if(dt>.05)dt=.05;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
