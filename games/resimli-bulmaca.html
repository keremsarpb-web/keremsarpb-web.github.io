<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Resimli Bulmaca – KSB Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1b2a2f;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const ID='resimli-bulmaca',FF='Fredoka,"Trebuchet MS",Arial,sans-serif',cv=document.getElementById('c'),g=cv.getContext('2d');
let W=0,H=0,DPR=1,state='title',T=0,shake=0,P=[],muted=false,best=0,AC=null,BL='En iyi';
try{best=+localStorage.getItem('ksb-'+ID+'-best')||0;muted=localStorage.getItem('ksb-muted')==='1'}catch(e){}
function setBest(v){best=v;try{localStorage.setItem('ksb-'+ID+'-best',v)}catch(e){}}
function rs(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
addEventListener('resize',rs);rs();
function snd(f,d,t,v,f2){d=d||.12;if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);a.gain.setValueAtTime(v||.07,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,.22,'triangle'),i*110))}
function lose(){snd(300,.4,'sawtooth',.06,90)}
function txt(s,x,y,sz,col,al,w){g.font=(w||700)+' '+sz+'px '+FF;g.textAlign=al||'center';g.textBaseline='middle';g.fillStyle=col||'#fff';g.fillText(s,x,y)}
function fit(s,sz,mw){g.font='700 '+sz+'px '+FF;const w=g.measureText(s).width;return w>mw?sz*mw/w:sz}
function rr(x,y,w,h,r,f,s,lw){g.beginPath();g.roundRect(x,y,w,h,r);if(f){g.fillStyle=f;g.fill()}if(s){g.lineWidth=lw||2;g.strokeStyle=s;g.stroke()}}
function btn(b,s,col){rr(b[0],b[1],b[2],b[3],b[3]*.3,col);txt(s,b[0]+b[2]/2,b[1]+b[3]/2+1,fit(s,b[3]*.45,b[2]*.9),'#fff')}
function inb(x,y,b){return !!b&&x>=b[0]&&x<=b[0]+b[2]&&y>=b[1]&&y<=b[1]+b[3]}
function grad(a,b){const q=g.createLinearGradient(0,0,0,H);q.addColorStop(0,a);q.addColorStop(1,b);g.fillStyle=q;g.fillRect(0,0,W,H)}
function spark(x,y,c,n,sp){n=n||12;sp=sp||160;for(let i=0;i<n;i++){const a=Math.random()*6.283,s=30+Math.random()*sp;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.5,c})}}
function drawP(dt){for(const p of P){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=240*dt;p.l-=dt;g.globalAlpha=Math.max(0,Math.min(1,p.l*2));g.fillStyle=p.c;g.fillRect(p.x-2,p.y-2,4,4)}g.globalAlpha=1;P=P.filter(p=>p.l>0)}
function drawTitle(name,sub,c1,c2,deco,acc){grad(c1,c2);deco(T);const m=Math.min(W,H),s=fit(name,Math.min(W*.2,H*.14),W*.88);g.save();g.shadowColor=acc;g.shadowBlur=30;txt(name,W/2,H*.36,s,'#fff');g.restore();txt(sub,W/2,H*.36+s*.85,fit(sub,m*.055,W*.9),acc);const t='Başlamak için dokun / tıkla';g.globalAlpha=.65+.35*Math.sin(T*4);txt(t,W/2,H*.72,fit(t,m*.06,W*.9));g.globalAlpha=1;if(best)txt(BL+': '+best,W/2,H*.72+m*.09,m*.04,'#ffffffbb')}
function drawMute(){const x=W-24,y=24;g.globalAlpha=.85;g.fillStyle='#fff';g.beginPath();g.moveTo(x-9,y-4);g.lineTo(x-4,y-4);g.lineTo(x+1,y-9);g.lineTo(x+1,y+9);g.lineTo(x-4,y+4);g.lineTo(x-9,y+4);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();if(muted){g.moveTo(x+5,y-5);g.lineTo(x+12,y+5);g.moveTo(x+12,y-5);g.lineTo(x+5,y+5)}else{g.arc(x+1,y,6,-.9,.9);g.moveTo(x+1+10*Math.cos(-.9),y+10*Math.sin(-.9));g.arc(x+1,y,10,-.9,.9)}g.stroke();g.globalAlpha=1}
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
function togM(){muted=!muted;try{localStorage.setItem('ksb-muted',muted?'1':'0')}catch(e){}}
function move(){}function up(){}function key(){}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const[x,y]=pos(e);if(x>W-48&&y<48){togM();return}try{cv.setPointerCapture(e.pointerId)}catch(_){}snd(1,.01,'sine',.001);if(state==='title'){state='play';start();snd(600,.15,'triangle');return}down(x,y)});
cv.addEventListener('pointermove',e=>{const[x,y]=pos(e);if(state!=='title')move(x,y)});
cv.addEventListener('pointerup',e=>{const[x,y]=pos(e);if(state!=='title')up(x,y)});
cv.addEventListener('pointercancel',()=>{if(state!=='title')up(-1,-1)});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault();if(e.key==='m'||e.key==='M'){togM();return}if(state==='title'){if(e.key===' '||e.key==='Enter'){state='play';start()}return}key(e.key,e)});
let last=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min((ts-last)/1000||0,.05);last=ts;if(document.hidden)return;T+=dt;g.setTransform(DPR,0,0,DPR,0,0);g.save();if(shake>0){shake=Math.max(0,shake-dt*40);g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake)}frame(dt);g.restore();g.setTransform(DPR,0,0,DPR,0,0);drawP(dt);drawMute()}
requestAnimationFrame(loop);
BL='Çözülen resim';
const PIC=[['Kalp',['.#.#.','#####','#####','.###.','..#..']],['Ev',['..#..','.###.','#####','##.##','##.##']],['Yıldız',['..#..','#####','.###.','.#.#.','#...#']],
['Ağaç',['..##..','.####.','######','.####.','..##..','..##..']],['Kedi',['#.....#','##...##','#######','##.#.##','#######','.##.##.','..###..']],['Fincan',['.#.#.#.','#.#.#.#','.......','#######','#####.#','#####.#','.#####.']],
['Mantar',['..####..','.##..##.','########','#.####.#','########','...##...','...##...','..####..']],['Robot',['....#....','....#....','.#######.','.#.###.#.','.#######.','.#.....#.','.#######.','..#...#..','..##.##..']],
['Kelebek',['##......##','###....###','####..####','.########.','..######..','..######..','.########.','####..####','###....###','##......##']],['Elmas',['....##....','...####...','..######..','.########.','##########','##########','.########.','..######..','...####...','....##....']]];
const HU=[350,200,50,130,20,30,280,180,320,260];
let lv=0,n=0,sol=[],cur=[],rc=[],cc=[],xm=false,pd=null,won=false,pt=0,bt=[],geo={};
function runs(a){const r=[];let c=0;for(const v of a){if(v===1)c++;else if(c){r.push(c);c=0}}if(c)r.push(c);return r.length?r:[0]}
const eq=(a,b)=>a.length===b.length&&a.every((v,i)=>v===b[i]);
function load(i){lv=i;const rows=PIC[i][1];n=rows.length;sol=rows.map(s=>[...s].map(ch=>ch==='#'?1:0));cur=sol.map(r=>r.map(()=>0));rc=sol.map(r=>runs(r));cc=[...Array(n).keys()].map(c=>runs(sol.map(r=>r[c])));state='play';won=false;pt=0;pd=null}
function start(){load(Math.min(best,PIC.length-1))}
const rowOk=r=>eq(runs(cur[r]),rc[r]),colOk=c=>eq(runs(cur.map(r=>r[c])),cc[c]);
function cellAt(x,y){const c=Math.floor((x-geo.ox)/geo.cs),r=Math.floor((y-geo.oy)/geo.cs);return r<0||c<0||r>=n||c>=n?null:[r,c]}
function setc(r,c,v){cur[r][c]=v;snd(v===1?520:v===2?300:380,.05,'triangle')}
function apply(rc2){const[r,c]=rc2,v=cur[r][c];if(pd.target===0){if(v===pd.first)setc(r,c,0)}else if(v===0||v===pd.first)setc(r,c,pd.target)}
function down(x,y){
 if(won){if(inb(x,y,bt[0]))load(Math.min(lv+1,PIC.length-1));return}
 if(inb(x,y,bt[0])){xm=!xm;snd(500,.05);return}if(inb(x,y,bt[1])){load(lv);return}if(inb(x,y,bt[2])){if(lv>0)load(lv-1);return}if(inb(x,y,bt[3])){if(lv<Math.min(best,PIC.length-1))load(lv+1);return}
 const p=cellAt(x,y);if(!p||!cur||!cur[p[0]]||cur[p[0]][p[1]]===undefined)return;const first=cur[p[0]][p[1]],mark=xm?2:1;pd={r:p[0],c:p[1],first,target:first===mark?0:mark,t0:T,moved:false,lp:false}}
function move(x,y){if(!pd||pd.lp)return;const p=cellAt(x,y);if(!p)return;if(p[0]!==pd.r||p[1]!==pd.c){if(!pd.moved){pd.moved=true;apply([pd.r,pd.c])}pd.r=p[0];pd.c=p[1];apply(p)}}
function up(){if(pd&&!pd.moved&&!pd.lp&&!won)apply([pd.r,pd.c]);pd=null;chk()}
function chk(){if(won||!sol.length)return;if(cur.every((r,i)=>rowOk(i))&&cc.every((_,c)=>colOk(c))){won=true;if(lv+1>best)setBest(lv+1);win();for(let k=0;k<8;k++)spark(W*Math.random(),H*.5*Math.random()+80,'hsl('+(HU[lv]+k*20)+',80%,60%)',16,260)}}
function key(k){if(won&&(k==='Enter'||k===' '))load(Math.min(lv+1,PIC.length-1));else if(k==='x'||k==='X')xm=!xm;else if(k==='r'||k==='R')load(lv)}
function deco(t){for(let i=0;i<30;i++){const s=26+i%3*10,x=(i*97)%W,y=((i*151+t*14)%(H+60))-30;g.fillStyle='hsl('+(i*40)+',70%,60%)';g.globalAlpha=.25;g.fillRect(x,y,s,s)}g.globalAlpha=1}
function frame(dt){
 if(state==='title'){drawTitle('RESİMLİ BULMACA','Sayılara bak, resmi ortaya çıkar','#12333a','#1d5a5a',deco,'#ffd27a');return}
 grad('#12333a','#0f2226');
 if(state==='play'&&!won&&pd&&!pd.moved&&!pd.lp&&T-pd.t0>.45){pd.lp=true;const m=xm?1:2;const v=cur[pd.r][pd.c];setc(pd.r,pd.c,v===m?0:m);spark(geo.ox+(pd.c+.5)*geo.cs,geo.oy+(pd.r+.5)*geo.cs,'#fff',6)}
 if(!won)pt+=dt;
 const mr=Math.max(...rc.map(a=>a.length)),mc=Math.max(...cc.map(a=>a.length)),aw=W-16,ah=H-70-84,cs=Math.min(aw/(n+mr*.62),ah/(n+mc*.62),64);
 const bw=cs*(n+mr*.62),bh=cs*(n+mc*.62);geo.cs=cs;geo.ox=(W-bw)/2+mr*.62*cs;geo.oy=62+(ah-bh)/2+mc*.62*cs+8;
 const bwd=Math.min(W-16,520),b4=(bwd-24)/4,bx=(W-bwd)/2,by=H-62;bt=[0,1,2,3].map(i=>[bx+i*(b4+8),by,b4,50]);
 const mm=pt/60|0,ss=pt%60|0;
 txt('Seviye '+(lv+1)+'/'+PIC.length+' · '+n+'x'+n,12,30,Math.min(21,W*.048),'#cfeaea','left');txt((mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss,W-56,30,Math.min(21,W*.048),'#cfeaea','right');
 rr(geo.ox,geo.oy,n*cs,n*cs,6,'#f4ead0');
 for(let r=0;r<n;r++)for(let c=0;c<n;c++){const v=cur[r][c],x=geo.ox+c*cs,y=geo.oy+r*cs;
  if(v===1){rr(x+2,y+2,cs-4,cs-4,cs*.18,won?'hsl('+(HU[lv]+(r+c)*8)+',70%,52%)':'#24565e')}
  else if(v===2){g.strokeStyle='#c0504d';g.lineWidth=Math.max(2,cs*.08);g.lineCap='round';g.beginPath();g.moveTo(x+cs*.3,y+cs*.3);g.lineTo(x+cs*.7,y+cs*.7);g.moveTo(x+cs*.7,y+cs*.3);g.lineTo(x+cs*.3,y+cs*.7);g.stroke()}}
 g.strokeStyle='#8a7a55';for(let k=0;k<=n;k++){g.lineWidth=k%5===0?2.5:1;g.beginPath();g.moveTo(geo.ox+k*cs,geo.oy);g.lineTo(geo.ox+k*cs,geo.oy+n*cs);g.moveTo(geo.ox,geo.oy+k*cs);g.lineTo(geo.ox+n*cs,geo.oy+k*cs);g.stroke()}
 const fs=cs*.44;
 for(let r=0;r<n;r++){const ok=rowOk(r);rc[r].forEach((v,k)=>txt(v,geo.ox-(rc[r].length-k-.2)*.62*cs,geo.oy+(r+.5)*cs,fs,ok?'#5a7a7a':'#f4ead0'))}
 for(let c=0;c<n;c++){const ok=colOk(c);cc[c].forEach((v,k)=>txt(v,geo.ox+(c+.5)*cs,geo.oy-(cc[c].length-k-.2)*.62*cs+2,fs,ok?'#5a7a7a':'#f4ead0'))}
 btn(bt[0],xm?'Mod: X':'Mod: Dolu',xm?'#b3463f':'#2a7f8a');btn(bt[1],'Yeni oyun','#4a5a6a');btn(bt[2],'◀',lv>0?'#3a5a6e':'#243640');btn(bt[3],'▶',lv<Math.min(best,PIC.length-1)?'#3a5a6e':'#243640');
 if(won){g.fillStyle='#0008';g.fillRect(0,0,W,H);txt(PIC[lv][0]+'!',W/2,H*.22,fit(PIC[lv][0]+'!',Math.min(W*.14,80),W*.8),'#ffd27a');
  bt[0]=[W/2-110,H-130,220,56];btn(bt[0],lv+1>=PIC.length?'Son resim':'Sonraki resim','#2e9b5e')}}

</script></body></html>
