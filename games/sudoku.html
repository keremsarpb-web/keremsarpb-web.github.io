<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sudoku – KSB Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0d2447;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const ID='sudoku',FF='Fredoka,"Trebuchet MS",Arial,sans-serif',cv=document.getElementById('c'),g=cv.getContext('2d');
let W=0,H=0,DPR=1,state='title',T=0,shake=0,P=[],muted=false,best=0,AC=null,BL='En iyi';
try{best=+localStorage.getItem('ksb-'+ID+'-best')||0;muted=localStorage.getItem('ksb-muted')==='1'}catch(e){}
function setBest(v){best=v;try{localStorage.setItem('ksb-'+ID+'-best',v)}catch(e){}}
function rs(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
addEventListener('resize',rs);rs();
function snd(f,d,t,v,f2){d=d||.12;if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);a.gain.setValueAtTime(v||.07,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,.22,'triangle'),i*110))}
function lose(){snd(300,.4,'sawtooth',.06,90)}
function txt(s,x,y,sz,col,al,w){g.font=(w||700)+' '+sz+'px '+FF;g.textAlign=al||'center';g.textBaseline='middle';g.fillStyle=col||'#fff';g.fillText(s,x,y)}
function fit(s,sz,mw){g.font='700 '+sz+'px '+FF;const w=g.measureText(s).width;return w>mw?sz*mw/w:sz}
function rr(x,y,w,h,r,f,s,lw){g.beginPath();g.roundRect(x,y,w,h,r);if(f){g.fillStyle=f;g.fill()}if(s){g.lineWidth=lw||2;g.strokeStyle=s;g.stroke()}}
function btn(b,s,col){rr(b[0],b[1],b[2],b[3],b[3]*.3,col);txt(s,b[0]+b[2]/2,b[1]+b[3]/2+1,fit(s,b[3]*.45,b[2]*.9),'#fff')}
function inb(x,y,b){return !!b&&x>=b[0]&&x<=b[0]+b[2]&&y>=b[1]&&y<=b[1]+b[3]}
function grad(a,b){const q=g.createLinearGradient(0,0,0,H);q.addColorStop(0,a);q.addColorStop(1,b);g.fillStyle=q;g.fillRect(0,0,W,H)}
function spark(x,y,c,n,sp){n=n||12;sp=sp||160;for(let i=0;i<n;i++){const a=Math.random()*6.283,s=30+Math.random()*sp;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.5,c})}}
function drawP(dt){for(const p of P){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=240*dt;p.l-=dt;g.globalAlpha=Math.max(0,Math.min(1,p.l*2));g.fillStyle=p.c;g.fillRect(p.x-2,p.y-2,4,4)}g.globalAlpha=1;P=P.filter(p=>p.l>0)}
function drawTitle(name,sub,c1,c2,deco,acc){grad(c1,c2);deco(T);const m=Math.min(W,H),s=fit(name,Math.min(W*.2,H*.14),W*.88);g.save();g.shadowColor=acc;g.shadowBlur=30;txt(name,W/2,H*.36,s,'#fff');g.restore();txt(sub,W/2,H*.36+s*.85,fit(sub,m*.055,W*.9),acc);const t='Başlamak için dokun / tıkla';g.globalAlpha=.65+.35*Math.sin(T*4);txt(t,W/2,H*.72,fit(t,m*.06,W*.9));g.globalAlpha=1;if(best)txt(BL+': '+best,W/2,H*.72+m*.09,m*.04,'#ffffffbb')}
function drawMute(){const x=W-24,y=24;g.globalAlpha=.85;g.fillStyle='#fff';g.beginPath();g.moveTo(x-9,y-4);g.lineTo(x-4,y-4);g.lineTo(x+1,y-9);g.lineTo(x+1,y+9);g.lineTo(x-4,y+4);g.lineTo(x-9,y+4);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();if(muted){g.moveTo(x+5,y-5);g.lineTo(x+12,y+5);g.moveTo(x+12,y-5);g.lineTo(x+5,y+5)}else{g.arc(x+1,y,6,-.9,.9);g.moveTo(x+1+10*Math.cos(-.9),y+10*Math.sin(-.9));g.arc(x+1,y,10,-.9,.9)}g.stroke();g.globalAlpha=1}
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
function togM(){muted=!muted;try{localStorage.setItem('ksb-muted',muted?'1':'0')}catch(e){}}
function move(){}function up(){}function key(){}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const[x,y]=pos(e);if(x>W-48&&y<48){togM();return}try{cv.setPointerCapture(e.pointerId)}catch(_){}snd(1,.01,'sine',.001);if(state==='title'){state='play';start();snd(600,.15,'triangle');return}down(x,y)});
cv.addEventListener('pointermove',e=>{const[x,y]=pos(e);if(state!=='title')move(x,y)});
cv.addEventListener('pointerup',e=>{const[x,y]=pos(e);if(state!=='title')up(x,y)});
cv.addEventListener('pointercancel',()=>{if(state!=='title')up(-1,-1)});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault();if(e.key==='m'||e.key==='M'){togM();return}if(state==='title'){if(e.key===' '||e.key==='Enter'){state='play';start()}return}key(e.key,e)});
let last=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min((ts-last)/1000||0,.05);last=ts;if(document.hidden)return;T+=dt;g.setTransform(DPR,0,0,DPR,0,0);g.save();if(shake>0){shake=Math.max(0,shake-dt*40);g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake)}frame(dt);g.restore();g.setTransform(DPR,0,0,DPR,0,0);drawP(dt);drawMute()}
requestAnimationFrame(loop);
BL='Çözülen';
const DN=['Kolay','Orta','Zor'],CL=[40,32,26],DC=['#2e9b5e','#d08a1e','#c2463d'];
let diff=0,sol=[],cur=[],fixed=[],notes=[],sel=-1,nm=false,mist=0,pt=0,menuB=[];
function used(b,i){let m=0;const r=i/9|0,c=i%9,br=r-r%3,bc=c-c%3;for(let k=0;k<9;k++){m|=1<<b[r*9+k];m|=1<<b[k*9+c];m|=1<<b[(br+(k/3|0))*9+bc+k%3]}return m}
function cands(b,i){const m=used(b,i),a=[];for(let v=1;v<10;v++)if(!(m>>v&1))a.push(v);return a}
function sh(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function fill(b){const i=b.indexOf(0);if(i<0)return true;for(const v of sh(cands(b,i))){b[i]=v;if(fill(b))return true}b[i]=0;return false}
function cnt(b,lim){let bi=-1,bc=null,bn=10;for(let i=0;i<81;i++)if(!b[i]){const c=cands(b,i);if(c.length<bn){bn=c.length;bi=i;bc=c;if(bn<2)break}}if(bi<0)return 1;let n=0;for(const v of bc){b[bi]=v;n+=cnt(b,lim-n);if(n>=lim)break}b[bi]=0;return n}
function gen(d){const s=Array(81).fill(0);s.splice(0,9,...sh([1,2,3,4,5,6,7,8,9]));fill(s);const p=s.slice();let rem=81-CL[d];for(const i of sh([...Array(81).keys()])){if(rem<=0)break;const v=p[i];p[i]=0;if(cnt(p,2)===1)rem--;else p[i]=v}return[s,p]}
function newGame(d){diff=d;const[s,p]=gen(d);sol=s;cur=p.slice();fixed=p.map(v=>v>0);notes=Array(81).fill(0);sel=-1;mist=0;pt=0;nm=false;state='play'}
function start(){state='menu'}
function lay(){const o={};if(W<=H*1.15){const dh=Math.min(56,(W-16)/9*1.25),th=44,s=Math.min(W-16,H-60-dh-th-40);o.s=s;o.x=(W-s)/2;o.y=58;const dw=(W-16)/9;o.d=[...Array(9)].map((_,i)=>[8+i*dw+2,o.y+s+12,dw-4,dh]);const ty=o.y+s+12+dh+10,tw=(W-32)/3;o.t=[0,1,2].map(i=>[8+i*(tw+8),ty,tw,th])}else{const s=Math.min(H-80,W*.6),pw=Math.min(300,W*.35);o.s=s;o.x=Math.max(12,(W-s-pw-20)/2);o.y=(H-s)/2+14;const px=o.x+s+20,bw=(pw-16)/3,bh=bw*.85;o.d=[...Array(9)].map((_,i)=>[px+(i%3)*(bw+8),o.y+(i/3|0)*(bh+8),bw,bh]);const ty=o.y+3*(bh+8)+4;o.t=[0,1,2].map(i=>[px,ty+i*52,pw,44])}return o}
function deco(t){for(let i=0;i<28;i++){const x=(i*137.5)%W,y=((i*211+t*20*(1+i%3))%(H+60))-30;g.globalAlpha=.12+.08*(i%3);txt(String(1+i%9),x,y,30+i%4*14,'#8fd3ff')}g.globalAlpha=1}
function peers(i,j){const r=i/9|0,c=i%9,r2=j/9|0,c2=j%9;return r===r2||c===c2||((r/3|0)===(r2/3|0)&&(c/3|0)===(c2/3|0))}
function put(v){if(sel<0||fixed[sel]||state!=='play')return;if(!v){cur[sel]=0;notes[sel]=0;snd(300,.05);return}
 if(nm){if(cur[sel])return;notes[sel]^=1<<v;snd(500,.05);return}
 cur[sel]=v;notes[sel]=0;if(v!==sol[sel]){mist++;shake=8;lose()}else{snd(660,.08,'triangle');const o=lay(),cs=o.s/9;spark(o.x+(sel%9+.5)*cs,o.y+((sel/9|0)+.5)*cs,'#7fd0ff');for(let i=0;i<81;i++)if(peers(i,sel))notes[i]&=~(1<<v)}
 if(cur.every((x,i)=>x===sol[i])){state='win';setBest(best+1);win();for(let k=0;k<6;k++)spark(W*Math.random(),H*.4*Math.random()+60,'#ffd75e',14,260)}}
function frame(dt){
 if(state==='title'){drawTitle('SUDOKU','Sayı bulmacası','#0d2447','#1b4a7a',deco,'#7fd0ff');return}
 grad('#0d2447','#16396b');
 if(state==='menu'){deco(T);txt('Zorluk seç',W/2,H*.25,fit('Zorluk seç',Math.min(W*.12,70),W*.8));const bw=Math.min(300,W*.8),bh=Math.min(70,H*.1);menuB=[0,1,2].map(i=>[(W-bw)/2,H*.38+i*(bh+16),bw,bh]);menuB.forEach((b,i)=>btn(b,DN[i],DC[i]));txt(BL+': '+best,W/2,H*.38+3*(bh+16)+20,16,'#ffffffaa');return}
 if(state==='play')pt+=dt;
 const o=lay(),cs=o.s/9,sv=sel>=0?cur[sel]:0,mm=Math.floor(pt/60),ss=Math.floor(pt%60);
 txt(DN[diff]+'  '+(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss,Math.max(12,o.x),30,Math.min(22,W*.05),'#cfe6ff','left');
 txt('Hata: '+mist,Math.min(W-56,o.x+o.s),30,Math.min(22,W*.05),mist?'#ff8a8a':'#cfe6ff','right');
 rr(o.x-4,o.y-4,o.s+8,o.s+8,10,'#0a1a35');
 for(let i=0;i<81;i++){const r=i/9|0,c=i%9,x=o.x+c*cs,y=o.y+r*cs;let f='#f3f6fb';
  if(sel>=0){if(peers(i,sel))f='#d5e3f7';if(sv&&cur[i]===sv)f='#b9d4f7';if(i===sel)f='#8ec0fb'}
  g.fillStyle=f;g.fillRect(x,y,cs,cs);const v=cur[i];
  if(v){const bad=v!==sol[i];if(bad){g.fillStyle='#ff5a5a77';g.fillRect(x,y,cs,cs)}txt(v,x+cs/2,y+cs/2+1,cs*.62,bad?'#c01010':fixed[i]?'#13294b':'#1f6fd1')}
  else if(notes[i])for(let k=1;k<10;k++)if(notes[i]>>k&1)txt(k,x+cs*(.2+((k-1)%3)*.3),y+cs*(.2+((k-1)/3|0)*.3),cs*.24,'#5a6b86')}
 g.strokeStyle='#13294b';for(let k=0;k<=9;k++){g.lineWidth=k%3?1:3;g.beginPath();g.moveTo(o.x+k*cs,o.y);g.lineTo(o.x+k*cs,o.y+o.s);g.moveTo(o.x,o.y+k*cs);g.lineTo(o.x+o.s,o.y+k*cs);g.stroke()}
 const cn=Array(10).fill(0);cur.forEach((v,i)=>{if(v&&v===sol[i])cn[v]++});
 o.d.forEach((b,i)=>{const done=cn[i+1]>=9;rr(b[0],b[1],b[2],b[3],8,done?'#1a2c4d':nm?'#4a3f8f':'#2a5db0');txt(i+1,b[0]+b[2]/2,b[1]+b[3]/2+1,b[3]*.6,done?'#56688a':'#fff')});
 btn(o.t[0],nm?'Notlar: AÇIK':'Notlar',nm?'#8a5fd6':'#3a4a6e');btn(o.t[1],'Sil','#3a4a6e');btn(o.t[2],'Yeni oyun','#2e7d6b');
 if(state==='win'){g.fillStyle='#000a';g.fillRect(0,0,W,H);txt('Tebrikler!',W/2,H*.38,fit('Tebrikler!',Math.min(W*.14,90),W*.8),'#ffd75e');txt('Süre '+mm+':'+(ss<10?'0':'')+ss+' · Hata '+mist,W/2,H*.38+60,22);txt(BL+': '+best,W/2,H*.38+92,18,'#cfe6ffcc');btn([W/2-100,H*.38+120,200,54],'Yeni oyun','#2e9b5e')}}
function down(x,y){
 if(state==='menu'){menuB.forEach((b,i)=>{if(inb(x,y,b)){newGame(i);snd(500,.1,'triangle')}});return}
 if(state==='win'){state='menu';return}
 const o=lay();
 if(x>=o.x&&x<o.x+o.s&&y>=o.y&&y<o.y+o.s){sel=((y-o.y)/(o.s/9)|0)*9+((x-o.x)/(o.s/9)|0);snd(420,.04);return}
 o.d.forEach((b,i)=>{if(inb(x,y,b))put(i+1)});
 if(inb(x,y,o.t[0])){nm=!nm;snd(500,.05)}if(inb(x,y,o.t[1]))put(0);if(inb(x,y,o.t[2]))state='menu'}
function key(k){
 if(state==='menu'){if('123'.includes(k)&&k)newGame(+k-1);return}
 if(state==='win'){if(k==='Enter'||k===' ')state='menu';return}
 if(k>='1'&&k<='9')put(+k);else if(k==='Backspace'||k==='Delete'||k==='0')put(0);else if(k==='n'||k==='N')nm=!nm;
 else if(k.startsWith('Arrow')){if(sel<0)sel=40;else{const r=sel/9|0,c=sel%9;sel=k==='ArrowUp'?(r+8)%9*9+c:k==='ArrowDown'?(r+1)%9*9+c:k==='ArrowLeft'?r*9+(c+8)%9:r*9+(c+1)%9}}}

</script></body></html>
