<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dama - KSB Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
'use strict';
const cv=document.getElementById('c'),g=cv.getContext('2d'),FF='"Baloo 2","Trebuchet MS",system-ui,sans-serif';
let W=1,H=1,D=1,btns=[],PT=[],shake=0,state='title',T=0,best=0,muted=false,AC=null,mode=1,KEY='',last=0;
const R=Math.random,ri=n=>Math.floor(R()*n),PI=Math.PI;
function rs(){D=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*D);cv.height=Math.round(H*D);g.setTransform(D,0,0,D,0,0);if(typeof lay=='function')lay()}
addEventListener('resize',rs);
function ld(){KEY='ksb-'+ID+'-best';try{best=+localStorage.getItem(KEY)||0}catch(e){}}
function sv(s){if(s>best){best=s;try{localStorage.setItem(KEY,String(best))}catch(e){}}}
function snd(f,d=.12,t='sine',v=.07,s=0){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(muted)return;const o=AC.createOscillator(),a=AC.createGain(),n=AC.currentTime+s;o.type=t;o.frequency.setValueAtTime(f,n);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d+.02)}catch(e){}}
const jingle=(a,t='triangle')=>a.forEach((f,i)=>snd(f,.2,t,.07,i*.1));
function rr(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function tx(s,x,y,sz,c='#fff',al='center',w='700'){g.font=w+' '+sz+'px '+FF;g.textAlign=al;g.textBaseline='middle';g.fillStyle=c;g.fillText(s,x,y)}
function btn(x,y,w,h,s,fn,c='#f2b632',tc='#241600'){if(fn)btns.push({x,y,w,h,fn});g.save();if(!fn)g.globalAlpha=.4;rr(x,y,w,h,h*.28);g.fillStyle=c;g.fill();tx(s,x+w/2,y+h/2+1,Math.min(h*.5,(w-14)/(s.length*.5)),tc);g.restore()}
function burst(x,y,c,n=14){for(let i=0;i<n;i++)PT.push({x,y,vx:(R()-.5)*300,vy:(R()-.8)*280,l:1,c,s:2+R()*3})}
function topbar(st){btn(8,8,92,32,'Yeni oyun',()=>go(mode),'rgba(255,255,255,.18)','#fff');tx('Rekor '+best,W-52,24,15,'#fff','right');tx(st,W/2,62,Math.min(19,W/18))}
function ovr(t,s,c='#ffd24a'){g.fillStyle='rgba(5,8,20,.74)';g.fillRect(0,0,W,H);const z=Math.min(W*.11,64);tx(t,W/2,H*.36,z,c);tx(s,W/2,H*.36+z*.95,Math.min(W*.05,26));btn(W/2-110,H*.52,220,56,'Yeni oyun',()=>go(mode));tx('Tekrar için dokun / tıkla',W/2,H*.52+84,16,'#ccd')}
function title(){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,BG[0]);gr.addColorStop(1,BG[1]);g.fillStyle=gr;g.fillRect(0,0,W,H);deco();
const s=Math.min(W/(Math.max(...NAME.map(l=>l.length))*.62),H*.11,120);NAME.forEach((l,i)=>{const y=H*.27+(i-(NAME.length-1)/2)*s*1.08;tx(l,W/2+3,y+5,s,'rgba(0,0,0,.45)');tx(l,W/2,y,s,'#fff')});
const y2=H*.27+NAME.length*s*.62+10;tx(SUB,W/2,y2,Math.min(W*.05,24),ACC);
const py=TWO?H*.58:H*.66;g.globalAlpha=.65+.35*Math.sin(T*4);tx('Başlamak için dokun / tıkla',W/2,py,Math.min(W*.06,28));g.globalAlpha=1;
if(TWO){btn(W/2-130,H*.66,260,52,'Bilgisayara karşı',()=>go(1));btn(W/2-130,H*.66+64,260,52,'2 Oyuncu',()=>go(2),'rgba(255,255,255,.2)','#fff')}}
function speaker(){const x=W-26,y=24;g.save();g.fillStyle='rgba(255,255,255,.85)';g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=2;g.beginPath();g.moveTo(x-9,y-4);g.lineTo(x-4,y-4);g.lineTo(x+2,y-9);g.lineTo(x+2,y+9);g.lineTo(x-4,y+4);g.lineTo(x-9,y+4);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(x+5,y-5);g.lineTo(x+12,y+5);g.moveTo(x+12,y-5);g.lineTo(x+5,y+5)}else{g.arc(x+2,y,7,-.9,.9);g.moveTo(x+11,y-8);g.arc(x+2,y,12,-.9,.9)}g.stroke();g.restore()}
function pt(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const[x,y]=pt(e);try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)()}catch(_){}
if(Math.hypot(x-(W-26),y-24)<22&&state!='title'||Math.hypot(x-(W-26),y-24)<22){muted=!muted;return}
for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){snd(520,.06);b.fn();return}}
if(state=='title')go(1);else if(state=='over')go(mode);else if(typeof dn=='function')dn(x,y,e)});
addEventListener('pointermove',e=>{if(typeof mv=='function'){const[x,y]=pt(e);mv(x,y)}});
addEventListener('pointerup',e=>{if(typeof up=='function'){const[x,y]=pt(e);up(x,y)}});
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
if(e.key=='m'||e.key=='M'){muted=!muted;return}
if(e.key==' '||e.key=='Enter'){if(state=='title'){go(1);return}if(state=='over'){go(mode);return}}
if(typeof kd=='function')kd(e.key,e)});
function fr(t){requestAnimationFrame(fr);if(document.hidden){last=0;return}const dt=Math.min(.05,last?(t-last)/1000:.016);last=t;T+=dt;btns=[];
PT=PT.filter(p=>(p.l-=dt*1.6)>0);PT.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt});
g.save();if(shake>0){shake=Math.max(0,shake-dt*40);g.translate((R()-.5)*shake,(R()-.5)*shake)}
if(state=='title')title();else{upd(dt);draw()}
PT.forEach(p=>{g.globalAlpha=Math.max(0,p.l);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.s,0,7);g.fill()});g.globalAlpha=1;g.restore();speaker()}
document.addEventListener('visibilitychange',()=>{last=0});

const ID='dama',NAME=['DAMA'],SUB='Türk daması · uçan dama',BG=['#6b3d1a','#1d0e06'],ACC='#ffd9a0',TWO=true;
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]],side=p=>p%2?1:2,inb=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
let B,turn=1,sel=null,legal=[],quiet=0,lm=null,winner=0,aiT=0,msg='',msgT=0,sq=40,bx=0,by=0;
function lay(){const S=Math.min(W-12,H-150);sq=S/8;bx=(W-S)/2;by=Math.max(80,(H+64-S)/2)}
function go(m){mode=m||mode;B=Array.from({length:8},()=>Array(8).fill(0));for(let c=0;c<8;c++){B[1][c]=2;B[2][c]=2;B[5][c]=1;B[6][c]=1}
turn=1;sel=null;quiet=0;lm=null;aiT=0;msg='';legal=gen(B,1);state='play';lay();jingle([330,440])}
function caps(b,r,c,p,done,out,path){const s=side(p),k=p>2,fw=s==1?-1:1;let any=false;const dn_=(r1,c1)=>done.some(d=>d[0]==r1&&d[1]==c1);
for(const[dr,dc]of DIRS){if(!k&&dr==-fw)continue;
if(!k){const r1=r+dr,c1=c+dc,r2=r1+dr,c2=c1+dc;if(!inb(r2,c2))continue;const q=b[r1][c1];if(q&&side(q)!=s&&!dn_(r1,c1)&&b[r2][c2]==0){any=true;caps(b,r2,c2,p,[...done,[r1,c1]],out,[...path,[r2,c2]])}}
else{let r1=r+dr,c1=c+dc;while(inb(r1,c1)&&b[r1][c1]==0){r1+=dr;c1+=dc}if(!inb(r1,c1))continue;const q=b[r1][c1];if(side(q)==s||dn_(r1,c1))continue;
let r2=r1+dr,c2=c1+dc;while(inb(r2,c2)&&b[r2][c2]==0){any=true;caps(b,r2,c2,p,[...done,[r1,c1]],out,[...path,[r2,c2]]);r2+=dr;c2+=dc}}}
if(!any&&done.length)out.push({path,caps:done})}
function gen(b,s){const cp=[],mv=[],fw=s==1?-1:1;
for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(!p||side(p)!=s)continue;b[r][c]=0;const out=[];caps(b,r,c,p,[],out,[]);b[r][c]=p;out.forEach(o=>cp.push({fr:[r,c],to:o.path[o.path.length-1],caps:o.caps}))}
if(cp.length){const m=Math.max(...cp.map(x=>x.caps.length));return cp.filter(x=>x.caps.length==m)}
for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(!p||side(p)!=s)continue;
for(const[dr,dc]of DIRS){if(p<3){if(dr==-fw)continue;if(inb(r+dr,c+dc)&&!b[r+dr][c+dc])mv.push({fr:[r,c],to:[r+dr,c+dc],caps:[]})}
else{let r1=r+dr,c1=c+dc;while(inb(r1,c1)&&!b[r1][c1]){mv.push({fr:[r,c],to:[r1,c1],caps:[]});r1+=dr;c1+=dc}}}}
return mv}
function apply(b,m){const n=b.map(r=>r.slice());let p=n[m.fr[0]][m.fr[1]];n[m.fr[0]][m.fr[1]]=0;m.caps.forEach(([r,c])=>n[r][c]=0);const[r,c]=m.to;if(p<3&&(p==1?r==0:r==7))p+=2;n[r][c]=p;return n}
function ev(b){let s=0;for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(!p)continue;const v=p>2?330:100+(p==1?6-r:r-1)*4;s+=side(p)==1?v:-v}return s}
function mm(b,s,d,al,be){const ms=gen(b,s);if(!ms.length)return s==1?-9000-d:9000+d;if(d==0)return ev(b);
if(s==1){let v=-1e9;for(const m of ms){v=Math.max(v,mm(apply(b,m),2,d-1,al,be));al=Math.max(al,v);if(al>=be)break}return v}
let v=1e9;for(const m of ms){v=Math.min(v,mm(apply(b,m),1,d-1,al,be));be=Math.min(be,v);if(al>=be)break}return v}
function ai(){const cnt=B.flat().filter(x=>x).length,dep=cnt<=10?4:3;let bm=null,bv=1e9;const ms=legal.slice().sort(()=>R()-.5);
for(const m of ms){const v=mm(apply(B,m),1,dep-1,-1e9,1e9)+R()*3;if(v<bv){bv=v;bm=m}}play(bm)}
function play(m){const p=B[m.fr[0]][m.fr[1]];m.caps.forEach(([r,c])=>burst(bx+(c+.5)*sq,by+(r+.5)*sq,'#ffd9a0',10));
if(m.caps.length){snd(200,.14,'square',.06);shake=Math.min(14,m.caps.length*4)}else snd(380,.06,'triangle');
B=apply(B,m);quiet=m.caps.length||p<3?0:quiet+1;lm=m;sel=null;turn=3-turn;legal=gen(B,turn);aiT=0;
if(!legal.length){state='over';winner=3-turn}else if(quiet>=60){state='over';winner=0}
if(state=='over'){if(winner==1&&mode==1)sv(best+1);jingle(winner?[523,659,784,1047]:[400,400]);burst(W/2,H/2,'#ffd24a',40)}}
function dn(x,y){if(turn==2&&mode==1)return;const c=Math.floor((x-bx)/sq),r=Math.floor((y-by)/sq);if(!inb(r,c))return;
if(sel){const m=legal.find(m=>m.fr[0]==sel[0]&&m.fr[1]==sel[1]&&m.to[0]==r&&m.to[1]==c);if(m){play(m);return}}
if(legal.some(m=>m.fr[0]==r&&m.fr[1]==c)){sel=[r,c];snd(600,.04)}else{sel=null;if(B[r][c]&&side(B[r][c])==turn&&legal.some(m=>m.caps.length)){msg='Yakalama zorunlu!';msgT=1.6}}}
function upd(dt){if(msgT>0)msgT-=dt;if(state=='play'&&mode==1&&turn==2){aiT+=dt;if(aiT>.7)ai()}}
function piece(p,x,y,rad,pulse){const w=side(p)==1;g.save();g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=6;g.shadowOffsetY=3;
const gr=g.createRadialGradient(x-rad*.3,y-rad*.3,rad*.1,x,y,rad);gr.addColorStop(0,w?'#fffaf0':'#6a4a42');gr.addColorStop(1,w?'#d8c39a':'#1c100d');
g.fillStyle=gr;g.beginPath();g.arc(x,y,rad,0,7);g.fill();g.restore();g.strokeStyle=w?'#a8905e':'#000';g.lineWidth=2;g.beginPath();g.arc(x,y,rad*.72,0,7);g.stroke();
if(p>2)tx('♛',x,y+1,rad*1.15,'#e8a800');if(pulse){g.strokeStyle='rgba(255,230,120,'+(.5+.4*Math.sin(T*6))+')';g.lineWidth=3;g.beginPath();g.arc(x,y,rad+3,0,7);g.stroke()}}
function draw(){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#4a2a12');gr.addColorStop(1,'#1d0e06');g.fillStyle=gr;g.fillRect(0,0,W,H);
const n1=B.flat().filter(p=>p&&side(p)==1).length,n2=B.flat().filter(p=>p&&side(p)==2).length;
topbar(msgT>0?msg:state=='over'?'Oyun bitti':(mode==2?(turn==1?'Sıra: Beyaz':'Sıra: Siyah'):(turn==1?'Sıra sende':'Bilgisayar düşünüyor...'))+' · '+n1+' - '+n2);
g.fillStyle='#2a1508';g.fillRect(bx-6,by-6,sq*8+12,sq*8+12);
for(let r=0;r<8;r++)for(let c=0;c<8;c++){g.fillStyle=(r+c)%2?'#b98652':'#d1a06a';g.fillRect(bx+c*sq,by+r*sq,sq,sq)}
if(lm){g.fillStyle='rgba(255,230,100,.35)';g.fillRect(bx+lm.fr[1]*sq,by+lm.fr[0]*sq,sq,sq);g.fillRect(bx+lm.to[1]*sq,by+lm.to[0]*sq,sq,sq)}
const fm=new Set(legal.map(m=>m.fr[0]*8+m.fr[1]));
for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=B[r][c];if(!p)continue;const s=sel&&sel[0]==r&&sel[1]==c;piece(p,bx+(c+.5)*sq,by+(r+.5)*sq,sq*.4,state=='play'&&!sel&&fm.has(r*8+c)&&!(mode==1&&turn==2)&&legal.some(m=>m.caps.length)&&false);
if(s){g.strokeStyle='#4af';g.lineWidth=4;g.beginPath();g.arc(bx+(c+.5)*sq,by+(r+.5)*sq,sq*.46,0,7);g.stroke()}}
if(sel)legal.forEach(m=>{if(m.fr[0]==sel[0]&&m.fr[1]==sel[1]){g.fillStyle=m.caps.length?'rgba(255,80,60,.8)':'rgba(70,200,255,.8)';g.beginPath();g.arc(bx+(m.to[1]+.5)*sq,by+(m.to[0]+.5)*sq,sq*.16,0,7);g.fill()}});
else if(state=='play'&&!(mode==1&&turn==2))fm.forEach(i=>{g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=2;g.strokeRect(bx+(i%8)*sq+3,by+Math.floor(i/8)*sq+3,sq-6,sq-6)});
if(state=='over')ovr(winner==0?'Berabere':mode==1?(winner==1?'Kazandın!':'Bilgisayar kazandı'):(winner==1?'Beyaz kazandı':'Siyah kazandı'),mode==1?'Galibiyet rekoru: '+best:'İyi oyundu!')}
function deco(){g.globalAlpha=.16;for(let r=0;r<12;r++)for(let c=0;c<12;c++){g.fillStyle=(r+c)%2?'#fff':'#000';g.fillRect(c*H/9-((T*20)%(H/9)),r*H/9,H/9,H/9)}g.globalAlpha=1;
for(let i=0;i<9;i++){const x=(i*173+T*16)%(W+100)-50,y=H*.8+Math.sin(T+i)*18-(i%3)*H*.07;piece(i%4==0?3+i%2:1+i%2,x,y,26+i%3*8)}}

ld();rs();requestAnimationFrame(fr);
</script></body></html>
