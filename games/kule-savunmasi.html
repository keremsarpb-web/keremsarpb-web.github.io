<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kule Savunması – KSB Games</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const ID='kule-savunmasi',NAME='Kule Savunması',SUB='15 dalga boyunca yolu koru',COL='#ffb74d';
const cv=document.getElementById('c'),g=cv.getContext('2d');let W=0,H=0;
function rs(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
let best=0,muted=false,AC=null,state='title',score=0,shake=0,T=0,st=0,parts=[],omsg='',ohead='Oyun Bitti',fmt=v=>Math.floor(v);
try{best=+localStorage.getItem('ksb-'+ID+'-best')||0}catch(e){}
function end(m,h){saveBest();state='over';st=0;omsg=m||'';ohead=h||'Oyun Bitti'}
function saveBest(){score=Math.floor(score);if(score>best){best=score;try{localStorage.setItem('ksb-'+ID+'-best',String(best))}catch(e){}}}
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
function snd(f,d=.1,ty='square',v=.05,s=0){if(muted||!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),n+d);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function burst(x,y,c,n=10,sp=150){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.4+Math.random()*.4,c,r:2+Math.random()*3})}}
function updParts(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.l-=dt}parts=parts.filter(p=>p.l>0)}
function drawParts(){for(const p of parts){g.globalAlpha=Math.min(1,p.l*2);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.fill()}g.globalAlpha=1}
function txt(s,x,y,sz,c='#fff',al='center'){g.font='900 '+sz+'px "Trebuchet MS",Arial,sans-serif';g.textAlign=al;g.textBaseline='middle';g.fillStyle=c;g.fillText(s,x,y)}
function icon(){g.save();g.translate(W-28,28);g.globalAlpha=.85;g.fillStyle=g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(-9,-4);g.lineTo(-4,-4);g.lineTo(2,-9);g.lineTo(2,9);g.lineTo(-4,4);g.lineTo(-9,4);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(6,-5);g.lineTo(14,5);g.moveTo(14,-5);g.lineTo(6,5)}else{g.arc(3,0,6,-1,1);g.moveTo(3+11*Math.cos(-1),11*Math.sin(-1));g.arc(3,0,11,-1,1)}g.stroke();g.restore()}
function title(){g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,0,W,H);const ws=NAME.split(' '),port=W<H*.85,ls=port?ws:[NAME];let sz=Math.min(port?W*.2:W*.08,H*.13);const fit=()=>g.font='900 '+sz+'px "Trebuchet MS",Arial';fit();while(Math.max(...ls.map(l=>g.measureText(l).width))>W*.9){sz*=.92;fit()}const y0=H*.32-(ls.length-1)*sz*.55;g.shadowColor=COL;g.shadowBlur=30;ls.forEach((l,i)=>txt(l,W/2,y0+i*sz*1.1,sz));g.shadowBlur=0;const ss=Math.min(W*.05,26);txt(SUB,W/2,y0+ls.length*sz*1.1+ss*.4,ss,COL);g.globalAlpha=.65+.35*Math.sin(T*4);txt('Başlamak için dokun / tıkla',W/2,H*.7,Math.min(W*.065,30));g.globalAlpha=1;if(best)txt('En iyi: '+fmt(best),W/2,H*.78,Math.min(W*.05,22),COL);icon()}
function over(){g.fillStyle='rgba(0,0,0,.62)';g.fillRect(0,0,W,H);const u=Math.min(W,H*.8);txt(ohead,W/2,H*.28,Math.min(u*.14,70));if(omsg)txt(omsg,W/2,H*.37,Math.min(u*.055,26),'#ccc');txt(fmt(score),W/2,H*.47,Math.min(u*.18,90),COL);txt(score>=best&&score>0?'Yeni rekor!':'En iyi: '+fmt(best),W/2,H*.57,Math.min(u*.06,28),'#ffd54a');if(st>.7){g.globalAlpha=.65+.35*Math.sin(T*4);txt('Tekrar için dokun / tıkla',W/2,H*.7,Math.min(u*.06,28));g.globalAlpha=1}icon()}
const P={x:0,y:0,down:false},keys={};
function pos(e){const r=cv.getBoundingClientRect();P.x=e.clientX-r.left;P.y=e.clientY-r.top}
function gate(){if(state=='title'&&st>.15){start();return true}if(state=='over'&&st>.7){start();return true}return state!='play'}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();pos(e);if(P.x>W-56&&P.y<56){muted=!muted;return}if(gate())return;P.down=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}typeof onDown=='function'&&onDown()});
cv.addEventListener('pointermove',e=>{pos(e);typeof onMove=='function'&&onMove()});
const pu=()=>{if(P.down){P.down=false;typeof onUp=='function'&&onUp()}};
addEventListener('pointerup',pu);addEventListener('pointercancel',pu);
addEventListener('keydown',e=>{ac();const k=e.key;if(k.startsWith('Arrow')||k==' ')e.preventDefault();if(k=='m'||k=='M'){muted=!muted;return}if(state!='play'){if(k==' '||k=='Enter')gate();return}if(!keys[k])typeof onKey=='function'&&onKey(k);keys[k]=1});
addEventListener('keyup',e=>keys[e.key]=0);cv.addEventListener('contextmenu',e=>e.preventDefault());
let last=performance.now();
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.033,(t-last)/1000||0);last=t;if(document.hidden)return;T+=dt;st+=dt;if(state=='play')upd(dt);updParts(dt);g.save();if(shake>.1){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=Math.pow(.02,dt)}else shake=0;draw();g.restore();if(state=='title')title();else if(state=='over')over()}
requestAnimationFrame(loop);
/* ---- oyun: mantık portre hücre uzayında, çizim yönelime göre dönüştürülür ---- */
const CW=40,TOP=48,BOT=84,PC=[[-1,2],[7,2],[7,5],[2,5],[2,8],[7,8],[7,11],[2,11],[2,14],[10,14]];
const SL=[[3,3],[6,3],[8,4],[1,6],[4,6],[6,6],[8,7],[4,9],[6,9],[1,9],[3,12],[5,12],[8,12],[1,13],[6,13],[8,15]];
const TY=[{n:'Okçu',c:50,rg:2.6,rt:1.7,dm:6,col:'#6bd96b'},{n:'Top',c:90,rg:2.3,rt:.7,dm:20,col:'#ff9248'},{n:'Buz',c:70,rg:2.2,rt:1,dm:3,col:'#5ad8ff'}];
let land=false,sc=1,ox=0,oy=0,PL=0;const SEG=[];
for(let i=0;i<PC.length-1;i++){const L=Math.abs(PC[i+1][0]-PC[i][0])+Math.abs(PC[i+1][1]-PC[i][1]);SEG.push(L);PL+=L}
let gold,lives,wave,cd,q,sq,es,sh,tw,sel,kills;
function lay(){land=W>H*1.1;const cols=land?16:10,rows=land?10:16;sc=Math.min(W/(cols*CW),(H-TOP-BOT)/(rows*CW));ox=(W-cols*CW*sc)/2;oy=TOP+(H-TOP-BOT-rows*CW*sc)/2}
function wp(c,r){const a=land?r:c,b=land?c:r;return[ox+(a+.5)*CW*sc,oy+(b+.5)*CW*sc]}
function pc(d){for(let i=0;i<SEG.length;i++){if(d<=SEG[i]||i==SEG.length-1){const f=Math.min(1,d/SEG[i]),a=PC[i],b=PC[i+1];return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]}d-=SEG[i]}}
function stat(t){const b=TY[t.ty];return{dm:b.dm*(1+.65*(t.lv-1)),rg:b.rg+.25*(t.lv-1),rt:b.rt*(1+.1*(t.lv-1))}}
function start(){gold=130;lives=20;wave=0;cd=6;q=[];sq=0;es=[];sh=[];tw=SL.map(()=>null);sel=-1;kills=0;score=0;parts=[];state='play';st=0;lay()}
function nextW(){wave++;if(wave>1)gold+=15+wave*2;q=[];const n=6+wave*2,hp=16+wave*wave*3.4;for(let i=0;i<n;i++){const ty=wave>=3&&i%5==4?2:wave>=2&&i%3==2?1:0;q.push(ty==2?{ty,hp:hp*3.2,sp:.75}:ty==1?{ty,hp:hp*.6,sp:2}:{ty,hp,sp:1.15})}sq=0;snd(300,.3,'sawtooth',.06,200)}
function btn(i,n){const m=10,w=(W-m*(n+1))/n;return{x:m+i*(w+m),y:H-BOT+10,w,h:BOT-20}}
function onDown(){lay();const px=P.x,py=P.y;
 if(sel>=0&&py>H-BOT){const t=tw[sel];if(!t){for(let i=0;i<3;i++){const r=btn(i,3);if(px>r.x&&px<r.x+r.w&&py>r.y&&py<r.y+r.h&&gold>=TY[i].c){gold-=TY[i].c;tw[sel]={ty:i,lv:1,cd:0,inv:TY[i].c};snd(500,.15,'triangle',.07,300);const[x,y]=wp(...SL[sel]);burst(x,y,TY[i].col,12);sel=-1}}}
  else for(let i=0;i<2;i++){const r=btn(i,2);if(px>r.x&&px<r.x+r.w&&py>r.y&&py<r.y+r.h){if(i==0&&t.lv<3){const c=Math.round(TY[t.ty].c*t.lv*.8);if(gold>=c){gold-=c;t.inv+=c;t.lv++;snd(700,.15,'triangle',.07,300)}}if(i==1){gold+=Math.floor(t.inv*.6);tw[sel]=null;sel=-1;snd(250,.15)}}}return}
 if(py<TOP&&px>W*.45&&px<W-60){if(!q.length&&!es.length&&wave<15)cd=0;return}
 let bi=-1,bd=Math.max(26,CW*sc*.7);SL.forEach((s,i)=>{const[x,y]=wp(...s),d=Math.hypot(x-px,y-py);if(d<bd){bd=d;bi=i}});sel=bi==sel?-1:bi}
function onKey(k){if(k==' '&&!q.length&&!es.length&&wave<15)cd=0}
function upd(dt){
 if(!q.length&&!es.length){if(wave>=15){score=kills*10+lives*50+500;end('Tüm dalgalar püskürtüldü!','Zafer!');return}cd-=dt;if(cd<=0){nextW();cd=7}}
 if(q.length){sq-=dt;if(sq<=0){const e=q.shift();es.push({d:0,hp:e.hp,mh:e.hp,sp:e.sp,ty:e.ty,sl:0});sq=Math.max(.35,.85-wave*.03)}}
 for(const e of es){e.sl-=dt;e.d+=e.sp*(e.sl>0?.5:1)*dt;if(e.d>=PL){e.hp=-1;e.leak=1;lives--;shake=12;snd(120,.3,'sawtooth',.1,-60)}}
 tw.forEach((t,i)=>{if(!t)return;t.cd-=dt;if(t.cd>0)return;const s=stat(t),[sx,sy]=SL[i];let tg=null;for(const e of es){if(e.hp<=0)continue;const[ex,ey]=pc(e.d);if(Math.hypot(ex-sx,ey-sy)<=s.rg&&(!tg||e.d>tg.d))tg=e}if(tg){sh.push({x:sx,y:sy,tg,ty:t.ty,dm:s.dm});t.cd=1/s.rt;snd([600,150,900][t.ty],.07,['square','sawtooth','triangle'][t.ty],.03,-100)}});
 for(const b of sh){if(b.tg.hp<=0){b.dead=1;continue}const[tx,ty]=pc(b.tg.d),dx=tx-b.x,dy=ty-b.y,d=Math.hypot(dx,dy),m=9*dt;if(d<=m+.1){b.dead=1;if(b.ty==1){for(const e of es){const[ex,ey]=pc(e.d);if(e.hp>0&&Math.hypot(ex-tx,ey-ty)<1)e.hp-=b.dm}const[x,y]=wp(tx,ty);burst(x,y,'#ff9248',10);shake=Math.max(shake,3)}else{b.tg.hp-=b.dm;if(b.ty==2)b.tg.sl=2}}else{b.x+=dx/d*m;b.y+=dy/d*m}}
 sh=sh.filter(b=>!b.dead);
 for(const e of es)if(e.hp<=0&&!e.leak){kills++;gold+=4+Math.floor(wave/3);score=kills*10;const[x,y]=wp(...pc(e.d));burst(x,y,'#ffd54a',8)}
 es=es.filter(e=>e.hp>0);
 if(lives<=0){score=kills*10;end('Dalga '+wave+' / 15 — kale düştü')}}
function draw(){lay();
 g.fillStyle='#2e5a3a';g.fillRect(0,0,W,H);g.fillStyle='rgba(255,255,255,.04)';for(let i=0;i<40;i++)g.fillRect((i*97)%W,(i*181)%H,14,6);
 g.lineCap='round';g.lineJoin='round';g.beginPath();PC.forEach((p,i)=>{const[x,y]=wp(...p);i?g.lineTo(x,y):g.moveTo(x,y)});g.strokeStyle='#7a5a3a';g.lineWidth=CW*sc*.95;g.stroke();g.strokeStyle='#b8925f';g.lineWidth=CW*sc*.75;g.stroke();
 const live=state!='title',R=CW*sc;
 SL.forEach((s,i)=>{const[x,y]=wp(...s),t=live&&tw[i];g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.arc(x,y,R*.42,0,6.283);g.fill();if(live&&sel==i){g.strokeStyle='#fff';g.lineWidth=3;g.stroke();const rg=t?stat(t).rg:2.4;g.globalAlpha=.15;g.fillStyle='#fff';g.beginPath();g.arc(x,y,rg*R,0,6.283);g.fill();g.globalAlpha=1}
  if(t){const c=TY[t.ty].col;g.fillStyle='#444';g.beginPath();g.arc(x,y,R*.38,0,6.283);g.fill();g.fillStyle=c;if(t.ty==0){g.beginPath();g.moveTo(x,y-R*.34);g.lineTo(x+R*.3,y+R*.24);g.lineTo(x-R*.3,y+R*.24);g.fill()}else if(t.ty==1){g.beginPath();g.arc(x,y,R*.26,0,6.283);g.fill();g.fillStyle='#222';g.fillRect(x-R*.07,y-R*.4,R*.14,R*.4)}else{g.beginPath();g.moveTo(x,y-R*.34);g.lineTo(x+R*.28,y);g.lineTo(x,y+R*.34);g.lineTo(x-R*.28,y);g.fill()}for(let k=0;k<t.lv;k++){g.fillStyle='#ffd54a';g.beginPath();g.arc(x-(t.lv-1)*R*.07+k*R*.14,y+R*.45,R*.045,0,6.283);g.fill()}}});
 if(live){for(const e of es){const[x,y]=wp(...pc(e.d)),r=R*(e.ty==2?.3:e.ty==1?.19:.23);g.fillStyle=e.sl>0?'#7fd4ff':['#e0544f','#f2b134','#8a5cd6'][e.ty];g.beginPath();g.arc(x,y,r,0,6.283);g.fill();g.strokeStyle='#222';g.lineWidth=2;g.stroke();g.fillStyle='#000';g.fillRect(x-r,y-r-7,r*2,4);g.fillStyle='#6bd96b';g.fillRect(x-r,y-r-7,r*2*Math.max(0,e.hp/e.mh),4)}
  for(const b of sh){const[x,y]=wp(b.x,b.y);g.fillStyle=TY[b.ty].col;g.beginPath();g.arc(x,y,b.ty==1?6:3.5,0,6.283);g.fill()}}
 drawParts();
 g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,0,W,TOP);
 if(live){txt('Altın: '+gold,10,TOP/2,18,'#ffd54a','left');txt('Can: '+lives,10+Math.min(W*.27,110),TOP/2,18,'#ff7b7b','left');
  const nb=!q.length&&!es.length&&wave<15;txt(wave?'Dalga '+wave+'/15':'Hazırlan',W*.45,TOP/2,16,'#fff','left');if(nb)txt('Sıradaki: '+Math.ceil(cd)+'sn ▶',W-66,TOP/2,15,COL,'right');icon();
  g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,H-BOT,W,BOT);
  if(sel>=0){const t=tw[sel];if(!t)for(let i=0;i<3;i++){const r=btn(i,3),ok=gold>=TY[i].c;g.fillStyle=ok?TY[i].col:'#555';g.beginPath();g.roundRect(r.x,r.y,r.w,r.h,10);g.fill();txt(TY[i].n,r.x+r.w/2,r.y+r.h*.35,Math.min(r.w*.2,18),'#111');txt(TY[i].c+' altın',r.x+r.w/2,r.y+r.h*.7,Math.min(r.w*.16,14),'#111')}
   else for(let i=0;i<2;i++){const r=btn(i,2),c=Math.round(TY[t.ty].c*t.lv*.8),ok=i==1||(t.lv<3&&gold>=c);g.fillStyle=ok?(i?'#e57373':'#6bd96b'):'#555';g.beginPath();g.roundRect(r.x,r.y,r.w,r.h,10);g.fill();txt(i?'Sat +'+Math.floor(t.inv*.6):t.lv<3?'Yükselt '+c:'Maks. seviye',r.x+r.w/2,r.y+r.h/2,Math.min(r.w*.1,18),'#111')}}
  else txt('Boş yuvaya dokun: kule kur / yükselt',W/2,H-BOT/2,Math.min(W*.04,16),'#ddd')}}
</script></body></html>
