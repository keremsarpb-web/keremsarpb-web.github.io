<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Uzay Savunması — KSB Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0c0220;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const ID = 'uzay-savunmasi', FONT = '"Russo One",system-ui,sans-serif';
const C_SHIP = '#3ef0ff', C_EN = '#ff8a3d', C_EN2 = '#ff3d6e', C_BOSS = '#e040ff', C_GOLD = '#ffd84a';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 1, H = 1, DPR = 1;

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
};
let best = parseInt(LS.get('ksb-' + ID + '-best', '0'), 10) || 0;
let muted = LS.get('ksb-' + ID + '-mute', '0') === '1';
let AC = null, master = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended' && !document.hidden) AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = muted ? 0 : 0.4; master.connect(AC.destination); } catch (e) { AC = null; }
}
function tone(f, d, type, v, f2, delay) {
  if (!AC || muted) return;
  const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v || 0.15, t); g.gain.exponentialRampToValueAtTime(0.0008, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.03);
}
function noise(d, v, fc) {
  if (!AC || muted) return;
  const n = Math.max(1, AC.sampleRate * d | 0), b = AC.createBuffer(1, n, AC.sampleRate), a = b.getChannelData(0);
  for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const s = AC.createBufferSource(); s.buffer = b;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fc || 1200;
  const g = AC.createGain(); g.gain.value = v || 0.3; s.connect(f); f.connect(g); g.connect(master); s.start();
}
function toggleMute() { muted = !muted; LS.set('ksb-' + ID + '-mute', muted ? '1' : '0'); if (master) master.gain.value = muted ? 0 : 0.4; }
function inMute(x, y) { return x > W - 60 && y < 60; }
function drawMute(col) {
  const x = W - 46, y = 14;
  ctx.save(); ctx.globalAlpha = 0.85; ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x + 4, y + 11); ctx.lineTo(x + 10, y + 11); ctx.lineTo(x + 17, y + 4); ctx.lineTo(x + 17, y + 28);
  ctx.lineTo(x + 10, y + 21); ctx.lineTo(x + 4, y + 21); ctx.closePath(); ctx.fill(); ctx.beginPath();
  if (muted) { ctx.moveTo(x + 22, y + 11); ctx.lineTo(x + 31, y + 21); ctx.moveTo(x + 31, y + 11); ctx.lineTo(x + 22, y + 21); }
  else { ctx.arc(x + 18, y + 16, 6, -0.8, 0.8); ctx.moveTo(x + 18 + 11 * Math.cos(-0.8), y + 16 + 11 * Math.sin(-0.8)); ctx.arc(x + 18, y + 16, 11, -0.8, 0.8); }
  ctx.stroke(); ctx.restore();
}
const rr = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function setFont(size) { ctx.font = Math.round(size) + 'px ' + FONT; }
function glowText(text, x, y, size, col, glow, maxW) {
  ctx.save(); setFont(size); const w = ctx.measureText(text).width;
  if (maxW && w > maxW) { size *= maxW / w; setFont(size); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.shadowColor = glow || col; ctx.shadowBlur = size * 0.45; ctx.fillStyle = col;
  ctx.fillText(text, x, y); ctx.shadowBlur = 0; ctx.fillText(text, x, y); ctx.restore();
}

// ---------- layout ----------
const LW = 420;
let S = 1, FX = 0, LH = 800;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const FW = Math.min(W, H * 0.7); S = FW / LW; LH = H / S; FX = (W - FW) / 2;
  if (ship) ship.y = clamp(ship.y, LH * 0.3, LH - 30);
}
window.addEventListener('resize', resize);
const stars = []; for (let i = 0; i < 140; i++) stars.push({ x: Math.random(), y: Math.random(), z: rr(0.2, 1) });

// ---------- state ----------
let state = 'title', paused = false, T = 0, overT = 0, newBest = false;
let ship = null, bullets = [], ebul = [], enemies = [], pups = [], parts = [], pops = [];
let score = 0, wave = 0, toSpawn = 0, spawnT = 0, banner = 0, bannerTxt = '', fireT = 0;
let shake = 0, flash = 0, target = null, keys = {}, bossRef = null;

function newGame() {
  ship = { x: LW / 2, y: LH - 90, hp: 3, inv: 1.5, power: 1, shield: 0, tilt: 0 };
  bullets = []; ebul = []; enemies = []; pups = []; parts = []; pops = [];
  score = 0; wave = 0; newBest = false; target = null; bossRef = null; paused = false;
  state = 'play'; nextWave();
  tone(330, 0.12, 'sawtooth', 0.1, 660); tone(660, 0.2, 'sawtooth', 0.1, 1320, 0.1);
}
function nextWave() {
  wave++;
  if (wave % 5 === 0) {
    toSpawn = 0; bannerTxt = 'UYARI: ANA GEMİ!'; banner = 2.2;
    bossRef = { type: 'boss', x: LW / 2, y: -80, r: 50, hp: 70 + wave * 14, max: 70 + wave * 14, t: 0, fa: 0, fb: 0, hit: 0, score: 500 + wave * 20 };
    enemies.push(bossRef); tone(110, 0.8, 'sawtooth', 0.15, 80); tone(110, 0.8, 'sawtooth', 0.15, 80, 0.9);
  } else {
    toSpawn = Math.min(34, 6 + wave * 2); spawnT = 1.2; bannerTxt = 'DALGA ' + wave; banner = 1.6;
    tone(523, 0.1, 'triangle', 0.12); tone(784, 0.18, 'triangle', 0.12, 0, 0.1);
  }
}
function spawnEnemy() {
  const k = Math.random(), x = rr(30, LW - 30);
  let e;
  if (wave >= 3 && k < 0.22) e = { type: 'diver', r: 13, hp: 2, score: 20, vy: 70, phase: 0 };
  else if (wave >= 2 && k < 0.5) e = { type: 'shooter', r: 16, hp: 3 + Math.floor(wave / 3), score: 25, stopY: rr(LH * 0.12, LH * 0.35), dir: Math.random() < 0.5 ? -1 : 1, fire: rr(0.8, 1.8) };
  else e = { type: 'grunt', r: 14, hp: 1 + Math.floor(wave / 4), score: 10, vy: 70 + wave * 5, x0: x, amp: rr(20, 60) };
  e.x = x; e.y = -30; e.t = rr(0, 6); e.hit = 0; e.max = e.hp; enemies.push(e);
}
function burst(x, y, n, col, sp, sz, life) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = rr(sp * 0.2, sp), l = rr(0.3, life || 0.8);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: l, max: l, col, sz: rr(sz * 0.4, sz) }); }
}
function boom(x, y, big, col) {
  burst(x, y, big ? 60 : 18, col, big ? 380 : 200, big ? 6 : 4, big ? 1.2 : 0.7);
  burst(x, y, big ? 20 : 6, '#fff', big ? 200 : 120, 3);
  parts.push({ ring: true, x, y, life: 0.4, max: 0.4, r: big ? 120 : 40, col });
  noise(big ? 0.9 : 0.25, big ? 0.45 : 0.2, big ? 600 : 1500); shake = Math.max(shake, big ? 18 : 4);
}
function fireE(x, y, ang, sp, col) { ebul.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r: 5, col: col || C_EN2 }); }
function hurtShip() {
  if (ship.inv > 0) return;
  if (ship.shield > 0) { ship.shield = 0; ship.inv = 1; burst(ship.x, ship.y, 20, C_SHIP, 220, 4); tone(880, 0.2, 'sine', 0.15, 220); return; }
  ship.hp--; ship.inv = 1.6; shake = 14; flash = 1; ship.power = Math.max(1, ship.power - 1);
  noise(0.4, 0.35, 900); tone(160, 0.3, 'sawtooth', 0.15, 60);
  if (ship.hp <= 0) {
    boom(ship.x, ship.y, true, C_SHIP); state = 'over'; overT = 0;
    if (score > best) { best = score; newBest = true; LS.set('ksb-' + ID + '-best', best); }
  }
}
function killEnemy(e) {
  e.dead = true; score += e.score; pops.push({ x: e.x, y: e.y, t: 0, txt: '+' + e.score });
  if (e.type === 'boss') {
    boom(e.x, e.y, true, C_BOSS); boom(e.x - 30, e.y + 10, false, C_GOLD); boom(e.x + 30, e.y - 10, false, C_GOLD);
    pups.push({ x: e.x - 30, y: e.y, t: 'P' }, { x: e.x + 30, y: e.y, t: Math.random() < 0.5 ? 'H' : 'S' }); bossRef = null; flash = 0.8;
  } else {
    boom(e.x, e.y, false, e.type === 'grunt' ? C_EN : C_EN2); tone(rr(140, 220), 0.12, 'square', 0.08, 60);
    if (Math.random() < 0.08) { const k = Math.random(); pups.push({ x: e.x, y: e.y, t: k < 0.55 ? 'P' : k < 0.8 ? 'S' : 'H' }); }
  }
}

// ---------- update ----------
function update(dt) {
  T += dt;
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; if (!p.ring) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; } p.life -= dt; if (p.life <= 0) parts.splice(i, 1); }
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > 0.8) pops.splice(i, 1); }
  shake = Math.max(0, shake - dt * 40); flash = Math.max(0, flash - dt * 3);
  if (state === 'over') { overT += dt; updateBullets(dt); return; }
  if (state !== 'play') return;
  banner = Math.max(0, banner - dt);
  // ship movement
  const kx = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0), ky = (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0);
  const ox = ship.x;
  if (kx || ky) { target = null; ship.x += kx * 380 * dt; ship.y += ky * 380 * dt; }
  else if (target) { const k = Math.min(1, dt * 16); ship.x += (target.x - ship.x) * k; ship.y += (target.y - ship.y) * k; }
  ship.x = clamp(ship.x, 18, LW - 18); ship.y = clamp(ship.y, LH * 0.3, LH - 30);
  ship.tilt += (clamp((ship.x - ox) / Math.max(dt, 0.001) / 600, -1, 1) - ship.tilt) * Math.min(1, dt * 10);
  ship.inv = Math.max(0, ship.inv - dt);
  // auto-fire
  fireT -= dt;
  if (fireT <= 0) {
    fireT = 0.13; const p = ship.power, sp = -780;
    const shots = p === 1 ? [[0, 0]] : p === 2 ? [[-7, 0], [7, 0]] : p === 3 ? [[0, 0], [-10, -0.12], [10, 0.12]] : [[-6, 0], [6, 0], [-12, -0.15], [12, 0.15], [0, 0]];
    for (const [dx, a] of shots) bullets.push({ x: ship.x + dx, y: ship.y - 18, vx: Math.sin(a) * -sp, vy: sp * Math.cos(a) });
    tone(1100, 0.04, 'square', 0.03, 700);
  }
  // spawning / waves
  if (toSpawn > 0) { spawnT -= dt; if (spawnT <= 0) { spawnEnemy(); toSpawn--; spawnT = Math.max(0.22, 0.8 - wave * 0.04) * rr(0.6, 1.3); } }
  else if (!enemies.length) nextWave();
  // enemies
  for (const e of enemies) {
    e.t += dt; e.hit = Math.max(0, e.hit - dt * 8);
    if (e.type === 'grunt') { e.y += e.vy * dt; e.x = clamp(e.x0 + Math.sin(e.t * 2) * e.amp, 14, LW - 14); }
    else if (e.type === 'shooter') {
      if (e.y < e.stopY) e.y += 120 * dt; else { e.x += e.dir * (50 + wave * 3) * dt; if (e.x < 20 || e.x > LW - 20) e.dir *= -1; e.y += 6 * dt; }
      e.fire -= dt; if (e.fire <= 0 && e.y > 0) { e.fire = Math.max(0.7, 1.8 - wave * 0.06); fireE(e.x, e.y + 10, Math.atan2(ship.y - e.y, ship.x - e.x), 200 + wave * 6); tone(500, 0.06, 'triangle', 0.05, 300); }
    } else if (e.type === 'diver') {
      if (e.phase === 0) { e.y += e.vy * dt; if (e.y > LH * 0.18) { e.phase = 1; e.wait = 0.6; } }
      else if (e.phase === 1) { e.wait -= dt; if (e.wait <= 0) { e.phase = 2; const a = Math.atan2(ship.y - e.y, ship.x - e.x); e.vx = Math.cos(a) * 340; e.vy = Math.sin(a) * 340; tone(700, 0.25, 'sawtooth', 0.05, 200); } }
      else { e.x += e.vx * dt; e.y += e.vy * dt; e.vx *= 1 + dt * 0.5; e.vy *= 1 + dt * 0.5; }
    } else if (e.type === 'boss') {
      if (e.y < LH * 0.2) e.y += 60 * dt;
      else {
        e.x = LW / 2 + Math.sin(e.t * 0.7) * LW * 0.3;
        e.fa -= dt; e.fb -= dt;
        const rage = e.hp < e.max / 2 ? 1.5 : 1;
        if (e.fa <= 0) { e.fa = 2.2 / rage; const n = 14 + Math.floor(wave / 5) * 2, o = e.t; for (let i = 0; i < n; i++) fireE(e.x, e.y, o + i * Math.PI * 2 / n, 150, C_BOSS); tone(200, 0.3, 'sawtooth', 0.08, 100); }
        if (e.fb <= 0) { e.fb = 0.9 / rage; const a = Math.atan2(ship.y - e.y, ship.x - e.x); for (const d of [-0.2, 0, 0.2]) fireE(e.x, e.y + 30, a + d, 240, C_GOLD); }
      }
    }
    if (e.y > LH + 40 || e.x < -60 || e.x > LW + 60) e.dead = true;
    if (Math.hypot(e.x - ship.x, e.y - ship.y) < e.r + 12) { if (e.type !== 'boss') { e.hp = 0; killEnemy(e); } hurtShip(); if (state !== 'play') return; }
  }
  updateBullets(dt);
  // power-ups
  for (const p of pups) {
    p.y += 90 * dt; p.x += Math.sin(T * 3 + p.y * 0.02) * 20 * dt;
    if (Math.hypot(p.x - ship.x, p.y - ship.y) < 30) {
      p.dead = true; tone(660, 0.08, 'triangle', 0.14); tone(990, 0.08, 'triangle', 0.14, 0, 0.07); tone(1320, 0.12, 'triangle', 0.14, 0, 0.14);
      if (p.t === 'P') { ship.power = Math.min(4, ship.power + 1); pops.push({ x: p.x, y: p.y, t: 0, txt: 'GÜÇ!', col: C_GOLD }); }
      else if (p.t === 'S') { ship.shield = 1; pops.push({ x: p.x, y: p.y, t: 0, txt: 'KALKAN', col: C_SHIP }); }
      else { ship.hp = Math.min(5, ship.hp + 1); pops.push({ x: p.x, y: p.y, t: 0, txt: '+CAN', col: '#ff5a8a' }); }
    }
    if (p.y > LH + 20) p.dead = true;
  }
  pups = pups.filter(p => !p.dead); enemies = enemies.filter(e => !e.dead);
}
function updateBullets(dt) {
  for (const b of bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; if (b.y < -20 || b.x < -20 || b.x > LW + 20) b.dead = true;
    if (state !== 'play') continue;
    for (const e of enemies) if (!e.dead && Math.abs(b.x - e.x) < e.r + 3 && Math.abs(b.y - e.y) < e.r + 8) {
      b.dead = true; e.hp--; e.hit = 1; burst(b.x, b.y, 3, '#bff', 120, 2, 0.3);
      if (e.type === 'boss') { score += 1; if (Math.random() < 0.3) tone(300, 0.03, 'square', 0.04); }
      if (e.hp <= 0) killEnemy(e);
      break;
    }
  }
  for (const b of ebul) {
    b.x += b.vx * dt; b.y += b.vy * dt; if (b.y < -30 || b.y > LH + 30 || b.x < -30 || b.x > LW + 30) b.dead = true;
    if (state === 'play' && ship.inv <= 0 && Math.hypot(b.x - ship.x, b.y - ship.y) < b.r + 8) { b.dead = true; hurtShip(); }
  }
  bullets = bullets.filter(b => !b.dead); ebul = ebul.filter(b => !b.dead);
}

// ---------- draw ----------
function drawSpace(speed) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#12032b'); g.addColorStop(0.5, '#0c0220'); g.addColorStop(1, '#22063a');
  ctx.fillStyle = g; ctx.fillRect(-30, -30, W + 60, H + 60);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const neb = [[0.2, 0.25, '#7a1fff'], [0.85, 0.6, '#ff2d95'], [0.4, 0.9, '#2d6bff']];
  for (const [nx, ny, c] of neb) { const x = nx * W + Math.sin(T * 0.1 + nx * 9) * 30, y = ny * H, r = Math.max(W, H) * 0.45;
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, c + '33'); rg.addColorStop(1, c + '00'); ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H); }
  for (const s of stars) {
    const y = (s.y * H + T * speed * s.z * 260) % H, len = s.z * speed * 6 + 1;
    ctx.globalAlpha = 0.3 + s.z * 0.6; ctx.fillStyle = s.z > 0.8 ? '#bdf6ff' : '#fff'; ctx.fillRect(s.x * W, y, s.z * 1.8, len * s.z * 2 + 1);
  }
  ctx.restore();
}
function drawShip(x, y, tilt, sc) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sc * (1 - Math.abs(tilt) * 0.25), sc);
  ctx.globalCompositeOperation = 'lighter';
  const fl = 14 + Math.random() * 10;
  const fg = ctx.createLinearGradient(0, 10, 0, 10 + fl); fg.addColorStop(0, '#fff'); fg.addColorStop(0.3, '#3ef0ff'); fg.addColorStop(1, 'rgba(62,240,255,0)');
  ctx.fillStyle = fg; ctx.beginPath(); ctx.moveTo(-6, 10); ctx.lineTo(0, 10 + fl); ctx.lineTo(6, 10); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowColor = C_SHIP; ctx.shadowBlur = 18; ctx.fillStyle = '#0b2a40'; ctx.strokeStyle = C_SHIP; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(8, -4); ctx.lineTo(20, 8); ctx.lineTo(20, 14); ctx.lineTo(6, 10); ctx.lineTo(0, 14); ctx.lineTo(-6, 10); ctx.lineTo(-20, 14); ctx.lineTo(-20, 8); ctx.lineTo(-8, -4); ctx.closePath();
  ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
  ctx.fillStyle = '#c9fbff'; ctx.beginPath(); ctx.ellipse(0, -5, 3.5, 7, 0, 0, 7); ctx.fill();
  ctx.restore();
}
function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  const white = e.hit > 0.3;
  if (e.type === 'grunt') {
    ctx.rotate(Math.sin(e.t * 2) * 0.3); ctx.fillStyle = white ? '#fff' : C_EN; ctx.shadowColor = C_EN; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.moveTo(0, 14); ctx.lineTo(14, -6); ctx.lineTo(7, -12); ctx.lineTo(0, -6); ctx.lineTo(-7, -12); ctx.lineTo(-14, -6); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = '#2a0610'; ctx.fillRect(-5, -2, 3, 3); ctx.fillRect(2, -2, 3, 3);
  } else if (e.type === 'shooter') {
    ctx.rotate(e.t); ctx.strokeStyle = white ? '#fff' : C_EN2; ctx.lineWidth = 3; ctx.shadowColor = C_EN2; ctx.shadowBlur = 14; ctx.fillStyle = '#3a0820';
    ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; ctx.lineTo(Math.cos(a) * 16, Math.sin(a) * 16); } ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = white ? '#fff' : '#ffb0c8'; ctx.beginPath(); ctx.arc(0, 0, 5 + Math.sin(e.t * 6), 0, 7); ctx.fill();
  } else if (e.type === 'diver') {
    const a = e.phase === 2 ? Math.atan2(e.vy, e.vx) - Math.PI / 2 : 0; ctx.rotate(a);
    ctx.fillStyle = white ? '#fff' : '#ff6ad5'; ctx.shadowColor = '#ff6ad5'; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.moveTo(0, 16); ctx.lineTo(9, -10); ctx.lineTo(0, -4); ctx.lineTo(-9, -10); ctx.closePath(); ctx.fill();
    if (e.phase === 1) { ctx.strokeStyle = '#ff6ad5'; ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.arc(0, 0, 18 + Math.sin(T * 30) * 3, 0, 7); ctx.stroke(); }
  } else {
    ctx.shadowColor = C_BOSS; ctx.shadowBlur = 30;
    ctx.strokeStyle = C_BOSS; ctx.lineWidth = 3; ctx.globalAlpha = 0.7;
    ctx.beginPath(); ctx.arc(0, 0, 62, e.t, e.t + 4.5); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, 70, -e.t * 1.3, -e.t * 1.3 + 3.5); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillStyle = white ? '#fff' : '#3b0a52'; ctx.beginPath();
    ctx.moveTo(0, 50); ctx.lineTo(48, 10); ctx.lineTo(60, -20); ctx.lineTo(24, -36); ctx.lineTo(0, -24); ctx.lineTo(-24, -36); ctx.lineTo(-60, -20); ctx.lineTo(-48, 10); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = e.hp < e.max / 2 ? '#ff3d6e' : C_GOLD; ctx.beginPath(); ctx.arc(0, 4, 13 + Math.sin(T * 8) * 2, 0, 7); ctx.fill();
  }
  ctx.restore();
}
function drawField() {
  ctx.save(); ctx.translate(FX, 0); ctx.scale(S, S);
  if (W > LW * S + 4) { ctx.strokeStyle = 'rgba(62,240,255,0.18)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, LH); ctx.moveTo(LW, 0); ctx.lineTo(LW, LH); ctx.stroke(); }
  for (const p of pups) {
    const col = p.t === 'P' ? C_GOLD : p.t === 'S' ? C_SHIP : '#ff5a8a';
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(T * 2); ctx.shadowColor = col; ctx.shadowBlur = 16; ctx.strokeStyle = col; ctx.lineWidth = 2.5;
    ctx.strokeRect(-11, -11, 22, 22); ctx.rotate(-T * 2); ctx.shadowBlur = 0; ctx.fillStyle = col; setFont(14); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(p.t === 'P' ? 'G' : p.t === 'S' ? 'K' : '+', 0, 1); ctx.restore();
  }
  for (const e of enemies) drawEnemy(e);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(62,240,255,0.35)'; for (const b of bullets) ctx.fillRect(b.x - 3, b.y - 10, 6, 20);
  ctx.fillStyle = '#eaffff'; for (const b of bullets) ctx.fillRect(b.x - 1, b.y - 8, 2, 16);
  for (const b of ebul) { ctx.fillStyle = b.col; ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 2, 0, 7); ctx.fill(); ctx.globalAlpha = 1; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.6, 0, 7); ctx.fill(); }
  for (const p of parts) {
    const k = Math.max(0, p.life / p.max);
    if (p.ring) { ctx.globalAlpha = k; ctx.strokeStyle = p.col; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 - k) + 5, 0, 7); ctx.stroke(); }
    else { ctx.globalAlpha = k; ctx.fillStyle = p.col; ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz); }
  }
  ctx.restore();
  if (state === 'play' && (ship.inv <= 0 || Math.sin(T * 40) > 0)) {
    drawShip(ship.x, ship.y, ship.tilt, 1);
    if (ship.shield) { ctx.save(); ctx.strokeStyle = C_SHIP; ctx.globalAlpha = 0.5 + 0.3 * Math.sin(T * 6); ctx.lineWidth = 2; ctx.shadowColor = C_SHIP; ctx.shadowBlur = 14; ctx.beginPath(); ctx.arc(ship.x, ship.y, 30, 0, 7); ctx.stroke(); ctx.restore(); }
  }
  for (const p of pops) { ctx.save(); ctx.globalAlpha = 1 - p.t / 0.8; setFont(15); ctx.textAlign = 'center'; ctx.fillStyle = p.col || '#fff'; ctx.fillText(p.txt, p.x, p.y - p.t * 40); ctx.restore(); }
  // boss bar
  if (bossRef && !bossRef.dead) { ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(40, 80, LW - 80, 6); ctx.fillStyle = C_BOSS; ctx.fillRect(40, 80, (LW - 80) * Math.max(0, bossRef.hp / bossRef.max), 6); }
  if (banner > 0 && state === 'play') { ctx.save(); ctx.globalAlpha = Math.min(1, banner * 2); glowText(bannerTxt, LW / 2, LH * 0.42, 36, '#fff', bannerTxt.startsWith('UYARI') ? C_EN2 : C_SHIP, LW * 0.9); ctx.restore(); }
  ctx.restore();
}
function drawHud() {
  ctx.save(); ctx.textBaseline = 'middle';
  setFont(26); ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.shadowColor = C_SHIP; ctx.shadowBlur = 10; ctx.fillText(score, 16, 28); ctx.shadowBlur = 0;
  setFont(13); ctx.fillStyle = 'rgba(190,240,255,0.75)'; ctx.fillText('DALGA ' + wave + '   EN İYİ ' + Math.max(best, score), 16, 54);
  for (let i = 0; i < ship.hp; i++) { const x = W - 76 - i * 22, y = 28; ctx.fillStyle = '#ff5a8a'; ctx.beginPath(); ctx.moveTo(x, y + 7); ctx.bezierCurveTo(x - 12, y - 2, x - 6, y - 10, x, y - 4); ctx.bezierCurveTo(x + 6, y - 10, x + 12, y - 2, x, y + 7); ctx.fill(); }
  ctx.restore();
}
function overlay(title, lines, hint) {
  ctx.save(); ctx.fillStyle = 'rgba(12,2,32,0.7)'; ctx.fillRect(-30, -30, W + 60, H + 60); ctx.restore();
  const s = Math.min(W * 0.12, H * 0.09, 84);
  glowText(title, W / 2, H * 0.36, s, '#fff', C_BOSS, W * 0.88);
  lines.forEach((l, i) => glowText(l[0], W / 2, H * 0.36 + s * 1.1 + i * s * 0.6, s * 0.4, l[1], l[1], W * 0.85));
  if (hint) { ctx.save(); ctx.globalAlpha = 0.55 + 0.45 * Math.sin(T * 4); glowText(hint, W / 2, H * 0.72, Math.min(W * 0.05, 24), '#fff', C_SHIP, W * 0.88); ctx.restore(); }
}
function drawTitle() {
  drawSpace(1.6);
  const u = Math.min(W, H) / 400;
  // a formation of enemies drifting + the hero ship firing
  for (let i = 0; i < 7; i++) { const e = { type: i % 3 ? 'grunt' : 'shooter', t: T + i, hit: 0, x: 0, y: 0 };
    ctx.save(); ctx.translate(W / 2 + (i - 3) * 52 * u + Math.sin(T) * 20 * u, H * 0.15 + Math.sin(T * 2 + i) * 8 * u); ctx.scale(u, u); drawEnemy(e); ctx.restore(); }
  const sx = W / 2 + Math.sin(T * 1.1) * W * 0.18, sy = H * 0.8;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(62,240,255,0.6)';
  for (let i = 0; i < 6; i++) { const y = sy - 30 * u - ((T * 900 + i * 120) % (H * 0.7)); ctx.fillRect(sx - 2 * u, y, 4 * u, 18 * u); }
  ctx.restore(); drawShip(sx, sy, Math.cos(T * 1.1) * 0.4, u * 1.6);
  const s = Math.min(W * 0.17, H * 0.12, 130);
  glowText('UZAY', W / 2, H * 0.36, s, '#e8fdff', C_SHIP, W * 0.86);
  glowText('SAVUNMASI', W / 2, H * 0.36 + s * 0.95, s * 0.75, '#ffe3fb', C_BOSS, W * 0.9);
  ctx.save(); ctx.globalAlpha = 0.6 + 0.4 * Math.sin(T * 4);
  glowText('Başlamak için dokun / tıkla', W / 2, H * 0.36 + s * 1.85, Math.min(W * 0.055, 28), '#fff', C_SHIP, W * 0.9); ctx.restore();
  glowText('Parmağınla / fareyle yönet · Ok tuşları', W / 2, H * 0.36 + s * 1.85 + 38, Math.min(W * 0.038, 18), 'rgba(200,240,255,0.8)', C_SHIP, W * 0.92);
  if (best > 0) glowText('En iyi: ' + best, W / 2, H * 0.36 + s * 1.85 + 72, Math.min(W * 0.045, 22), C_GOLD, C_GOLD, W * 0.9);
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save(); if (shake > 0) ctx.translate(rr(-shake, shake), rr(-shake, shake));
  if (state === 'title') drawTitle();
  else {
    drawSpace(1); drawField(); drawHud();
    if (flash > 0) { ctx.fillStyle = 'rgba(255,61,110,' + flash * 0.3 + ')'; ctx.fillRect(-30, -30, W + 60, H + 60); }
    if (state === 'over') overlay('OYUN BİTTİ', [['Skor: ' + score + '  ·  Dalga ' + wave, '#fff'], [newBest ? 'Yeni rekor!' : 'En iyi: ' + best, C_GOLD]], overT > 0.9 ? 'Tekrar için dokun / tıkla' : '');
    else if (paused) overlay('DURAKLATILDI', [['Skor: ' + score, '#fff']], 'Devam etmek için dokun');
  }
  ctx.restore(); drawMute('#d8f8ff');
}

// ---------- input ----------
function setTarget(e) { target = { x: (e.clientX - FX) / S, y: e.clientY / S - (e.pointerType === 'mouse' ? 0 : 70) }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  if (inMute(e.clientX, e.clientY)) { toggleMute(); return; }
  if (paused) { paused = false; return; }
  if (state === 'title') { newGame(); return; }
  if (state === 'over') { if (overT > 0.9) newGame(); return; }
  setTarget(e);
});
cv.addEventListener('pointermove', e => { if (state === 'play' && !paused && (e.pointerType === 'mouse' || e.buttons)) setTarget(e); });
window.addEventListener('keydown', e => {
  const k = e.key; if (k.startsWith('Arrow') || k === ' ' || e.code === 'Space') e.preventDefault();
  initAudio(); keys[k.length === 1 ? k.toLowerCase() : k] = true;
  if (k === 'm' || k === 'M') { toggleMute(); return; }
  if ((k === 'p' || k === 'P' || k === 'Escape') && state === 'play') { paused = !paused; return; }
  if (paused) { if (k === ' ' || k === 'Enter') paused = false; return; }
  if (k === ' ' || k === 'Enter') { if (state === 'title') newGame(); else if (state === 'over' && overT > 0.9) newGame(); }
});
window.addEventListener('keyup', e => { const k = e.key; keys[k.length === 1 ? k.toLowerCase() : k] = false; });
window.addEventListener('blur', () => { keys = {}; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (state === 'play') paused = true; keys = {}; if (AC && AC.state === 'running') AC.suspend(); }
  else { if (AC) AC.resume(); last = performance.now(); }
});

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now;
  if (!paused) update(dt); else T += dt;
  draw(); requestAnimationFrame(frame);
}
resize(); requestAnimationFrame(frame);
</script>
</body>
