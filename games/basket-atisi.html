</head><body><canvas id="c"></canvas><script>
'use strict';
const ID='basket-atisi',FT='"Bungee",system-ui,sans-serif',FF='"Rubik",system-ui,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=1,H=1,DPR=1,hidden=false,last=performance.now(),t=0;
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}};
let best=+store.get('ksb-'+ID+'-best',0)||0,muted=store.get('ksb-'+ID+'-mute','0')==='1';
let AC=null,master=null,nbuf=null;
function audio(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination)}catch(e){AC=null}}
function tone(f,d,type,v,f2,dl){if(!AC||muted)return;const s=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v||.2,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(master);o.start(s);o.stop(s+d+.05)}
function noise(d,v,fc,type){if(!AC||muted)return;if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const s=AC.currentTime,b=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();b.buffer=nbuf;f.type=type||'bandpass';f.frequency.value=fc||1000;g.gain.setValueAtTime(v||.2,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);b.connect(f);f.connect(g);g.connect(master);b.start(s);b.stop(s+d+.05)}
function toggleMute(){muted=!muted;store.set('ksb-'+ID+'-mute',muted?'1':'0');if(master)master.gain.value=muted?0:.5}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(s,x,y,sz,col,al,font,glow){ctx.font=Math.max(6,sz|0)+'px '+(font||FT);ctx.textAlign=al||'center';ctx.textBaseline='middle';if(glow){ctx.shadowColor=glow;ctx.shadowBlur=sz*.4}ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.shadowBlur=0}
const btns=[];
function button(label,x,y,w,h,fn,col,on){rr(x,y,w,h,h*.3);ctx.fillStyle=on?col:'rgba(20,10,40,.55)';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=col;ctx.stroke();txt(label,x+w/2,y+h/2+1,Math.min(h*.4,w/(label.length*.75)),on?'#1b1240':'#fff');btns.push({x,y,w,h,fn})}
function hitBtn(x,y){for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();return true}}return false}
function drawMute(){const x=W-44,y=10;ctx.save();ctx.fillStyle='rgba(255,255,255,.14)';rr(x,y,34,34,10);ctx.fill();ctx.fillStyle=ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+7,y+13);ctx.lineTo(x+12,y+13);ctx.lineTo(x+18,y+8);ctx.lineTo(x+18,y+26);ctx.lineTo(x+12,y+21);ctx.lineTo(x+7,y+21);ctx.closePath();ctx.fill();ctx.beginPath();if(muted){ctx.moveTo(x+21,y+13);ctx.lineTo(x+28,y+21);ctx.moveTo(x+28,y+13);ctx.lineTo(x+21,y+21)}else{ctx.arc(x+19,y+17,5,-.9,.9);ctx.moveTo(x+24.5,y+10);ctx.arc(x+19,y+17,9,-.9,.9)}ctx.stroke();ctx.restore()}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);layout()}
// ---------- Dünya ----------
const ORANGE='#ff7a1a',GOLD='#ffd166',SKY1='#1b1240',SKY2='#ff8a5c';
let U=80,GY=700,BR=24,RH=40,RR=3,G=1200,SX=100,SY=600,K=5.2,VMAX=1600,portrait=false;
const hoop={x:0,y:0,cx:0,cy:0,tx:0,ty:0};
let stars=[],city=[],state='title',paused=false,ball=null,demo=null,timeLeft=60,score=0,baskets=0,swishes=0,streak=0,overT=0,newBest=false,netW=0,shake=0,parts=[],pops=[],aim=null,kbAim={a:-1,p:.6,on:false},tick=0;
function layout(){portrait=W<H;U=Math.min(H/9,W/5.5);GY=H-U*.9;BR=U*.3;RH=BR*1.75;RR=BR*.14;G=U*16;VMAX=U*20;SX=portrait?W*.2:W*.2;SY=GY-U*1.3;
 hoop.cx=hoop.tx=Math.min(portrait?W*.7:W*.72,maxHX());hoop.cy=hoop.ty=GY-Math.min(H*.45,U*5);hoop.x=hoop.cx;hoop.y=hoop.cy;
 stars=[];for(let i=0;i<60;i++)stars.push([Math.random()*W,Math.random()*GY*.6,Math.random()*1.5+.3,Math.random()*6]);
 city=[];let x=-10;while(x<W){const w=U*(.5+Math.random()*1.1),h=U*(.8+Math.random()*2.6);city.push([x,w,h]);x+=w+U*.05}}
function maxHX(){return W-(RH+RR+U*.08+U*.13+U*.45)}
function board(){return{x:hoop.x+RH+RR+U*.08,y:hoop.y-U*1.25,w:U*.13,h:U*1.55}}
function level(){return Math.floor(baskets/3)}
function relocate(){const lv=level(),osc=lv>=5?U*.7:0;hoop.tx=SX+U*2.4+Math.random()*Math.max(10,maxHX()-osc-SX-U*2.4);hoop.ty=GY-U*(2.6+Math.random()*2.6);hoop.ty=Math.max(hoop.ty,U*2.6+40)}
function newBall(){ball={x:SX,y:SY,vx:0,vy:0,st:'ready',touched:false,scored:false,ft:0,rot:0,pop:0,scT:0}}
function launch(b,vx,vy){const s=Math.hypot(vx,vy);if(s>VMAX){vx*=VMAX/s;vy*=VMAX/s}b.vx=vx;b.vy=vy;b.st='fly';b.ft=0}
function collidePoint(b,px,py,rad,e,isDemo){const dx=b.x-px,dy=b.y-py,d=Math.hypot(dx,dy),m=BR+rad;if(d<m&&d>1e-4){const nx=dx/d,ny=dy/d;b.x=px+nx*m;b.y=py+ny*m;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;b.vx*=.92;b.vy*=.92;b.touched=true;if(!isDemo&&-vn>U)return -vn}}return 0}
function step(b,h,isDemo){const py=b.y;b.vy+=G*h;b.x+=b.vx*h;b.y+=b.vy*h;b.rot+=b.vx*h/BR;
 let hitv=0;hitv=Math.max(hitv,collidePoint(b,hoop.x-RH,hoop.y,RR,.5,isDemo),collidePoint(b,hoop.x+RH,hoop.y,RR,.5,isDemo));if(hitv){tone(700+Math.random()*200,.12,'triangle',Math.min(.15,hitv/U*.02));tone(1400,.06,'sine',.04)}
 const bd=board(),cx=Math.max(bd.x,Math.min(b.x,bd.x+bd.w)),cy=Math.max(bd.y,Math.min(b.y,bd.y+bd.h));if(Math.hypot(b.x-cx,b.y-cy)<BR){const v=collidePoint(b,cx,cy,0,.55,isDemo);if(v){noise(.08,Math.min(.3,v/U*.03),300);tone(120,.08,'sine',.12)}}
 if(b.y>GY-BR){b.y=GY-BR;if(b.vy>U*1.2&&!isDemo){tone(90,.1,'sine',Math.min(.25,b.vy/U*.02));noise(.05,.1,200)}b.vy=-b.vy*.6;b.vx*=.85}
 if(b.x<BR){b.x=BR;b.vx=Math.abs(b.vx)*.6}if(b.x>W-BR){b.x=W-BR;b.vx=-Math.abs(b.vx)*.6}
 if(!b.scored&&b.vy>0&&py<hoop.y&&b.y>=hoop.y&&b.x>hoop.x-RH+RR&&b.x<hoop.x+RH-RR){b.scored=true;b.scT=b.ft;scored(b,isDemo)}}
function scored(b,isDemo){netW=1;const sw=!b.touched;for(let i=0;i<(sw?40:22);i++){const a=Math.random()*6.28,v=U*(1+Math.random()*4);parts.push({x:hoop.x,y:hoop.y+U*.3,vx:Math.cos(a)*v,vy:Math.sin(a)*v-U*3,l:0,m:.7+Math.random()*.6,c:[GOLD,ORANGE,'#fff','#ff4d8d'][i%4],s:U*.06})}
 noise(.25,.25,3000,'highpass');if(isDemo)return;
 baskets++;streak++;if(sw)swishes++;let pts=sw?3:2;if(streak>=3)pts++;score+=pts;shake=sw?.25:.12;
 pops.push({s:(sw?'SWISH! ':'')+'+'+pts,x:hoop.x,y:hoop.y-U*.8,t:0,c:sw?GOLD:'#fff'});if(streak>=3)pops.push({s:'SERİ x'+streak,x:hoop.x,y:hoop.y-U*1.5,t:-.15,c:'#ff4d8d'});
 [523,659,784].concat(sw?[1047]:[]).forEach((f,i)=>tone(f,.16,'square',.07,0,.05+i*.07))}
function burstFire(b){if(Math.random()<.7)parts.push({x:b.x+(Math.random()-.5)*BR,y:b.y+(Math.random()-.5)*BR,vx:-b.vx*.1,vy:-U*2,l:0,m:.35,c:Math.random()<.5?'#ffcf3f':'#ff5a1f',s:BR*.35})}
function startGame(){state='play';paused=false;timeLeft=60;score=0;baskets=0;swishes=0;streak=0;newBest=false;parts=[];pops=[];aim=null;tick=60;layout();newBall();tone(440,.1,'square',.08);tone(880,.2,'square',.08,0,.12)}
function gameOver(){state='over';overT=0;aim=null;if(score>best){best=score;newBest=score>0;store.set('ksb-'+ID+'-best',best)}tone(220,.9,'sawtooth',.12,180);tone(110,.9,'square',.08)}
function finishBall(){if(!ball.scored){streak=0;tone(200,.15,'triangle',.06,140)}const sc=ball.scored;if(timeLeft<=0){gameOver();return}if(sc&&baskets>=3)relocate();newBall()}
function update(dt){netW=Math.max(0,netW-dt*1.5);shake=Math.max(0,shake-dt);for(const p of parts){p.l+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=G*.4*dt}parts=parts.filter(p=>p.l<p.m);for(const p of pops)p.t+=dt;pops=pops.filter(p=>p.t<1.1);
 hoop.cx+=(hoop.tx-hoop.cx)*Math.min(1,dt*4);hoop.cy+=(hoop.ty-hoop.cy)*Math.min(1,dt*4);const lv=state==='play'?level():0;hoop.x=hoop.cx+(lv>=5?Math.sin(t*.9)*U*.7:0);hoop.y=hoop.cy+(lv>=3?Math.sin(t*1.3)*U*.6:0);
 if(state==='title'){if(!demo||demo.ft>2.6){demo={x:SX,y:SY,vx:0,vy:0,st:'fly',touched:false,scored:false,ft:0,rot:0};const T=1.15+Math.random()*.25,dx=hoop.x-SX+(Math.random()-.5)*RH*.6,dy=hoop.y-SY;launch(demo,dx/T,(dy-.5*G*T*T)/T)}
  const n=Math.ceil(Math.hypot(demo.vx,demo.vy)*dt/(BR*.5))+1;for(let i=0;i<n;i++)step(demo,dt/n,true);demo.ft+=dt;return}
 if(state==='over'){overT+=dt;return}if(paused)return;
 timeLeft=Math.max(0,timeLeft-dt);if(timeLeft<=10&&Math.ceil(timeLeft)<tick){tick=Math.ceil(timeLeft);if(tick>0)tone(tick<=3?1000:800,.06,'square',.06)}
 const b=ball;if(b.st==='ready'){b.pop=Math.min(1,b.pop+dt*5);if(timeLeft<=0){tone(300,.8,'square',.1,280);gameOver()}return}
 b.ft+=dt;const n=Math.ceil(Math.hypot(b.vx,b.vy)*dt/(BR*.5))+1;for(let i=0;i<n;i++)step(b,dt/n,false);if(streak>=3)burstFire(b);
 if(timeLeft<=0&&b.ft>0&&!b.buzz){b.buzz=1;tone(300,.8,'square',.1,280)}
 const slow=b.y>=GY-BR-1&&Math.abs(b.vx)<U*1.5;if((b.scored&&b.ft-b.scT>.7)||b.ft>4||(slow&&b.ft>.5)||(b.x>W-BR-1&&b.y>GY-BR*2&&b.ft>1.5))finishBall()}
// ---------- Çizim ----------
function scene(){const g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,SKY1);g.addColorStop(.55,'#5b2a6e');g.addColorStop(1,SKY2);ctx.fillStyle=g;ctx.fillRect(0,0,W,GY);
 for(const s of stars){ctx.globalAlpha=.4+.4*Math.sin(t*2+s[3]);ctx.fillStyle='#fff';ctx.fillRect(s[0],s[1],s[2],s[2])}ctx.globalAlpha=1;
 const sun=ctx.createRadialGradient(W*.5,GY,0,W*.5,GY,U*4);sun.addColorStop(0,'rgba(255,220,140,.8)');sun.addColorStop(1,'rgba(255,160,90,0)');ctx.fillStyle=sun;ctx.fillRect(0,0,W,GY);
 ctx.fillStyle='#2a1640';for(const [x,w,h] of city){ctx.fillRect(x,GY-h,w,h)}ctx.fillStyle='rgba(255,209,102,.5)';for(const [x,w,h] of city)for(let yy=GY-h+U*.2;yy<GY-U*.2;yy+=U*.3)for(let xx=x+U*.12;xx<x+w-U*.12;xx+=U*.25)if(((xx*7+yy*3)|0)%5===0)ctx.fillRect(xx,yy,U*.08,U*.1);
 const f=ctx.createLinearGradient(0,GY,0,H);f.addColorStop(0,'#d98a45');f.addColorStop(1,'#8f4a1f');ctx.fillStyle=f;ctx.fillRect(0,GY,W,H-GY);ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=1;for(let i=1;i<4;i++){const y=GY+(H-GY)*i/4;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,GY+2);ctx.lineTo(W,GY+2);ctx.stroke();ctx.beginPath();ctx.ellipse(hoop.x,GY+(H-GY)*.45,U*3,(H-GY)*.3,0,Math.PI*.5,Math.PI*1.5);ctx.stroke()}
function hoopBack(){const bd=board(),px=bd.x+bd.w+U*.35;ctx.fillStyle='#3a3f55';ctx.fillRect(px-U*.07,bd.y+bd.h*.4,U*.14,GY-bd.y-bd.h*.4);ctx.fillRect(bd.x+bd.w,bd.y+bd.h*.45,px-bd.x-bd.w,U*.1);
 ctx.fillStyle='rgba(240,248,255,.92)';rr(bd.x,bd.y,bd.w,bd.h,3);ctx.fill();ctx.strokeStyle='#ff5a3c';ctx.lineWidth=2;ctx.strokeRect(bd.x+bd.w*.2,bd.y+bd.h*.45,bd.w*.6,bd.h*.32);
 ctx.strokeStyle='#d4380d';ctx.lineWidth=RR*2;ctx.beginPath();ctx.ellipse(hoop.x,hoop.y,RH,RH*.2,0,Math.PI,Math.PI*2);ctx.stroke();ctx.fillStyle='#a32c0a';ctx.fillRect(hoop.x+RH,hoop.y-RR,bd.x-hoop.x-RH,RR*2)}
function hoopFront(){const n=6,ln=U*.85*(1+netW*.25),wig=netW*Math.sin(t*28)*U*.08,tops=[],bots=[];for(let i=0;i<n;i++){const k=i/(n-1),x=hoop.x-RH+k*2*RH;tops.push([x,hoop.y]);bots.push([hoop.x+(x-hoop.x)*.55+wig*(1-Math.abs(k-.5)),hoop.y+ln])}
 ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.5;ctx.beginPath();for(let i=0;i<n;i++){ctx.moveTo(tops[i][0],tops[i][1]);ctx.quadraticCurveTo((tops[i][0]+bots[i][0])/2+wig*.5,hoop.y+ln*.5,bots[i][0],bots[i][1])}
 for(let lv=1;lv<=3;lv++){const k=lv/3.4;for(let i=0;i<n-1;i++){const ax=tops[i][0]+(bots[i][0]-tops[i][0])*k,ay=hoop.y+ln*k,bx=tops[i+1][0]+(bots[i+1][0]-tops[i+1][0])*(k+.15),by2=hoop.y+ln*(k+.15);ctx.moveTo(ax,ay);ctx.lineTo(bx,by2);ctx.moveTo(tops[i+1][0]+(bots[i+1][0]-tops[i+1][0])*k,ay);ctx.lineTo(tops[i][0]+(bots[i][0]-tops[i][0])*(k+.15),by2)}}ctx.stroke();
 ctx.strokeStyle='#ff5a1f';ctx.lineWidth=RR*2;ctx.shadowColor='#ff5a1f';ctx.shadowBlur=8;ctx.beginPath();ctx.ellipse(hoop.x,hoop.y,RH,RH*.2,0,0,Math.PI);ctx.stroke();ctx.shadowBlur=0}
function drawBall(b,sc){if(!b)return;const r=BR*(sc==null?1:sc);const sh=Math.max(.2,1-(GY-b.y)/(U*6));ctx.fillStyle='rgba(0,0,0,'+(.3*sh)+')';ctx.beginPath();ctx.ellipse(b.x,GY+3,r*sh,r*.25*sh,0,0,6.2832);ctx.fill();

 ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot);ctx.strokeStyle='rgba(40,15,0,.75)';ctx.lineWidth=Math.max(1.2,r*.07);ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(r,0);ctx.moveTo(0,-r);ctx.lineTo(0,r);ctx.moveTo(-r*.7,-r*.7);ctx.quadraticCurveTo(-r*.2,0,-r*.7,r*.7);ctx.moveTo(r*.7,-r*.7);ctx.quadraticCurveTo(r*.2,0,r*.7,r*.7);ctx.stroke();ctx.restore()}
function aimVel(){if(aim){return[(aim.x-aim.x0)*K,(aim.y-aim.y0)*K]}if(kbAim.on){const s=VMAX*kbAim.p;return[Math.cos(kbAim.a)*s,Math.sin(kbAim.a)*s]}return null}
function drawAim(){const v=aimVel();if(!v||!ball||ball.st!=='ready')return;let [vx,vy]=v;const s=Math.hypot(vx,vy);if(s>VMAX){vx*=VMAX/s;vy*=VMAX/s}let x=SX,y=SY;for(let i=1;i<=14;i++){const tt=i*.03;const px=SX+vx*tt,py=SY+vy*tt+.5*G*tt*tt;ctx.globalAlpha=1-i/15;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px,py,Math.max(2,BR*.16),0,6.2832);ctx.fill()}ctx.globalAlpha=1;
 const p=Math.min(1,Math.hypot(vx,vy)/VMAX);ctx.strokeStyle=p>.85?'#ff4d4d':GOLD;ctx.lineWidth=4;ctx.beginPath();ctx.arc(SX,SY,BR*1.5,-Math.PI/2,-Math.PI/2+6.2832*p);ctx.stroke()}

 ctx.fillStyle='rgba(0,0,0,.35)';rr(x,y,bw,10,5);ctx.fill();ctx.fillStyle=timeLeft<=10?(Math.sin(t*12)>0?'#ff4d4d':'#ffb3b3'):GOLD;rr(x,y,bw*k,10,5);ctx.fill();
 txt(Math.ceil(timeLeft)+' sn',W/2,y+24,Math.min(U*.28,18),'#fff','center',FF);if(streak>=2)txt('SERİ x'+streak,W/2,y+46,Math.min(U*.26,17),'#ff4d8d','center',FT);
 txt('REKOR '+best,W-54,30,Math.min(U*.22,15),'rgba(255,255,255,.75)','right',FF);
 ctx.fillStyle='rgba(255,255,255,.14)';rr(10,10,34,34,10);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(21,20,4,14);ctx.fillRect(29,20,4,14)}
function overlay(){ctx.fillStyle='rgba(20,10,40,.72)';ctx.fillRect(0,0,W,H)}
function drawTitle(){const s=Math.min(W*.16,H*.1,120),y=H*(portrait?.13:.17);ctx.save();ctx.translate(W/2,y);ctx.rotate(-.04);txt('BASKET',0,5,s,'rgba(0,0,0,.35)');txt('BASKET',0,0,s,'#fff','center',FT,ORANGE);txt('ATIŞI',0,s*.95,s*.9,GOLD,'center',FT,'#ff4d8d');ctx.restore();
 txt('60 saniye · Swish = +1 bonus',W/2,y+s*1.85,Math.min(W*.045,22),'#ffe3c9','center',FF);
 ctx.globalAlpha=.6+.4*Math.sin(t*4);txt('Başlamak için dokun / tıkla',W/2,y+s*2.45,Math.min(W*.055,28),'#fff','center',FF);ctx.globalAlpha=1;
 txt('REKOR: '+best,W/2,y+s*2.95,Math.min(W*.045,22),GOLD,'center',FT);
 txt('Topu potaya doğru sürükleyip bırak · Klavye: ← → açı, ↑ ↓ güç, Boşluk at',W/2,H-(H-GY)/2,Math.min(W*.03,15),'rgba(255,255,255,.85)','center',FF)}
function drawOver(){overlay();const s=Math.min(W*.13,84);txt('SÜRE BİTTİ!',W/2,H*.24,s,'#fff','center',FT,'#ff4d8d');txt(String(score),W/2,H*.37,s*1.3,GOLD,'center',FT,ORANGE);
 if(newBest){ctx.globalAlpha=.7+.3*Math.sin(t*6);txt('YENİ REKOR!',W/2,H*.47,s*.4,'#ff4d8d','center',FT);ctx.globalAlpha=1}else txt('REKOR: '+best,W/2,H*.47,s*.32,'#fff','center',FT);
 txt(baskets+' basket · '+swishes+' swish',W/2,H*.53,Math.min(W*.045,22),'#ffe3c9','center',FF);ctx.globalAlpha=.6+.4*Math.sin(t*4);txt('Tekrar oynamak için dokun / tıkla',W/2,H*.62,Math.min(W*.05,26),'#fff','center',FF);ctx.globalAlpha=1;
 const bw=Math.min(W*.6,260);button('ANA MENÜ',(W-bw)/2,H*.7,bw,Math.min(54,H*.07),()=>{state='title';demo=null;layout()},GOLD)}
function drawPause(){overlay();const bw=Math.min(W*.7,300),x=(W-bw)/2,h=Math.min(56,H*.08);txt('DURAKLATILDI',W/2,H*.3,Math.min(W*.09,52),'#fff','center',FT,ORANGE);button('DEVAM',x,H*.42,bw,h,()=>{paused=false},GOLD,true);button('YENİDEN BAŞLA',x,H*.42+h*1.3,bw,h,startGame,ORANGE);button('ANA MENÜ',x,H*.42+h*2.6,bw,h,()=>{state='title';paused=false;demo=null;layout()},'#ff4d8d')}
function draw(){btns.length=0;ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake*20,(Math.random()-.5)*shake*20);scene();hoopBack();
 if(state==='title')drawBall(demo);else if(ball)drawBall(ball,ball.st==='ready'?.5+.5*ball.pop:1);hoopFront();
 for(const p of parts){ctx.globalAlpha=Math.max(0,1-p.l/p.m);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,6.2832);ctx.fill()}ctx.globalAlpha=1;
 if(state==='play'){if(ball&&ball.st==='ready'){ctx.strokeStyle='rgba(255,255,255,'+(.3+.2*Math.sin(t*5))+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(SX,SY,BR*1.5,0,6.2832);ctx.stroke()}drawAim()}
 for(const p of pops){if(p.t<0)continue;const k=p.t/1.1;ctx.globalAlpha=1-k;txt(p.s,p.x,p.y-k*U,Math.min(U*.45,30)*(1+(1-k)*.2),p.c,'center',FT,'#ff4d8d')}ctx.globalAlpha=1;ctx.restore();
 if(state==='title')drawTitle();else if(state==='play'){hud();if(paused)drawPause()}else drawOver();drawMute()}
function frame(now){requestAnimationFrame(frame);let dt=(now-last)/1000;last=now;if(hidden)return;dt=Math.min(Math.max(dt,0),.05);t+=dt;update(dt);draw()}
// ---------- Girdi ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();const x=e.clientX,y=e.clientY;if(x>W-54&&y<54){toggleMute();return}if(hitBtn(x,y))return;
 if(state==='title'){startGame();return}if(state==='over'){if(overT>.8)startGame();return}if(paused)return;if(x<54&&y<54){paused=true;aim=null;return}
 if(ball&&ball.st==='ready'&&timeLeft>0){aim={id:e.pointerId,x0:x,y0:y,x,y};kbAim.on=false;try{cv.setPointerCapture(e.pointerId)}catch(_){}}});
cv.addEventListener('pointermove',e=>{if(aim&&e.pointerId===aim.id){aim.x=e.clientX;aim.y=e.clientY}});
cv.addEventListener('pointerup',e=>{if(!aim||e.pointerId!==aim.id)return;aim.x=e.clientX;aim.y=e.clientY;const v=aimVel();aim=null;if(state==='play'&&!paused&&ball&&ball.st==='ready'&&v&&v[1]<0&&Math.hypot(v[0],v[1])>U*3){launch(ball,v[0],v[1]);noise(.12,.12,800);tone(300,.08,'sine',.08,500)}});
cv.addEventListener('pointercancel',()=>{aim=null});
addEventListener('keydown',e=>{const k=e.key;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Spacebar'].includes(k))e.preventDefault();audio();
 if(k==='m'||k==='M'){toggleMute();return}if(state==='title'){if(k==='Enter'||k===' ')startGame();return}
 if(state==='over'){if((k==='Enter'||k===' '||k==='r'||k==='R')&&overT>.5)startGame();else if(k==='Escape'){state='title';demo=null;layout()}return}
 if(k==='p'||k==='P'||k==='Escape'){paused=!paused;return}if(k==='r'||k==='R'){startGame();return}if(paused){if(k==='Enter'||k===' ')paused=false;return}
 if(k==='ArrowLeft'){kbAim.on=true;kbAim.a=Math.max(-1.5,kbAim.a-.04)}else if(k==='ArrowRight'){kbAim.on=true;kbAim.a=Math.min(-.15,kbAim.a+.04)}else if(k==='ArrowUp'){kbAim.on=true;kbAim.p=Math.min(1,kbAim.p+.02)}else if(k==='ArrowDown'){kbAim.on=true;kbAim.p=Math.max(.2,kbAim.p-.02)}
 else if((k===' '||k==='Enter')&&ball&&ball.st==='ready'&&timeLeft>0){kbAim.on=true;const v=aimVel();launch(ball,v[0],v[1]);noise(.12,.12,800)}});
document.addEventListener('visibilitychange',()=>{hidden=document.hidden;if(hidden){if(state==='play')paused=true;aim=null;if(AC)AC.suspend()}else{if(AC&&!muted)AC.resume();last=performance.now()}});
addEventListener('resize',()=>{resize();if(ball&&ball.st==='ready'){ball.x=SX;ball.y=SY}});
resize();
try{document.fonts&&(document.fonts.load('40px "Bungee"'),document.fonts.load('500 20px "Rubik"'))}catch(e){}
requestAnimationFrame(frame);
</script></body></html>
