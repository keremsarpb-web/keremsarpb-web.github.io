<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Asteroit Avcısı — KSB Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0703;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const ID = 'asteroit', FONT = '"Chakra Petch",system-ui,sans-serif';
const AMB = '#ffb000', HOT = '#ff5a1f', PALE = '#fff1cf';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 1, H = 1, DPR = 1, K = 1;

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }
};
let best = parseInt(LS.get('ksb-' + ID + '-best', '0'), 10) || 0;
let muted = LS.get('ksb-' + ID + '-mute', '0') === '1';
let AC = null, master = null, thrustOsc = null, thrustGain = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended' && !document.hidden) AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = muted ? 0 : 0.45; master.connect(AC.destination);
    // continuous engine rumble, gated by thrustGain
    const n = AC.sampleRate, b = AC.createBuffer(1, n, n), a = b.getChannelData(0); for (let i = 0; i < n; i++) a[i] = Math.random() * 2 - 1;
    thrustOsc = AC.createBufferSource(); thrustOsc.buffer = b; thrustOsc.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 380; thrustGain = AC.createGain(); thrustGain.gain.value = 0;
    thrustOsc.connect(f); f.connect(thrustGain); thrustGain.connect(master); thrustOsc.start();
  } catch (e) { AC = null; }
}
function tone(f, d, type, v, f2, delay) {
  if (!AC || muted) return;
  const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v || 0.15, t); g.gain.exponentialRampToValueAtTime(0.0008, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.03);
}
function noise(d, v, fc) {
  if (!AC || muted) return;
  const n = Math.max(1, AC.sampleRate * d | 0), b = AC.createBuffer(1, n, AC.sampleRate), a = b.getChannelData(0);
  for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const s = AC.createBufferSource(); s.buffer = b;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fc || 1200;
  const g = AC.createGain(); g.gain.value = v || 0.3; s.connect(f); f.connect(g); g.connect(master); s.start();
}
function setThrustSound(on) { if (thrustGain) thrustGain.gain.setTargetAtTime(on && !muted ? 0.35 : 0, AC.currentTime, 0.05); }
function toggleMute() { muted = !muted; LS.set('ksb-' + ID + '-mute', muted ? '1' : '0'); if (master) master.gain.value = muted ? 0 : 0.45; }
function inMute(x, y) { return x > W - 60 && y < 60; }
function drawMute(col) {
  const x = W - 46, y = 14;
  ctx.save(); ctx.globalAlpha = 0.85; ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x + 4, y + 11); ctx.lineTo(x + 10, y + 11); ctx.lineTo(x + 17, y + 4); ctx.lineTo(x + 17, y + 28);
  ctx.lineTo(x + 10, y + 21); ctx.lineTo(x + 4, y + 21); ctx.closePath(); ctx.fill(); ctx.beginPath();
  if (muted) { ctx.moveTo(x + 22, y + 11); ctx.lineTo(x + 31, y + 21); ctx.moveTo(x + 31, y + 11); ctx.lineTo(x + 22, y + 21); }
  else { ctx.arc(x + 18, y + 16, 6, -0.8, 0.8); ctx.moveTo(x + 18 + 11 * Math.cos(-0.8), y + 16 + 11 * Math.sin(-0.8)); ctx.arc(x + 18, y + 16, 11, -0.8, 0.8); }
  ctx.stroke(); ctx.restore();
}
const rr = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function setFont(size, w) { ctx.font = (w || 700) + ' ' + Math.round(size) + 'px ' + FONT; }
function glowText(text, x, y, size, col, glow, maxW, w) {
  ctx.save(); setFont(size, w); const tw = ctx.measureText(text).width;
  if (maxW && tw > maxW) { size *= maxW / tw; setFont(size, w); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.shadowColor = glow || col; ctx.shadowBlur = size * 0.4; ctx.fillStyle = col;
  ctx.fillText(text, x, y); ctx.shadowBlur = 0; ctx.fillText(text, x, y); ctx.restore();
}

// ---------- layout ----------
let scan = null;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  K = clamp(Math.min(W, H) / 720, 0.55, 1.4);
  const p = document.createElement('canvas'); p.width = 1; p.height = 4; const pc = p.getContext('2d');
  pc.fillStyle = 'rgba(0,0,0,0.22)'; pc.fillRect(0, 0, 1, 1); scan = ctx.createPattern(p, 'repeat');
}
window.addEventListener('resize', resize);

// ---------- state ----------
let state = 'title', paused = false, T = 0, overT = 0, newBest = false;
let ship = null, rocks = [], shots = [], parts = [], debris = [], ufo = null, ushots = [], pops = [];
let score = 0, lives = 3, wave = 0, nextLife = 10000, waveT = 0, respawnT = 0, ufoT = 12, fireCd = 0;
let shake = 0, keys = {}, isTouch = false, showPad = false;
const ptrs = new Map();
try { isTouch = window.matchMedia('(pointer: coarse)').matches; } catch (e) {}

function makeRock(x, y, size, sp) {
  const r = [0, 15, 30, 56][size] * K, n = 9 + size * 2, pts = [];
  for (let i = 0; i < n; i++) pts.push(rr(0.72, 1.12));
  const a = Math.random() * 6.283, v = (sp || rr(30, 70)) * K * (1 + wave * 0.07) * (4 - size) * 0.55;
  return { x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r, size, pts, rot: 0, vr: rr(-1, 1) };
}
function spawnWave() {
  wave++; waveT = 1.6;
  const n = Math.min(11, 3 + wave);
  for (let i = 0; i < n; i++) {
    let x, y, tries = 0;
    do { x = Math.random() * W; y = Math.random() * H; tries++; } while (ship && Math.hypot(x - ship.x, y - ship.y) < 220 * K && tries < 50);
    rocks.push(makeRock(x, y, 3));
  }
  tone(220, 0.15, 'triangle', 0.12); tone(330, 0.25, 'triangle', 0.12, 0, 0.15);
}
function newShip() { ship = { x: W / 2, y: H / 2, a: -Math.PI / 2, vx: 0, vy: 0, inv: 2.5, thr: false }; }
function newGame() {
  rocks = []; shots = []; parts = []; debris = []; ushots = []; pops = []; ufo = null; ufoT = 14;
  score = 0; lives = 3; wave = 0; nextLife = 10000; newBest = false; paused = false; respawnT = 0;
  newShip(); spawnWave(); state = 'play';
}
function burst(x, y, n, col, sp, life) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = rr(sp * 0.2, sp) * K, l = rr(0.3, life || 0.9);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: l, max: l, col }); }
}
function wrap(o, m) { if (o.x < -m) o.x += W + m * 2; else if (o.x > W + m) o.x -= W + m * 2; if (o.y < -m) o.y += H + m * 2; else if (o.y > H + m) o.y -= H + m * 2; }
function addScore(n) { score += n; if (score >= nextLife) { nextLife += 10000; lives = Math.min(6, lives + 1); tone(880, 0.1, 'square', 0.1); tone(1320, 0.2, 'square', 0.1, 0, 0.1); pops.push({ x: W / 2, y: H * 0.3, t: 0, txt: '+1 CAN' }); } }
function breakRock(i) {
  const r = rocks[i]; rocks.splice(i, 1);
  addScore([0, 100, 50, 20][r.size]); burst(r.x, r.y, 8 + r.size * 6, r.size === 1 ? PALE : AMB, 160 + r.size * 40);
  noise(0.15 + r.size * 0.12, 0.2 + r.size * 0.08, 400 + (3 - r.size) * 500); shake = Math.max(shake, r.size * 3);
  if (r.size > 1) for (let k = 0; k < 2; k++) { const nr = makeRock(r.x, r.y, r.size - 1); nr.vx += r.vx * 0.4; nr.vy += r.vy * 0.4; rocks.push(nr); }
}
function killShip() {
  if (!ship) return;
  for (let i = 0; i < 6; i++) { const a = Math.random() * 6.283; debris.push({ x: ship.x, y: ship.y, vx: Math.cos(a) * rr(40, 140) * K + ship.vx * 0.5, vy: Math.sin(a) * rr(40, 140) * K + ship.vy * 0.5, a: Math.random() * 6, va: rr(-5, 5), len: rr(8, 18) * K, life: 1.6 }); }
  burst(ship.x, ship.y, 40, HOT, 300, 1.2); noise(1, 0.5, 600); tone(200, 0.8, 'sawtooth', 0.15, 40);
  shake = 18; ship = null; lives--; setThrustSound(false);
  if (lives <= 0) { state = 'over'; overT = 0; if (score > best) { best = score; newBest = true; LS.set('ksb-' + ID + '-best', best); } }
  else respawnT = 1.6;
}
function control(name) {
  if (name === 'left') return keys.ArrowLeft || keys.a;
  if (name === 'right') return keys.ArrowRight || keys.d;
  if (name === 'thrust') return keys.ArrowUp || keys.w;
  if (name === 'fire') return keys[' '];
  return false;
}
function padDown(name) { for (const v of ptrs.values()) if (v === name) return true; return false; }

// ---------- update ----------
function update(dt) {
  T += dt;
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; p.vy *= 0.98; p.life -= dt; if (p.life <= 0) parts.splice(i, 1); }
  for (let i = debris.length - 1; i >= 0; i--) { const d = debris[i]; d.x += d.vx * dt; d.y += d.vy * dt; d.a += d.va * dt; d.life -= dt; if (d.life <= 0) debris.splice(i, 1); }
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > 1.2) pops.splice(i, 1); }
  shake = Math.max(0, shake - dt * 40);
  for (const r of rocks) { r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.vr * dt; wrap(r, r.r); }
  if (state === 'title') { if (rocks.length < 7) rocks.push(makeRock(Math.random() * W, -50, 1 + (Math.random() * 3 | 0))); return; }
  if (state === 'over') { overT += dt; return; }
  waveT = Math.max(0, waveT - dt);
  if (!ship) { respawnT -= dt; if (respawnT <= 0) newShip(); }
  if (ship) {
    const L = control('left') || padDown('left'), R = control('right') || padDown('right'), TH = control('thrust') || padDown('thrust'), F = control('fire') || padDown('fire');
    ship.a += ((R ? 1 : 0) - (L ? 1 : 0)) * 4.4 * dt;
    if (TH) {
      ship.vx += Math.cos(ship.a) * 420 * K * dt; ship.vy += Math.sin(ship.a) * 420 * K * dt;
      if (Math.random() < 0.7) { const bx = ship.x - Math.cos(ship.a) * 14 * K, by = ship.y - Math.sin(ship.a) * 14 * K, a = ship.a + Math.PI + rr(-0.35, 0.35), s = rr(80, 200) * K, l = rr(0.15, 0.4);
        parts.push({ x: bx, y: by, vx: Math.cos(a) * s + ship.vx, vy: Math.sin(a) * s + ship.vy, life: l, max: l, col: Math.random() < 0.5 ? HOT : AMB }); }
    }
    if (TH !== ship.thr) { ship.thr = TH; setThrustSound(TH); }
    const sp = Math.hypot(ship.vx, ship.vy), mx = 460 * K; if (sp > mx) { ship.vx *= mx / sp; ship.vy *= mx / sp; }
    const fr = Math.pow(0.55, dt); ship.vx *= fr; ship.vy *= fr;
    ship.x += ship.vx * dt; ship.y += ship.vy * dt; wrap(ship, 10);
    ship.inv = Math.max(0, ship.inv - dt);
    fireCd -= dt;
    if (F && fireCd <= 0 && shots.length < 10) {
      fireCd = 0.17; const c = Math.cos(ship.a), s = Math.sin(ship.a);
      shots.push({ x: ship.x + c * 16 * K, y: ship.y + s * 16 * K, vx: c * 640 * K + ship.vx, vy: s * 640 * K + ship.vy, life: 0.95 });
      tone(880, 0.07, 'square', 0.06, 220);
    }
  }
  for (let i = shots.length - 1; i >= 0; i--) {
    const b = shots[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; wrap(b, 2);
    let hit = b.life <= 0;
    for (let j = rocks.length - 1; j >= 0 && !hit; j--) if (Math.hypot(b.x - rocks[j].x, b.y - rocks[j].y) < rocks[j].r) { breakRock(j); hit = true; }
    if (!hit && ufo && Math.hypot(b.x - ufo.x, b.y - ufo.y) < 18 * K) { hit = true; addScore(200); pops.push({ x: ufo.x, y: ufo.y, t: 0, txt: '+200' }); burst(ufo.x, ufo.y, 40, PALE, 260); noise(0.6, 0.4, 900); shake = 10; ufo = null; }
    if (hit) shots.splice(i, 1);
  }
  // UFO
  ufoT -= dt;
  if (!ufo && ufoT <= 0 && wave >= 2) { const l = Math.random() < 0.5; ufo = { x: l ? -30 : W + 30, y: rr(H * 0.15, H * 0.75), vx: (l ? 1 : -1) * 110 * K, t: 0, fire: 1.2 }; ufoT = rr(14, 22) - Math.min(8, wave); }
  if (ufo) {
    ufo.t += dt; ufo.x += ufo.vx * dt; ufo.y += Math.sin(ufo.t * 2) * 50 * K * dt; ufo.fire -= dt;
    if (ufo.t % 0.5 < dt) tone(ufo.t % 1 < 0.5 ? 700 : 560, 0.12, 'sine', 0.04);
    if (ufo.fire <= 0 && ship) { ufo.fire = Math.max(0.6, 1.4 - wave * 0.06); const a = Math.atan2(ship.y - ufo.y, ship.x - ufo.x) + rr(-0.25, 0.25); ushots.push({ x: ufo.x, y: ufo.y, vx: Math.cos(a) * 300 * K, vy: Math.sin(a) * 300 * K, life: 2 }); tone(400, 0.1, 'triangle', 0.06, 900); }
    if (ufo.x < -60 || ufo.x > W + 60) ufo = null;
  }
  for (let i = ushots.length - 1; i >= 0; i--) { const b = ushots[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; if (b.life <= 0) { ushots.splice(i, 1); continue; }
    if (ship && ship.inv <= 0 && Math.hypot(b.x - ship.x, b.y - ship.y) < 12 * K) { ushots.splice(i, 1); killShip(); } }
  if (ship && ship.inv <= 0) {
    for (let j = rocks.length - 1; j >= 0; j--) if (Math.hypot(ship.x - rocks[j].x, ship.y - rocks[j].y) < rocks[j].r + 9 * K) { breakRock(j); killShip(); break; }
    if (ship && ufo && Math.hypot(ship.x - ufo.x, ship.y - ufo.y) < 24 * K) { ufo = null; killShip(); }
  }
  if (!rocks.length && state === 'play') spawnWave();
}

// ---------- draw ----------
function rockPath(r) {
  const n = r.pts.length;
  for (let i = 0; i <= n; i++) { const a = r.rot + (i % n) / n * Math.PI * 2, d = r.r * r.pts[i % n], x = r.x + Math.cos(a) * d, y = r.y + Math.sin(a) * d; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
}
function drawShipAt(x, y, a, k, thr) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(k, k);
  ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-12, -11); ctx.lineTo(-7, 0); ctx.lineTo(-12, 11); ctx.closePath();
  ctx.strokeStyle = PALE; ctx.lineWidth = 2 / k; ctx.shadowColor = AMB; ctx.shadowBlur = 12; ctx.stroke();
  if (thr) { ctx.beginPath(); ctx.moveTo(-9, -5); ctx.lineTo(-18 - Math.random() * 10, 0); ctx.lineTo(-9, 5); ctx.strokeStyle = HOT; ctx.shadowColor = HOT; ctx.stroke(); }
  ctx.restore();
}
function drawWorld() {
  ctx.fillStyle = '#0b0703'; ctx.fillRect(-30, -30, W + 60, H + 60);
  // faint star dust
  ctx.fillStyle = 'rgba(255,200,120,0.35)';
  for (let i = 0; i < 70; i++) { const x = (Math.sin(i * 91.7) * 0.5 + 0.5) * W, y = (Math.cos(i * 47.3) * 0.5 + 0.5) * H; ctx.fillRect(x, y, 1.3, 1.3); }
  ctx.save(); ctx.lineJoin = 'round'; ctx.strokeStyle = AMB; ctx.lineWidth = 2; ctx.shadowColor = AMB; ctx.shadowBlur = 10;
  ctx.beginPath(); for (const r of rocks) rockPath(r); ctx.stroke();
  ctx.fillStyle = 'rgba(255,176,0,0.05)'; ctx.fill(); ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col; ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3); }
  ctx.globalAlpha = 1; ctx.fillStyle = PALE; ctx.shadowColor = AMB; ctx.shadowBlur = 8;
  for (const b of shots) { ctx.beginPath(); ctx.arc(b.x, b.y, 2.4, 0, 7); ctx.fill(); }
  ctx.fillStyle = HOT; for (const b of ushots) { ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, 7); ctx.fill(); }
  ctx.restore();
  ctx.save(); ctx.strokeStyle = HOT; ctx.lineWidth = 2; ctx.shadowColor = HOT; ctx.shadowBlur = 8;
  for (const d of debris) { ctx.globalAlpha = Math.min(1, d.life); ctx.beginPath(); ctx.moveTo(d.x - Math.cos(d.a) * d.len / 2, d.y - Math.sin(d.a) * d.len / 2); ctx.lineTo(d.x + Math.cos(d.a) * d.len / 2, d.y + Math.sin(d.a) * d.len / 2); ctx.stroke(); }
  ctx.restore();
  if (ufo) {
    ctx.save(); ctx.translate(ufo.x, ufo.y); ctx.scale(K, K); ctx.strokeStyle = PALE; ctx.lineWidth = 2 / K; ctx.shadowColor = HOT; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(-22, 2); ctx.lineTo(22, 2); ctx.lineTo(12, 9); ctx.lineTo(-12, 9); ctx.closePath(); ctx.moveTo(-22, 2); ctx.lineTo(-10, -5); ctx.lineTo(10, -5); ctx.lineTo(22, 2);
    ctx.moveTo(-7, -5); ctx.lineTo(-4, -12); ctx.lineTo(4, -12); ctx.lineTo(7, -5); ctx.stroke(); ctx.restore();
  }
  if (ship && (ship.inv <= 0 || Math.sin(T * 30) > 0)) drawShipAt(ship.x, ship.y, ship.a, K, ship.thr);
}
function drawPad() {
  const R = clamp(Math.min(W, H) * 0.09, 34, 60), m = 18, y = H - m - R;
  const btns = [['left', m + R, y, '◀'], ['right', m + R * 3.3, y, '▶'], ['thrust', W - m - R * 3.3, y, 'İTKİ'], ['fire', W - m - R, y, 'ATEŞ']];
  ctx.save();
  for (const [n, x, by, label] of btns) {
    const on = padDown(n);
    ctx.globalAlpha = on ? 0.9 : 0.45; ctx.strokeStyle = n === 'fire' ? HOT : AMB; ctx.lineWidth = 2.5; ctx.fillStyle = on ? 'rgba(255,176,0,0.25)' : 'rgba(255,176,0,0.06)';
    ctx.beginPath(); ctx.arc(x, by, R, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = PALE;
    if (label.length > 1) { setFont(R * 0.36); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, x, by + 1); }
    else { const d = label === '◀' ? -1 : 1, q = R * 0.32; ctx.beginPath(); ctx.moveTo(x + d * q, by); ctx.lineTo(x - d * q * 0.7, by - q); ctx.lineTo(x - d * q * 0.7, by + q); ctx.closePath(); ctx.fill(); }
  }
  ctx.restore();
  return btns.map(b => ({ n: b[0], x: b[1], y: b[2], R }));
}
function padHit(x, y) {
  const R = clamp(Math.min(W, H) * 0.09, 34, 60), m = 18, by = H - m - R;
  const btns = [['left', m + R], ['right', m + R * 3.3], ['thrust', W - m - R * 3.3], ['fire', W - m - R]];
  let bestN = null, bd = 1e9;
  for (const [n, bx] of btns) { const d = Math.hypot(x - bx, y - by); if (d < R * 1.35 && d < bd) { bd = d; bestN = n; } }
  return bestN;
}
function drawHud() {
  ctx.save(); setFont(28); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = PALE; ctx.shadowColor = AMB; ctx.shadowBlur = 10;
  ctx.fillText(String(score).padStart(5, '0'), 16, 30); ctx.shadowBlur = 0;
  setFont(13, 500); ctx.fillStyle = 'rgba(255,200,120,0.75)'; ctx.fillText('DALGA ' + wave + '   EN İYİ ' + Math.max(best, score), 16, 56);
  for (let i = 0; i < lives; i++) drawShipAt(W - 76 - i * 24, 30, -Math.PI / 2, 0.6, false);
  ctx.restore();
  for (const p of pops) glowText(p.txt, p.x, p.y - p.t * 30, 18, PALE, AMB);
  if (waveT > 0) { ctx.save(); ctx.globalAlpha = Math.min(1, waveT * 2); glowText('DALGA ' + wave, W / 2, H * 0.3, Math.min(W * 0.1, 48), PALE, AMB, W * 0.8); ctx.restore(); }
}
function crt() {
  ctx.fillStyle = scan; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.6)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function overlay(title, lines, hint) {
  ctx.fillStyle = 'rgba(11,7,3,0.65)'; ctx.fillRect(-30, -30, W + 60, H + 60);
  const s = Math.min(W * 0.12, H * 0.09, 84);
  glowText(title, W / 2, H * 0.36, s, PALE, AMB, W * 0.88);
  lines.forEach((l, i) => glowText(l[0], W / 2, H * 0.36 + s * 1.1 + i * s * 0.6, s * 0.42, l[1], AMB, W * 0.85, 500));
  if (hint) { ctx.save(); ctx.globalAlpha = 0.55 + 0.45 * Math.sin(T * 4); glowText(hint, W / 2, H * 0.72, Math.min(W * 0.055, 26), PALE, HOT, W * 0.88); ctx.restore(); }
}
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save(); if (shake > 0) ctx.translate(rr(-shake, shake), rr(-shake, shake));
  drawWorld();
  if (state === 'title') {
    drawShipAt(W / 2 + Math.cos(T * 0.6) * Math.min(W, H) * 0.3, H * 0.5 + Math.sin(T * 0.6) * Math.min(W, H) * 0.3, T * 0.6 + Math.PI, Math.max(1, K * 1.4), true);
    const s = Math.min(W * 0.16, H * 0.12, 130);
    glowText('ASTEROİT', W / 2, H * 0.32, s, PALE, AMB, W * 0.88);
    glowText('AVCISI', W / 2, H * 0.32 + s * 0.95, s * 0.8, AMB, HOT, W * 0.8);
    ctx.save(); ctx.globalAlpha = 0.6 + 0.4 * Math.sin(T * 4);
    glowText('Başlamak için dokun / tıkla', W / 2, H * 0.32 + s * 1.9, Math.min(W * 0.058, 28), PALE, HOT, W * 0.9); ctx.restore();
    glowText(isTouch ? 'Ekran tuşları: döndür · itki · ateş' : 'Ok tuşları: döndür / itki · Boşluk: ateş', W / 2, H * 0.32 + s * 1.9 + 38, Math.min(W * 0.04, 19), 'rgba(255,220,170,0.8)', AMB, W * 0.92, 500);
    if (best > 0) glowText('En iyi: ' + best, W / 2, H * 0.32 + s * 1.9 + 72, Math.min(W * 0.048, 22), AMB, AMB, W * 0.9);
  } else {
    drawHud();
    if (showPad && state === 'play') drawPad();
    if (state === 'over') overlay('OYUN BİTTİ', [['Skor: ' + score + '  ·  Dalga ' + wave, PALE], [newBest ? 'Yeni rekor!' : 'En iyi: ' + best, AMB]], overT > 0.9 ? 'Tekrar için dokun / tıkla' : '');
    else if (paused) overlay('DURAKLATILDI', [['Skor: ' + score, PALE]], 'Devam etmek için dokun');
  }
  ctx.restore();
  crt(); drawMute(PALE);
}

// ---------- input ----------
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  if (e.pointerType === 'touch') isTouch = true;
  if (inMute(e.clientX, e.clientY)) { toggleMute(); return; }
  if (paused) { paused = false; return; }
  if (state === 'title') { showPad = isTouch; newGame(); return; }
  if (state === 'over') { if (overT > 0.9) { showPad = isTouch; newGame(); } return; }
  showPad = true;
  const n = padHit(e.clientX, e.clientY);
  if (n) { ptrs.set(e.pointerId, n); try { cv.setPointerCapture(e.pointerId); } catch (er) {} }
});
cv.addEventListener('pointermove', e => { if (ptrs.has(e.pointerId)) { const n = padHit(e.clientX, e.clientY); if (n) ptrs.set(e.pointerId, n); } });
const up = e => { ptrs.delete(e.pointerId); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up); cv.addEventListener('lostpointercapture', up);
window.addEventListener('keydown', e => {
  const k = e.key; if (k.startsWith('Arrow') || k === ' ' || e.code === 'Space') e.preventDefault();
  initAudio(); keys[k.length === 1 ? k.toLowerCase() : k] = true;
  if (k === 'm' || k === 'M') { toggleMute(); return; }
  if ((k === 'p' || k === 'P' || k === 'Escape') && state === 'play') { paused = !paused; setThrustSound(false); return; }
  if (paused) { if (k === ' ' || k === 'Enter') { paused = false; keys[' '] = false; } return; }
  if (k === ' ' || k === 'Enter') { if (state === 'title') { newGame(); keys[' '] = false; } else if (state === 'over' && overT > 0.9) { newGame(); keys[' '] = false; } }
});
window.addEventListener('keyup', e => { const k = e.key; keys[k.length === 1 ? k.toLowerCase() : k] = false; });
window.addEventListener('blur', () => { keys = {}; ptrs.clear(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (state === 'play') paused = true; keys = {}; ptrs.clear(); setThrustSound(false); if (AC && AC.state === 'running') AC.suspend(); }
  else { if (AC) AC.resume(); last = performance.now(); }
});

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, Math.max(0, (now - last) / 1000)); last = now;
  if (!paused) update(dt); else T += dt;
  if (paused && ship && ship.thr) { ship.thr = false; setThrustSound(false); }
  draw(); requestAnimationFrame(frame);
}
resize();
for (let i = 0; i < 6; i++) rocks.push(makeRock(Math.random() * W, Math.random() * H, 1 + i % 3));
requestAnimationFrame(frame);
</script>
