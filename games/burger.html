<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Burger Yığ – KSB Games</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head>
<body><canvas id="c"></canvas><script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),ID='burger';let W=1,H=1,S=1,best=0,AC,muted=false,state='title',score=0,shake=0,tm=0,parts=[],ot=0;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);S=Math.min(W,H)}
addEventListener('resize',rs);rs();
try{best=+localStorage.getItem('ksb-'+ID+'-best')||0}catch(e){}
function sv(){if(score>best){best=score;try{localStorage.setItem('ksb-'+ID+'-best',best)}catch(e){}}}
function snd(f,d,t,v,sl){if(muted||!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);a.gain.setValueAtTime(v||.06,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function T(s,x,y,z,c,a,w){g.font=(w||700)+' '+z+'px Fredoka,Nunito,system-ui,sans-serif';g.textAlign=a||'center';g.textBaseline='middle';g.fillStyle=c||'#fff';g.fillText(s,x,y)}
function RR(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function P(x,y,n,c,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(sp||150)*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.7,c})}}
function upP(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt}parts=parts.filter(p=>p.l>0)}
function drP(){for(const p of parts){g.globalAlpha=Math.max(0,p.l/.7);g.fillStyle=p.c;g.fillRect(p.x-2,p.y-2,4,4)}g.globalAlpha=1}
function titleScr(name,sub,y0){const z=Math.min(S*.15,W*.92/(name.length*.62));y0=y0||H*.3;g.save();g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=z*.2;g.shadowOffsetY=z*.06;T(name,W/2,y0+Math.sin(tm*2)*z*.05,z,'#fff',0,800);g.restore();if(sub)T(sub,W/2,y0+z*.85,Math.max(13,z*.3),'rgba(255,255,255,.9)',0,500);g.globalAlpha=.65+.35*Math.sin(tm*4);T('Başlamak için dokun / tıkla',W/2,H*.78,Math.max(15,Math.min(S*.05,30)),'#fff',0,700);g.globalAlpha=1;if(best)T('En iyi: '+best,W/2,H*.78+Math.max(28,S*.08),Math.max(13,S*.035),'#ffe',0,500)}
function overScr(t,l2){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,H);const z=Math.min(S*.11,W*.9/(t.length*.62));T(t,W/2,H*.32,z,'#fff',0,800);T('Skor: '+score,W/2,H*.32+z*1.1,z*.55,'#ffd54a');T('En iyi: '+best,W/2,H*.32+z*1.8,z*.4,'#fff',0,500);if(l2)T(l2,W/2,H*.32+z*2.4,z*.35,'#cde',0,500);if(ot>.5){g.globalAlpha=.6+.4*Math.sin(tm*4);T('Tekrar için dokun / tıkla',W/2,H*.75,Math.max(15,Math.min(S*.05,30)));g.globalAlpha=1}}
const IN={down(){},up(){},mv(){},kd(){},ku(){}};
function initA(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
cv.addEventListener('pointerdown',e=>{e.preventDefault();initA();if(e.clientX>W-50&&e.clientY<50){muted=!muted;return}IN.down(e.clientX,e.clientY,e.pointerId)});
addEventListener('pointerup',e=>IN.up(e.clientX,e.clientY,e.pointerId));
addEventListener('pointercancel',e=>IN.up(e.clientX,e.clientY,e.pointerId));
addEventListener('pointermove',e=>IN.mv(e.clientX,e.clientY,e.pointerId));
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();initA();if(e.repeat)return;if(e.key==='m'||e.key==='M'){muted=!muted;return}IN.kd(e.key)});
addEventListener('keyup',e=>IN.ku(e.key));
function spk(){const x=W-26,y=26;g.save();g.globalAlpha=.8;g.fillStyle='#fff';g.fillRect(x-9,y-4,5,8);g.beginPath();g.moveTo(x-4,y-4);g.lineTo(x+2,y-9);g.lineTo(x+2,y+9);g.lineTo(x-4,y+4);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();if(muted){g.moveTo(x+5,y-5);g.lineTo(x+13,y+5);g.moveTo(x+13,y-5);g.lineTo(x+5,y+5)}else g.arc(x+2,y,7,-1,1);g.stroke();g.restore()}
let last=performance.now();
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;if(document.hidden)dt=0;tm+=dt;if(state==='over')ot+=dt;shake=Math.max(0,shake-dt*40);if(dt>0)step(dt);g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);render();g.restore();spk();requestAnimationFrame(loop)}
/* ---- game ---- */
const BC={bun:'#e0a030',top:'#e0a030',patty:'#6b3a1e',cheese:'#ffd23f',tomato:'#e63946',lettuce:'#6fcf5a',onion:'#d7a9e3'},BN={patty:'Köfte',cheese:'Peynir',tomato:'Domates',lettuce:'Marul',onion:'Soğan',top:'Üst ekmek'},FIL=['patty','cheese','tomato','lettuce','onion'];
let stk=[],cur=null,ord=[],idx=0,w0=200,ph=40,baseY=700,combo=0,deb=[],msg='',mt=0,round=0,dn=0,spd=200;
function setup(){ph=Math.min(S*.06,56);baseY=H*.88;w0=Math.min(W*.6,S*.55)}
function dp(t,x,y,w,h){g.fillStyle=BC[t];if(t=='top'){g.beginPath();g.ellipse(x,y+h,w/2,h*1.0,0,Math.PI,0);g.fill();g.fillStyle='#fff3c4';for(let i=0;i<5;i++){g.fillRect(x-w*.3+i*w*.15,y+h*(.3+(i%2)*.25),3,2)}return}
 if(t=='bun'){RR(x-w/2,y,w,h,h*.4);g.fill();return}
 if(t=='cheese'){g.beginPath();g.moveTo(x-w/2,y+h*.1);g.lineTo(x+w/2,y+h*.1);g.lineTo(x+w/2,y+h*.6);g.lineTo(x+w*.15,y+h*.6);g.lineTo(x,y+h);g.lineTo(x-w*.15,y+h*.6);g.lineTo(x-w/2,y+h*.6);g.fill();return}
 if(t=='lettuce'){g.beginPath();g.moveTo(x-w/2,y+h*.2);for(let i=0;i<=8;i++)g.lineTo(x-w/2+w*i/8,y+h*(i%2?.9:.45));g.lineTo(x+w/2,y+h*.2);g.fill();return}
 RR(x-w/2+2,y+h*.1,w-4,h*.8,h*.3);g.fill();if(t=='patty'){g.fillStyle='rgba(255,255,255,.12)';g.fillRect(x-w*.3,y+h*.3,w*.2,3)}}
function newRound(){setup();ord=[];const n=Math.min(6,3+Math.floor(round/2));for(let i=0;i<n;i++)ord.push(FIL[Math.floor(Math.random()*5)]);ord.push('top');idx=0;const bw=Math.max(w0*.55,w0*(1-.06*round));stk=[{x:W/2,w:bw,t:'bun'}];dn=0;spawn()}
function spawn(){const t=stk[stk.length-1];spd=Math.min(S*1.5,S*(.5+.05*round+.02*idx));cur={t:ord[idx],w:t.w,x:t.w/2+2,dir:1,y:H*.18,drop:0,vy:0}}
function go(){if(state==='title'||(state==='over'&&ot>.5)){score=0;round=0;combo=0;deb=[];state='play';newRound()}}
function drop(){if(state!=='play'){go();return}if(cur&&!cur.drop&&!dn){cur.drop=1;snd(300,.12,'triangle',.05,-100)}}
IN.down=drop;IN.kd=k=>{if(k===' '||k==='ArrowDown'||k==='Enter')drop()};
function land(){const top=stk[stk.length-1],l=Math.max(cur.x-cur.w/2,top.x-top.w/2),r=Math.min(cur.x+cur.w/2,top.x+top.w/2),ov=r-l;
 if(ov<=ph*.25){deb.push({t:cur.t,x:cur.x,y:cur.y,w:cur.w,vy:0,vx:cur.x<top.x?-80:80});cur=null;shake=12;snd(120,.5,'sawtooth',.08,-80);sv();state='over';ot=0;return}
 let pts=10;if(Math.abs(cur.x-top.x)<Math.max(6,cur.w*.05)){cur.x=top.x;combo++;pts+=combo*5;snd(600+combo*60,.2,'sine',.08,300);P(cur.x,cur.y+ph/2,10,'#fff',140);if(combo%3==0)cur.w=Math.min(w0,cur.w*1.12);msg='Mükemmel!';mt=.6}
 else{combo=0;const a=cur.x<top.x?[cur.x-cur.w/2,l]:[r,cur.x+cur.w/2];deb.push({t:cur.t,x:(a[0]+a[1])/2,y:cur.y,w:a[1]-a[0],vy:0,vx:cur.x<top.x?-60:60});cur.w=ov;cur.x=(l+r)/2;snd(260,.1,'square',.06)}
 stk.push({x:cur.x,w:cur.w,t:cur.t});score+=pts;sv();idx++;cur=null;
 if(idx>=ord.length){score+=50;sv();msg='Sipariş tamam! +50';mt=1.2;dn=.01;snd(900,.4,'triangle',.08,500);P(W/2,baseY-ph*3,24,'#ffd23f',240)}else spawn()}
function step(dt){upP(dt);setup();mt=Math.max(0,mt-dt);for(const d of deb){d.vy+=2000*dt;d.y+=d.vy*dt;d.x+=d.vx*dt}deb=deb.filter(d=>d.y<H+80);
 if(state!=='play')return;if(dn){dn+=dt;if(dn>1){round++;newRound()}return}
 if(!cur)return;if(!cur.drop){cur.x+=cur.dir*spd*dt;if(cur.x>W-cur.w/2){cur.x=W-cur.w/2;cur.dir=-1}else if(cur.x<cur.w/2){cur.x=cur.w/2;cur.dir=1}}
 else{cur.vy=Math.min(cur.vy+4000*dt,1800);cur.y+=cur.vy*dt;const ly=baseY-(stk.length+1)*ph;if(cur.y>=ly){cur.y=ly;land()}}}
function render(){setup();
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#ffb347');gr.addColorStop(1,'#ff7e5f');g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.fillStyle='rgba(255,255,255,.08)';const q=S/8;for(let i=0;i<W/q+1;i++)for(let j=0;j<H/q+1;j++)if((i+j)%2)g.fillRect(i*q,j*q,q,q);
 g.fillStyle='#fff';g.beginPath();g.ellipse(W/2,baseY+4,Math.max(w0,S*.5)*.62,ph*.35,0,0,7);g.fill();g.fillStyle='rgba(0,0,0,.12)';g.fillRect(0,baseY+ph*.3,W,H);
 if(state==='title'){const w=S*.4,p=S*.07;const L=['bun','patty','cheese','tomato','lettuce','patty','top'];for(let i=0;i<L.length;i++){const bob=Math.sin(tm*3+i*.7)*S*.012;dp(L[i],W/2+bob,H*.62-i*p*.95,w*(1-.04*Math.abs(i-3)),p)}titleScr('Burger Yığ','Malzemeleri tam üst üste bırak!',H*.15);return}
 const oy=dn?Math.pow(Math.min(1,dn),2)*H:0;
 for(let i=0;i<stk.length;i++){const s=stk[i];dp(s.t,s.x,baseY-(i+1)*ph+oy,s.w,ph)}
 if(cur){g.save();if(!cur.drop){g.strokeStyle='rgba(255,255,255,.25)';g.setLineDash([6,6]);g.beginPath();g.moveTo(cur.x,cur.y+ph);g.lineTo(cur.x,baseY-(stk.length+1)*ph);g.stroke()}g.restore();dp(cur.t,cur.x,cur.y,cur.w,ph)}
 for(const d of deb)dp(d.t,d.x,d.y,d.w,ph);drP();
 const mw=S*.1,mh=Math.max(10,S*.028),mx=12,my0=H*.62;T('Sipariş',mx+mw/2,my0-(ord.length+1)*(mh+3)-6,Math.max(11,S*.032),'#fff',0,700);
 for(let i=ord.length-1;i>=0;i--){const y=my0-(i+1)*(mh+3);g.globalAlpha=i<idx?.3:1;dp(ord[i],mx+mw/2,y,mw,mh);g.globalAlpha=1;if(i==idx&&cur){g.strokeStyle='#fff';g.lineWidth=2;g.strokeRect(mx-3,y-2,mw+6,mh+4)}}
 const z=Math.max(15,Math.min(S*.05,26));T('Skor '+score,W/2,z+2,z*1.2,'#fff');if(combo>1)T('Seri x'+combo,W/2,z*2.5,z*.8,'#fff3a0');if(cur)T('Sıradaki: '+BN[cur.t],W/2,H*.1,z*.8,'#fff',0,600);
 if(mt>0){g.globalAlpha=Math.min(1,mt*2);T(msg,W/2,H*.3,S*.07,'#fff',0,800);g.globalAlpha=1}
 if(state==='over')overScr('Burger Yıkıldı','Tamamlanan sipariş: '+round)}
requestAnimationFrame(loop);
</script></body></html>
