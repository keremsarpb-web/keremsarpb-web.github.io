<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Top Sektirme</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#12304f;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
const BK='ksb-top-sektirme-best';
'use strict';
const cv=document.getElementById('c'),g=cv.getContext('2d');let W=1,H=1,T=0;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth||1;H=innerHeight||1;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
let best=0;try{best=+localStorage.getItem(BK)||0}catch(e){}
function saveBest(s){if(s>best){best=s;try{localStorage.setItem(BK,String(s))}catch(e){}return true}return false}
let AC=null,muted=false;
function snd(f,d,t,v,sl){if(muted||!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(sl,n+d);a.gain.setValueAtTime(v||.12,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume()}
const keys={};let onDown=()=>{},onMove=()=>{},onUp=()=>{},onKey=()=>{};
const pp=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{initAudio();const[x,y]=pp(e);if(x>W-46&&y<46){muted=!muted;return}try{cv.setPointerCapture(e.pointerId)}catch(_){}onDown(x,y)});
cv.addEventListener('pointermove',e=>{const[x,y]=pp(e);onMove(x,y)});
cv.addEventListener('pointerup',e=>{const[x,y]=pp(e);onUp(x,y)});
cv.addEventListener('pointercancel',e=>{const[x,y]=pp(e);onUp(x,y)});
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.key==' ')e.preventDefault();initAudio();if(e.key=='m'||e.key=='M'){muted=!muted;return}if(!keys[e.key])onKey(e.key);keys[e.key]=1});
addEventListener('keyup',e=>{keys[e.key]=0});
const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function tx(s,x,y,sz,c,al,w){g.font=(w||'700')+' '+Math.max(6,sz|0)+'px Fredoka,Nunito,system-ui,sans-serif';g.textAlign=al||'center';g.textBaseline='middle';g.fillStyle=c||'#fff';g.fillText(s,x,y)}
function spk(){g.save();g.globalAlpha=.85;g.fillStyle='#fff';const x=W-30,y=22;g.beginPath();g.moveTo(x-8,y-3);g.lineTo(x-4,y-3);g.lineTo(x+1,y-8);g.lineTo(x+1,y+8);g.lineTo(x-4,y+3);g.lineTo(x-8,y+3);g.fill();g.lineWidth=2;if(muted){g.strokeStyle='#f66';g.beginPath();g.moveTo(x+4,y-5);g.lineTo(x+12,y+5);g.moveTo(x+12,y-5);g.lineTo(x+4,y+5);g.stroke()}else{g.strokeStyle='#fff';g.beginPath();g.arc(x+1,y,6,-1,1);g.stroke()}g.restore()}
let S=1,OX=0,OY=0;function fit(a,b){S=Math.min(W/a,H/b);OX=(W-a*S)/2;OY=(H-b*S)/2}
const P2=(x,y)=>[(x-OX)/S,(y-OY)/S];
const PT=[];function burst(x,y,n,c,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=(.3+Math.random())*(sp||200);PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.5,c,r:2+Math.random()*3})}}
function pstep(dt){for(const p of PT){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt}for(let i=PT.length-1;i>=0;i--)if(PT[i].l<=0)PT.splice(i,1)}
function pdraw(){for(const p of PT){g.globalAlpha=cl(p.l*2,0,1);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,6.3);g.fill()}g.globalAlpha=1}
function ttl(n,sub){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,W,H);g.save();g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=24;const fs=Math.min(W*.13,H*.11,110);tx(n,W/2,H*.3,fs,'#fff','center','800');g.shadowBlur=0;tx(sub,W/2,H*.3+fs*.8,Math.min(W*.05,H*.035,28),'#ffe08a','center','600');g.globalAlpha=.6+.4*Math.sin(T*4);tx('Başlamak için dokun / tıkla',W/2,H*.8,Math.min(W*.055,H*.04,30),'#fff');g.globalAlpha=1;if(best)tx('En iyi: '+best,W/2,H*.87,Math.min(W*.045,H*.03,22),'#ccc','center','600');g.restore()}
function ovr(a,b,c){g.fillStyle='rgba(0,0,0,.62)';g.fillRect(0,0,W,H);tx(a,W/2,H*.3,Math.min(W*.12,H*.09,90),'#fff','center','800');tx(b,W/2,H*.42,Math.min(W*.06,H*.04,34),'#ffe08a');if(c)tx(c,W/2,H*.5,Math.min(W*.05,H*.035,28),'#ccc','center','600');g.globalAlpha=.6+.4*Math.sin(T*4);tx('Tekrar için dokun / tıkla',W/2,H*.72,Math.min(W*.055,H*.04,30),'#fff');g.globalAlpha=1}
let last=performance.now(),UP=()=>{},DR=()=>{};
function loop(t){requestAnimationFrame(loop);const dt=cl((t-last)/1000,0,.033);last=t;if(document.hidden)return;T+=dt;UP(dt);DR();spk()}
document.addEventListener('visibilitychange',()=>{last=performance.now()});
requestAnimationFrame(loop);
const GY=640;let st='title',b,score=0,combo=0,pops=[],rings=[],foot=200,shk=0,overT=0,newBest=false,stars=[];
for(let i=0;i<50;i++)stars.push([rnd(-100,500),rnd(0,420),rnd(.5,2)]);
function reset(){b={x:200,y:260,vx:0,vy:0,r:38,rot:0,sp:0}}
function start(){reset();score=0;combo=0;pops=[];st='play';newBest=false}
reset();
function kick(tx,ty){const dx=b.x-tx,d=Math.hypot(dx,b.y-ty);if(d>b.r+34)return false;
 const per=Math.abs(dx)<b.r*.22;combo++;const add=per?2:1;score+=add;
 b.vy=-(700+Math.min(combo,12)*6)-(per?30:0);b.vx=b.vx*.3+dx/b.r*280;b.sp=cl(b.sp*.4+dx/b.r*9,-14,14);
 pops.push({s:per?'Mükemmel +2':'+1',x:b.x,y:b.y-b.r,t:0,c:per?'#ffd23f':'#fff'});rings.push({x:b.x,y:b.y+b.r*.6,t:0});burst(b.x,b.y+b.r*.7,per?18:8,per?'#ffd23f':'#fff',180);
 snd(per?420:300,.12,'triangle',.18,per?760:180);if(combo%10==0)snd(900,.3,'square',.08);return true}
UP=dt=>{pstep(dt);shk=Math.max(0,shk-dt*30);overT+=dt;for(const p of pops)p.t+=dt;pops=pops.filter(p=>p.t<.8);for(const r of rings)r.t+=dt;rings=rings.filter(r=>r.t<.4);
 if(st=='title'){b.x=200+Math.sin(T*1.5)*50;b.y=360+Math.abs(Math.sin(T*2.2))*-120;b.rot+=dt*3;return}if(st!='play')return;
 const gr=Math.min(1500,900+score*7);b.r=Math.max(26,38-score*.08);
 if(keys.ArrowLeft)foot-=380*dt;if(keys.ArrowRight)foot+=380*dt;foot=cl(foot,30,370);
 b.vy+=gr*dt;b.vx+=b.sp*9*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=b.sp*dt+b.vx*dt*.01;b.sp*=Math.exp(-.35*dt);
 if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.8;b.sp=-b.sp*.6;snd(160,.05,'sine',.08)}if(b.x>400-b.r){b.x=400-b.r;b.vx=-Math.abs(b.vx)*.8;b.sp=-b.sp*.6;snd(160,.05,'sine',.08)}
 if(b.y<-300)b.y=-300;
 if(b.y>GY-b.r){st='over';overT=0;newBest=saveBest(score);shk=10;snd(120,.4,'sawtooth',.2,50);burst(b.x,GY,25,'#8b5',200)}};
onDown=(x,y)=>{if(st=='title'){start();return}if(st=='over'){if(overT>.5)start();return}const[a,c]=P2(x,y);if(!kick(a,c)){combo=0}};
onKey=k=>{if(st=='title'){start();return}if(st=='over'){if(overT>.5)start();return}if(k==' '||k=='ArrowUp'||k=='Enter'){if(!kick(foot,b.y+b.r*.5)){combo=0}}};
function ballD(){g.save();g.translate(b.x,b.y);g.fillStyle='#0004';g.restore();g.fillStyle='#0004';g.beginPath();g.ellipse(b.x,GY+8,b.r*.9*(1-Math.min(.6,(GY-b.y)/700)),6,0,0,6.3);g.fill();
 g.save();g.translate(b.x,b.y);g.rotate(b.rot);g.fillStyle='#fff';g.beginPath();g.arc(0,0,b.r,0,6.3);g.fill();g.clip();g.fillStyle='#222';
 const pent=(x,y,s)=>{g.beginPath();for(let i=0;i<5;i++){const a=i*1.2566-1.5708;g.lineTo(x+Math.cos(a)*s,y+Math.sin(a)*s)}g.fill()};pent(0,0,b.r*.34);for(let i=0;i<5;i++){const a=i*1.2566;pent(Math.cos(a)*b.r*.95,Math.sin(a)*b.r*.95,b.r*.3)}
 g.strokeStyle='#0003';g.lineWidth=2;for(let i=0;i<5;i++){const a=i*1.2566;g.beginPath();g.moveTo(Math.cos(a)*b.r*.34,Math.sin(a)*b.r*.34);g.lineTo(Math.cos(a)*b.r*.7,Math.sin(a)*b.r*.7);g.stroke()}g.restore();
 g.strokeStyle='#0003';g.lineWidth=2;g.beginPath();g.arc(b.x,b.y,b.r,0,6.3);g.stroke()}
DR=()=>{const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0a1633');gr.addColorStop(1,'#1c4a7a');g.fillStyle=gr;g.fillRect(0,0,W,H);fit(400,700);g.save();g.translate(OX+(shk?rnd(-shk,shk):0),OY);g.scale(S,S);
 for(const s of stars){g.globalAlpha=.4+.4*Math.sin(T*2+s[0]);g.fillStyle='#fff';g.fillRect(s[0],s[1],s[2],s[2])}g.globalAlpha=1;
 g.fillStyle='#0d2b4d';for(let i=0;i<9;i++)g.fillRect(-300+i*110,GY-110-(i*37%30),90,200);g.fillStyle='#ffd23f55';for(let i=0;i<40;i++)g.fillRect(-300+(i*53%1000),GY-95+(i*17%60),3,3);
 g.fillStyle='#2e8b3e';g.fillRect(-1000,GY,2400,500);g.fillStyle='#37a24a';for(let i=-12;i<16;i++)g.fillRect(i*80,GY,40,500);g.fillStyle='#fff6';g.fillRect(-1000,GY,2400,3);
 for(const r of rings){g.strokeStyle='rgba(255,255,255,'+(1-r.t*2.5)+')';g.lineWidth=3;g.beginPath();g.arc(r.x,r.y,b.r*.6+r.t*100,0,6.3);g.stroke()}
 if(st=='play'){const sh=cl((b.y-100)/540,0,1);g.fillStyle='#fff1';g.fillRect(0,0,400,0)}
 ballD();pdraw();
 for(const p of pops){g.globalAlpha=1-p.t/.8;tx(p.s,p.x,p.y-p.t*50,26,p.c,'center','800')}g.globalAlpha=1;
 if(st=='play'){tx(String(score),200,70,72,'#fff','center','800');if(combo>2)tx('Seri x'+combo,200,125,22,'#ffd23f');tx('En iyi '+best,20,28,16,'#9bd','left','600');if(score==0&&b.vy<400)tx('Topa dokun!',200,520,24,'#fff','center','600');
  g.fillStyle='#ffd23f';g.fillRect(foot-14,GY+14,28,6)}
 g.restore();if(st=='title')ttl('Top Sektirme','Topu yere düşürme!');
 if(st=='over')ovr('DÜŞTÜ!',score+' sektirme',newBest&&score>0?'Yeni rekor!':'En iyi: '+best)};

</script></body></html>
