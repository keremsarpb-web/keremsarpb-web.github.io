<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>XOX</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#071a22;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
'use strict';
const ID='xox',FF='"Baloo 2",system-ui,sans-serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=1,H=1,DPR=1,hidden=false,last=performance.now(),t=0;
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}};
let best=+store.get('ksb-'+ID+'-best',0)||0,muted=store.get('ksb-'+ID+'-mute','0')==='1';
let AC=null,master=null;
function audio(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination)}catch(e){AC=null}}
function tone(f,d,type,v,f2,dl){if(!AC||muted)return;const s=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v||.2,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(master);o.start(s);o.stop(s+d+.05)}
function toggleMute(){muted=!muted;store.set('ksb-'+ID+'-mute',muted?'1':'0');if(master)master.gain.value=muted?0:.5}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function txt(s,x,y,sz,col,al,wt,glow){ctx.font=(wt||800)+' '+Math.max(6,sz|0)+'px '+FF;ctx.textAlign=al||'center';ctx.textBaseline='middle';if(glow){ctx.shadowColor=glow;ctx.shadowBlur=sz*.4}ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.shadowBlur=0}
const btns=[];
function button(label,x,y,w,h,fn,col,on){rr(x,y,w,h,h*.5);ctx.fillStyle=on?col:'rgba(255,255,255,.06)';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=col;ctx.stroke();txt(label,x+w/2,y+h/2+2,Math.min(h*.46,w/(label.length*.6)),on?'#071a22':'#fff');btns.push({x,y,w,h,fn})}
function hitBtn(x,y){for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();return true}}return false}
function drawMute(){const x=W-44,y=10;ctx.save();ctx.fillStyle='rgba(255,255,255,.12)';rr(x,y,34,34,10);ctx.fill();ctx.fillStyle=ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+7,y+13);ctx.lineTo(x+12,y+13);ctx.lineTo(x+18,y+8);ctx.lineTo(x+18,y+26);ctx.lineTo(x+12,y+21);ctx.lineTo(x+7,y+21);ctx.closePath();ctx.fill();ctx.beginPath();if(muted){ctx.moveTo(x+21,y+13);ctx.lineTo(x+28,y+21);ctx.moveTo(x+28,y+13);ctx.lineTo(x+21,y+21)}else{ctx.arc(x+19,y+17,5,-.9,.9);ctx.moveTo(x+24.5,y+10);ctx.arc(x+19,y+17,9,-.9,.9)}ctx.stroke();ctx.restore()}
function drawHome(){const x=10,y=10;ctx.fillStyle='rgba(255,255,255,.12)';rr(x,y,34,34,10);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(x+17,y+8);ctx.lineTo(x+27,y+17);ctx.lineTo(x+24,y+17);ctx.lineTo(x+24,y+26);ctx.lineTo(x+10,y+26);ctx.lineTo(x+10,y+17);ctx.lineTo(x+7,y+17);ctx.closePath();ctx.fill()}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);layout()}
// ---------- Mantık ----------
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function winner(b){for(const l of LINES)if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[1]]===b[l[2]])return{w:b[l[0]],line:l};for(let i=0;i<9;i++)if(!b[i])return null;return{w:0,line:null}}
function minimax(b,p,me,d){const r=winner(b);if(r)return r.w===0?0:r.w===me?10-d:d-10;let bv=p===me?-99:99;for(let i=0;i<9;i++)if(!b[i]){b[i]=p;const v=minimax(b,3-p,me,d+1);b[i]=0;if(p===me?v>bv:v<bv)bv=v}return bv}
function bestMove(b,me){if(b.every(v=>!v))return[0,2,4,6,8][Math.random()*5|0];let bv=-99,mv=[];for(let i=0;i<9;i++)if(!b[i]){b[i]=me;const v=minimax(b,3-me,me,1);b[i]=0;if(v>bv){bv=v;mv=[i]}else if(v===bv)mv.push(i)}return mv[Math.random()*mv.length|0]}
function easyMove(b,me){const free=[];for(let i=0;i<9;i++)if(!b[i])free.push(i);const find=p=>{for(const i of free){b[i]=p;const w=winner(b);b[i]=0;if(w&&w.w===p)return i}return -1};let m=find(me);if(m>=0&&Math.random()<.7)return m;m=find(3-me);if(m>=0&&Math.random()<.45)return m;return free[Math.random()*free.length|0]}
// ---------- Oyun ----------
const CX='#ff6b6b',CO='#4ee6c1',GOLD='#ffd166',MODES=['KOLAY','ZOR','2 KİŞİLİK'];
let state='title',sel=0,mode=0,board=Array(9).fill(0),marks=[],turn=1,starter=2,result=null,tally={x:0,o:0,d:0},streak=0,aiDelay=0,parts=[],hover=-1,kb=4,kbOn=false,resT=0,decor=[];
let S=300,gx=0,gy=0;
function layout(){S=Math.min(W*.84,H*.5,560);gx=(W-S)/2;gy=H*.54-S/2}
function newMatch(m){mode=m;tally={x:0,o:0,d:0};starter=2;state='play';nextRound();tone(392,.1,'triangle',.12);tone(587,.15,'triangle',.12,0,.09)}
function nextRound(){board=Array(9).fill(0);marks=[];result=null;starter=3-starter;turn=starter;if(mode<2&&turn===2)aiDelay=.6}
function place(i){if(state!=='play'||result||board[i]||i<0||i>8)return false;board[i]=turn;marks.push({i,p:turn,t0:t});if(turn===1)tone(560,.09,'triangle',.14,760);else tone(380,.12,'sine',.16,300);const r=winner(board);if(r)endRound(r);else{turn=3-turn;if(mode<2&&turn===2)aiDelay=.45+Math.random()*.3}return true}
function endRound(r){result={w:r.w,line:r.line,t:t};resT=0;if(r.w===1)tally.x++;else if(r.w===2)tally.o++;else tally.d++;
 if(mode<2){if(r.w===1){streak++;if(streak>best){best=streak;store.set('ksb-'+ID+'-best',best)}}else if(r.w===2)streak=0}
 if(r.line){const c=r.w===1?CX:CO;for(const i of r.line){const [x,y]=cc(i);for(let k=0;k<18;k++){const a=Math.random()*6.28,v=S*(.2+Math.random()*.8);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-S*.4,l:0,m:.8+Math.random()*.6,c:k%3?c:GOLD,r:Math.random()*6.28})}}}
 const good=mode===2||r.w===1;if(r.w===0)[392,349].forEach((f,i)=>tone(f,.25,'triangle',.12,0,i*.15));else if(good)[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.13,0,.25+i*.1));else[440,370,311,262].forEach((f,i)=>tone(f,.3,'sawtooth',.07,0,.25+i*.14))}
function cc(i){return[gx+(i%3+.5)*S/3,gy+((i/3|0)+.5)*S/3]}
function cellAt(x,y){if(x<gx||y<gy||x>gx+S||y>gy+S)return -1;return Math.min(2,(y-gy)/(S/3)|0)*3+Math.min(2,(x-gx)/(S/3)|0)}
function humanTurn(){return state==='play'&&!result&&(mode===2||turn===1)}
function update(dt){for(const p of parts){p.l+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=S*1.6*dt;p.r+=dt*6}parts=parts.filter(p=>p.l<p.m);for(const d of decor){d.y-=d.v*dt;d.a+=d.va*dt;if(d.y<-60){d.y=H+60;d.x=Math.random()*W}}
 if(state!=='play')return;if(result){resT+=dt;return}if(mode<2&&turn===2){aiDelay-=dt;if(aiDelay<=0)place(mode===1?bestMove(board,2):easyMove(board,2))}}
// ---------- Çizim ----------
function drawX(x,y,s,k,c,lw){const h=s*.3;ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.lineCap='round';ctx.shadowColor=c;ctx.shadowBlur=lw*1.5;const k1=Math.min(1,k*2),k2=Math.max(0,k*2-1);ctx.beginPath();ctx.moveTo(x-h,y-h);ctx.lineTo(x-h+2*h*k1,y-h+2*h*k1);if(k2>0){ctx.moveTo(x+h,y-h);ctx.lineTo(x+h-2*h*k2,y-h+2*h*k2)}ctx.stroke();ctx.shadowBlur=0}
function drawO(x,y,s,k,c,lw){ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.lineCap='round';ctx.shadowColor=c;ctx.shadowBlur=lw*1.5;ctx.beginPath();ctx.arc(x,y,s*.3,-Math.PI/2,-Math.PI/2+6.2832*k);ctx.stroke();ctx.shadowBlur=0}
function ease(k){k=Math.min(1,Math.max(0,k));return 1-Math.pow(1-k,3)}
function bg(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0f3442');g.addColorStop(1,'#061218');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);const r=ctx.createRadialGradient(W/2,H*.45,0,W/2,H*.45,Math.max(W,H)*.6);r.addColorStop(0,'rgba(78,230,193,.10)');r.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=r;ctx.fillRect(0,0,W,H);
 ctx.globalAlpha=.12;for(const d of decor){ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.a);if(d.o)drawO(0,0,d.s,1,CO,d.s*.08);else drawX(0,0,d.s,1,CX,d.s*.08);ctx.restore()}ctx.globalAlpha=1}
function drawBoard(){const c=S/3,lw=Math.max(4,S*.022);ctx.strokeStyle='rgba(232,244,242,.85)';ctx.lineWidth=lw;ctx.lineCap='round';ctx.shadowColor='rgba(232,244,242,.6)';ctx.shadowBlur=10;ctx.beginPath();for(let i=1;i<3;i++){ctx.moveTo(gx+i*c+Math.sin(i*3.1)*2,gy+6);ctx.lineTo(gx+i*c-Math.sin(i*1.7)*2,gy+S-6);ctx.moveTo(gx+6,gy+i*c+Math.sin(i*2.3)*2);ctx.lineTo(gx+S-6,gy+i*c-Math.sin(i*4.1)*2)}ctx.stroke();ctx.shadowBlur=0;
 const mw=Math.max(5,S*.032);for(const m of marks){const [x,y]=cc(m.i),k=ease((t-m.t0)/.28),win=result&&result.line&&result.line.includes(m.i),pul=win?1+Math.sin(t*8)*.06:1;ctx.save();ctx.translate(x,y);ctx.scale(pul,pul);if(m.p===1)drawX(0,0,c,k,CX,mw);else drawO(0,0,c,k,CO,mw);ctx.restore()}
 const ht=humanTurn();if(ht&&hover>=0&&!board[hover]){const [x,y]=cc(hover);ctx.globalAlpha=.25;if(turn===1)drawX(x,y,c,1,CX,mw);else drawO(x,y,c,1,CO,mw);ctx.globalAlpha=1}
 if(ht&&kbOn){const x=gx+(kb%3)*c,y=gy+(kb/3|0)*c;ctx.strokeStyle=GOLD;ctx.lineWidth=2;ctx.setLineDash([6,6]);rr(x+8,y+8,c-16,c-16,12);ctx.stroke();ctx.setLineDash([])}
 if(result&&result.line){const [x1,y1]=cc(result.line[0]),[x2,y2]=cc(result.line[2]),dx=x2-x1,dy=y2-y1,ex=dx*.22,ey=dy*.22,k=ease((t-result.t-.2)/.35);if(k>0){ctx.strokeStyle=GOLD;ctx.lineWidth=S*.03*(1+Math.sin(t*6)*.15);ctx.lineCap='round';ctx.shadowColor=GOLD;ctx.shadowBlur=25;ctx.beginPath();ctx.moveTo(x1-ex,y1-ey);ctx.lineTo(x1-ex+(dx+2*ex)*k,y1-ey+(dy+2*ey)*k);ctx.stroke();ctx.shadowBlur=0}}}
function drawHud(){const y=Math.max(70,gy-Math.min(70,gy*.42)),w=Math.min(S/3.2,140),h=Math.min(64,S*.2),lx=mode<2?['SEN','BERABERE','CPU']:['X','BERABERE','O'],vals=[tally.x,tally.d,tally.o],cols=[CX,'#cfe3e0',CO];
 for(let i=0;i<3;i++){const x=W/2+(i-1)*(w+10)-w/2,act=!result&&((i===0&&turn===1)||(i===2&&turn===2));ctx.fillStyle=act?'rgba(255,255,255,.14)':'rgba(255,255,255,.05)';rr(x,y-h/2,w,h,14);ctx.fill();if(act){ctx.strokeStyle=cols[i];ctx.lineWidth=2;ctx.stroke()}txt(lx[i],x+w/2,y-h*.2,h*.24,cols[i],'center',800);txt(String(vals[i]),x+w/2,y+h*.18,h*.42,'#fff','center',800)}
 txt('XOX · '+MODES[mode],W/2,27,15,'rgba(255,255,255,.55)','center',800);
 let st='';if(!result){if(mode<2)st=turn===1?'Sıra sende (X)':'Bilgisayar düşünüyor…';else st='Sıra: '+(turn===1?'X':'O')}if(st)txt(st,W/2,gy+S+Math.min(40,(H-gy-S)*.4),Math.min(W*.05,24),turn===1?CX:CO,'center',800);
 if(mode<2&&!result)txt('Seri: '+streak+' · En iyi: '+best,W/2,gy+S+Math.min(78,(H-gy-S)*.72),Math.min(W*.038,17),'rgba(255,255,255,.5)','center',500)}
function drawResult(){if(resT<.7)return;const a=Math.min(1,(resT-.7)*4);ctx.globalAlpha=a;ctx.fillStyle='rgba(6,18,24,.78)';ctx.fillRect(0,0,W,H);const w=result.w;let msg,c;if(mode<2){msg=w===1?'KAZANDIN!':w===2?'BİLGİSAYAR KAZANDI':'BERABERE';c=w===1?CX:w===2?CO:GOLD}else{msg=w?(w===1?'X':'O')+' KAZANDI!':'BERABERE';c=w===1?CX:w===2?CO:GOLD}
 const s=Math.min(W*.13,84);txt(msg,W/2,H*.32,Math.min(s,W*.9/(msg.length*.55)),'#fff','center',800,c);
 txt((mode<2?'SEN ':'X ')+tally.x+'  ·  '+tally.d+'  ·  '+tally.o+(mode<2?' CPU':' O'),W/2,H*.43,s*.4,'#cfe3e0','center',800);
 if(mode<2)txt('Seri: '+streak+' · En iyi seri: '+best,W/2,H*.5,s*.28,GOLD,'center',800);
 ctx.globalAlpha=a*(.6+.4*Math.sin(t*4));txt('Devam etmek için dokun / tıkla',W/2,H*.6,Math.min(W*.05,26),'#fff','center',500);ctx.globalAlpha=a;
 const bw=Math.min(W*.6,260),bh=Math.min(54,H*.07);button('ANA MENÜ',(W-bw)/2,H*.68,bw,bh,()=>{state='title'},CO);ctx.globalAlpha=1}
function drawTitle(){const g=Math.min(W*.24,H*.14,170),y=H*.27,lw=g*.11;['X','O','X'].forEach((ch,i)=>{const x=W/2+(i-1)*g*1.1,k=ease(((t*.5+2)%4-i*.3)/.45),bob=Math.sin(t*2+i)*g*.04;if(ch==='X')drawX(x,y+bob,g*1.5,Math.max(k,.0),CX,lw);else drawO(x,y+bob,g*1.5,k,CO,lw)});
 const k0=(t*.5+2)%4;if(k0>1.6){ctx.globalAlpha=Math.min(1,(k0-1.6)*4)*.9;ctx.strokeStyle=GOLD;ctx.lineWidth=lw*.5;ctx.shadowColor=GOLD;ctx.shadowBlur=20;ctx.beginPath();ctx.moveTo(W/2-g*1.5,y);ctx.lineTo(W/2+g*1.5,y);ctx.stroke();ctx.shadowBlur=0;ctx.globalAlpha=1}
 txt('Üçünü yan yana diz!',W/2,y+g*.85,Math.min(W*.055,28),'#cfe3e0','center',500);
 const bw=Math.min(W*.28,180),gap=Math.min(W*.03,14),bh=Math.min(56,H*.07),x0=W/2-(bw*3+gap*2)/2,y0=H*.5;
 MODES.forEach((m,i)=>button(m,x0+i*(bw+gap),y0,bw,bh,()=>{sel=i;newMatch(i)},[CO,CX,GOLD][i],sel===i));
 ctx.globalAlpha=.6+.4*Math.sin(t*4);txt('Başlamak için dokun / tıkla',W/2,y0+bh*2,Math.min(W*.055,28),'#fff','center',500);ctx.globalAlpha=1;
 txt('EN İYİ SERİ: '+best,W/2,y0+bh*2.8,Math.min(W*.045,22),GOLD,'center',800);
 txt('Zor mod yenilmez — berabere kalabilir misin?',W/2,H-40,Math.min(W*.032,16),'rgba(255,255,255,.5)','center',500)}
function draw(){btns.length=0;bg();if(state==='title')drawTitle();else{drawHud();drawBoard();for(const p of parts){ctx.globalAlpha=1-p.l/p.m;ctx.fillStyle=p.c;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillRect(-4,-2,8,4);ctx.restore()}ctx.globalAlpha=1;if(result)drawResult();drawHome()}drawMute()}
function frame(now){requestAnimationFrame(frame);let dt=(now-last)/1000;last=now;if(hidden)return;dt=Math.min(Math.max(dt,0),.05);t+=dt;update(dt);draw()}
// ---------- Girdi ----------
cv.addEventListener('pointerdown',e=>{e.preventDefault();audio();const x=e.clientX,y=e.clientY;if(x>W-54&&y<54){toggleMute();return}if(hitBtn(x,y))return;
 if(state==='title'){newMatch(sel);return}if(x<54&&y<54){state='title';return}
 if(result){if(resT>.9)nextRound();return}kbOn=false;if(humanTurn())place(cellAt(x,y))});
cv.addEventListener('pointermove',e=>{hover=e.pointerType==='mouse'?cellAt(e.clientX,e.clientY):-1});
addEventListener('keydown',e=>{const k=e.key;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Spacebar'].includes(k))e.preventDefault();audio();
 if(k==='m'||k==='M'){toggleMute();return}
 if(state==='title'){if(k==='Enter'||k===' ')newMatch(sel);else if(k>='1'&&k<='3'){sel=+k-1;newMatch(sel)}else if(k==='ArrowLeft')sel=(sel+2)%3;else if(k==='ArrowRight')sel=(sel+1)%3;return}
 if(k==='Escape'){state='title';return}if(k==='r'||k==='R'){newMatch(mode);return}
 if(result){if((k==='Enter'||k===' ')&&resT>.9)nextRound();return}
 if(!humanTurn())return;const d={ArrowLeft:-1,ArrowRight:1,ArrowUp:-3,ArrowDown:3}[k];
 if(d){kbOn=true;const n=kb+d;if(n>=0&&n<9&&!(Math.abs(d)===1&&(n/3|0)!==(kb/3|0)))kb=n}else if(k==='Enter'||k===' '){kbOn=true;place(kb)}else if(k>='1'&&k<='9'){const n=+k-1;place(n)}});
document.addEventListener('visibilitychange',()=>{hidden=document.hidden;if(hidden){if(AC)AC.suspend()}else{if(AC&&!muted)AC.resume();last=performance.now()}});
addEventListener('resize',resize);resize();
for(let i=0;i<14;i++)decor.push({o:i%2,x:Math.random()*W,y:Math.random()*H,v:8+Math.random()*20,a:Math.random()*6,va:(Math.random()-.5)*.4,s:30+Math.random()*60});
try{document.fonts&&document.fonts.load('800 40px "Baloo 2"')}catch(e){}
requestAnimationFrame(frame);
</script></body></html>
