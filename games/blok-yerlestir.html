<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Blok Yerleştir · KSB Games</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#171a33;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100vw;height:100vh;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const KEY='ksb-blok-yerlestir-best';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,S,best=0,muted=false,AC,last=0,shake=0,parts=[],T=0;
try{best=+localStorage.getItem(KEY)||0}catch(e){}
const sv=()=>{try{localStorage.setItem(KEY,best)}catch(e){}};
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b));
function rs(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);S=Math.min(W,H);if(window.lay)lay()}
addEventListener('resize',rs);
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function tx(s,x,y,z,col,al,wt){ctx.font=(wt||800)+' '+z+'px system-ui,"Segoe UI",sans-serif';ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y)}
function snd(f,d,ty,v,f2){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function burst(x,y,c,n,sp){for(let i=0;i<(n||12);i++){const a=R(0,6.28),s=R(.3,1)*(sp||220);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:R(.4,.8),m:.8,c})}}
function dparts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,6.3);ctx.fill()}ctx.globalAlpha=1}
function spk(){const x=W-22,y=22;ctx.save();ctx.globalAlpha=.8;ctx.fillStyle='#fff';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-9,y-3);ctx.lineTo(x-4,y-3);ctx.lineTo(x+1,y-8);ctx.lineTo(x+1,y+8);ctx.lineTo(x-4,y+3);ctx.lineTo(x-9,y+3);ctx.fill();ctx.beginPath();if(muted){ctx.moveTo(x+5,y-5);ctx.lineTo(x+13,y+5);ctx.moveTo(x+13,y-5);ctx.lineTo(x+5,y+5)}else{ctx.arc(x+2,y,6,-1,1);ctx.moveTo(x+2+Math.cos(-1)*11,y+Math.sin(-1)*11);ctx.arc(x+2,y,11,-1,1)}ctx.stroke();ctx.restore()}
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;if(document.hidden)return;T+=dt;ctx.save();if(shake>0){ctx.translate(R(-shake,shake),R(-shake,shake));shake=Math.max(0,shake-dt*40)}frame(dt);dparts(dt);ctx.restore();spk()}
function pt(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}const[x,y]=pt(e);if(x>W-44&&y<44){muted=!muted;return}onDown(x,y)});
cv.addEventListener('pointermove',e=>{const[x,y]=pt(e);if(window.onMove)onMove(x,y)});
cv.addEventListener('pointerup',e=>{const[x,y]=pt(e);if(window.onUp)onUp(x,y)});
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.key==' ')e.preventDefault();if(e.key=='m'||e.key=='M'){muted=!muted;return}if(window.onKey)onKey(e)});
addEventListener('contextmenu',e=>e.preventDefault());
function big(name,cx,cy,col,glow){const ws=W<H?name.split(' '):[name],ml=Math.max(...ws.map(w=>w.length)),z=Math.min(W*.9/(ml*.76),H*.13,140);ctx.save();ctx.shadowColor=glow||col;ctx.shadowBlur=z*.5;ws.forEach((w,i)=>tx(w,cx,cy+(i-(ws.length-1)/2)*z*1.12,z,col));ctx.restore();return z}
function tap(y,t,col){ctx.globalAlpha=.65+.35*Math.sin(T*4);tx(t||'Başlamak için dokun / tıkla',W/2,y,Math.max(16,Math.min(S*.05,30)),col);ctx.globalAlpha=1}
function over(t,l1,l2,col,rt){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);const z=Math.min(W*.11,70);tx(t,W/2,H*.34,z,col);tx(l1,W/2,H*.34+z*1.2,z*.5);if(l2)tx(l2,W/2,H*.34+z*1.9,z*.42,'#cbd');tap(H*.34+z*3.1,rt||'Tekrar için dokun / tıkla')}
function btn(b,label,col){rr(b.x,b.y,b.w,b.h,10);ctx.fillStyle=col||'#334';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;ctx.stroke();tx(label,b.x+b.w/2,b.y+b.h/2+1,Math.min(b.h*.45,18))}
const hit=(b,x,y)=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;
/* ---- oyun ---- */
const N=10,CL=['#ff5d73','#4dabf7','#51cf66','#ffd43b','#b565f0','#ff922b','#22d3c5'];
const SH=['#','##','###','####','#####','#/#','#/#/#','#/#/#/#','#/#/#/#/#','##/##','###/###/###','###/###','##/##/##','#./##','.#/##','##/#.','##/.#','#../#../###','..#/..#/###','###/#../#..','###/..#/..#','###/.#.','.##/##.','##/.##','.#./###/.#.'].map(s=>{const rows=s.split('/'),cells=[];rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(ch=='#')cells.push([y,x])}));return{cells,h:rows.length,w:rows[0].length}});
let st='title',bd=[],pcs=[],score=0,drag=-1,dx=0,dy=0,cell=30,bx=0,by=80,trayY=0,trayH=0,gh=null,lines=0;
const NB={x:8,y:10,w:92,h:34};
const ft=Array.from({length:14},()=>({x:Math.random(),y:Math.random(),v:R(.03,.07),s:RI(0,SH.length),c:RI(0,7),z:R(.6,1.2)}));
function lay(){cell=Math.min((W-16)/N,(H-70-150)/N,64);bx=(W-N*cell)/2;by=60;trayY=by+N*cell+12;trayH=H-trayY-8}
function newSet(){pcs=[0,1,2].map(()=>({...SH[RI(0,SH.length)],col:RI(0,7),used:false}))}
function start(){bd=Array.from({length:N},()=>Array(N).fill(-1));score=0;st='play';drag=-1;newSet()}
function fits(p,r,c){if(r<0||c<0||r+p.h>N||c+p.w>N)return false;return p.cells.every(([y,x])=>bd[r+y][c+x]<0)}
function canAny(){return pcs.some(p=>!p.used&&bd.some((row,r)=>row.some((_,c)=>fits(p,r,c))))}
function slot(i){const sw=W/3,ts=Math.min(cell*.62,(trayH-12)/5,sw/5.5);return{cx:(i+.5)*sw,cy:trayY+trayH/2,ts,sw}}
function place(p,r,c){p.cells.forEach(([y,x])=>{bd[r+y][c+x]=p.col});score+=p.cells.length;let rows=[],cols=[];for(let i=0;i<N;i++){if(bd[i].every(v=>v>=0))rows.push(i);if(bd.every(rw=>rw[i]>=0))cols.push(i)}
 const n=rows.length+cols.length;if(n){const cl=new Set();rows.forEach(i=>{for(let k=0;k<N;k++)cl.add(i*N+k)});cols.forEach(i=>{for(let k=0;k<N;k++)cl.add(k*N+i)});cl.forEach(id=>{const rr_=id/N|0,cc=id%N;burst(bx+(cc+.5)*cell,by+(rr_+.5)*cell,CL[bd[rr_][cc]],4,220);bd[rr_][cc]=-1});score+=n*(n+1)*5;shake=4+n*2;snd(500+n*120,.3,'triangle')}else snd(330,.08,'square',.08);
 p.used=true;if(pcs.every(q=>q.used))newSet();if(score>best){best=score;sv()}if(!canAny()){st='over';shake=8;snd(200,.6,'sawtooth',.1,60)}}
function onDown(x,y){if(st!='play'){start();return}if(hit(NB,x,y)){start();return}if(y>trayY-10){const i=Math.min(2,Math.floor(x/(W/3)));if(!pcs[i].used){drag=i;dx=x;dy=y;snd(600,.05,'sine',.06)}}}
function onMove(x,y){if(drag>=0){dx=x;dy=y;gh=snap()}}
function snap(){const p=pcs[drag],lift=cell*2.2,l=dx-p.w*cell/2,t=dy-lift-p.h*cell/2,c=Math.round((l-bx)/cell),r=Math.round((t-by)/cell);return fits(p,r,c)?{r,c}:null}
function onUp(x,y){if(drag<0)return;dx=x;dy=y;const g=snap();if(g)place(pcs[drag],g.r,g.c);else if(y<trayY)snd(150,.1,'square',.08);drag=-1;gh=null}
function onKey(e){if(st!='play'&&(e.key=='Enter'||e.key==' '))start()}
function piece(p,x,y,s,a){ctx.globalAlpha=a==null?1:a;p.cells.forEach(([cy,cx])=>{const px=x+cx*s,py=y+cy*s;rr(px+1,py+1,s-2,s-2,s*.2);ctx.fillStyle=CL[p.col];ctx.fill();rr(px+s*.15,py+s*.12,s*.7,s*.25,s*.1);ctx.fillStyle='rgba(255,255,255,.3)';ctx.fill()});ctx.globalAlpha=1}
function frame(dt){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#171a33');g.addColorStop(1,'#2a1a4a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ft.forEach(f=>piece({cells:SH[f.s].cells,col:f.c},f.x*W,((f.y+T*f.v)%1.3-.15)*H,16*f.z+14,.12));
 if(st=='title'){big('BLOK YERLEŞTİR',W/2,H*.3,'#4dabf7','#22d3c5');const s=Math.min(W*.07,40);piece({cells:SH[10].cells,col:3},W/2-s*4,H*.5-s*1.5+Math.sin(T*2)*6,s);piece({cells:SH[17].cells,col:0},W/2+s*1,H*.5-s*1.5+Math.cos(T*2)*6,s);tap(H*.72);tx('En iyi puan: '+best,W/2,H*.8,Math.min(S*.04,22),'#9fb3d1');return}
 tx('Puan '+score,W/2,22,Math.min(22,W*.055),'#fff');tx('En iyi '+best,W/2,44,13,'#9fb3d1');btn(NB,'Yeni oyun','#2a3350');
 rr(bx-4,by-4,N*cell+8,N*cell+8,10);ctx.fillStyle='#0f1226';ctx.fill();
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){const x=bx+c*cell,y=by+r*cell,v=bd[r][c];if(v<0){rr(x+1.5,y+1.5,cell-3,cell-3,cell*.15);ctx.fillStyle=((r/5|0)+(c/5|0))%2?'#1e2342':'#232950';ctx.fill()}else piece({cells:[[0,0]],col:v},x,y,cell)}
 if(drag>=0&&gh)piece({cells:pcs[drag].cells,col:pcs[drag].col},bx+gh.c*cell,by+gh.r*cell,cell,.35);
 pcs.forEach((p,i)=>{if(p.used||i==drag)return;const s=slot(i);piece(p,s.cx-p.w*s.ts/2,s.cy-p.h*s.ts/2,s.ts)});
 if(drag>=0){const p=pcs[drag];piece(p,dx-p.w*cell/2,dy-cell*2.2-p.h*cell/2,cell)}
 if(st=='over')over('Yer kalmadı!','Puan: '+score,'En iyi: '+best,'#ff6b6b','Yeni oyun için dokun / tıkla')}
rs();requestAnimationFrame(loop);
</script></body></html>
