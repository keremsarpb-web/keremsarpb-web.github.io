<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Trafik Yarışı – KSB Games</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100vw;height:100vh;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
'use strict';
const cv=document.getElementById('c'),g=cv.getContext('2d');let W=0,H=0,DPR=1,u=1;
function rs(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;u=Math.max(.6,Math.min(W/520,H/760));cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
addEventListener('resize',rs);rs();
const ID='denizalti',R=Math.random,TAU=Math.PI*2;let best=0,muted=false,AC=null,score=0,st='title',T=0,paused=false,overAt=0,last=0,shake=0,EX=[];const P={x:0,y:0,down:false},K={},PT=[];
try{best=+localStorage.getItem('ksb-'+ID+'-best')||0}catch(e){}
function initA(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function snd(f,d,ty,v,f2){if(muted||!AC)return;try{const o=AC.createOscillator(),a=AC.createGain(),t=AC.currentTime;o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);a.gain.setValueAtTime(v||.06,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a);a.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function tx(s,x,y,sz,c,a,w){g.font=(w||'bold')+' '+sz+'px "Trebuchet MS",Arial,sans-serif';g.fillStyle=c;g.textAlign=a||'center';g.textBaseline='middle';g.fillText(s,x,y)}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function shk(){if(shake>0)g.translate((R()-.5)*shake*28,(R()-.5)*shake*28)}
function burst(x,y,n,c,sp,life,sz){for(let i=0;i<n;i++){const a=R()*TAU,s=sp*(.3+R()*.7);PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life,m:life,c,s:sz||3})}}
function updPT(dt){for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.l-=dt;if(p.l<=0){PT.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-1.5*dt;p.vy*=1-1.5*dt}}
function drawPT(){for(const p of PT){g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;g.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}g.globalAlpha=1}
function hudScore(){tx(Math.floor(score),16,28,Math.round(28*Math.max(.85,Math.min(1.1,u))),'#fff','left');tx('En iyi '+best,16,54,13,'rgba(255,255,255,.65)','left')}
function drawIcon(){g.save();g.globalAlpha=.85;g.fillStyle='#fff';g.strokeStyle='#fff';g.lineWidth=2;const x=W-30,y=24;g.beginPath();g.moveTo(x-8,y-4);g.lineTo(x-3,y-4);g.lineTo(x+2,y-9);g.lineTo(x+2,y+9);g.lineTo(x-3,y+4);g.lineTo(x-8,y+4);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(x+6,y-5);g.lineTo(x+14,y+5);g.moveTo(x+14,y-5);g.lineTo(x+6,y+5)}else g.arc(x+3,y,6,-1,1);g.stroke();g.restore()}
function start(){reset();st='play';snd(440,.15,'square',.06,880)}
function gameOver(){if(st!=='play')return;st='over';overAt=T;score=Math.floor(score);if(score>best){best=score;try{localStorage.setItem('ksb-'+ID+'-best',best)}catch(e){}}shake=.5;snd(220,.5,'sawtooth',.1,40)}
function overlay(){g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,0,W,H);const pu=.65+.35*Math.sin(T*4);
if(st==='title'){const sz=Math.min(W*.92/(TITLE.length*.62),H*.13,110);g.save();g.shadowColor=COL;g.shadowBlur=30;tx(TITLE,W/2,H*.3,sz,'#fff');g.restore();tx(SUB,W/2,H*.3+sz*.85,Math.min(W*.05,H*.04,26),COL);g.globalAlpha=pu;tx('Başlamak için dokun / tıkla',W/2,H*.68,Math.min(W*.058,H*.05,30),'#fff');g.globalAlpha=1;tx(HINT,W/2,H*.68+Math.min(W*.1,H*.06,46),Math.min(W*.04,H*.03,18),'#d5dcec');if(best)tx('En iyi: '+best,W/2,H*.9,Math.min(W*.05,H*.04,22),COL)}
else{const s1=Math.min(W*.13,H*.09,64);g.save();g.shadowColor=COL;g.shadowBlur=24;tx(OVER||'Oyun Bitti',W/2,H*.28,s1,'#fff');g.restore();const s2=Math.min(W*.07,H*.05,34);tx('Skor: '+score,W/2,H*.4,s2,COL);tx('En iyi: '+best,W/2,H*.4+s2*1.3,s2*.75,'#fff');EX.forEach((l,i)=>tx(l,W/2,H*.4+s2*2.6+i*s2*.9,s2*.6,'#d5dcec'));g.globalAlpha=pu;tx('Tekrar için dokun / tıkla',W/2,H*.75,Math.min(W*.058,H*.05,30),'#fff');g.globalAlpha=1}}
function ptr(e){const r=cv.getBoundingClientRect();P.x=e.clientX-r.left;P.y=e.clientY-r.top}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ptr(e);initA();if(P.x>W-50&&P.y<50){muted=!muted;return}P.down=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}if(st==='title')start();else if(st==='over'){if(T-overAt>.6)start()}else gDown()});
cv.addEventListener('pointermove',e=>{ptr(e);if(st==='play')gMove()});
const pu_=e=>{ptr(e);P.down=false;if(st==='play')gUp()};addEventListener('pointerup',pu_);addEventListener('pointercancel',pu_);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k.startsWith('arrow')||k===' ')e.preventDefault();if(k==='m'){muted=!muted;return}initA();K[k]=1;if(e.repeat)return;if(st==='title'){if(k===' '||k==='enter')start()}else if(st==='over'){if((k===' '||k==='enter')&&T-overAt>.6)start()}else gKey(k)});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=0});
document.addEventListener('visibilitychange',()=>{paused=document.hidden;last=0});
function loop(t){requestAnimationFrame(loop);if(!last)last=t;const dt=Math.min(.05,(t-last)/1000);last=t;if(paused)return;T+=dt;g.setTransform(DPR,0,0,DPR,0,0);upd(dt);shake=Math.max(0,shake-dt);draw();if(st!=='play')overlay();drawIcon()}
/* ---- oyun ---- */
const TITLE='Denizaltı',SUB='Mağaralardan geç, inci topla',COL='#ffd23f',HINT='Parmağını yukarı / aşağı sürükle  ·  ↑ ↓';let OVER='';
const mid=x=>H*.5+Math.sin(x*.0038+1)*H*.19+Math.sin(x*.0105+2)*H*.07+Math.sin(x*.024)*H*.025;
const gapAt=x=>(300-130*Math.min(1,Math.max(0,x/22000)))*u+Math.sin(x*.0061)*28*u;
const cTop=x=>mid(x)-gapAt(x)/2+Math.sin(x*.045)*7*u+Math.sin(x*.13)*3*u;
const cBot=x=>mid(x)+gapAt(x)/2-Math.sin(x*.05+1)*7*u-Math.sin(x*.11)*3*u;
let wx,sy,vy,tgt,hull,inv,items,nextItem,pearls,spd,t,sonar;const BUB=[];for(let i=0;i<40;i++)BUB.push([R(),R(),2+R()*5,.3+R()*.7]);
function reset(){wx=0;sy=mid(W*.3);vy=0;tgt=sy;hull=3;inv=0;items=[];nextItem=W+200;pearls=0;t=0;sonar=0;score=0;PT.length=0;EX=[]}
function gDown(){tgt=P.y}function gMove(){tgt=P.y}function gUp(){}function gKey(){}
function sx(){return W*.3}
function hit(why){hull--;inv=1.6;shake=.4;burst(sx(),sy,30,'#ff9a3c',300,.7,4);snd(110,.4,'sawtooth',.1,40);if(hull<=0){OVER=why;EX=['İnci: '+pearls];gameOver()}}
function upd(dt){updPT(dt);if(st==='over')return;t+=dt;const play=st==='play';spd=(150+Math.min(150,t*3))*u;wx+=(play?spd:70*u)*dt;
for(const b of BUB){b[0]-=b[3]*dt*(.05+(spd/u)*.0004);if(b[0]<0)b[0]+=1;b[1]-=b[3]*dt*.15;if(b[1]<0)b[1]+=1}
if(!play){sy=mid(wx+sx())+Math.sin(T*2)*30*u;vy=0;return}
score+=spd*dt*.01/u;inv=Math.max(0,inv-dt);sonar-=dt;if(sonar<=0){sonar=3;snd(900,.4,'sine',.03,700)}
if(K.arrowup||K.w)tgt-=600*u*dt;if(K.arrowdown||K.s)tgt+=600*u*dt;tgt=Math.max(0,Math.min(H,tgt));
const ov=sy;sy+=Math.max(-700*u,Math.min(700*u,(tgt-sy)*8))*dt;vy=(sy-ov)/dt;
const X=wx+sx();for(const o of[-20*u,0,20*u]){if(sy-12*u<cTop(X+o)||sy+12*u>cBot(X+o)){if(inv<=0){hit('Denizaltı battı!');sy=mid(X);tgt=sy}else{sy=Math.max(cTop(X+o)+12*u,Math.min(cBot(X+o)-12*u,sy))}break}}
while(nextItem<wx+W+200){const x=wx+nextItem-wx,d=Math.min(1,x/22000),m=mid(x),gp=gapAt(x),y=m+(R()-.5)*(gp-120*u);
if(R()<.38+d*.3)items.push({k:'m',x,y,y0:y,a:R()*gp*.1,ph:R()*6});else{const n=3+(R()*3|0);for(let i=0;i<n;i++)items.push({k:'p',x:x+i*40*u,y:m+(y-m)*.8+Math.sin(i*.9)*18*u,y0:0})}
nextItem+=(260+R()*220)*u}
for(const o of items){if(o.k==='m')o.y=o.y0+Math.sin(t*1.6+o.ph)*o.a;const dx=o.x-X,dy=o.y-sy;
if(o.k==='p'){if(Math.hypot(dx,dy)<60*u){o.x-=dx*dt*6;o.y-=dy*dt*6}if(Math.hypot(dx,dy)<24*u){o.dead=1;pearls++;score+=10;snd(1000+pearls%5*120,.12,'sine',.07,1500);burst(sx(),sy,10,'#fff',160,.5,3)}}
else if(Math.hypot(dx,dy)<26*u&&inv<=0){o.dead=1;burst(o.x-wx,o.y,26,'#ff7a3c',320,.6,5);hit('Mayına çarptın!')}}
items=items.filter(o=>!o.dead&&o.x>wx-100)}
function heart(x,y,s,c){g.fillStyle=c;g.beginPath();g.moveTo(x,y+s*.35);g.bezierCurveTo(x-s,y-s*.3,x-s*.5,y-s,x,y-s*.4);g.bezierCurveTo(x+s*.5,y-s,x+s,y-s*.3,x,y+s*.35);g.fill()}
function draw(){g.save();shk();let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0a5a86');gr.addColorStop(1,'#03162b');g.fillStyle=gr;g.fillRect(-30,-30,W+60,H+60);
g.fillStyle='rgba(120,220,255,.07)';for(let i=0;i<4;i++){const x=((i*W*.3+T*10)%(W*1.3))-W*.15;g.beginPath();g.moveTo(x,0);g.lineTo(x+60*u,0);g.lineTo(x-120*u,H);g.lineTo(x-200*u,H);g.fill()}
g.fillStyle='rgba(200,240,255,.25)';for(const b of BUB){g.beginPath();g.arc(b[0]*W,b[1]*H,b[2]*u,0,TAU);g.fill()}
g.beginPath();g.moveTo(-5,-5);for(let x=-5;x<=W+5;x+=6)g.lineTo(x,cTop(wx+x));g.lineTo(W+5,-5);g.closePath();gr=g.createLinearGradient(0,0,0,H*.5);gr.addColorStop(0,'#05202f');gr.addColorStop(1,'#14566e');g.fillStyle=gr;g.fill();
g.lineWidth=3;g.strokeStyle='#4be3f0';g.beginPath();for(let x=-5;x<=W+5;x+=6){const y=cTop(wx+x);x<0?g.moveTo(x,y):g.lineTo(x,y)}g.stroke();
g.beginPath();g.moveTo(-5,H+5);for(let x=-5;x<=W+5;x+=6)g.lineTo(x,cBot(wx+x));g.lineTo(W+5,H+5);g.closePath();gr=g.createLinearGradient(0,H*.5,0,H);gr.addColorStop(0,'#14566e');gr.addColorStop(1,'#05202f');g.fillStyle=gr;g.fill();
g.beginPath();for(let x=-5;x<=W+5;x+=6){const y=cBot(wx+x);x<0?g.moveTo(x,y):g.lineTo(x,y)}g.stroke();
for(let i=Math.floor(wx/90);i<(wx+W)/90+1;i++){const xw=i*90,x=xw-wx,y=cBot(xw);g.fillStyle=i%3?'#ff7aa8':'#7affc4';for(let k=0;k<3;k++){g.beginPath();g.arc(x+k*9*u,y+8*u+k*3,4*u,0,TAU);g.fill()}}
for(const o of items){const x=o.x-wx;if(x<-40||x>W+40)continue;if(o.k==='p'){const rg=g.createRadialGradient(x-2,o.y-2,1,x,o.y,10*u);rg.addColorStop(0,'#fff');rg.addColorStop(.6,'#ffd6f0');rg.addColorStop(1,'rgba(255,150,220,0)');g.fillStyle=rg;g.beginPath();g.arc(x,o.y,10*u,0,TAU);g.fill()}
else{g.save();g.translate(x,o.y);g.rotate(t*.8);g.fillStyle='#2b2f3a';for(let i=0;i<8;i++){g.rotate(Math.PI/4);g.fillRect(-3*u,-20*u,6*u,10*u)}g.beginPath();g.arc(0,0,14*u,0,TAU);g.fill();g.fillStyle=Math.sin(t*6+o.ph)>0?'#ff3a3a':'#6a1010';g.beginPath();g.arc(0,0,5*u,0,TAU);g.fill();g.restore()}}
if(!(inv>0&&Math.floor(T*14)%2)){g.save();g.translate(sx(),sy);g.rotate(Math.max(-.4,Math.min(.4,vy*.0007/u)));g.scale(u,u);
g.globalCompositeOperation='lighter';const lg=g.createLinearGradient(24,0,170,0);lg.addColorStop(0,'rgba(255,240,170,.35)');lg.addColorStop(1,'rgba(255,240,170,0)');g.fillStyle=lg;g.beginPath();g.moveTo(24,-3);g.lineTo(170,-45);g.lineTo(170,45);g.lineTo(24,3);g.fill();g.globalCompositeOperation='source-over';
g.save();g.translate(-30,0);g.scale(1,Math.sin(T*30));g.fillStyle='#b87a14';g.fillRect(-3,-12,6,24);g.restore();
g.fillStyle=COL;g.beginPath();g.ellipse(0,0,28,14,0,0,TAU);g.fill();g.fillStyle='#e6a800';rr(-8,-24,18,12,4);g.fill();g.fillRect(2,-30,3,8);g.fillRect(2,-30,10,3);g.fillStyle='#2b4a68';for(const px of[-14,0,14]){g.beginPath();g.arc(px,-1,4.5,0,TAU);g.fill()}g.fillStyle='#8fe3ff';for(const px of[-14,0,14]){g.beginPath();g.arc(px-1,-2,2.5,0,TAU);g.fill()}g.restore()}
drawPT();const vg=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,10,25,.55)');g.fillStyle=vg;g.fillRect(-30,-30,W+60,H+60);g.restore();
if(st==='play'){hudScore();tx('İnci: '+pearls,16,78,18,'#ffd6f0','left');for(let i=0;i<3;i++)heart(26+i*28,104,11,i<hull?'#ff4a6a':'rgba(255,255,255,.2)')}}
reset();requestAnimationFrame(loop);
</script></body></html>
