<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dart</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1a1220;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
const BK='ksb-dart-best';
'use strict';
const cv=document.getElementById('c'),g=cv.getContext('2d');let W=1,H=1,T=0;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth||1;H=innerHeight||1;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
let best=0;try{best=+localStorage.getItem(BK)||0}catch(e){}
function saveBest(s){if(s>best){best=s;try{localStorage.setItem(BK,String(s))}catch(e){}return true}return false}
let AC=null,muted=false;
function snd(f,d,t,v,sl){if(muted||!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(sl,n+d);a.gain.setValueAtTime(v||.12,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume()}
const keys={};let onDown=()=>{},onMove=()=>{},onUp=()=>{},onKey=()=>{};
const pp=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{initAudio();const[x,y]=pp(e);if(x>W-46&&y<46){muted=!muted;return}try{cv.setPointerCapture(e.pointerId)}catch(_){}onDown(x,y)});
cv.addEventListener('pointermove',e=>{const[x,y]=pp(e);onMove(x,y)});
cv.addEventListener('pointerup',e=>{const[x,y]=pp(e);onUp(x,y)});
cv.addEventListener('pointercancel',e=>{const[x,y]=pp(e);onUp(x,y)});
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.key==' ')e.preventDefault();initAudio();if(e.key=='m'||e.key=='M'){muted=!muted;return}if(!keys[e.key])onKey(e.key);keys[e.key]=1});
addEventListener('keyup',e=>{keys[e.key]=0});
const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function tx(s,x,y,sz,c,al,w){g.font=(w||'700')+' '+Math.max(6,sz|0)+'px Fredoka,Nunito,system-ui,sans-serif';g.textAlign=al||'center';g.textBaseline='middle';g.fillStyle=c||'#fff';g.fillText(s,x,y)}
function spk(){g.save();g.globalAlpha=.85;g.fillStyle='#fff';const x=W-30,y=22;g.beginPath();g.moveTo(x-8,y-3);g.lineTo(x-4,y-3);g.lineTo(x+1,y-8);g.lineTo(x+1,y+8);g.lineTo(x-4,y+3);g.lineTo(x-8,y+3);g.fill();g.lineWidth=2;if(muted){g.strokeStyle='#f66';g.beginPath();g.moveTo(x+4,y-5);g.lineTo(x+12,y+5);g.moveTo(x+12,y-5);g.lineTo(x+4,y+5);g.stroke()}else{g.strokeStyle='#fff';g.beginPath();g.arc(x+1,y,6,-1,1);g.stroke()}g.restore()}
let S=1,OX=0,OY=0;function fit(a,b){S=Math.min(W/a,H/b);OX=(W-a*S)/2;OY=(H-b*S)/2}
const P2=(x,y)=>[(x-OX)/S,(y-OY)/S];
const PT=[];function burst(x,y,n,c,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=(.3+Math.random())*(sp||200);PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.5,c,r:2+Math.random()*3})}}
function pstep(dt){for(const p of PT){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt}for(let i=PT.length-1;i>=0;i--)if(PT[i].l<=0)PT.splice(i,1)}
function pdraw(){for(const p of PT){g.globalAlpha=cl(p.l*2,0,1);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,6.3);g.fill()}g.globalAlpha=1}
function ttl(n,sub){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,W,H);g.save();g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=24;const fs=Math.min(W*.13,H*.11,110);tx(n,W/2,H*.3,fs,'#fff','center','800');g.shadowBlur=0;tx(sub,W/2,H*.3+fs*.8,Math.min(W*.05,H*.035,28),'#ffe08a','center','600');g.globalAlpha=.6+.4*Math.sin(T*4);tx('Başlamak için dokun / tıkla',W/2,H*.8,Math.min(W*.055,H*.04,30),'#fff');g.globalAlpha=1;if(best)tx('En iyi: '+best,W/2,H*.87,Math.min(W*.045,H*.03,22),'#ccc','center','600');g.restore()}
function ovr(a,b,c){g.fillStyle='rgba(0,0,0,.62)';g.fillRect(0,0,W,H);tx(a,W/2,H*.3,Math.min(W*.12,H*.09,90),'#fff','center','800');tx(b,W/2,H*.42,Math.min(W*.06,H*.04,34),'#ffe08a');if(c)tx(c,W/2,H*.5,Math.min(W*.05,H*.035,28),'#ccc','center','600');g.globalAlpha=.6+.4*Math.sin(T*4);tx('Tekrar için dokun / tıkla',W/2,H*.72,Math.min(W*.055,H*.04,30),'#fff');g.globalAlpha=1}
let last=performance.now(),UP=()=>{},DR=()=>{};
function loop(t){requestAnimationFrame(loop);const dt=cl((t-last)/1000,0,.033);last=t;if(document.hidden)return;T+=dt;UP(dt);DR();spk()}
document.addEventListener('visibilitychange',()=>{last=performance.now()});
requestAnimationFrame(loop);
const SEG=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5],BX=200,BY=285,BR=170,SA=Math.PI/10;
let st='title',rem=[301,301],s0=[301,301],who=0,thrown=0,rd=1,darts=[],fly=null,msg='',mt=0,ph='aim',ctr=[200,285],winner=-1,aiT=0,shk=0,overT=0,tot=0,mouse=false;
function start(){rem=[301,301];s0=[301,301];who=0;thrown=0;rd=1;darts=[];fly=null;msg='';ph='aim';winner=-1;st='play';tot=0}
const wob=()=>[Math.sin(T*3.1)*16+Math.sin(T*5.7+1)*10,Math.cos(T*2.7)*16+Math.sin(T*4.9)*10];
function val(dx,dy){const d=Math.hypot(dx,dy);if(d>BR)return[0,'Iska'];if(d<6.35)return[50,'ORTA'];if(d<15.9)return[25,'25'];const a=(Math.atan2(dx,-dy)+SA+6.2832)%6.2832,n=SEG[Math.floor(a/(2*SA))%20];if(d>99&&d<107)return[n*3,'T'+n];if(d>162)return[n*2,'D'+n];return[n,''+n]}
function aim(){const r=rem[1];let n,m=1,rr=103;if(r<=40&&r%2==0){n=r/2;m=2;rr=166}else if(r<=20){n=r;m=1;rr=130}else if(r<=60&&r>40){n=r-20;m=1;rr=130;if(n>20){n=20;m=3;rr=103}}else{n=20;m=3;rr=103}
 if(r==50){return[0,0]}const i=SEG.indexOf(Math.min(n,20)),a=i*2*SA;return[Math.sin(a)*rr,-Math.cos(a)*rr]}
function thr(x,y){if(ph!='aim'&&ph!='ai')return;fly={x,y,t:0};ph='fly';snd(700,.15,'sawtooth',.06,200)}
function land(){const f=fly,v=val(f.x-BX,f.y-BY);darts.push({x:f.x,y:f.y});fly=null;msg=v[1]=='Iska'?'Iska!':v[1]+' = '+v[0];tot+=v[0];shk=v[0]>=40?5:2;burst(f.x,f.y,v[0]>=40?20:8,v[0]>=40?'#ffd23f':'#fff',120);snd(v[0]>=40?800:300,.12,'square',.1,v[0]>=40?1200:150);thrown++;
 const nr=rem[who]-v[0];if(nr==0){rem[who]=0;winner=who;st='over';overT=0;if(who==0){const rr=rd;if(!best||rr<best){best=rr;try{localStorage.setItem(BK,String(rr))}catch(e){}}}snd(who==0?700:200,.6,'triangle',.2);return}
 if(nr<0){msg='Patladı!';rem[who]=s0[who];thrown=3;snd(100,.4,'sawtooth',.15)}else rem[who]=nr;ph='pause';mt=.9}
function nextTurn(){if(thrown>=3){who=1-who;thrown=0;tot=0;darts=[];msg='';s0[who]=rem[who];if(who==0){rd++;if(rd>12){st='over';overT=0;winner=rem[0]<=rem[1]?0:1;return}}}
 ph=who==1?'ai':'aim';aiT=.8}
UP=dt=>{pstep(dt);shk=Math.max(0,shk-dt*25);overT+=dt;if(st=='title')return;if(st!='play')return;
 if(ph=='aim'){const k=(keys.ArrowLeft?-1:0)+(keys.ArrowRight?1:0),j=(keys.ArrowUp?-1:0)+(keys.ArrowDown?1:0);ctr[0]=cl(ctr[0]+k*200*dt,BX-BR,BX+BR);ctr[1]=cl(ctr[1]+j*200*dt,BY-BR,BY+BR)}
 else if(ph=='ai'){aiT-=dt;if(aiT<=0){const a=aim(),e=26;thr(BX+a[0]+(Math.random()+Math.random()-1)*e*1.4,BY+a[1]+(Math.random()+Math.random()-1)*e*1.4)}}
 else if(ph=='fly'){fly.t+=dt/.25;if(fly.t>=1)land()}
 else if(ph=='pause'){mt-=dt;if(mt<=0)nextTurn()}};
onDown=(x,y)=>{if(st=='title'){start();return}if(st=='over'){if(overT>.5)start();return}if(ph!='aim')return;const[a,b]=P2(x,y);ctr=[cl(a,BX-BR,BX+BR),cl(b,BY-BR,BY+BR)];const w=wob();thr(ctr[0]+w[0],ctr[1]+w[1])};
onMove=(x,y)=>{if(st=='play'&&ph=='aim'){const[a,b]=P2(x,y);if(b<BY+BR+20){ctr=[cl(a,BX-BR,BX+BR),cl(b,BY-BR,BY+BR)]}}};
onKey=k=>{if(st=='title'){start();return}if(st=='over'){if(overT>.5)start();return}if(k==' '||k=='Enter'){if(ph=='aim'){const w=wob();thr(ctr[0]+w[0],ctr[1]+w[1])}}};
function dartD(x,y,s,a){g.save();g.translate(x,y);g.scale(s,s);g.rotate(a||0);g.strokeStyle='#444';g.lineWidth=2.5;g.beginPath();g.moveTo(0,0);g.lineTo(8,30);g.stroke();g.fillStyle='#e33';g.beginPath();g.moveTo(8,30);g.lineTo(0,46);g.lineTo(18,40);g.fill();g.fillStyle='#ccc';g.beginPath();g.arc(0,0,2,0,6.3);g.fill();g.restore()}
function board(){g.fillStyle='#111';g.beginPath();g.arc(BX,BY,BR+30,0,6.3);g.fill();
 for(let i=0;i<20;i++){const a0=(i-.5)*2*SA-Math.PI/2,a1=a0+2*SA,dk=i%2==0,c1=dk?'#151515':'#f1e4bd',c2=dk?'#d33':'#1a9a4a';
  const ring=(r0,r1,c)=>{g.fillStyle=c;g.beginPath();g.arc(BX,BY,r1,a0,a1);g.arc(BX,BY,r0,a1,a0,true);g.fill()};ring(15.9,99,c1);ring(99,107,c2);ring(107,162,c1);ring(162,BR,c2);
  const a=i*2*SA;tx(String(SEG[i]),BX+Math.sin(a)*(BR+16),BY-Math.cos(a)*(BR+16),17,'#fff','center','800')}
 g.fillStyle='#1a9a4a';g.beginPath();g.arc(BX,BY,15.9,0,6.3);g.fill();g.fillStyle='#d33';g.beginPath();g.arc(BX,BY,6.35,0,6.3);g.fill()}
DR=()=>{const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#2a1a3a');gr.addColorStop(1,'#120a1c');g.fillStyle=gr;g.fillRect(0,0,W,H);fit(400,700);g.save();g.translate(OX+(shk?rnd(-shk,shk):0),OY);g.scale(S,S);
 board();for(const d of darts)dartD(d.x,d.y,1,.2);
 if(st=='title'){const w=wob();dartD(BX+w[0]*3,BY+w[1]*3,1.2,.2)}
 if(fly){const t=fly.t,e=1-(1-t)*(1-t);dartD(fly.x+(1-e)*60,fly.y+(1-e)*260,1+(1-e)*1.2,.2)}pdraw();
 if(st=='play'){if(ph=='aim'){const w=wob(),x=ctr[0]+w[0],y=ctr[1]+w[1];g.strokeStyle='#4ff';g.lineWidth=2;g.shadowColor='#4ff';g.shadowBlur=8;g.beginPath();g.arc(x,y,12,0,6.3);g.moveTo(x-20,y);g.lineTo(x+20,y);g.moveTo(x,y-20);g.lineTo(x,y+20);g.stroke();g.shadowBlur=0}
  for(let i=0;i<2;i++){const x=i?210:20,on=who==i;g.fillStyle=on?'#ffffff25':'#ffffff10';g.beginPath();g.roundRect(x,520,170,92,14);g.fill();if(on){g.strokeStyle='#ffd23f';g.lineWidth=2;g.stroke()}
   tx(i?'RAKİP':'SEN',x+85,540,16,on?'#ffd23f':'#aab','center','800');tx(String(rem[i]),x+85,577,44,'#fff','center','800')}
  tx('Tur '+Math.min(rd,12)+'/12',200,630,15,'#aab','center','600');for(let i=0;i<3;i++){g.fillStyle=i<thrown?'#ffd23f':'#fff3';g.beginPath();g.arc(176+i*24,655,7,0,6.3);g.fill()}
  tx(who==0?(ph=='aim'&&!thrown&&rd==1?'Hedefe dokun, ok fırlasın':msg):'Rakip atıyor... '+msg,200,685,16,'#fff','center','600')}
 g.restore();if(st=='title')ttl('Dart','301 · 3 oklu turlar');
 if(st=='over')ovr(winner==0?'KAZANDIN!':'KAYBETTİN',winner==0?rd+'. turda bitirdin':'Rakip '+(rem[1]==0?'bitirdi':'önde: '+rem[1]),'En iyi: '+(best?best+' tur':'-'))};

</script></body></html>
