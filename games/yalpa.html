<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yalpa – online ragdoll oyunu | KSB Games</title>
<meta name="description" content="Human Fall Flat tarzı, yalpalayan karakterlerle online ragdoll oyunu. Arkadaşlarınla oda kur, tutun, tırman, bayrağa ulaş.">
<link rel="canonical" href="https://keremsarpb-web.github.io/games/yalpa.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2b2d42; --card: rgba(255,255,255,0.92); --accent: #ff8a3d; --accent2: #4dabf7; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe6ff; font-family: Fredoka, "Segoe UI", sans-serif; color: var(--ink); user-select: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }
  #menu { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; }
  @media (min-width: 761px) { #menu { place-items: center start; padding-left: 7vw; } }
  .card { background: var(--card); border-radius: 22px; padding: 26px 28px; width: min(420px, 100%); box-shadow: 0 12px 40px rgba(30,60,90,0.25); }
  h1 { margin: 0; font-size: 56px; font-weight: 700; letter-spacing: 1px; color: var(--accent); text-shadow: 3px 3px 0 #2b2d42; transform: rotate(-3deg); text-align: center; }
  .sub { text-align: center; margin: 4px 0 18px; opacity: 0.7; }
  label { font-weight: 600; font-size: 14px; display: block; margin: 10px 0 6px; }
  input { width: 100%; font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 12px; border: 2px solid #d5dbe3; outline: none; background: #fff; }
  input:focus { border-color: var(--accent2); }
  #swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #d5dbe3; cursor: pointer; }
  .swatch.on { box-shadow: 0 0 0 3px var(--ink); }
  .card { max-height: calc(100vh - 32px); overflow-y: auto; }
  .lbl-row { display: flex; justify-content: space-between; align-items: baseline; }
  .lbl-row small { opacity: 0.55; font-size: 12px; }
  #cos-tabs { display: flex; gap: 4px; margin-bottom: 6px; }
  .tab { flex: 1; font: inherit; font-weight: 600; font-size: 14px; padding: 6px; border: 0; border-radius: 10px; background: #e9edf2; cursor: pointer; color: var(--ink); }
  .tab.on { background: var(--ink); color: #fff; }
  #cos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px; }
  .cos { font: inherit; border: 2px solid #d5dbe3; background: #fff; border-radius: 12px; padding: 5px 2px 3px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--ink); }
  .cos span { font-size: 22px; line-height: 1.1; }
  .cos small { font-size: 10px; opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .cos.on { border-color: var(--accent); background: #fff3e6; box-shadow: 0 0 0 2px var(--accent); }
  #random { font: inherit; font-size: 12px; border: 0; background: none; color: var(--accent2); cursor: pointer; font-weight: 600; padding: 0; }
  #ad-banner { position: fixed; right: 16px; bottom: 16px; width: 320px; max-width: calc(100vw - 32px); background: var(--card); border-radius: 14px; padding: 8px 10px 10px; box-shadow: 0 8px 24px rgba(30,60,90,0.2); }
  .ad-tag { font-size: 10px; letter-spacing: 1px; opacity: 0.5; font-weight: 600; text-transform: uppercase; }
  .house { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
  .house .icon { font-size: 34px; }
  .house b { display: block; font-size: 15px; }
  .house span { font-size: 13px; opacity: 0.75; }
  .house.big { flex-direction: column; text-align: center; padding: 20px 10px; }
  .house.big .icon { font-size: 80px; }
  .house.big b { font-size: 26px; margin: 6px 0; }
  .house.big span { font-size: 17px; }
  #ad-full { position: fixed; inset: 0; background: rgba(20,24,40,0.75); display: grid; place-items: center; z-index: 50; padding: 16px; }
  #ad-full .card { position: relative; }
  .ad-skip { position: absolute; top: 12px; right: 12px; font: inherit; font-weight: 600; font-size: 14px; border: 0; border-radius: 999px; padding: 6px 14px; background: var(--ink); color: #fff; cursor: pointer; }
  .ad-skip:disabled { opacity: 0.5; cursor: default; }
  @media (max-width: 760px) { #ad-banner { display: none; } }
  .btn { width: 100%; font: inherit; font-weight: 600; font-size: 18px; padding: 12px; border: 0; border-radius: 14px; cursor: pointer; margin-top: 10px; color: #fff; background: var(--accent); box-shadow: 0 4px 0 #c45f1c; transition: transform .08s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c45f1c; }
  .btn.blue { background: var(--accent2); box-shadow: 0 4px 0 #2b7bbf; }
  .btn.ghost { background: #e9edf2; color: var(--ink); box-shadow: 0 4px 0 #c3cad3; }
  .row { display: flex; gap: 8px; align-items: stretch; }
  .row input { text-transform: uppercase; letter-spacing: 3px; }
  .row .btn { width: auto; padding: 0 18px; margin-top: 0; }
  .sep { text-align: center; margin: 14px 0 4px; font-size: 13px; opacity: 0.55; }
  #status { min-height: 20px; margin-top: 12px; text-align: center; font-size: 14px; }
  #status.err { color: #d6336c; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .panel { position: absolute; background: var(--card); border-radius: 14px; padding: 10px 14px; pointer-events: auto; box-shadow: 0 6px 18px rgba(30,60,90,0.2); }
  #tl { top: 14px; left: 14px; min-width: 190px; }
  #room { font-weight: 700; }
  #players { list-style: none; margin: 6px 0 0; padding: 0; font-size: 15px; }
  #players li { display: flex; align-items: center; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,0.2); }
  .mini { font: inherit; font-size: 13px; border: 0; border-radius: 8px; padding: 4px 9px; cursor: pointer; background: #e9edf2; margin-top: 8px; margin-right: 4px; }
  #help { bottom: 14px; left: 14px; font-size: 13px; line-height: 1.55; }
  #help b { display: inline-block; min-width: 92px; }
  #toast { position: fixed; top: 18%; left: 50%; transform: translateX(-50%) scale(0.9); background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 999px; font-size: 20px; font-weight: 600; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; text-align: center; max-width: 90vw; }
  #toast.show { opacity: 1; transform: translateX(-50%) scale(1); }
  #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: rgba(255,255,255,0.8); box-shadow: 0 0 0 1px rgba(0,0,0,0.3); }
</style>
<script type="importmap">
{ "imports": {
  "three": "./yalpa/vendor/three.module.js",
  "cannon-es": "./yalpa/vendor/cannon-es.js"
} }
</script>
<script src="./yalpa/vendor/peerjs.min.js"></script>
</head>
<body>
<canvas id="game"></canvas>

<div id="menu">
  <div class="card">
    <h1>YALPA</h1>
    <div class="sub">yalpalayan online ragdoll macerası</div>
    <label for="name">İsmin</label>
    <input id="name" maxlength="14" placeholder="Yalpa42">
    <label>Kıyafet rengi <small style="opacity:.55;font-weight:400">(beyaz = klasik)</small></label>
    <div id="swatches"></div>
    <div class="lbl-row"><label>Kozmetik dolabı <small id="cos-count"></small></label><button id="random">🎲 Rastgele</button></div>
    <div id="cos-tabs"></div>
    <div id="cos-grid"></div>
    <button class="btn" id="host">Oda kur (online)</button>
    <div class="sep">— ya da arkadaşının odasına katıl —</div>
    <div class="row">
      <input id="code" maxlength="5" placeholder="KOD">
      <button class="btn blue" id="join">Katıl</button>
    </div>
    <button class="btn ghost" id="solo">Tek başına oyna</button>
    <div id="status"></div>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="panel" id="tl">
    <div id="room"></div>
    <ul id="players"></ul>
    <button class="mini" id="copy">Kodu kopyala</button><button class="mini" id="leave">Menüye dön</button>
  </div>
  <div class="panel" id="help">
    <div><b>WASD</b>yürü</div>
    <div><b>Fare</b>etrafa bak</div>
    <div><b>Sol / Sağ tık</b>sol / sağ elle tut (Q / E)</div>
    <div><b>Boşluk</b>zıpla</div>
    <div><b>Tırmanma</b>kenara tutun, aşağı bak + zıpla</div>
    <div><b>R</b>kontrol noktasına dön</div>
    <div><b>Esc</b>fareyi bırak</div>
  </div>
  <div id="cross"></div>
</div>
<div id="toast"></div>
<div id="ad-banner"><div class="ad-tag">Reklam</div></div>
<div id="ad-full" class="hidden">
  <div class="card">
    <div class="ad-tag">Reklam</div>
    <button class="ad-skip">Geç</button>
    <div class="ad-content"></div>
  </div>
</div>

<script type="module" src="./yalpa/src/game.js"></script>
</body>
</html>
