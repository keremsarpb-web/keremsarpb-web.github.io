<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Reversi - KSB Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
'use strict';
const cv=document.getElementById('c'),g=cv.getContext('2d'),FF='"Baloo 2","Trebuchet MS",system-ui,sans-serif';
let W=1,H=1,D=1,btns=[],PT=[],shake=0,state='title',T=0,best=0,muted=false,AC=null,mode=1,KEY='',last=0;
const R=Math.random,ri=n=>Math.floor(R()*n),PI=Math.PI;
function rs(){D=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*D);cv.height=Math.round(H*D);g.setTransform(D,0,0,D,0,0);if(typeof lay=='function')lay()}
addEventListener('resize',rs);
function ld(){KEY='ksb-'+ID+'-best';try{best=+localStorage.getItem(KEY)||0}catch(e){}}
function sv(s){if(s>best){best=s;try{localStorage.setItem(KEY,String(best))}catch(e){}}}
function snd(f,d=.12,t='sine',v=.07,s=0){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(muted)return;const o=AC.createOscillator(),a=AC.createGain(),n=AC.currentTime+s;o.type=t;o.frequency.setValueAtTime(f,n);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d+.02)}catch(e){}}
const jingle=(a,t='triangle')=>a.forEach((f,i)=>snd(f,.2,t,.07,i*.1));
function rr(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function tx(s,x,y,sz,c='#fff',al='center',w='700'){g.font=w+' '+sz+'px '+FF;g.textAlign=al;g.textBaseline='middle';g.fillStyle=c;g.fillText(s,x,y)}
function btn(x,y,w,h,s,fn,c='#f2b632',tc='#241600'){if(fn)btns.push({x,y,w,h,fn});g.save();if(!fn)g.globalAlpha=.4;rr(x,y,w,h,h*.28);g.fillStyle=c;g.fill();tx(s,x+w/2,y+h/2+1,Math.min(h*.5,(w-14)/(s.length*.5)),tc);g.restore()}
function burst(x,y,c,n=14){for(let i=0;i<n;i++)PT.push({x,y,vx:(R()-.5)*300,vy:(R()-.8)*280,l:1,c,s:2+R()*3})}
function topbar(st){btn(8,8,92,32,'Yeni oyun',()=>go(mode),'rgba(255,255,255,.18)','#fff');tx('Rekor '+best,W-52,24,15,'#fff','right');tx(st,W/2,62,Math.min(19,W/18))}
function ovr(t,s,c='#ffd24a'){g.fillStyle='rgba(5,8,20,.74)';g.fillRect(0,0,W,H);const z=Math.min(W*.11,64);tx(t,W/2,H*.36,z,c);tx(s,W/2,H*.36+z*.95,Math.min(W*.05,26));btn(W/2-110,H*.52,220,56,'Yeni oyun',()=>go(mode));tx('Tekrar için dokun / tıkla',W/2,H*.52+84,16,'#ccd')}
function title(){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,BG[0]);gr.addColorStop(1,BG[1]);g.fillStyle=gr;g.fillRect(0,0,W,H);deco();
const s=Math.min(W/(Math.max(...NAME.map(l=>l.length))*.62),H*.11,120);NAME.forEach((l,i)=>{const y=H*.27+(i-(NAME.length-1)/2)*s*1.08;tx(l,W/2+3,y+5,s,'rgba(0,0,0,.45)');tx(l,W/2,y,s,'#fff')});
const y2=H*.27+NAME.length*s*.62+10;tx(SUB,W/2,y2,Math.min(W*.05,24),ACC);
const py=TWO?H*.58:H*.66;g.globalAlpha=.65+.35*Math.sin(T*4);tx('Başlamak için dokun / tıkla',W/2,py,Math.min(W*.06,28));g.globalAlpha=1;
if(TWO){btn(W/2-130,H*.66,260,52,'Bilgisayara karşı',()=>go(1));btn(W/2-130,H*.66+64,260,52,'2 Oyuncu',()=>go(2),'rgba(255,255,255,.2)','#fff')}}
function speaker(){const x=W-26,y=24;g.save();g.fillStyle='rgba(255,255,255,.85)';g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=2;g.beginPath();g.moveTo(x-9,y-4);g.lineTo(x-4,y-4);g.lineTo(x+2,y-9);g.lineTo(x+2,y+9);g.lineTo(x-4,y+4);g.lineTo(x-9,y+4);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(x+5,y-5);g.lineTo(x+12,y+5);g.moveTo(x+12,y-5);g.lineTo(x+5,y+5)}else{g.arc(x+2,y,7,-.9,.9);g.moveTo(x+11,y-8);g.arc(x+2,y,12,-.9,.9)}g.stroke();g.restore()}
function pt(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const[x,y]=pt(e);try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)()}catch(_){}
if(Math.hypot(x-(W-26),y-24)<22&&state!='title'||Math.hypot(x-(W-26),y-24)<22){muted=!muted;return}
for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){snd(520,.06);b.fn();return}}
if(state=='title')go(1);else if(state=='over')go(mode);else if(typeof dn=='function')dn(x,y,e)});
addEventListener('pointermove',e=>{if(typeof mv=='function'){const[x,y]=pt(e);mv(x,y)}});
addEventListener('pointerup',e=>{if(typeof up=='function'){const[x,y]=pt(e);up(x,y)}});
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
if(e.key=='m'||e.key=='M'){muted=!muted;return}
if(e.key==' '||e.key=='Enter'){if(state=='title'){go(1);return}if(state=='over'){go(mode);return}}
if(typeof kd=='function')kd(e.key,e)});
function fr(t){requestAnimationFrame(fr);if(document.hidden){last=0;return}const dt=Math.min(.05,last?(t-last)/1000:.016);last=t;T+=dt;btns=[];
PT=PT.filter(p=>(p.l-=dt*1.6)>0);PT.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt});
g.save();if(shake>0){shake=Math.max(0,shake-dt*40);g.translate((R()-.5)*shake,(R()-.5)*shake)}
if(state=='title')title();else{upd(dt);draw()}
PT.forEach(p=>{g.globalAlpha=Math.max(0,p.l);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.s,0,7);g.fill()});g.globalAlpha=1;g.restore();speaker()}
document.addEventListener('visibilitychange',()=>{last=0});

const ID='reversi',NAME=['REVERSİ'],SUB='8×8 · taşları çevir',BG=['#0f6a55','#031a16'],ACC='#9bffd8',TWO=true;
let B=[],FT=[],FL=[],turn=1,sq=40,bx=0,by=0,msg='',msgT=0,aiT=0,hint=[];
const WT=(()=>{const w=Array(64).fill(0);for(let i=0;i<64;i++){const r=i>>3,c=i&7,er=r==0||r==7,ec=c==0||c==7;w[i]=er&&ec?100:(er||ec)?6:0;const nr=r==1||r==6,nc=c==1||c==6;if(nr&&nc)w[i]=-30;else if((nr&&ec)||(nc&&er))w[i]=-12}return w})();
function lay(){const S=Math.min(W-12,H-170);sq=S/8;bx=(W-S)/2;by=Math.max(78,(H-S-30)/2)}
function go(m){mode=m||mode;B=Array(64).fill(0);FT=Array(64).fill(-9);FL=Array(64).fill(false);B[27]=B[36]=2;B[28]=B[35]=1;turn=1;msg='';aiT=0;state='play';hint=valid(B,1);lay();jingle([330,415])}
function flips(b,i,p){const r=i>>3,c=i&7,o=[];if(b[i])return o;
for(let dr=-1;dr<2;dr++)for(let dc=-1;dc<2;dc++){if(!dr&&!dc)continue;let x=r+dr,y=c+dc;const t=[];while(x>=0&&x<8&&y>=0&&y<8&&b[x*8+y]==3-p){t.push(x*8+y);x+=dr;y+=dc}if(t.length&&x>=0&&x<8&&y>=0&&y<8&&b[x*8+y]==p)o.push(...t)}return o}
function valid(b,p){const a=[];for(let i=0;i<64;i++)if(!b[i]&&flips(b,i,p).length)a.push(i);return a}
function put(i){const f=flips(B,i,turn);B[i]=turn;FT[i]=T;FL[i]=false;f.forEach((j,k)=>{B[j]=turn;FT[j]=T+k*.03;FL[j]=true});
snd(turn==1?300:400,.08,'triangle');if(f.length>2)snd(600,.12,'sine',.05,.1);burst(bx+((i&7)+.5)*sq,by+((i>>3)+.5)*sq,turn==1?'#222':'#fff',8);
turn=3-turn;hint=valid(B,turn);
if(!hint.length){turn=3-turn;hint=valid(B,turn);if(!hint.length){fin();return}msg=(turn==1?'Beyaz':'Siyah')+' pas geçti';if(mode==1&&turn==1)msg='Bilgisayar pas geçti';msgT=2}aiT=0}
function cnt(p){return B.filter(x=>x==p).length}
function fin(){state='over';const a=cnt(1),b=cnt(2);if(mode==1)sv(a);jingle(a>b||mode==2?[523,659,784,1047]:[300,250,200]);burst(W/2,H/2,'#9bffd8',40)}
function ai(){let bi=-1,bv=-1e9;for(const i of hint){const v=flips(B,i,2).length*2+WT[i]+R()*3;if(v>bv){bv=v;bi=i}}put(bi)}
function dn(x,y){if(mode==1&&turn==2)return;const c=Math.floor((x-bx)/sq),r=Math.floor((y-by)/sq);if(r<0||r>7||c<0||c>7)return;const i=r*8+c;if(hint.includes(i))put(i);else snd(150,.08,'square',.04)}
function upd(dt){if(msgT>0)msgT-=dt;if(state=='play'&&mode==1&&turn==2){aiT+=dt;if(aiT>.8)ai()}}
function disc(x,y,r,p,sx=1){g.save();g.translate(x,y);g.scale(sx,1);g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=6;g.shadowOffsetY=2;const gr=g.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r);gr.addColorStop(0,p==1?'#666':'#fff');gr.addColorStop(1,p==1?'#050505':'#c9d3d0');g.fillStyle=gr;g.beginPath();g.arc(0,0,r,0,7);g.fill();g.restore()}
function draw(){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0f5a48');gr.addColorStop(1,'#031a16');g.fillStyle=gr;g.fillRect(0,0,W,H);
const a=cnt(1),b=cnt(2);topbar(msgT>0?msg:state=='over'?'Oyun bitti':mode==2?(turn==1?'Sıra: Siyah':'Sıra: Beyaz'):(turn==1?'Sıra sende (siyah)':'Bilgisayar düşünüyor...'));
g.fillStyle='#02100d';rr(bx-8,by-8,sq*8+16,sq*8+16,10);g.fill();g.fillStyle='#14946f';g.fillRect(bx,by,sq*8,sq*8);g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=1.5;
for(let i=0;i<=8;i++){g.beginPath();g.moveTo(bx+i*sq,by);g.lineTo(bx+i*sq,by+sq*8);g.moveTo(bx,by+i*sq);g.lineTo(bx+sq*8,by+i*sq);g.stroke()}
for(let i=0;i<64;i++){const x=bx+((i&7)+.5)*sq,y=by+((i>>3)+.5)*sq;if(!B[i])continue;const age=T-FT[i];if(age<0){disc(x,y,sq*.4,3-B[i]);continue}
if(FL[i]&&age<.4){const q=age/.4;disc(x,y,sq*.4,q<.5?3-B[i]:B[i],Math.max(.05,Math.abs(Math.cos(q*PI))))}else disc(x,y,sq*.4*(age<.15?.6+age/.15*.4:1),B[i])}
if(state=='play'&&!(mode==1&&turn==2))hint.forEach(i=>{g.fillStyle='rgba(255,255,255,'+(.25+.15*Math.sin(T*5))+')';g.beginPath();g.arc(bx+((i&7)+.5)*sq,by+((i>>3)+.5)*sq,sq*.14,0,7);g.fill()});
const sy=by+sq*8+36;disc(W/2-70,sy,16,1);tx(String(a),W/2-44,sy+1,26,'#fff','left');disc(W/2+30,sy,16,2);tx(String(b),W/2+56,sy+1,26,'#fff','left');
if(state=='over')ovr(a>b?(mode==1?'Kazandın!':'Siyah kazandı'):a<b?(mode==1?'Bilgisayar kazandı':'Beyaz kazandı'):'Berabere',a+' - '+b)}
function deco(){for(let i=0;i<16;i++){const x=(i*113+T*14)%(W+80)-40,y=(i*167+T*20*(1+i%2))%(H+80)-40;disc(x,y,22+i%3*10,1+i%2,Math.cos(T*1.5+i))}}

ld();rs();requestAnimationFrame(fr);
</script></body></html>
