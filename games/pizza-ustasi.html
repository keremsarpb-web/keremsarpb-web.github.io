<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pizza Ustası – KSB Games</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head>
<body><canvas id="c"></canvas><script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),ID='pizza-ustasi';let W=1,H=1,S=1,best=0,AC,muted=false,state='title',score=0,shake=0,tm=0,parts=[],ot=0;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);S=Math.min(W,H)}
addEventListener('resize',rs);rs();
try{best=+localStorage.getItem('ksb-'+ID+'-best')||0}catch(e){}
function sv(){if(score>best){best=score;try{localStorage.setItem('ksb-'+ID+'-best',best)}catch(e){}}}
function snd(f,d,t,v,sl){if(muted||!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);a.gain.setValueAtTime(v||.06,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function T(s,x,y,z,c,a,w){g.font=(w||700)+' '+z+'px Fredoka,Nunito,system-ui,sans-serif';g.textAlign=a||'center';g.textBaseline='middle';g.fillStyle=c||'#fff';g.fillText(s,x,y)}
function RR(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function P(x,y,n,c,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(sp||150)*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.7,c})}}
function upP(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt}parts=parts.filter(p=>p.l>0)}
function drP(){for(const p of parts){g.globalAlpha=Math.max(0,p.l/.7);g.fillStyle=p.c;g.fillRect(p.x-2,p.y-2,4,4)}g.globalAlpha=1}
function titleScr(name,sub,y0){const z=Math.min(S*.15,W*.92/(name.length*.62));y0=y0||H*.3;g.save();g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=z*.2;g.shadowOffsetY=z*.06;T(name,W/2,y0+Math.sin(tm*2)*z*.05,z,'#fff',0,800);g.restore();if(sub)T(sub,W/2,y0+z*.85,Math.max(13,z*.3),'rgba(255,255,255,.9)',0,500);g.globalAlpha=.65+.35*Math.sin(tm*4);T('Başlamak için dokun / tıkla',W/2,H*.78,Math.max(15,Math.min(S*.05,30)),'#fff',0,700);g.globalAlpha=1;if(best)T('En iyi: '+best,W/2,H*.78+Math.max(28,S*.08),Math.max(13,S*.035),'#ffe',0,500)}
function overScr(t,l2){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,H);const z=Math.min(S*.11,W*.9/(t.length*.62));T(t,W/2,H*.32,z,'#fff',0,800);T('Skor: '+score,W/2,H*.32+z*1.1,z*.55,'#ffd54a');T('En iyi: '+best,W/2,H*.32+z*1.8,z*.4,'#fff',0,500);if(l2)T(l2,W/2,H*.32+z*2.4,z*.35,'#cde',0,500);if(ot>.5){g.globalAlpha=.6+.4*Math.sin(tm*4);T('Tekrar için dokun / tıkla',W/2,H*.75,Math.max(15,Math.min(S*.05,30)));g.globalAlpha=1}}
const IN={down(){},up(){},mv(){},kd(){},ku(){}};
function initA(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
cv.addEventListener('pointerdown',e=>{e.preventDefault();initA();if(e.clientX>W-50&&e.clientY<50){muted=!muted;return}IN.down(e.clientX,e.clientY,e.pointerId)});
addEventListener('pointerup',e=>IN.up(e.clientX,e.clientY,e.pointerId));
addEventListener('pointercancel',e=>IN.up(e.clientX,e.clientY,e.pointerId));
addEventListener('pointermove',e=>IN.mv(e.clientX,e.clientY,e.pointerId));
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();initA();if(e.repeat)return;if(e.key==='m'||e.key==='M'){muted=!muted;return}IN.kd(e.key)});
addEventListener('keyup',e=>IN.ku(e.key));
function spk(){const x=W-26,y=26;g.save();g.globalAlpha=.8;g.fillStyle='#fff';g.fillRect(x-9,y-4,5,8);g.beginPath();g.moveTo(x-4,y-4);g.lineTo(x+2,y-9);g.lineTo(x+2,y+9);g.lineTo(x-4,y+4);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();if(muted){g.moveTo(x+5,y-5);g.lineTo(x+13,y+5);g.moveTo(x+13,y-5);g.lineTo(x+5,y+5)}else g.arc(x+2,y,7,-1,1);g.stroke();g.restore()}
let last=performance.now();
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;if(document.hidden)dt=0;tm+=dt;if(state==='over')ot+=dt;shake=Math.max(0,shake-dt*40);if(dt>0)step(dt);g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);render();g.restore();spk();requestAnimationFrame(loop)}
/* ---- game ---- */
const NM=['Mantar','Sucuk','Zeytin','Biber','Mısır','Peynir'],SK=['#f1e3c8','#d9432b','#2b2b36','#4caf50','#ffd23f','#ffe27a'];
let cust=[null,null,null],sel=0,prog=0,lives=3,spawnT=0,served=0,fl=[];
function ico(k,x,y,r){g.save();g.translate(x,y);g.fillStyle=SK[k];
 if(k==0){g.beginPath();g.arc(0,0,r,Math.PI,0);g.fill();g.fillStyle='#e8d5b0';g.fillRect(-r*.35,0,r*.7,r*.8)}
 else if(k==1){g.beginPath();g.arc(0,0,r*.9,0,7);g.fill();g.fillStyle='#ffb3a0';for(let i=0;i<4;i++){g.beginPath();g.arc(Math.cos(i*1.6)*r*.4,Math.sin(i*1.6)*r*.4,r*.14,0,7);g.fill()}}
 else if(k==2){g.beginPath();g.arc(0,0,r*.85,0,7);g.fill();g.fillStyle='#e8b060';g.beginPath();g.arc(0,0,r*.35,0,7);g.fill()}
 else if(k==3){g.beginPath();g.ellipse(0,0,r,r*.5,.6,0,7);g.fill();g.fillStyle='#2e7d32';g.fillRect(-r*.1,-r*.9,r*.3,r*.4)}
 else if(k==4){for(let i=0;i<3;i++)for(let j=0;j<3;j++){g.fillRect(-r*.9+i*r*.65,-r*.9+j*r*.65,r*.5,r*.5)}}
 else{g.beginPath();g.moveTo(-r,r*.7);g.lineTo(r,r*.7);g.lineTo(0,-r*.8);g.fill();g.fillStyle='#e0a800';g.beginPath();g.arc(-r*.1,r*.2,r*.15,0,7);g.arc(r*.3,r*.4,r*.12,0,7);g.fill()}
 g.restore()}
function brect(i){const c6=W>H*1.1,cols=c6?6:3,bw=Math.min(W/(cols+.4),H*(c6?.2:.135)),gap=bw*.1,x0=(W-(cols*bw+(cols-1)*gap))/2,top=H*(c6?.76:.69),r=Math.floor(i/cols),c=i%cols;return[x0+c*(bw+gap),top+r*(bw+gap),bw]}
function spawn(){const fr=[0,1,2].filter(i=>!cust[i]);if(!fr.length)return;const n=Math.min(4,2+Math.floor(served/5)+(Math.random()<.3?1:0)),o=[];for(let i=0;i<n;i++)o.push(Math.floor(Math.random()*6));const pt=Math.max(11,24-served*.5);cust[fr[Math.floor(Math.random()*fr.length)]]={o,pat:pt,max:pt,hue:Math.floor(Math.random()*360),t:0}}
function go(){if(state==='title'||(state==='over'&&ot>.5)){cust=[null,null,null];sel=0;prog=0;lives=3;score=0;served=0;spawnT=0;fl=[];state='play'}}
function add(k){const c=cust[sel];if(!c)return;if(c.o[prog]===k){prog++;snd(500+prog*120,.12,'triangle',.08);const[x,y,b]=brect(k);P(x+b/2,y+b/2,6,SK[k],120);
 if(prog>=c.o.length){const pts=c.o.length*10+Math.ceil(c.pat);score+=pts;sv();served++;snd(880,.3,'sine',.08,600);P(W/2,H*.52,22,'#ffd23f',220);fl.push({s:'+'+pts,x:W/2,y:H*.45,l:1});cust[sel]=null;prog=0}}
 else{prog=0;c.pat-=2;shake=8;snd(130,.25,'sawtooth',.07,-60)}}
IN.down=(x,y)=>{if(state!=='play'){go();return}if(y<H*.4){const i=Math.min(2,Math.floor(x/(W/3)));if(cust[i]&&i!==sel){sel=i;prog=0}return}for(let i=0;i<6;i++){const[bx,by,b]=brect(i);if(x>=bx&&x<=bx+b&&y>=by&&y<=by+b){add(i);return}}};
IN.kd=k=>{if(state!=='play'){go();return}if(k>='1'&&k<='6')add(+k-1);if(k==='ArrowLeft'||k==='ArrowRight'){const d=k==='ArrowLeft'?-1:1;for(let i=1;i<3;i++){const j=(sel+d*i+3)%3;if(cust[j]){sel=j;prog=0;break}}}};
function step(dt){upP(dt);for(const f of fl){f.y-=50*dt;f.l-=dt}fl=fl.filter(f=>f.l>0);if(state!=='play')return;
 spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(3,8-served*.25)}
 for(let i=0;i<3;i++){const c=cust[i];if(!c)continue;c.t+=dt;c.pat-=dt;if(c.pat<=0){cust[i]=null;if(i===sel)prog=0;lives--;shake=10;snd(100,.4,'sawtooth',.08,-50);if(lives<=0){sv();state='over';ot=0}}}
 if(!cust[sel]){const j=cust.findIndex(c=>c);if(j>=0){sel=j;prog=0}}}
function pizza(cx,cy,r,n,o,rot){g.save();g.translate(cx,cy);g.rotate(rot||0);g.fillStyle='#e0a458';g.beginPath();g.arc(0,0,r,0,7);g.fill();g.fillStyle='#c0392b';g.beginPath();g.arc(0,0,r*.88,0,7);g.fill();g.fillStyle='#ffd873';g.beginPath();g.arc(0,0,r*.8,0,7);g.fill();
 for(let i=0;i<n;i++){for(let j=0;j<5;j++){const a=j/5*6.283+i*1.1,d=r*(.3+.25*((i+j)%2));ico(o[i],Math.cos(a)*d,Math.sin(a)*d,r*.13)}}g.restore()}
function face(cx,cy,r,c,mood){g.fillStyle='hsl('+c.hue+',60%,75%)';g.beginPath();g.arc(cx,cy,r,0,7);g.fill();g.fillStyle='hsl('+c.hue+',60%,45%)';g.beginPath();g.arc(cx,cy-r*.6,r*.9,Math.PI,0);g.fill();g.fillStyle='#fff';g.fillRect(cx-r*.5,cy-r*.45,r*.4,r*.35);g.fillRect(cx+r*.1,cy-r*.45,r*.4,r*.35);g.fillStyle='#222';g.fillRect(cx-r*.35,cy-r*.35,r*.15,r*.2);g.fillRect(cx+r*.25,cy-r*.35,r*.15,r*.2);g.strokeStyle='#722';g.lineWidth=2;g.beginPath();g.arc(cx,cy+r*(mood>.5?.15:.6),r*.35,mood>.5?.2:Math.PI+.4,mood>.5?Math.PI-.2:6.28-.4);g.stroke()}
function render(){
 g.fillStyle='#7b2d3b';g.fillRect(0,0,W,H);g.fillStyle='rgba(255,255,255,.05)';const q=S/10;for(let i=0;i<W/q+1;i++)for(let j=0;j<H*.4/q+1;j++)if((i+j)%2)g.fillRect(i*q,j*q,q,q);
 g.fillStyle='#b5834a';g.fillRect(0,H*.4,W,H*.04);g.fillStyle='#e8d9c0';g.fillRect(0,H*.44,W,H*.56);g.fillStyle='rgba(0,0,0,.06)';for(let i=0;i<W/q+1;i++)for(let j=0;j<H*.56/q+1;j++)if((i+j)%2)g.fillRect(i*q,H*.44+j*q,q,q);
 const sw=W/3,pr=Math.min(S*.2,H*.13),sc=state==='title'?null:cust[sel];
 for(let i=0;i<3;i++){const c=cust[i];if(!c)continue;const cx=(i+.5)*sw,r=Math.min(sw*.2,H*.055),ir=Math.min(sw/9.5,H*.03),bw=c.o.length*ir*2.3+ir,by=H*.1;
  if(i===sel){g.fillStyle='rgba(255,255,255,.18)';RR(i*sw+4,H*.06,sw-8,H*.33,12);g.fill()}
  g.fillStyle='#fff';RR(cx-bw/2,by,bw,ir*2.6,ir);g.fill();for(let k=0;k<c.o.length;k++){const ix=cx-bw/2+ir*1.5+k*ir*2.3;g.globalAlpha=i===sel&&k<prog?.25:1;ico(c.o[k],ix,by+ir*1.3,ir);g.globalAlpha=1}
  face(cx,H*.24+Math.sin(c.t*2+i)*2,r,c,c.pat/c.max);const bw2=sw*.7,f=Math.max(0,c.pat/c.max);g.fillStyle='rgba(0,0,0,.4)';RR(cx-bw2/2,H*.33,bw2,8,4);g.fill();g.fillStyle=f>.5?'#6fdc6f':f>.25?'#ffc84a':'#ff5a5a';RR(cx-bw2/2,H*.33,bw2*f,8,4);g.fill()}
 if(state==='title'){const o=[0,1,2,3,4,5];pizza(W/2,H*.52,Math.min(S*.3,H*.2),6,o,tm*.4);g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,H*.06,W,H*.17);titleScr('Pizza Ustası','Siparişi sırayla hazırla, müşteri beklemesin!',H*.12);return}
 pizza(W/2,H*.545,pr,prog,sc?sc.o:[],0);if(sc)T('Sipariş: '+prog+'/'+sc.o.length,W/2,H*.545+pr+Math.max(14,S*.04),Math.max(13,S*.035),'#5a3a1a',0,600);else T('Müşteri bekleniyor...',W/2,H*.52,S*.04,'#5a3a1a');
 for(let i=0;i<6;i++){const[x,y,b]=brect(i);g.fillStyle='#fff';RR(x,y,b,b,b*.18);g.fill();g.strokeStyle='#d0b48a';g.lineWidth=3;g.stroke();ico(i,x+b/2,y+b*.42,b*.25);T(NM[i],x+b/2,y+b*.82,b*.15,'#5a3a1a',0,600)}
 for(const f of fl){g.globalAlpha=Math.min(1,f.l);T(f.s,f.x,f.y,S*.08,'#ff9d00');g.globalAlpha=1}drP();
 const z=Math.max(14,Math.min(S*.045,24));T('Skor '+score,10,z,z,'#fff','left');for(let i=0;i<lives;i++)T('♥',W-70-i*z*1.1,z,z*1.1,'#ff6b81');
 if(state==='over')overScr('Dükkan Kapandı','Servis edilen pizza: '+served)}
requestAnimationFrame(loop);
</script></body></html>
