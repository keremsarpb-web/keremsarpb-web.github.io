<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>İstilacılar - KSB Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100vw;height:100vh;touch-action:none}</style></head><body><canvas id="c"></canvas>
<script>
const ID='istilacilar',cv=document.getElementById('c'),g=cv.getContext('2d'),keys={},ptrs=new Set(),rnd=Math.random,rr=(a,b)=>a+rnd()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let W=1,H=1,DPR=1,best=0,state='title',last=0,T=0,overT=0,shk=0,parts=[],muted=false,AC,score=0,touchMode=false;
try{best=+localStorage.getItem('ksb-'+ID+'-best')||0}catch(e){}
try{touchMode=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window}catch(e){}
function rs(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);if(window.onRs)onRs()}
addEventListener('resize',rs);
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
function snd(f,d,t,v,f2){if(muted||!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),k=AC.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);k.gain.setValueAtTime(v||.06,n);k.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(k);k.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function tx(s,x,y,z,c,a,w){g.font=(w||700)+' '+z+'px Fredoka,system-ui,sans-serif';g.textAlign=a||'center';g.textBaseline='middle';g.fillStyle=c||'#fff';g.fillText(s,x,y,W*.94)}
function rrect(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function burst(x,y,c,n,sp){n=n||12;sp=sp||200;for(let i=0;i<n;i++){const a=rnd()*6.283,s=rnd()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.4+rnd()*.5,m:.9,c})}}
function setBest(){if(score>best){best=score;try{localStorage.setItem('ksb-'+ID+'-best',best)}catch(e){}}}
function die(){if(state=='over')return;state='over';overT=T;setBest()}
function zs(){return Math.max(14,Math.min(W*.05,H*.034,26))}
function ttl(name,acc,l1,l2){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,W,H);const w=name.split(' '),z=Math.min(W*(w.length>1?.19:.15),H*.11,120),y0=H*.3-(w.length>1?z*.55:0),q=zs();
g.save();g.shadowColor=acc;g.shadowBlur=24;w.forEach((s,i)=>tx(s,W/2,y0+i*z*1.08,z,i?acc:'#fff'));g.restore();
tx(l1,W/2,H*.5,q,'#fff',0,500);if(l2)tx(l2,W/2,H*.5+q*1.5,q,'#fff',0,500);
g.globalAlpha=.65+.35*Math.sin(T*4);tx('Başlamak için dokun / tıkla',W/2,H*.72,q*1.25,acc);g.globalAlpha=1;if(best)tx('En yüksek: '+best,W/2,H*.72+q*2.3,q,'#fff',0,500)}
function ovr(acc,l){g.fillStyle='rgba(0,0,0,.62)';g.fillRect(0,0,W,H);const z=Math.min(W*.14,H*.1,84),q=zs();g.save();g.shadowColor=acc;g.shadowBlur=22;tx('OYUN BİTTİ',W/2,H*.3,z,acc);g.restore();
tx(l||('Skor: '+score),W/2,H*.43,q*1.6);tx('En yüksek: '+best,W/2,H*.43+q*2,q,'#fff',0,500);g.globalAlpha=.65+.35*Math.sin(T*4);tx('Tekrar için dokun / tıkla',W/2,H*.64,q*1.25,acc);g.globalAlpha=1}
function spk(){g.save();g.globalAlpha=.8;g.fillStyle=g.strokeStyle='#fff';g.lineWidth=2;const x=W-30,y=24;g.beginPath();g.moveTo(x-8,y-4);g.lineTo(x-3,y-4);g.lineTo(x+3,y-9);g.lineTo(x+3,y+9);g.lineTo(x-3,y+4);g.lineTo(x-8,y+4);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(x+7,y-5);g.lineTo(x+15,y+5);g.moveTo(x+15,y-5);g.lineTo(x+7,y+5)}else g.arc(x+3,y,8,-1,1);g.stroke();g.restore()}
function begin(){ptrs.clear();reset();state='play'}
function pxy(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/(r.width||W),(e.clientY-r.top)*H/(r.height||H)]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();if(e.pointerType=='touch')touchMode=true;const[x,y]=pxy(e);if(x>W-46&&y<46){muted=!muted;return}
if(state!='play'){if(state=='title'||T-overT>.5)begin();return}
ptrs.add(e.pointerId);try{cv.setPointerCapture(e.pointerId)}catch(_){}if(window.gDown)gDown(x,y,e)});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;e.preventDefault();const[x,y]=pxy(e);if(window.gMove)gMove(x,y,e)});
const pu=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);const[x,y]=pxy(e);if(window.gUp)gUp(x,y,e)};
cv.addEventListener('pointerup',pu);cv.addEventListener('pointercancel',pu);cv.addEventListener('contextmenu',e=>e.preventDefault());
const NAV=['Space','Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
addEventListener('keydown',e=>{ac();if(e.code=='KeyM'){if(!e.repeat)muted=!muted;return}if(NAV.includes(e.code))e.preventDefault();
if(state!='play'){if(!e.repeat&&NAV.includes(e.code)&&(state=='title'||T-overT>.5))begin();return}
keys[e.code]=1;if(!e.repeat&&window.gKey)gKey(e.code)});
addEventListener('keyup',e=>{keys[e.code]=0});
document.addEventListener('visibilitychange',()=>{try{if(AC)document.hidden?AC.suspend():AC.resume()}catch(e){}});
function loop(t){requestAnimationFrame(loop);if(document.hidden){last=t;return}const dt=Math.min((t-last)/1000||0,.05);last=t;T+=dt;g.setTransform(DPR,0,0,DPR,0,0);g.save();
if(shk>.3){shk*=Math.pow(.01,dt);g.translate((rnd()-.5)*shk,(rnd()-.5)*shk)}else shk=0;
frame(dt);for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);for(const p of parts){g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;g.fillRect(p.x-2,p.y-2,4,4)}g.globalAlpha=1;g.restore();spk()}
function boot(){rs();requestAnimationFrame(t=>{last=t;loop(t)})}

const GW=360,GH=640,CY=590,AC3=['#ff5fd2','#4dd2ff','#9dff5f'],stars=Array.from({length:90},()=>({x:rnd(),y:rnd(),z:rnd()*.8+.2}));
let sc,ox,oy,al,fx,fy,fd,sh,bl,eb,cx,tgt,lives,wave,fireT,inv,ufo,ufoT,esT,msg,msgT,aliveN;
function onRs(){sc=Math.min(W/GW,H/GH);ox=(W-GW*sc)/2;oy=(H-GH*sc)/2}
const B=(x,y,c,n,sp)=>burst(ox+x*sc,oy+y*sc,c,n,sp||200);
function newWave(){al=[];for(let r=0;r<5;r++)for(let c=0;c<8;c++)al.push({c,r,a:true});aliveN=40;fx=30;fy=64+Math.min(wave-1,5)*12;fd=1;bl=[];eb=[];esT=1;
sh=[];for(let i=0;i<4;i++)for(let y=0;y<6;y++)for(let x=0;x<10;x++)if(!((y==5&&x>2&&x<7)||(y==0&&(x<1||x>8))))sh.push({x:45+i*80+x*5,y:490+y*5})}
function reset(){score=0;lives=3;wave=1;cx=tgt=GW/2;fireT=.3;inv=0;ufo=null;ufoT=12;msgT=0;newWave()}
const AX=a=>fx+a.c*38,AY=a=>fy+a.r*30;
function fire(){bl.push({x:cx,y:CY-20});snd(900,.12,'square',.04,300)}
function upd(dt,demo){const sp=22+(40-aliveN)/40*95+wave*5;fx+=fd*sp*dt;let mn=1e9,mx=-1e9,lo=0;for(const a of al)if(a.a){mn=Math.min(mn,AX(a));mx=Math.max(mx,AX(a)+24);lo=Math.max(lo,AY(a)+18)}
if(mx>GW-8&&fd>0||mn<8&&fd<0){fd=-fd;fx+=fd*2;if(!demo)fy+=14;else fy=64}
if(demo)return;if(lo>CY-18){shk=16;die();return}
if(msgT>0)msgT-=dt;
const kl=(keys.ArrowLeft||keys.KeyA?-1:0)+(keys.ArrowRight||keys.KeyD?1:0);if(kl){cx+=kl*300*dt;tgt=cx}else cx+=cl(tgt-cx,-560*dt,560*dt);cx=cl(cx,16,GW-16);tgt=cl(tgt,16,GW-16);
fireT-=dt;if(fireT<=0){fire();fireT=keys.Space?.2:.4}if(inv>0)inv-=dt;
for(const b of bl)b.y-=540*dt;for(const b of eb)b.y+=(170+wave*12)*dt;
if((esT-=dt)<=0){esT=Math.max(.35,1.3-wave*.09)*rnd()+.25;const cs=al.filter(a=>a.a&&!al.some(o=>o.a&&o.c==a.c&&o.r>a.r));if(cs.length){const a=cs[rnd()*cs.length|0];eb.push({x:AX(a)+12,y:AY(a)+18});snd(300,.15,'sawtooth',.03,150)}}
if((ufoT-=dt)<=0&&!ufo){ufo={x:-30,v:rr(70,100)};ufoT=rr(14,22)}if(ufo){ufo.x+=ufo.v*dt;if(ufo.x>GW+30)ufo=null}
for(const b of bl){for(const a of al)if(a.a&&Math.abs(b.x-AX(a)-12)<13&&Math.abs(b.y-AY(a)-9)<10){a.a=false;b.y=-99;aliveN--;score+=a.r==0?30:a.r<3?20:10;B(AX(a)+12,AY(a)+9,AC3[a.r==0?0:a.r<3?1:2],14);snd(150,.15,'square',.06,40)}
if(ufo&&b.y>0&&Math.abs(b.x-ufo.x)<16&&Math.abs(b.y-44)<10){score+=50*(1+(rnd()*3|0));B(ufo.x,44,'#ffd23f',24,260);ufo=null;b.y=-99;snd(600,.4,'sine',.07,100);shk=6}}
for(const b of bl.concat(eb)){if(b.y<0||b.y>GH)continue;for(const c of sh)if(Math.abs(b.x-c.x-2.5)<4&&Math.abs(b.y-c.y-2.5)<5){for(const d of sh)if(Math.hypot(d.x-c.x,d.y-c.y)<8&&rnd()<.75)d.x=-99;b.y=-99;B(c.x,c.y,'#4df3a3',5,90);break}}
for(const a of al)if(a.a&&AY(a)+18>485)for(const c of sh)if(c.x>AX(a)-4&&c.x<AX(a)+28&&c.y>AY(a)-4&&c.y<AY(a)+20)c.x=-99;
sh=sh.filter(c=>c.x>-50);bl=bl.filter(b=>b.y>-20);eb=eb.filter(b=>b.y<GH+10);
for(const b of eb)if(inv<=0&&Math.abs(b.x-cx)<14&&b.y>CY-12&&b.y<CY+12){b.y=GH+99;lives--;inv=2;shk=14;B(cx,CY,'#4df3a3',30,300);snd(220,.5,'sawtooth',.09,40);if(lives<=0){die();return}}
if(aliveN<=0){wave++;score+=100;newWave();msg='Dalga '+wave;msgT=1.6;snd(500,.4,'triangle',.07,1000)}}
function alien(x,y,t,ph){g.fillStyle=AC3[t];g.strokeStyle=AC3[t];g.lineWidth=2.5;const w=ph?3:0;
if(t==0){g.beginPath();g.ellipse(x+12,y+9,11,8,0,0,6.3);g.fill();g.beginPath();g.moveTo(x+6,y+3);g.lineTo(x+3,y-3);g.moveTo(x+18,y+3);g.lineTo(x+21,y-3);g.stroke();g.beginPath();g.moveTo(x+6,y+15);g.lineTo(x+4-w,y+20);g.moveTo(x+18,y+15);g.lineTo(x+20+w,y+20);g.stroke()}
else if(t==1){rrect(x+3,y+3,18,12,4);g.fill();g.beginPath();g.moveTo(x+3,y+8);g.lineTo(x-w,y+2);g.moveTo(x+21,y+8);g.lineTo(x+24+w,y+2);g.moveTo(x+7,y+15);g.lineTo(x+5,y+20);g.moveTo(x+17,y+15);g.lineTo(x+19,y+20);g.stroke()}
else{g.beginPath();g.arc(x+12,y+11,10,Math.PI,0);g.lineTo(x+22,y+14);g.lineTo(x+2,y+14);g.fill();for(let i=0;i<4;i++){g.beginPath();g.moveTo(x+4+i*5,y+14);g.lineTo(x+3+i*5+(ph?2:-2),y+20);g.stroke()}}
g.fillStyle='#10102a';g.beginPath();g.arc(x+8,y+9,2.3,0,6.3);g.arc(x+16,y+9,2.3,0,6.3);g.fill()}
function cannon(x,y){g.save();g.shadowColor='#4df3a3';g.shadowBlur=12;g.fillStyle='#4df3a3';g.fillRect(x-2.5,y-20,5,12);g.beginPath();g.moveTo(x-16,y+10);g.lineTo(x-12,y-6);g.lineTo(x+12,y-6);g.lineTo(x+16,y+10);g.closePath();g.fill();g.fillStyle='#d6fff0';g.fillRect(x-6,y-2,12,4);g.restore()}
function draw(){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#05051a');gr.addColorStop(1,'#1a0b3a');g.fillStyle=gr;g.fillRect(0,0,W,H);
for(const s of stars){g.globalAlpha=.4+.5*Math.abs(Math.sin(T*s.z*2+s.x*9));g.fillStyle='#fff';g.fillRect(s.x*W,(s.y*H+T*18*s.z)%H,1+s.z*1.5,1+s.z*1.5)}g.globalAlpha=1;
g.save();g.translate(ox,oy);g.scale(sc,sc);
for(const a of al)if(a.a)alien(AX(a),AY(a),a.r==0?0:a.r<3?1:2,Math.floor(T*2+a.c)%2);
g.fillStyle='#4df3a3';for(const c of sh){g.globalAlpha=.9;g.fillRect(c.x,c.y,4.5,4.5)}g.globalAlpha=1;
if(ufo){g.fillStyle='#ffd23f';g.beginPath();g.ellipse(ufo.x,46,16,6,0,0,6.3);g.fill();g.fillStyle='#ff7a59';g.beginPath();g.arc(ufo.x,43,8,Math.PI,0);g.fill()}
g.save();g.shadowColor='#fff';g.shadowBlur=8;g.fillStyle='#fff';for(const b of bl)g.fillRect(b.x-1.5,b.y-7,3,12);g.fillStyle='#ff5f6d';for(const b of eb){g.beginPath();g.arc(b.x,b.y,3.5+Math.sin(T*20)*1,0,6.3);g.fill()}g.restore();
if(state!='over'&&!(inv>0&&Math.floor(T*14)%2))cannon(cx,CY);
if(state!='title'){tx('Skor '+score,10,18,18,'#fff','left');tx('Dalga '+wave,GW/2,18,16,'#9fb0ff');for(let i=0;i<lives;i++){g.fillStyle='#4df3a3';g.fillRect(GW-28-i*16,12,10,10)}if(msgT>0)tx(msg,GW/2,GH/2,40,'#fff')}
g.restore()}
function gDown(x,y){tgt=(x-ox)/sc}
function gMove(x,y){tgt=(x-ox)/sc}
function frame(dt){if(state=='play')upd(dt);else if(state=='title')upd(dt,1);draw();
if(state=='title')ttl('İstilacılar','#4df3a3','Sürükle: topu hareket ettir','Ateş otomatik · Space: hızlı ateş');else if(state=='over')ovr('#ff5fd2')}
rs();reset();boot();
</script></body></html>
