<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Üç Eşleştir · KSB Games</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#2a1240;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100vw;height:100vh;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const KEY='ksb-uc-eslestir-best';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,S,best=0,muted=false,AC,last=0,shake=0,parts=[],T=0;
try{best=+localStorage.getItem(KEY)||0}catch(e){}
const sv=()=>{try{localStorage.setItem(KEY,best)}catch(e){}};
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b));
function rs(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);S=Math.min(W,H);if(window.lay)lay()}
addEventListener('resize',rs);
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function tx(s,x,y,z,col,al,wt){ctx.font=(wt||800)+' '+z+'px system-ui,"Segoe UI",sans-serif';ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y)}
function snd(f,d,ty,v,f2){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function burst(x,y,c,n,sp){for(let i=0;i<(n||12);i++){const a=R(0,6.28),s=R(.3,1)*(sp||220);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:R(.4,.8),m:.8,c})}}
function dparts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,6.3);ctx.fill()}ctx.globalAlpha=1}
function spk(){const x=W-22,y=22;ctx.save();ctx.globalAlpha=.8;ctx.fillStyle='#fff';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-9,y-3);ctx.lineTo(x-4,y-3);ctx.lineTo(x+1,y-8);ctx.lineTo(x+1,y+8);ctx.lineTo(x-4,y+3);ctx.lineTo(x-9,y+3);ctx.fill();ctx.beginPath();if(muted){ctx.moveTo(x+5,y-5);ctx.lineTo(x+13,y+5);ctx.moveTo(x+13,y-5);ctx.lineTo(x+5,y+5)}else{ctx.arc(x+2,y,6,-1,1);ctx.moveTo(x+2+Math.cos(-1)*11,y+Math.sin(-1)*11);ctx.arc(x+2,y,11,-1,1)}ctx.stroke();ctx.restore()}
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;if(document.hidden)return;T+=dt;ctx.save();if(shake>0){ctx.translate(R(-shake,shake),R(-shake,shake));shake=Math.max(0,shake-dt*40)}frame(dt);dparts(dt);ctx.restore();spk()}
function pt(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}const[x,y]=pt(e);if(x>W-44&&y<44){muted=!muted;return}onDown(x,y)});
cv.addEventListener('pointermove',e=>{const[x,y]=pt(e);if(window.onMove)onMove(x,y)});
cv.addEventListener('pointerup',e=>{const[x,y]=pt(e);if(window.onUp)onUp(x,y)});
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.key==' ')e.preventDefault();if(e.key=='m'||e.key=='M'){muted=!muted;return}if(window.onKey)onKey(e)});
addEventListener('contextmenu',e=>e.preventDefault());
function big(name,cx,cy,col,glow){const ws=W<H?name.split(' '):[name],ml=Math.max(...ws.map(w=>w.length)),z=Math.min(W*.9/(ml*.76),H*.13,140);ctx.save();ctx.shadowColor=glow||col;ctx.shadowBlur=z*.5;ws.forEach((w,i)=>tx(w,cx,cy+(i-(ws.length-1)/2)*z*1.12,z,col));ctx.restore();return z}
function tap(y,t,col){ctx.globalAlpha=.65+.35*Math.sin(T*4);tx(t||'Başlamak için dokun / tıkla',W/2,y,Math.max(16,Math.min(S*.05,30)),col);ctx.globalAlpha=1}
function over(t,l1,l2,col,rt){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);const z=Math.min(W*.11,70);tx(t,W/2,H*.34,z,col);tx(l1,W/2,H*.34+z*1.2,z*.5);if(l2)tx(l2,W/2,H*.34+z*1.9,z*.42,'#cbd');tap(H*.34+z*3.1,rt||'Tekrar için dokun / tıkla')}
function btn(b,label,col){rr(b.x,b.y,b.w,b.h,10);ctx.fillStyle=col||'#334';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;ctx.stroke();tx(label,b.x+b.w/2,b.y+b.h/2+1,Math.min(b.h*.45,18))}
const hit=(b,x,y)=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;
/* ---- oyun ---- */
const N=8,TY=6,GC=['#ff4d6d','#4dabf7','#51cf66','#ffd43b','#b565f0','#ff922b'];
let st='title',ph='idle',pt2=0,g=[],m=[],sw=null,drag=null,sel=null,sc=0,lsc=0,mv=0,tg=0,lv=1,combo=0,cs=40,bx=0,by=0,tot=0;
const NB={x:8,y:10,w:92,h:34};
const ft=Array.from({length:16},()=>({x:Math.random(),y:Math.random(),v:R(.03,.07),t:RI(0,6),z:R(.6,1.3)}));
function poly(n,rad,rot){for(let k=0;k<n;k++){const a=rot+k*6.2832/n-1.5708;k?ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad):ctx.moveTo(Math.cos(a)*rad,Math.sin(a)*rad)}ctx.closePath()}
function gem(t,x,y,s,a){ctx.save();ctx.translate(x,y);ctx.scale(a,a);const c=GC[t];ctx.fillStyle=c;ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;ctx.shadowColor=c;ctx.shadowBlur=8;ctx.beginPath();
 if(t==0)ctx.arc(0,0,s,0,6.3);else if(t==1)poly(4,s*1.2,0);else if(t==2)ctx.roundRect?ctx.roundRect(-s*.85,-s*.85,s*1.7,s*1.7,s*.3):ctx.rect(-s*.85,-s*.85,s*1.7,s*1.7);else if(t==3)poly(3,s*1.25,0);else if(t==4)poly(6,s,0);else{for(let k=0;k<10;k++){const a=k*.6283-1.5708,rd=k%2?s*.5:s*1.15;k?ctx.lineTo(Math.cos(a)*rd,Math.sin(a)*rd):ctx.moveTo(Math.cos(a)*rd,Math.sin(a)*rd)}ctx.closePath()}
 ctx.fill();ctx.shadowBlur=0;ctx.stroke();ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.ellipse(-s*.3,-s*.35,s*.25,s*.14,-.6,0,6.3);ctx.fill();ctx.restore()}
function lay(){cs=Math.min((W-16)/N,(H-170)/N,84);bx=(W-N*cs)/2;by=(H-N*cs)/2+50}
function mk(t){return{t,oy:0,v:0,s:1}}
function fillBoard(){g=[];for(let r=0;r<N;r++){g.push([]);for(let c=0;c<N;c++){let t;do t=RI(0,TY);while((c>=2&&g[r][c-1].t==t&&g[r][c-2].t==t)||(r>=2&&g[r-1][c].t==t&&g[r-2][c].t==t));g[r].push(mk(t))}}if(!hasMove())fillBoard()}
function hasMove(){for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const[a,b]of[[0,1],[1,0]]){const r2=r+a,c2=c+b;if(r2>=N||c2>=N)continue;sp(r,c,r2,c2);const f=find();sp(r,c,r2,c2);if(f)return true}return false}
function sp(r,c,r2,c2){const t=g[r][c];g[r][c]=g[r2][c2];g[r2][c2]=t}
function find(){m=Array.from({length:N},()=>Array(N).fill(false));let n=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=g[r][c]&&g[r][c].t;if(t==null)continue;if(c<N-2&&g[r][c+1]&&g[r][c+2]&&g[r][c+1].t==t&&g[r][c+2].t==t)m[r][c]=m[r][c+1]=m[r][c+2]=true;if(r<N-2&&g[r+1][c]&&g[r+2][c]&&g[r+1][c].t==t&&g[r+2][c].t==t)m[r][c]=m[r+1][c]=m[r+2][c]=true}m.forEach(row=>row.forEach(v=>{if(v)n++}));return n}
function level(){mv=Math.max(14,22-lv);tg=150+350*lv;lsc=0;fillBoard();ph='idle';sel=null;drag=null}
function start(){sc=0;lv=1;st='play';level()}
function tryswap(a,b){if(ph!='idle'||st!='play')return;sw={a,b,t:0,back:false};ph='swap';snd(400,.08,'sine',.08)}
function cellAt(x,y){const c=Math.floor((x-bx)/cs),r=Math.floor((y-by)/cs);return r>=0&&r<N&&c>=0&&c<N?{r,c}:null}
function onDown(x,y){if(st=='lvl'){lv++;st='play';level();return}if(st!='play'){start();return}if(hit(NB,x,y)){start();return}if(ph!='idle')return;const k=cellAt(x,y);if(!k)return;if(sel&&Math.abs(sel.r-k.r)+Math.abs(sel.c-k.c)==1){tryswap(sel,k);sel=null;drag=null}else{sel=k;drag={...k,x,y}}}
function onMove(x,y){if(!drag||ph!='idle')return;const dx=x-drag.x,dy=y-drag.y;if(Math.hypot(dx,dy)>cs*.35){const r=drag.r+(Math.abs(dy)>Math.abs(dx)?Math.sign(dy):0),c=drag.c+(Math.abs(dy)>Math.abs(dx)?0:Math.sign(dx));if(r>=0&&r<N&&c>=0&&c<N)tryswap({r:drag.r,c:drag.c},{r,c});drag=null;sel=null}}
function onUp(){drag=null}
function onKey(e){if(e.key=='Enter'||e.key==' '){if(st=='lvl'){lv++;st='play';level()}else if(st!='play')start()}}
function endCheck(){if(lsc>=tg){const b=mv*20;sc+=b;lsc+=b;if(sc>best){best=sc;sv()}st='lvl';snd(784,.3,'triangle');burst(W/2,H/2,'#ffd43b',40,320)}else if(mv<=0){st='over';snd(160,.6,'sawtooth',.12,60)}else if(!hasMove())fillBoard()}
function upd(dt){
 if(ph=='swap'){sw.t+=dt/.16;if(sw.t>=1){sp(sw.a.r,sw.a.c,sw.b.r,sw.b.c);if(sw.back){sw=null;ph='idle'}else if(find()){mv--;combo=0;sw=null;ph='clear';pt2=0}else{sw.back=true;sw.t=0;snd(180,.12,'square',.08)}}}
 else if(ph=='clear'){pt2+=dt;g.forEach((row,r)=>row.forEach((o,c)=>{if(m[r][c])o.s=Math.max(0,1-pt2/.2)}));if(pt2>=.2){let n=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(m[r][c]){n++;burst(bx+(c+.5)*cs,by+(r+.5)*cs+g[r][c].oy,GC[g[r][c].t],4,200);g[r][c]=null}const p=n*10*(1+combo*.5)|0;sc+=p;lsc+=p;if(sc>best){best=sc;sv()}snd(500+combo*90,.2,'triangle');shake=3+combo*1.5;
  for(let c=0;c<N;c++){let miss=0;for(let r=N-1;r>=0;r--){if(!g[r][c])miss++;else if(miss){g[r+miss][c]=g[r][c];g[r][c]=null;g[r+miss][c].oy=-miss*cs}}for(let r=0;r<miss;r++){g[r][c]=mk(RI(0,TY));g[r][c].oy=-miss*cs}}ph='fall'}}
 else if(ph=='fall'){let done=true;g.forEach(row=>row.forEach(o=>{if(o.oy<0){o.v+=dt*2600;o.oy=Math.min(0,o.oy+o.v*dt);if(o.oy<0)done=false;else{o.v=0}}}));if(done){if(find()){combo++;ph='clear';pt2=0}else{ph='idle';endCheck()}}}}
function frame(dt){const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#2a1240');gr.addColorStop(1,'#0f2a4a');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
 ft.forEach(f=>gem(f.t,f.x*W,((f.y+T*f.v)%1.3-.15)*H,22*f.z+10,.5));
 if(st=='title'){big('ÜÇ EŞLEŞTİR',W/2,H*.3,'#ff6fa5','#b565f0');const s=Math.min(W*.07,40);for(let i=0;i<6;i++)gem(i,W/2+(i-2.5)*s*2.4,H*.52+Math.sin(T*2+i)*8,s,1);tap(H*.72);tx('En iyi puan: '+best,W/2,H*.8,Math.min(S*.04,22),'#cbb8e6');return}
 if(st=='play'||st=='lvl')upd(dt);
 btn(NB,'Yeni oyun','#4a2f66');tx('Seviye '+lv,W/2,22,Math.min(22,W*.05),'#fff');tx('Puan '+sc+'  ·  En iyi '+best,W/2,44,13,'#cbb8e6');
 const bw=Math.min(W-32,N*cs),f=Math.min(1,lsc/tg);rr((W-bw)/2,64,bw,12,6);ctx.fillStyle='rgba(255,255,255,.14)';ctx.fill();rr((W-bw)/2,64,Math.max(1,bw*f),12,6);ctx.fillStyle='#ffd43b';ctx.fill();
 tx('Hedef '+Math.min(lsc,tg)+' / '+tg,(W-bw)/2,92,14,'#ffd43b','left');tx('Hamle: '+mv,(W+bw)/2,92,16,mv<=3?'#ff6b6b':'#fff','right');
 rr(bx-6,by-6,N*cs+12,N*cs+12,14);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fill();
 ctx.save();rr(bx,by,N*cs,N*cs,8);ctx.clip();
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){if((r+c)%2){ctx.fillStyle='rgba(255,255,255,.04)';ctx.fillRect(bx+c*cs,by+r*cs,cs,cs)}const o=g[r]&&g[r][c];if(!o)continue;let x=bx+(c+.5)*cs,y=by+(r+.5)*cs+o.oy;
  if(sw){const A=sw.a,B=sw.b,k=Math.min(1,sw.t),dxx=(B.c-A.c)*cs,dyy=(B.r-A.r)*cs;let q=0;if(r==A.r&&c==A.c)q=1;else if(r==B.r&&c==B.c)q=-1;if(q){const e=sw.back?1-k:k;x+=q*dxx*e;y+=q*dyy*e}}
  gem(o.t,x,y,cs*.36,o.s)}
 if(sel&&ph=='idle'){rr(bx+sel.c*cs+2,by+sel.r*cs+2,cs-4,cs-4,8);ctx.lineWidth=3;ctx.strokeStyle='rgba(255,255,255,'+(.6+.4*Math.sin(T*8))+')';ctx.stroke()}
 ctx.restore();
 if(combo>0&&ph!='idle')tx('Kombo x'+(combo+1),W/2,by+N*cs+26,Math.min(S*.06,28),'#ffd43b');
 if(st=='lvl')over('Seviye '+lv+' tamam!','Puan: '+sc,'Kalan hamle bonusu eklendi','#ffd43b','Sonraki seviye için dokun');
 if(st=='over')over('Hamle bitti!','Puan: '+sc,'En iyi: '+best,'#ff6b6b','Yeni oyun için dokun / tıkla')}
rs();requestAnimationFrame(loop);
</script></body></html>
