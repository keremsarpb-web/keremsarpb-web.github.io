<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Füze Kalkanı - KSB Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100vw;height:100vh;touch-action:none}</style></head><body><canvas id="c"></canvas>
<script>
const ID='fuze-kalkani',cv=document.getElementById('c'),g=cv.getContext('2d'),keys={},ptrs=new Set(),rnd=Math.random,rr=(a,b)=>a+rnd()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let W=1,H=1,DPR=1,best=0,state='title',last=0,T=0,overT=0,shk=0,parts=[],muted=false,AC,score=0,touchMode=false;
try{best=+localStorage.getItem('ksb-'+ID+'-best')||0}catch(e){}
try{touchMode=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window}catch(e){}
function rs(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);if(window.onRs)onRs()}
addEventListener('resize',rs);
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
function snd(f,d,t,v,f2){if(muted||!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),k=AC.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);k.gain.setValueAtTime(v||.06,n);k.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(k);k.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function tx(s,x,y,z,c,a,w){g.font=(w||700)+' '+z+'px Fredoka,system-ui,sans-serif';g.textAlign=a||'center';g.textBaseline='middle';g.fillStyle=c||'#fff';g.fillText(s,x,y,W*.94)}
function rrect(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function burst(x,y,c,n,sp){n=n||12;sp=sp||200;for(let i=0;i<n;i++){const a=rnd()*6.283,s=rnd()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.4+rnd()*.5,m:.9,c})}}
function setBest(){if(score>best){best=score;try{localStorage.setItem('ksb-'+ID+'-best',best)}catch(e){}}}
function die(){if(state=='over')return;state='over';overT=T;setBest()}
function zs(){return Math.max(14,Math.min(W*.05,H*.034,26))}
function ttl(name,acc,l1,l2){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,W,H);const w=name.split(' '),z=Math.min(W*(w.length>1?.19:.15),H*.11,120),y0=H*.3-(w.length>1?z*.55:0),q=zs();
g.save();g.shadowColor=acc;g.shadowBlur=24;w.forEach((s,i)=>tx(s,W/2,y0+i*z*1.08,z,i?acc:'#fff'));g.restore();
tx(l1,W/2,H*.5,q,'#fff',0,500);if(l2)tx(l2,W/2,H*.5+q*1.5,q,'#fff',0,500);
g.globalAlpha=.65+.35*Math.sin(T*4);tx('Başlamak için dokun / tıkla',W/2,H*.72,q*1.25,acc);g.globalAlpha=1;if(best)tx('En yüksek: '+best,W/2,H*.72+q*2.3,q,'#fff',0,500)}
function ovr(acc,l){g.fillStyle='rgba(0,0,0,.62)';g.fillRect(0,0,W,H);const z=Math.min(W*.14,H*.1,84),q=zs();g.save();g.shadowColor=acc;g.shadowBlur=22;tx('OYUN BİTTİ',W/2,H*.3,z,acc);g.restore();
tx(l||('Skor: '+score),W/2,H*.43,q*1.6);tx('En yüksek: '+best,W/2,H*.43+q*2,q,'#fff',0,500);g.globalAlpha=.65+.35*Math.sin(T*4);tx('Tekrar için dokun / tıkla',W/2,H*.64,q*1.25,acc);g.globalAlpha=1}
function spk(){g.save();g.globalAlpha=.8;g.fillStyle=g.strokeStyle='#fff';g.lineWidth=2;const x=W-30,y=24;g.beginPath();g.moveTo(x-8,y-4);g.lineTo(x-3,y-4);g.lineTo(x+3,y-9);g.lineTo(x+3,y+9);g.lineTo(x-3,y+4);g.lineTo(x-8,y+4);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(x+7,y-5);g.lineTo(x+15,y+5);g.moveTo(x+15,y-5);g.lineTo(x+7,y+5)}else g.arc(x+3,y,8,-1,1);g.stroke();g.restore()}
function begin(){ptrs.clear();reset();state='play'}
function pxy(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/(r.width||W),(e.clientY-r.top)*H/(r.height||H)]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();if(e.pointerType=='touch')touchMode=true;const[x,y]=pxy(e);if(x>W-46&&y<46){muted=!muted;return}
if(state!='play'){if(state=='title'||T-overT>.5)begin();return}
ptrs.add(e.pointerId);try{cv.setPointerCapture(e.pointerId)}catch(_){}if(window.gDown)gDown(x,y,e)});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;e.preventDefault();const[x,y]=pxy(e);if(window.gMove)gMove(x,y,e)});
const pu=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);const[x,y]=pxy(e);if(window.gUp)gUp(x,y,e)};
cv.addEventListener('pointerup',pu);cv.addEventListener('pointercancel',pu);cv.addEventListener('contextmenu',e=>e.preventDefault());
const NAV=['Space','Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
addEventListener('keydown',e=>{ac();if(e.code=='KeyM'){if(!e.repeat)muted=!muted;return}if(NAV.includes(e.code))e.preventDefault();
if(state!='play'){if(!e.repeat&&NAV.includes(e.code)&&(state=='title'||T-overT>.5))begin();return}
keys[e.code]=1;if(!e.repeat&&window.gKey)gKey(e.code)});
addEventListener('keyup',e=>{keys[e.code]=0});
document.addEventListener('visibilitychange',()=>{try{if(AC)document.hidden?AC.suspend():AC.resume()}catch(e){}});
function loop(t){requestAnimationFrame(loop);if(document.hidden){last=t;return}const dt=Math.min((t-last)/1000||0,.05);last=t;T+=dt;g.setTransform(DPR,0,0,DPR,0,0);g.save();
if(shk>.3){shk*=Math.pow(.01,dt);g.translate((rnd()-.5)*shk,(rnd()-.5)*shk)}else shk=0;
frame(dt);for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);for(const p of parts){g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;g.fillRect(p.x-2,p.y-2,4,4)}g.globalAlpha=1;g.restore();spk()}
function boot(){rs();requestAnimationFrame(t=>{last=t;loop(t)})}

const PAT='bcccbccc b'.replace(' ',''),stars=Array.from({length:70},()=>({x:rnd(),y:rnd()*.7,z:rnd()}));
let cities,bats,ms,ic,ex,wave,sq,wT,gy,U,msg,msgT,endT,dT,waveWait;
function onRs(){gy=H-Math.max(44,H*.07);U=Math.max(.6,Math.min(1.6,H/700))}
function build(){cities=[];bats=[];PAT.split('').forEach((t,k)=>{const x=W*(.08+.84*k/8);if(t=='c')cities.push({x,a:true,h:[rr(.5,1),rr(.7,1.3),rr(.4,.9),rr(.6,1.1),rr(.5,1)]});else bats.push({x,a:true,ammo:10})})}
function startWave(){sq=[];const n=Math.min(40,6+wave*3);for(let i=0;i<n;i++)sq.push(rnd()*(5+n*.45));sq.sort((a,b)=>a-b);wT=0;bats.forEach(b=>{b.a=true;b.ammo=Math.min(14,10+(wave>>2))})}
function reset(){score=0;wave=1;ms=[];ic=[];ex=[];build();startWave();msg='Dalga 1';msgT=1.5;endT=0;waveWait=0}
function targets(){return cities.filter(c=>c.a).concat(bats.filter(b=>b.a))}
function spawn(x0,y0,demo){const t=demo?cities[rnd()*6|0]:(()=>{const a=targets();return a[rnd()*a.length|0]})();if(!t)return;const sp=Math.min(150,38+wave*6+rnd()*14)*U,dx=t.x-x0,dy=gy-y0,d=Math.hypot(dx,dy);
ms.push({x0,y0,x:x0,y:y0,vx:dx/d*sp,vy:dy/d*sp,t,mirv:!demo&&wave>=3&&rnd()<.22+wave*.01,sy:H*rr(.2,.4),dm:demo?H*rr(.3,.7):0})}
function boom(x,y,own,mx){ex.push({x,y,t:0,mx:mx||Math.max(40,H*.075),own});if(own=='p')snd(160,.5,'sawtooth',.07,40)}
function upd(dt,demo){if(msgT>0)msgT-=dt;
if(demo){if((dT-=dt)<0){dT=.45;spawn(rnd()*W,0,true)}}
else if(!waveWait){wT+=dt;while(sq.length&&sq[0]<=wT){sq.shift();spawn(rnd()*W,0)}}
for(const m of ms){m.x+=m.vx*dt;m.y+=m.vy*dt;
if(m.mirv&&m.y>m.sy){m.mirv=false;const k=2+(rnd()<.4);for(let i=0;i<k;i++){const a=targets(),t=a[rnd()*a.length|0];if(!t)break;const sp=Math.hypot(m.vx,m.vy),dx=t.x-m.x,dy=gy-m.y,d=Math.hypot(dx,dy);ms.push({x0:m.x,y0:m.y,x:m.x,y:m.y,vx:dx/d*sp,vy:dy/d*sp,t,mirv:false,sy:0,dm:0})}}
if(demo&&m.y>m.dm){m.dead=1;boom(m.x,m.y,'p',60);continue}
if(m.y>=gy){m.dead=1;boom(m.x,gy,'e',50);shk=10;if(!demo){m.t.a=false;snd(90,.6,'sawtooth',.09,30);burst(m.x,gy,'#ff9f43',30,260)}}}
for(const p of ic){p.x+=p.vx*dt;p.y+=p.vy*dt;if((p.tx-p.x)*p.vx+(p.ty-p.y)*p.vy<=0){p.dead=1;boom(p.tx,p.ty,'p')}}
for(const e of ex){e.t+=dt;e.r=e.t<.4?e.mx*e.t/.4:e.t<.7?e.mx:e.mx*(1-(e.t-.7)/.4);if(e.own=='p')for(const m of ms)if(!m.dead&&Math.hypot(m.x-e.x,m.y-e.y)<e.r+2){m.dead=1;if(!demo){score+=25;snd(500+rnd()*300,.12,'square',.04)}burst(m.x,m.y,'#ffd23f',10,150);boom(m.x,m.y,'v',16)}}
ms=ms.filter(m=>!m.dead);ic=ic.filter(p=>!p.dead);ex=ex.filter(e=>e.t<1.1);if(demo)return;
if(!cities.some(c=>c.a)){if(!endT)endT=1.4;endT-=dt;if(endT<=0)die();return}
if(!waveWait&&!sq.length&&!ms.length&&!ic.length&&!ex.length){const bonus=cities.filter(c=>c.a).length*100+bats.reduce((s,b)=>s+b.ammo,0)*5;score+=bonus;wave++;waveWait=2;msg='Dalga bitti  +'+bonus;msgT=2;snd(600,.5,'triangle',.07,1200)}
if(waveWait){waveWait-=dt;if(waveWait<=0){waveWait=0;if(wave%3==1){const d=cities.filter(c=>!c.a);if(d.length)d[0].a=true}startWave();msg='Dalga '+wave;msgT=1.5}}}
function gDown(x,y){y=Math.min(y,gy-50);let b=null,bd=1e9;for(const q of bats)if(q.a&&q.ammo>0&&Math.abs(q.x-x)<bd){bd=Math.abs(q.x-x);b=q}
if(!b){snd(120,.15,'square',.05);return}b.ammo--;const x0=b.x,y0=gy-16,dx=x-x0,dy=y-y0,d=Math.hypot(dx,dy)||1,sp=650*U;ic.push({x0,y0,x:x0,y:y0,tx:x,ty:y,vx:dx/d*sp,vy:dy/d*sp});snd(700,.2,'triangle',.05,1200)}
function draw(){const gr=g.createLinearGradient(0,0,0,gy);gr.addColorStop(0,'#070620');gr.addColorStop(.7,'#3b1559');gr.addColorStop(1,'#d8566b');g.fillStyle=gr;g.fillRect(0,0,W,H);
for(const s of stars){g.globalAlpha=.3+.6*Math.abs(Math.sin(T*s.z*2+s.x*7));g.fillStyle='#fff';g.fillRect(s.x*W,s.y*gy,1.5,1.5)}g.globalAlpha=1;
g.fillStyle='#2a0f45';g.beginPath();g.moveTo(0,gy);for(let x=0;x<=W;x+=20)g.lineTo(x,gy-18*U-Math.abs(Math.sin(x*.013+1))*40*U-Math.sin(x*.05)*6);g.lineTo(W,gy);g.fill();
g.fillStyle='#150a26';g.fillRect(0,gy,W,H-gy);g.fillStyle='#ff5fd2';g.fillRect(0,gy,W,2);
for(const c of cities){const k=U*1.1;if(c.a){c.h.forEach((h,i)=>{const bw=9*k,bh=26*h*k,bx=c.x-23*k+i*9.5*k;g.fillStyle='#2e3a73';g.fillRect(bx,gy-bh,bw,bh);g.fillStyle='#ffe08a';for(let y=gy-bh+4;y<gy-4;y+=7*k)g.fillRect(bx+2,y,2,3);g.fillRect(bx+bw-4,gy-bh+8,2,3)})}else{g.fillStyle='#3a2a3f';g.fillRect(c.x-22*k,gy-5,44*k,5);g.fillStyle='rgba(120,120,140,.35)';g.beginPath();g.arc(c.x,gy-14-Math.sin(T*2)*3,9,0,6.3);g.fill()}}
for(const b of bats){g.fillStyle=b.a?'#4dd2ff':'#3a2a3f';g.beginPath();g.moveTo(b.x-20*U,gy);g.lineTo(b.x-12*U,gy-14*U);g.lineTo(b.x+12*U,gy-14*U);g.lineTo(b.x+20*U,gy);g.fill();
if(b.a){g.fillStyle='#fff';for(let i=0;i<b.ammo;i++)g.fillRect(b.x-18*U+(i%5)*7*U+3,gy-10*U+(i/5|0)*4*U,4*U,2.5*U)}}
for(const m of ms){const gg=g.createLinearGradient(m.x0,m.y0,m.x,m.y);gg.addColorStop(0,'rgba(255,80,80,0)');gg.addColorStop(1,'#ff6b6b');g.strokeStyle=gg;g.lineWidth=2;g.beginPath();g.moveTo(m.x0,m.y0);g.lineTo(m.x,m.y);g.stroke();g.fillStyle='#fff';g.fillRect(m.x-2,m.y-2,4,4)}
for(const p of ic){g.strokeStyle='rgba(120,230,255,.7)';g.lineWidth=2;g.beginPath();g.moveTo(p.x0,p.y0);g.lineTo(p.x,p.y);g.stroke();g.fillStyle='#fff';g.fillRect(p.x-2,p.y-2,4,4);g.strokeStyle='#4dd2ff';g.beginPath();g.moveTo(p.tx-6,p.ty-6);g.lineTo(p.tx+6,p.ty+6);g.moveTo(p.tx+6,p.ty-6);g.lineTo(p.tx-6,p.ty+6);g.stroke()}
for(const e of ex){if(e.r<1)continue;const gg=g.createRadialGradient(e.x,e.y,0,e.x,e.y,e.r);if(e.own=='e'){gg.addColorStop(0,'#fff');gg.addColorStop(.5,'#ff9f43');gg.addColorStop(1,'rgba(255,80,40,0)')}else{gg.addColorStop(0,'#fff');gg.addColorStop(.45,'#ffe27a');gg.addColorStop(1,'rgba(255,120,60,0)')}g.fillStyle=gg;g.beginPath();g.arc(e.x,e.y,e.r,0,6.3);g.fill()}
if(state!='title'){tx('Skor '+score,14,26,22,'#fff','left');tx('Dalga '+wave,W/2,26,18,'#ffd0f0');if(msgT>0)tx(msg,W/2,H*.4,Math.min(44,W*.1),'#fff')}}
function frame(dt){if(state=='play')upd(dt);else if(state=='title')upd(dt,1);else{upd(dt*.5,0)}draw();
if(state=='title')ttl('Füze Kalkanı','#4dd2ff','Dokun: önleyici füze patlat','6 şehri düşman füzelerinden koru');else if(state=='over')ovr('#ff6b6b')}
rs();reset();dT=0;boot();
</script></body></html>
