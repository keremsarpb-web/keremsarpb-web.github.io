<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Duvar Zıplama</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#101020;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100vw;height:100vh}</style></head><body><canvas id="c"></canvas><script>
const ID='duvar-ziplama';
const cv=document.getElementById('c'),g=cv.getContext('2d');let W=0,H=0;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
let best=0,score=0,state='title',overT=0,tt=0,shake=0,AC,mute=false,dn=false,lx=0,onMove=null,onUp=null,onKeyUp=null;const keys={},P=[];
try{best=+localStorage.getItem('ksb-'+ID+'-best')||0}catch(e){}
const sv=()=>{try{localStorage.setItem('ksb-'+ID+'-best',best)}catch(e){}};
function snd(f,d=.1,ty='square',v=.08,sl=0){if(mute||!AC)return;try{const o=AC.createOscillator(),a=AC.createGain(),t=AC.currentTime;o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a);a.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function unlock(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function icon(){g.save();g.globalAlpha=.8;g.fillStyle='#fff';g.strokeStyle='#fff';g.lineWidth=2;const x=W-34,y=30;g.beginPath();g.moveTo(x-8,y-4);g.lineTo(x-3,y-4);g.lineTo(x+3,y-9);g.lineTo(x+3,y+9);g.lineTo(x-3,y+4);g.lineTo(x-8,y+4);g.closePath();g.fill();g.beginPath();if(mute){g.moveTo(x+7,y-5);g.lineTo(x+15,y+5);g.moveTo(x+15,y-5);g.lineTo(x+7,y+5)}else g.arc(x+3,y,8,-.9,.9);g.stroke();g.restore()}
function burst(x,y,c,n=14,s=260){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=s*(.3+Math.random()*.7);P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.7,m:.7,c})}}
function upP(dt){for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.l-=dt;if(p.l<=0)P.splice(i,1)}}
function drP(){for(const p of P){g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;g.fillRect(p.x-3,p.y-3,6,6)}g.globalAlpha=1}
function T(s,x,y,sz,c,al='center',w='900'){g.font=w+' '+sz+'px "Trebuchet MS",Verdana,sans-serif';g.textAlign=al;g.textBaseline='middle';g.fillStyle=c;g.fillText(s,x,y,W*.94)}
function panel(name,col,lines,pr){g.fillStyle='rgba(0,0,0,'+(state==='title'?.3:.6)+')';g.fillRect(0,0,W,H);const u=Math.min(W*.115,H*.1,80);g.save();g.shadowColor=col;g.shadowBlur=30;T(name,W/2,H*.3,u,col);g.restore();lines.forEach((l,i)=>T(l,W/2,H*.3+u*.9+i*Math.min(36,u*.7)+16,Math.min(26,u*.55),'#fff','center','700'));g.globalAlpha=.6+.4*Math.sin(performance.now()/300);T(pr,W/2,H*.74,Math.min(24,W*.05+4),'#fff','center','700');g.globalAlpha=1}
function scr(name,col,more=[]){if(state==='title')panel(name,col,['En iyi: '+best,...more],'Başlamak için dokun / tıkla');else if(state==='over')panel('Oyun Bitti',col,['Skor: '+score,'En iyi: '+best,...more],'Tekrar için dokun / tıkla')}
function act(){if(state==='title'||(state==='over'&&overT>.5)){reset();state='play';snd(520,.1,'sine');return}if(state==='play')tap()}
let onDown=()=>act(),onKey=k=>{if(k===' '||k==='ArrowUp'||k==='Enter')act()};
function fin(){state='over';overT=0;shake=16;if(score>best){best=score;sv()}snd(150,.4,'sawtooth',.12,-100)}
cv.addEventListener('pointerdown',e=>{e.preventDefault();unlock();const x=e.clientX,y=e.clientY;if(x>W-60&&y<60){mute=!mute;return}dn=true;lx=x;onDown(x,y)});
addEventListener('pointermove',e=>{if(dn&&onMove)onMove(e.clientX-lx,e.clientX,e.clientY);lx=e.clientX});
addEventListener('pointerup',()=>{dn=false;if(onUp)onUp()});addEventListener('pointercancel',()=>{dn=false;if(onUp)onUp()});
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();unlock();if(e.key==='m'||e.key==='M'){mute=!mute;return}keys[e.key]=1;if(!e.repeat)onKey(e.key)});
addEventListener('keyup',e=>{keys[e.key]=0;if(onKeyUp)onKeyUp(e.key)});
let last=performance.now();
function loop(t){const dt=Math.min(.033,Math.max(0,(t-last)/1000));last=t;if(!document.hidden){tt+=dt;overT+=dt;upP(dt);shake=Math.max(0,shake-dt*30);upd(dt);g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);draw();g.restore();icon()}requestAnimationFrame(loop)}
const CW=()=>Math.min(W*.8,330),WL=()=>(W-CW())/2,WR=()=>(W+CW())/2,SL=95,SH=30,PY=()=>H*.65;
let py,side,from,lp,sps,nxy,v,autoT;
const xs=s=>s<0?WL()+16:WR()-16;
function gen(){while(nxy>py-H*1.3){sps.push({s:Math.random()<.5?-1:1,y:nxy});nxy-=SL+v*.45+30+Math.random()*100}}
function reset(){py=0;side=-1;from=-1;lp=1;sps=[];nxy=-450;v=170;score=0;autoT=1;P.length=0;gen()}
function tap(){if(lp<1)return;from=side;side=-side;lp=0;snd(side>0?600:480,.08,'square',.06,200)}
function upd(dt){
 const pl=state==='play';v=pl?Math.min(340,170+score*.9):140;py-=v*dt;lp=Math.min(1,lp+dt/.22);gen();sps=sps.filter(s=>s.y<py+H);
 if(!pl){autoT-=dt;if(autoT<=0&&lp>=1){from=side;side=-side;lp=0;autoT=1.1}return}
 score=Math.floor(-py/10);
 const px=xs(from)+(xs(side)-xs(from))*lp;
 if(Math.random()<.6)P.push({x:px,y:PY(),vx:(Math.random()-.5)*40,vy:60,l:.35,m:.35,c:'#ffd23f'});
 const es=lp<.3?from:lp>.7?side:0;if(!es)return;
 for(const s of sps)if(s.s===es&&py+12>s.y&&py-12<s.y+SL){burst(px,PY(),'#ffd23f',28);fin();return}
}
function draw(){
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0f3a4a');gr.addColorStop(1,'#1b1745');g.fillStyle=gr;g.fillRect(0,0,W,H);
 const cam=py-PY(),l=WL(),r=WR();
 g.fillStyle='rgba(255,255,255,.05)';g.fillRect(l,0,r-l,H);
 for(const[x0,x1]of[[0,l],[r,W]]){g.fillStyle='#2b2f5a';g.fillRect(x0,0,x1-x0,H);g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=2;const o=((-cam)%40+40)%40;for(let y=o-40;y<H;y+=40){g.beginPath();g.moveTo(x0,y);g.lineTo(x1,y);g.stroke()}}
 g.fillStyle='#ffd23f';g.fillRect(l-4,0,4,H);g.fillRect(r,0,4,H);
 g.fillStyle='#ff3355';for(const s of sps){const y=s.y-cam;g.beginPath();if(s.s<0){g.moveTo(l,y);g.lineTo(l+SH,y+SL/2);g.lineTo(l,y+SL)}else{g.moveTo(r,y);g.lineTo(r-SH,y+SL/2);g.lineTo(r,y+SL)}g.fill()}
 g.save();g.translate(0,-cam);drP();g.restore();
 const px=xs(from)+(xs(side)-xs(from))*lp,sq=1+Math.sin(lp*Math.PI)*.2;
 g.save();g.translate(px,PY());g.scale(1/sq,sq);g.shadowColor='#ffd23f';g.shadowBlur=18;g.fillStyle='#ffd23f';g.beginPath();g.arc(0,0,13,0,6.283);g.fill();g.fillStyle='#2b2f5a';g.beginPath();g.arc(side*4,-3,3,0,6.283);g.fill();g.restore();
 if(state==='play')T(score,W/2,80,60,'#fff');else scr('Duvar Zıplama','#ffd23f');
}

reset();requestAnimationFrame(loop);
</script></body></html>
