<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zıp Zıp Kurbağa – KSB Games</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head>
<body><canvas id="c"></canvas><script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),ID='kurbaga';let W=1,H=1,S=1,best=0,AC,muted=false,state='title',score=0,shake=0,tm=0,parts=[],ot=0;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);S=Math.min(W,H)}
addEventListener('resize',rs);rs();
try{best=+localStorage.getItem('ksb-'+ID+'-best')||0}catch(e){}
function sv(){if(score>best){best=score;try{localStorage.setItem('ksb-'+ID+'-best',best)}catch(e){}}}
function snd(f,d,t,v,sl){if(muted||!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);a.gain.setValueAtTime(v||.06,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function T(s,x,y,z,c,a,w){g.font=(w||700)+' '+z+'px Fredoka,Nunito,system-ui,sans-serif';g.textAlign=a||'center';g.textBaseline='middle';g.fillStyle=c||'#fff';g.fillText(s,x,y)}
function RR(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function P(x,y,n,c,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(sp||150)*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.7,c})}}
function upP(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt}parts=parts.filter(p=>p.l>0)}
function drP(){for(const p of parts){g.globalAlpha=Math.max(0,p.l/.7);g.fillStyle=p.c;g.fillRect(p.x-2,p.y-2,4,4)}g.globalAlpha=1}
function titleScr(name,sub,y0){const z=Math.min(S*.15,W*.92/(name.length*.62));y0=y0||H*.3;g.save();g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=z*.2;g.shadowOffsetY=z*.06;T(name,W/2,y0+Math.sin(tm*2)*z*.05,z,'#fff',0,800);g.restore();if(sub)T(sub,W/2,y0+z*.85,Math.max(13,z*.3),'rgba(255,255,255,.9)',0,500);g.globalAlpha=.65+.35*Math.sin(tm*4);T('Başlamak için dokun / tıkla',W/2,H*.78,Math.max(15,Math.min(S*.05,30)),'#fff',0,700);g.globalAlpha=1;if(best)T('En iyi: '+best,W/2,H*.78+Math.max(28,S*.08),Math.max(13,S*.035),'#ffe',0,500)}
function overScr(t,l2){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,H);const z=Math.min(S*.11,W*.9/(t.length*.62));T(t,W/2,H*.32,z,'#fff',0,800);T('Skor: '+score,W/2,H*.32+z*1.1,z*.55,'#ffd54a');T('En iyi: '+best,W/2,H*.32+z*1.8,z*.4,'#fff',0,500);if(l2)T(l2,W/2,H*.32+z*2.4,z*.35,'#cde',0,500);if(ot>.5){g.globalAlpha=.6+.4*Math.sin(tm*4);T('Tekrar için dokun / tıkla',W/2,H*.75,Math.max(15,Math.min(S*.05,30)));g.globalAlpha=1}}
const IN={down(){},up(){},mv(){},kd(){},ku(){}};
function initA(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
cv.addEventListener('pointerdown',e=>{e.preventDefault();initA();if(e.clientX>W-50&&e.clientY<50){muted=!muted;return}IN.down(e.clientX,e.clientY,e.pointerId)});
addEventListener('pointerup',e=>IN.up(e.clientX,e.clientY,e.pointerId));
addEventListener('pointercancel',e=>IN.up(e.clientX,e.clientY,e.pointerId));
addEventListener('pointermove',e=>IN.mv(e.clientX,e.clientY,e.pointerId));
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();initA();if(e.repeat)return;if(e.key==='m'||e.key==='M'){muted=!muted;return}IN.kd(e.key)});
addEventListener('keyup',e=>IN.ku(e.key));
function spk(){const x=W-26,y=26;g.save();g.globalAlpha=.8;g.fillStyle='#fff';g.fillRect(x-9,y-4,5,8);g.beginPath();g.moveTo(x-4,y-4);g.lineTo(x+2,y-9);g.lineTo(x+2,y+9);g.lineTo(x-4,y+4);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();if(muted){g.moveTo(x+5,y-5);g.lineTo(x+13,y+5);g.moveTo(x+13,y-5);g.lineTo(x+5,y+5)}else g.arc(x+2,y,7,-1,1);g.stroke();g.restore()}
let last=performance.now();
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;if(document.hidden)dt=0;tm+=dt;if(state==='over')ot+=dt;shake=Math.max(0,shake-dt*40);if(dt>0)step(dt);g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);render();g.restore();spk();requestAnimationFrame(loop)}
/* ---- game ---- */
let pads=[],fr,camY=0,pw=0,hold=false,wt=0,lastY=0,msg='',mt=0,endT=0;
function mkPad(y){const d=1+Math.min(1.5,score*.03),r=S*Math.max(.06,.105-score*.0009),cx=W*(.3+Math.random()*.4);let amp=Math.min(W*.32,S*.3)*(.3+Math.random()*.7);amp=Math.max(0,Math.min(amp,cx-r-4,W-cx-r-4));pads.push({cx,y,r,amp,sp:(.6+Math.random()*.6)*d,ph:Math.random()*6.28,fl:Math.random()<.25,i:pads.length})}
function px(p){return p.cx+p.amp*Math.sin(p.ph+wt*p.sp)}
function reset(){pads=[{cx:W/2,y:0,r:S*.105,amp:0,sp:0,ph:0,fl:false,i:0}];lastY=0;fr={pad:pads[0],x:W/2,y:0,st:'sit',t:0,sx:0,sy:0,dist:0,dur:.4};camY=-H*.7;pw=0;hold=false;msg='';mt=0}
function fill(){while(lastY>camY-H*.3){lastY-=S*(.2+Math.random()*.1+Math.min(.05,score*.001));mkPad(lastY)}pads=pads.filter(p=>p.y<camY+H+200)}
function go(){if(state==='title'||(state==='over'&&ot>.6)){score=0;reset();state='play'}}
function press(){if(state!=='play'){go();return}if(fr.st==='sit')hold=true}
function release(){if(!hold||state!=='play')return;hold=false;if(fr.st!=='sit')return;fr.st='jump';fr.t=0;fr.sx=fr.x;fr.sy=fr.y;fr.dist=S*(.12+pw*.4);fr.dur=.4+.3*pw;snd(300,.2,'sine',.08,500);pw=0}
IN.down=press;IN.up=release;IN.kd=k=>{if(k===' '||k==='ArrowUp')press()};IN.ku=k=>{if(k===' '||k==='ArrowUp')release()};
function land(){const x=fr.sx,y=fr.sy-fr.dist;let best=null,bd=1e9;for(const p of pads){const d=Math.hypot(px(p)-x,p.y-y);if(d<p.r*.95&&d<bd){bd=d;best=p}}
 if(best){const adv=best.i>fr.pad.i;fr.pad=best;fr.st='sit';fr.x=px(best);fr.y=best.y;if(adv){score++;let b=0;if(bd<best.r*.3){b=1;msg='Mükemmel! +1';mt=.7}if(best.fl){b++;msg='Çiçek! +'+(b+1);mt=.7;P(fr.x,fr.y,10,'#ff7ab8',120)}score+=b;sv()}snd(200,.12,'triangle',.08,-60);P(fr.x,fr.y,6,'#bfe9ff',90)}
 else{fr.st='sink';fr.t=0;fr.x=x;fr.y=y;shake=6;snd(400,.4,'sine',.1,-300);P(x,y,18,'#bfe9ff',200)}}
function step(dt){upP(dt);wt+=dt;mt=Math.max(0,mt-dt);
 if(state==='over'){endT+=dt;return}
 if(state==='play'){if(hold&&fr.st==='sit')pw=Math.min(1,pw+dt*1.1)
  if(fr.st==='sit'){fr.x=px(fr.pad);fr.y=fr.pad.y}
  else if(fr.st==='jump'){fr.t+=dt;const u=Math.min(1,fr.t/fr.dur);fr.x=fr.sx;fr.y=fr.sy-fr.dist*u;if(u>=1)land()}
  else if(fr.st==='sink'){fr.t+=dt;if(fr.t>.8){sv();state='over';ot=0}}}
 const ty=(fr.st==='sit'?fr.pad.y:fr.st==='jump'?fr.sy:fr.y)-H*.7;camY+=(ty-camY)*Math.min(1,dt*5);fill()}
function lily(x,y,r,fl,sk){g.save();g.translate(x,y);g.fillStyle='rgba(0,50,60,.25)';g.beginPath();g.ellipse(3,5,r,r*.95,0,0,7);g.fill();g.fillStyle='#3fae5a';g.beginPath();g.moveTo(0,0);g.arc(0,0,r,.35,6.28-.35);g.closePath();g.fill();g.fillStyle='#58c973';g.beginPath();g.arc(-r*.12,-r*.12,r*.72,0,7);g.fill();g.strokeStyle='rgba(0,80,40,.35)';g.lineWidth=1.5;for(let i=0;i<5;i++){g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(1+i*1.1)*r*.9,Math.sin(1+i*1.1)*r*.9);g.stroke()}
 if(fl){g.fillStyle='#ff7ab8';for(let i=0;i<6;i++){g.beginPath();g.ellipse(Math.cos(i)*r*.18,Math.sin(i)*r*.18,r*.16,r*.08,i,0,7);g.fill()}g.fillStyle='#ffe066';g.beginPath();g.arc(0,0,r*.1,0,7);g.fill()}g.restore()}
function frog(x,y,z,sq){g.save();g.translate(x,y-z);g.scale(1+(1-sq)*.3,sq);g.fillStyle='#2e9b3a';g.beginPath();g.ellipse(0,0,S*.045,S*.04,0,0,7);g.fill();g.fillStyle='#7ee080';g.beginPath();g.ellipse(0,S*.01,S*.03,S*.025,0,0,7);g.fill();for(const s of[-1,1]){g.fillStyle='#2e9b3a';g.beginPath();g.arc(s*S*.025,-S*.035,S*.02,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(s*S*.025,-S*.038,S*.013,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(s*S*.025,-S*.04,S*.006,0,7);g.fill();g.fillStyle='#2e9b3a';g.beginPath();g.ellipse(s*S*.045,S*.025,S*.018,S*.01,0,0,7);g.fill()}g.restore()}
function render(){
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#1c8fb8');gr.addColorStop(1,'#0d5c8a');g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.strokeStyle='rgba(255,255,255,.1)';g.lineWidth=2;for(let i=0;i<14;i++){const x=(i*173.3)%W,y=(((i*97.7-camY*.5)%H)+H)%H;g.beginPath();g.ellipse(x,y,S*.06+(i%3)*8,S*.02,0,0,7);g.stroke()}
 if(state==='title'){if(!fr)reset();if(!pads.length)reset();fill()}
 for(const p of pads)lily(px(p),p.y-camY,p.r,p.fl);
 if(fr){const sx=fr.x,sy=fr.y-camY;
  if(hold&&fr.st==='sit'){const ty=fr.y-S*(.12+pw*.4)-camY;g.strokeStyle='rgba(255,255,255,.7)';g.setLineDash([5,7]);g.lineWidth=3;g.beginPath();g.moveTo(sx,sy);g.lineTo(sx,ty);g.stroke();g.setLineDash([]);g.beginPath();g.arc(sx,ty,S*.03,0,7);g.stroke()}
  if(fr.st==='jump'){const u=Math.min(1,fr.t/fr.dur),z=4*S*.1*u*(1-u);g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(sx,sy,S*.04,S*.02,0,0,7);g.fill();frog(sx,sy,z,.9+.2*Math.abs(.5-u))}
  else if(fr.st==='sink'){g.globalAlpha=Math.max(0,1-fr.t*1.3);frog(sx,sy+fr.t*20,0,1);g.globalAlpha=1;g.strokeStyle='rgba(255,255,255,.6)';g.beginPath();g.arc(sx,sy,fr.t*S*.2,0,7);g.stroke()}
  else frog(sx,sy,0,1-(hold?pw*.3:0)+(state==='title'?Math.sin(tm*4)*.04:0))}
 drP();
 if(state==='title'){titleScr('Zıp Zıp Kurbağa','Basılı tut, zıpla, yaprağa konmaya çalış!',H*.28);return}
 const z=Math.max(15,Math.min(S*.05,26));T('Skor '+score,12,z+2,z*1.2,'#fff','left');
 if(fr.st==='sit'){const bw=Math.min(S*.5,W*.6),bx=(W-bw)/2,by=H-Math.max(30,S*.07);g.fillStyle='rgba(0,0,0,.35)';RR(bx,by,bw,12,6);g.fill();g.fillStyle=pw>.8?'#ff6b6b':'#ffe066';RR(bx,by,bw*pw,12,6);g.fill();T('Zıplama gücü',W/2,by-14,Math.max(11,S*.03),'#fff',0,500)}
 if(mt>0){g.globalAlpha=Math.min(1,mt*2);T(msg,W/2,H*.3,S*.06,'#fff',0,800);g.globalAlpha=1}
 if(state==='over')overScr('Suya Düştün!')}
reset();requestAnimationFrame(loop);
</script></body></html>
