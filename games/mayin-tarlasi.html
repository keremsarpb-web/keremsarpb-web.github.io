<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mayın Tarlası · KSB Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#082022;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const ID='mayin-tarlasi',FONT='Rubik';
const C=document.getElementById('c'),X=C.getContext('2d');
let W=1,H=1,DPR=1,now=0,last=0;
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let AC=null,muted=!!store.get('ksb-'+ID+'-mute',false);
function audio(){try{if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(A)AC=new A()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
function snd(f,d,type,v,f2,dl){if(!AC||muted)return;try{const t=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
function boomSnd(){if(!AC||muted)return;try{const len=Math.floor(AC.sampleRate*.7),b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=800;s.buffer=b;g.gain.value=.55;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}catch(e){}snd(110,.55,'sine',.3,35)}
function toggleMute(){muted=!muted;store.set('ksb-'+ID+'-mute',muted);audio();snd(660,.08,'sine',.1)}
const F=(sz,w)=>(w||700)+' '+Math.max(1,Math.round(sz))+'px '+FONT+',"Segoe UI",system-ui,sans-serif';
function T(s,x,y,sz,col,w,al){X.font=F(sz,w);X.fillStyle=col;X.textAlign=al||'center';X.textBaseline='middle';X.fillText(s,x,y)}
function fitT(s,x,y,sz,maxW,col,w,al){X.font=F(sz,w);const m=X.measureText(s).width;if(m>maxW)sz*=maxW/m;T(s,x,y,sz,col,w,al);return sz}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}
const cl=(v,a,b)=>v<a?a:v>b?b:v,ease=t=>1-Math.pow(1-t,3),rnd=(a,b)=>a+Math.random()*(b-a);
let hits=[];
function hit(x,y,w,h,id){hits.push({x,y,w,h,id})}
function findHit(px,py){for(let i=hits.length-1;i>=0;i--){const b=hits[i];if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h)return b.id}return null}
function btn(x,y,w,h,label,id,bg,fg,sel){X.save();X.shadowColor='rgba(0,0,0,.35)';X.shadowBlur=12;X.shadowOffsetY=4;rr(x,y,w,h,h/2.6);X.fillStyle=bg;X.fill();X.restore();if(sel){rr(x,y,w,h,h/2.6);X.strokeStyle='#fff';X.lineWidth=2.5;X.stroke()}fitT(label,x+w/2,y+h/2+1,Math.min(h*.38,20),w-14,fg,600);hit(x,y,w,h,id)}
function speaker(col){const s=30,x=W-s-12,y=12;X.save();rr(x-5,y-5,s+10,s+10,12);X.fillStyle='rgba(0,0,0,.28)';X.fill();X.fillStyle=col;X.beginPath();X.moveTo(x+4,y+11);X.lineTo(x+10,y+11);X.lineTo(x+17,y+4);X.lineTo(x+17,y+26);X.lineTo(x+10,y+19);X.lineTo(x+4,y+19);X.closePath();X.fill();X.strokeStyle=col;X.lineWidth=2.4;X.lineCap='round';if(muted){X.beginPath();X.moveTo(x+21,y+10);X.lineTo(x+28,y+20);X.moveTo(x+28,y+10);X.lineTo(x+21,y+20);X.stroke()}else{X.beginPath();X.arc(x+18,y+15,5,-.9,.9);X.stroke();X.beginPath();X.arc(x+18,y+15,10,-.9,.9);X.stroke()}X.restore();hit(x-8,y-8,s+16,s+16,'mute')}
const parts=[];
function burst(x,y,n,cols,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=rnd(.3,1)*(sp||220);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,l:rnd(.4,1),s:rnd(2.5,6),c:cols[i%cols.length],r:0,vr:0,g:500})}}
function confetti(cols){for(let i=0;i<160;i++)parts.push({x:rnd(0,W),y:rnd(-H*.6,-10),vx:rnd(-60,60),vy:rnd(80,260),l:rnd(2.5,4.5),s:rnd(6,10),c:cols[i%cols.length],r:rnd(0,6),vr:rnd(-8,8),g:110,cf:1})}
function stepParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0||p.y>H+40){parts.splice(i,1);continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;if(!p.cf)p.vx*=.98}}
function drawParts(){for(const p of parts){X.save();X.globalAlpha=Math.min(1,p.l*2);X.translate(p.x,p.y);X.fillStyle=p.c;if(p.cf){X.rotate(p.r);X.scale(1,Math.cos(p.r*1.7));X.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}else{X.beginPath();X.arc(0,0,p.s,0,6.283);X.fill()}X.restore()}}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);C.width=Math.round(W*DPR);C.height=Math.round(H*DPR);X.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
try{document.fonts.load(F(40)).catch(()=>{})}catch(e){}

/*LOGIC*/
function nbrs(i,R,Cn){const r=Math.floor(i/Cn),c=i%Cn,o=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const rr2=r+dr,cc=c+dc;if(rr2>=0&&rr2<R&&cc>=0&&cc<Cn)o.push(rr2*Cn+cc)}return o}
function genMines(R,Cn,M,safe){
  const n=R*Cn,ex=new Set([safe]);nbrs(safe,R,Cn).forEach(j=>ex.add(j));
  let cand=[];for(let i=0;i<n;i++)if(!ex.has(i))cand.push(i);
  if(cand.length<M){cand=[];for(let i=0;i<n;i++)if(i!==safe)cand.push(i)}
  for(let i=cand.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=cand[i];cand[i]=cand[j];cand[j]=t}
  const mines=new Array(n).fill(false);for(let k=0;k<Math.min(M,cand.length);k++)mines[cand[k]]=true;return mines;
}
/*END*/

const DIFFS=[{k:'kolay',n:'Kolay',r:9,c:9,m:10},{k:'orta',n:'Orta',r:16,c:16,m:40},{k:'zor',n:'Zor',r:16,c:30,m:99}];
const NUMC=['','#2f80ed','#1f9d55','#e5484d','#8e4ec6','#e07a1f','#0e9aa7','#333','#777'];
let state='title',diff=cl(+store.get('ksb-'+ID+'-diff',0)||0,0,2),R=9,Cn=9,M=10,cells=[],started=false,time=0,flags=0,opened=0,flagMode=false,endAt=0,boom=-1,shake=0;
let best=store.get('ksb-'+ID+'-best',{});if(!best||typeof best!=='object')best={};
function newGame(d){diff=d;store.set('ksb-'+ID+'-diff',d);const D=DIFFS[d];if(D.c>D.r&&H>W){R=D.c;Cn=D.r}else{R=D.r;Cn=D.c}M=D.m;
  cells=[];for(let i=0;i<R*Cn;i++)cells.push({m:false,n:0,o:false,f:false,t:0,ft:-9,w:false});
  started=false;time=0;flags=0;opened=0;boom=-1;shake=0;state='play';snd(440,.08,'triangle',.08);snd(660,.1,'triangle',.08,0,.07)}
function place(safe){const mines=genMines(R,Cn,M,safe);cells.forEach((c,i)=>{c.m=mines[i]});cells.forEach((c,i)=>{c.n=nbrs(i,R,Cn).filter(j=>cells[j].m).length})}
function reveal(i){
  const c=cells[i];if(c.o||c.f||state!=='play')return;
  if(!started){place(i);started=true}
  if(c.m){lose(i);return}
  const q=[[i,0]];c.o=true;c.t=now;opened++;let cnt=1;
  while(q.length){const[j,d]=q.shift();if(cells[j].n)continue;for(const k of nbrs(j,R,Cn)){const e=cells[k];if(!e.o&&!e.f&&!e.m){e.o=true;e.t=now+(d+1)*.022;opened++;cnt++;q.push([k,d+1])}}}
  if(cnt>1)snd(520,.18,'triangle',.08,900);else snd(700+c.n*60,.05,'square',.04);
  if(opened===R*Cn-M)win();
}
function chord(i){const c=cells[i];if(!c.o||!c.n)return;const nb=nbrs(i,R,Cn);if(nb.filter(j=>cells[j].f).length!==c.n){snd(160,.06,'sine',.05);return}for(const j of nb){if(state!=='play')return;if(!cells[j].o&&!cells[j].f)reveal(j)}}
function toggleFlag(i){const c=cells[i];if(c.o||state!=='play')return;c.f=!c.f;c.ft=now;flags+=c.f?1:-1;snd(c.f?880:440,.07,'triangle',.08,c.f?1200:300);try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}
function lose(i){state='lost';boom=i;endAt=now;shake=.6;boomSnd();
  const br=Math.floor(i/Cn),bc=i%Cn;cells.forEach((c,j)=>{if(c.m&&!c.f){c.o=true;c.t=now+.08+Math.hypot(Math.floor(j/Cn)-br,j%Cn-bc)*.035}if(c.f&&!c.m)c.w=true});
  cells[i].t=now;const p=cellPos(i);burst(p.x,p.y,40,['#ff5a5f','#ffb347','#ffe066','#fff'],380)}
function win(){state='won';endAt=now;cells.forEach(c=>{if(c.m&&!c.f){c.f=true;c.ft=now}});flags=M;
  const k=DIFFS[diff].k,t=Math.floor(time);if(!best[k]||t<best[k]){best[k]=t;store.set('ksb-'+ID+'-best',best)}
  confetti(['#5ee6c8','#ffe066','#ff8fab','#8ecbff','#fff']);[523,659,784,1047,1319].forEach((f,i)=>snd(f,.22,'triangle',.1,0,i*.09))}
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
/* layout */
let L={cs:20,bx:0,by:0};
function layout(){const hh=78,fh=78,cs=Math.max(8,Math.floor(Math.min((W-16)/Cn,(H-hh-fh-16)/R,56)));const bw=cs*Cn,bh=cs*R;L={cs,bx:Math.round((W-bw)/2),by:Math.round(hh+(H-hh-fh-bh)/2),bw,bh,hh,fh}}
function cellPos(i){return{x:L.bx+(i%Cn+.5)*L.cs,y:L.by+(Math.floor(i/Cn)+.5)*L.cs}}
function cellAt(x,y){const c=Math.floor((x-L.bx)/L.cs),r=Math.floor((y-L.by)/L.cs);return(c>=0&&c<Cn&&r>=0&&r<R)?r*Cn+c:-1}
/* input */
function pos(e){const b=C.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]}
let press=null;
function act(id){
  if(id==='mute')toggleMute();
  else if(id==='menu'){state='title'}
  else if(id==='new'||id==='again')newGame(diff);
  else if(id==='mode'){flagMode=!flagMode;snd(flagMode?880:520,.06,'triangle',.07)}
  else if(id.startsWith('d')){diff=parseInt(id.slice(1),10)||0;store.set('ksb-'+ID+'-diff',diff);snd(600+diff*120,.06,'triangle',.07);if(state==='title'&&id.endsWith('!'))newGame(diff)}
}
C.addEventListener('pointerdown',e=>{e.preventDefault();audio();const[x,y]=pos(e);const h=findHit(x,y);if(h){act(h);return}
  if(state==='title'){newGame(diff);return}
  if(state==='lost'||state==='won'){if(now-endAt>1)newGame(diff);return}
  const i=cellAt(x,y);if(i<0)return;
  if(e.button===2){toggleFlag(i);return}
  if(press&&press.timer)clearTimeout(press.timer);
  press={i,x,y,long:false,moved:false,timer:0};
  if(e.pointerType!=='mouse'){const p=press;p.timer=setTimeout(()=>{if(press===p&&!p.moved&&state==='play'){p.long=true;if(cells[p.i].o)chord(p.i);else toggleFlag(p.i)}},380)}
});
C.addEventListener('pointermove',e=>{if(!press)return;const[x,y]=pos(e);if(Math.hypot(x-press.x,y-press.y)>14){press.moved=true;clearTimeout(press.timer)}});
C.addEventListener('pointerup',e=>{if(!press)return;clearTimeout(press.timer);const p=press;press=null;if(p.long||p.moved||e.button===2||state!=='play')return;
  const c=cells[p.i];if(c.o)chord(p.i);else if(flagMode)toggleFlag(p.i);else reveal(p.i)});
C.addEventListener('pointercancel',()=>{if(press)clearTimeout(press.timer);press=null});
C.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{const k=e.key,l=k.toLowerCase();if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();audio();
  if(l==='m')toggleMute();else if(l==='f'){flagMode=!flagMode;snd(flagMode?880:520,.06,'triangle',.07)}
  else if(l==='r'||l==='n'){if(state!=='title')newGame(diff)}else if(k==='Escape')state='title';
  else if(state==='title'){if(k>='1'&&k<='3')newGame(+k-1);else if(k==='Enter'||k===' ')newGame(diff);else if(k==='ArrowLeft')diff=(diff+2)%3;else if(k==='ArrowRight')diff=(diff+1)%3}
  else if((state==='won'||state==='lost')&&(k==='Enter'||k===' ')&&now-endAt>.5)newGame(diff)});
/* update */
function update(dt){stepParts(dt);shake=Math.max(0,shake-dt);if(state==='play'&&started)time+=dt}
/* drawing */
function bg(){const g=X.createLinearGradient(0,0,W*.3,H);g.addColorStop(0,'#0f3a3a');g.addColorStop(1,'#061517');X.fillStyle=g;X.fillRect(0,0,W,H);
  const x=W*(.5+.35*Math.sin(now*.15)),y=H*(.35+.2*Math.cos(now*.12)),rg=X.createRadialGradient(x,y,0,x,y,Math.max(W,H)*.6);rg.addColorStop(0,'rgba(94,230,200,.13)');rg.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=rg;X.fillRect(0,0,W,H)}
function mine(x,y,s,col){X.save();X.translate(x,y);X.strokeStyle=col;X.lineWidth=s*.12;X.lineCap='round';for(let k=0;k<4;k++){X.rotate(Math.PI/4);X.beginPath();X.moveTo(-s*.42,0);X.lineTo(s*.42,0);X.stroke()}X.fillStyle=col;X.beginPath();X.arc(0,0,s*.28,0,6.283);X.fill();X.fillStyle='rgba(255,255,255,.75)';X.beginPath();X.arc(-s*.09,-s*.09,s*.07,0,6.283);X.fill();X.restore()}
function flag(x,y,s,sc){X.save();X.translate(x,y);X.scale(sc,sc);X.fillStyle='#16302f';X.fillRect(-s*.05,-s*.32,s*.08,s*.6);X.fillRect(-s*.22,s*.24,s*.4,s*.08);X.fillStyle='#ff4d5e';X.beginPath();X.moveTo(s*.03,-s*.34);X.lineTo(s*.3,-s*.2);X.lineTo(s*.03,-s*.05);X.closePath();X.fill();X.restore()}
function drawCell(i,x,y,s){
  const c=cells[i],g=Math.max(1,s*.07),r=s*.2;let op=c.o&&now>=c.t;
  if(!op){rr(x+g,y+g+s*.05,s-2*g,s-2*g,r);X.fillStyle='#0e5c55';X.fill();rr(x+g,y+g,s-2*g,s-2*g-s*.03,r);X.fillStyle=(i+Math.floor(i/Cn))%2?'#2fb3a1':'#35bfad';X.fill();
    rr(x+g*1.8,y+g*1.6,s-3.6*g,s*.28,r*.7);X.fillStyle='rgba(255,255,255,.16)';X.fill();
    if(c.f)flag(x+s/2,y+s/2,s,1+.35*Math.sin(cl((now-c.ft)/.25,0,1)*Math.PI));
    if(c.w){X.strokeStyle='#ff4d5e';X.lineWidth=s*.1;X.beginPath();X.moveTo(x+s*.25,y+s*.25);X.lineTo(x+s*.75,y+s*.75);X.moveTo(x+s*.75,y+s*.25);X.lineTo(x+s*.25,y+s*.75);X.stroke()}
    return}
  const k=ease(cl((now-c.t)/.16,0,1)),sz=(s-2*g)*(.7+.3*k);
  rr(x+s/2-sz/2,y+s/2-sz/2,sz,sz,r);X.fillStyle=c.m?(i===boom?'#ff4d5e':'#ffb4a8'):((i+Math.floor(i/Cn))%2?'#e3f4ef':'#edf9f5');X.fill();
  if(c.m)mine(x+s/2,y+s/2,s*k,'#1b2524');else if(c.n){X.save();X.globalAlpha=k;T(String(c.n),x+s/2,y+s/2+1,s*.6,NUMC[c.n],800);X.restore()}
}
function drawGame(){
  layout();const{cs,bx,by,bw,bh}=L,u=Math.min(W/22,24);
  // HUD
  const hy=24+16,pw=Math.min(130,W*.3);
  const lx=W/2-pw-5;rr(lx,hy-20,pw,40,20);X.fillStyle='rgba(0,0,0,.25)';X.fill();
  flag(lx+22,hy,30,1);T(String(M-flags),lx+44,hy+1,20,'#e8fff9',700,'left');
  const tx=lx+pw+10;rr(tx,hy-20,pw,40,20);X.fillStyle='rgba(0,0,0,.25)';X.fill();
  X.strokeStyle='#5ee6c8';X.lineWidth=2.5;X.beginPath();X.arc(tx+22,hy,9,0,6.283);X.stroke();X.beginPath();X.moveTo(tx+22,hy);X.lineTo(tx+22,hy-6);X.moveTo(tx+22,hy);X.lineTo(tx+26,hy+2);X.stroke();
  T(fmt(time),tx+40,hy+1,20,'#e8fff9',700,'left');
  fitT(DIFFS[diff].n+(best[DIFFS[diff].k]?' · En iyi '+fmt(best[DIFFS[diff].k]):''),W/2,hy+36,13,W-24,'rgba(232,255,249,.6)',500);
  // board
  const sx=shake>0?rnd(-1,1)*shake*14:0,sy=shake>0?rnd(-1,1)*shake*14:0;
  X.save();X.translate(sx,sy);X.shadowColor='rgba(0,0,0,.5)';X.shadowBlur=28;X.shadowOffsetY=10;rr(bx-6,by-6,bw+12,bh+12,14);X.fillStyle='#0a2b2b';X.fill();X.restore();
  X.save();X.translate(sx,sy);for(let i=0;i<cells.length;i++)drawCell(i,bx+(i%Cn)*cs,by+Math.floor(i/Cn)*cs,cs);X.restore();
  // footer
  const fy=H-L.fh+12,fw=Math.min(W-24,520),fx=(W-fw)/2,b3=(fw-16)/3;
  btn(fx,fy,b3,50,'Menü','menu','rgba(255,255,255,.14)','#fff');
  btn(fx+b3+8,fy,b3,50,flagMode?'Mod: Bayrak':'Mod: Aç','mode',flagMode?'#ff4d5e':'#2fb3a1','#fff');
  btn(fx+2*(b3+8),fy,b3,50,'Yeni Oyun','new','#ffd166','#3a2a00');
  // overlay
  if((state==='lost'&&now-endAt>.9)||state==='won'){
    const k=ease(cl((now-endAt-(state==='lost'?.9:.3))/.4,0,1));if(k<=0)return;
    X.save();X.globalAlpha=k;X.fillStyle='rgba(4,18,18,.72)';X.fillRect(0,0,W,H);
    const pw2=Math.min(W-32,420),ph=280,px=(W-pw2)/2,py=H/2-ph/2+(1-k)*30;
    X.shadowColor='rgba(0,0,0,.5)';X.shadowBlur=30;rr(px,py,pw2,ph,24);X.fillStyle='#103f3d';X.fill();X.shadowColor='transparent';
    if(state==='won'){fitT('Kazandın!',W/2,py+50,44,pw2-30,'#5ee6c8',800);T('Süre: '+fmt(time),W/2,py+100,22,'#fff',600);T('En iyi: '+fmt(best[DIFFS[diff].k]||time),W/2,py+130,16,'rgba(232,255,249,.7)',500)}
    else{fitT('Patladın!',W/2,py+50,44,pw2-30,'#ff6b6b',800);T('Açılan: '+opened+' / '+(R*Cn-M),W/2,py+100,20,'#fff',600);T(DIFFS[diff].n+' · '+fmt(time),W/2,py+130,16,'rgba(232,255,249,.7)',500)}
    X.globalAlpha=k*(.55+.45*Math.sin(now*3.5));fitT('Tekrar oynamak için dokun / tıkla',W/2,py+168,17,pw2-30,'#fff',600);X.restore();
    if(k>.9){const bw2=(pw2-56)/2;btn(px+20,py+ph-72,bw2,50,'Tekrar','again','#ffd166','#3a2a00');btn(px+36+bw2,py+ph-72,bw2,50,'Menü','menu','rgba(255,255,255,.16)','#fff')}
  }
}
const deco=[];for(let i=0;i<120;i++)deco.push({n:Math.random()<.12?-1:Math.random()<.35?(1+Math.random()*4|0):0,f:Math.random()<.08,ph:Math.random()*6});
function drawTitle(){
  const s=Math.max(W,H)/12,cols=Math.ceil(W/s)+2,rows=Math.ceil(H/s)+2,off=(now*12)%s;
  X.save();X.globalAlpha=.22;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const d=deco[(r*7+c*13)%deco.length],x=c*s-s+off,y=r*s-s+off*.5,op=Math.sin(now*.8+d.ph+c*.4+r*.3)>.3;
    rr(x+3,y+3,s-6,s-6,s*.2);X.fillStyle=op?'#cfeee6':'#2fb3a1';X.fill();
    if(op&&d.n>0)T(String(d.n),x+s/2,y+s/2,s*.5,NUMC[d.n],800);else if(op&&d.n<0)mine(x+s/2,y+s/2,s*.8,'#163');else if(!op&&d.f)flag(x+s/2,y+s/2,s,1)}
  X.restore();
  const vg=X.createRadialGradient(W/2,H*.4,0,W/2,H*.4,Math.max(W,H)*.7);vg.addColorStop(0,'rgba(6,21,23,.55)');vg.addColorStop(1,'rgba(6,21,23,.92)');X.fillStyle=vg;X.fillRect(0,0,W,H);
  const u=Math.min(W/18,H/30,34),ty=H*.28;
  X.save();X.translate(W/2,ty-u*2.6);X.rotate(Math.sin(now*2)*.12);const ms=u*3.2;X.shadowColor='rgba(255,77,94,.6)';X.shadowBlur=30;mine(0,0,ms,'#e8fff9');X.restore();
  X.save();X.shadowColor='rgba(0,0,0,.5)';X.shadowBlur=18;fitT('Mayın Tarlası',W/2,ty,u*2.4,W-32,'#5ee6c8',800);X.restore();
  fitT('Sayıları oku, bayrakla, mayına basma!',W/2,ty+u*1.6,u*.8,W-40,'#cfeee6',500);
  const bw=Math.min(150,(W-48)/3),bh=Math.min(64,u*2.1),gx=bw+8,x0=W/2-gx*1.5+4,by=H*.5;
  DIFFS.forEach((d,i)=>{const sel=i===diff;btn(x0+i*gx,by,bw,bh,d.n,'d'+i+'!',sel?'#2fb3a1':'rgba(255,255,255,.12)','#fff',sel);
    fitT(d.c+'×'+d.r+' · '+d.m+' mayın',x0+i*gx+bw/2,by+bh+16,u*.5,bw,'rgba(207,238,230,.7)',500);
    if(best[d.k])fitT('En iyi '+fmt(best[d.k]),x0+i*gx+bw/2,by+bh+34,u*.5,bw,'#ffd166',600)});
  X.save();X.globalAlpha=.55+.45*Math.sin(now*3.5);fitT('Başlamak için dokun / tıkla',W/2,H*.76,u*1.05,W-40,'#fff',700);X.restore();
  fitT('Sağ tık / uzun bas: bayrak · F: bayrak modu',W/2,H*.76+u*1.6,u*.6,W-40,'rgba(207,238,230,.6)',500);
  T('KSB Games',W/2,H-22,13,'rgba(255,255,255,.35)',600);
}
function draw(){bg();if(state==='title')drawTitle();else drawGame();drawParts();speaker('#cfeee6')}
function frame(t){t/=1000;const dt=Math.min(.05,Math.max(0,t-last));last=t;now=t;if(!document.hidden)update(dt);hits=[];draw();requestAnimationFrame(frame)}
requestAnimationFrame(t=>{last=now=t/1000;frame(t)});
</script>
