<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Amiral Battı - KSB Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
'use strict';
const cv=document.getElementById('c'),g=cv.getContext('2d'),FF='"Baloo 2","Trebuchet MS",system-ui,sans-serif';
let W=1,H=1,D=1,btns=[],PT=[],shake=0,state='title',T=0,best=0,muted=false,AC=null,mode=1,KEY='',last=0;
const R=Math.random,ri=n=>Math.floor(R()*n),PI=Math.PI;
function rs(){D=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*D);cv.height=Math.round(H*D);g.setTransform(D,0,0,D,0,0);if(typeof lay=='function')lay()}
addEventListener('resize',rs);
function ld(){KEY='ksb-'+ID+'-best';try{best=+localStorage.getItem(KEY)||0}catch(e){}}
function sv(s){if(s>best){best=s;try{localStorage.setItem(KEY,String(best))}catch(e){}}}
function snd(f,d=.12,t='sine',v=.07,s=0){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(muted)return;const o=AC.createOscillator(),a=AC.createGain(),n=AC.currentTime+s;o.type=t;o.frequency.setValueAtTime(f,n);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d+.02)}catch(e){}}
const jingle=(a,t='triangle')=>a.forEach((f,i)=>snd(f,.2,t,.07,i*.1));
function rr(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function tx(s,x,y,sz,c='#fff',al='center',w='700'){g.font=w+' '+sz+'px '+FF;g.textAlign=al;g.textBaseline='middle';g.fillStyle=c;g.fillText(s,x,y)}
function btn(x,y,w,h,s,fn,c='#f2b632',tc='#241600'){if(fn)btns.push({x,y,w,h,fn});g.save();if(!fn)g.globalAlpha=.4;rr(x,y,w,h,h*.28);g.fillStyle=c;g.fill();tx(s,x+w/2,y+h/2+1,Math.min(h*.5,(w-14)/(s.length*.5)),tc);g.restore()}
function burst(x,y,c,n=14){for(let i=0;i<n;i++)PT.push({x,y,vx:(R()-.5)*300,vy:(R()-.8)*280,l:1,c,s:2+R()*3})}
function topbar(st){btn(8,8,92,32,'Yeni oyun',()=>go(mode),'rgba(255,255,255,.18)','#fff');tx('Rekor '+best,W-52,24,15,'#fff','right');tx(st,W/2,62,Math.min(19,W/18))}
function ovr(t,s,c='#ffd24a'){g.fillStyle='rgba(5,8,20,.74)';g.fillRect(0,0,W,H);const z=Math.min(W*.11,64);tx(t,W/2,H*.36,z,c);tx(s,W/2,H*.36+z*.95,Math.min(W*.05,26));btn(W/2-110,H*.52,220,56,'Yeni oyun',()=>go(mode));tx('Tekrar için dokun / tıkla',W/2,H*.52+84,16,'#ccd')}
function title(){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,BG[0]);gr.addColorStop(1,BG[1]);g.fillStyle=gr;g.fillRect(0,0,W,H);deco();
const s=Math.min(W/(Math.max(...NAME.map(l=>l.length))*.62),H*.11,120);NAME.forEach((l,i)=>{const y=H*.27+(i-(NAME.length-1)/2)*s*1.08;tx(l,W/2+3,y+5,s,'rgba(0,0,0,.45)');tx(l,W/2,y,s,'#fff')});
const y2=H*.27+NAME.length*s*.62+10;tx(SUB,W/2,y2,Math.min(W*.05,24),ACC);
const py=TWO?H*.58:H*.66;g.globalAlpha=.65+.35*Math.sin(T*4);tx('Başlamak için dokun / tıkla',W/2,py,Math.min(W*.06,28));g.globalAlpha=1;
if(TWO){btn(W/2-130,H*.66,260,52,'Bilgisayara karşı',()=>go(1));btn(W/2-130,H*.66+64,260,52,'2 Oyuncu',()=>go(2),'rgba(255,255,255,.2)','#fff')}}
function speaker(){const x=W-26,y=24;g.save();g.fillStyle='rgba(255,255,255,.85)';g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=2;g.beginPath();g.moveTo(x-9,y-4);g.lineTo(x-4,y-4);g.lineTo(x+2,y-9);g.lineTo(x+2,y+9);g.lineTo(x-4,y+4);g.lineTo(x-9,y+4);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(x+5,y-5);g.lineTo(x+12,y+5);g.moveTo(x+12,y-5);g.lineTo(x+5,y+5)}else{g.arc(x+2,y,7,-.9,.9);g.moveTo(x+11,y-8);g.arc(x+2,y,12,-.9,.9)}g.stroke();g.restore()}
function pt(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const[x,y]=pt(e);try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)()}catch(_){}
if(Math.hypot(x-(W-26),y-24)<22&&state!='title'||Math.hypot(x-(W-26),y-24)<22){muted=!muted;return}
for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){snd(520,.06);b.fn();return}}
if(state=='title')go(1);else if(state=='over')go(mode);else if(typeof dn=='function')dn(x,y,e)});
addEventListener('pointermove',e=>{if(typeof mv=='function'){const[x,y]=pt(e);mv(x,y)}});
addEventListener('pointerup',e=>{if(typeof up=='function'){const[x,y]=pt(e);up(x,y)}});
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
if(e.key=='m'||e.key=='M'){muted=!muted;return}
if(e.key==' '||e.key=='Enter'){if(state=='title'){go(1);return}if(state=='over'){go(mode);return}}
if(typeof kd=='function')kd(e.key,e)});
function fr(t){requestAnimationFrame(fr);if(document.hidden){last=0;return}const dt=Math.min(.05,last?(t-last)/1000:.016);last=t;T+=dt;btns=[];
PT=PT.filter(p=>(p.l-=dt*1.6)>0);PT.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt});
g.save();if(shake>0){shake=Math.max(0,shake-dt*40);g.translate((R()-.5)*shake,(R()-.5)*shake)}
if(state=='title')title();else{upd(dt);draw()}
PT.forEach(p=>{g.globalAlpha=Math.max(0,p.l);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.s,0,7);g.fill()});g.globalAlpha=1;g.restore();speaker()}
document.addEventListener('visibilitychange',()=>{last=0});

const ID='amiral-batti',NAME=['AMİRAL','BATTI'],SUB='Amiral Battı · filo savaşı',BG=['#0e5a8a','#031428'],ACC='#9be0ff',TWO=false;
const LEN=[5,4,3,3,2];
let P,E,sP,sE,shipsP,shipsE,ph='place',msg='',msgT=0,aiT=0,shots=0,score=0,L={};
function fleet(){const g2=Array(100).fill(-1),ships=[];LEN.forEach((n,id)=>{for(let tries=0;tries<500;tries++){const h=R()<.5,r=ri(h?10:11-n),c=ri(h?11-n:10),cs=[];let ok=true;for(let k=0;k<n;k++){const i=(r+(h?0:k))*10+c+(h?k:0);if(g2[i]>=0)ok=false;cs.push(i)}
if(ok){cs.forEach(i=>g2[i]=id);ships.push({id,len:n,cells:cs,hits:0});break}}});return[g2,ships]}
function lay(){if(W>H*1.15){const s=Math.min((W-48)/2,H-150);L={s,ps:s,ex:W/2+12,ey:90,px:W/2-12-s,py:90}}else{const s=Math.min(W-16,(H-190)*.62),p=Math.min(W*.5,(H-190)*.36);L={s,ps:p,ex:(W-s)/2,ey:78,px:(W-p)/2,py:78+s+34}}}
function go(){state='play';[P,shipsP]=fleet();[E,shipsE]=fleet();sP=Array(100).fill(0);sE=Array(100).fill(0);ph='place';shots=0;score=0;msg='Filonu dizdin, hazır mısın?';msgT=99;lay();jingle([330,392])}
function shoot(gr,ships,sh,i){const hit=gr[i]>=0;sh[i]=hit?2:1;let sunk=false;if(hit){const s=ships[gr[i]];s.hits++;sunk=s.hits==s.len}return{hit,sunk}}
const alive=ships=>ships.some(s=>s.hits<s.len);
function fx(x,y,hit,sunk){burst(x,y,hit?'#ff8a30':'#cfefff',hit?16:8);if(hit){snd(150,.25,'sawtooth',.07);shake=sunk?14:6}else snd(500,.1,'sine',.05);if(sunk)jingle([392,330,262],'sawtooth')}
function fin(win){state='over';ph='end';if(win){score=Math.max(10,200-2*shots);sv(score)}jingle(win?[523,659,784,1047]:[300,250,200])}
function dn(x,y){if(ph!='play')return;const c=Math.floor((x-L.ex)/(L.s/10)),r=Math.floor((y-L.ey)/(L.s/10));if(r<0||r>9||c<0||c>9)return;const i=r*10+c;if(sE[i])return;
const res=shoot(E,shipsE,sE,i);shots++;const cs=L.s/10;fx(L.ex+(c+.5)*cs,L.ey+(r+.5)*cs,res.hit,res.sunk);
msg=res.sunk?'Bir gemi batırdın!':res.hit?'İsabet!':'Karavana...';msgT=1.4;if(!alive(shipsE)){fin(true);return}ph='ai';aiT=.9}
function pick(){const un=[],hits=[];for(let i=0;i<100;i++){if(!sP[i])un.push(i);else if(sP[i]==2&&shipsP[P[i]].hits<shipsP[P[i]].len)hits.push(i)}
const w=un.map(i=>{const r=i/10|0,c=i%10;let v=0;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{const r1=r+dr,c1=c+dc;if(r1<0||r1>9||c1<0||c1>9)return;if(hits.includes(r1*10+c1)){v+=5;const r2=r1+dr,c2=c1+dc;if(r2>=0&&r2<10&&c2>=0&&c2<10&&hits.includes(r2*10+c2))v+=10}});return v});
const mx=Math.max(...w);if(mx>0){const a=un.filter((i,k)=>w[k]==mx);return a[ri(a.length)]}const par=un.filter(i=>((i/10|0)+i%10)%2==0);const a=par.length?par:un;return a[ri(a.length)]}
function ai(){const i=pick(),res=shoot(P,shipsP,sP,i),cs=L.ps/10;fx(L.px+(i%10+.5)*cs,L.py+((i/10|0)+.5)*cs,res.hit,res.sunk);msg=res.sunk?'Bir gemin battı!':res.hit?'Düşman isabet aldırdı!':'Düşman ıskaladı';msgT=1.4;if(!alive(shipsP)){fin(false);return}ph='play'}
function kd(k){if(ph=='place'){if(k==' '||k=='Enter'){ph='play';msg='Ateş et!';msgT=2}else if(k=='r'||k=='R')[P,shipsP]=fleet()}}
function upd(dt){if(msgT>0&&msgT<50)msgT-=dt;if(ph=='ai'){aiT-=dt;if(aiT<=0)ai()}}
function ship(s,x,y,cs,dead){const a=Math.min(...s.cells),b=Math.max(...s.cells),r0=a/10|0,c0=a%10,r1=b/10|0,c1=b%10;g.fillStyle=dead?'#8a2a2a':'#9aa8b8';rr(x+c0*cs+cs*.1,y+r0*cs+cs*.12,(c1-c0+1)*cs-cs*.2,(r1-r0+1)*cs-cs*.24,cs*.35);g.fill();g.strokeStyle=dead?'#ff6a5a':'#e8eef6';g.lineWidth=2;g.stroke();g.fillStyle='rgba(0,0,0,.25)';rr(x+c0*cs+cs*.25,y+r0*cs+cs*.3,(c1-c0+1)*cs-cs*.5,(r1-r0+1)*cs-cs*.6,cs*.2);g.fill()}
function grid(x,y,s,gr,sh,ships,show){const cs=s/10;g.fillStyle='#06223a';rr(x-4,y-4,s+8,s+8,8);g.fill();
for(let i=0;i<100;i++){const r=i/10|0,c=i%10,w=Math.sin(T*1.5+r*.7+c*.9)*.5+.5;g.fillStyle='rgb('+(18+w*10|0)+','+(88+w*25|0)+','+(140+w*30|0)+')';g.fillRect(x+c*cs+.5,y+r*cs+.5,cs-1,cs-1)}
ships.forEach(s=>{const dead=s.hits==s.len;if(show||dead)ship(s,x,y,cs,dead)});
for(let i=0;i<100;i++){if(!sh[i])continue;const cx2=x+(i%10+.5)*cs,cy=y+((i/10|0)+.5)*cs;if(sh[i]==1){g.fillStyle='rgba(255,255,255,.85)';g.beginPath();g.arc(cx2,cy,cs*.13,0,7);g.fill()}else{g.fillStyle='rgba(255,'+(110+Math.sin(T*9+i)*40|0)+',30,.9)';g.beginPath();g.arc(cx2,cy,cs*.28,0,7);g.fill();g.strokeStyle='#300';g.lineWidth=2;g.beginPath();g.moveTo(cx2-cs*.18,cy-cs*.18);g.lineTo(cx2+cs*.18,cy+cs*.18);g.moveTo(cx2+cs*.18,cy-cs*.18);g.lineTo(cx2-cs*.18,cy+cs*.18);g.stroke()}}}
function draw(){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0e4a78');gr.addColorStop(1,'#021020');g.fillStyle=gr;g.fillRect(0,0,W,H);
topbar(msgT>0?msg:ph=='play'?'Düşman sularına ateş et!':ph=='ai'?'Düşman nişan alıyor...':'');
if(ph=='place'){grid(L.ex,L.ey,L.s,P,sP,shipsP,true);const by2=L.ey+L.s+14,bw=Math.min(170,(W-30)/2);btn(W/2-bw-5,by2,bw,52,'Karıştır',()=>{[P,shipsP]=fleet();snd(300,.08)},'rgba(255,255,255,.22)','#fff');btn(W/2+5,by2,bw,52,'Savaşa Başla',()=>{ph='play';msg='Ateş et!';msgT=2;snd(600,.15)});
tx('Gemilerin rastgele yerleştirildi',W/2,by2+76,16,'rgba(255,255,255,.7)');return}
grid(L.ex,L.ey,L.s,E,sE,shipsE,state=='over');tx('DÜŞMAN SULARI',L.ex+L.s/2,L.ey-12,13,'rgba(255,255,255,.6)');
grid(L.px,L.py,L.ps,P,sP,shipsP,true);tx('FİLON',L.px+L.ps/2,L.py+L.ps+16,13,'rgba(255,255,255,.6)');tx('Atış: '+shots,W/2,H-10,14,'rgba(255,255,255,.6)');
if(state=='over')ovr(alive(shipsP)?'Zafer!':'Filon battı',alive(shipsP)?shots+' atışta kazandın · Puan '+score:'Düşman filosu üstün geldi')}
function deco(){for(let i=0;i<4;i++){g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=3;g.beginPath();for(let x=0;x<=W;x+=12)g.lineTo(x,H*(.72+i*.07)+Math.sin(x*.02+T*1.2+i)*10);g.stroke()}
for(let i=0;i<3;i++){const x=(T*30*(1+i*.3)+i*300)%(W+300)-150,y=H*(.78+i*.06);g.fillStyle='#9aa8b8';g.beginPath();g.moveTo(x-70,y);g.lineTo(x+70,y);g.lineTo(x+50,y+22);g.lineTo(x-55,y+22);g.fill();g.fillRect(x-14,y-26,28,26);g.fillStyle='#e8553a';g.fillRect(x-4,y-40,8,14)}}

ld();rs();requestAnimationFrame(fr);
</script></body></html>
