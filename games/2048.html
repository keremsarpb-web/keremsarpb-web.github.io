<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>2048 · KSB Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1d1030;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const ID='2048',FONT='Fredoka';
const C=document.getElementById('c'),X=C.getContext('2d');
let W=1,H=1,DPR=1,now=0,last=0;
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let AC=null,muted=!!store.get('ksb-'+ID+'-mute',false);
function audio(){try{if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(A)AC=new A()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
function snd(f,d,type,v,f2,dl){if(!AC||muted)return;try{const t=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
function toggleMute(){muted=!muted;store.set('ksb-'+ID+'-mute',muted);audio();snd(660,.08,'sine',.1)}
const F=(sz,w)=>(w||700)+' '+Math.max(1,Math.round(sz))+'px '+FONT+',"Segoe UI",system-ui,sans-serif';
function T(s,x,y,sz,col,w,al){X.font=F(sz,w);X.fillStyle=col;X.textAlign=al||'center';X.textBaseline='middle';X.fillText(s,x,y)}
function fitT(s,x,y,sz,maxW,col,w){X.font=F(sz,w);const m=X.measureText(s).width;if(m>maxW)sz*=maxW/m;T(s,x,y,sz,col,w);return sz}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}
const cl=(v,a,b)=>v<a?a:v>b?b:v,ease=t=>1-Math.pow(1-t,3),rnd=(a,b)=>a+Math.random()*(b-a);
let hits=[];
function hit(x,y,w,h,id){hits.push({x,y,w,h,id})}
function findHit(px,py){for(let i=hits.length-1;i>=0;i--){const b=hits[i];if(px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h)return b.id}return null}
function btn(x,y,w,h,label,id,bg,fg,off){X.save();X.globalAlpha=off?.4:1;X.shadowColor='rgba(0,0,0,.35)';X.shadowBlur=14;X.shadowOffsetY=4;rr(x,y,w,h,h/2.4);X.fillStyle=bg;X.fill();X.restore();X.save();X.globalAlpha=off?.45:1;fitT(label,x+w/2,y+h/2+1,Math.min(h*.4,21),w-14,fg,600);X.restore();if(!off)hit(x,y,w,h,id)}
function speaker(col){const s=30,x=W-s-12,y=12;X.save();rr(x-5,y-5,s+10,s+10,12);X.fillStyle='rgba(0,0,0,.28)';X.fill();X.fillStyle=col;X.beginPath();X.moveTo(x+4,y+11);X.lineTo(x+10,y+11);X.lineTo(x+17,y+4);X.lineTo(x+17,y+26);X.lineTo(x+10,y+19);X.lineTo(x+4,y+19);X.closePath();X.fill();X.strokeStyle=col;X.lineWidth=2.4;X.lineCap='round';if(muted){X.beginPath();X.moveTo(x+21,y+10);X.lineTo(x+28,y+20);X.moveTo(x+28,y+10);X.lineTo(x+21,y+20);X.stroke()}else{X.beginPath();X.arc(x+18,y+15,5,-.9,.9);X.stroke();X.beginPath();X.arc(x+18,y+15,10,-.9,.9);X.stroke()}X.restore();hit(x-8,y-8,s+16,s+16,'mute')}
const parts=[];
function burst(x,y,n,cols,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=rnd(.3,1)*(sp||220);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,l:rnd(.4,.9),s:rnd(2.5,5.5),c:cols[i%cols.length],r:0,vr:0,g:500})}}
function confetti(cols){for(let i=0;i<160;i++)parts.push({x:rnd(0,W),y:rnd(-H*.6,-10),vx:rnd(-60,60),vy:rnd(80,260),l:rnd(2.5,4.5),s:rnd(6,10),c:cols[i%cols.length],r:rnd(0,6),vr:rnd(-8,8),g:110,cf:1})}
function stepParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0||p.y>H+40){parts.splice(i,1);continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;if(!p.cf)p.vx*=.98}}
function drawParts(){for(const p of parts){X.save();X.globalAlpha=Math.min(1,p.l*2);X.translate(p.x,p.y);X.fillStyle=p.c;if(p.cf){X.rotate(p.r);X.scale(1,Math.cos(p.r*1.7));X.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}else{X.beginPath();X.arc(0,0,p.s,0,6.283);X.fill()}X.restore()}}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);C.width=Math.round(W*DPR);C.height=Math.round(H*DPR);X.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
try{document.fonts.load(F(40)).catch(()=>{})}catch(e){}

/* ---------- 2048 ---------- */
const N=4,SLIDE=.11;
const COLS={2:['#ffe9dc','#7b4a3c'],4:['#ffd3b6','#7b4a3c'],8:['#ffaa80','#fff'],16:['#ff8a65','#fff'],32:['#ff6b6b','#fff'],64:['#f2456d','#fff'],128:['#ffd166','#6b4100'],256:['#ffc23d','#6b4100'],512:['#ffa600','#fff'],1024:['#c77dff','#fff'],2048:['#9d4edd','#fff']};
const tc=v=>COLS[v]||['#5a189a','#fff'];
const CONF=['#ffd166','#ff6b6b','#c77dff','#ffaa80','#fff'];
let state='title',grid=null,tiles=[],score=0,best=+store.get('ksb-2048-best',0)||0,moveStart=-9,undoSnap=null,won=false,pend=null,stateT=0,floats=[],bump=0;
function newTile(v,r,c,born,kind){const t={v,r,c,fr:r,fc:c,born:born||0,kind:kind||'',dying:false,fx:0};tiles.push(t);grid[r][c]=t;return t}
function empties(){const e=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])e.push([r,c]);return e}
function spawn(at){const e=empties();if(!e.length)return;const p=e[Math.random()*e.length|0];newTile(Math.random()<.9?2:4,p[0],p[1],at,'spawn')}
function newGame(){grid=[...Array(N)].map(()=>Array(N).fill(null));tiles=[];score=0;undoSnap=null;won=false;pend=null;floats=[];moveStart=-9;spawn(now);spawn(now+.08);state='play';stateT=now;snd(392,.1,'triangle',.1);snd(523,.14,'triangle',.1,0,.08)}
function snapshot(){return{g:grid.map(row=>row.map(t=>t?t.v:0)),s:score,w:won}}
function restore(s){grid=[...Array(N)].map(()=>Array(N).fill(null));tiles=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(s.g[r][c])newTile(s.g[r][c],r,c,0,'');score=s.s;won=s.w}
function settle(){tiles=tiles.filter(t=>!t.dying);for(const t of tiles){t.fr=t.r;t.fc=t.c}}
function canMove(){for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=grid[r][c];if(!t)return true;if(c<N-1&&grid[r][c+1]&&grid[r][c+1].v===t.v)return true;if(r<N-1&&grid[r+1][c]&&grid[r+1][c].v===t.v)return true}return false}
function move(dir){
  if(state!=='play'||pend)return;
  settle();
  const snap=snapshot();let moved=false,gain=0,top=0;moveStart=now;
  for(let i=0;i<N;i++){
    const pos=[];
    for(let k=0;k<N;k++){if(dir===0)pos.push([i,k]);else if(dir===1)pos.push([i,N-1-k]);else if(dir===2)pos.push([k,i]);else pos.push([N-1-k,i])}
    const line=pos.map(p=>grid[p[0]][p[1]]).filter(Boolean);
    pos.forEach(p=>{grid[p[0]][p[1]]=null});
    let j=0;
    for(let k=0;k<line.length;k++){
      const t=line[k],r=pos[j][0],c=pos[j][1];
      if(k+1<line.length&&line[k+1].v===t.v){
        for(const s of [t,line[k+1]]){s.fr=s.r;s.fc=s.c;s.r=r;s.c=c;s.dying=true}
        const m=newTile(t.v*2,r,c,now+SLIDE,'merge');gain+=m.v;top=Math.max(top,m.v);moved=true;k++;
      }else{t.fr=t.r;t.fc=t.c;if(t.r!==r||t.c!==c)moved=true;t.r=r;t.c=c;grid[r][c]=t}
      j++;
    }
  }
  if(!moved){bump=.12;snd(140,.07,'sine',.05);return}
  undoSnap=snap;score+=gain;
  if(score>best){best=score;store.set('ksb-2048-best',best)}
  if(gain){floats.push({v:gain,t:now});const f=200*Math.pow(1.09,Math.log2(top));snd(f,.13,'sine',.13,f*1.5,SLIDE*.6);snd(f*2,.1,'triangle',.04,0,SLIDE*.6)}
  else snd(260,.05,'triangle',.05,200);
  spawn(now+SLIDE);
  if(!won&&top>=2048){won=true;pend={s:'win',at:now+SLIDE+.35}}
  else if(!canMove())pend={s:'over',at:now+.7};
}
function undo(){if(!undoSnap||state!=='play')return;restore(undoSnap);undoSnap=null;pend=null;moveStart=-9;snd(500,.08,'sine',.08,300)}
function act(id){
  if(id==='mute')toggleMute();
  else if(id==='new')newGame();
  else if(id==='undo')undo();
  else if(id==='menu'){state='title';stateT=now;pend=null}
  else if(id==='cont'){state='play';stateT=now}
}
function tapScreen(){
  if(state==='title')newGame();
  else if(state==='over'&&now-stateT>.6)newGame();
  else if(state==='win'&&now-stateT>.6){state='play';stateT=now}
}
/* input */
function pos(e){const b=C.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]}
let down=null;
C.addEventListener('pointerdown',e=>{e.preventDefault();audio();const[x,y]=pos(e);const h=findHit(x,y);if(h){act(h);down=null;return}if(state!=='play'){tapScreen();down=null;return}down={x,y}});
C.addEventListener('pointerup',e=>{if(!down||state!=='play')return;const[x,y]=pos(e);const dx=x-down.x,dy=y-down.y;down=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:0);else move(dy>0?3:2)});
C.addEventListener('pointercancel',()=>{down=null});
C.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  const k=e.key;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Backspace'].includes(k))e.preventDefault();
  audio();const l=k.toLowerCase();
  if(l==='m'){toggleMute();return}
  if(state!=='play'){if(k==='Enter'||k===' ')tapScreen();if(state!=='title'&&(l==='r'||l==='n'))newGame();if(k==='Escape'){state='title';stateT=now}return}
  if(k==='ArrowLeft'||l==='a')move(0);else if(k==='ArrowRight'||l==='d')move(1);else if(k==='ArrowUp'||l==='w')move(2);else if(k==='ArrowDown'||l==='s')move(3);
  else if(l==='u'||l==='z'||k==='Backspace')undo();else if(l==='r'||l==='n')newGame();else if(k==='Escape'){state='title';stateT=now}
});
/* update */
function update(dt){
  stepParts(dt);bump=Math.max(0,bump-dt);
  if(pend&&now>=pend.at){state=pend.s;stateT=now;pend=null;
    if(state==='win'){confetti(CONF);[523,659,784,1047].forEach((f,i)=>snd(f,.25,'triangle',.12,0,i*.1))}
    else{[392,330,262,196].forEach((f,i)=>snd(f,.3,'sine',.1,0,i*.13))}}
  floats=floats.filter(f=>now-f.t<.9);
}
/* draw */
const deco=[];for(let i=0;i<18;i++)deco.push({x:Math.random(),y:Math.random(),v:2**(1+(Math.random()*11|0)),s:rnd(.6,1.25),sp:rnd(.012,.03),a:rnd(-.5,.5),ph:Math.random()*6});
function bg(){const g=X.createLinearGradient(0,0,W*.4,H);g.addColorStop(0,'#2d1748');g.addColorStop(1,'#130a21');X.fillStyle=g;X.fillRect(0,0,W,H);
  const cs=['rgba(255,120,90,.17)','rgba(170,90,255,.17)','rgba(255,200,90,.10)'];
  for(let i=0;i<3;i++){const x=W*(.5+.42*Math.sin(now*.13+i*2.1)),y=H*(.5+.42*Math.cos(now*.1+i*1.7)),r=Math.max(W,H)*.5;const rg=X.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,cs[i]);rg.addColorStop(1,'rgba(0,0,0,0)');X.fillStyle=rg;X.fillRect(0,0,W,H)}}
function tileAt(x,y,sz,v,alpha,label){const c=tc(v);X.save();X.globalAlpha=alpha==null?1:alpha;X.shadowColor='rgba(0,0,0,.3)';X.shadowBlur=sz*.14;X.shadowOffsetY=sz*.05;rr(x-sz/2,y-sz/2,sz,sz,sz*.17);X.fillStyle=c[0];X.fill();X.shadowColor='transparent';
  const hg=X.createLinearGradient(0,y-sz/2,0,y+sz/2);hg.addColorStop(0,'rgba(255,255,255,.28)');hg.addColorStop(.55,'rgba(255,255,255,0)');hg.addColorStop(1,'rgba(0,0,0,.08)');X.fillStyle=hg;X.fill();
  if(v>=128){X.shadowColor=c[0];X.shadowBlur=sz*.25}
  const s=label||String(v),k=s.length;T(s,x,y+sz*.03,sz*(k<3?.5:k<4?.41:k<5?.33:.27),c[1],700);X.restore()}
function drawTitle(){
  for(const d of deco){const y=((d.y+now*d.sp)%1.2-.1)*H,x=d.x*W,sz=Math.min(W,H)*.1*d.s;X.save();X.translate(x,y);X.rotate(d.a+Math.sin(now*.6+d.ph)*.12);tileAt(0,0,sz,d.v,.2);X.restore()}
  const sz=Math.min(W*.2,H*.15,150),gap=sz*.13,tot=4*sz+3*gap,x0=W/2-tot/2+sz/2,y=H*.36,vals=[16,32,128,2048];
  '2048'.split('').forEach((ch,i)=>{const b=Math.sin(now*2.4-i*.7)*sz*.07,s=1+Math.max(0,Math.sin(now*2.4-i*.7))*.04;X.save();X.translate(x0+i*(sz+gap),y+b);X.scale(s,s);tileAt(0,0,sz,vals[i],1,ch);X.restore()});
  const u=Math.min(W/20,H/32,30);
  fitT("Kaydır, birleştir, 2048'e ulaş!",W/2,y+sz*.95+u,u*1.05,W-40,'#ffe1cf',600);
  if(best>0){rr(W/2-u*5,y+sz*.95+u*2.4,u*10,u*1.9,u*.95);X.fillStyle='rgba(255,255,255,.1)';X.fill();T('En iyi skor: '+best,W/2,y+sz*.95+u*3.35,u*.85,'#ffd166',600)}
  X.save();X.globalAlpha=.55+.45*Math.sin(now*3.5);fitT('Başlamak için dokun / tıkla',W/2,H*.8,u*1.1,W-40,'#ffffff',700);X.restore();
  fitT('Yön tuşları veya kaydırma ile oyna',W/2,H*.8+u*1.7,u*.7,W-40,'rgba(255,225,207,.6)',500);
  T('KSB Games',W/2,H-22,13,'rgba(255,255,255,.35)',600);
}
function layout(){const hh=92,fh=82,bs=Math.max(140,Math.min(W-28,H-hh-fh-24,560)),tot=hh+bs+fh;return{bs,bx:(W-bs)/2,by:Math.max(hh+6,(H-tot)/2+hh)}}
function drawGame(){
  const L=layout(),bs=L.bs,bx=L.bx,by=L.by,g=bs*.028,cs=(bs-g*(N+1))/N;
  fitT('2048',bx+Math.min(70,bs*.15),by-48,Math.min(48,bs*.12),bs*.32,'#ffd3b6',700);
  const bw=Math.min(112,bs*.27),bh=56,y0=by-bh-18;
  [['SKOR',score,bx+bs-bw*2-8],['EN İYİ',best,bx+bs-bw]].forEach(([lab,v,x])=>{rr(x,y0,bw,bh,14);X.fillStyle='rgba(255,255,255,.1)';X.fill();T(lab,x+bw/2,y0+16,12,'rgba(255,225,207,.75)',600);fitT(String(v),x+bw/2,y0+37,22,bw-10,'#fff',700)});
  for(const f of floats){const k=(now-f.t)/.9;X.save();X.globalAlpha=1-k;T('+'+f.v,bx+bs-bw*1.5-8,y0+20-k*40,20,'#ffd166',700);X.restore()}
  const sh=bump>0?Math.sin(bump*90)*bump*20:0;
  X.save();X.translate(sh,0);X.shadowColor='rgba(0,0,0,.45)';X.shadowBlur=30;X.shadowOffsetY=10;rr(bx,by,bs,bs,bs*.045);X.fillStyle='#3b2459';X.fill();X.restore();
  X.save();X.translate(sh,0);
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){rr(bx+g+c*(cs+g),by+g+r*(cs+g),cs,cs,cs*.17);X.fillStyle='rgba(255,255,255,.06)';X.fill()}
  const p=ease(cl((now-moveStart)/SLIDE,0,1)),order=tiles.slice().sort((a,b)=>(b.dying-a.dying)||((a.kind==='merge')-(b.kind==='merge')));
  for(const t of order){
    if(t.dying&&p>=1)continue;if(now<t.born)continue;
    const r=t.fr+(t.r-t.fr)*p,c=t.fc+(t.c-t.fc)*p;let s=1;
    if(t.kind==='spawn')s=ease(cl((now-t.born)/.16,0,1));
    else if(t.kind==='merge'){const k=cl((now-t.born)/.2,0,1);s=1+.2*Math.sin(k*Math.PI);if(!t.fx){t.fx=1;burst(bx+g+t.c*(cs+g)+cs/2,by+g+t.r*(cs+g)+cs/2,t.v>=64?16:8,[tc(t.v)[0],'#fff'],cs*2.2)}}
    if(s<=0.01)continue;tileAt(bx+g+c*(cs+g)+cs/2,by+g+r*(cs+g)+cs/2,cs*s,t.v);
  }
  X.restore();
  const fy=by+bs+18,w3=(bs-16)/3;
  btn(bx,fy,w3,48,'Yeni Oyun','new','#ff8a65','#fff');
  btn(bx+w3+8,fy,w3,48,'Geri Al','undo','#c77dff','#fff',!undoSnap||state!=='play');
  btn(bx+2*(w3+8),fy,w3,48,'Menü','menu','rgba(255,255,255,.14)','#fff');
  if(state==='over'||state==='win'){
    const k=ease(cl((now-stateT)/.4,0,1));X.save();X.globalAlpha=k;X.fillStyle='rgba(20,8,34,.72)';X.fillRect(0,0,W,H);
    const u=Math.min(W/18,H/30,32),cy=H/2;
    X.translate(0,(1-k)*30);
    fitT(state==='win'?'2048! Kazandın!':'Oyun Bitti',W/2,cy-u*3,u*2.2,W-40,state==='win'?'#ffd166':'#ffaa80',700);
    T('Skor: '+score,W/2,cy-u*.7,u*1.1,'#fff',600);T('En iyi: '+best,W/2,cy+u*.6,u*.85,'#ffd3b6',500);
    X.globalAlpha=k*(.55+.45*Math.sin(now*3.5));
    fitT(state==='win'?'Devam etmek için dokun / tıkla':'Tekrar oynamak için dokun / tıkla',W/2,cy+u*2.4,u*.95,W-40,'#fff',700);
    X.restore();
    if(k>.9){const bw2=Math.min(170,(W-48)/2);btn(W/2-bw2-6,cy+u*3.6,bw2,48,'Yeni Oyun','new','#ff8a65','#fff');btn(W/2+6,cy+u*3.6,bw2,48,state==='win'?'Devam Et':'Menü',state==='win'?'cont':'menu','rgba(255,255,255,.16)','#fff')}
  }
}
function draw(){bg();if(state==='title')drawTitle();else drawGame();drawParts();speaker('#ffe1cf')}
function frame(t){t/=1000;const dt=Math.min(.05,Math.max(0,t-last));last=t;now=t;if(!document.hidden)update(dt);hits=[];draw();requestAnimationFrame(frame)}
requestAnimationFrame(t=>{last=now=t/1000;frame(t)});
</script>
</body>
</html>
