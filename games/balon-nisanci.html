<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Balon Nişancısı · KSB Games</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0a1f3d;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100vw;height:100vh;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const KEY='ksb-balon-nisanci-best';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,S,best=0,muted=false,AC,last=0,shake=0,parts=[],T=0;
try{best=+localStorage.getItem(KEY)||0}catch(e){}
const sv=()=>{try{localStorage.setItem(KEY,best)}catch(e){}};
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b));
function rs(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);S=Math.min(W,H);if(window.lay)lay()}
addEventListener('resize',rs);
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function tx(s,x,y,z,col,al,wt){ctx.font=(wt||800)+' '+z+'px system-ui,"Segoe UI",sans-serif';ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y)}
function snd(f,d,ty,v,f2){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function burst(x,y,c,n,sp){for(let i=0;i<(n||12);i++){const a=R(0,6.28),s=R(.3,1)*(sp||220);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:R(.4,.8),m:.8,c})}}
function dparts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,6.3);ctx.fill()}ctx.globalAlpha=1}
function spk(){const x=W-22,y=22;ctx.save();ctx.globalAlpha=.8;ctx.fillStyle='#fff';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-9,y-3);ctx.lineTo(x-4,y-3);ctx.lineTo(x+1,y-8);ctx.lineTo(x+1,y+8);ctx.lineTo(x-4,y+3);ctx.lineTo(x-9,y+3);ctx.fill();ctx.beginPath();if(muted){ctx.moveTo(x+5,y-5);ctx.lineTo(x+13,y+5);ctx.moveTo(x+13,y-5);ctx.lineTo(x+5,y+5)}else{ctx.arc(x+2,y,6,-1,1);ctx.moveTo(x+2+Math.cos(-1)*11,y+Math.sin(-1)*11);ctx.arc(x+2,y,11,-1,1)}ctx.stroke();ctx.restore()}
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;if(document.hidden)return;T+=dt;ctx.save();if(shake>0){ctx.translate(R(-shake,shake),R(-shake,shake));shake=Math.max(0,shake-dt*40)}frame(dt);dparts(dt);ctx.restore();spk()}
function pt(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}const[x,y]=pt(e);if(x>W-44&&y<44){muted=!muted;return}onDown(x,y)});
cv.addEventListener('pointermove',e=>{const[x,y]=pt(e);if(window.onMove)onMove(x,y)});
cv.addEventListener('pointerup',e=>{const[x,y]=pt(e);if(window.onUp)onUp(x,y)});
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.key==' ')e.preventDefault();if(e.key=='m'||e.key=='M'){muted=!muted;return}if(window.onKey)onKey(e)});
addEventListener('contextmenu',e=>e.preventDefault());
function big(name,cx,cy,col,glow){const ws=W<H?name.split(' '):[name],ml=Math.max(...ws.map(w=>w.length)),z=Math.min(W*.9/(ml*.76),H*.13,140);ctx.save();ctx.shadowColor=glow||col;ctx.shadowBlur=z*.5;ws.forEach((w,i)=>tx(w,cx,cy+(i-(ws.length-1)/2)*z*1.12,z,col));ctx.restore();return z}
function tap(y,t,col){ctx.globalAlpha=.65+.35*Math.sin(T*4);tx(t||'Başlamak için dokun / tıkla',W/2,y,Math.max(16,Math.min(S*.05,30)),col);ctx.globalAlpha=1}
function over(t,l1,l2,col,rt){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);const z=Math.min(W*.11,70);tx(t,W/2,H*.34,z,col);tx(l1,W/2,H*.34+z*1.2,z*.5);if(l2)tx(l2,W/2,H*.34+z*1.9,z*.42,'#cbd');tap(H*.34+z*3.1,rt||'Tekrar için dokun / tıkla')}
/* ---- oyun ---- */
const N=10,COL=['#ff4d6d','#4dabf7','#51cf66','#ffd43b','#b565f0','#ff922b'];
let st='title',d=36,r=18,h=31,left=0,gTop=60,sx=0,sy=0,maxRow=12,grid=[],par=0,shot=null,curC=0,nextC=1,aim=Math.PI/2,aimOn=false,score=0,lv=1,cnt=0,lim=6,falls=[];
const ft=Array.from({length:20},()=>({x:Math.random(),y:Math.random(),v:R(.03,.08),c:RI(0,6),z:R(.6,1.4)}));
function lay(){d=Math.min(W/(N+.5),(H-150)/16,60);r=d/2;h=d*.866;left=(W-(N+.5)*d)/2;maxRow=Math.max(8,Math.min(15,Math.floor((H-50-d*3.2-40)/h)));const tot=50+maxRow*h+d*3.2;gTop=50+Math.max(0,(H-tot)/2-10);sx=W/2;sy=gTop+maxRow*h+d*1.9}
function pos(i,c){return[left+r+c*d+((i+par)&1)*r,gTop+r+i*h]}
function nb(i,c){const o=(i+par)&1,l=[[i,c-1],[i,c+1]];if(o)l.push([i-1,c],[i-1,c+1],[i+1,c],[i+1,c+1]);else l.push([i-1,c-1],[i-1,c],[i+1,c-1],[i+1,c]);return l.filter(([a,b])=>a>=0&&a<grid.length&&b>=0&&b<N)}
const nc=()=>Math.min(6,3+Math.ceil(lv/2));
function rrow(){return Array.from({length:N},()=>RI(0,nc())+1)}
function pickC(){const s=new Set();grid.forEach(row=>row.forEach(v=>{if(v)s.add(v-1)}));const a=[...s];return a.length?a[RI(0,a.length)]:RI(0,nc())}
function fillLv(){grid=[];par=0;const n=Math.min(7,4+Math.floor(lv/2));for(let i=0;i<n;i++)grid.push(rrow());cnt=0;lim=Math.max(3,7-Math.floor(lv/2));shot=null;falls=[];curC=pickC();nextC=pickC()}
function start(){score=0;lv=1;st='play';fillLv()}
function setAim(x,y){const dx=x-sx,dy=sy-y;let a=Math.atan2(dy,dx);if(dy<8)a=dx<0?Math.PI-.15:.15;aim=Math.max(.15,Math.min(Math.PI-.15,a))}
function onDown(x,y){if(st!='play'){start();return}aimOn=true;setAim(x,y)}
function onMove(x,y){if(aimOn)setAim(x,y)}
function onUp(){if(aimOn&&st=='play')fire();aimOn=false}
function onKey(e){if(st!='play'){if(e.key=='Enter'||e.key==' ')start();return}if(e.key=='ArrowLeft')aim=Math.min(Math.PI-.15,aim+.06);else if(e.key=='ArrowRight')aim=Math.max(.15,aim-.06);else if(e.key==' '||e.key=='ArrowUp')fire()}
function fire(){if(shot)return;const v=d*30;shot={x:sx,y:sy,vx:Math.cos(aim)*v,vy:-Math.sin(aim)*v,c:curC};snd(300,.12,'triangle',.1,700)}
function snap(){const{x,y,c}=shot;shot=null;let br=-1,bc=-1,bd=1e9;const r0=Math.round((y-gTop-r)/h);for(let i=Math.max(0,r0-1);i<=r0+1;i++)for(let k=0;k<N;k++){if(grid[i]&&grid[i][k])continue;const p=pos(i,k),dd=(p[0]-x)**2+(p[1]-y)**2;if(dd<bd){bd=dd;br=i;bc=k}}
 if(br<0)return;while(grid.length<=br)grid.push(Array(N).fill(0));grid[br][bc]=c+1;
 const seen=new Set([br*N+bc]),q=[[br,bc]];while(q.length){const[i,k]=q.pop();for(const[a,b]of nb(i,k))if(grid[a][b]==c+1&&!seen.has(a*N+b)){seen.add(a*N+b);q.push([a,b])}}
 if(seen.size>=3){seen.forEach(id=>{const i=id/N|0,k=id%N,p=pos(i,k);burst(p[0],p[1],COL[c],8,220);grid[i][k]=0});score+=seen.size*10;snd(500+seen.size*40,.2,'triangle');orphans()}else snd(180,.08,'square',.1);
 trim();cnt++;if(cnt>=lim&&grid.length){grid.unshift(rrow());par^=1;cnt=0;shake=5;snd(120,.3,'sawtooth',.1,80)}
 if(score>best){best=score;sv()}
 if(grid.some((row,i)=>i>=maxRow&&row.some(v=>v))){st='over';shake=8;snd(160,.6,'sawtooth',.12,60);return}
 if(!grid.length){lv++;score+=100*lv;snd(784,.4,'triangle');fillLv();return}
 curC=nextC;nextC=pickC()}
function trim(){while(grid.length&&grid[grid.length-1].every(v=>!v))grid.pop()}
function orphans(){const ok=new Set(),q=[];grid.length&&grid[0].forEach((v,k)=>{if(v){ok.add(k);q.push([0,k])}});while(q.length){const[i,k]=q.pop();for(const[a,b]of nb(i,k))if(grid[a][b]&&!ok.has(a*N+b)){ok.add(a*N+b);q.push([a,b])}}
 grid.forEach((row,i)=>row.forEach((v,k)=>{if(v&&!ok.has(i*N+k)){const p=pos(i,k);falls.push({x:p[0],y:p[1],vx:R(-60,60),vy:-R(50,150),c:v-1});row[k]=0;score+=20}}))}
function bub(x,y,c,rad){const g=ctx.createRadialGradient(x-rad*.3,y-rad*.3,rad*.1,x,y,rad);g.addColorStop(0,'#fff');g.addColorStop(.25,COL[c]);g.addColorStop(1,COL[c]);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rad-1,0,6.3);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.5;ctx.stroke()}
function frame(dt){const gr=ctx.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0a1f3d');gr.addColorStop(1,'#2b1250');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
 ft.forEach(f=>{ctx.globalAlpha=.25;bub(f.x*W,H-((f.y+T*f.v)%1.2-.1)*H,f.c,14*f.z+8)});ctx.globalAlpha=1;
 if(st=='title'){big('BALON NİŞANCISI',W/2,H*.3,'#ffd43b','#ff6fa5');for(let i=0;i<5;i++)bub(W/2+(i-2)*Math.min(W*.14,70),H*.52+Math.sin(T*2+i)*8,i,Math.min(W*.06,30));tap(H*.72);tx('En iyi puan: '+best,W/2,H*.8,Math.min(S*.04,22),'#9fb3d1');return}
 if(st=='play'){falls.forEach(f=>{f.vy+=900*dt;f.x+=f.vx*dt;f.y+=f.vy*dt});falls=falls.filter(f=>f.y<H+40);
  if(shot){const sp=Math.hypot(shot.vx,shot.vy),n=Math.ceil(sp*dt/(d*.25));for(let k=0;k<n&&shot;k++){shot.x+=shot.vx*dt/n;shot.y+=shot.vy*dt/n;if(shot.x<left+r){shot.x=left+r;shot.vx=Math.abs(shot.vx)}else if(shot.x>left+(N+.5)*d-r){shot.x=left+(N+.5)*d-r;shot.vx=-Math.abs(shot.vx)}
   let hitb=shot.y<=gTop+r;if(!hitb)outer:for(let i=0;i<grid.length;i++){if(gTop+r+i*h<shot.y-d*1.2)continue;for(let c=0;c<N;c++)if(grid[i][c]){const p=pos(i,c);if((p[0]-shot.x)**2+(p[1]-shot.y)**2<(d*.88)**2){hitb=true;break outer}}}
   if(hitb)snap()}}}
 tx('Puan '+score,12,24,Math.min(22,W*.055),'#fff','left');tx('Seviye '+lv+'  ·  En iyi '+best,W/2,24,13,'#9fb3d1');
 ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(left,gTop);ctx.lineTo(left,sy+d);ctx.moveTo(left+(N+.5)*d,gTop);ctx.lineTo(left+(N+.5)*d,sy+d);ctx.stroke();
 ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(left,gTop-4,(N+.5)*d,4);
 ctx.setLineDash([8,8]);ctx.strokeStyle='rgba(255,90,90,.6)';ctx.beginPath();ctx.moveTo(left,gTop+maxRow*h);ctx.lineTo(left+(N+.5)*d,gTop+maxRow*h);ctx.stroke();ctx.setLineDash([]);
 grid.forEach((row,i)=>row.forEach((v,k)=>{if(v){const p=pos(i,k);bub(p[0],p[1],v-1,r)}}));
 falls.forEach(f=>bub(f.x,f.y,f.c,r));
 if(st=='play'&&!shot){let x=sx,y=sy,vx=Math.cos(aim),vy=-Math.sin(aim);ctx.fillStyle='rgba(255,255,255,.55)';for(let k=0;k<70;k++){x+=vx*d*.5;y+=vy*d*.5;if(x<left+r||x>left+(N+.5)*d-r)vx=-vx;if(y<gTop)break;ctx.beginPath();ctx.arc(x,y,2.2,0,6.3);ctx.fill()}}
 if(shot)bub(shot.x,shot.y,shot.c,r);else if(st=='play')bub(sx,sy,curC,r);
 bub(sx-d*2.2,sy+d*.4,nextC,r*.65);tx('Sıradaki',sx-d*2.2,sy+d*1.1,11,'#9fb3d1');
 ctx.save();ctx.translate(sx,sy);ctx.rotate(-aim);ctx.fillStyle='rgba(255,255,255,.25)';rr(r*.6,-4,d*.9,8,4);ctx.fill();ctx.restore();
 tx('Tavan: '+(lim-cnt)+' atış',sx+d*2.4,sy+d*.4,13,lim-cnt<=1?'#ff6b6b':'#9fb3d1');
 if(st=='over')over('Balonlar taştı!','Puan: '+score,'En iyi: '+best,'#ff6b6b')}
rs();requestAnimationFrame(loop);
</script></body></html>
