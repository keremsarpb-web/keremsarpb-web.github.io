<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kartopu – KSB Games</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head>
<body><canvas id="c"></canvas><script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),ID='kartopu';let W=1,H=1,S=1,best=0,AC,muted=false,state='title',score=0,shake=0,tm=0,parts=[],ot=0;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);S=Math.min(W,H)}
addEventListener('resize',rs);rs();
try{best=+localStorage.getItem('ksb-'+ID+'-best')||0}catch(e){}
function sv(){if(score>best){best=score;try{localStorage.setItem('ksb-'+ID+'-best',best)}catch(e){}}}
function snd(f,d,t,v,sl){if(muted||!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),n+d);a.gain.setValueAtTime(v||.06,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function T(s,x,y,z,c,a,w){g.font=(w||700)+' '+z+'px Fredoka,Nunito,system-ui,sans-serif';g.textAlign=a||'center';g.textBaseline='middle';g.fillStyle=c||'#fff';g.fillText(s,x,y)}
function RR(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function P(x,y,n,c,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(sp||150)*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.7,c})}}
function upP(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt}parts=parts.filter(p=>p.l>0)}
function drP(){for(const p of parts){g.globalAlpha=Math.max(0,p.l/.7);g.fillStyle=p.c;g.fillRect(p.x-2,p.y-2,4,4)}g.globalAlpha=1}
function titleScr(name,sub,y0){const z=Math.min(S*.15,W*.92/(name.length*.62));y0=y0||H*.3;g.save();g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=z*.2;g.shadowOffsetY=z*.06;T(name,W/2,y0+Math.sin(tm*2)*z*.05,z,'#fff',0,800);g.restore();if(sub)T(sub,W/2,y0+z*.85,Math.max(13,z*.3),'rgba(255,255,255,.9)',0,500);g.globalAlpha=.65+.35*Math.sin(tm*4);T('Başlamak için dokun / tıkla',W/2,H*.78,Math.max(15,Math.min(S*.05,30)),'#fff',0,700);g.globalAlpha=1;if(best)T('En iyi: '+best,W/2,H*.78+Math.max(28,S*.08),Math.max(13,S*.035),'#ffe',0,500)}
function overScr(t,l2){g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,H);const z=Math.min(S*.11,W*.9/(t.length*.62));T(t,W/2,H*.32,z,'#fff',0,800);T('Skor: '+score,W/2,H*.32+z*1.1,z*.55,'#ffd54a');T('En iyi: '+best,W/2,H*.32+z*1.8,z*.4,'#fff',0,500);if(l2)T(l2,W/2,H*.32+z*2.4,z*.35,'#cde',0,500);if(ot>.5){g.globalAlpha=.6+.4*Math.sin(tm*4);T('Tekrar için dokun / tıkla',W/2,H*.75,Math.max(15,Math.min(S*.05,30)));g.globalAlpha=1}}
const IN={down(){},up(){},mv(){},kd(){},ku(){}};
function initA(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
cv.addEventListener('pointerdown',e=>{e.preventDefault();initA();if(e.clientX>W-50&&e.clientY<50){muted=!muted;return}IN.down(e.clientX,e.clientY,e.pointerId)});
addEventListener('pointerup',e=>IN.up(e.clientX,e.clientY,e.pointerId));
addEventListener('pointercancel',e=>IN.up(e.clientX,e.clientY,e.pointerId));
addEventListener('pointermove',e=>IN.mv(e.clientX,e.clientY,e.pointerId));
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();initA();if(e.repeat)return;if(e.key==='m'||e.key==='M'){muted=!muted;return}IN.kd(e.key)});
addEventListener('keyup',e=>IN.ku(e.key));
function spk(){const x=W-26,y=26;g.save();g.globalAlpha=.8;g.fillStyle='#fff';g.fillRect(x-9,y-4,5,8);g.beginPath();g.moveTo(x-4,y-4);g.lineTo(x+2,y-9);g.lineTo(x+2,y+9);g.lineTo(x-4,y+4);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();if(muted){g.moveTo(x+5,y-5);g.lineTo(x+13,y+5);g.moveTo(x+13,y-5);g.lineTo(x+5,y+5)}else g.arc(x+2,y,7,-1,1);g.stroke();g.restore()}
let last=performance.now();
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;if(document.hidden)dt=0;tm+=dt;if(state==='over')ot+=dt;shake=Math.max(0,shake-dt*40);if(dt>0)step(dt);g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);render();g.restore();spk();requestAnimationFrame(loop)}
/* ---- game ---- */
let bx=0,tx=0,m=10,dist=0,ents=[],spc=0,inv=0,smash=0,keyd=0,down=false,rot=0,flash=0,msg='',mt=0;
const rad=mm=>Math.min(S*.3,S*.03+S*.01*Math.sqrt(mm));
const mtr=()=>Math.floor(dist/(S*.1));
function reset(){bx=W/2;tx=W/2;m=10;dist=0;ents=[];spc=0;inv=0;smash=0;msg='';mt=0}
function go(){if(state==='title'||(state==='over'&&ot>.6)){score=0;reset();state='play'}}
IN.down=(x)=>{if(state!=='play'){go();return}down=true;tx=x};IN.mv=x=>{if(down)tx=x};IN.up=()=>{down=false};
IN.kd=k=>{if(state!=='play'){go();return}if(k==='ArrowLeft'||k==='a'||k==='A')keyd=-1;if(k==='ArrowRight'||k==='d'||k==='D')keyd=1};
IN.ku=k=>{if((k==='ArrowLeft'||k==='a'||k==='A')&&keyd<0||(k==='ArrowRight'||k==='d'||k==='D')&&keyd>0)keyd=0};
function spawn(){const d=mtr();const ob=Math.random()<Math.min(.65,.45+d/1500);
 if(!ob){const cx=S*.05+Math.random()*(W-S*.1);for(let i=0;i<3;i++)ents.push({k:'s',x:cx+(Math.random()-.5)*S*.1,y:H+40+i*S*.05,r:S*(.018+Math.random()*.012)})}
 else{const t=d<80?0:Math.random()*(d<250?2:3)|0;const r=[S*(.03+Math.random()*.025),S*(.045+Math.random()*.03),S*(.08+Math.random()*.035)][t];ents.push({k:['r','t','h'][t],x:r+Math.random()*(W-2*r),y:H+r+40,r,sd:Math.random()})}}
function step(dt){upP(dt);rot+=dt*6;mt=Math.max(0,mt-dt);flash=Math.max(0,flash-dt);
 if(state!=='play'){if(state==='title')dist+=S*.6*dt;return}
 inv=Math.max(0,inv-dt);const v=S*(.5+Math.min(.7,mtr()/800)),r=rad(m);dist+=v*dt;
 if(keyd)tx=bx+keyd*S;const dx=tx-bx,mx=S*1.4*dt;bx+=Math.max(-mx,Math.min(mx,dx));bx=Math.max(r,Math.min(W-r,bx));const by=H*.28;
 spc-=v*dt;if(spc<=0){spawn();spc=S*(.17+Math.random()*.08)}
 for(const e of ents){e.y-=v*dt;const d=Math.hypot(e.x-bx,e.y-by);
  if(e.k==='s'){if(d<r+e.r){e.dead=1;m+=1.6;snd(700+Math.min(500,m*3),.06,'sine',.04);P(e.x,e.y,3,'#fff',70)}}
  else if(d<r+e.r*.85&&!e.dead&&inv<=0){if(r>=e.r*1.05){e.dead=1;smash++;m+=e.r/S*60;score=mtr()+smash*10;sv();shake=7;snd(180,.25,'sawtooth',.09,-100);P(e.x,e.y,22,e.k==='r'?'#9aa3ad':e.k==='t'?'#2f7d4a':'#c0603c',260);msg='Parçaladın! +10';mt=.6}
   else{m*=.72;inv=.8;shake=10;snd(110,.3,'square',.1,-60);P(bx,by,16,'#fff',200);bx+=bx<e.x?-r*1.2:r*1.2;if(m<5){state='over';ot=0;score=mtr()+smash*10;sv()}}}}
 ents=ents.filter(e=>!e.dead&&e.y>-S*.3);score=mtr()+smash*10;sv();if(Math.random()<.5)parts.push({x:bx+(Math.random()-.5)*r,y:by-r*.7,vx:(Math.random()-.5)*40,vy:-120,l:.5,c:'#fff'})}
function ball(x,y,r,rt,face){const gr=g.createRadialGradient(x-r*.3,y-r*.3,r*.1,x,y,r);gr.addColorStop(0,'#fff');gr.addColorStop(1,'#a9d4f5');g.fillStyle='rgba(30,60,120,.18)';g.beginPath();g.ellipse(x+r*.12,y+r*.2,r,r*.95,0,0,7);g.fill();g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();
 g.save();g.beginPath();g.arc(x,y,r,0,7);g.clip();g.strokeStyle='rgba(120,170,220,.5)';g.lineWidth=Math.max(2,r*.06);for(let i=0;i<3;i++){const a=rt+i*2.1;g.beginPath();g.arc(x+Math.cos(a)*r*.6,y+Math.sin(a)*r*.6,r*.55,0,6.3);g.stroke()}g.restore();
 if(face){g.fillStyle='#234';for(const s of[-1,1]){g.beginPath();g.arc(x+s*r*.28,y-r*.1,r*.09,0,7);g.fill()}g.strokeStyle='#234';g.lineWidth=Math.max(2,r*.05);g.beginPath();g.arc(x,y+r*.12,r*.2,.2,2.9);g.stroke()}}
function obj(e){const r=e.r,x=e.x,y=e.y;if(e.k==='r'){g.fillStyle='#8a929c';g.beginPath();for(let i=0;i<8;i++){const a=i/8*6.283;g.lineTo(x+Math.cos(a)*r*(.85+.2*Math.sin(i*3+e.sd*9)),y+Math.sin(a)*r*(.85+.2*Math.sin(i*3+e.sd*9)))}g.fill();g.fillStyle='#fff';g.beginPath();g.ellipse(x,y-r*.5,r*.6,r*.25,0,0,7);g.fill()}
 else if(e.k==='t'){g.fillStyle='#5a3b22';g.fillRect(x-r*.1,y+r*.5,r*.2,r*.5);for(let i=0;i<3;i++){g.fillStyle='#2f7d4a';g.beginPath();g.moveTo(x,y-r*1.1+i*r*.5);g.lineTo(x+r*(.6+i*.25),y-r*.1+i*r*.5);g.lineTo(x-r*(.6+i*.25),y-r*.1+i*r*.5);g.fill();g.fillStyle='#fff';g.beginPath();g.moveTo(x,y-r*1.1+i*r*.5);g.lineTo(x+r*.25,y-r*.7+i*r*.5);g.lineTo(x-r*.25,y-r*.7+i*r*.5);g.fill()}}
 else{g.fillStyle='#c98a54';g.fillRect(x-r*.8,y-r*.2,r*1.6,r*.9);g.fillStyle='#b8443a';g.beginPath();g.moveTo(x-r,y-r*.15);g.lineTo(x,y-r*.9);g.lineTo(x+r,y-r*.15);g.fill();g.fillStyle='#fff';g.beginPath();g.moveTo(x-r*.5,y-r*.5);g.lineTo(x,y-r*.9);g.lineTo(x+r*.5,y-r*.5);g.fill();g.fillStyle='#ffe066';g.fillRect(x-r*.15,y+r*.1,r*.3,r*.3)}}
function render(){
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#cfe8ff');gr.addColorStop(1,'#f4faff');g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.strokeStyle='rgba(150,190,230,.35)';g.lineWidth=3;g.lineCap='round';for(let i=0;i<22;i++){const x=(i*97.3)%W,y=H-(((dist*1.1+i*131)%(H+60)));g.beginPath();g.moveTo(x,y);g.lineTo(x+S*.04,y+S*.12);g.stroke()}
 for(let i=0;i<6;i++){const y=H-((dist*1.2+i*H/5)%(H+120))+60;for(const sx of[S*.03,W-S*.03]){g.fillStyle='#2f7d4a';g.beginPath();g.moveTo(sx,y-S*.06);g.lineTo(sx+S*.04,y+S*.02);g.lineTo(sx-S*.04,y+S*.02);g.fill();g.fillStyle='#fff';g.beginPath();g.moveTo(sx,y-S*.06);g.lineTo(sx+S*.015,y-S*.035);g.lineTo(sx-S*.015,y-S*.035);g.fill()}}
 if(state==='title'){g.fillStyle='rgba(25,55,115,.6)';g.fillRect(0,0,W,H);ball(W/2,H*.58+Math.sin(tm*2)*8,Math.min(S*.2,H*.18),tm*2,1);for(let i=0;i<4;i++)obj({k:'t',x:W*(.12+i*.25),y:H*.9-((i*37)%5)*6,r:S*.06,sd:i});titleScr('Kartopu','Yokuş aşağı yuvarlan, büyü, her şeyi parçala!',H*.2);return}
 for(const e of ents){if(e.k==='s'){g.fillStyle='#fff';g.strokeStyle='#bcd8f2';g.lineWidth=2;g.beginPath();g.arc(e.x,e.y,e.r,0,7);g.fill();g.stroke()}else obj(e)}
 const r=rad(m),by=H*.28;if(!(inv>0&&Math.floor(tm*20)%2))ball(bx,by,r,rot,1);drP();
 const z=Math.max(15,Math.min(S*.05,26));T('Skor '+score,12,z+2,z*1.1,'#1d4e89','left');T(mtr()+' m',12,z*2.4,z*.8,'#4a7bb5','left',500);
 const bw=Math.min(S*.35,W*.4),f=Math.min(1,r/(S*.3));g.fillStyle='rgba(0,0,0,.15)';RR(12,z*3.3,bw,10,5);g.fill();g.fillStyle='#5aa9f0';RR(12,z*3.3,Math.max(6,bw*f),10,5);g.fill();T('Boyut',16+bw,z*3.3+5,z*.55,'#4a7bb5','left',500);
 if(mt>0){g.globalAlpha=Math.min(1,mt*2);T(msg,W/2,H*.55,S*.06,'#1d4e89',0,800);g.globalAlpha=1}
 if(state==='over')overScr('Kartopu Eridi!',mtr()+' metre yuvarlandın, '+smash+' engel parçaladın')}
reset();requestAnimationFrame(loop);
</script></body></html>
