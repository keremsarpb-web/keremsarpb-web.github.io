<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hava Hokeyi</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#06182e;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
const BK='ksb-hava-hokeyi-best';
'use strict';
const cv=document.getElementById('c'),g=cv.getContext('2d');let W=1,H=1,T=0;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth||1;H=innerHeight||1;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
let best=0;try{best=+localStorage.getItem(BK)||0}catch(e){}
function saveBest(s){if(s>best){best=s;try{localStorage.setItem(BK,String(s))}catch(e){}return true}return false}
let AC=null,muted=false;
function snd(f,d,t,v,sl){if(muted||!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(sl,n+d);a.gain.setValueAtTime(v||.12,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume()}
const keys={};let onDown=()=>{},onMove=()=>{},onUp=()=>{},onKey=()=>{};
const pp=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{initAudio();const[x,y]=pp(e);if(x>W-46&&y<46){muted=!muted;return}try{cv.setPointerCapture(e.pointerId)}catch(_){}onDown(x,y)});
cv.addEventListener('pointermove',e=>{const[x,y]=pp(e);onMove(x,y)});
cv.addEventListener('pointerup',e=>{const[x,y]=pp(e);onUp(x,y)});
cv.addEventListener('pointercancel',e=>{const[x,y]=pp(e);onUp(x,y)});
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.key==' ')e.preventDefault();initAudio();if(e.key=='m'||e.key=='M'){muted=!muted;return}if(!keys[e.key])onKey(e.key);keys[e.key]=1});
addEventListener('keyup',e=>{keys[e.key]=0});
const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function tx(s,x,y,sz,c,al,w){g.font=(w||'700')+' '+Math.max(6,sz|0)+'px Fredoka,Nunito,system-ui,sans-serif';g.textAlign=al||'center';g.textBaseline='middle';g.fillStyle=c||'#fff';g.fillText(s,x,y)}
function spk(){g.save();g.globalAlpha=.85;g.fillStyle='#fff';const x=W-30,y=22;g.beginPath();g.moveTo(x-8,y-3);g.lineTo(x-4,y-3);g.lineTo(x+1,y-8);g.lineTo(x+1,y+8);g.lineTo(x-4,y+3);g.lineTo(x-8,y+3);g.fill();g.lineWidth=2;if(muted){g.strokeStyle='#f66';g.beginPath();g.moveTo(x+4,y-5);g.lineTo(x+12,y+5);g.moveTo(x+12,y-5);g.lineTo(x+4,y+5);g.stroke()}else{g.strokeStyle='#fff';g.beginPath();g.arc(x+1,y,6,-1,1);g.stroke()}g.restore()}
let S=1,OX=0,OY=0;function fit(a,b){S=Math.min(W/a,H/b);OX=(W-a*S)/2;OY=(H-b*S)/2}
const P2=(x,y)=>[(x-OX)/S,(y-OY)/S];
const PT=[];function burst(x,y,n,c,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=(.3+Math.random())*(sp||200);PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.5,c,r:2+Math.random()*3})}}
function pstep(dt){for(const p of PT){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt}for(let i=PT.length-1;i>=0;i--)if(PT[i].l<=0)PT.splice(i,1)}
function pdraw(){for(const p of PT){g.globalAlpha=cl(p.l*2,0,1);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,6.3);g.fill()}g.globalAlpha=1}
function ttl(n,sub){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,W,H);g.save();g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=24;const fs=Math.min(W*.13,H*.11,110);tx(n,W/2,H*.3,fs,'#fff','center','800');g.shadowBlur=0;tx(sub,W/2,H*.3+fs*.8,Math.min(W*.05,H*.035,28),'#ffe08a','center','600');g.globalAlpha=.6+.4*Math.sin(T*4);tx('Başlamak için dokun / tıkla',W/2,H*.8,Math.min(W*.055,H*.04,30),'#fff');g.globalAlpha=1;if(best)tx('En iyi: '+best,W/2,H*.87,Math.min(W*.045,H*.03,22),'#ccc','center','600');g.restore()}
function ovr(a,b,c){g.fillStyle='rgba(0,0,0,.62)';g.fillRect(0,0,W,H);tx(a,W/2,H*.3,Math.min(W*.12,H*.09,90),'#fff','center','800');tx(b,W/2,H*.42,Math.min(W*.06,H*.04,34),'#ffe08a');if(c)tx(c,W/2,H*.5,Math.min(W*.05,H*.035,28),'#ccc','center','600');g.globalAlpha=.6+.4*Math.sin(T*4);tx('Tekrar için dokun / tıkla',W/2,H*.72,Math.min(W*.055,H*.04,30),'#fff');g.globalAlpha=1}
let last=performance.now(),UP=()=>{},DR=()=>{};
function loop(t){requestAnimationFrame(loop);const dt=cl((t-last)/1000,0,.033);last=t;if(document.hidden)return;T+=dt;UP(dt);DR();spk()}
document.addEventListener('visibilitychange',()=>{last=performance.now()});
requestAnimationFrame(loop);
const PR=15,MR=30,X0=20,X1=380,Y0=30,Y1=670,G0=130,G1=270;
let st='title',pu,pl,ai,ps=0,as=0,tgt=[200,600],ph='serve',mt=1,flash=0,shk=0,msg='',trail=[],overT=0;
function mk(x,y){return{x,y,vx:0,vy:0}}
function serve(dir){pu=mk(200,350);pu.vy=0;pl=mk(200,600);ai=mk(200,100);ph='serve';mt=1;trail=[];pu.dir=dir}
function start(){ps=0;as=0;st='play';serve(0)}
function move(m,tx,ty,vm,dt,y0,y1){let dx=tx-m.x,dy=ty-m.y,d=Math.hypot(dx,dy),s=Math.min(d,vm*dt);const ox=m.x,oy=m.y;if(d>.01){m.x+=dx/d*s;m.y+=dy/d*s}m.x=cl(m.x,X0+MR,X1-MR);m.y=cl(m.y,y0,y1);m.vx=(m.x-ox)/dt;m.vy=(m.y-oy)/dt}
function hitM(m){const dx=pu.x-m.x,dy=pu.y-m.y,d=Math.hypot(dx,dy),r=PR+MR;if(d>=r||d==0)return;const nx=dx/d,ny=dy/d;pu.x=m.x+nx*r;pu.y=m.y+ny*r;const vr=(pu.vx-m.vx)*nx+(pu.vy-m.vy)*ny;if(vr<0){pu.vx-=1.9*vr*nx;pu.vy-=1.9*vr*ny;const sp=Math.hypot(pu.vx,pu.vy);if(sp>1100){pu.vx*=1100/sp;pu.vy*=1100/sp}snd(250+Math.min(sp,900)*.4,.07,'square',.1);burst(pu.x,pu.y,5,'#8ff',120);shk=Math.max(shk,Math.min(sp/150,5))}}
function goal(w){if(w){ps++;msg='GOL!'}else{as++;msg='Gol yedin'}flash=1;shk=12;burst(pu.x,pu.y<350?30:670,40,w?'#4f8':'#f64',300);snd(w?660:200,.4,'sawtooth',.15,w?990:90);
 if(ps>=7||as>=7){st='over';overT=0;if(ps>as)saveBest(7-as);snd(ps>as?700:200,.6,'triangle',.2)}else{ph='goal';mt=1.2;pu.vx=pu.vy=0;pu.dir=w?1:-1}}
UP=dt=>{pstep(dt);shk=Math.max(0,shk-dt*25);flash=Math.max(0,flash-dt*2);overT+=dt;if(st=='title'){pu.x=200+Math.sin(T*2)*80;pu.y=350+Math.cos(T*3)*60;ai.x=200+Math.sin(T)*60;ai.y=100;pl.x=200+Math.cos(T*1.3)*70;pl.y=600;return}if(st!='play')return;
 const sp=(keys.ArrowLeft?-1:0)+(keys.ArrowRight?1:0),spy=(keys.ArrowUp?-1:0)+(keys.ArrowDown?1:0);if(sp||spy||keys.a||keys.d||keys.w||keys.s){tgt[0]=cl(tgt[0]+(sp+(keys.d?1:0)-(keys.a?1:0))*600*dt,X0+MR,X1-MR);tgt[1]=cl(tgt[1]+(spy+(keys.s?1:0)-(keys.w?1:0))*600*dt,370,Y1-MR)}
 move(pl,tgt[0],tgt[1],1800,dt,370,Y1-MR);
 if(ph!='play'){mt-=dt;move(ai,200,100,300,dt,Y0+MR,330);if(mt<=0){if(ph=='goal')serve(pu.dir);else{ph='play';pu.vy=pu.dir>0?-1:pu.dir<0?1:0;pu.vy*=150}}if(ph!='play')return}
 const lv=cl(.35+(as-ps)*.05+(ps+as)*.03,.3,.85),vm=330+lv*420;
 if(pu.y<360){if(ai.y<pu.y-8){const d=Math.hypot(200-pu.x,700-pu.y)||1;move(ai,pu.x+(200-pu.x)/d*14+rnd(-2,2),pu.y+(700-pu.y)/d*14,vm*1.15,dt,Y0+MR,330)}else move(ai,pu.x+(pu.x<200?-40:40),pu.y-45,vm,dt,Y0+MR,330)}
 else move(ai,cl(200+(pu.x-200)*.55,110,290),85,vm*.8,dt,Y0+MR,330);
 const n=Math.ceil(Math.hypot(pu.vx,pu.vy)*dt/10)||1,h=dt/n;
 for(let i=0;i<n;i++){pu.x+=pu.vx*h;pu.y+=pu.vy*h;hitM(pl);hitM(ai);
  const inG=pu.x>G0&&pu.x<G1;
  if(pu.x<X0+PR){pu.x=X0+PR;pu.vx=Math.abs(pu.vx)*.95;snd(160,.04,'sine',.06)}if(pu.x>X1-PR){pu.x=X1-PR;pu.vx=-Math.abs(pu.vx)*.95;snd(160,.04,'sine',.06)}
  if(!inG){if(pu.y<Y0+PR){pu.y=Y0+PR;pu.vy=Math.abs(pu.vy)*.95}if(pu.y>Y1-PR){pu.y=Y1-PR;pu.vy=-Math.abs(pu.vy)*.95}}
  else if(pu.y<Y0||pu.y>Y1){if(pu.y<Y0-8){goal(true);return}if(pu.y>Y1+8){goal(false);return}if(pu.x<G0+PR){pu.x=G0+PR;pu.vx=Math.abs(pu.vx)}if(pu.x>G1-PR){pu.x=G1-PR;pu.vx=-Math.abs(pu.vx)}}}
 const f=Math.exp(-.25*dt);pu.vx*=f;pu.vy*=f;trail.push([pu.x,pu.y]);if(trail.length>10)trail.shift()};
onDown=(x,y)=>{if(st=='title'){start();return}if(st=='over'){if(overT>.5)start();return}onMove(x,y)};
onMove=(x,y)=>{if(st!='play')return;const[a,b]=P2(x,y);tgt=[cl(a,X0+MR,X1-MR),cl(b-30/S*0,370,Y1-MR)]};
onKey=k=>{if(st=='title')start();else if(st=='over'&&overT>.5)start()};
function mallet(m,c1,c2){g.save();g.shadowColor=c1;g.shadowBlur=18;g.fillStyle=c1;g.beginPath();g.arc(m.x,m.y,MR,0,6.3);g.fill();g.shadowBlur=0;g.fillStyle=c2;g.beginPath();g.arc(m.x,m.y,MR*.6,0,6.3);g.fill();g.fillStyle=c1;g.beginPath();g.arc(m.x,m.y,MR*.28,0,6.3);g.fill();g.restore()}
DR=()=>{g.fillStyle='#050a1a';g.fillRect(0,0,W,H);fit(400,700);g.save();g.translate(OX+(shk?rnd(-shk,shk):0),OY);g.scale(S,S);
 const gr=g.createLinearGradient(0,Y0,0,Y1);gr.addColorStop(0,'#0b2a52');gr.addColorStop(.5,'#0e3b6e');gr.addColorStop(1,'#0b2a52');g.fillStyle=gr;g.beginPath();g.roundRect(X0,Y0,X1-X0,Y1-Y0,18);g.fill();
 g.strokeStyle='#4df';g.shadowColor='#4df';g.shadowBlur=12;g.lineWidth=4;g.beginPath();g.moveTo(G0,Y0);g.lineTo(X0+18,Y0);g.arcTo(X0,Y0,X0,Y0+18,18);g.lineTo(X0,Y1-18);g.arcTo(X0,Y1,X0+18,Y1,18);g.lineTo(G0,Y1);g.moveTo(G1,Y0);g.lineTo(X1-18,Y0);g.arcTo(X1,Y0,X1,Y0+18,18);g.lineTo(X1,Y1-18);g.arcTo(X1,Y1,X1-18,Y1,18);g.lineTo(G1,Y1);g.stroke();
 g.lineWidth=2;g.globalAlpha=.6;g.beginPath();g.moveTo(X0,350);g.lineTo(X1,350);g.moveTo(236,350);g.arc(200,350,36,0,6.3);g.arc(200,Y0,70,0,3.15);g.moveTo(270,Y1);g.arc(200,Y1,70,0,-3.15,true);g.stroke();g.globalAlpha=1;g.shadowBlur=0;
 g.fillStyle='#f64';g.fillRect(G0,Y0-8,G1-G0,6);g.fillStyle='#4f8';g.fillRect(G0,Y1+2,G1-G0,6);
 if(st!='title'){tx(String(as),60,300,70,'#ffffff22','center','800');tx(String(ps),60,400,70,'#ffffff22','center','800')}
 for(let i=0;i<trail.length;i++){g.globalAlpha=i/trail.length*.4;g.fillStyle='#ff8';g.beginPath();g.arc(trail[i][0],trail[i][1],PR*i/trail.length,0,6.3);g.fill()}g.globalAlpha=1;
 g.fillStyle='#ffe';g.shadowColor='#ff6';g.shadowBlur=14;g.beginPath();g.arc(pu.x,pu.y,PR,0,6.3);g.fill();g.shadowBlur=0;g.fillStyle='#c93';g.beginPath();g.arc(pu.x,pu.y,PR*.5,0,6.3);g.fill();
 mallet(ai,'#ff5a4d','#a22');mallet(pl,'#3de0ff','#16a');pdraw();
 if(flash>0){g.fillStyle='rgba(255,255,255,'+flash*.3+')';g.fillRect(0,0,400,700)}
 if(st=='play'){tx('İLK 7 GOL',200,14,13,'#9bd','center','600');if(ph=='goal')tx(msg,200,350,60,'#fff','center','800');if(ph=='serve'&&mt>0)tx('Hazır!',200,350,36,'#fff')}
 g.restore();if(st=='title')ttl('Hava Hokeyi','Yapay zekaya karşı · ilk 7 gol');
 if(st=='over')ovr(ps>as?'KAZANDIN!':'KAYBETTİN',ps+' - '+as,'En iyi fark: '+best)};
serve(0);

</script></body></html>
