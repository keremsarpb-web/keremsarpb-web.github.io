<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Yol Geçidi - KSB Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100vw;height:100vh;touch-action:none}</style></head><body><canvas id="c"></canvas>
<script>
const ID='yol-gecidi',cv=document.getElementById('c'),g=cv.getContext('2d'),keys={},ptrs=new Set(),rnd=Math.random,rr=(a,b)=>a+rnd()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let W=1,H=1,DPR=1,best=0,state='title',last=0,T=0,overT=0,shk=0,parts=[],muted=false,AC,score=0,touchMode=false;
try{best=+localStorage.getItem('ksb-'+ID+'-best')||0}catch(e){}
try{touchMode=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window}catch(e){}
function rs(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);if(window.onRs)onRs()}
addEventListener('resize',rs);
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
function snd(f,d,t,v,f2){if(muted||!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),k=AC.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);k.gain.setValueAtTime(v||.06,n);k.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(k);k.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function tx(s,x,y,z,c,a,w){g.font=(w||700)+' '+z+'px Fredoka,system-ui,sans-serif';g.textAlign=a||'center';g.textBaseline='middle';g.fillStyle=c||'#fff';g.fillText(s,x,y,W*.94)}
function rrect(x,y,w,h,r){g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,r);else g.rect(x,y,w,h)}
function burst(x,y,c,n,sp){n=n||12;sp=sp||200;for(let i=0;i<n;i++){const a=rnd()*6.283,s=rnd()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.4+rnd()*.5,m:.9,c})}}
function setBest(){if(score>best){best=score;try{localStorage.setItem('ksb-'+ID+'-best',best)}catch(e){}}}
function die(){if(state=='over')return;state='over';overT=T;setBest()}
function zs(){return Math.max(14,Math.min(W*.05,H*.034,26))}
function ttl(name,acc,l1,l2){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,W,H);const w=name.split(' '),z=Math.min(W*(w.length>1?.19:.15),H*.11,120),y0=H*.3-(w.length>1?z*.55:0),q=zs();
g.save();g.shadowColor=acc;g.shadowBlur=24;w.forEach((s,i)=>tx(s,W/2,y0+i*z*1.08,z,i?acc:'#fff'));g.restore();
tx(l1,W/2,H*.5,q,'#fff',0,500);if(l2)tx(l2,W/2,H*.5+q*1.5,q,'#fff',0,500);
g.globalAlpha=.65+.35*Math.sin(T*4);tx('Başlamak için dokun / tıkla',W/2,H*.72,q*1.25,acc);g.globalAlpha=1;if(best)tx('En yüksek: '+best,W/2,H*.72+q*2.3,q,'#fff',0,500)}
function ovr(acc,l){g.fillStyle='rgba(0,0,0,.62)';g.fillRect(0,0,W,H);const z=Math.min(W*.14,H*.1,84),q=zs();g.save();g.shadowColor=acc;g.shadowBlur=22;tx('OYUN BİTTİ',W/2,H*.3,z,acc);g.restore();
tx(l||('Skor: '+score),W/2,H*.43,q*1.6);tx('En yüksek: '+best,W/2,H*.43+q*2,q,'#fff',0,500);g.globalAlpha=.65+.35*Math.sin(T*4);tx('Tekrar için dokun / tıkla',W/2,H*.64,q*1.25,acc);g.globalAlpha=1}
function spk(){g.save();g.globalAlpha=.8;g.fillStyle=g.strokeStyle='#fff';g.lineWidth=2;const x=W-30,y=24;g.beginPath();g.moveTo(x-8,y-4);g.lineTo(x-3,y-4);g.lineTo(x+3,y-9);g.lineTo(x+3,y+9);g.lineTo(x-3,y+4);g.lineTo(x-8,y+4);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(x+7,y-5);g.lineTo(x+15,y+5);g.moveTo(x+15,y-5);g.lineTo(x+7,y+5)}else g.arc(x+3,y,8,-1,1);g.stroke();g.restore()}
function begin(){ptrs.clear();reset();state='play'}
function pxy(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/(r.width||W),(e.clientY-r.top)*H/(r.height||H)]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();if(e.pointerType=='touch')touchMode=true;const[x,y]=pxy(e);if(x>W-46&&y<46){muted=!muted;return}
if(state!='play'){if(state=='title'||T-overT>.5)begin();return}
ptrs.add(e.pointerId);try{cv.setPointerCapture(e.pointerId)}catch(_){}if(window.gDown)gDown(x,y,e)});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;e.preventDefault();const[x,y]=pxy(e);if(window.gMove)gMove(x,y,e)});
const pu=e=>{if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);const[x,y]=pxy(e);if(window.gUp)gUp(x,y,e)};
cv.addEventListener('pointerup',pu);cv.addEventListener('pointercancel',pu);cv.addEventListener('contextmenu',e=>e.preventDefault());
const NAV=['Space','Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
addEventListener('keydown',e=>{ac();if(e.code=='KeyM'){if(!e.repeat)muted=!muted;return}if(NAV.includes(e.code))e.preventDefault();
if(state!='play'){if(!e.repeat&&NAV.includes(e.code)&&(state=='title'||T-overT>.5))begin();return}
keys[e.code]=1;if(!e.repeat&&window.gKey)gKey(e.code)});
addEventListener('keyup',e=>{keys[e.code]=0});
document.addEventListener('visibilitychange',()=>{try{if(AC)document.hidden?AC.suspend():AC.resume()}catch(e){}});
function loop(t){requestAnimationFrame(loop);if(document.hidden){last=t;return}const dt=Math.min((t-last)/1000||0,.05);last=t;T+=dt;g.setTransform(DPR,0,0,DPR,0,0);g.save();
if(shk>.3){shk*=Math.pow(.01,dt);g.translate((rnd()-.5)*shk,(rnd()-.5)*shk)}else shk=0;
frame(dt);for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);for(const p of parts){g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;g.fillRect(p.x-2,p.y-2,4,4)}g.globalAlpha=1;g.restore();spk()}
function boot(){rs();requestAnimationFrame(t=>{last=t;loop(t)})}

const COLS=9,CARC=['#ff5d5d','#ffd23f','#4dd2ff','#b36bff','#ff9f43','#ffffff'],GR={t:'g',n:1,o:[],tr:[]};
let rows,genTo,px,pr,ht,hf,tg,buf,camR,maxR,idle,s,ox,qx,qy,fired,dead,dd,kind,bump;
function onRs(){s=Math.min(W/COLS,H/10);ox=(W-COLS*s)/2}
function getRow(r){return rows[r]||GR}
function ensure(r){while(genTo<r)mk(++genTo)}
function mk(r){const p=rows[r-1];let t=rnd();t=t<.3?'g':t<.65?'r':'w';if(r<3)t='g';else{if(p.t==t&&p.n>=3)t='g';if(t=='g'&&p.t=='g'&&p.n>=2)t=rnd()<.5?'r':'w'}
const w={t,n:p.t==t?p.n+1:1,dir:rnd()<.5?-1:1,o:[],tr:[]},L=18,df=Math.min(r/60,1);
if(t=='g'){if(r>=3)for(let c=0;c<COLS;c++)if(rnd()<.14)w.tr.push(c)}
else if(t=='r'){w.v=1.5+rnd()*1.5+df*2.2;const n=3+(rnd()<.5?1:0);for(let i=0;i<n;i++)w.o.push({x:-4.5+i*L/n+rnd()*1.2,w:rnd()<.25?2:1.2,c:CARC[rnd()*6|0]})}
else{w.v=.9+rnd()*1.1+df*1.2;const n=3+(rnd()<.4?1:0);for(let i=0;i<n;i++)w.o.push({x:-4.5+i*L/n+rnd()*.8,w:2+(rnd()<.5?1:0)})}
rows[r]=w}
function updRows(dt){for(let r=Math.floor(camR)-6;r<camR+14;r++){const w=getRow(r);for(const o of w.o){o.x+=w.dir*w.v*dt;if(w.dir>0&&o.x>13.5)o.x-=18;if(w.dir<0&&o.x<-4.5)o.x+=18}}}
function reset(){rows=[{t:'g',n:1,o:[],tr:[]}];genTo=0;ensure(16);px=4;pr=0;ht=-1;buf=null;camR=1;maxR=0;idle=0;dead=false;score=0;bump=0}
function hop(dx,dr){if(dead)return;if(ht>=0){buf=[dx,dr];return}const nr=pr+dr,nx=Math.round(px)+dx;if(nx<0||nx>=COLS||nr<Math.floor(camR)-3)return;ensure(nr+14);
if(getRow(nr).t=='g'&&getRow(nr).tr.includes(nx)){bump=.15;snd(120,.08,'square',.05);return}
hf={x:px,r:pr};tg={x:dr?px:nx,r:nr};ht=0;idle=0;snd(380,.1,'sine',.07,620)}
function kill(k){if(dead)return;dead=true;dd=.55;kind=k;shk=12;const x=ox+(px+.5)*s,y=H*.7-(pr-camR)*s;
if(k=='w'){burst(x,y,'#bfe6ff',26,220);snd(300,.4,'sawtooth',.07,60)}else{burst(x,y,'#fff',22,240);burst(x,y,'#ff5d5d',8,200);snd(200,.3,'square',.09,50)}}
function upd(dt){if(dead){dd-=dt;if(dd<=0)die();return}idle+=dt;if(bump>0)bump-=dt;
if(ht>=0){ht+=dt/.13;if(ht>=1){pr=tg.r;px=tg.x;ht=-1;const w=getRow(pr);if(w.t!='w')px=Math.round(px);else if(!log(w,px))kill('w');
if(pr>maxR){maxR=pr;score=maxR;snd(700,.05,'triangle',.04)}if(buf&&!dead){const b=buf;buf=null;hop(b[0],b[1])}}}
const cr=ht>=0&&ht>.5?tg.r:pr,w=getRow(cr),ex=ht>=0?hf.x+(tg.x-hf.x)*ht:px;
if(ht<0&&w.t=='w'&&!dead){const l=log(w,px);if(!l)kill('w');else{px+=w.dir*w.v*dt;if(px<-.4||px>COLS-.6)kill('e')}}
if(w.t=='r'&&!dead)for(const o of w.o)if(o.x<ex+.8&&o.x+o.w>ex+.2)kill('c');
camR+=(maxR+1-camR)*Math.min(1,dt*5);if(pr<camR-4.3||idle>8.5)kill('e')}
function log(w,x){for(const o of w.o)if(x+.5>o.x-.05&&x+.5<o.x+o.w+.05)return o;return null}
function drawRow(r){const w=getRow(r),y=H*.7-(r-camR)*s;if(y<-s||y>H+s)return;const p=getRow(r-1);
if(w.t=='g'){g.fillStyle=r%2?'#79c84c':'#6cbb40';g.fillRect(0,y-s/2,W,s+1);for(const c of w.tr){const x=ox+(c+.5)*s;g.fillStyle='#5a3b22';g.fillRect(x-s*.06,y-s*.05,s*.12,s*.3);g.fillStyle='#2f8f3a';g.beginPath();g.arc(x,y-s*.12,s*.32,0,6.3);g.fill();g.fillStyle='#3fae4a';g.beginPath();g.arc(x-s*.08,y-s*.2,s*.2,0,6.3);g.fill()}}
else if(w.t=='r'){g.fillStyle='#474b59';g.fillRect(0,y-s/2,W,s+1);g.fillStyle='rgba(255,255,255,.3)';if(p.t=='r')for(let x=-(T*0)%1;x<W;x+=s*1.2)g.fillRect(x,y-s/2-1.5,s*.6,3);
for(const o of w.o){const X=ox+o.x*s,cw=o.w*s-4;g.fillStyle=o.c;rrect(X+2,y-s*.34,cw,s*.68,s*.16);g.fill();g.fillStyle='rgba(20,30,50,.7)';const f=w.dir>0?X+2+cw*.62:X+2+cw*.1;g.fillRect(f,y-s*.26,cw*.28,s*.52);g.fillStyle='#ffe98a';g.fillRect(w.dir>0?X+cw-1:X+2,y-s*.28,3,s*.14);g.fillRect(w.dir>0?X+cw-1:X+2,y+s*.14,3,s*.14)}}
else{g.fillStyle='#2f9bef';g.fillRect(0,y-s/2,W,s+1);g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=2;g.beginPath();for(let x=(r%3)*s*.4;x<W;x+=s*1.3){const yy=y+Math.sin(T*2+x*.05+r)*s*.12;g.moveTo(x,yy);g.lineTo(x+s*.4,yy)}g.stroke();
for(const o of w.o){const X=ox+o.x*s;g.fillStyle='#9c6234';rrect(X,y-s*.34,o.w*s,s*.68,s*.3);g.fill();g.fillStyle='#b97c46';rrect(X+3,y-s*.28,o.w*s-6,s*.2,s*.1);g.fill();g.strokeStyle='#6e4322';g.lineWidth=2;for(let k=1;k<o.w;k++){g.beginPath();g.arc(X+k*s,y,s*.12,0,6.3);g.stroke()}}}}
function chick(cx,cy,sq,hh){g.save();g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(cx,cy+s*.22,s*.28*(1-hh*.4),s*.1,0,0,6.3);g.fill();g.translate(cx,cy-hh*s);g.scale(1,sq);
g.fillStyle='#fff';g.beginPath();g.ellipse(0,0,s*.3,s*.28,0,0,6.3);g.fill();g.fillStyle='#e8eef5';g.beginPath();g.ellipse(-s*.2,s*.04,s*.1,s*.16,.3,0,6.3);g.fill();g.beginPath();g.ellipse(s*.2,s*.04,s*.1,s*.16,-.3,0,6.3);g.fill();
g.fillStyle='#e5383b';for(const k of[-1,0,1]){g.beginPath();g.arc(k*s*.09,-s*.3+Math.abs(k)*s*.03,s*.07,0,6.3);g.fill()}
g.fillStyle='#ff9f1c';g.beginPath();g.moveTo(-s*.07,-s*.06);g.lineTo(s*.07,-s*.06);g.lineTo(0,s*.06);g.fill();g.fillStyle='#111';for(const k of[-1,1]){g.beginPath();g.arc(k*s*.13,-s*.14,s*.04,0,6.3);g.fill()}g.restore()}
function draw(){g.fillStyle='#10201a';g.fillRect(0,0,W,H);for(let r=Math.ceil(camR+H*.7/s+1);r>=Math.floor(camR-H*.3/s-2);r--)drawRow(r);
if(ox>1){g.fillStyle='#0b1410';g.fillRect(0,0,ox,H);g.fillRect(ox+COLS*s,0,ox+1,H)}
if(state!='title'){let cx,cy,sq=1,hh=0;if(ht>=0){const e=ht;cx=ox+(hf.x+(tg.x-hf.x)*e+.5)*s;cy=H*.7-(hf.r+(tg.r-hf.r)*e-camR)*s;hh=Math.sin(e*Math.PI)*.4;sq=1+Math.sin(e*Math.PI)*.1}else{cx=ox+(px+.5)*s;cy=H*.7-(pr-camR)*s}
if(bump>0)cy-=Math.sin(bump*20)*s*.08;if(dead){if(kind=='c')sq=.3;else sq=0}if(sq>0)chick(cx,cy,sq,hh);
if(idle>5&&!dead){g.fillStyle='rgba(255,40,40,'+(.12+.1*Math.sin(T*12))+')';g.fillRect(0,0,W,H);tx('Hadi, ilerle!',W/2,H*.25,Math.min(40,W*.1),'#ff6b6b')}
tx(String(score),W/2,50,Math.min(64,W*.16),'#fff');tx('En yüksek '+best,14,26,16,'#ffffffbb','left')}}
function gDown(x,y){qx=x;qy=y;fired=false}
function gMove(x,y){if(fired)return;const dx=x-qx,dy=y-qy;if(Math.hypot(dx,dy)>26){fired=true;if(Math.abs(dx)>Math.abs(dy))hop(Math.sign(dx),0);else hop(0,dy<0?1:-1)}}
function gUp(){if(!fired)hop(0,1)}
function gKey(c){const m={ArrowUp:[0,1],KeyW:[0,1],Space:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0],ArrowDown:[0,-1],KeyS:[0,-1]}[c];if(m)hop(m[0],m[1])}
function frame(dt){if(state=='title'){camR+=dt*1.2;ensure(camR+16);updRows(dt)}else{if(state=='play')upd(dt);else updRows(dt*.3);ensure(camR+16);if(state=='play')updRows(dt)}draw();
if(state=='title'){chick(W/2,H*.7+Math.abs(Math.sin(T*3))*-s*.4,1,0);ttl('Yol Geçidi','#ffd23f','Yollardan ve nehirlerden geç','Dokun: ileri · Kaydır: yön')}else if(state=='over')ovr('#ff6b6b')}
rs();reset();boot();
</script></body></html>
