<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Köstebek Vur – KSB Games</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const ID='kostebek',NAME='Köstebek Vur',SUB='60 saniyede en çok köstebeği vur',COL='#ffc61a';
const cv=document.getElementById('c'),g=cv.getContext('2d');let W=0,H=0;
function rs(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
let best=0,muted=false,AC=null,state='title',score=0,shake=0,T=0,st=0,parts=[],omsg='',ohead='Oyun Bitti',fmt=v=>Math.floor(v);
try{best=+localStorage.getItem('ksb-'+ID+'-best')||0}catch(e){}
function end(m,h){saveBest();state='over';st=0;omsg=m||'';ohead=h||'Oyun Bitti'}
function saveBest(){score=Math.floor(score);if(score>best){best=score;try{localStorage.setItem('ksb-'+ID+'-best',String(best))}catch(e){}}}
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}}
function snd(f,d=.1,ty='square',v=.05,s=0){if(muted||!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+s),n+d);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function burst(x,y,c,n=10,sp=150){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.4+Math.random()*.4,c,r:2+Math.random()*3})}}
function updParts(dt){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.l-=dt}parts=parts.filter(p=>p.l>0)}
function drawParts(){for(const p of parts){g.globalAlpha=Math.min(1,p.l*2);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.fill()}g.globalAlpha=1}
function txt(s,x,y,sz,c='#fff',al='center'){g.font='900 '+sz+'px "Trebuchet MS",Arial,sans-serif';g.textAlign=al;g.textBaseline='middle';g.fillStyle=c;g.fillText(s,x,y)}
function icon(){g.save();g.translate(W-28,28);g.globalAlpha=.85;g.fillStyle=g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.moveTo(-9,-4);g.lineTo(-4,-4);g.lineTo(2,-9);g.lineTo(2,9);g.lineTo(-4,4);g.lineTo(-9,4);g.closePath();g.fill();g.beginPath();if(muted){g.moveTo(6,-5);g.lineTo(14,5);g.moveTo(14,-5);g.lineTo(6,5)}else{g.arc(3,0,6,-1,1);g.moveTo(3+11*Math.cos(-1),11*Math.sin(-1));g.arc(3,0,11,-1,1)}g.stroke();g.restore()}
function title(){g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,0,W,H);const ws=NAME.split(' '),port=W<H*.85,ls=port?ws:[NAME];let sz=Math.min(port?W*.2:W*.08,H*.13);const fit=()=>g.font='900 '+sz+'px "Trebuchet MS",Arial';fit();while(Math.max(...ls.map(l=>g.measureText(l).width))>W*.9){sz*=.92;fit()}const y0=H*.32-(ls.length-1)*sz*.55;g.shadowColor=COL;g.shadowBlur=30;ls.forEach((l,i)=>txt(l,W/2,y0+i*sz*1.1,sz));g.shadowBlur=0;const ss=Math.min(W*.05,26);txt(SUB,W/2,y0+ls.length*sz*1.1+ss*.4,ss,COL);g.globalAlpha=.65+.35*Math.sin(T*4);txt('Başlamak için dokun / tıkla',W/2,H*.7,Math.min(W*.065,30));g.globalAlpha=1;if(best)txt('En iyi: '+fmt(best),W/2,H*.78,Math.min(W*.05,22),COL);icon()}
function over(){g.fillStyle='rgba(0,0,0,.62)';g.fillRect(0,0,W,H);const u=Math.min(W,H*.8);txt(ohead,W/2,H*.28,Math.min(u*.14,70));if(omsg)txt(omsg,W/2,H*.37,Math.min(u*.055,26),'#ccc');txt(fmt(score),W/2,H*.47,Math.min(u*.18,90),COL);txt(score>=best&&score>0?'Yeni rekor!':'En iyi: '+fmt(best),W/2,H*.57,Math.min(u*.06,28),'#ffd54a');if(st>.7){g.globalAlpha=.65+.35*Math.sin(T*4);txt('Tekrar için dokun / tıkla',W/2,H*.7,Math.min(u*.06,28));g.globalAlpha=1}icon()}
const P={x:0,y:0,down:false},keys={};
function pos(e){const r=cv.getBoundingClientRect();P.x=e.clientX-r.left;P.y=e.clientY-r.top}
function gate(){if(state=='title'&&st>.15){start();return true}if(state=='over'&&st>.7){start();return true}return state!='play'}
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();pos(e);if(P.x>W-56&&P.y<56){muted=!muted;return}if(gate())return;P.down=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}typeof onDown=='function'&&onDown()});
cv.addEventListener('pointermove',e=>{pos(e);typeof onMove=='function'&&onMove()});
const pu=()=>{if(P.down){P.down=false;typeof onUp=='function'&&onUp()}};
addEventListener('pointerup',pu);addEventListener('pointercancel',pu);
addEventListener('keydown',e=>{ac();const k=e.key;if(k.startsWith('Arrow')||k==' ')e.preventDefault();if(k=='m'||k=='M'){muted=!muted;return}if(state!='play'){if(k==' '||k=='Enter')gate();return}if(!keys[k])typeof onKey=='function'&&onKey(k);keys[k]=1});
addEventListener('keyup',e=>keys[e.key]=0);cv.addEventListener('contextmenu',e=>e.preventDefault());
let last=performance.now();
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.033,(t-last)/1000||0);last=t;if(document.hidden)return;T+=dt;st+=dt;if(state=='play')upd(dt);updParts(dt);g.save();if(shake>.1){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=Math.pow(.02,dt)}else shake=0;draw();g.restore();if(state=='title')title();else if(state=='over')over()}
requestAnimationFrame(loop);
/* ---- oyun ---- */
let hs=[],tl,el,spT,fts=[],hm={x:0,y:0,t:9},streak=0,hits=0;
function lay(){const port=W<H*.85,cols=port?3:4,rows=port?4:3,top=84,cell=Math.min((W-24)/cols,(H-top-24)/rows),gx=(W-cell*cols)/2,gy=top+(H-top-cell*rows)/2;return{cols,rows,cell,gx,gy,n:cols*rows}}
function hp(i,L){return[L.gx+(i%L.cols+.5)*L.cell,L.gy+(Math.floor(i/L.cols)+.62)*L.cell]}
function start(){const L=lay();hs=Array.from({length:L.n},()=>({s:0,t:0,d:0,ty:0,hit:0}));tl=60;el=0;spT=.5;fts=[];streak=0;hits=0;score=0;parts=[];hm.t=9;state='play';st=0}
function prog(h){return h.s==1?Math.min(1,h.t/.12):h.s==2?1:h.s==3?Math.max(0,1-h.t/(h.hit?.28:.12)):0}
function whack(i){const L=lay(),h=hs[i],[x,y]=hp(i,L);if(!h||h.s==0||h.s==3||h.hit)return false;h.hit=1;h.s=3;h.t=0;
 if(h.ty==2){score=Math.max(0,score-30);tl-=3;streak=0;shake=22;burst(x,y-L.cell*.2,'#ff6a1a',26,300);burst(x,y-L.cell*.2,'#333',14,200);fts.push({x,y:y-L.cell*.5,s:'-30  -3 sn',c:'#ff6a6a',l:1});snd(90,.5,'sawtooth',.12,-50)}
 else{streak++;const b=h.ty==1?50:10+Math.min(streak,10);score+=b;hits++;if(h.ty==1){tl+=2;burst(x,y-L.cell*.2,'#ffe066',22,260)}else burst(x,y-L.cell*.2,'#b07a45',10,180);fts.push({x,y:y-L.cell*.5,s:'+'+b+(h.ty?' +2sn':''),c:h.ty?'#ffe066':'#fff',l:.9});snd(h.ty?900:330,.12,h.ty?'triangle':'square',.07,h.ty?500:-100)}
 return true}
function onDown(){const L=lay();hm={x:P.x,y:P.y,t:0};let ok=false;for(let i=0;i<hs.length&&!ok;i++){const h=hs[i];if(h.s==0||h.s==3||h.hit||prog(h)<.3)continue;const[x,y]=hp(i,L);if(Math.hypot(P.x-x,P.y-(y-L.cell*.2))<L.cell*.42)ok=whack(i)}if(!ok){streak=0;snd(120,.06,'square',.03)}}
function onKey(k){const i=k=='0'?9:+k-1;if(i>=0&&i<hs.length){const L=lay(),[x,y]=hp(i,L);hm={x,y:y-L.cell*.2,t:0};if(!whack(i))streak=0}}
function upd(dt){
 el+=dt;tl-=dt;hm.t+=dt;spT-=dt;
 if(spT<=0){const fr=hs.map((h,i)=>h.s==0?i:-1).filter(i=>i>=0);if(fr.length){const h=hs[fr[Math.random()*fr.length|0]],r=Math.random();h.s=1;h.t=0;h.hit=0;h.ty=r<.14?2:r<.23?1:0;h.d=Math.max(.5,1.25-el*.012)*(.7+Math.random()*.6)*(h.ty==1?.75:1)}spT=Math.max(.25,.75-el*.008)*(.6+Math.random()*.8)}
 for(const h of hs){if(h.s==0)continue;h.t+=dt;if(h.s==1&&h.t>=.12){h.s=2;h.t=0}else if(h.s==2&&h.t>=h.d){h.s=3;h.t=0}else if(h.s==3&&h.t>=(h.hit?.28:.12)){h.s=0}}
 for(const f of fts){f.l-=dt;f.y-=50*dt}fts=fts.filter(f=>f.l>0);
 if(tl<=0){tl=0;snd(500,.5,'triangle',.08,-300);end(hits+' köstebek vurdun')}
}
function mole(cx,hy,L,p,h){
 const r=L.cell*.3;g.save();g.beginPath();g.rect(cx-L.cell/2,hy-L.cell*1.3,L.cell,L.cell*1.3);g.clip();
 const by=hy-r*.2+(1-p)*r*2.3;
 if(h.ty==2){g.fillStyle='#222';g.beginPath();g.arc(cx,by,r*.95,0,6.283);g.fill();g.fillStyle='#e74c3c';g.fillRect(cx-r*.95,by-r*.1,r*1.9,r*.22);g.fillStyle='#333';g.fillRect(cx-r*.15,by-r*1.35,r*.3,r*.45);g.fillStyle=Math.floor(T*14)%2?'#ffe066':'#ff6a1a';g.beginPath();g.arc(cx+r*.05,by-r*1.4,r*.2,0,6.283);g.fill();g.fillStyle='#fff';g.fillRect(cx-r*.5,by-r*.6,r*.3,r*.18)}
 else{g.fillStyle=h.ty?'#ffc61a':'#8b5a2b';if(h.ty){g.shadowColor='#ffe066';g.shadowBlur=18}g.beginPath();g.ellipse(cx,by,r,r*1.2,0,0,6.283);g.fill();g.shadowBlur=0;g.fillStyle=h.ty?'#ffe9a0':'#c99a66';g.beginPath();g.ellipse(cx,by+r*.35,r*.6,r*.5,0,0,6.283);g.fill();
  g.fillStyle='#fff';if(h.hit){g.strokeStyle='#222';g.lineWidth=2.5;g.beginPath();for(const s of[-1,1]){g.moveTo(cx+s*r*.5-5,by-r*.4-5);g.lineTo(cx+s*r*.5+5,by-r*.4+5);g.moveTo(cx+s*r*.5+5,by-r*.4-5);g.lineTo(cx+s*r*.5-5,by-r*.4+5)}g.stroke()}else{g.beginPath();g.arc(cx-r*.38,by-r*.35,r*.2,0,6.283);g.arc(cx+r*.38,by-r*.35,r*.2,0,6.283);g.fill();g.fillStyle='#111';g.beginPath();g.arc(cx-r*.38,by-r*.32,r*.09,0,6.283);g.arc(cx+r*.38,by-r*.32,r*.09,0,6.283);g.fill()}
  g.fillStyle='#ff8fa3';g.beginPath();g.ellipse(cx,by+r*.05,r*.2,r*.14,0,0,6.283);g.fill();g.fillStyle='#fff';g.fillRect(cx-r*.15,by+r*.3,r*.13,r*.2);g.fillRect(cx+r*.02,by+r*.3,r*.13,r*.2)}
 g.restore()}
function draw(){
 const L=lay(),live=state!='title';
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#66c46a');gr.addColorStop(1,'#2f8a4a');g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.fillStyle='rgba(255,255,255,.05)';for(let y=0;y<H;y+=60)g.fillRect(0,y,W,30);
 for(let i=0;i<L.n;i++){const[x,y]=hp(i,L),rx=L.cell*.38,ry=L.cell*.14;g.fillStyle='#4a2f1a';g.beginPath();g.ellipse(x,y,rx,ry,0,0,6.283);g.fill();g.fillStyle='#2a170b';g.beginPath();g.ellipse(x,y+2,rx*.85,ry*.7,0,0,6.283);g.fill();
  let h=live?hs[i]:null,p=0;if(live){p=prog(h)}else{const s=Math.sin(T*1.6+i*1.9);if(s>.2){p=Math.min(1,(s-.2)*4);h={ty:i%7==3?2:i%5==1?1:0,hit:0}}}
  if(p>0&&h)mole(x,y,L,p,h);
  g.fillStyle='#7a5230';g.beginPath();g.ellipse(x,y,rx,ry,0,0,3.1416);g.fill();g.fillStyle='#9a6a3e';g.beginPath();g.ellipse(x,y-1,rx*.96,ry*.7,0,0,3.1416);g.fill()}
 drawParts();
 if(live){for(const f of fts){g.globalAlpha=Math.min(1,f.l*2);txt(f.s,f.x,f.y,Math.min(L.cell*.22,28),f.c);g.globalAlpha=1}
  if(hm.t<.2){g.save();g.translate(hm.x,hm.y);g.rotate(-.9+hm.t/.2*1.3);g.fillStyle='#8a5a2b';g.fillRect(-4,-L.cell*.2,8,L.cell*.55);g.fillStyle='#bbb';g.fillRect(-L.cell*.2,-L.cell*.32,L.cell*.4,L.cell*.2);g.restore()}
  g.fillStyle='#5a3a1c';g.fillRect(0,0,W,70);g.fillStyle='#7a5230';g.fillRect(0,66,W,4);
  txt('Skor: '+score,14,26,Math.min(W*.07,30),'#fff','left');txt(streak>1?'Seri x'+streak:'',14,52,16,COL,'left');
  txt(Math.ceil(tl)+' sn',W-70,26,Math.min(W*.07,30),tl<10?'#ff6a6a':'#fff','right');g.fillStyle='rgba(0,0,0,.4)';g.fillRect(14,60,W-28,5);g.fillStyle=tl<10?'#ff6a6a':COL;g.fillRect(14,60,(W-28)*Math.min(1,tl/60),5);icon()}
}
</script></body></html>
