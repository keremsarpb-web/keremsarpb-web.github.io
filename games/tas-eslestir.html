<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Taş Eşleştir · KSB Games</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0f3b2e;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}canvas{display:block;width:100vw;height:100vh;touch-action:none}</style></head><body><canvas id="c"></canvas><script>
const KEY='ksb-tas-eslestir-best';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,S,best=0,muted=false,AC,last=0,shake=0,parts=[],T=0;
try{best=+localStorage.getItem(KEY)||0}catch(e){}
const sv=()=>{try{localStorage.setItem(KEY,best)}catch(e){}};
const R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b));
function rs(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);S=Math.min(W,H);if(window.lay)lay()}
addEventListener('resize',rs);
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function tx(s,x,y,z,col,al,wt){ctx.font=(wt||800)+' '+z+'px system-ui,"Segoe UI",sans-serif';ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y)}
function snd(f,d,ty,v,f2){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function burst(x,y,c,n,sp){for(let i=0;i<(n||12);i++){const a=R(0,6.28),s=R(.3,1)*(sp||220);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:R(.4,.8),m:.8,c})}}
function dparts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,3,0,6.3);ctx.fill()}ctx.globalAlpha=1}
function spk(){const x=W-22,y=22;ctx.save();ctx.globalAlpha=.8;ctx.fillStyle='#fff';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-9,y-3);ctx.lineTo(x-4,y-3);ctx.lineTo(x+1,y-8);ctx.lineTo(x+1,y+8);ctx.lineTo(x-4,y+3);ctx.lineTo(x-9,y+3);ctx.fill();ctx.beginPath();if(muted){ctx.moveTo(x+5,y-5);ctx.lineTo(x+13,y+5);ctx.moveTo(x+13,y-5);ctx.lineTo(x+5,y+5)}else{ctx.arc(x+2,y,6,-1,1);ctx.moveTo(x+2+Math.cos(-1)*11,y+Math.sin(-1)*11);ctx.arc(x+2,y,11,-1,1)}ctx.stroke();ctx.restore()}
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;if(document.hidden)return;T+=dt;ctx.save();if(shake>0){ctx.translate(R(-shake,shake),R(-shake,shake));shake=Math.max(0,shake-dt*40)}frame(dt);dparts(dt);ctx.restore();spk()}
function pt(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}const[x,y]=pt(e);if(x>W-44&&y<44){muted=!muted;return}onDown(x,y)});
cv.addEventListener('pointermove',e=>{const[x,y]=pt(e);if(window.onMove)onMove(x,y)});
cv.addEventListener('pointerup',e=>{const[x,y]=pt(e);if(window.onUp)onUp(x,y)});
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.key==' ')e.preventDefault();if(e.key=='m'||e.key=='M'){muted=!muted;return}if(window.onKey)onKey(e)});
addEventListener('contextmenu',e=>e.preventDefault());
function big(name,cx,cy,col,glow){const ws=W<H?name.split(' '):[name],ml=Math.max(...ws.map(w=>w.length)),z=Math.min(W*.9/(ml*.76),H*.13,140);ctx.save();ctx.shadowColor=glow||col;ctx.shadowBlur=z*.5;ws.forEach((w,i)=>tx(w,cx,cy+(i-(ws.length-1)/2)*z*1.12,z,col));ctx.restore();return z}
function tap(y,t,col){ctx.globalAlpha=.65+.35*Math.sin(T*4);tx(t||'Başlamak için dokun / tıkla',W/2,y,Math.max(16,Math.min(S*.05,30)),col);ctx.globalAlpha=1}
function over(t,l1,l2,col,rt){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);const z=Math.min(W*.11,70);tx(t,W/2,H*.34,z,col);tx(l1,W/2,H*.34+z*1.2,z*.5);if(l2)tx(l2,W/2,H*.34+z*1.9,z*.42,'#cbd');tap(H*.34+z*3.1,rt||'Tekrar için dokun / tıkla')}
function btn(b,label,col){rr(b.x,b.y,b.w,b.h,10);ctx.fillStyle=col||'#334';ctx.fill();ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=1.5;ctx.stroke();tx(label,b.x+b.w/2,b.y+b.h/2+1,Math.min(b.h*.45,18))}
const hit=(b,x,y)=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;
/* ---- oyun ---- */
const NS=18,SC=['#d6336c','#1971c2'];
let st='title',tiles=[],selT=null,score=0,time=0,shuf=3,ux=20,uy=26,ox=0,oy=80,win=false,msg='',msgT=0;
const NB={x:8,y:8,w:88,h:34},SB={x:104,y:8,w:112,h:34};
const ft=Array.from({length:14},()=>({x:Math.random(),y:Math.random(),v:R(.02,.05),s:RI(0,NS),z:R(.8,1.5)}));
function lay(){ux=Math.min((W-16)/16,(H-170)/13,56);uy=ux*1.3;ox=(W-16*ux)/2;oy=62+(H-62-10*uy-20)/2}
function build(){tiles=[];for(let x=0;x<16;x+=2)for(let y=0;y<10;y+=2)tiles.push({x,y,l:0,s:0});for(let x=2;x<14;x+=2)for(let y=2;y<8;y+=2)tiles.push({x,y,l:1,s:0});for(let x=4;x<12;x+=2)tiles.push({x,y:4,l:2,s:0})}
function free(t,set){for(const u of set){if(u==t)continue;if(u.l>t.l&&Math.abs(u.x-t.x)<2&&Math.abs(u.y-t.y)<2)return false}let L=false,Rg=false;for(const u of set){if(u==t||u.l!=t.l||Math.abs(u.y-t.y)>=2)continue;if(u.x==t.x-2)L=true;if(u.x==t.x+2)Rg=true}return !(L&&Rg)}
function deal(list){for(let a=0;a<80;a++){let rem=list.slice(),ok=true;while(rem.length){const fr=rem.filter(t=>free(t,rem));if(fr.length<2){ok=false;break}const p=fr.splice(RI(0,fr.length),1)[0],q=fr[RI(0,fr.length)],s=RI(0,NS);p.s=q.s=s;rem=rem.filter(t=>t!=p&&t!=q)}if(ok)return true}return false}
function start(){do build();while(!deal(tiles));score=0;time=0;shuf=3;selT=null;st='play';win=false;msgT=0}
function toast(m){msg=m;msgT=1.6}
function moves(){const al=tiles.filter(t=>t.alive!==false),f=al.filter(t=>free(t,al)),c={};for(const t of f){if(c[t.s])return true;c[t.s]=1}return false}
function shuffle(auto){const al=tiles.filter(t=>t.alive!==false);if(al.length<2)return;if(!auto){if(shuf<=0)return;shuf--}deal(al);selT=null;snd(300,.2,'sawtooth',.08,600);toast(auto?'Hamle kalmadı: karıştırıldı':'Karıştırıldı')}
function pos(t){return[ox+t.x*ux-t.l*ux*.3,oy+t.y*uy-t.l*ux*.3]}
function onDown(x,y){if(st!='play'){start();return}if(hit(NB,x,y)){start();return}if(hit(SB,x,y)){shuffle(false);return}
 const al=tiles.filter(t=>t.alive!==false).sort((a,b)=>b.l-a.l||b.y-a.y||b.x-a.x);
 for(const t of al){const[px,py]=pos(t);if(x>=px&&x<=px+2*ux&&y>=py&&y<=py+2*uy){if(!free(t,al)){snd(140,.1,'square',.08);shake=3;return}
  if(selT==t){selT=null;return}
  if(selT&&selT.s==t.s){const a=selT;a.alive=t.alive=false;selT=null;score+=20;[a,t].forEach(u=>{const p=pos(u);burst(p[0]+ux,p[1]+uy,SC[u.s/9|0],12,240)});snd(600,.12,'triangle');snd(800,.18,'triangle',.1);
   const left=tiles.filter(u=>u.alive!==false);if(!left.length){score+=Math.max(0,600-Math.floor(time)*3);if(score>best){best=score;sv()}st='over';win=true;burst(W/2,H/2,'#ffd43b',50,350);snd(880,.4,'triangle')}
   else{if(score>best){best=score;sv()}if(!moves()){if(shuf>0)shuffle(true);else{st='over';win=false;snd(160,.6,'sawtooth',.12,60)}}}}
  else{selT=t;snd(400,.06,'sine',.08)}return}}
 }
function onKey(e){if(st!='play'&&(e.key=='Enter'||e.key==' '))start();else if(st=='play'&&(e.key=='s'||e.key=='S'))shuffle(false)}
function sym(i,cx,cy,s){const sh=i%9;ctx.save();ctx.translate(cx,cy);ctx.fillStyle=ctx.strokeStyle=SC[i/9|0];ctx.lineWidth=s*.12;ctx.lineJoin='round';ctx.beginPath();
 if(sh==0)ctx.arc(0,0,s*.8,0,6.3);else if(sh==1)ctx.rect(-s*.7,-s*.7,s*1.4,s*1.4);else if(sh==2){ctx.moveTo(0,-s*.9);ctx.lineTo(s*.85,s*.7);ctx.lineTo(-s*.85,s*.7);ctx.closePath()}else if(sh==3){ctx.moveTo(0,-s);ctx.lineTo(s*.75,0);ctx.lineTo(0,s);ctx.lineTo(-s*.75,0);ctx.closePath()}
 else if(sh==4){for(let k=0;k<10;k++){const a=k*.6283-1.5708,rd=k%2?s*.4:s;k?ctx.lineTo(Math.cos(a)*rd,Math.sin(a)*rd):ctx.moveTo(Math.cos(a)*rd,Math.sin(a)*rd)}ctx.closePath()}
 else if(sh==5){ctx.rect(-s*.25,-s*.9,s*.5,s*1.8);ctx.rect(-s*.9,-s*.25,s*1.8,s*.5)}
 else if(sh==6){ctx.moveTo(0,s*.8);ctx.bezierCurveTo(-s*1.3,-s*.1,-s*.7,-s,0,-s*.35);ctx.bezierCurveTo(s*.7,-s,s*1.3,-s*.1,0,s*.8)}
 else if(sh==7){ctx.arc(0,0,s*.85,.7,5.6);ctx.arc(s*.3,0,s*.6,5.2,1.1,true)}
 else{for(let k=0;k<6;k++){const a=k*1.0472;k?ctx.lineTo(Math.cos(a)*s*.9,Math.sin(a)*s*.9):ctx.moveTo(Math.cos(a)*s*.9,Math.sin(a)*s*.9)}ctx.closePath()}
 ctx.fill();if(sh==8){ctx.fillStyle='#f6efe0';ctx.beginPath();ctx.arc(0,0,s*.35,0,6.3);ctx.fill()}ctx.restore()}
function tile(t,al){const[x,y]=pos(t),w=2*ux,h=2*uy,sel=selT==t,fr=al?free(t,al):true;rr(x+ux*.2,y+ux*.25,w,h,ux*.3);ctx.fillStyle='#1b6b4f';ctx.fill();rr(x,y,w,h,ux*.3);ctx.fillStyle=sel?'#ffe28a':fr?'#f6efe0':'#c9c2ae';ctx.fill();ctx.lineWidth=sel?3:1.5;ctx.strokeStyle=sel?'#ff9f1c':'rgba(0,0,0,.25)';ctx.stroke();sym(t.s,x+ux,y+uy,ux*.75)}
function frame(dt){const gr=ctx.createRadialGradient(W/2,H/2,50,W/2,H/2,Math.max(W,H)*.7);gr.addColorStop(0,'#1c6b4c');gr.addColorStop(1,'#0a2a20');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
 ctx.globalAlpha=.18;ft.forEach(f=>sym(f.s,f.x*W,((f.y+T*f.v)%1.3-.15)*H,28*f.z));ctx.globalAlpha=1;
 if(st=='title'){big('TAŞ EŞLEŞTİR',W/2,H*.3,'#ffe28a','#ff9f1c');const s=Math.min(W*.13,64);for(let i=0;i<4;i++){const x=W/2+(i-1.5)*(s*1.25)-s*.5,y=H*.5-s*.65+Math.sin(T*2+i)*5;rr(x,y,s,s*1.3,s*.15);ctx.fillStyle='#f6efe0';ctx.fill();sym([2,13,4,6][i],x+s/2,y+s*.65,s*.36)}tap(H*.72);tx('En iyi puan: '+best,W/2,H*.8,Math.min(S*.04,22),'#a8d5c0');return}
 if(st=='play'){time+=dt;if(msgT>0)msgT-=dt}
 btn(NB,'Yeni oyun','#2a6b52');btn(SB,'Karıştır ('+shuf+')',shuf>0?'#2a6b52':'#33403b');
 tx('Puan '+score+'  ·  Süre '+Math.floor(time/60)+':'+String(Math.floor(time%60)).padStart(2,'0')+'  ·  En iyi '+best,W/2,56,Math.min(15,W*.04),'#d4ecdf');
 const al=tiles.filter(t=>t.alive!==false).sort((a,b)=>a.l-b.l||a.y-b.y||a.x-b.x);al.forEach(t=>tile(t,al));
 if(msgT>0){ctx.globalAlpha=Math.min(1,msgT*2);tx(msg,W/2,oy-6,Math.min(S*.045,22),'#ffe28a');ctx.globalAlpha=1}
 if(st=='over')over(win?'Tebrikler!':'Hamle kalmadı!','Puan: '+score,'Süre: '+Math.floor(time)+' sn  ·  En iyi: '+best,win?'#ffe28a':'#ff6b6b','Yeni oyun için dokun / tıkla')}
rs();requestAnimationFrame(loop);
</script></body></html>
