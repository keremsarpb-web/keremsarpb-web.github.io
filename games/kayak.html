<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kayak</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#cfe6f5;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}</style>
</head><body><canvas id="c"></canvas><script>
const BK='ksb-kayak-best';
'use strict';
const cv=document.getElementById('c'),g=cv.getContext('2d');let W=1,H=1,T=0;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth||1;H=innerHeight||1;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
let best=0;try{best=+localStorage.getItem(BK)||0}catch(e){}
function saveBest(s){if(s>best){best=s;try{localStorage.setItem(BK,String(s))}catch(e){}return true}return false}
let AC=null,muted=false;
function snd(f,d,t,v,sl){if(muted||!AC)return;try{const n=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(sl,n+d);a.gain.setValueAtTime(v||.12,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=='suspended')AC.resume()}
const keys={};let onDown=()=>{},onMove=()=>{},onUp=()=>{},onKey=()=>{};
const pp=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{initAudio();const[x,y]=pp(e);if(x>W-46&&y<46){muted=!muted;return}try{cv.setPointerCapture(e.pointerId)}catch(_){}onDown(x,y)});
cv.addEventListener('pointermove',e=>{const[x,y]=pp(e);onMove(x,y)});
cv.addEventListener('pointerup',e=>{const[x,y]=pp(e);onUp(x,y)});
cv.addEventListener('pointercancel',e=>{const[x,y]=pp(e);onUp(x,y)});
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')||e.key==' ')e.preventDefault();initAudio();if(e.key=='m'||e.key=='M'){muted=!muted;return}if(!keys[e.key])onKey(e.key);keys[e.key]=1});
addEventListener('keyup',e=>{keys[e.key]=0});
const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function tx(s,x,y,sz,c,al,w){g.font=(w||'700')+' '+Math.max(6,sz|0)+'px Fredoka,Nunito,system-ui,sans-serif';g.textAlign=al||'center';g.textBaseline='middle';g.fillStyle=c||'#fff';g.fillText(s,x,y)}
function spk(){g.save();g.globalAlpha=.85;g.fillStyle='#fff';const x=W-30,y=22;g.beginPath();g.moveTo(x-8,y-3);g.lineTo(x-4,y-3);g.lineTo(x+1,y-8);g.lineTo(x+1,y+8);g.lineTo(x-4,y+3);g.lineTo(x-8,y+3);g.fill();g.lineWidth=2;if(muted){g.strokeStyle='#f66';g.beginPath();g.moveTo(x+4,y-5);g.lineTo(x+12,y+5);g.moveTo(x+12,y-5);g.lineTo(x+4,y+5);g.stroke()}else{g.strokeStyle='#fff';g.beginPath();g.arc(x+1,y,6,-1,1);g.stroke()}g.restore()}
let S=1,OX=0,OY=0;function fit(a,b){S=Math.min(W/a,H/b);OX=(W-a*S)/2;OY=(H-b*S)/2}
const P2=(x,y)=>[(x-OX)/S,(y-OY)/S];
const PT=[];function burst(x,y,n,c,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=(.3+Math.random())*(sp||200);PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.5,c,r:2+Math.random()*3})}}
function pstep(dt){for(const p of PT){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt}for(let i=PT.length-1;i>=0;i--)if(PT[i].l<=0)PT.splice(i,1)}
function pdraw(){for(const p of PT){g.globalAlpha=cl(p.l*2,0,1);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,6.3);g.fill()}g.globalAlpha=1}
function ttl(n,sub){g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,W,H);g.save();g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=24;const fs=Math.min(W*.13,H*.11,110);tx(n,W/2,H*.3,fs,'#fff','center','800');g.shadowBlur=0;tx(sub,W/2,H*.3+fs*.8,Math.min(W*.05,H*.035,28),'#ffe08a','center','600');g.globalAlpha=.6+.4*Math.sin(T*4);tx('Başlamak için dokun / tıkla',W/2,H*.8,Math.min(W*.055,H*.04,30),'#fff');g.globalAlpha=1;if(best)tx('En iyi: '+best,W/2,H*.87,Math.min(W*.045,H*.03,22),'#ccc','center','600');g.restore()}
function ovr(a,b,c){g.fillStyle='rgba(0,0,0,.62)';g.fillRect(0,0,W,H);tx(a,W/2,H*.3,Math.min(W*.12,H*.09,90),'#fff','center','800');tx(b,W/2,H*.42,Math.min(W*.06,H*.04,34),'#ffe08a');if(c)tx(c,W/2,H*.5,Math.min(W*.05,H*.035,28),'#ccc','center','600');g.globalAlpha=.6+.4*Math.sin(T*4);tx('Tekrar için dokun / tıkla',W/2,H*.72,Math.min(W*.055,H*.04,30),'#fff');g.globalAlpha=1}
let last=performance.now(),UP=()=>{},DR=()=>{};
function loop(t){requestAnimationFrame(loop);const dt=cl((t-last)/1000,0,.033);last=t;if(document.hidden)return;T+=dt;UP(dt);DR();spk()}
document.addEventListener('visibilitychange',()=>{last=performance.now()});
requestAnimationFrame(loop);
const SY=190;let st='title',dist=0,sp=240,sx=200,vx=0,obs=[],ns=300,lives=3,inv=0,bonus=0,combo=0,steer=0,ptr=null,pops=[],shk=0,overT=0,tsec=0,gcool=0,newBest=false;
function reset(){dist=0;sp=240;sx=200;vx=0;obs=[];ns=300;lives=3;inv=0;bonus=0;combo=0;pops=[];tsec=0;gcool=0;PT.length=0;spawnTo(700)}
function start(){reset();st='play';newBest=false}
function spawnTo(lim){while(ns<dist+lim){const y=ns;
  for(let i=0;i<5;i++){const x=Math.random()<.5?rnd(-500,-5):rnd(405,900);obs.push({t:'d',x,y:y+rnd(0,80),s:rnd(.8,1.5)})}
  if(gcool<=0&&Math.random()<.22){const w=cl(130-dist/150,84,130),cx=rnd(20+w/2,380-w/2);obs.push({t:'g',x:cx,y,w,done:false});gcool=3;ns+=rnd(120,170)}
  else{gcool--;const n=1+(Math.random()<.5)+(dist>2000&&Math.random()<.4);for(let i=0;i<n;i++)obs.push({t:'t',x:rnd(15,385),y:y+rnd(0,40),s:rnd(.9,1.3)});ns+=rnd(90,150)-Math.min(30,dist/300)}}}
function crash(){lives--;inv=1.6;sp*=.4;combo=0;shk=12;burst(sx,SY,25,'#fff',260);burst(sx,SY,10,'#2a7a3a',200);snd(110,.35,'sawtooth',.2,40);if(lives<=0){st='over';overT=0;newBest=saveBest(score())}}
const score=()=>Math.floor(dist/10)+bonus;
UP=dt=>{pstep(dt);shk=Math.max(0,shk-dt*30);overT+=dt;for(const p of pops)p.t+=dt;pops=pops.filter(p=>p.t<1);
 if(st=='over')return;const demo=st=='title';tsec+=dt;
 let dir=0;if(demo)dir=Math.sin(tsec*1.3);else{dir=(keys.ArrowLeft||keys.a?-1:0)+(keys.ArrowRight||keys.d?1:0);if(ptr!==null)dir=cl((ptr-sx)/40,-1,1)}
 const tgt=Math.min(600,240+tsec*5);sp+=(tgt-sp)*Math.min(1,dt*(sp<tgt?.6:1.5));const lat=200+sp*.35;vx+=(dir*lat-vx)*Math.min(1,dt*5);sx+=vx*dt;if(sx<14){sx=14;vx=0}if(sx>386){sx=386;vx=0}
 dist+=sp*dt;inv=Math.max(0,inv-dt);spawnTo(700);
 if(Math.random()<dt*20&&sp>100){PT.push({x:sx-vx*.02,y:SY+12,vx:rnd(-30,30)-vx*.2,vy:-sp*.25+rnd(-20,20),l:.4,c:'#fff',r:2.5})}
 if(demo)return;
 for(const o of obs){const sy=SY+o.y-dist;if(o.t=='t'&&inv<=0&&Math.abs(sy-SY)<16&&Math.abs(o.x-sx)<16*o.s){crash();break}
  if(o.t=='g'&&!o.done&&sy<=SY){o.done=true;if(Math.abs(sx-o.x)<o.w/2-6){combo++;const b=50*Math.min(combo,5);bonus+=b;pops.push({s:'+'+b,x:sx,y:SY-20,t:0});snd(500+combo*80,.15,'triangle',.15);burst(o.x,SY,12,'#ffd23f',150)}else{combo=0;pops.push({s:'Kaçtı!',x:sx,y:SY-20,t:0});sp*=.8;snd(150,.2,'square',.1)}}}
 obs=obs.filter(o=>o.y>dist-80)};
onDown=(x,y)=>{if(st=='title'){start();ptr=P2(x,y)[0];return}if(st=='over'){if(overT>.5)start();return}ptr=P2(x,y)[0]};
onMove=(x,y)=>{if(ptr!==null)ptr=P2(x,y)[0]};onUp=()=>{ptr=null};
onKey=k=>{if(st=='title')start();else if(st=='over'&&overT>.5)start()};
function tree(x,y,s){g.fillStyle='#0003';g.beginPath();g.ellipse(x+8*s,y+2,16*s,6*s,0,0,6.3);g.fill();g.fillStyle='#5a3a1a';g.fillRect(x-3*s,y-8*s,6*s,10*s);
 for(let i=0;i<3;i++){const w=(22-i*5)*s,yy=y-8*s-i*17*s;g.fillStyle='#1f6b34';g.beginPath();g.moveTo(x,yy-24*s);g.lineTo(x+w,yy);g.lineTo(x-w,yy);g.fill();g.fillStyle='#fff';g.beginPath();g.moveTo(x,yy-24*s);g.lineTo(x+w*.45,yy-11*s);g.lineTo(x-w*.45,yy-11*s);g.fill()}}
function flag(x,y,c){g.strokeStyle='#555';g.lineWidth=3;g.beginPath();g.moveTo(x,y+4);g.lineTo(x,y-46);g.stroke();g.fillStyle=c;g.beginPath();g.moveTo(x,y-46);g.lineTo(x+22+Math.sin(T*8+x)*3,y-38);g.lineTo(x,y-30);g.fill()}
function skier(){const a=cl(vx/500,-.6,.6);g.save();g.translate(sx,SY);if(inv>0&&Math.floor(T*15)%2)g.globalAlpha=.4;g.rotate(a);
 g.fillStyle='#0003';g.beginPath();g.ellipse(4,14,12,5,0,0,6.3);g.fill();g.strokeStyle='#c22';g.lineWidth=4;g.lineCap='round';g.beginPath();g.moveTo(-7,-14);g.lineTo(-7,22);g.moveTo(7,-14);g.lineTo(7,22);g.stroke();
 g.fillStyle='#2a6df4';g.beginPath();g.roundRect(-9,-8,18,22,6);g.fill();g.fillStyle='#ffcf9e';g.beginPath();g.arc(0,-12,7,0,6.3);g.fill();g.fillStyle='#e33';g.beginPath();g.arc(0,-14,7,3.4,6.0);g.fill();g.strokeStyle='#444';g.lineWidth=2;g.beginPath();g.moveTo(-10,0);g.lineTo(-16,14);g.moveTo(10,0);g.lineTo(16,14);g.stroke();g.restore()}
DR=()=>{g.fillStyle='#eef6ff';g.fillRect(0,0,W,H);fit(400,700);g.save();g.translate(OX+(shk?rnd(-shk,shk):0),OY);g.scale(S,S);
 g.strokeStyle='#cfe0f2';g.lineWidth=3;for(let i=-20;i<40;i++){const y=((i*70-dist*.9)%700+700)%700;g.beginPath();g.moveTo(-900,y);g.quadraticCurveTo(0,y+14,200,y);g.quadraticCurveTo(400,y-14,1300,y);g.stroke()}
 g.fillStyle='#dbe9f7';g.fillRect(-900,0,900,700);g.fillRect(400,0,900,700);
 const L=[...obs].sort((a,b)=>a.y-b.y);const sy=o=>SY+o.y-dist;
 for(const o of L){const y=sy(o);if(y<-80||y>800)continue;if(o.t=='g'){g.strokeStyle='rgba(255,210,60,.35)';g.lineWidth=2;g.setLineDash([6,6]);g.beginPath();g.moveTo(o.x-o.w/2,y);g.lineTo(o.x+o.w/2,y);g.stroke();g.setLineDash([]);flag(o.x-o.w/2,y,'#e33');flag(o.x+o.w/2,y,'#2a7df4')}}
 pdraw();let drawn=false;for(const o of L){const y=sy(o);if(!drawn&&y>SY){skier();drawn=true}if(y<-80||y>800)continue;if(o.t!='g')tree(o.x,y,o.s)}if(!drawn)skier();
 for(const p of pops){g.globalAlpha=1-p.t;tx(p.s,p.x,p.y-p.t*50,26,'#e8a000','center','800')}g.globalAlpha=1;
 if(st=='play'){tx(score()+' puan',20,30,26,'#123','left','800');tx(Math.floor(dist/10)+' m · '+Math.floor(sp/6)+' km/s'.replace('km/s','km/sa'),20,58,15,'#456','left','600');for(let i=0;i<3;i++){g.fillStyle=i<lives?'#e33':'#0002';g.beginPath();g.arc(330+i*20,30,7,0,6.3);g.fill()}if(combo>1)tx('Seri x'+Math.min(combo,5),200,640,22,'#e8a000');if(tsec<4)tx('Parmağını koyduğun yöne kay',200,660,16,'#345','center','600')}
 g.restore();if(st=='title'){g.fillStyle='rgba(20,50,90,.3)';g.fillRect(0,0,W,H);ttl('Kayak','Ağaçlara çarpma, bayrakların arasından geç')}
 if(st=='over')ovr('DÜŞTÜN!',score()+' puan · '+Math.floor(dist/10)+' m',newBest?'Yeni rekor!':'En iyi: '+best)};
reset();

</script></body></html>
