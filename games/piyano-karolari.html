<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Piyano Karoları — KSB Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0d1028;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;left:0;top:0;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const ID='piyano-karolari',FONT='"Playfair Display",Georgia,serif';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,colW=0,offX=0,LW=0,TH=0,dust=[];
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){}return null;}
let best=+ls('ksb-'+ID+'-best')||0,muted=ls('ksb-'+ID+'-mute')==='1';
const rnd=(a,b)=>a+Math.random()*(b-a);
// ---------- audio ----------
let AC=null;
function initAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function piano(m,vol){
  if(!AC||muted)return;const f=440*Math.pow(2,(m-69)/12),t=AC.currentTime,g=AC.createGain(),lp=AC.createBiquadFilter();
  lp.type='lowpass';lp.frequency.setValueAtTime(Math.min(12000,f*8),t);lp.frequency.exponentialRampToValueAtTime(Math.max(300,f*1.5),t+1.2);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(vol*.35,t+.3);g.gain.exponentialRampToValueAtTime(.001,t+1.6);
  [[1,'triangle',1],[2,'sine',.35],[3,'sine',.12],[1.003,'sine',.4]].forEach(([k,ty,a])=>{const o=AC.createOscillator(),og=AC.createGain();o.type=ty;o.frequency.value=f*k;og.gain.value=a;o.connect(og);og.connect(lp);o.start(t);o.stop(t+1.7);});
  lp.connect(g);g.connect(AC.destination);
}
function wrong(){if(!AC||muted)return;[40,41,46,47].forEach(m=>{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.9);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+1);});}
// Ode to Joy (Beethoven, public domain)
const MEL=[64,64,65,67,67,65,64,62,60,60,62,64,64,62,62, 64,64,65,67,67,65,64,62,60,60,62,64,62,60,60,
  62,62,64,60,62,64,65,64,60,62,64,65,64,62,60,62,55, 64,64,65,67,67,65,64,62,60,60,62,64,62,60,60];
function toggleMute(){muted=!muted;ls('ksb-'+ID+'-mute',muted?'1':'0');}
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  colW=Math.min(W,H*.62,560);offX=(W-colW)/2;LW=colW/4;TH=H/4;
  dust=[];for(let i=0;i<70;i++)dust.push({x:Math.random(),y:Math.random(),s:rnd(.6,2.2),v:rnd(.01,.04),p:Math.random()*6});
}
addEventListener('resize',resize);resize();
// ---------- state ----------
let state='title',paused=false,t=0,scr=0,spd=0,hits=0,next=0,shake=0,overT=0,newBest=false,failRow=-1,failLane=-1,failT=0,scrollTarget=null,started=false;
let rows=[],rings=[],notes=[];
function laneFor(prev){let l=(Math.random()*4)|0;if(l===prev&&Math.random()<.6)l=(l+1+((Math.random()*3)|0))%4;return l;}
function ensureRows(){while(rows.length<Math.ceil(scr)+8){const p=rows.length?rows[rows.length-1].lane:-1;rows.push({lane:laneFor(p),hit:false,ht:0});}}
function rowBottom(k){return H-(k-scr)*TH-TH*.6;}
function reset(){rows=[];scr=0;spd=0;hits=0;next=0;failRow=-1;failLane=-1;failT=0;scrollTarget=null;started=false;rings=[];notes=[];newBest=false;ensureRows();}
reset();
function tap(lane){
  if(state!=='play'||paused||failRow>=0)return;
  const r=rows[next];if(!r)return;
  if(rowBottom(next)<TH*.25)return;
  if(r.lane===lane){
    r.hit=true;r.ht=t;hits++;
    const m=MEL[(hits-1)%MEL.length]+12*Math.min(1,Math.floor((hits-1)/MEL.length));piano(m,.28);
    if(hits%2===1)piano(m%12===2||m%12===5||m%12===7?43:48,.14);
    const x=offX+lane*LW+LW/2,y=rowBottom(next)-TH/2;rings.push({x,y,l:.5});
    notes.push({x,y,vx:rnd(-30,30),l:1.2,s:['♪','♫','♩'][(Math.random()*3)|0]});
    next++;if(!started){started=true;spd=2.2;}
    spd=Math.min(9,2.2+hits*.035);shake=2;
  }else fail(next,lane);
}
function fail(row,lane){
  failRow=row;failLane=lane;failT=0;shake=14;wrong();state='over';overT=0;
  if(rowBottom(row)>H-TH*.1)scrollTarget=row+.5;
  if(hits>best){best=hits;newBest=true;ls('ksb-'+ID+'-best',best);}
}
function start(){reset();state='play';}
function laneAt(x){const l=Math.floor((x-offX)/LW);return l>=0&&l<4?l:-1;}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();initAudio();const x=e.clientX,y=e.clientY;
  if(x>W-56&&y<56){toggleMute();return;}
  if(state==='title'){start();const l=laneAt(x);if(l>=0&&l===rows[0].lane)tap(l);return;}
  if(state==='over'){if(overT>.9)start();return;}
  if(paused){paused=false;return;}
  const l=laneAt(x);if(l>=0)tap(l);
});
const KEYS={KeyD:0,KeyF:1,KeyJ:2,KeyK:3};
addEventListener('keydown',e=>{
  const k=e.code;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k))e.preventDefault();
  if(k==='KeyM'){initAudio();toggleMute();return;}
  if(e.repeat)return;initAudio();
  if(k==='Space'||k==='Enter'){if(state==='title'||(state==='over'&&overT>.9))start();else if(paused)paused=false;return;}
  if(k in KEYS){if(state==='title'){start();}if(paused){paused=false;return;}tap(KEYS[k]);}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='play')paused=true;if(AC)AC.suspend();}else if(AC&&AC.state==='suspended')AC.resume();});
// ---------- update ----------
function update(dt){
  t+=dt;shake=Math.max(0,shake-dt*40);
  for(const d of dust){d.y-=d.v*dt;if(d.y<0)d.y+=1;}
  for(const r of rings)r.l-=dt;rings=rings.filter(r=>r.l>0);
  for(const n of notes){n.y-=70*dt;n.x+=n.vx*dt;n.l-=dt;}notes=notes.filter(n=>n.l>0);
  if(state==='title'){scr+=1.3*dt;ensureRows();
    while(next<rows.length&&rowBottom(next)>H*.72){rows[next].hit=true;rows[next].ht=t;rings.push({x:offX+rows[next].lane*LW+LW/2,y:rowBottom(next)-TH/2,l:.5});next++;}
    return;}
  if(state==='over'){overT+=dt;failT+=dt;if(scrollTarget!==null)scr+=(scrollTarget-scr)*Math.min(1,dt*8);return;}
  if(paused)return;
  if(started){scr+=spd*dt;ensureRows();if(rowBottom(next)>H+TH*.35)fail(next,-1);}
}
// ---------- draw ----------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function text(s,x,y,size,col,align,wt,glow){ctx.font=`${wt||900} ${size}px ${FONT}`;ctx.textAlign=align||'center';ctx.textBaseline='middle';if(glow){ctx.shadowColor=glow;ctx.shadowBlur=size*.35;}ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.shadowBlur=0;}
function fit(s,size,maxW,wt){ctx.font=`${wt||900} ${size}px ${FONT}`;const w=ctx.measureText(s).width;return w>maxW?size*maxW/w:size;}
function drawBoard(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0d1028');g.addColorStop(1,'#241a4a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const d of dust){ctx.globalAlpha=.25+.35*Math.abs(Math.sin(t+d.p));ctx.fillStyle='#e8c872';ctx.beginPath();ctx.arc(d.x*W,d.y*H,d.s,0,7);ctx.fill();}ctx.globalAlpha=1;
  const lg=ctx.createLinearGradient(0,0,0,H);lg.addColorStop(0,'#e9e3d6');lg.addColorStop(1,'#fbf8f1');ctx.fillStyle=lg;ctx.fillRect(offX,0,colW,H);
  ctx.fillStyle='rgba(30,30,60,.12)';for(let i=1;i<4;i++)ctx.fillRect(offX+i*LW-.5,0,1,H);
  ctx.fillStyle='rgba(232,200,114,.25)';ctx.fillRect(offX,H-TH*.6,colW,2);
  const lo=Math.max(0,Math.floor(scr)-3);
  for(let k=lo;k<rows.length;k++){
    const r=rows[k],b=rowBottom(k),y=b-TH;if(b<0)break;if(y>H)continue;
    const x=offX+r.lane*LW,pad=1.5;
    if(r.hit){const a=Math.max(0,1-(t-r.ht)*2.5);ctx.fillStyle=`rgba(120,140,200,${.18+.25*a})`;ctx.fillRect(x+pad,y+pad,LW-pad*2,TH-pad*2);
      if(a>0){ctx.fillStyle=`rgba(232,200,114,${a*.6})`;ctx.fillRect(x+pad,y+pad,LW-pad*2,TH-pad*2);}continue;}
    const missed=state==='over'&&k===failRow&&failLane<0,blink=missed&&Math.floor(failT*6)%2===0;
    const tg=ctx.createLinearGradient(0,y,0,y+TH);tg.addColorStop(0,blink?'#ff5a6a':'#2b2b3d');tg.addColorStop(1,blink?'#b01030':'#07070c');
    ctx.fillStyle=tg;rr(x+pad,y+pad,LW-pad*2,TH-pad*2,6);ctx.fill();
    ctx.fillStyle='rgba(232,200,114,.85)';ctx.fillRect(x+LW*.2,y+pad+6,LW*.6,2);
    ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(x+pad+4,y+pad+4,LW*.18,TH-pad*2-8);
    if(k===0&&!started&&state!=='over'){text('BAŞLA',x+LW/2,y+TH/2,Math.min(LW*.24,26),'#e8c872','center',700);}
  }
  if(state==='over'&&failLane>=0&&Math.floor(failT*6)%2===0){const b=rowBottom(failRow);ctx.fillStyle='rgba(230,40,60,.85)';ctx.fillRect(offX+failLane*LW+1.5,b-TH+1.5,LW-3,TH-3);}
  for(const r of rings){const k=1-r.l/.5;ctx.strokeStyle=`rgba(232,200,114,${r.l*2})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x,r.y,LW*.2+k*LW*.5,0,7);ctx.stroke();}
  for(const n of notes){ctx.globalAlpha=Math.min(1,n.l);text(n.s,n.x,n.y,LW*.3,'#c9a64a','center',700);}ctx.globalAlpha=1;
  if(offX>1){ctx.fillStyle='rgba(232,200,114,.6)';ctx.fillRect(offX-2,0,2,H);ctx.fillRect(offX+colW,0,2,H);}
}
function drawMute(){const s=34,x=W-s-10,y=10;ctx.save();ctx.fillStyle='rgba(13,16,40,.55)';rr(x,y,s,s,9);ctx.fill();ctx.fillStyle='#e8c872';ctx.strokeStyle='#e8c872';ctx.lineWidth=2.2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x+8,y+13);ctx.lineTo(x+13,y+13);ctx.lineTo(x+19,y+8);ctx.lineTo(x+19,y+26);ctx.lineTo(x+13,y+21);ctx.lineTo(x+8,y+21);ctx.closePath();ctx.fill();
  ctx.beginPath();if(muted){ctx.moveTo(x+22,y+13);ctx.lineTo(x+29,y+21);ctx.moveTo(x+29,y+13);ctx.lineTo(x+22,y+21);}else{ctx.arc(x+20,y+17,5,-.9,.9);ctx.moveTo(x+25.5,y+10);ctx.arc(x+20,y+17,9,-.9,.9);}ctx.stroke();ctx.restore();}
function panel(y0,h,a){const g=ctx.createLinearGradient(0,y0,0,y0+h);g.addColorStop(0,`rgba(13,16,40,0)`);g.addColorStop(.2,`rgba(13,16,40,${a})`);g.addColorStop(.8,`rgba(13,16,40,${a})`);g.addColorStop(1,`rgba(13,16,40,0)`);ctx.fillStyle=g;ctx.fillRect(0,y0,W,h);}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.save();
  if(shake>0)ctx.translate(rnd(-shake,shake)*.5,rnd(-shake,shake)*.5);
  drawBoard();ctx.restore();
  const m=Math.min(colW,H),cx=W/2,pulse=.55+.45*Math.sin(t*4);
  if(state==='title'){
    panel(H*.1,H*.5,.88);
    const s=fit('KAROLARI',Math.min(colW*.19,H*.1),Math.min(W*.9,colW*1.3)),ty=H*.28;
    text('PİYANO',cx,ty-s*.55,s,'#f6efe0','center',900,'rgba(232,200,114,.6)');
    text('KAROLARI',cx,ty+s*.55,s,'#e8c872','center',900,'rgba(232,200,114,.6)');
    ctx.fillStyle='#e8c872';ctx.fillRect(cx-s*1.2,ty+s*1.15,s*2.4,2);
    ctx.globalAlpha=pulse;text('Başlamak için dokun / tıkla',cx,ty+s*1.65,Math.max(16,m*.048),'#ffffff','center',700);ctx.globalAlpha=1;
    const h='Siyah karolara sırayla bas · Klavye: D F J K';text(h,cx,ty+s*1.65+Math.max(28,m*.075),fit(h,Math.max(12,m*.034),Math.min(W*.92,colW*1.2),700),'#cfc6e8','center',700);
    if(best>0)text('En iyi: '+best,cx,ty+s*1.65+Math.max(56,m*.15),Math.max(14,m*.04),'#e8c872','center',700);
  }else{
    text(String(hits),cx,Math.max(44,H*.08),Math.max(40,m*.13),'#d4372f','center',900,'rgba(255,255,255,.9)');
    if(started&&state==='play')text('Hız x'+(spd/2.2).toFixed(1),cx,Math.max(44,H*.08)+Math.max(34,m*.09),Math.max(12,m*.032),'#6a5a8a','center',700);
    if(state==='play'&&paused){ctx.fillStyle='rgba(13,16,40,.7)';ctx.fillRect(0,0,W,H);text('Duraklatıldı',cx,H*.42,Math.max(30,m*.09),'#f6efe0','center',900);ctx.globalAlpha=pulse;text('Devam etmek için dokun',cx,H*.52,Math.max(16,m*.045),'#e8c872','center',700);ctx.globalAlpha=1;}
    if(state==='over'&&overT>.6){
      const a=Math.min(.88,(overT-.6)*2);panel(H*.18,H*.56,a);ctx.globalAlpha=Math.min(1,(overT-.6)*3);
      text('OYUN BİTTİ',cx,H*.3,fit('OYUN BİTTİ',Math.min(colW*.16,H*.09),Math.min(W*.9,colW*1.2)),'#f6efe0','center',900);
      text(String(hits),cx,H*.42,Math.max(48,m*.17),'#e8c872','center',900,'rgba(232,200,114,.6)');
      text(newBest?'Yeni rekor!':'En iyi: '+best,cx,H*.52,Math.max(18,m*.05),newBest?'#e8c872':'#cfc6e8','center',700);
      if(overT>.9){ctx.globalAlpha=pulse;text('Tekrar için dokun / tıkla',cx,H*.62,Math.max(16,m*.048),'#ffffff','center',700);}
      ctx.globalAlpha=1;
    }
  }
  drawMute();
}
let last=performance.now();
function frame(now){let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;if(dt>.05)dt=.05;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
</body>
</html>
