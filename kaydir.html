<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kaydır – KSB Games</title>
<meta name="description" content="KSB Games oyunlarını kısa video gibi kaydırarak keşfet: yukarı kaydır, sıradaki oyun açılsın, dokun ve oyna.">
<link rel="canonical" href="https://keremsarpb-web.github.io/kaydir.html">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png">
<meta name="theme-color" content="#120c22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Kısa video akışı gibi: her ekran bir oyun, yukarı kaydırınca sıradaki. Yalnızca ekrandaki oyun yüklenir. */
  :root { --night:#120c22; --plum:#1d1435; --card:#241a40; --line:rgba(173,150,255,.18); --orange:#ff8a1f; --violet:#8b6cff; --ink:#f4f0ff; --soft:#b7acd6;
    --horror:#ff4d5e; --calm:#4fd6c3; --puzzle:#7fb2ff; --top:52px; color-scheme:dark; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--night); color:var(--ink); font-family:'Figtree',system-ui,sans-serif; overflow:hidden; overscroll-behavior:none; }
  button, a { font:inherit; color:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:3px solid var(--orange); outline-offset:2px; }

  .top { position:fixed; top:0; left:0; right:0; height:calc(var(--top) + env(safe-area-inset-top,0px)); padding:env(safe-area-inset-top,0px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));
    display:flex; align-items:center; gap:10px; background:rgba(18,12,34,.92); border-bottom:1px solid var(--line); z-index:20; backdrop-filter:blur(8px); }
  .back { display:flex; align-items:center; gap:8px; text-decoration:none; font-family:'Fredoka'; font-weight:700; font-size:18px; flex:none; }
  .back svg { width:30px; height:30px; }
  .back span { color:var(--orange); }
  .now { flex:1; min-width:0; text-align:center; font-family:'Fredoka'; font-weight:600; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .now small { color:var(--soft); font-family:'Figtree'; font-size:13px; margin-left:6px; }
  .tb { border:1px solid var(--line); background:rgba(255,255,255,.06); border-radius:10px; height:36px; min-width:38px; padding:0 10px; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-weight:700; font-size:14px; flex:none; }
  .tb:hover { border-color:var(--violet); }
  .tb svg { width:16px; height:16px; }
  #stop { background:var(--orange); color:#1c0d00; border-color:var(--orange); }
  #stop[hidden] { display:none; }

  .feed { position:fixed; left:0; right:0; bottom:0; top:calc(var(--top) + env(safe-area-inset-top,0px)); overflow-y:scroll; scroll-snap-type:y mandatory; scrollbar-width:none; overscroll-behavior:contain; }
  .feed::-webkit-scrollbar { display:none; }
  .feed.lock { overflow:hidden; }
  .slide { position:relative; height:100%; scroll-snap-align:start; scroll-snap-stop:always; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .bg { position:absolute; inset:-30px; background:var(--plum) center/cover no-repeat; filter:blur(28px) brightness(.45) saturate(1.3); transform:scale(1.1); }
  .frame { position:relative; height:100%; width:100%; background:#000; overflow:hidden; }
  .frame .clip { position:absolute; inset:0; overflow:hidden; }
  .frame img.cover { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:opacity .5s; }
  .frame iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
  .frame.loaded img.cover { opacity:0; }
  /* oynamadan önce oyunun üstünü kaplar: kaydırma akışa gider, dokununca oyun başlar */
  .tap { position:absolute; inset:0; border:0; padding:0; background:linear-gradient(180deg, rgba(10,6,20,.15) 0%, transparent 30%, transparent 45%, rgba(10,6,20,.88) 100%); display:block; width:100%; text-align:left; }
  .playbig { position:absolute; left:50%; top:64%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
  .playbig span { width:62px; height:62px; opacity:.92; border-radius:50%; background:var(--orange); display:grid; place-items:center; box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 0 8px rgba(255,138,31,.25); animation:pulse 2s ease-in-out infinite; }
  .playbig span svg { width:24px; height:24px; margin-left:4px; color:#1c0d00; }
  .tapnote { display:inline-flex; align-items:center; gap:6px; margin-left:8px; font-size:12px; font-weight:700; letter-spacing:.06em; color:#1c0d00; background:var(--orange); padding:4px 9px; border-radius:6px; vertical-align:top; }
  @keyframes pulse { 50% { box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 0 16px rgba(255,138,31,.08); } }
  .info { position:absolute; left:0; right:84px; bottom:0; padding:0 16px calc(18px + env(safe-area-inset-bottom,0px)); pointer-events:none; }
  .genre { display:inline-block; font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:4px 9px; border-radius:6px; background:rgba(18,12,34,.85); margin-bottom:8px; }
  .genre.korku { color:var(--horror); } .genre.aksiyon { color:var(--orange); } .genre.rahat { color:var(--calm); } .genre.bulmaca { color:var(--puzzle); }
  .info h2 { font-family:'Fredoka'; font-weight:700; font-size:32px; line-height:1.05; margin:0 0 6px; text-shadow:0 2px 12px rgba(0,0,0,.7); }
  .info p { margin:0 0 10px; color:#e3dcf5; font-size:15px; line-height:1.4; max-width:52ch; text-shadow:0 1px 6px rgba(0,0,0,.8); }
  .keys { display:flex; flex-wrap:wrap; gap:6px 12px; font-size:13px; color:var(--soft); }
  .keys kbd { font-family:ui-monospace,Consolas,monospace; font-size:12px; color:var(--ink); background:rgba(255,255,255,.1); border:1px solid var(--line); border-radius:5px; padding:1px 6px; margin-right:4px; }
  .side { position:absolute; right:10px; bottom:calc(22px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:14px; align-items:center; }
  .side button, .side a { border:0; background:none; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:12px; font-weight:700; text-decoration:none; text-shadow:0 1px 4px #000; padding:0; }
  .side .ic { width:48px; height:48px; border-radius:50%; background:rgba(18,12,34,.7); border:1px solid var(--line); display:grid; place-items:center; transition:transform .12s, background .2s; }
  .side button:hover .ic, .side a:hover .ic { background:rgba(139,108,255,.35); }
  .side button:active .ic { transform:scale(.9); }
  .side svg { width:22px; height:22px; }
  .like.on .ic { background:#ff3d6e; border-color:#ff3d6e; }
  .like.on .ic svg { animation:pop .35s; }
  @keyframes pop { 40% { transform:scale(1.35); } }
  .slide.playing .tap, .slide.playing .info, .slide.playing .side { display:none; }

  .end { flex-direction:column; gap:14px; text-align:center; padding:20px; background:radial-gradient(60% 40% at 50% 30%, rgba(139,108,255,.25), transparent 70%), var(--night); }
  .end h2 { font-family:'Fredoka'; font-size:34px; margin:0; }
  .end p { color:var(--soft); margin:0; }
  .end .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .btn { border:0; border-radius:14px; padding:13px 24px; background:var(--orange); color:#1c0d00; font-family:'Fredoka'; font-weight:700; font-size:18px; text-decoration:none; }
  .btn.alt { background:rgba(255,255,255,.08); color:var(--ink); border:1px solid var(--line); }

  .hint { position:fixed; left:50%; top:calc(var(--top) + 26% + env(safe-area-inset-top,0px)); transform:translateX(-50%); white-space:nowrap; background:rgba(18,12,34,.7); padding:10px 16px; border-radius:14px; z-index:15; pointer-events:none; display:flex; flex-direction:column; align-items:center; gap:6px;
    font-family:'Fredoka'; font-weight:600; font-size:16px; text-shadow:0 2px 8px #000; transition:opacity .5s; }
  .hint svg { width:34px; height:34px; animation:swipe 1.4s ease-in-out infinite; }
  @keyframes swipe { 0% { transform:translateY(18px); opacity:0; } 30% { opacity:1; } 100% { transform:translateY(-22px); opacity:0; } }
  .hint.off { opacity:0; }
  .toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,160%); background:var(--ink); color:var(--plum); font-weight:700; padding:10px 18px; border-radius:12px; transition:transform .25s; z-index:30; max-width:calc(100% - 32px); text-align:center; }
  .toast.on { transform:translate(-50%,0); }

  /* geniş ekran: oyun ortada bir çerçevede, yan düğmeler çerçevenin sağında */
  @media (min-width:760px) and (min-aspect-ratio:4/5) {
    .frame { height:calc(100% - 32px); width:auto; aspect-ratio:9/16; border-radius:18px; box-shadow:0 20px 60px rgba(0,0,0,.6); overflow:visible; }
    .frame.land { aspect-ratio:16/9; width:min(calc(100vw - 220px), calc((100dvh - var(--top) - 32px) * 16 / 9)); height:auto; }
    .frame .clip { border-radius:18px; }
    .side { right:auto; left:calc(100% + 16px); bottom:12px; }
    .info { right:0; }
  }
  @media (max-width:420px) { .info h2 { font-size:27px; } .info p { font-size:14px; } .now small { display:none; } .back b { display:none; } }
  @media (prefers-reduced-motion:reduce) { .playbig span, .hint svg { animation:none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="mark" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="30" fill="#241a40" stroke="#ff8a1f" stroke-width="3"/>
      <rect x="16" y="20" width="32" height="20" rx="8" fill="#ff8a1f"/>
      <path d="M22 30h7M25.5 26.5v7" stroke="#241a40" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="38" cy="27.5" r="2.2" fill="#241a40"/><circle cx="42" cy="32" r="2.2" fill="#241a40"/>
      <path d="M22 47h20" stroke="#8b6cff" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-dn" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z" fill="currentColor"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M14 5l6 6-6 6M20 11H10a6 6 0 0 0-6 6v2" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
    <symbol id="i-swipe" viewBox="0 0 24 24"><path d="M12 20V5m0 0l-5 5m5-5l5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div class="top">
  <a class="back" href="./" aria-label="KSB Games ana sayfa"><svg aria-hidden="true"><use href="#mark"/></svg><b>KSB <span>GAMES</span></b></a>
  <div class="now" id="now"></div>
  <button class="tb" id="stop" type="button" hidden><svg aria-hidden="true"><use href="#i-x"/></svg>Kaydırmaya dön</button>
  <button class="tb" id="prev" type="button" aria-label="Önceki oyun"><svg aria-hidden="true"><use href="#i-up"/></svg></button>
  <button class="tb" id="next" type="button" aria-label="Sonraki oyun"><svg aria-hidden="true"><use href="#i-dn"/></svg></button>
</div>
<main class="feed" id="feed" aria-label="Oyun akışı"></main>
<div class="hint" id="hint" aria-hidden="true"><svg><use href="#i-swipe"/></svg>Sıradaki oyun için yukarı kaydır</div>
<div class="toast" id="toast" role="status"></div>

<script src="games.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const use = id => `<svg aria-hidden="true"><use href="#${id}"/></svg>`;
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

// sıra: bağlantıdaki oyun (#id) en başta, gerisi her ziyarette karışık
const ALL = window.KSB_GAMES || [];
const startId = decodeURIComponent((location.hash || '').slice(1));
const rest = ALL.filter(g => g.id !== startId).sort(() => Math.random() - 0.5);
const LIST = (ALL.some(g => g.id === startId) ? [ALL.find(g => g.id === startId)] : []).concat(rest);
let likes = new Set(store.get('ksb-likes', []));

const feed = $('feed');
feed.innerHTML = LIST.map((g, i) => `
  <section class="slide" data-i="${i}" aria-label="${esc(g.title)}">
    <div class="bg" style="background-image:url('thumbs/${g.id}.jpg')"></div>
    <div class="frame${g.fit === 'land' ? ' land' : ''}">
      <div class="clip">
        <img class="cover" src="thumbs/${g.id}.jpg" alt="" ${i > 1 ? 'loading="lazy"' : ''}>
        <button class="tap" type="button" aria-label="${esc(g.title)} oyna">
        </button>
        <div class="info">
          <span class="genre ${g.genre}">${esc(g.label)}</span><span class="tapnote">▶ DOKUN VE OYNA</span>
          <h2>${esc(g.title)}</h2>
          <p>${esc(g.pitch)}</p>
          <div class="keys">${g.keys.map(([k, v]) => `<span><kbd>${esc(k)}</kbd>${esc(v)}</span>`).join('')}</div>
        </div>
      </div>
      <div class="side">
        <button class="like${likes.has(g.id) ? ' on' : ''}" type="button" data-like="${g.id}"><span class="ic">${use('i-heart')}</span><span>Beğen</span></button>
        <button type="button" data-share="${g.id}"><span class="ic">${use('i-share')}</span><span>Paylaş</span></button>
        <button type="button" data-full="${i}"><span class="ic">${use('i-full')}</span><span>Tam ekran</span></button>
        <a href="./#oyunlar"><span class="ic">${use('i-grid')}</span><span>Tümü</span></a>
      </div>
    </div>
  </section>`).join('') + `
  <section class="slide end" data-i="${LIST.length}">
    <h2>Hepsini gördün!</h2>
    <p>${LIST.length} oyunun hepsine baktın. Baştan kaydırabilir ya da listeden seçebilirsin.</p>
    <div class="row"><button class="btn" type="button" id="again">Baştan başla</button><a class="btn alt" href="./#oyunlar">Tüm oyunlar</a></div>
  </section>`;
const slides = [...feed.querySelectorAll('.slide')];

// --- yalnızca ekrandaki oyun yüklenir; kaydırınca önceki kapanır (sesi ve döngüsü durur)
let cur = -1, playing = false;
function unload(i) {
  const s = slides[i]; if (!s) return;
  const f = s.querySelector('iframe'); if (f) f.remove();
  s.querySelector('.frame').classList.remove('loaded'); s.classList.remove('playing');
}
function activate(i) {
  if (i === cur) return;
  if (cur >= 0) unload(cur);
  stopPlaying(true);
  cur = i;
  const g = LIST[i];
  $('now').innerHTML = g ? `${esc(g.title)}<small>${i + 1} / ${LIST.length}</small>` : 'Son';
  $('prev').disabled = i <= 0; $('next').disabled = i >= LIST.length;
  if (!g) return;
  try { history.replaceState(null, '', '#' + g.id); } catch (e) {}
  const fr = slides[i].querySelector('.frame'), clip = fr.querySelector('.clip');
  const f = document.createElement('iframe');
  f.title = g.title; f.src = `games/${g.id}.html`;
  f.allow = 'fullscreen; gamepad; autoplay; clipboard-write; screen-wake-lock';
  f.tabIndex = -1;
  f.onload = () => fr.classList.add('loaded');
  clip.insertBefore(f, clip.querySelector('.tap'));
}
function play(i) {
  const s = slides[i], f = s && s.querySelector('iframe'); if (!f) return;
  playing = true; s.classList.add('playing');
  $('stop').hidden = false; feed.classList.add('lock');
  f.tabIndex = 0;
  // ilk dokunuş oyunun kendisine de ulaşsın diye odak çerçeveye geçer
  try { f.focus(); f.contentWindow.focus(); } catch (e) {}
  hideHint();
}
function stopPlaying(quiet) {
  if (!playing) return;
  playing = false; $('stop').hidden = true; feed.classList.remove('lock');
  const s = slides[cur]; if (s) { s.classList.remove('playing'); const f = s.querySelector('iframe'); if (f) f.tabIndex = -1; }
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  if (!quiet) feed.focus();
}
const io = new IntersectionObserver(es => {
  for (const e of es) if (e.isIntersecting && e.intersectionRatio > 0.6) activate(+e.target.dataset.i);
}, { root: feed, threshold: [0.6] });
slides.forEach(s => io.observe(s));

function go(d) {
  const i = Math.max(0, Math.min(slides.length - 1, cur + d));
  if (playing) stopPlaying(true);
  slides[i].scrollIntoView({ behavior: 'smooth', block: 'start' });
  hideHint();
}
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
$('stop').onclick = () => stopPlaying();
addEventListener('keydown', e => {
  if (playing) { if (e.key === 'Escape') stopPlaying(); return; }
  if (['ArrowDown', 'PageDown', 'j', 'J', ' '].includes(e.key)) { e.preventDefault(); go(1); }
  else if (['ArrowUp', 'PageUp', 'k', 'K'].includes(e.key)) { e.preventDefault(); go(-1); }
  else if (e.key === 'Enter' && LIST[cur]) play(cur);
});
feed.addEventListener('click', e => {
  const t = e.target.closest('.tap'); if (t) { play(+t.closest('.slide').dataset.i); return; }
  const l = e.target.closest('[data-like]'); if (l) { toggleLike(l); return; }
  const sh = e.target.closest('[data-share]'); if (sh) { share(sh.dataset.share); return; }
  const fu = e.target.closest('[data-full]'); if (fu) { full(+fu.dataset.full); return; }
  if (e.target.id === 'again') slides[0].scrollIntoView({ behavior: 'smooth' });
});
function toggleLike(b) {
  const id = b.dataset.like;
  if (likes.has(id)) likes.delete(id); else { likes.add(id); toast('Beğendin ❤'); }
  b.classList.toggle('on', likes.has(id)); store.set('ksb-likes', [...likes]);
}
function share(id) {
  const g = LIST.find(x => x.id === id), url = location.origin + location.pathname + '#' + id;
  if (navigator.share) navigator.share({ title: g.title + ' – KSB Games', text: g.pitch, url }).catch(() => {});
  else if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast('Bağlantı kopyalandı'), () => toast(url));
  else toast(url);
}
function full(i) {
  const fr = slides[i].querySelector('.frame');
  play(i);
  if (fr.requestFullscreen) fr.requestFullscreen().catch(() => toast('Bu tarayıcıda tam ekran açılamadı.'));
}
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && playing) { const f = slides[cur].querySelector('iframe'); if (f) f.focus(); } });

let toastT = 0;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2400); }
function hideHint() { $('hint').classList.add('off'); store.set('ksb-feed-hint', 1); }
if (store.get('ksb-feed-hint', 0)) $('hint').classList.add('off');
feed.addEventListener('scroll', () => { if (feed.scrollTop > 40) hideHint(); }, { passive: true });
activate(0);
</script>
</body>
</html>
